/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);
}

:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>4</span></span> · две четверти<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div></div></section><section class=\"theory-topic\"><h3>Умножаем оба числа</h3><p class=\"math-definition\"><strong>Дополнительный множитель</strong> – число, на которое умножают числитель и знаменатель, чтобы получить равную дробь.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>3</span></span> = <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1 · 2</span><span>3 · 2</span></span> = <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>6</span></span></div></div></section><section class=\"theory-topic\"><h3>Разберём на примере</h3><p>На верхней полоске закрашена одна половина. Разделим каждый кусочек ещё на два. Во всей полоске теперь четыре части, а в закрашенной области две. Мы провели новые линии, золотая область осталась той же.</p><div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>2</span></span> · до новых линий<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>4</span></span> · после новых линий<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div></section>","anchor":"Во сколько раз стало больше частей всего, во столько же раз стало больше закрашенных частей.","anchorNote":"Столько же закрашено","tasks":[{"kind":"number","q":"Перепиши 1/3. В новой дроби под чертой стоит 6. Какое число нужно записать над чертой?","before":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","answer":2,"unit":"","see":"Начни с нижних чисел 3 и 6.","similar":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","algorithm":"Раздели 6 на 3.","retry":"Для нового числителя умножь старый числитель на тот же множитель.","steps":["6 : 3 = 2.","Числитель меняется во столько же раз: 1 · 2 = 2.","Получаем 2/6."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>3</span></span> · до деления кусочков<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>6</span></span> · после деления кусочков<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"number","q":"Перепиши 2/3. В новой дроби под чертой стоит 9. Какое число нужно записать над чертой?","before":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","answer":6,"unit":"","see":"Начни с нижних чисел 3 и 9.","similar":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","algorithm":"Раздели 9 на 3.","retry":"Для нового числителя умножь старый числитель на тот же множитель.","steps":["9 : 3 = 3.","Числитель меняется во столько же раз: 2 · 3 = 6.","Получаем 6/9."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>3</span></span> · исходная дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"number","q":"На какое число умножили знаменатель, чтобы перейти от 1/4 к 3/12?","before":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","answer":3,"unit":"","see":"Начни с нижних чисел 4 и 12.","similar":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","algorithm":"Раздели 12 на 4.","retry":"Для нового числителя умножь старый числитель на тот же множитель.","steps":["12 : 4 = 3.","Числитель меняется во столько же раз: 1 · 3 = 3.","Получаем 3/12."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>4</span></span> · исходная дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"choice","q":"Какая дробь со знаменателем 10 равна 2/5?","before":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","answer":"4/10","unit":"","see":"Начни с нижних чисел 5 и 10.","similar":"Чтобы записать 2/4 в восьмых долях, умножаем 4 на 2. Верхнее число тоже умножаем на 2. Получаем 4/8.","algorithm":"Раздели 10 на 5.","retry":"Для нового числителя умножь старый числитель на тот же множитель.","steps":["10 : 5 = 2.","Числитель меняется во столько же раз: 2 · 2 = 4.","Получаем 4/10."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>5</span></span> · исходная дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>","options":["4/10","2/10","5/10"]}]},{"name":"Что такое общий знаменатель","subtitle":"Одинаковое число под чертой","title":"Что значит «общий знаменатель»?","intro":"<section class=\"theory-topic\"><h3>Где у дроби знаменатель?</h3><p>Посмотри под черту. Число внизу показывает, на сколько одинаковых частей поделили целое. Это число называется знаменателем.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 2\"><span>1</span><span class=\"shared-denominator\">2</span></span> и <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 4\"><span>1</span><span class=\"shared-denominator\">4</span></span></div></div><p>У первой дроби знаменатель 2: целое поделили на две половинки. У второй знаменатель 4: целое поделили на четыре четвертинки.</p><details class=\"denominator-check\"><summary>Какой знаменатель у дроби <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 3 из 5\"><span>3</span><span>5</span></span>?</summary><p>5. Он стоит под чертой. Число 3 сверху показывает, сколько пятых взяли.</p></details></section><section class=\"theory-topic\"><h3>Как из одной половинки получаются две четвертинки</h3><p>Посмотри на две одинаковые шоколадки. На верхней закрашена левая половина.</p><div class=\"fraction-strip-row\"><p>Было 2 равные части. Закрашена 1.</p><div class=\"fraction-strip\" style=\"--parts:2\" aria-hidden=\"true\"><span class=\"filled\"></span><span class=\"empty\"></span></div></div><p>На нижней шоколадке каждую половинку разделили ещё пополам. Золотая область осталась такой же.</p><div class=\"fraction-strip-row\"><p>Стало 4 равные части. Закрашены 2.</p><div class=\"fraction-strip\" style=\"--parts:4\" aria-hidden=\"true\"><span class=\"filled\"></span><span class=\"filled\"></span><span class=\"empty\"></span><span class=\"empty\"></span></div></div><p>Одна половинка и две четвертинки – это одно и то же количество шоколада.</p><div class=\"theory-cell\"><span class=\"fraction-equation\"><span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 2\"><span>1</span><span>2</span></span> = <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 2 из 4\"><span>2</span><span>4</span></span></span></div></section><section class=\"theory-topic\"><h3>Что значит «общий»?</h3><p>Для сложения возьмём половинку и четвертинку. Половинку уже умеем записывать как две четвертинки. Вторая дробь уже записана в четвертинках.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">Было <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 2\"><span>1</span><span>2</span></span> и <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 4\"><span>1</span><span>4</span></span>.<br>Стало <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 2 из 4\"><span>2</span><span class=\"shared-denominator\">4</span></span> и <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 4\"><span>1</span><span class=\"shared-denominator\">4</span></span>.</div></div><p>Теперь у обеих дробей под чертой стоит 4. Это значит, что в обеих дробях мы считаем четвертинки. У первой их две, у второй одна.</p><p class=\"math-definition\"><strong>Общий знаменатель</strong> – одинаковый знаменатель, с которым записали обе дроби, сохранив их значения. Здесь это 4.</p><details class=\"denominator-check\"><summary>Какой общий знаменатель у дробей <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 6\"><span>1</span><span>6</span></span> и <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 5 из 6\"><span>5</span><span>6</span></span>?</summary><p>6. В обеих дробях под чертой стоит 6. Обе дроби записаны в шестых долях.</p></details></section><section class=\"theory-topic\"><h3>Что делать, когда низ уже одинаковый?</h3><p>Теперь складываем четвертинки. Две четвертинки плюс одна четвертинка дают три четвертинки. Сверху пишем 3. Снизу оставляем 4, потому что кусочки по-прежнему четвертинки.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 2 из 4\"><span>2</span><span>4</span></span> + <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 1 из 4\"><span>1</span><span>4</span></span> = <span class=\"math-fraction\" role=\"math\" aria-label=\"Дробь 3 из 4\"><span>3</span><span>4</span></span></div></div></section><section class=\"theory-topic\"><h3>Как выбрать нижнее число</h3><p>Возьмём <span class=\"math-fraction\"><span>1</span><span>2</span></span> и <span class=\"math-fraction\"><span>1</span><span>4</span></span>. Смотрим только на числа снизу. Это 2 и 4. Начинаем с большего числа, то есть с 4.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">4 : 2 = 2. Число 4 делится на 2 без остатка. Число 4 подходит для обеих дробей.</div></div></section><div class=\"definition-parts\"><ol><li><h4>Узнай, во сколько раз меняется низ первой дроби</h4><p>Было 2, хотим 4. Делим новое нижнее число на старое.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">4 : 2 = 2</div></div></li><li><h4>Умножь верх и низ первой дроби на 2</h4><p>Каждую половинку разделили на два кусочка. Всех кусочков стало вдвое больше, и закрашенных тоже стало вдвое больше.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>1</span><span>2</span></span> = <span class=\"math-fraction\"><span>1 · 2</span><span>2 · 2</span></span> = <span class=\"math-fraction\"><span>2</span><span>4</span></span></div></div></li><li><h4>Посмотри на вторую дробь</h4><p>Снизу уже стоит 4. Оставляем эту дробь как есть.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>1</span><span>4</span></span> = <span class=\"math-fraction\"><span>1</span><span>4</span></span></div></div></li><li><h4>Когда низ одинаковый, считай только верх</h4><p>Две четвертинки и одна четвертинка вместе дают три четвертинки. Под чертой остаётся 4.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>2</span><span>4</span></span> + <span class=\"math-fraction\"><span>1</span><span>4</span></span> = <span class=\"math-fraction\"><span>2 + 1</span><span>4</span></span> = <span class=\"math-fraction\"><span>3</span><span>4</span></span></div></div></li></ol></div>","anchor":"Общий знаменатель – одно и то же число под чертой у обеих дробей. Здесь обе дроби записаны в четвертинках.","anchorNote":"Меняем только одну дробь","tasks":[{"kind":"choice","q":"1/3 + 2/6. Выбери наименьший общий знаменатель.","before":"Для 1/2 и 1/8 подходит знаменатель 8. Число 8 делится на 2. Умножаем оба числа в первой дроби на 4 и получаем 4/8.","answer":6,"unit":"","see":"Посмотри только на нижние числа: 3 и 6. Начни проверку с 6.","similar":"Для 1/2 и 1/8 подходит знаменатель 8. Число 8 делится на 2. Умножаем оба числа в первой дроби на 4 и получаем 4/8.","algorithm":"Считай по 6: 6, 12, 18… Остановись, как только число разделится на 3. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. ","retry":"Проверь, делится ли выбранное нижнее число и на 3, и на 6.","steps":["Общий знаменатель 6: он делится на 3 и на 6.","Получаем 2/6 + 2/6. Для первой дроби множитель 2, для второй 1."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>3</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min- ие числа: 10 и 5. Начни проверку с 10.","similar":"Для 1/2 и 1/8 подходит знаменатель 8. Число 8 делится на 2. Умножаем оба числа в первой дроби на 4 и получаем 4/8.","algorithm":"Считай по 10: 10, 20, 30… Остановись, как только число разделится на 5. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. ","retry":"Проверь каждую дробь: на какое число ты умножила низ? На это же число нужно умножить верх.","steps":["Общий знаменатель 10: он делится на 10 и на 5.","Получаем 2/10 + 2/10. Для первой дроби множитель 1, для второй 2."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>10</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;p  style=\"border-bottom:1px solid currentColor\">1</span><span>2</span></span> и <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>6</span></span>. В одной половине три шестых. Вместе с ещё одной шестой получаем четыре шестых: <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">3</span><span>6</span></span> + <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>6</span></span> = <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">4</span><span>6</span></span>.</p><div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>2</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">3</span><span>4</span></span> вычтем <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>2</span></span>. Половина равна двум четвертям. Из трёх четвертей убираем две четверти. Остаётся одна четверть.</p><div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">3</span><span>4</span></span> · было<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>4</span></span> · убираем столько<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>4</span></span> · осталось<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div></section><section class=\"theory-topic\"><h3>Как узнать, сколько четвертинок убрать</h3><p>Убираем половину. Чтобы записать её в четвертях, делим 4 на 2 и получаем 2. Умножаем верх и низ дроби на 2. Значит, убираем две четвертинки.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>1</span><span>2</span></span> = <span class=\"math-fraction\"><span>1 · 2</span><span>2 · 2</span></span> = <span class=\"math-fraction\"><span>2</span><span>4</span></span></div></div></section>","anchor":"Перепиши дроби с общим знаменателем. Вычти числители в том же порядке, что и в примере.","anchorNote":"Считаем, сколько долей осталось","tasks":[{"kind":"number","q":"Вычисли 5/6 − 1/3.","before":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","answer":0.5,"unit":"","see":"Посмотри только на нижние числа: 6 и 3. Начни проверку с 6.","similar":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","algorithm":"Считай по 6: 6, 12, 18… Остановись, как только число разделится на 3. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. После этого выполни действие только над верхними числами.","retry":"Проверь каждую дробь: на какое число ты умножила низ? На это же число нужно умножить верх.","steps":["Общий знаменатель 6: он делится на 6 и на 3.","Получаем 5/6 − 2/6. Для первой дроби множитель 1, для второй 2.","Считаем 5 − 2 = 3. Сохраняем знаменатель 6.","Делим числитель и знаменатель на 3. Получаем 1/2.","Запиши ответ в удобной равной форме."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">5</span><span>6</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>3</span></span> · вторая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"number","q":"Вычисли 7/8 − 1/4.","before":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","answer":0.625,"unit":"","see":"Посмотри только на нижние числа: 8 и 4. Начни проверку с 8.","similar":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","algorithm":"Считай по 8: 8, 16, 24… Остановись, как только число разделится на 4. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. После этого выполни действие только над верхними числами.","retry":"Проверь каждую дробь: на какое число ты умножила низ? На это же число нужно умножить верх.","steps":["Общий знаменатель 8: он делится на 8 и на 4.","Получаем 7/8 − 2/8. Для первой дроби множитель 1, для второй 2.","Считаем 7 − 2 = 5. Сохраняем знаменатель 8.","Ответ: 5/8."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">7</span><span>8</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>4</span></span> · вторая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"number","q":"Вычисли 3/5 − 1/10.","before":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","answer":0.5,"unit":"","see":"Посмотри только на нижние числа: 5 и 10. Начни проверку с 10.","similar":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","algorithm":"Считай по 10: 10, 20, 30… Остановись, как только число разделится на 5. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. После этого выполни действие только над верхними числами.","retry":"Проверь каждую дробь: на какое число ты умножила низ? На это же число нужно умножить верх.","steps":["Общий знаменатель 10: он делится на 5 и на 10.","Получаем 6/10 − 1/10. Для первой дроби множитель 2, для второй 1.","Считаем 6 − 1 = 5. Сохраняем знаменатель 10.","Делим числитель и знаменатель на 5. Получаем 1/2.","Запиши ответ в удобной равной форме."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">3</span><span>5</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>10</span></span> · вторая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"},{"kind":"number","q":"Вычисли 2/3 − 4/6.","before":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","answer":0.0,"unit":"","see":"Посмотри только на нижние числа: 3 и 6. Начни проверку с 6.","similar":"Вычтем 1/5 из 7/10. Перепишем 1/5 как 2/10. Теперь 7/10 − 2/10 = 5/10. Если убрали всё, что было, результат равен нулю.","algorithm":"Считай по 6: 6, 12, 18… Остановись, как только число разделится на 3. Для каждой дроби раздели найденное число на её старое нижнее число. На полученный множитель умножь верх и низ этой дроби. После этого выполни действие только над верхними числами.","retry":"Проверь каждую дробь: на какое число ты умножила низ? На это же число нужно умножить верх.","steps":["Общий знаменатель 6: он делится на 3 и на 6.","Получаем 4/6 − 4/6. Для первой дроби множитель 2, для второй 1.","Считаем 4 − 4 = 0. Сохраняем знаменатель 6.","Делим числитель и знаменатель на 6. Получаем 0.","Запиши ответ в удобной равной форме."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">2</span><span>3</span></span> · первая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">4</span><span>6</span></span> · вторая дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>"}]},{"name":"Меняем обе дроби","subtitle":"Ищем общий знаменатель","title":"Когда больший знаменатель сам не подходит","intro":"<section class=\"theory-topic\"><h3>Что делать, если большее число не подошло</h3><p>Сложим <span class=\"math-fraction\"><span>1</span><span>4</span></span> и <span class=\"math-fraction\"><span>1</span><span>6</span></span>. Снизу стоят 4 и 6. Начинаем с 6. На 4 оно не делится без остатка. Прибавляем ещё 6 и проверяем следующее число.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">6 → 12. Число 12 делится на 4 и на 6. Значит, снизу у обеих дробей будет 12.</div></div></section><section class=\"theory-topic\"><h3>Как проверить, что число подходит</h3><p>Проверь деление на каждое нижнее число. Здесь обе проверки проходят.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">12 : 4 = 3. Первую дробь умножаем сверху и снизу на 3.<br>12 : 6 = 2. Вторую дробь умножаем сверху и снизу на 2.</div></div></section><section class=\"theory-topic\"><h3>Первое общее число</h3><p class=\"math-definition\"><strong>Наименьший общий знаменатель</strong> – наименьшее положительное число, которое делится на оба знаменателя.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><p>Кратные 4 · 4, 8, <strong>12</strong>, 16 …</p><p>Кратные 6 · 6, <strong>12</strong>, 18 …</p></div></div></section><div class=\"definition-parts\"><ol><li><h4>Перепиши первую дробь</h4><p>Умножаем верх и низ на 3.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>1</span><span>4</span></span> = <span class=\"math-fraction\"><span>1 · 3</span><span>4 · 3</span></span> = <span class=\"math-fraction\"><span>3</span><span>12</span></span></div></div></li><li><h4>Перепиши вторую дробь</h4><p>Умножаем верх и низ на 2.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>1</span><span>6</span></span> = <span class=\"math-fraction\"><span>1 · 2</span><span>6 · 2</span></span> = <span class=\"math-fraction\"><span>2</span><span>12</span></span></div></div></li><li><h4>Выполни действие над верхними числами</h4><p>Снизу оставь 12. При сложении считаем, сколько долей стало. При вычитании считаем, сколько долей осталось.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\"><span>3</span><span>12</span></span> + <span class=\"math-fraction\"><span>2</span><span>12</span></span> = <span class=\"math-fraction\"><span>5</span><span>12</span></span><br><span class=\"math-fraction\"><span>3</span><span>12</span></span> − <span class=\"math-fraction\"><span>2</span><span>12</span></span> = <span class=\"math-fraction\"><span>1</span><span>12</span></span></div></div></li></ol></div><section class=\"theory-topic\"><h3>Если первое число не подошло, проверяй следующее</h3><p>Для 6 и 8 считаем восьмёрками. Число 8 не делится на 6, число 16 тоже. Число 24 делится на 6 и на 8.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\">8 → 16 → 24. Общий знаменатель 24.</div></div></section>","anchor":"Выбери большее нижнее число. Прибавляй его снова и снова, пока не получишь число, которое делится и на меньшее.","anchorNote":"Ищем общий знаменатель","tasks":[{"kind":"choice","q":"1/6 + 1/9. Выбери наименьший общий знаменатель.","before":"Для 1/3 и 1/4 :1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div></div></section><section class=\"theory-topic\"><h3>Собираем целое</h3><p class=\"math-definition\"><strong>Неправильная дробь</strong> – дробь, у которой числитель больше знаменателя или равен ему.</p><div class=\"theory-cell\"><div class=\"theory-cell-content\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">7</span><span>6</span></span> = <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">6</span><span>6</span></span> + <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>6</span></span> = 1 + <span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">1</span><span>6</span></span><div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">6</span><span>6</span></span> · одна целая полоска<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;border:1px solid # веты больше единицы","tasks":[{"kind":"choice","q":"Сократи 4/8 до дроби с наименьшим знаменателем.","before":"Сократим 6/9. Делим 6 и 9 на 3. Получаем 2/3.","answer":"1/2","unit":"","see":"Найди общий делитель 4 и 8.","similar":"Сократим 6/9. Делим 6 и 9 на 3. Получаем 2/3.","algorithm":"На 4 делятся оба числа.","retry":"Раздели на 4 и верхнее, и нижнее число.","steps":["4 : 4 = 1.","8 : 4 = 2.","Ответ: 1/2."],"visual":"<div style=\"max-width:430px;margin:14px 0\" role=\"group\" aria-label=\"Полоски одинаковой длины\"><div style=\"margin:.65em 0\"><span class=\"math-fraction\" style=\"display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;padding:0 .18em\"><span style=\"border-bottom:1px solid currentColor\">4</span><span>8</span></span> · исходная дробь<div aria-hidden=\"true\" style=\"margin-top:.35em;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;border:1px solid #C9AB82;background:#C9AB82\"><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#E2B04A;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span><span style=\"background:#2B3D2B;min-width:0;height:29px\"></span></div></div></div>","options":["2/4","1/2","4/2"]},{"kind":"number","q":"Сколько целых содержится в 9/8?","before":"В 5/4 четыре четверти составляют одно целое. Сверх целого остаётся 1/4.","answer":1,"unit":"","see":"Сколько восьмых составляют целое?","similar":"В 5/4 четыре четверти составляют одно целое. Сверх целого остаётся 1/4.","algorithm":"Одно целое составляет 8/8.","retry":"Разложи 9/8 на 8/8 + 1/8.","steps":["Девять восьмых состоят из восьми восьмых и ещё одной восьмой.","Целая часть р (function(){

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }

  const number = /\d+(?:[.,]\d+)?/.source;

  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>

  function plainMath(value) {

  const fractionSymbols={ '¼':[1,4],'½':[1,2],'¾':[3,4],'⅐':[1,7],'⅑':[1,9],'⅒':[1,10],
    '⅓':[1,3],'⅔':[2,3],'⅕':[1,5],'⅖':[2,5],'⅗':[3,5],'⅘':[4,5],'⅙':[1,6],'⅚':[5,6],

  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${mathText(s.name)}<small>${n} / ${s.tasks.length} · ${mathText(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${mathMarkup(t.visual)}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`${t.q.startsWith('Вычисли ')?'<p>Для ввода дроби набери верхнее число, затем знак деления (/) и нижнее число. Сокращать ответ можно по желанию.</p>':''}<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput||t.q.startsWith('Вычисли ')?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':t.q.startsWith('Вычисли ')?'Дробь или целое число':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Для ответа дробью введи числитель, знак деления (/) и знаменатель. Для целого числа введи только число.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
