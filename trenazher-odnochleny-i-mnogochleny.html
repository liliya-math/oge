/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {

  <script>
window.TrainerData={"id":"odnochleny-mnogochleny-7","version":2,"title":"Одночлены и многочлены · lili.math","heading":"Одночлены и многочлены","grade":"7 класс","subtitle":"13 тем · 77 заданий с подсказками и разборами","description":"Интерактивный тренажёр по одночленам, многочленам и формулам сокращённого умножения.","stages":[{"name":"Что такое одночлен","subtitle":"Вид выражения","title":"Что такое одночлен","intro":"\u003cp>Прочитай 3a²b как 3 · a · a · b. Число 3, две буквы a и одна буква b перемножаются. Точки умножения в короткой записи пропущены. В записи a + b буквы складываются, поэтому перед нами уже сумма.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Что такое одночлен\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3a²b\u003c/b>\u003cspan class=\"theory-note\">Короткая запись\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3 · a · a · b\u003c/b>\u003cspan class=\"theory-note\">Четыре множителя\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>a + b\u003c/b>\u003cspan class=\"theory-note\">Здесь буквы складываются\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Одночлен.\u003c/strong> Это число, переменная или произведение чисел и переменных в целых неотрицательных степенях. Например, 7, x и 3a²b являются одночленами.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Одночлен\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>7\u003c/b>\u003cspan class=\"theory-note\">Одно число\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x\u003c/b>\u003cspan class=\"theory-note\">Одна буква\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3a²b\u003c/b>\u003cspan class=\"theory-note\">Произведение\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp>В записи 2a · (−3b) · a² сначала можно собрать числа 2 и −3, а затем буквы a, b и a². Так удобнее увидеть, что с чем умножать.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к примеру\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2 · (−3)\u003c/b>\u003cspan class=\"theory-note\">Собираем числа\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>a · b · a²\u003c/b>\u003cspan class=\"theory-note\">Собираем буквы со степенями\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Числовые и буквенные множители.\u003c/strong> Множители, записанные числами, называют числовыми. Переменные и их степени называют буквенными множителями.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к определению\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−4 · ½\u003c/b>\u003cspan class=\"theory-note\">Числовые множители\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x² · y\u003c/b>\u003cspan class=\"theory-note\">Буквенные множители\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−2x²y\u003c/b>\u003cspan class=\"theory-note\">Получившийся одночлен\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"В одночлене буквенные множители перемножаются.","anchorNote":"Деление на ненулевое число можно записать как умножение на дробь. Например, x : 3 = ⅓x.","tasks":[{"kind":"choice","q":"Выбери одночлен.","answer":"−5a²b","see":"Проверь действия между частями.","similar":"3xy состоит из множителей 3, x и y.","algorithm":"Проверь, что делают с буквами. Делить на постоянное ненулевое число можно: x/3 = ⅓x.","retry":"Проверь действия между частями.","steps":["В записи −5a²b число −5 и степени букв перемножаются: −5 · a · a · b.","Сумма, переменная в знаменателе и корень из переменной выходят за пределы определения.","Ответ: −5a²b."],"options":["1/a","√a","a + b","−5a²b"],"unit":""},{"kind":"number","q":"Сколько буквенных множителей в записи x, если записать степень явно?","answer":1,"see":"Буква x стоит без показателя.","similar":"У y показатель степени равен 1: y = y¹.","algorithm":"Проверь, что делают с буквами.","retry":"Буква x стоит без показателя.","steps":["Записываем x = x¹.","Здесь один множитель x.","Ответ: 1."],"unit":""},{"kind":"choice","q":"Что из перечисленного тоже одночлен?","answer":"−7","see":"Проверь случай без букв.","similar":"Число 4 само по себе является одночленом.","algorithm":"Проверь, что делают с буквами.","retry":"Проверь случай без букв.","steps":["Проверь случай без букв.","Постоянное число −7 является одночленом без буквенной части.","Ответ: −7."],"options":["x⁻¹","−7","x + 7","√x"],"unit":""},{"kind":"choice","q":"Какая запись задаёт одночлен?","answer":"x/5","see":"Отличай деление на число от деления на букву.","similar":"a/2 = ½a.","algorithm":"Проверь, что делают с буквами.","retry":"Отличай деление на число от деления на букву.","steps":["Деление на 5 заменяем умножением на 1/5.","Получаем ⅕x.","Ответ: x/5."],"options":["x/y","5/x","x/5","x⁻²"],"unit":""},{"kind":"choice","q":"Почему x⁻² не является одночленом?","answer":"Показатель отрицательный","see":"Посмотри, где стоит −2.","similar":"В y⁻¹ число −1 является показателем степени.","algorithm":"Проверь, что делают с буквами.","retry":"Посмотри, где стоит −2.","steps":["У букв в одночлене показатели целые неотрицательные.","Здесь показатель равен −2.","Ответ: Показатель отрицательный."],"options":["У x нет коэффициента","Коэффициент равен −2","Показатель отрицательный"],"unit":""},{"kind":"choice","q":"В записи 4m · (−2n) · m² выбери все числовые множители.","unit":"","answer":"4 и −2","see":"Числа стоят перед буквами.","similar":"В −5a · 3b числовые множители −5 и 3.","algorithm":"Прочитай запись как произведение и выпиши отдельно числа.","retry":"Числа стоят перед буквами.","steps":["4m означает 4 · m, а −2n означает (−2) · n.","Числовые множители: 4 и −2."],"options":["4 и 2","4 и −2","−8","m и n"]},{"kind":"choice","q":"В записи −5a² · 2b · a какие множители буквенные?","unit":"","answer":"a², b и a","see":"Буква может стоять в степени.","similar":"В 3x² · 2y буквенные множители x² и y.","algorithm":"Оставь буквы с их показателями в том виде, в котором они записаны.","retry":"Буква может стоять в степени.","steps":["−5 и 2 являются числами.","Буквенные множители: a², b и a."],"options":["a² и b","−5, 2 и a","a², b и a","a³ и b"]}]},{"name":"Стандартный вид","subtitle":"Коэффициент и степень","title":"Стандартный вид","intro":"\u003cp>В записи 2x · 3xy собери числа вместе, а одинаковые буквы запиши одной степенью. Получится 6x²y. Число спереди равно 6. Буквы дают три множителя: x, x и y.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Стандартный вид\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x · 3xy\u003c/b>\u003cspan class=\"theory-note\">Собираем числа и буквы\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(2 · 3) · (x · x) · y\u003c/b>\u003cspan class=\"theory-note\">Три группы\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>6x²y\u003c/b>\u003cspan class=\"theory-note\">Запись после упрощения\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Стандартный вид одночлена.\u003c/strong> Это запись, в которой один числовой множитель стоит первым, а каждая переменная записана один раз со своей степенью.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Стандартный вид одночлена\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(−2a) · (3ab)\u003c/b>\u003cspan class=\"theory-note\">Исходное произведение\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−6\u003c/b>\u003cspan class=\"theory-note\">Число спереди\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>a²b\u003c/b>\u003cspan class=\"theory-note\">Каждая буква записана один раз\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Коэффициент.\u003c/strong> Это числовой множитель. Буквенной частью называют оставшееся произведение степеней переменных. В 6x²y коэффициент равен 6, буквенная часть равна x²y.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Коэффициент\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−4\u003c/b>\u003cspan class=\"theory-note\">Коэффициент\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x²y\u003c/b>\u003cspan class=\"theory-note\">Буквенная часть\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−4x²y\u003c/b>\u003cspan class=\"theory-note\">Одночлен целиком\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Степень ненулевого одночлена.\u003c/strong> Это сумма показателей степеней всех переменных. Для 6x²y получаем 2 + 1 = 3. У ненулевого числа степень 0. У нулевого одночлена степень не определяют.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Степень ненулевого одночлена\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>a³\u003c/b>\u003cspan class=\"theory-note\">Три буквы a\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>b²\u003c/b>\u003cspan class=\"theory-note\">Две буквы b\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3 + 2 = 5\u003c/b>\u003cspan class=\"theory-note\">Степень a³b²\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp>Сравни 7a²b и 7a · ab. В первой записи число уже стоит перед буквами и каждая буква написана один раз. Во второй записи буква a встречается дважды, поэтому сначала её нужно собрать в степень.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к примеру\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>7a²b\u003c/b>\u003cspan class=\"theory-note\">Можно оставить как есть\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>7a · ab\u003c/b>\u003cspan class=\"theory-note\">Нужно собрать a · a в a²\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Как распознать стандартный вид.\u003c/strong> Проверь числовой множитель и повторяющиеся буквы. Коэффициент 1 обычно пропускают, а вместо коэффициента −1 пишут минус. Число само по себе тоже записано в стандартном виде.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к определению\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>p²q\u003c/b>\u003cspan class=\"theory-note\">Коэффициент 1\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−p²q\u003c/b>\u003cspan class=\"theory-note\">Коэффициент −1\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−9\u003c/b>\u003cspan class=\"theory-note\">Число без букв\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Степень ненулевого одночлена равна сумме показателей букв.","anchorNote":"У ненулевого числа степень 0. Степень нулевого одночлена не определяют.","tasks":[{"kind":"choice","q":"Какой одночлен уже записан в стандартном виде?","unit":"","answer":"−5a²b","see":"Проверь число перед буквами и повторяющиеся буквы.","similar":"Запись 3x²y уже стандартная, а 3x · xy нужно упростить.","algorithm":"У каждого числового и буквенного множителя должно быть своё место в окончательной записи.","retry":"Проверь число перед буквами и повторяющиеся буквы.","steps":["В −5a²b число −5 стоит первым. Буквы a и b записаны по одному разу.","Ответ: −5a²b."],"options":["−5a · ab","a² · (−5b)","−5a²b","−a² · 5b"]},{"kind":"choice","q":"В каком ряду все одночлены записаны в стандартном виде?","unit":"","answer":"−8, −y³, 4ab²","see":"У числа букв может не быть, а у −y³ коэффициент −1.","similar":"У x² коэффициент 1, даже если он не написан.","algorithm":"Проверь каждую запись отдельно: числовая часть в начале, каждая буква записана один раз.","retry":"У числа букв может не быть, а у −y³ коэффициент −1.","steps":["−8 является числом. В −y³ коэффициент −1 записан знаком минус.","В 4ab² число 4 стоит первым, a и b записаны по одному разу."],"options":["−8, −y³, 4ab²","−8, y · y², 4ab²","−8, −y³, 2a · 2b²","−8, 3 · 2y, 4ab²"]},{"kind":"number","q":"Найди коэффициент одночлена −a²b.","answer":-1,"see":"Перед буквами стоит один минус.","similar":"−xy = −1 · xy.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв. У ненулевого числа степень 0. Степень нулевого одночлена не определяют.","retry":"Перед буквами стоит один минус.","steps":["Перед буквами стоит один минус.","Перед буквенной частью a²b стоит множитель −1.","Ответ: -1."],"unit":""},{"kind":"choice","q":"Приведи 2a · (−3b) · a² к стандартному виду.","answer":"−6a³b","see":"Собери числа и каждую букву отдельно.","similar":"3x · (−2x²) = −6x³.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв.","retry":"Собери числа и каждую букву отдельно.","steps":["2 · (−3) = −6.","У a показатели 1 и 2, поэтому получаем a³.","Буква b остаётся.","Ответ: −6a³b."],"options":["6a³b","−6a²b","−6a³b","−6a³b²"],"unit":""},{"kind":"number","q":"Найди степень одночлена −8x²y³z.","answer":6,"see":"У z показатель 1.","similar":"Степень 9a²b равна 2 + 1 = 3.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв.","retry":"У z показатель 1.","steps":["У z показатель 1.","Сложи показатели букв: 2 + 3 + 1 = 6.","Ответ: 6."],"unit":""},{"kind":"number","q":"Найди степень одночлена 17.","answer":0,"see":"Это ненулевое число.","similar":"У числа 6 буквенных множителей нет, степень равна 0.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв.","retry":"Это ненулевое число.","steps":["Буквенная часть отсутствует.","Степень равна 0.","Ответ: 0."],"unit":""},{"kind":"choice","q":"Что можно сказать о степени одночлена 0 · x⁷?","answer":"Степень не определяют","see":"Сначала вычисли произведение.","similar":"0 · a⁴ = 0, буквенная часть исчезает.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв.","retry":"Сначала вычисли произведение.","steps":["0 · x⁷ = 0.","У нулевого одночлена степень не определяют.","Ответ: Степень не определяют."],"options":["Степень 0","Степень 7","Степень не определяют","Степень 1"],"unit":""},{"kind":"choice","q":"Упрости (−½a) · (¾a²).","answer":"−⅜a³","see":"Отдельно перемножь дроби.","similar":"(½x) · (⅓x²) = ⅙x³.","algorithm":"Степень ненулевого одночлена равна сумме показателей букв.","retry":"Отдельно перемножь дроби.","steps":["(−1/2) · (3/4) = −3/8.","У a показатели 1 и 2, их сумма 3.","Ответ: −⅜a³."],"options":["−¼a³","⅜a³","−⅜a³","−⅜a²"],"unit":""},{"kind":"choice","q":"Приведи (−3m) · 2mn² к стандартному виду и назови коэффициент.","unit":"","answer":"−6m²n², коэффициент −6","see":"Собери числа отдельно, затем одинаковые буквы.","similar":"2a · 3ab = 6a²b. Коэффициент равен 6.","algorithm":"Перемножь числа со знаками, объедини одинаковые буквы и назови число перед ними.","retry":"Собери числа отдельно, затем одинаковые буквы.","steps":["(−3) · 2 = −6. Два множителя m дают m², множитель n² сохраняется.","Стандартный вид: −6m²n². Коэффициент: −6."],"options":["−6mn², коэффициент −6","−6m²n², коэффициент 6","6m²n², коэффициент 6","−6m²n², коэффициент −6"]}]},{"name":"Подобные слагаемые","subtitle":"Сложение и вычитание","title":"Подобные слагаемые","intro":"\u003cp>В 5ab и 2ba перемножаются одни и те же буквы. Порядок букв можно поменять, поэтому 5ab − 2ba = 5ab − 2ab = 3ab. А у x²y и xy² квадраты стоят у разных букв.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Подобные слагаемые\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5ab − 2ba\u003c/b>\u003cspan class=\"theory-note\">Сравни буквы\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5ab − 2ab\u003c/b>\u003cspan class=\"theory-note\">Переставили b и a\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3ab\u003c/b>\u003cspan class=\"theory-note\">Вычли числа перед буквами\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Подобные слагаемые.\u003c/strong> Это слагаемые с одинаковой буквенной частью. Числа без букв тоже подобны между собой.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Подобные слагаемые\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x²y\u003c/b>\u003cspan class=\"theory-note\">x, x, y\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>yx²\u003c/b>\u003cspan class=\"theory-note\">x, x, y\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>xy²\u003c/b>\u003cspan class=\"theory-note\">x, y, y: другая буквенная часть\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Привести подобные слагаемые.\u003c/strong> Значит заменить их одним слагаемым: сложить коэффициенты с учётом знаков и сохранить буквенную часть. Если сумма коэффициентов равна нулю, вся группа исчезает.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Привести подобные слагаемые\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>7x² − 4x²\u003c/b>\u003cspan class=\"theory-note\">Одинаковая часть x²\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>7 − 4 = 3\u003c/b>\u003cspan class=\"theory-note\">Считаем коэффициенты\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3x²\u003c/b>\u003cspan class=\"theory-note\">Возвращаем x²\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Сложение не меняет буквенную часть.","anchorNote":"Перестановка букв при умножении не меняет произведение.","tasks":[{"kind":"choice","q":"Какой одночлен подобен 3x²y?","answer":"−4yx²","see":"Сравни показатели каждой буквы.","similar":"ab² и b²a имеют одинаковую буквенную часть.","algorithm":"Сложение не меняет буквенную часть. Перестановка букв при умножении не меняет произведение.","retry":"Сравни показатели каждой буквы.","steps":["Сравни показатели каждой буквы.","В −4yx² после перестановки получаем −4x²y.","Ответ: −4yx²."],"options":["−x²y²","3x²","−4yx²","4xy²"],"unit":""},{"kind":"choice","q":"Упрости x² + x².","answer":"2x²","see":"Между одночленами стоит плюс.","similar":"y³ + y³ = 2y³.","algorithm":"Сложение не меняет буквенную часть.","retry":"Между одночленами стоит плюс.","steps":["Складываем коэффициенты 1 + 1 = 2.","Буквенная часть остаётся x².","Ответ: 2x²."],"options":["x⁴","2x⁴","2x²","x²"],"unit":""},{"kind":"choice","q":"Упрости 7x² − 5x.","answer":"7x² − 5x","see":"Сравни показатели x.","similar":"4a² и 2a имеют разные буквенные части.","algorithm":"Сложение не меняет буквенную часть.","retry":"Сравни показатели x.","steps":["Степени x² и x различны.","Оба слагаемых остаются.","Ответ: 7x² − 5x."],"options":["2x","7x² − 5x","2x³","2x²"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Упрости −a + 3a − 2a + 5.","answer":"5","see":"Число 5 образует отдельную группу.","similar":"2x − x − x = 0.","algorithm":"Сложение не меняет буквенную часть.","retry":"Число 5 образует отдельную группу.","steps":["Коэффициент при a равен −1 + 3 − 2 = 0.","Остаётся 5.","Ответ: 5."],"options":["0","5a","5","−6a + 5"],"unit":""},{"kind":"choice","q":"Упрости 0,4x − ¾x.","answer":"−0,35x","see":"Приведи коэффициенты к одной форме.","similar":"¼ = 0,25.","algorithm":"Сложение не меняет буквенную часть.","retry":"Приведи коэффициенты к одной форме.","steps":["¾ = 0,75.","Разность 0,4 − 0,75 = −0,35, поэтому ответ −0,35x.","Ответ: −0,35x."],"options":["1,15x","0,35x","−0,71x","−0,35x"],"unit":""},{"kind":"choice","q":"В какой паре одночлены отличаются только коэффициентами?","unit":"","answer":"−5b²a и 2ab²","see":"Сравни буквы и их показатели, даже если буквы записаны в разном порядке.","similar":"2yx² и −x²y имеют одну буквенную часть.","algorithm":"Запиши буквы в одном порядке и сравни показатели каждой буквы.","retry":"Сравни буквы и их показатели, даже если буквы записаны в разном порядке.","steps":["b²a = ab². В обоих одночленах буквенная часть ab².","Коэффициенты различны: −5 и 2."],"options":["−5b²a и 2a²b","−5b²a и 2ab²","−5ab и 2ab²","−5a²b² и 2ab²"]}]},{"name":"Умножение и степень","subtitle":"Действия с одночленами","title":"Умножение и степень","intro":"\u003cp>В x³ · x² перемножаются три множителя x и ещё два x. Получается пять множителей, то есть x⁵. В (x³)² берём две одинаковые тройки множителей, поэтому получаем x⁶.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Умножение и степень\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x³ · x²\u003c/b>\u003cspan class=\"theory-note\">Тройка и двойка\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x · x · x · x · x\u003c/b>\u003cspan class=\"theory-note\">Пять множителей\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x⁵\u003c/b>\u003cspan class=\"theory-note\">3 + 2 = 5\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Основание и показатель степени.\u003c/strong> В записи x³ основание x показывает, какой множитель повторяется, а показатель 3 говорит, сколько раз он входит в произведение.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Основание и показатель степени\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x\u003c/b>\u003cspan class=\"theory-note\">Основание: что умножаем\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3\u003c/b>\u003cspan class=\"theory-note\">Показатель: сколько множителей\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x³ = x · x · x\u003c/b>\u003cspan class=\"theory-note\">Степень целиком\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Умножение степеней с одинаковым основанием.\u003c/strong> Основание сохраняется, показатели складываются. При возведении степени в степень основание сохраняется, показатели перемножаются.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Умножение степеней с одинаковым основанием\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>a⁴ · a² → a⁶\u003c/b>\u003cspan class=\"theory-note\">4 + 2 при умножении\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>(a⁴)² → a⁸\u003c/b>\u003cspan class=\"theory-note\">4 · 2 при возведении в степень\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp>Пусть x = −2. Чтобы узнать, чему равно 3x², поставь (−2) на место x. Сначала вычисли квадрат, затем умножь результат на 3.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к примеру\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3x²\u003c/b>\u003cspan class=\"theory-note\">Исходная запись\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3 · (−2)²\u003c/b>\u003cspan class=\"theory-note\">Поставили (−2) вместо x\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3 · 4 = 12\u003c/b>\u003cspan class=\"theory-note\">Сначала квадрат, затем умножение\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Значение одночлена.\u003c/strong> Это число, которое получается после подстановки заданных значений всех переменных и выполнения действий.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к определению\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−2a²b\u003c/b>\u003cspan class=\"theory-note\">a = −1, b = 3\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−2 · (−1)² · 3\u003c/b>\u003cspan class=\"theory-note\">Заменили обе буквы\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−6\u003c/b>\u003cspan class=\"theory-note\">Значение одночлена\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"В степень возводится каждый множитель внутри скобок.","anchorNote":"Чётная степень отрицательного числа положительна, нечётная отрицательна.","tasks":[{"kind":"choice","q":"Упрости x³ · x⁴.","answer":"x⁷","see":"Здесь две степени перемножаются.","similar":"a² · a³ = a⁵.","algorithm":"В степень возводится каждый множитель внутри скобок. Чётная степень отрицательного числа положительна, нечётная отрицательна.","retry":"Здесь две степени перемножаются.","steps":["Здесь две степени перемножаются.","Показатели одного основания складываем: 3 + 4 = 7.","Ответ: x⁷."],"options":["x⁷","x","2x⁷","x¹²"],"unit":""},{"kind":"choice","q":"Упрости (−2a²b)².","answer":"4a⁴b²","see":"Квадрат относится ко всей скобке.","similar":"(−3xy²)² = 9x²y⁴.","algorithm":"В степень возводится каждый множитель внутри скобок.","retry":"Квадрат относится ко всей скобке.","steps":["Квадрат относится ко всей скобке.","(−2)² = 4, (a²)² = a⁴, b² остаётся b².","Ответ: 4a⁴b²."],"options":["4a⁴b²","2a⁴b²","−4a⁴b²","4a⁴b"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Чему равно −(3x)² в стандартном виде?","answer":"−9x²","see":"Минус стоит перед скобкой.","similar":"−(2a)² = −4a².","algorithm":"В степень возводится каждый множитель внутри скобок.","retry":"Минус стоит перед скобкой.","steps":["Сначала возводим 3x в квадрат: 9x².","Затем ставим минус.","Ответ: −9x²."],"options":["−3x²","−9x","−9x²","9x²"],"unit":""},{"kind":"choice","q":"Упрости (−2x³y²)³.","answer":"−8x⁹y⁶","see":"Показатель 3 нечётный.","similar":"(−a²)³ = −a⁶.","algorithm":"В степень возводится каждый множитель внутри скобок.","retry":"Показатель 3 нечётный.","steps":["(−2)³ = −8.","Показатели умножаем: 3 · 3 = 9, 2 · 3 = 6.","Ответ: −8x⁹y⁶."],"options":["−6x⁶y⁵","8x⁹y⁶","−8x⁶y⁵","−8x⁹y⁶"],"unit":""},{"kind":"choice","q":"Чему равно a⁰ при a ≠ 0?","answer":"1","see":"Условие a ≠ 0 важно.","similar":"5⁰ = 1.","algorithm":"В степень возводится каждый множитель внутри скобок.","retry":"Условие a ≠ 0 важно.","steps":["Условие a ≠ 0 важно.","Ненулевое число в нулевой степени равно 1.","Ответ: 1."],"options":["a","0","1","−1"],"unit":""},{"kind":"choice","q":"Упрости (−12a⁵b³)/(3a²b), если a ≠ 0 и b ≠ 0.","answer":"−4a³b²","see":"Это частное, а не произведение.","similar":"x⁵/x² = x³ при x ≠ 0.","algorithm":"В степень возводится каждый множитель внутри скобок.","retry":"Это частное, а не произведение.","steps":["−12/3 = −4.","Вычитаем показатели одинаковых букв: 5 − 2 = 3, 3 − 1 = 2.","Ответ: −4a³b²."],"options":["−4a³b²","−4a³b³","4a³b²","−4a⁷b⁴"],"unit":""},{"kind":"number","q":"Найди значение −3x² при x = −2.","unit":"","answer":-12,"see":"Подставь отрицательное число в скобках.","similar":"При y = −3 значение y² равно (−3)² = 9.","algorithm":"Сначала возведи подставленное число в квадрат, затем умножь на −3.","retry":"Подставь отрицательное число в скобках.","steps":["Подставляем x = −2: −3 · (−2)².","Сначала (−2)² = 4. Затем −3 · 4 = −12."]},{"kind":"number","q":"Найди значение 2a²b при a = −3 и b = −2.","unit":"","answer":-36,"see":"Подставь числа на места обеих букв.","similar":"При a = 2 и b = −1 выражение a²b равно 4 · (−1).","algorithm":"Возведи в квадрат только число на месте a, потом перемножь все множители.","retry":"Подставь числа на места обеих букв.","steps":["Подставляем числа: 2 · (−3)² · (−2).","Квадрат равен 9. Умножаем: 2 · 9 · (−2) = −36."]}]},{"name":"Многочлен и его степень","subtitle":"Стандартный вид","title":"Многочлен и его степень","intro":"\u003cp>Рассмотри 2x³ − x + 5. Здесь три части со своими знаками: 2x³, −x и 5. Если добавить −2x³, кубы исчезнут и останется −x + 5.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Многочлен и его степень\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x³ − x + 5\u003c/b>\u003cspan class=\"theory-note\">Три члена\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x³ − 2x³ = 0\u003c/b>\u003cspan class=\"theory-note\">Кубы исчезают\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−x + 5\u003c/b>\u003cspan class=\"theory-note\">Два члена остались\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Многочлен.\u003c/strong> Это сумма одночленов, каждый из которых берётся со своим знаком. Такие одночлены называют членами многочлена. Член без букв называется свободным.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Многочлен\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>4x²\u003c/b>\u003cspan class=\"theory-note\">Первый член\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−3x\u003c/b>\u003cspan class=\"theory-note\">Второй член\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>+8\u003c/b>\u003cspan class=\"theory-note\">Свободный член\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Стандартный вид многочлена.\u003c/strong> Это запись, в которой каждый член приведён к стандартному виду и подобные члены уже объединены.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Стандартный вид многочлена\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>4y + y² − y\u003c/b>\u003cspan class=\"theory-note\">До упрощения\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(4 − 1)y + y²\u003c/b>\u003cspan class=\"theory-note\">Объединяем члены с y\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>y² + 3y\u003c/b>\u003cspan class=\"theory-note\">Стандартный вид\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Степень ненулевого многочлена.\u003c/strong> Это наибольшая степень его членов после приведения к стандартному виду. У −x + 5 степень 1. У нулевого многочлена степень не определяют.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Степень ненулевого многочлена\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>4a³b\u003c/b>\u003cspan class=\"theory-note\">Степень 4\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−2ab\u003c/b>\u003cspan class=\"theory-note\">Степень 2\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>+7\u003c/b>\u003cspan class=\"theory-note\">Степень 0\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>max(4, 2, 0) = 4\u003c/b>\u003cspan class=\"theory-note\">Берём наибольшую\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Сначала упрости, потом считай члены и степень.","anchorNote":"Степени разных слагаемых между собой не складывают.","tasks":[{"kind":"choice","q":"Какой член является свободным в 3x² − x − 8?","answer":"−8","see":"У свободного члена нет букв.","similar":"В 4y − 6 свободный член равен −6.","algorithm":"Сначала упрости, потом считай члены и степень. Степени разных слагаемых между собой не складывают.","retry":"У свободного члена нет букв.","steps":["У свободного члена нет букв.","В записи 3x² − x − 8 только −8 стоит без буквы.","Ответ: −8."],"options":["3x²","8","−8","−x"],"unit":""},{"kind":"number","q":"Сколько членов у x² + 3x − x + 4 в стандартном виде?","answer":3,"see":"Сначала собери слагаемые с x.","similar":"a² + 2a + a = a² + 3a.","algorithm":"Сначала упрости, потом считай члены и степень.","retry":"Сначала собери слагаемые с x.","steps":["3x − x = 2x.","В x² + 2x + 4 три члена.","Ответ: 3."],"unit":""},{"kind":"number","q":"Найди степень 2x²y³ − 4xy² + 11.","answer":5,"see":"Вычисли степень каждого члена отдельно.","similar":"У 3a²b⁴ степень 6.","algorithm":"Сначала упрости, потом считай члены и степень.","retry":"Вычисли степень каждого члена отдельно.","steps":["Степени членов равны 5, 3 и 0.","Наибольшая равна 5.","Ответ: 5."],"unit":""},{"kind":"number","q":"Найди степень 4x⁵ − x² − 4x⁵ + 7.","answer":2,"see":"Посмотри, сохраняются ли члены пятой степени.","similar":"a³ − a³ + a = a.","algorithm":"Сначала упрости, потом считай члены и степень.","retry":"Посмотри, сохраняются ли члены пятой степени.","steps":["4x⁵ − 4x⁵ = 0.","В −x² + 7 наибольшая степень равна 2.","Ответ: 2."],"unit":""},{"kind":"choice","q":"Каков результат x² − 2x + 2x − x²?","answer":"Нулевой многочлен","see":"Подобные члены могут исчезнуть попарно.","similar":"a − a = 0.","algorithm":"Сначала упрости, потом считай члены и степень.","retry":"Подобные члены могут исчезнуть попарно.","steps":["x² − x² = 0 и −2x + 2x = 0.","Получился нулевой многочлен.","Ответ: Нулевой многочлен."],"options":["Нулевой многочлен","Число 2","Одночлен x²","Двучлен степени 2"],"expressionInput":true,"unit":""}]},{"name":"Сумма и разность","subtitle":"Знаки перед скобками","title":"Сумма и разность","intro":"\u003cp>В выражении 5x − (2x − 3) вычитается вся скобка. Член 2x вычитаем, а отрицательное число −3 при вычитании даёт +3. Получается 5x − 2x + 3.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Сумма и разность\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5x − (2x − 3)\u003c/b>\u003cspan class=\"theory-note\">Минус относится ко всей скобке\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−2x\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>+3\u003c/b>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5x − 2x + 3\u003c/b>\u003cspan class=\"theory-note\">Запись без скобок\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Раскрытие скобок.\u003c/strong> Это замена выражения равным ему выражением без данных скобок. Плюс перед скобками сохраняет все знаки, минус меняет знак каждого члена.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Раскрытие скобок\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>+(a − 4) → a − 4\u003c/b>\u003cspan class=\"theory-note\">Плюс сохраняет знаки\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−(a − 4) → −a + 4\u003c/b>\u003cspan class=\"theory-note\">Минус меняет оба знака\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Перепиши все члены скобки со своими знаками.","anchorNote":"Сначала раскрой скобки, затем приводи подобные.","tasks":[{"kind":"choice","q":"Упрости (2x − 3) + (x − 5).","answer":"3x − 8","see":"Перед второй скобкой плюс.","similar":"a + (b − c) = a + b − c.","algorithm":"Перепиши все члены скобки со своими знаками. Сначала раскрой скобки, затем приводи подобные.","retry":"Перед второй скобкой плюс.","steps":["Перед второй скобкой плюс.","Получаем 2x − 3 + x − 5 = 3x − 8.","Ответ: 3x − 8."],"options":["x − 8","3x + 2","3x − 8","3x + 8"],"unit":""},{"kind":"choice","q":"Упрости (2x − 3) − (x − 5).","answer":"x + 2","see":"Вторая скобка вычитается целиком.","similar":"a − (b − c) = a − b + c.","algorithm":"Перепиши все члены скобки со своими знаками.","retry":"Вторая скобка вычитается целиком.","steps":["Запиши 2x − 3 − x + 5.","Получается x + 2.","Ответ: x + 2."],"options":["x + 2","x − 8","x − 2","3x + 2"],"unit":""},{"kind":"choice","q":"Упрости −(−x² + 3x − 4).","answer":"x² − 3x + 4","see":"В скобке три члена.","similar":"−(−a + b) = a − b.","algorithm":"Перепиши все члены скобки со своими знаками.","retry":"В скобке три члена.","steps":["В скобке три члена.","−x² меняется на x², +3x на −3x, −4 на +4.","Ответ: x² − 3x + 4."],"options":["−x² − 3x + 4","x² − 3x + 4","x² − 3x − 4","x² + 3x − 4"],"unit":""},{"kind":"choice","q":"Упрости 5x − [2x − (x − 3)].","answer":"4x − 3","see":"Начни с внутренних скобок.","similar":"b − (a − 1) = b − a + 1.","algorithm":"Перепиши все члены скобки со своими знаками.","retry":"Начни с внутренних скобок.","steps":["Внутри получаем 2x − x + 3 = x + 3.","Тогда 5x − (x + 3) = 4x − 3.","Ответ: 4x − 3."],"options":["4x + 3","2x + 3","4x − 3","2x − 3"],"unit":""},{"kind":"choice","q":"Упрости (a² − 2ab + b²) − (b² − 2ab + a²).","answer":"0","see":"Сравни члены обеих скобок после перестановки.","similar":"(a + b) − (b + a) = 0.","algorithm":"Перепиши все члены скобки со своими знаками.","retry":"Сравни члены обеих скобок после перестановки.","steps":["В обеих скобках одинаковые многочлены.","При вычитании все подобные дают ноль.","Ответ: 0."],"options":["0","−4ab","2b²","2a² + 2b²"],"unit":""}]},{"name":"Одночлен на многочлен","subtitle":"Распределительный закон","title":"Одночлен на многочлен","intro":"\u003cp>В 2x(x − 3) множитель 2x относится к обеим частям скобки. Сначала умножаем 2x на x, затем на −3. Получается 2x² − 6x.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Одночлен на многочлен\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x · x\u003c/b>\u003cspan class=\"theory-note\">Умножаем первый член\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>2x · (−3)\u003c/b>\u003cspan class=\"theory-note\">Умножаем второй член\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x² − 6x\u003c/b>\u003cspan class=\"theory-note\">Складываем результаты\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Распределительный закон.\u003c/strong> Чтобы умножить число или выражение на сумму, умножаем его на каждое слагаемое и складываем результаты. В разности учитываем знак каждого члена.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Распределительный закон\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−3 · a = −3a\u003c/b>\u003cspan class=\"theory-note\">Первое произведение\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>−3 · (−2) = +6\u003c/b>\u003cspan class=\"theory-note\">Второе произведение\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>−3(a − 2) = −3a + 6\u003c/b>\u003cspan class=\"theory-note\">Результат\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Умножение действует на всю скобку.","anchorNote":"Удобно отмечать каждое полученное произведение.","tasks":[{"kind":"choice","q":"Раскрой скобки в 3x(x + 4).","answer":"3x² + 12x","see":"У скобки два члена.","similar":"2a(a + 5) = 2a² + 10a.","algorithm":"Умножение действует на всю скобку. Удобно отмечать каждое полученное произведение.","retry":"У скобки два члена.","steps":["У скобки два члена.","3x · x = 3x², 3x · 4 = 12x.","Ответ: 3x² + 12x."],"options":["3x² + 4","3x² + 12x","3x² + 12","3x + 12x"],"unit":""},{"kind":"choice","q":"Раскрой скобки в −2a(3a² − a + 4).","answer":"−6a³ + 2a² − 8a","see":"У множителя −2a отрицательный знак.","similar":"−x(a − b) = −ax + bx.","algorithm":"Умножение действует на всю скобку.","retry":"У множителя −2a отрицательный знак.","steps":["У множителя −2a отрицательный знак.","По очереди: −2a · 3a² = −6a³, −2a · (−a) = 2a², −2a · 4 = −8a.","Ответ: −6a³ + 2a² − 8a."],"options":["−6a³ − a + 4","−6a³ − 2a² − 8a","−6a³ + 2a² + 8a","−6a³ + 2a² − 8a"],"unit":""},{"kind":"choice","q":"Раскрой скобки в ½x(6x − 8).","answer":"3x² − 4x","see":"Половина умножается на оба коэффициента.","similar":"½a(4a + 2) = 2a² + a.","algorithm":"Умножение действует на всю скобку.","retry":"Половина умножается на оба коэффициента.","steps":["½ · 6 = 3, ½ · (−8) = −4.","Буквенные части x² и x.","Ответ: 3x² − 4x."],"options":["3x² − 8","6x² − 4x","3x² − 8x","3x² − 4x"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Упрости x(2x − 3) − 2x(x − 1).","answer":"−x","see":"Сначала получи два произведения, сохрани минус перед вторым.","similar":"a − 2(b − c) = a − 2b + 2c.","algorithm":"Умножение действует на всю скобку.","retry":"Сначала получи два произведения, сохрани минус перед вторым.","steps":["Получаем 2x² − 3x − 2x² + 2x.","Квадратичные члены исчезают, остаётся −x.","Ответ: −x."],"options":["x","−5x","4x² − x","−x"],"unit":""},{"kind":"choice","q":"Упрости 0 · (x² − 5x + 7).","answer":"0","see":"Перед скобкой множитель 0.","similar":"0 · (a − 2) = 0.","algorithm":"Умножение действует на всю скобку.","retry":"Перед скобкой множитель 0.","steps":["Ноль умножается на каждый член.","Все произведения равны нулю.","Ответ: 0."],"options":["x² − 5x + 7","x² − 5x","0","7"],"unit":""}]},{"name":"Произведение многочленов","subtitle":"Каждый на каждый","title":"Произведение многочленов","intro":"\u003cp>В (x + 1)(x + 4) первый x умножается на x и на 4. Число 1 тоже умножается на x и на 4. Из четырёх произведений получаем x² + 4x + x + 4 = x² + 5x + 4.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Произведение многочленов\">\u003ctable class=\"theory-grid\">\u003ccaption>Каждая клетка показывает произведение заголовков строки и столбца\u003c/caption>\u003cthead>\u003ctr>\u003ctd>·\u003c/td>\u003cth scope=\"col\">x\u003c/th>\u003cth scope=\"col\">4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">x\u003c/th>\u003ctd>x²\u003c/td>\u003ctd>4x\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">1\u003c/th>\u003ctd>x\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Двучлен и трёхчлен.\u003c/strong> Это многочлены, у которых после приведения подобных остаётся соответственно два или три члена.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Двучлен и трёхчлен\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x² − 5\u003c/b>\u003cspan class=\"theory-note\">Два члена: x² и −5\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x² + 2x + 1\u003c/b>\u003cspan class=\"theory-note\">Три члена: x², 2x и 1\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Умножение многочленов.\u003c/strong> Каждый член первой скобки умножаем на каждый член второй, затем складываем произведения и приводим подобные.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Умножение многочленов\">\u003ctable class=\"theory-grid\">\u003ccaption>Каждая клетка показывает произведение заголовков строки и столбца\u003c/caption>\u003cthead>\u003ctr>\u003ctd>·\u003c/td>\u003cth scope=\"col\">a\u003c/th>\u003cth scope=\"col\">b\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">a\u003c/th>\u003ctd>a²\u003c/td>\u003ctd>ab\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">−2b\u003c/th>\u003ctd>−2ab\u003c/td>\u003ctd>−2b²\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/figure>","anchor":"Проверь пары множителей, прежде чем приводить подобные.","anchorNote":"У двучлена и трёхчлена сначала получится шесть произведений.","tasks":[{"kind":"choice","q":"Раскрой (x + 2)(x + 3).","answer":"x² + 5x + 6","see":"Есть два смешанных произведения.","similar":"(a + 1)(a + 4) = a² + 4a + a + 4.","algorithm":"Проверь пары множителей, прежде чем приводить подобные. У двучлена и трёхчлена сначала получится шесть произведений.","retry":"Есть два смешанных произведения.","steps":["Есть два смешанных произведения.","Получаем x² + 3x + 2x + 6 = x² + 5x + 6.","Ответ: x² + 5x + 6."],"options":["x² + 5x + 6","x² + 5x + 5","x² + 6","x² + 6x + 5"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Раскрой (2x − 3)(x + 4).","answer":"2x² + 5x − 12","see":"Член −3 умножается на оба члена справа.","similar":"(a − 2)(a + 1) = a² + a − 2a − 2.","algorithm":"Проверь пары множителей, прежде чем приводить подобные.","retry":"Член −3 умножается на оба члена справа.","steps":["Произведения: 2x², 8x, −3x, −12.","Средние члены дают 5x.","Ответ: 2x² + 5x − 12."],"options":["2x² − 12","2x² + 5x + 12","2x² + 5x − 12","2x² + 11x − 12"],"unit":""},{"kind":"choice","q":"Раскрой (a − 2b)(a + 3b).","answer":"a² + ab − 6b²","see":"ab и ba подобны.","similar":"2ab − ba = ab.","algorithm":"Проверь пары множителей, прежде чем приводить подобные.","retry":"ab и ba подобны.","steps":["ab и ba подобны.","Получаем a² + 3ab − 2ba − 6b² = a² + ab − 6b².","Ответ: a² + ab − 6b²."],"options":["a² + ab − 6b²","a² − 6b²","a² + 5ab − 6b²","a² + ab − 6b"],"unit":""},{"kind":"choice","q":"Раскрой (x − 1)(x² + x + 1).","answer":"x³ − 1","see":"У каждого члена слева по три произведения.","similar":"a(b + c + d) = ab + ac + ad.","algorithm":"Проверь пары множителей, прежде чем приводить подобные.","retry":"У каждого члена слева по три произведения.","steps":["У каждого члена слева по три произведения.","x³ + x² + x − x² − x − 1 = x³ − 1.","Ответ: x³ − 1."],"options":["x³ − x² − x − 1","x³ − 1","x³ + x − 1","x³ + 1"],"expressionInput":true,"unit":""},{"kind":"number","q":"Чему равен коэффициент при x² после раскрытия (x² + 2x − 1)(x + 3)?","answer":5,"see":"Выдели произведения, которые дают x².","similar":"Для x² нужны показатели 2 и 0 либо 1 и 1.","algorithm":"Проверь пары множителей, прежде чем приводить подобные.","retry":"Выдели произведения, которые дают x².","steps":["x² · 3 даёт 3x², а 2x · x даёт 2x².","Коэффициент 3 + 2 = 5.","Ответ: 5."],"unit":""}]},{"name":"Формулы сокращённого умножения","subtitle":"Квадраты и кубы","title":"Формулы сокращённого умножения","intro":"\u003cp>Раскрой (x + 2)(x + 2). Получишь x² + 2x + 2x + 4. Два одинаковых средних произведения дают 4x. В (x − 2)(x + 2) средние произведения имеют противоположные знаки и исчезают.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Формулы сокращённого умножения\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x + 2)(x + 2)\u003c/b>\u003cspan class=\"theory-note\">Одинаковые скобки\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x + 2x = 4x\u003c/b>\u003cspan class=\"theory-note\">Средние члены складываются\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>(x − 2)(x + 2)\u003c/b>\u003cspan class=\"theory-note\">Знаки разные\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x − 2x = 0\u003c/b>\u003cspan class=\"theory-note\">Средние члены исчезают\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Формулы сокращённого умножения.\u003c/strong> Это равенства, которые позволяют сразу записать результат некоторых произведений.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Формулы сокращённого умножения\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x + 3)(x + 3)\u003c/b>\u003cspan class=\"theory-note\">Обычная запись произведения\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x + 3)²\u003c/b>\u003cspan class=\"theory-note\">Узнаём квадрат суммы\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x² + 6x + 9\u003c/b>\u003cspan class=\"theory-note\">Записываем по формуле\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Квадрат суммы и квадрат разности.\u003c/strong> Это произведение одинаковых скобок: (a + b)² = a² + 2ab + b², а (a − b)² = a² − 2ab + b².\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Квадрат суммы и квадрат разности\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x + 1)² → x² + 2x + 1\u003c/b>\u003cspan class=\"theory-note\">Средний член положительный\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>(x − 1)² → x² − 2x + 1\u003c/b>\u003cspan class=\"theory-note\">Средний член отрицательный\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Разность квадратов.\u003c/strong> Это выражение вида a² − b². Его можно записать как (a − b)(a + b).\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Разность квадратов\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(2y − 5)(2y + 5)\u003c/b>\u003cspan class=\"theory-note\">Разные знаки\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>+10y − 10y = 0\u003c/b>\u003cspan class=\"theory-note\">Смешанные произведения сокращаются\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>4y² − 25\u003c/b>\u003cspan class=\"theory-note\">Разность квадратов\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Куб суммы и куб разности.\u003c/strong> Это произведение трёх одинаковых скобок. Для суммы: (a + b)³ = a³ + 3a²b + 3ab² + b³. Для разности: (a − b)³ = a³ − 3a²b + 3ab² − b³.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Куб суммы и куб разности\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(a + b) · (a + b) · (a + b)\u003c/b>\u003cspan class=\"theory-note\">Три одинаковые скобки\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>a³\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3a²b\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3ab²\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>b³\u003c/b>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(a − b)³\u003c/b>\u003cspan class=\"theory-note\">Меняем знаки у членов с нечётной степенью b\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Определи, какое действие выполняется со всей скобкой.","anchorNote":"У разности в квадрате последний член положительный.","tasks":[{"kind":"choice","q":"Раскрой (3x + 2)².","answer":"9x² + 12x + 4","see":"Вспомни средний член.","similar":"(a + 1)² = a² + 2a + 1.","algorithm":"Определи, какое действие выполняется со всей скобкой. У разности в квадрате последний член положительный.","retry":"Вспомни средний член.","steps":["Вспомни средний член.","(3x)² = 9x², 2 · 3x · 2 = 12x, 2² = 4.","Ответ: 9x² + 12x + 4."],"options":["9x² + 4","9x² + 12x + 4","9x² + 6x + 4","3x² + 12x + 4"],"unit":""},{"kind":"choice","q":"Раскрой (2a − 3b)².","answer":"4a² − 12ab + 9b²","see":"Отрицательным будет средний член.","similar":"(a − 2)² = a² − 4a + 4.","algorithm":"Определи, какое действие выполняется со всей скобкой.","retry":"Отрицательным будет средний член.","steps":["Квадраты дают 4a² и 9b².","Средний член равен −2 · 2a · 3b = −12ab.","Ответ: 4a² − 12ab + 9b²."],"options":["4a² − 6ab + 9b²","4a² − 12ab + 9b²","4a² − 12ab − 9b²","4a² − 9b²"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Раскрой (5x − 2y)(5x + 2y).","answer":"25x² − 4y²","see":"В обеих скобках одни и те же члены с разными знаками перед вторым.","similar":"(a − 3)(a + 3) = a² − 9.","algorithm":"Определи, какое действие выполняется со всей скобкой.","retry":"В обеих скобках одни и те же члены с разными знаками перед вторым.","steps":["Смешанные члены взаимно уничтожаются.","Остаётся (5x)² − (2y)².","Ответ: 25x² − 4y²."],"options":["25x² + 4y²","25x² − 4y²","5x² − 2y²","25x² − 20xy + 4y²"],"unit":""},{"kind":"choice","q":"Раскрой (x − 2)³.","answer":"x³ − 6x² + 12x − 8","see":"Куб можно вычислить как квадрат, умноженный на ту же скобку.","similar":"(a − b)³ = a³ − 3a²b + 3ab² − b³.","algorithm":"Определи, какое действие выполняется со всей скобкой.","retry":"Куб можно вычислить как квадрат, умноженный на ту же скобку.","steps":["(x − 2)² = x² − 4x + 4.","Умножаем на x − 2 и складываем подобные: x³ − 6x² + 12x − 8.","Ответ: x³ − 6x² + 12x − 8."],"options":["x³ − 8","x³ − 2x² + 4x − 8","x³ − 6x² − 12x − 8","x³ − 6x² + 12x − 8"],"unit":""},{"kind":"choice","q":"Раскрой (2a + b)³.","answer":"8a³ + 12a²b + 6ab² + b³","see":"При возведении в куб учитывай коэффициент 2 внутри 2a.","similar":"(u + v)³ = u³ + 3u²v + 3uv² + v³.","algorithm":"Определи, какое действие выполняется со всей скобкой.","retry":"При возведении в куб учитывай коэффициент 2 внутри 2a.","steps":["Подставляем u = 2a и v = b.","Смешанные члены: 3 · 4a²b и 3 · 2ab².","Ответ: 8a³ + 12a²b + 6ab² + b³."],"options":["8a³ + 12a²b − 6ab² + b³","8a³ + b³","8a³ + 6a²b + 3ab² + b³","8a³ + 12a²b + 6ab² + b³"],"unit":""}]},{"name":"Вынесение множителя","subtitle":"Деление и группировка","title":"Вынесение множителя","intro":"\u003cp>В 6x² + 9x оба члена делятся на 3x при x ≠ 0. Если вынести 3x перед скобками, внутри останутся 2x и 3. Равенство 6x² + 9x = 3x(2x + 3) верно и при x = 0: обе части равны нулю.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Вынесение множителя\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3x · 2x\u003c/b>\u003cspan class=\"theory-note\">Первый член\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3x · 3\u003c/b>\u003cspan class=\"theory-note\">Второй член\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3x(2x + 3)\u003c/b>\u003cspan class=\"theory-note\">Пишем общий множитель один раз\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Разложение на множители.\u003c/strong> Это запись выражения в виде произведения. Общим множителем называют множитель, который входит в каждый член. При вынесении общего множителя его пишут перед скобками один раз.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Разложение на множители\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>10a² + 15a\u003c/b>\u003cspan class=\"theory-note\">Исходная сумма\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5a\u003c/b>\u003cspan class=\"theory-note\">Есть в обоих членах\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>5a(2a + 3)\u003c/b>\u003cspan class=\"theory-note\">Запись произведением\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Группировка.\u003c/strong> Это способ разложения, при котором члены собирают в группы. Например, в 2x + 2y + 3ax + 3ay первые два члена дают 2(x + y), последние два дают 3a(x + y). Теперь общую скобку x + y можно вынести.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Группировка\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x + 2y\u003c/b>\u003cspan class=\"theory-note\">Выносим 2\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>3ax + 3ay\u003c/b>\u003cspan class=\"theory-note\">Выносим 3a\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2(x + y) + 3a(x + y)\u003c/b>\u003cspan class=\"theory-note\">Появилась общая скобка\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(2 + 3a)(x + y)\u003c/b>\u003cspan class=\"theory-note\">Выносим скобку\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"У общей буквы бери наименьший показатель.","anchorNote":"Проверь результат раскрытием скобок.","tasks":[{"kind":"choice","q":"Вынеси наибольший общий одночлен с положительным целым коэффициентом из 12x³y − 18x²y².","answer":"6x²y(2x − 3y)","see":"Найди НОД чисел 12 и 18. Для каждой буквы сравни её показатели.","similar":"8a² − 12a = 4a(2a − 3).","algorithm":"У общей буквы бери наименьший показатель. Проверь результат раскрытием скобок.","retry":"Найди НОД чисел 12 и 18. Для каждой буквы сравни её показатели.","steps":["НОД равен 6.","Минимальные показатели x и y равны 2 и 1.","После деления остаются 2x и −3y.","Ответ: 6x²y(2x − 3y)."],"options":["6xy(2x − 3y)","6x³y(2 − 3y)","6x²y(2x − 3y)","6x²y(2x + 3y)"],"unit":""},{"kind":"choice","q":"Вынеси именно −3a из −6a² + 9a.","answer":"−3a(2a − 3)","see":"Раздели оба члена на отрицательный одночлен.","similar":"−2x² + 4x = −2x(x − 2).","algorithm":"У общей буквы бери наименьший показатель.","retry":"Раздели оба члена на отрицательный одночлен.","steps":["−6a²/(−3a) даёт 2a, а 9a/(−3a) даёт −3.","Получаем −3a(2a − 3).","Ответ: −3a(2a − 3)."],"options":["−3a(−2a + 3)","−3a(2a − 9)","−3a(2a + 3)","−3a(2a − 3)"],"unit":""},{"kind":"choice","q":"Разложи ax + ay + bx + by на множители.","answer":"(a + b)(x + y)","see":"Начни с групп ax + ay и bx + by.","similar":"ac + ad + bc + bd = a(c + d) + b(c + d).","algorithm":"У общей буквы бери наименьший показатель.","retry":"Начни с групп ax + ay и bx + by.","steps":["После группировки имеем a(x + y) + b(x + y).","Выносим общую скобку x + y.","Ответ: (a + b)(x + y)."],"options":["(a + x)(b + y)","(a + b)(x + y)","(a − b)(x + y)","(a + b)xy"],"unit":""},{"kind":"choice","q":"Разложи x(a − b) + y(b − a).","answer":"(x − y)(a − b)","see":"В скобках противоположные выражения.","similar":"3 − z = −(z − 3).","algorithm":"У общей буквы бери наименьший показатель.","retry":"В скобках противоположные выражения.","steps":["Заменяем b − a на −(a − b).","Из x(a − b) − y(a − b) выносим общую скобку.","Ответ: (x − y)(a − b)."],"options":["(x − y)(a − b)","(x − y)(a + b)","xy(a − b)","(x + y)(a − b)"],"unit":""},{"kind":"choice","q":"Упрости (6x³ − 9x² + 3x)/(3x), если x ≠ 0.","answer":"2x² − 3x + 1","see":"Делитель относится ко всему числителю.","similar":"(4a² + 2a)/(2a) = 2a + 1 при a ≠ 0.","algorithm":"У общей буквы бери наименьший показатель.","retry":"Делитель относится ко всему числителю.","steps":["Делитель относится ко всему числителю.","Частные по членам: 6x³/(3x) = 2x², −9x²/(3x) = −3x, 3x/(3x) = 1.","Ответ: 2x² − 3x + 1."],"options":["2x² − 3x + x","2x² − 3x","2x² − 9x² + 3x","2x² − 3x + 1"],"unit":""}]},{"name":"Разложение по формулам","subtitle":"Обратное действие","title":"Разложение по формулам","intro":"\u003cp>В записи x² − 9 число 9 можно представить как 3². Получаем x² − 3², поэтому подходит произведение (x − 3)(x + 3). В записи x² + 6x + 9 число 6x равно 2 · x · 3, поэтому подходит квадрат (x + 3)².\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Разложение по формулам\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x² − 9\u003c/b>\u003cspan class=\"theory-note\">Два квадрата с минусом\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x − 3)(x + 3)\u003c/b>\u003cspan class=\"theory-note\">Разные скобки\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x² + 6x + 9\u003c/b>\u003cspan class=\"theory-note\">Три члена: проверяем 6x\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(x + 3)²\u003c/b>\u003cspan class=\"theory-note\">Две одинаковые скобки\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Полный квадрат двучлена.\u003c/strong> Это выражение, которое можно записать как (a + b)² или (a − b)². У крайних членов проверяем квадраты, у среднего проверяем удвоенное произведение со знаком.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Полный квадрат двучлена\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(2x)²\u003c/b>\u003cspan class=\"theory-note\">Квадрат первого\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>+2 · 2x · 1\u003c/b>\u003cspan class=\"theory-note\">Удвоенное произведение\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>1²\u003c/b>\u003cspan class=\"theory-note\">Квадрат второго\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(2x + 1)²\u003c/b>\u003cspan class=\"theory-note\">Все три части совпали\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Сумма и разность кубов.\u003c/strong> Это выражения вида a³ + b³ и a³ − b³. Для суммы: a³ + b³ = (a + b)(a² − ab + b²). Для разности: a³ − b³ = (a − b)(a² + ab + b²).\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Сумма и разность кубов\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>a³ + b³\u003c/b>\u003cspan class=\"theory-note\">В первой скобке плюс\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(a + b)(a² − ab + b²)\u003c/b>\u003cspan class=\"theory-note\">В середине второй скобки минус\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>a³ − b³\u003c/b>\u003cspan class=\"theory-note\">В первой скобке минус\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(a − b)(a² + ab + b²)\u003c/b>\u003cspan class=\"theory-note\">В середине второй скобки плюс\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"В формуле кубов сначала найди основания кубов.","anchorNote":"При разложении полного квадрата проверь средний член.","tasks":[{"kind":"choice","q":"Разложи 9x² − 16y².","answer":"(3x − 4y)(3x + 4y)","see":"Представь каждый член как квадрат.","similar":"4a² − 1 = (2a − 1)(2a + 1).","algorithm":"В формуле кубов сначала найди основания кубов. При разложении полного квадрата проверь средний член.","retry":"Представь каждый член как квадрат.","steps":["9x² = (3x)², 16y² = (4y)².","Подставляем 3x и 4y в формулу разности квадратов.","Ответ: (3x − 4y)(3x + 4y)."],"options":["(3x − 4y)(3x + 4y)","(9x − 16y)(9x + 16y)","(3x − 4y)(3x + 4)","(3x − 4y)²"],"unit":""},{"kind":"choice","q":"Представь 4x² − 12xy + 9y² квадратом двучлена.","answer":"(2x − 3y)²","see":"Средний член должен равняться удвоенному произведению оснований со знаком минус.","similar":"a² − 8a + 16 = (a − 4)².","algorithm":"В формуле кубов сначала найди основания кубов.","retry":"Средний член должен равняться удвоенному произведению оснований со знаком минус.","steps":["Крайние члены дают 2x и 3y.","Проверяем: −2 · 2x · 3y = −12xy.","Ответ: (2x − 3y)²."],"options":["(2x − 6y)²","(2x − 3y)²","(4x − 9y)²","(2x + 3y)²"],"unit":""},{"kind":"choice","q":"Разложи 8x³ + 27.","answer":"(2x + 3)(4x² − 6x + 9)","see":"8x³ и 27 являются кубами.","similar":"a³ + 1 = (a + 1)(a² − a + 1).","algorithm":"В формуле кубов сначала найди основания кубов.","retry":"8x³ и 27 являются кубами.","steps":["Основания 2x и 3.","В трёхчлене получаем 4x² − (2x · 3) + 9.","Ответ: (2x + 3)(4x² − 6x + 9)."],"options":["(2x + 3)(4x² + 6x + 9)","(2x + 3)(4x² − 6x + 9)","(2x + 3)³","(2x − 3)(4x² + 6x + 9)"],"unit":""},{"kind":"choice","q":"Разложи 64a³ − b³.","answer":"(4a − b)(16a² + 4ab + b²)","see":"Разность кубов даёт разность в первой скобке.","similar":"x³ − 8 = (x − 2)(x² + 2x + 4).","algorithm":"В формуле кубов сначала найди основания кубов.","retry":"Разность кубов даёт разность в первой скобке.","steps":["Берём основания 4a и b.","В трёхчлене средний член +4ab, последний +b².","Ответ: (4a − b)(16a² + 4ab + b²)."],"options":["(4a + b)(16a² − 4ab + b²)","(4a − b)³","(4a − b)(16a² − 4ab + b²)","(4a − b)(16a² + 4ab + b²)"],"unit":""},{"kind":"choice","q":"Разложи 3x³ − 27x, применив две операции.","answer":"3x(x − 3)(x + 3)","see":"Начни с общего множителя 3x.","similar":"2a³ − 8a = 2a(a² − 4) = 2a(a − 2)(a + 2).","algorithm":"В формуле кубов сначала найди основания кубов.","retry":"Начни с общего множителя 3x.","steps":["Выносим 3x, получаем x² − 9.","Раскладываем эту разность квадратов.","Ответ: 3x(x − 3)(x + 3)."],"options":["3x(x² + 9)","3x(x − 3)²","3x(x − 3)(x + 3)","3x(x − 9)(x + 9)"],"unit":""},{"kind":"choice","q":"Можно ли применить формулу разности квадратов к x² + 9?","answer":"Нет, здесь сумма квадратов","see":"Проверь знак между квадратами.","similar":"(a − 2)(a + 2) даёт a² − 4.","algorithm":"В формуле кубов сначала найди основания кубов.","retry":"Проверь знак между квадратами.","steps":["Формула требует минуса.","При раскрытии предложенных произведений выходит x² − 9 либо x² + 6x + 9.","Ответ: Нет, здесь сумма квадратов."],"options":["Да, получится (x + 3)²","Нет, здесь сумма квадратов","Да, получится (x − 3)(x + 3)"],"unit":""}]},{"name":"Применение","subtitle":"Подстановка и уравнения","title":"Применение","intro":"\u003cp>Чтобы вычислить x² − 3x при x = −2, вместо каждого x поставь (−2). Получишь (−2)² − 3 · (−2) = 4 + 6 = 10. Скобки показывают, что в квадрат возводится всё число −2.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Применение\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x² − 3x\u003c/b>\u003cspan class=\"theory-note\">Два места с x\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>(−2)² − 3 · (−2)\u003c/b>\u003cspan class=\"theory-note\">На обоих местах ставим (−2)\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>4 + 6 = 10\u003c/b>\u003cspan class=\"theory-note\">Вычисляем\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Подстановка.\u003c/strong> Это замена переменной заданным числом или выражением.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Подстановка\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2y + 1\u003c/b>\u003cspan class=\"theory-note\">Место переменной y\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2 · 3 + 1\u003c/b>\u003cspan class=\"theory-note\">Подставляем y = 3\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>7\u003c/b>\u003cspan class=\"theory-note\">Значение выражения\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Уравнение и его корень.\u003c/strong> Уравнение содержит неизвестное. Его корень — значение неизвестного, при котором левая и правая части равны.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Уравнение и его корень\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3x + 2 = 11\u003c/b>\u003cspan class=\"theory-note\">Проверяем x = 3\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>3 · 3 + 2 = 11\u003c/b>\u003cspan class=\"theory-note\">Левая часть\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>11 = 11\u003c/b>\u003cspan class=\"theory-note\">Равенство верно, 3 является корнем\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Тождество.\u003c/strong> Это равенство, которое выполняется при всех допустимых значениях переменных. Например, 2(x + 1) = 2x + 2 верно при любом x.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Тождество\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2(x + 1)\u003c/b>\u003cspan class=\"theory-note\">Левая запись\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>2x + 2\u003c/b>\u003cspan class=\"theory-note\">Раскрываем скобки\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>2x + 2\u003c/b>\u003cspan class=\"theory-note\">Правая запись уже такая же\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"Проверь знак после подстановки.","anchorNote":"В уравнении следи, какие члены исчезают в обеих частях.","tasks":[{"kind":"number","q":"Вычисли −2x² + 3x − 1 при x = −2.","answer":-15,"see":"Квадрат относится к x.","similar":"−3(−2)² = −12.","algorithm":"Проверь знак после подстановки. В уравнении следи, какие члены исчезают в обеих частях.","retry":"Квадрат относится к x.","steps":["(−2)² = 4.","Получаем −2 · 4 + 3 · (−2) − 1 = −8 − 6 − 1 = −15.","Ответ: -15."],"unit":""},{"kind":"number","q":"Вычисли (x + 5)(x − 5) − x² при x = 79.","answer":-25,"see":"Вычислять 79² необязательно: сначала раскрой скобки.","similar":"(a + 2)(a − 2) − a² = −4.","algorithm":"Проверь знак после подстановки.","retry":"Вычислять 79² необязательно: сначала раскрой скобки.","steps":["Произведение равно x² − 25.","После вычитания x² остаётся −25 при любом x.","Ответ: -25."],"unit":""},{"kind":"number","q":"Реши уравнение (x + 2)(x − 3) = x² + 4.","answer":-10,"see":"Раскрой скобки и сравни обе части.","similar":"Если x² + x = x² − 4, после вычитания x² получим x = −4.","algorithm":"Проверь знак после подстановки.","retry":"Раскрой скобки и сравни обе части.","steps":["Слева x² − x − 6.","После вычитания x² получаем −x − 6 = 4.","Значит, −x = 10 и x = −10.","Ответ: -10."],"unit":""},{"kind":"number","q":"Найди k, если 2(x² + kx − 3) тождественно равно 2x² − 10x − 6.","answer":-5,"see":"Сравни коэффициенты при x.","similar":"Если 3(a + mx) = 3a + 12x для всех x, то 3m = 12.","algorithm":"Проверь знак после подстановки.","retry":"Сравни коэффициенты при x.","steps":["Раскрываем скобки: 2x² + 2kx − 6.","Сравниваем 2k и −10: k = −5.","Ответ: -5."],"unit":""},{"kind":"choice","q":"Стороны прямоугольника равны x + 3 и x + 5. Запиши его площадь как многочлен.","answer":"x² + 8x + 15","see":"Площадь прямоугольника равна произведению сторон.","similar":"Для сторон a и a + 1 площадь равна a(a + 1) = a² + a.","algorithm":"Проверь знак после подстановки.","retry":"Площадь прямоугольника равна произведению сторон.","steps":["Площадь прямоугольника равна произведению сторон.","Умножаем (x + 3)(x + 5) = x² + 5x + 3x + 15 = x² + 8x + 15.","Ответ: x² + 8x + 15."],"options":["x² + 8x + 15","2x + 8","x² + 15x + 8","x² + 15"],"unit":""}]},{"name":"Итоговые ловушки","subtitle":"Найди ошибку","title":"Итоговые ловушки","intro":"\u003cp>Проверь запись (x + 2)² = x² + 4. При x = 0 обе части равны 4. При x = 1 слева получается 9, справа 5. Одного несовпадения достаточно, чтобы опровергнуть равенство для всех x.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема к объяснению. Итоговые ловушки\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x = 0\u003c/b>\u003cspan class=\"theory-note\">Левая и правая части равны 4\u003c/span>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cb>x = 1\u003c/b>\u003cspan class=\"theory-note\">Левая часть 9, правая 5\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>9 ≠ 5\u003c/b>\u003cspan class=\"theory-note\">Равенство выполняется не при всех x\u003c/span>\u003c/div>\u003c/div>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Контрпример.\u003c/strong> Это конкретный пример, на котором проверяемое общее утверждение оказывается неверным.\u003c/p>\u003cfigure class=\"theory-figure\" aria-label=\"Схема. Контрпример\">\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x² + x = x²\u003c/b>\u003cspan class=\"theory-note\">Проверяем утверждение\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>x = 2\u003c/b>\u003cspan class=\"theory-note\">Выбираем значение\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"theory-arrow\" aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"theory-row\">\u003cdiv class=\"theory-cell\">\u003cb>6 ≠ 4\u003c/b>\u003cspan class=\"theory-note\">Одного несовпадения достаточно\u003c/span>\u003c/div>\u003c/div>\u003c/figure>","anchor":"В сложном выражении сначала выдели отдельные действия.","anchorNote":"Один числовой пример может опровергнуть неверное тождество.","tasks":[{"kind":"choice","q":"Ученик пишет: 2x³ + 3x² = 5x⁵. Как исправить?","answer":"Оставить 2x³ + 3x²","see":"Действие между членами: сложение.","similar":"a³ + a² содержит два неподобных члена.","algorithm":"В сложном выражении сначала выдели отдельные действия. Один числовой пример может опровергнуть неверное тождество.","retry":"Действие между членами: сложение.","steps":["Показатели 3 и 2 различны.","При сложении эти члены остаются в стандартной записи.","Ответ: Оставить 2x³ + 3x²."],"options":["Заменить на 6x⁵","Заменить на 5x²","Оставить 2x³ + 3x²","Заменить на 5x³"],"unit":""},{"kind":"choice","q":"Упрости −(x − 2)² + (x − 2)(x + 2).","answer":"4x − 8","see":"Перед первым квадратом минус. Во втором произведении применима разность квадратов.","similar":"−(a − 1)² = −a² + 2a − 1.","algorithm":"В сложном выражении сначала выдели отдельные действия.","retry":"Перед первым квадратом минус. Во втором произведении применима разность квадратов.","steps":["Перед первым квадратом минус. Во втором произведении применима разность квадратов.","Получаем −x² + 4x − 4 + x² − 4 = 4x − 8.","Ответ: 4x − 8."
