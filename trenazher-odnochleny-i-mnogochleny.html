],"options":["4x − 8","0","−4x","4x"],"expressionInput":true,"unit":""},{"kind":"choice","q":"Какой одночлен пропущен, если (a − 3b)² = a² + □ + 9b²?","answer":"−6ab","see":"Ищи удвоенное произведение.","similar":"В (x − 2y)² средний член равен −4xy.","algorithm":"В сложном выражении сначала выдели отдельные действия.","retry":"Ищи удвоенное произведение.","steps":["−2 · a · 3b = −6ab.","Квадраты уже записаны.","Ответ: −6ab."],"options":["−6ab","−9ab²","−3ab","6ab"],"unit":""},{"kind":"number","q":"Найди степень после упрощения (x² + 1)(x² − 1) − x⁴ + 2x³.","answer":3,"see":"Посмотри, сокращаются ли члены четвёртой степени.","similar":"(a + 2)(a − 2) − a² = −4.","algorithm":"В сложном выражении сначала выдели отдельные действия.","retry":"Посмотри, сокращаются ли члены четвёртой степени.","steps":["Первое произведение равно x⁴ − 1.","После вычитания x⁴ остаётся 2x³ − 1, степень 3.","Ответ: 3."],"unit":""},{"kind":"choice","q":"Какое число опровергает равенство (x + 3)² = x² + 9?","answer":"1","see":"Подставь по очереди предложенные значения.","similar":"Чтобы опровергнуть тождество, достаточно одного несовпадения.","algorithm":"В сложном выражении сначала выдели отдельные действия.","retry":"Подставь по очереди предложенные значения.","steps":["При x = 1 слева 16, справа 10.","При x = 0 обе части равны 9.","Ответ: 1."],"options":["1","0"],"unit":""},{"kind":"choice","q":"Разложи полностью x⁴ − 16 над действительными числами.","answer":"(x − 2)(x + 2)(x² + 4)","see":"Проверь, можно ли продолжить после первого применения формулы.","similar":"a⁴ − 1 = (a² − 1)(a² + 1), затем a² − 1 = (a − 1)(a + 1).","algorithm":"В сложном выражении сначала выдели отдельные действия.","retry":"Проверь, можно ли продолжить после первого применения формулы.","steps":["x⁴ − 16 = (x² − 4)(x² + 4).","Первый множитель раскладывается на (x − 2)(x + 2), а x² + 4 положителен при любом действительном x.","Ответ: (x − 2)(x + 2)(x² + 4)."],"options":["(x − 2)²(x + 2)²","(x − 4)(x + 4)","(x − 2)(x + 2)(x² + 4)","(x² − 4)(x² + 4)"],"unit":""}]}],"recap":["При сложении подобных складывай коэффициенты, сохраняя буквенную часть.","При умножении степеней одного основания складывай показатели. При возведении степени в степень умножай их.","Минус перед скобками меняет знак каждого члена.","Для степени многочлена сначала приведи подобные и проверь, какие члены остались.","При разложении начни с общего множителя. Затем проверь формулы и возможность группировки."],"lab":{"title":"Одинаковые буквы, разные действия","intro":"Переключи пример и сравни, как меняются коэффициенты и показатели.","cases":[{"label":"Сложение","html":"\u003cp class=\"formula-demo\">\u003cb>2x²\u003c/b> + \u003cem>3x²\u003c/em> = (2 + 3)x² = \u003cstrong>5x²\u003c/strong>\u003c/p>\u003cp>Оба слагаемых содержат x². Складываем коэффициенты.\u003c/p>"},{"label":"Умножение","html":"\u003cp class=\"formula-demo\">\u003cb>2x²\u003c/b> · \u003cem>3x²\u003c/em> = (2 · 3)x²⁺² = \u003cstrong>6x⁴\u003c/strong>\u003c/p>\u003cp>Коэффициенты умножаем. Показатели одинакового основания складываем.\u003c/p>"},{"label":"Возведение в степень","html":"\u003cp class=\"formula-demo\">(\u003cb>2x²\u003c/b>)³ = 2³ · x\u003csup>2 · 3\u003c/sup> = \u003cstrong>8x⁶\u003c/strong>\u003c/p>\u003cp>Коэффициент возводим в куб. Показатели 2 и 3 умножаем.\u003c/p>"},{"label":"Минус перед скобками","html":"\u003cp class=\"formula-demo\">−(\u003cb>2x²\u003c/b> − \u003cem>3x\u003c/em> + 4) = \u003cstrong>−2x² + 3x − 4\u003c/strong>\u003c/p>\u003cp>Все три члена умножаются на −1.\u003c/p>"}]}};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();

  <script>(function(){
  'use strict';
  const C=window.TrainerCourse,KEY='lili-trainer-'+C.id+'-'+(C.version||1)+(window.LiliStudy?.suffix||''),TOTAL=C.total;
  let storageOK=true,view='lesson',hints=new Set(),feedback=null,labIndex=0;
  const blank=()=>({stage:0,task:0,solved:[],attempts:{},answers:{}});

  function loadProgress(){
    const current = localStorage.getItem(KEY);
    if(current!==null)return JSON.parse(current);
    const previousKey='lili-trainer-'+C.id+'-1'+(window.LiliStudy?.suffix||'');
    const previous=JSON.parse(localStorage.getItem(previousKey));
    if(!previous||!Array.isArray(previous.solved))return null;
    const moveKey=k=>/^1-[0-5]$/.test(k)?'1-'+(Number(k.slice(2))+2):k;
    const moveEntries=entries=>Object.fromEntries(Object.entries(entries||{}).map(([k,v])=>[moveKey(k),v]));
    const upgraded={...previous,task:previous.stage===1?previous.task+2:previous.task,
      solved:previous.solved.map(moveKey),attempts:moveEntries(previous.attempts),answers:moveEntries(previous.answers)};
    try{localStorage.setItem(KEY,JSON.stringify(upgraded));}catch{}
    return upgraded;
  }
  function readState(){try{const s=loadProgress();if(!s||!Number.isInteger(s.stage)||s.stage<0||s.stage>=C.stages.length)return blank();return {stage:s.stage,task:Number.isInteger(s.task)&&s.task>=0&&s.task<C.stages[s.stage].tasks.length?s.task:0,solved:Array.isArray(s.solved)?s.solved.filter(k=>validKey(k)):[],attempts:s.attempts&&typeof s.attempts==='object'?s.attempts:{},answers:s.answers&&typeof s.answers==='object'?s.answers:{}};}catch(e){storageOK=false;return blank();}}
  function validKey(k){if(typeof k!=='string')return false;const a=k.split('-').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&C.stages[a[0]]&&C.stages[a[0]].tasks[a[1]];}
  let state=readState();state.solved=[...new Set(state.solved)];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const number = /\d+(?:[.,]\d+)?/.source;
  const coefficient = `(?:${number}(?:\\s*/\\s*[−-]?${number})?)`;
  const scalar = `[+−-]?(?:${coefficient}(?:[xykb]|kx)?|kx|[xykb])`;
  const term = `(?:\\(${scalar}\\)|${scalar})`;
  const point = `\\(\\s*[−-]?${number}\\s*;\\s*[−-]?${number}\\s*\\)`;
  const expression = new RegExp(`(?<![A-Za-z0-9])(?:${point}|${term}(?:\\s*[=<>≤≥+−·×:/÷*-]\\s*${term})+)(?![A-Za-z0-9])`,'g');
  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>
    [...token].map(letter => `<span class="math-var-${letter}">${letter}</span>`).join(''));
  function mathText(value) {
    const text = String(value);
    let result = '', end = 0;
    for (const match of text.matchAll(expression)) {
      result += colorVariables(text.slice(end,match.index));
      result += `<span class="math-nowrap">${colorVariables(match[0])}</span>`;
      end = match.index + match[0].length;
    }
    return result + colorVariables(text.slice(end));
  }
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${esc(s.name)}<small>${n} / ${s.tasks.length} · ${esc(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${t.visual}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Это задание уже получилось.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} / ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${esc(s.title)}</h2><div class="intro-content">${s.intro}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Можно использовать запятую, точку или дробь вида 3/4.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно. Получилось!',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();scrollToLesson();}
  function goTask(i, keepPosition=false){state.task=i;feedback=null;hints.clear();save();render();if(keepPosition){const question=$('#question-text');question.tabIndex=-1;question.focus({preventScroll:true});}else scrollToLesson();}
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1,true);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${esc(lab.title)}</h2><p class="lab-note">${esc(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${esc(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${c.html}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
