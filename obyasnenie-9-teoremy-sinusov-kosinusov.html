 "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен sin 30°?</p>", "a": 2, "why": "<span class=\"nb fm\">sin 30° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span>", "h": ["Найди 30° в верхней строке таблицы."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>"], "back": 20, "n": 24, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · какие бывают углы", "body": "<p>Угол меньше 90° называется острым, равный 90° — прямым, больше 90°, но меньше 180°, — тупым. Угол 180° называется развёрнутым.</p><p>В треугольнике может быть один тупой угол, например 120°.</p><div class=\"fig\"><svg viewBox=\"0 0 410 165\" width=\"410\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"36.0\" y1=\"95.0\" x2=\"84.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"36.0\" y1=\"95.0\" x2=\"72.8\" y2=\"64.1\" class=\"acc\" /><path d=\"M 53.0 95.0 A 17 17 0 0 0 49.0 84.1\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"56.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">острый</text><text x=\"56.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">40°</text><line x1=\"136.0\" y1=\"95.0\" x2=\"184.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"136.0\" y1=\"95.0\" x2=\"136.0\" y2=\"47.0\" class=\"acc\" /><path d=\"M 153.0 95.0 A 17 17 0 0 0 136.0 78.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"156.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">прямой</text><text x=\"156.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">90°</text><line x1=\"236.0\" y1=\"95.0\" x2=\"284.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"236.0\" y1=\"95.0\" x2=\"212.0\" y2=\"53.4\" class=\"acc\" /><path d=\"M 253.0 95.0 A 17 17 0 0 0 227.5 80.3\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"256.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">тупой</text><text x=\"256.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">120°</text><line x1=\"341.0\" y1=\"95.0\" x2=\"389.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"341.0\" y1=\"95.0\" x2=\"293.0\" y2=\"95.0\" class=\"acc\" /><text x=\"361.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">развёрнутый</text><text x=\"361.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">180°</text></svg></div>", "h": "Какие бывают углы", "n": 25, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Какой из этих углов тупой?</p>", "a": 3, "why": "Тупой угол больше 90°, но меньше 180°. Из трёх вариантов это 120°.", "h": ["Тупой угол больше прямого."], "opts": ["45°", "90°", "120°"], "back": 24, "n": 26, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · зачем", "body": "<p>До сих пор синус и косинус мы находили в прямоугольном треугольнике, где все остальные углы острые. А в обычном треугольнике может быть тупой угол, и для него нужен свой способ.</p><p>Придумаем, как находить синус и косинус любого угла от 0° до 180°. Для этого нарисуем полуокружность.</p><div class=\"fig\"><svg viewBox=\"0 0 330 195\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"20.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" class=\"ln\" /><line x1=\"160.0\" y1=\"150.0\" x2=\"160.0\" y2=\"22.0\" class=\"gr\" /><path d=\"M 290.0 150.0 A 130 130 0 0 0 30.0 150.0\" class=\"ln\" style=\"stroke-width:2\"/><line x1=\"160.0\" y1=\"150.0\" x2=\"234.6\" y2=\"43.5\" class=\"acc\" /><line x1=\"234.6\" y1=\"43.5\" x2=\"234.6\" y2=\"150.0\" class=\"ln\" stroke-dasharray=\"5 4\"/><circle cx=\"234.6\" cy=\"43.5\" r=\"5\" class=\"dot\"/><path d=\"M 190.0 150.0 A 30 30 0 0 0 177.2 125.4\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"201.5\" y=\"140.5\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"254.4\" y=\"28.8\" class=\"tx\" text-anchor=\"middle\">M(x; y)</text><text x=\"197.3\" y=\"169.0\" class=\"tx\" text-anchor=\"middle\">x</text><text x=\"245.6\" y=\"101.8\" class=\"tx\" text-anchor=\"middle\">y</text><text x=\"30.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">−1</text><text x=\"160.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">0</text><text x=\"290.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">1</text></svg></div><div class=\"gcap\">Полуокружность радиуса 1</div>", "n": 27, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · полуокружность", "body": "<p>Нарисуем полуокружность радиуса 1. Центр поставим в точку 0. Угол α отложим от правой части горизонтальной линии, поворачивая против часовой стрелки.</p><p>Луч упрётся в точку M. У этой точки две координаты: x — на сколько она сдвинута вправо или влево от центра, y — на сколько поднята вверх.</p><div class=\"fig\"><svg viewBox=\"0 0 330 195\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"20.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" class=\"ln\" /><line x1=\"160.0\" y1=\"150.0\" x2=\"160.0\" y2=\"22.0\" class=\"gr\" /><path d=\"M 290.0 150.0 A 130 130 0 0 0 30.0 150.0\" class=\"ln\" style=\"stroke-width:2\"/><line x1=\"160.0\" y1=\"150.0\" x2=\"234.6\" y2=\"43.5\" class=\"acc\" /><line x1=\"234.6\" y1=\"43.5\" x2=\"234.6\" y2=\"150.0\" class=\"ln\" stroke-dasharray=\"5 4\"/><circle cx=\"234.6\" cy=\"43.5\" r=\"5\" class=\"dot\"/><path d=\"M 190.0 150.0 A 30 30 0 0 0 177.2 125.4\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"201.5\" y=\"140.5\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"254.4\" y=\"28.8\" class=\"tx\" text-anchor=\"middle\">M(x; y)</text><text x=\"197.3\" y=\"169.0\" class=\"tx\" text-anchor=\"middle\">x</text><text x=\"245.6\" y=\"101.8\" class=\"tx\" text-anchor=\"middle\">y</text><text x=\"30.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">−1</text><text x=\"160.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">0</text><text x=\"290.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">1</text></svg></div><div class=\"gcap\">Полуокружность радиуса 1</div>", "h": "Полуокружность радиуса 1", "box": "<span class=\"nb\">cos α = x (</span>абсцисса точки M)<br><span class=\"nb\">sin α = y (</span>ордината точки M)", "n": 28, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · это то же самое", "body": "<p>Для острого угла получается то же самое, что мы знали. Гипотенуза здесь равна радиусу, то есть 1, поэтому <span class=\"nb\">sin α =</span> противолежащий катет : <span class=\"nb\">1 = y</span>, а <span class=\"nb\">cos α =</span> прилежащий катет : <span class=\"nb\">1 = x</span>.</p><p>Мы ничего не поменяли: просто взяли старое определение и сделали так, чтобы оно работало и для тупых углов.</p>", "say": "recall", "n": 29, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "2 · Углы больше 90° · попробуй сам", "key": "semi", "h": "Двигаем точку по полуокружности", "n": 30, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · что показал рисунок", "body": "<p>Пока угол острый, точка справа от центра: x больше нуля, поэтому cos положительный.</p><p>При 90° точка прямо над центром: <span class=\"nb\">x = 0</span>, значит, <span class=\"nb\">cos 90° = 0</span>.</p><p>Когда угол тупой, точка уходит влево: x становится отрицательным, и косинус тоже. Число может быть меньше нуля, это нормально.</p><p>А высота y всегда не меньше нуля, поэтому синус никогда не бывает отрицательным.</p>", "box": "Тупой угол: <span class=\"nb fm\">cos α &lt; 0,</span> а <span class=\"nb fm\">sin α &gt; 0</span>", "say": "key", "n": 31, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Угол равен 120°. Какой знак у cos 120°?</p>", "a": 2, "why": "Угол тупой, точка слева от центра, <span class=\"nb\">x &lt; 0</span>. Значит, косинус отрицательный.", "h": ["Посмотри, справа или слева от центра лежит точка при таком угле."], "opts": ["плюс", "минус", "ноль"], "back": 30, "n": 32, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · парные углы", "body": "<p>Углы 60° и 120° вместе дают 180°. Их точки на полуокружности стоят симметрично, как отражение в зеркале, которое стоит вертикально.</p><p>У симметричных точек высота одинакова, а x отличаются только знаком. Двигай угол и смотри на пару точек.</p><div class=\"fig\"><svg viewBox=\"0 0 330 195\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"20.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" class=\"ln\" /><line x1=\"160.0\" y1=\"150.0\" x2=\"160.0\" y2=\"22.0\" class=\"gr\" /><path d=\"M 290.0 150.0 A 130 130 0 0 0 30.0 150.0\" class=\"ln\" style=\"stroke-width:2\"/><line x1=\"160.0\" y1=\"150.0\" x2=\"234.6\" y2=\"43.5\" class=\"acc\" /><line x1=\"234.6\" y1=\"43.5\" x2=\"234.6\" y2=\"150.0\" class=\"ln\" stroke-dasharray=\"5 4\"/><circle cx=\"234.6\" cy=\"43.5\" r=\"5\" class=\"dot\"/><path d=\"M 190.0 150.0 A 30 30 0 0 0 177.2 125.4\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"201.5\" y=\"140.5\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"254.4\" y=\"28.8\" class=\"tx\" text-anchor=\"middle\">M(x; y)</text><text x=\"197.3\" y=\"169.0\" class=\"tx\" text-anchor=\"middle\">x</text><text x=\"245.6\" y=\"101.8\" class=\"tx\" text-anchor=\"middle\">y</text><text x=\"30.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">−1</text><text x=\"160.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">0</text><text x=\"290.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">1</text></svg></div><div class=\"gcap\">Полуокружность радиуса 1</div>", "h": "Углы α и 180° − α", "n": 33, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "Парный угол", "key": "semipair", "n": 34, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · формулы приведения", "body": "<p>Из этого получаем два правила. Они пригодятся в обеих теоремах.</p>", "box": "<span class=\"nb fm\">sin(180° − α) = sin α</span><br><span class=\"nb fm\">cos(180° − α) = −cos α</span>", "say": "key", "n": 35, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · пример", "body": "<p>Найдём cos 120° и sin 120°. Запишем 120° как <span class=\"nb\">180° − 60°</span>.</p><p>Косинус: <span class=\"nb fm\">cos 120° = cos(180° − 60°) = −cos 60° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span></p><p>Синус: <span class=\"nb fm\">sin 120° = sin(180° − 60°) = sin 60° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span></p>", "rev": {"btn": "Таблица для тупых углов", "html": "<p>Те же рассуждения для 135° и 150° дают таблицу:</p><div class=\"tblw\"><table><tr><th>α</th><th>120°</th><th>135°</th><th>150°</th></tr><tr><td>sin α</td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span>1</span><span>2</span></span></td></tr><tr><td>cos α</td><td><span class=\"nb fm\">−<span class=\"fr\"><span>1</span><span>2</span></span></span></td><td><span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></span></td><td><span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></span></td></tr></table></div>"}, "n": 36, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен cos 150°?</p>", "a": 2, "why": "<span class=\"nb fm\">150° = 180° − 30°,</span> поэтому <span class=\"nb fm\">cos 150° = −cos 30° = −<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span>", "h": ["Запиши 150° как <span class=\"nb\">180° − 30°</span>. Потом вспомни, что делает формула с косинусом."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"nb\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></span>", "<span class=\"nb\">−<span class=\"fr\"><span>1</span><span>2</span></span></span>"], "back": 34, "n": 37, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен sin 135°?</p>", "a": 2, "why": "<span class=\"nb fm\">135° = 180° − 45°.</span> Синус не меняется: <span class=\"nb fm\">sin 135° = sin 45° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>.</span>", "h": ["У синуса при замене α на <span class=\"nb\">180° − α</span> знак не меняется."], "opts": ["<span class=\"nb\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "back": 34, "n": 38, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равен cos 120°? Запиши десятичной дробью.</p>", "a": [-0.5], "why": "<span class=\"nb fm\">cos 120° = −cos 60° = −<span class=\"fr\"><span>1</span><span>2</span></span> = −0,5.</span>", "h": ["Вспомни: <span class=\"nb fm\">cos 120° = −cos 60°.</span>"], "back": 34, "note": "Например: <span class=\"nb\">−0,5</span>", "n": 39, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · идея", "body": "<p>Возьмём две палки длиной 3 и 5 и соединим их шарниром. Если раскрыть их немного, концы будут близко. Если раскрыть шире, концы разойдутся дальше.</p><p>Значит, расстояние между концами зависит от угла между палками. Это и есть третья сторона треугольника. Теорема косинусов позволяет её посчитать.</p><div class=\"fig\"><svg viewBox=\"0 0 390 175\" width=\"390\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"130.0\" x2=\"94.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"130.0\" x2=\"105.2\" y2=\"83.7\" class=\"ln\" /><line x1=\"94.0\" y1=\"130.0\" x2=\"105.2\" y2=\"83.7\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"50.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 65.0 130.0 A 15 15 0 0 0 61.5 120.4\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"50.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 40°</text><line x1=\"180.0\" y1=\"130.0\" x2=\"224.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"180.0\" y1=\"130.0\" x2=\"180.0\" y2=\"58.0\" class=\"ln\" /><line x1=\"224.0\" y1=\"130.0\" x2=\"180.0\" y2=\"58.0\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"180.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 195.0 130.0 A 15 15 0 0 0 180.0 115.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"180.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 90°</text><line x1=\"310.0\" y1=\"130.0\" x2=\"354.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"310.0\" y1=\"130.0\" x2=\"254.8\" y2=\"83.7\" class=\"ln\" /><line x1=\"354.0\" y1=\"130.0\" x2=\"254.8\" y2=\"83.7\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"310.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 325.0 130.0 A 15 15 0 0 0 298.5 120.4\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"310.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 140°</text></svg></div><div class=\"gcap\">Две палки на шарнире. Чем шире их раскрыли, тем дальше друг от друга их концы</div>", "h": "Две палки на шарнире", "n": 40, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · связь с Пифагором", "body": "<p>Теорема Пифагора: <span class=\"nb fm\">c² = a² + b².</span> Она верна, только если угол между сторонами a и b прямой.</p><p>А если угол не прямой, к формуле нужно добавить поправку. Её размер зависит от угла. Эту поправку и даёт косинус.</p>", "h": "Это теорема Пифагора с поправкой", "say": "recall", "n": 41, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · теорема", "body": "<p><b>Теорема косинусов.</b> Квадрат стороны треугольника равен сумме квадратов двух других сторон без удвоенного произведения этих сторон на косинус угла между ними.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"122.2\" y1=\"172.0\" x2=\"207.8\" y2=\"172.0\" class=\"ln\" /><line x1=\"122.2\" y1=\"172.0\" x2=\"171.0\" y2=\"38.0\" class=\"ln\" /><line x1=\"171.0\" y1=\"38.0\" x2=\"207.8\" y2=\"172.0\" class=\"acc\" /><path d=\"M 144.2 172.0 A 22 22 0 0 0 129.7 151.3\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"171.5\" y=\"31.1\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"217.2\" y=\"187.4\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"112.3\" y=\"186.9\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"164.5\" y=\"188.3\" class=\"tm\" text-anchor=\"middle\">a</text><text x=\"137.2\" y=\"99.0\" class=\"tm\" text-anchor=\"middle\">b</text><text x=\"199.3\" y=\"100.2\" class=\"tx\" text-anchor=\"middle\">c</text><text x=\"150.9\" y=\"156.2\" class=\"tm\" text-anchor=\"middle\">C</text></svg></div>", "box": "<span class=\"nb fm\">c² = a² + b² − 2ab·cos C</span>", "say": "key", "n": 42, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · читаем формулу", "body": "<p>Разберём формулу по кусочкам.</p><p><b>c</b> — сторона, которую мы ищем. Она лежит напротив угла C.</p><p><b>a</b> и <b>b</b> — две другие стороны. Это именно те стороны, которые образуют угол C.</p><p><b>cos C</b> — косинус этого же угла C, зажатого между a и b.</p><p>Запомни: угол и две его стороны дают третью сторону, ту, что напротив угла.</p>", "n": 43, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · что такое 2ab·cos C", "body": "<p>Запись <span class=\"nb\">2ab·cos C</span> — это просто умножение: <span class=\"nb fm\">2 · a · b · cos C.</span> Все числа перемножаем.</p><p>Пример: <span class=\"nb fm\">a = 3, b = 5, cos C = <span class=\"fr\"><span>1</span><span>2</span></span>.</span> Тогда <span class=\"nb fm\">2 · 3 · 5 · (<span class=\"fr\"><span>1</span><span>2</span></span>) = 30 · (<span class=\"fr\"><span>1</span><span>2</span></span>) = 15.</span></p>", "n": 44, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно <span class=\"nb fm\">2 · 4 · 6 · (<span class=\"fr\"><span>1</span><span>2</span></span>)</span>?</p>", "a": [24], "why": "<span class=\"nb fm\">2 · 4 · 6 = 48,</span> а половина от 48 равна 24.", "h": ["Сначала перемножь <span class=\"nb fm\">2 · 4 · 6,</span> потом найди половину."], "back": 43, "n": 45, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "3 · Косинусы · попробуй сам", "key": "cosdemo", "h": "Двигаем угол C", "n": 46, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · что показал рисунок", "body": "<p><b>Острый угол</b> (меньше <span class=\"nb fm\">90°): cos C &gt; 0,</span> из суммы квадратов вычитаем, поэтому c² получается меньше, чем <span class=\"nb\">a² + b²</span>.</p><p><b>Прямой угол</b>: <span class=\"nb\">cos 90° = 0</span>, поправки нет, получается обычная теорема Пифагора.</p><p><b>Тупой угол</b>: <span class=\"nb fm\">cos C &lt; 0.</span> Минус на минус даёт плюс, значит, мы прибавляем, и c² больше, чем <span class=\"nb\">a² + b²</span>.</p>", "box": "<span class=\"nb fm\">C = 90° &nbsp</span>;→<span class=\"nb fm\">&nbsp; cos C = 0 &nbsp</span>;→<span class=\"nb fm\">&nbsp; c² = a² + b²</span>", "say": "key", "n": 47, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Угол между сторонами a и b равен 90°. Что станет с : "q", "type": "num", "q": "<p>Две стороны треугольника равны 8 и 15, угол между ними 60°. Найди третью сторону.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"109.5\" y1=\"52.5\" x2=\"284.0\" y2=\"162.5\" class=\"ln\" /><line x1=\"284.0\" y1=\"162.5\" x2=\"46.0\" y2=\"162.5\" class=\"ln\" /><line x1=\"46.0\" y1=\"162.5\" x2=\"109.5\" y2=\"52.5\" class=\"ln\" /><path d=\"M 68.0 162.5 A 22 22 0 0 0 57.0 143.4\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"103.2\" y=\"45.1\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"295.6\" y=\"170.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"34.7\" y=\"171.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"81.5\" y=\"146.3\" class=\"tm\" text-anchor=\"middle\">60°</text><text x=\"165.0\" y=\"179.5\" class=\"tx\" text-anchor=\"middle\">15</text><text x=\"66.5\" y=\"106.0\" class=\"tx\" text-anchor=\"middle\">8</text><text x=\"204.2\" y=\"100.7\" class=\"tx\" text-anchor=\"middle\">?</text></svg></div>", "a": [13], "why": "<span class=\"nb fm\">c² = 8² + 15² − 2·8·15·cos 60° = 64 + 225 − 240 · <span class=\"fr\"><span>1</span><span>2</span></span> = 289 − 120 = 169,</span> и <span class=\"nb\">c = 13</span>.", "h": ["Запиши формулу и подставь: <span class=\"nb fm\">a = 8, b = 15, cos 60° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span>", "Посчитай c², потом извлеки корень. Не забудь про двойку: <span class=\"nb fm\">2·8·15 = 240.</span>"], "back": 50, "n": 55, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 2 · тупой угол · что дано", "body": "<p><b>Дано:</b> стороны 3 и 5, угол между ними 120°. <b>Найти:</b> третью сторону.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"157.3\" y1=\"172.0\" x2=\"250.1\" y2=\"172.0\" class=\"ln\" /><line x1=\"157.3\" y1=\"172.0\" x2=\"79.9\" y2=\"38.0\" class=\"ln\" /><line x1=\"79.9\" y1=\"38.0\" x2=\"250.1\" y2=\"17 /span><span>2ab</span></span></span>", "say": "key", "n": 62, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 3 · найти угол", "body": "<p>Стороны треугольника равны 3, 5 и 7. Найдём угол между сторонами 3 и 5. Он лежит напротив стороны 7.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"157.3\" y1=\"172.0\" x2=\"250.1\" y2=\"172.0\" class=\"ln\" /><line x1=\"157.3\" y1=\"172.0\" x2=\"79.9\" y2=\"38.0\" class=\"ln\" /><line x1=\"79.9\" y1=\"38.0\" x2=\"250.1\" y2=\"172.0\" class=\"acc\" /><path d=\"M 179.3 172.0 A 22 22 0 0 0 146.3 152.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"70.4\" y=\"32.8\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"261.7\" y=\"182.9\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"155.8\" y=\"190.0\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"214.5\" y=\"188.1\" class=\"tm\" text-anchor=\"middle\">3</text><text x=\"98.1\" y=\"98.9\" class=\"tm\" text-anchor=\"middle\">5</text><text x=\"166.8\" y=\"94.1\" class=\"tx\" text-anchor=\"middle\">7</text><text x=\"168.1\" y=\"143.0\" class=\"tm\" text-anchor=\"middle\">C = ?</text></svg></div>", "rev": {"btn": "Решить", "html": "<div class=\"fbox\"><span class=\"nb fm\">cos C = <span class=\"fr\"><span>9 + 25 − 49</span><span>2·3·5</span></span> = <span class=\"fr\"><span>−15</span><span>30</span></span> = −<span class=\"fr\"><span>1</span><span>2</span></span></span></div><p>Какой угол имеет косинус <span class=\"nb fm\">−<span class=\"fr\"><span>1</span><span>2</span></span></span>? Вспомни: <span class=\"nb fm\">cos 120° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span></p><p><b>Ответ: <span class=\"nb\">C = 120°</span>.</b></p>"}, "n": 63, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · какой треугольник", "body": "<p>Если у косинуса знак минус, угол тупой. Поэтому по сторонам можно понять вид треугольника без вычисления углов. Берём <b>наибольшую</b> сторону lass=\"ln\" /><text x=\"34.4\" y=\"168.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"305.4\" y=\"169.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"211.0\" y=\"46.9\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"261.2\" y=\"103.7\" class=\"tx\" text-anchor=\"middle\">5</text><text x=\"118.6\" y=\"100.9\" class=\"tx\" text-anchor=\"middle\">7</text><text x=\"170.0\" y=\"177.9\" class=\"tx\" text-anchor=\"middle\">9</text></svg></div>", "a": 3, "why": "Наибольшая сторона <span class=\"nb fm\">9: 9² = 81,</span> а <span class=\"nb fm\">5² + 7² = 25 + 49 = 74.</span> Так как <span class=\"nb\">81 &gt; 74</span>, треугольник тупоугольный.", "h": ["Сравни 9² с суммой <span class=\"nb\">5² + 7²</span>."], "opts": ["остроугольный", "прямоугольный", "тупоугольный"], "back": 63, "n": 66, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Стороны треугольника равны 5, 7 и 8. Найди косинус угла, лежащего напротив стороны 7.</p><div class=\"fig\"><svg viewBox=\"0 0 340 215\" width=\"340\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"46.0\" y1=\"174.6\" x2=\"294.0\" y2=\"174.6\" class=\"ln\" /><line x1=\"294.0\" y1=\"174.6\" x2=\"216.5\" y2=\"40.4\" class=\"ln\" /><line x1=\"216.5\" y1=\"40.4\" x2=\"46.0\" y2=\"174.6\" class=\"ln\" /><path d=\"M 272.0 174.6 A 22 22 0 0 1 283.0 155.6\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"34.6\" y=\"183.3\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"305.1\" y=\"184.2\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"220.8\" y=\"33.1\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"264.6\" y=\"161.9\" class=\"tm\" text-anchor=\"middle\">?</text><text x=\"266.5\" y=\"106.0\" class=\"tx\" text-anchor=\"middle\">5</text><text x=\"122.6\" y=\"101.5\" class=\"tx\" text-anchor=\"middle\">7</text><text x=\"170.0\" y=\"191.7\" class=\"tx\" text-anchor=\"middle\">8</text></svg></div>", "a": [0.5], "why": "<span class=\"nb fm\">cos C = (5² + 8² − 7²) : (2·5·8) = (25 + 64 − 49) : 80 = 40 : 80 = 0,5.</span>", "h": ["Запиши формулу для косинуса угла. В числителе квадраты двух сторон, образующих угол, минус квадрат стороны напротив.", "Сторона напротив угла — 7, значит, в числителе <span class=\"nb fm\">5² + 8² − 7².</span>"], "back": 61, "note": "Запиши десятичной дробью, например 0,5", "n": 67, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · ошибки", "body": "<div class=\"chs\"><div class=\"chr warn\"><small>Ошибка 1</small><p>Забыть двойку в «2ab». Правильно: <span class=\"nb fm\">2·a·b,</span> то есть удвоенное произведение.</p></div><div class=\"chr warn\"><small>Ошибка 2</small><p>Перепутать, какая сторона лежит напротив угла. Она никогда не выходит из этого угла.</p></div><div class=\"chr warn\"><small>Ошибка 3</small><p>Потерять знак при тупом угле: минус на минус даёт плюс.</p></div><div class=\"chr warn\"><small>Ошибка 4</small><p>Остановиться на c². Это квадрат стороны, нужен ещё корень.</p></div></div>", "h": "Где чаще всего ошибаются", "say": "trap", "n": 68, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Ученик решал: <span class=\"nb fm\">a = 4, b = 6,</span> угол <span class=\"nb\">C = 60°</span>. Он записал <b><span class=\"nb fm\">c² = 4² + 6² − 4·6·0,5 = 40</span></b>. Где ошибка?</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"191.0\" y1=\"40.0\" x2=\"217.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"217.0\" y1=\"175.0\" x2=\"113.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"113.0\" y1=\"175.0\" x2=\"191.0\" y2=\"40.0\" class=\"ln\" /><path d=\"M 135.0 175.0 A 22 22 0 0 0 124.0 155.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"193.4\" y=\"32.3\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"226.7\" y=\"190.1\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"102.6\" y=\"187.8\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"148.5\" y=\"158.8\" class=\"tm\" text-anchor=\"middle\">60°</text><text x=\"165.0\" y=\"192.0\" class=\"tx\" text-anchor=\"middle\">4</text><text x=\"140.8\" y=\"106.0\" class=\"tx\" text-anchor=\"middle\">6</text><text x=\"215.8\" y=\"110.3\" class=\"tx\" text-anchor=\"middle\">?</text></svg></div>", "a": 1, "why": "В формуле должно быть удвоенное произведение: <span class=\"nb fm\">2·4·6·0,5 = 24,</span> и тогда <span class=\"nb fm\">c² = 52 − 24 = 28.</span> Ученик пропустил двойку.", "h": ["Сравни его запись с формулой: всё ли на месте?"], "opts": ["Пропущена двойка в 2ab", "cos 60° равен <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "Надо было сложить, а не вычесть"], "back": 67, "wide": true, "n": 69, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Стороны <span class=\"nb\">a = 4</span> и <span class=\"nb\">b = 6</span>, угол между ними 60°. Чему равен квадрат третьей стороны, то есть c²?</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"191.0\" y1=\"40.0\" x2=\"217.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"217.0\" y1=\"175.0\" x2=\"113.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"113.0\" y1=\"175.0\" x2=\"191.0\" y2=\"40.0\" class=\"ln\" /><path d=\"M 135.0 175.0 A 22 22 0 0 0 124.0 155.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"193.4\" y=\"32.3\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"226.7\" y=\"190.1\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"102.6\" y=\"187.8\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"148.5\" y=\"158.8\" class=\"tm\" text-anchor=\"middle\">60°</text><text x=\"165.0\" y=\"192.0\" class=\"tx\" text-anchor=\"middle\">4</text><text x=\"140.8\" y=\"106.0\" class=\"tx\" text-anchor=\"middle\">6</text><text x=\"215.8\" y=\"110.3\" class=\"tx\" text-anchor=\"middle\">?</text></svg></div>", "a": [28], "why": "<span class=\"nb fm\">c² = 16 + 36 − 2·4·6·(<span class=\"fr\"><span>1</span><span>2</span></span>) = 52 − 24 = 28.</span> Корень из 28 нам не нужен, спрашивали c².", "h": ["Подставь в формулу: <span class=\"nb fm\">4² + 6² − 2·4·6·cos 60°.</span>"], "back": 49, "note": "Спрашивается c², а не c.", "n": 70, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · когда нужна", "body": "<p>Для теоремы косинусов нужны две стороны и угол между ними или три стороны. Но часто в задаче даны <b>сторона и два угла</b>. Тогда косинусы не помогут, а помогает теорема синусов.</p>", "h": "Когда косинусов не хватает", "n": 71, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · проверка на знакомом треугольнике", "body": "<p>Вспомни треугольник с углами 30°, 60° и 90°. Его стороны: 1, √3 и 2. (Катет напротив 30° равен половине гипотенузы.)</p><div class=\"fig\"><svg viewBox=\"0 0 300 205\" width=\"300\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"40.0\" y1=\"165.0\" x2=\"213.0\" y2=\"165.0\" class=\"ln\" /><line x1=\"213.0\" y1=\"165.0\" x2=\"213.0\" y2=\"65.0\" class=\"ln\" /><line x1=\"40.0\" y1=\"165.0\" x2=\"213.0\" y2=\"65.0\" class=\"acc\" /><line x1=\"202.0\" y1=\"165.0\" x2=\"202.0\" y2=\"154.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"202.0\" y1=\"154.0\" x2=\"213.0\" y2=\"154.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 70.0 165.0 A 30 30 0 0 0 66.0 150.0\" class=\"acc\" style=\"stroke-width:2\"/><path d=\"M 213.0 89.0 A 24 24 0 0 1 192.2 77.0\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"100.8\" y=\"153.0\" class=\"tm\" text-anchor=\"middle\">30°</text><text x=\"193.0\" y=\"104.0\" class=\"tm\" text-anchor=\"middle\">60°</text><text x=\"28.5\" y=\"173.4\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"222.2\" y=\"59.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"224.3\" y=\"176.5\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"224.0\" y=\"120.0\" class=\"tx\" text-anchor=\"middle\">1</text><text x=\"126.5\" y=\"184.0\" class=\"tx\" text-anchor=\"middle\">√3</text><text x=\"112.6\" y=\"112.0\" class=\"tx\" text-anchor=\"middle\">2</text></svg></div><div class=\"gcap\">Треугольник с углами 30°, 60°, 90° и сторонами 1, √3, 2</div><p>Разделим каждую сторону на синус угла напротив неё:</p>", "h": "Проверим на знакомом треугольнике", "n": 72, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · три одинаковых числа", "body": "<p>Сторона 1 напротив <span class=\"nb fm\">30°: 1 : sin 30° = 1 : <span class=\"fr\"><span>1</span><span>2</span></span> = 2.</span></p><p>Сторона √3 напротив <span class=\"nb fm\">60°: √3 : sin 60° = √3 : (<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>) = 2.</span></p><p>Сторона 2 напротив <span class=\"nb fm\">90°: 2 : sin 90° = 2 : 1 = 2.</span></p><p>Все три результата одинаковы! Это не случайность. Так будет в любом треугольнике.</p>", "n": 73, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · теорема", "body": "<p><b>Теорема синусов.</b> Стороны треугольника пропорциональны синусам противолежащих углов.</p><p>Это значит: если каждую сторону разделить на синус угла напротив неё, получится одно и то же число. Оно равно диаметру описанной окружности, то есть 2R.</p>", "box": "<span class=\"nb fm\">a : sin A = b : sin B = c : sin C = 2R</span>", "say": "key", "n": 74, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · пары", "body": "<p>Главное правило: сторона и угол напротив неё всегда идут парой.</p><p>Сторона a (то есть BC) и угол A. Сторона b (то есть AC) и угол B. Сторона c (то есть AB) и угол C.</p><p>Помнишь, что значит «напротив»? Сторона не касается этого угла.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"175.0\" x2=\"280.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"280.0\" y1=\"175.0\" x2=\"205.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"205.0\" y1=\"45.0\" x2=\"50.0\" y2=\"175.0\" class=\"ln\" /><text x=\"38.6\" y=\  него</div>", "a": 1, "why": "Сторона BC находится напротив угла A, поэтому в паре с ним: <span class=\"nb\">BC : sin A</span>.", "h": ["Сторона и угол должны быть напротив друг друга."], "opts": ["BC и угол A", "BC и угол B", "BC и угол C"], "back": 74, "n": 78, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · откуда берётся (можно пропустить)", "body": "<p>Для любопытных: откуда берётся теорема. Проведём высоту h к стороне AB. Получатся два прямоугольных треугольника.</p><div class=\"fig\"><svg viewBox=\"0 0 310 215\" width=\"310\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"36.0\" y1=\"175.0\" x2=\"276.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"36.0\" y1=\"175.0\" x2=\"176.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"276.0\" y1=\"175.0\" x2=\"176.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"176.0\" y1=\"45.0\" x2=\"176.0\" y2=\"175.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"165.0\" y1=\"175.0\" x2=\"165.0\" y2=\"164.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"165.0\" y1=\"164.0\" x2=\"176.0\" y2=\"164.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 68.0 175.0 A 32 32 0 0 0 59.4 153.2\" class=\"acc\" style=\"stroke-width:2\"/><path d=\"M 246.0 175.0 A 30 30 0 0 1 257.7 151.2\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"24.6\" y=\"183.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"287.2\" y=\"184.3\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"178.0\" y=\"37.2\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"176.0\" y=\"191.3\" class=\"tm\" text-anchor=\"middle\">H</text><text x=\"90.7\" y=\"110.4\" class=\"tx\" text-anchor=\"middle\">b</text><text x=\"240.4\" y=\"110.7\" class=\"tx\" text-anchor=\"middle\">a</text><text x=\"187.0\" y=\"115.0\" class=\"tx\" text-anchor=\"middle\">h</text></svg></div><p>В левом треугольнике <span class=\"nb fm\">sin A = h : b,</span> значит, <span class=\"nb fm\">h = b·sin A.</span> В правом <span class=\"nb fm\">sin B = h : a,</span> значит, <span class=\"n const pick=a=>a[Math.floor(Math.random()*a.length)];
function parseNums(s){
  return String(s).replace(/[−–—]/g,'-').split(/;|\s+и\s+|\n/).map(x=>x.trim().replace(/\s+/g,'').replace(',','.').replace(/^[a-zа-яё][a-zа-яё₀-₉0-9]*=/i,'')).filter(Boolean).map(x=>{
    const m=x.match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?(.*)$/);if(!m)return NaN;
    if(m[3]&&!/^[a-zа-яё°%²³\/.]+$/i.test(m[3]))return NaN;
    if(m[2]&&!/[a-zа-яё]/i.test(m[3]||''))return +m[1]/+m[2];
    return +m[1]});
}
/* answers like "(0; 6)", "0 < x < 6", "−3; (−2; −1)" → sorted canonical items, or null */
function parseSet(raw){
  let s=String(raw).toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/или|и|∪|u/g,';').replace(/[xm]∈/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=');
  s=s.replace(/(\d),(\d)/g,'$1.$2').replace(/,/g,';').replace(/(^|;)[xm]=/g,'$1');
  const N='(-?\\d+(?:\\.\\d+)?)',f=v=>String(+v),items=[];
  const re=new RegExp(`([\\(\\[])${N};${N}([\\)\\]])|${N}(<=?)[xm](<=?)${N}|${N}`,'g');
  const rest=s.replace(re,(m,b1,a1,a2,b2,c1,o1,o2,c2,d)=>{
    if(b1)items.push(b1+f(a1)+';'+f(a2)+b2);
    else if(o1)items.push((o1==='<='?'[':'(')+f(c1)+';'+f(c2)+(o2==='<='?']':')'));
    else items.push(f(d));
    return '';});
  if(rest.replace(/;/g,'')!==''||!items.length)return null;
  return items.sort();
}
function sameSet(a,b){if(a.length!==b.length||a.some(isNaN))return false;const x=[...a].sort((p,q)=>p-q),y=[...b].sort((p,q)=>p-q);return x.every((v,i)=>Math.abs(v-y[i])<1e-6)}
function fmtT(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}

function noiseWhoosh(t0=0,dur=.35,f0=400,f1=3200,vol=.08){const c=ac();if(!c||!S.sound)return;const n=c.currentTime+t0,len=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(f0,n);bp.frequency.exponentialRampToValueAtTime(f1,n+dur);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,n+dur);src.connect(bp).connect(g).connect(c.destination);src.start(n);src.stop(n+dur+.02)}
function womp(){const c=ac();if(!c||!S.sound)return;[[311,0,.28],[294,.3,.28],[277,.6,.28],[262,.9,.75]].forEach(([f,t,d])=>{const n=c.currentTime+t,o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f,n);if(d>.5)o.frequency.linearRampToValueAtTime(f*.92,n+d);lfo.frequency.value=6;lg.gain.value=d>.5?6:0;lfo.connect(lg).connect(o.frequency);lp.type='lowpass';lp.frequency.value=900;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.07,n+.03);g.gain.setValueAtTime(.07,n+d*.7);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(lp).connect(g).connect(c.destination);o.start(n);o.stop(n+d+.05);lfo.start(n);lfo.stop(n+d+.05)})}
function fanfare(){[[523.25,0],[659.25,.09],[783.99,.18],[1046.5,.3],[1318.5,.3]].forEach(([f,t])=>{tone(f,t,.55,'square',.025);tone(f,t,.6,'triangle',.06)})}
function oops(){const c=ac();if(!c||!S.sound)return;const n=c.currentTime;
  [[740,0],[554,.12]].forEach(([f,t])=>tone(f,t,.16,'triangle',.08));
  const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();o.type='sine';o.frequency.setValueAtTime(420,n+.28);o.frequency.exponentialRampToValueAtTime(180,n+.7);lfo.frequency.value=14;lg.gain.value=25;lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0,n+.28);g.gain.linearRampToValueAtTime(.1,n+.31);g.gain.exponentialRampToValueAtTime(.0001,n+.75);o.connect(g).connect(c.destination);o.start(n+.28);o.stop(n+.8);lfo.start(n+.28);lfo.stop(n+.8)}
function edgeFlash(color){if(RM)return;const f=document.createElement('div');f.className='flash';f.style.setProperty('--fc',color);document.body.appendChild(f);setTimeout(()=>f.remove(),900)}

function react(kind,title,sub){

  else{noiseWhoosh(0,.3,600,1800,.04);setTimeout(()=>petSound(t.id),350)}
  react.t=setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),450)},kind==='bad'?2900:2600);
}

function scratchGame(g,done){
  const s=grant(rollRarity());

  const c=g.querySelector('canvas'),ctx=c.getContext('2d');

    const gr=ctx.createLinearGradient(0,0,r.width,r.height);gr.addColorStop(0,'#eee0c8');gr.addColorStop(.5,'#eee0c8');gr.addColorStop(1,'#c9ab82');ctx.fillStyle=gr;ctx.fillRect(0,0,r.width,r.height);

    ctx.fillStyle='#2b3d2b';ctx.font='700 18px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.fillText('СОТРИ МЕНЯ',r.width/2,r.height/2+6);return r};
  const r=sz();let down=false,last=null,moves=0,fin=false;

  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId);ac()};

    if(++moves%4===0)tone(2200+Math.random()*800,0,.02,'square',.006);
    if(moves%8===0){const d=ctx.getImageData(0,0,c.width,c.height).data;let clear=0,tot=0;for(let i=3;i<d.length;i+=64){tot++;if(d[i]<100)clear++}

function score(){

    if(r.st==='ok'){ok++;if(t.fin)fok++;else mok++;if(r.hints)hint++;else solo++}}
  const pct=tot?Math.round(ok/tot*100):0;
  return {ok,tot,solo,hint,fok,ftot,mok,mtot,pct,pts:ok,max:tot,maxAll:tot,auto:tot,grade:'',lvl:pct>=83?'уверенно':pct>=50?'почти уверенно':'тема ещё не сложилась',geo:0};
}

  o.innerHTML=`<div class="csp" role="dialog" aria-modal="true" aria-label="Шпаргалка"><div class="cs-head"><h2>Шпаргалка</h2><button class="cs-x" id="csx_close" aria-label="Закрыть">×</button></div>
    <p class="cs-sub">${esc(CHEAT.title)}. Сейчас: ${cur.t}</p>
    <div id="csbody">${csSec(cur,true)}</div>
    <div class="cs-btns"><button class="chip" id="csall">Показать всю шпаргалку</button><button class="chip" id="csjpg">Скачать JPEG</button><button class="chip" id="cspdf">Скачать PDF</button></div>
    <p class="note" id="csmsg"></p></div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';
  o.onclick=e=>{if(e.target===o)closeCheat()};
  document.getElementById('csx_close').onclick=closeCheat;
  const all=document.getElementById('csall');let shown=false;
  all.onclick=()=>{shown=!shown;document.getElementById('csbody').innerHTML=shown?CHEAT.blocks.map((b,i)=>csSec(b,i===bi)).join(''):csSec(cur,true);all.textContent=shown?'Только это место урока':'Показать всю шпаргалку';sfx.tap()};
  document.getElementById('csjpg').onclick=()=>csExport('jpg');
  document.getElementById('cspdf').onclick=()=>csExport('pdf');
  document.addEventListener('keydown',csKey);
}
function csKey(e){if(e.key==='Escape')closeCheat()}
function closeCheat(){const o=document.getElementById('csov');if(o)o.remove();document.body.style.overflow='';document.removeEventListener('keydown',csKey)}
function csMsg(t){const m=document.getElementById('csmsg');if(m)m.textContent=t}
function csLoad(cb){
  if(window.html2canvas)return cb(true);
  const s=document.createElement('script');s.src='tools/html2canvas.min.js?v=1';s.onload=()=>cb(!!window.html2canvas);s.onerror=()=>cb(false);document.head.appendChild(s);
}
function csFixRad(doc){
  doc.querySelectorAll('.rt .rs').forEach(e=>{
    const ns='http://www.w3.org/2000/svg',sv=doc.createElementNS(ns,'svg');
    sv.setAttribute('viewBox','0 0 10 20');sv.setAttribute('preserveAspectRatio','none');
    sv.setAttribute('style','width:.62em;flex:none;align-self:stretch;height:auto;min-height:1em;color:inherit;overflow:visible');
    const p=doc.createElementNS(ns,'path');
    p.setAttribute('d','M0.5 11.5 L2.6 10.2 L5.4 19 L9.6 0.8 L10 0.8');p.setAttribute('fill','none');p.setAttribute('stroke','#16231a');
    p.setAttribute('stroke-width','1.5');p.setAttribute('vector-effect','non-scaling-stroke');p.setAttribute('stroke-linejoin','round');
    sv.appendChild(p);e.replaceWith(sv);
  });
  doc.querySelectorAll('.rt .rad').forEach(e=>{e.style.borderTopColor='#16231a'});
  doc.querySelectorAll('.fr>span:first-child').forEach(e=>{e.style.borderBottomColor='#16231a'});
}
function csBuildX(){
  let x=document.getElementById('csx');if(x)x.remove();
  x=document.createElement('div');x.id='csx';
  x.innerHTML=`<div class="xh">${logoFull(40)}<div><h1>Шпаргалка</h1><small>${esc(CHEAT.title)}</small></div></div>${CHEAT.blocks.map(b=>csSec(b,false)).join('')}<div class="xf">lilimath.ru · lili.math</div>`;
  document.body.appendChild(x);return x;
}
function csDownload(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),20000);
}
function csPdf(canvas){
  const W=canvas.width,PH=Math.round(W*297/210),pages=Math.max(1,Math.ceil(canvas.height/PH)),imgs=[];
  for(let k=0;k<pages;k++){
    const c=document.createElement('canvas');c.width=W;c.height=PH;const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,W,PH);
    g.drawImage(canvas,0,k*PH,W,Math.min(PH,canvas.height-k*PH),0,0,W,Math.min(PH,canvas.height-k*PH));
    const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);imgs.push(u);
  }
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  put('%PDF-1.4\n');
  obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>put('<</Type/Pages/Count '+pages+'/Kids['+imgs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']>>'));
  imgs.forEach((u,k)=>{
    const p=3+k*3;
    obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p+1,()=>put('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+PH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+u.length+'>>\nstream\n');put(u);put('\nendstream')});
  });
  const n=3+pages*3,xr=len;
  put('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(let i=1;i<n;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function csExport(kind){
  csMsg('Готовлю файл…');
  csLoad(ok=>{
    if(!ok){csMsg('Не удалось загрузить модуль. Открою печать: выбери «Сохранить как PDF».');csBuildX();setTimeout(()=>window.print(),300);return}
    const x=csBuildX();
    window.html2canvas(x,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:csFixRad}).then(cv=>{
      const name='shpargalka-'+(TOPIC.id||'urok');
      if(kind==='jpg')cv.toBlob(b=>{csDownload(b,name+'.jpg');csMsg('Готово: файл JPEG сохранён.')},'image/jpeg',.92);
      else{csDownload(csPdf(cv),name+'.pdf');csMsg('Готово: файл PDF сохранён.')}
      x.remove();
    }).catch(()=>{x.remove();csMsg('Не получилось собрать файл. Сделай скриншот шпаргалки.')});
  });
}

function revisitBox(t,r){
  const ttl=r.st==='ok'?'Ты ответил(а) верно':r.st==='bad'?'Тут не сошлось':r.st==='idk'?'Тут было «не знаю»':'Тут была идея';
  return `<div class="fb ${r.st==='ok'?'ok':'neu'}"><div class="ic">${r.st==='ok'?I.ok:I.q}</div><div><div class="t">${ttl}</div><div class="s">Разбор: ${t.why}</div></div></div>`;
}

else if(S.name&&S.started&&!tal()){renderPetPick(()=>S.done?finish():renderStart())}
else if(S.done&&S.name){finish()}
else if(window.LiliStudy?.resume&&S.started&&S.name&&tal()){goNext()}
else renderStart();
})();
