<script>
(() => {
/* ---------- math helpers ---------- */
const R = s => `<span class="rt"><span class="rs" aria-hidden="true"></span><span class="rad">${s}</span></span>`;
const F = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M = s => `<span class="m">${s}</span>`;

/* ---------- figures ---------- */
function grid(x0,y0,cols,rows,c){let s='';for(let i=0;i<=cols;i++)s+=`<line class="gr" x1="${x0+i*c}" y1="${y0}" x2="${x0+i*c}" y2="${y0+rows*c}"/>`;for(let j=0;j<=rows;j++)s+=`<line class="gr" x1="${x0}" y1="${y0+j*c}" x2="${x0+cols*c}" y2="${y0+j*c}"/>`;return s}

/* floor plan: cell = 13 px; walls given in cell coordinates */
const TOPIC={"id": "teoremy-sin-cos", "t": "Теоремы синусов и косинусов", "w": "с теоремами синусов и косинусов", "mins": 60, "next": "", "nextT": ""};
const T=[{"kind": "info", "kick": "Старт", "body": "<p>Сегодня разберёмся с двумя теоремами: теоремой косинусов и теоремой синусов. Они нужны, чтобы находить стороны и углы в любом треугольнике, даже когда в нём нет прямого угла.</p><p>Начнём с самого простого, как будто с нуля. Будем идти маленькими шагами. Если что-то непонятно, возвращайся назад или говори, разберём ещё раз.</p>", "h": "Что будем делать сегодня", "n": 1, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "План урока", "body": "<div class=\"tblw\"><table><tr><th>Блок</th><th>Что делаем</th><th>Минут</th></tr><tr><td>1</td><td>Повторяем основы: стороны, углы, квадрат, корень, синус и косинус</td><td>12</td></tr><tr><td>2</td><td>Углы больше 90°</td><td>8</td></tr><tr><td>3</td><td>Теорема косинусов</td><td>18</td></tr><tr><td>4</td><td>Теорема синусов</td><td>14</td></tr><tr><td>5</td><td>Какую теорему выбрать, и итог</td><td>8</td></tr></table></div><p>Минуты примерные. Если какой-то блок уже знаком, его можно пролистать.</p>", "h": "Пять блоков на час", "n": 2, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Зачем это нужно", "body": "<p>Теорема Пифагора работает только в прямоугольном треугольнике. А вот такой треугольник: две стороны 5 и 8, а угол между ними 60°. Чему равна третья сторона?</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"116.6\" y1=\"172.0\" x2=\"213.4\" y2=\"172.0\" class=\"ln\" /><line x1=\"116.6\" y1=\"172.0\" x2=\"194.0\" y2=\"38.0\" class=\"ln\" /><line x1=\"194.0\" y1=\"38.0\" x2=\"213.4\" y2=\"172.0\" class=\"acc\" /><path d=\"M 138.6 172.0 A 22 22 0 0 0 127.6 152.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"196.8\" y=\"30.3\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"222.5\" y=\"187.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"105.6\" y=\"185.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"162.5\" y=\"188.0\" class=\"tm\" text-anchor=\"middle\">5</text><text x=\"146.8\" y=\"99.5\" class=\"tm\" text-anchor=\"middle\">8</text><text x=\"214.8\" y=\"101.5\" class=\"tx\" text-anchor=\"middle\">?</text><text x=\"146.1\" y=\"159.3\" class=\"tm\" text-anchor=\"middle\">C</text></svg></div><p>Прямого угла нет, значит, Пифагор здесь не поможет. Нужен новый инструмент.</p>", "rev": {"btn": "Узнать ответ заранее", "html": "<p>Третья сторона равна 7. К концу блока 3 ты посчитаешь это сам(а).</p>"}, "n": 3, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · как называют", "body": "<p>В треугольнике три угла и три стороны. Углы называют по вершинам большими буквами: A, B, C.</p><p>Сторону, которая лежит напротив угла, называют такой же маленькой буквой. Напротив угла A лежит сторона a, напротив угла B лежит сторона b, напротив угла C лежит сторона c.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"175.0\" x2=\"280.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"280.0\" y1=\"175.0\" x2=\"205.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"205.0\" y1=\"45.0\" x2=\"50.0\" y2=\"175.0\" class=\"ln\" /><text x=\"38.6\" y=\"183.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"291.0\" y=\"184.7\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"208.8\" y=\"37.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"161.2\" y=\"192.5\" class=\"tx\" text-anchor=\"middle\">c</text><text x=\"255.8\" y=\"110.6\" class=\"tx\" text-anchor=\"middle\">a</text><text x=\"112.8\" y=\"108.8\" class=\"tx\" text-anchor=\"middle\">b</text></svg></div>", "h": "Названия сторон и углов", "n": 4, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · что значит «напротив»", "body": "<p>«Напротив угла» значит: сторона, которая <b>не касается</b> этого угла.</p><p>Представь, что ты стоишь в вершине A и смотришь через весь треугольник. Прямо перед тобой окажется сторона a. Её ещё называют BC, потому что она идёт от вершины B до вершины C.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"175.0\" x2=\"280.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"280.0\" y1=\"175.0\" x2=\"205.0\" y2=\"45.0\" class=\"acc\" /><line x1=\"205.0\" y1=\"45.0\" x2=\"50.0\" y2=\"175.0\" class=\"ln\" /><path d=\"M 78.0 175.0 A 28 28 0 0 0 71.5 157.0\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"38.6\" y=\"183.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"291.0\" y=\"184.7\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"208.8\" y=\"37.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"161.2\" y=\"192.5\" class=\"tx\" text-anchor=\"middle\">c</text><text x=\"255.8\" y=\"110.6\" class=\"tx\" text-anchor=\"middle\">a</text><text x=\"112.8\" y=\"108.8\" class=\"tx\" text-anchor=\"middle\">b</text></svg></div><div class=\"gcap\">Угол A и сторона a напротив него</div>", "n": 5, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Какая сторона лежит напротив угла B?</p>", "a": 2, "why": "Напротив угла B лежит сторона b. Она не касается вершины B.", "h": ["Найди сторону, которая не выходит из вершины B."], "opts": ["a", "b", "c"], "back": 4, "n": 6, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Сторона AB лежит напротив угла...</p>", "a": 3, "why": "Сторона AB не касается вершины C, значит, она лежит напротив угла C. Её обозначают маленькой буквой c.", "h": ["Какая вершина не входит в название AB?"], "opts": ["A", "B", "C"], "back": 4, "n": 7, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · угол между сторонами", "body": "<p>Каждый угол образуют две стороны, которые из него выходят. Говорят, что угол «зажат» между ними.</p><p>Угол C зажат между сторонами a и b. А напротив него лежит сторона c. Запомни эту тройку: угол, две его стороны и сторона напротив. Она будет в теореме косинусов.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"175.0\" x2=\"280.0\" y2=\"175.0\" class=\"acc\" /><line x1=\"280.0\" y1=\"175.0\" x2=\"205.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"205.0\" y1=\"45.0\" x2=\"50.0\" y2=\"175.0\" class=\"ln\" /><path d=\"M 183.5 63.0 A 28 28 0 0 0 219.0 69.3\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"38.6\" y=\"183.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"291.0\" y=\"184.7\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"208.8\" y=\"37.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"161.2\" y=\"192.5\" class=\"tx\" text-anchor=\"middle\">c</text><text x=\"255.8\" y=\"110.6\" class=\"tx\" text-anchor=\"middle\">a</text><text x=\"112.8\" y=\"108.8\" class=\"tx\" text-anchor=\"middle\">b</text></svg></div><div class=\"gcap\">Угол C и сторона c напротив него</div>", "n": 8, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Между какими сторонами зажат угол A?</p>", "a": 2, "why": "Из вершины A выходят стороны b и c (AC и AB). Значит, угол A зажат между ними.", "h": ["Какие две стороны выходят из вершины A?"], "opts": ["a и b", "b и c", "a и c"], "back": 7, "n": 9, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · сумма углов", "body": "<p>Три угла любого треугольника всегда дают в сумме 180°. Например, <span class=\"nb fm\">90° + 60° + 30° = 180°.</span></p><p>Это правило нужно, чтобы найти третий угол, когда известны два.</p>", "n": 10, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Два угла треугольника равны 50° и 65°. Чему равен третий угол?</p>", "a": [65], "why": "<span class=\"nb fm\">50 + 65 = 115,</span> а <span class=\"nb fm\">180 − 115 = 65.</span>", "h": ["Сложи два известных угла и вычти сумму из 180°."], "back": 9, "n": 11, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · квадрат и корень", "body": "<p><b>Квадрат числа</b> — это число, умноженное само на себя. Например, <span class=\"nb fm\">5² = 5 · 5 = 25.</span></p><p><b>Корень</b> — обратное действие. Он отвечает на вопрос: какое число в квадрате даст вот это? Например, <span class=\"nb fm\"><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">25</span></span> = 5,</span> потому что <span class=\"nb\">5² = 25</span>.</p><p>В теоремах мы сначала находим квадрат стороны, а потом берём корень, чтобы получить саму сторону.</p>", "h": "Квадрат и корень", "n": 12, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно 7²?</p>", "a": [49], "why": "<span class=\"nb fm\">7² = 7 · 7 = 49.</span>", "h": ["Умножь 7 на 7."], "back": 11, "n": 13, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равен <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">81</span></span>?</p>", "a": [9], "why": "Корень из 81 равен 9, потому что <span class=\"nb fm\">9 · 9 = 81.</span>", "h": ["Какое число, умноженное само на себя, даёт 81?"], "back": 11, "n": 14, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · теорема Пифагора", "body": "<p>В прямоугольном треугольнике есть прямой угол (90°), как угол тетради. Сторона напротив прямого угла называется <b>гипотенузой</b>, она самая длинная. Две другие стороны называются <b>катетами</b>.</p><p><b>Теорема Пифагора.</b> Квадрат гипотенузы равен сумме квадратов катетов.</p><p>Пример: катеты 3 и 4. Тогда <span class=\"nb fm\">c² = 9 + 16 = 25,</span> и гипотенуза <span class=\"nb\">c = 5</span>.</p>", "box": "<span class=\"nb fm\">c² = a² + b²</span>", "n": 15, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Катеты прямоугольного треугольника равны 6 и 8. Чему равна гипотенуза?</p>", "a": [10], "why": "<span class=\"nb fm\">6² + 8² = 36 + 64 = 100,</span> а <span class=\"nb fm\"><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">100</span></span> = 10.</span>", "h": ["Возведи оба катета в квадрат, сложи, потом извлеки корень."], "back": 14, "n": 16, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · синус и косинус: названия сторон", "body": "<p>Теперь про синус и косинус. Они живут в прямоугольном треугольнике и связаны с острым углом, который мы обозначим α.</p><p>У угла α три стороны:<br><b>гипотенуза</b> — самая длинная;<br><b>противолежащий катет</b> — тот, что напротив α;<br><b>прилежащий катет</b> — тот, что рядом с α (он касается угла α).</p><div class=\"fig\"><svg viewBox=\"0 0 390 205\" width=\"390\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"36.0\" y1=\"160.0\" x2=\"226.0\" y2=\"160.0\" class=\"ln\" /><line x1=\"226.0\" y1=\"160.0\" x2=\"226.0\" y2=\"48.0\" class=\"ln\" /><line x1=\"36.0\" y1=\"160.0\" x2=\"226.0\" y2=\"48.0\" class=\"acc\" /><line x1=\"215.0\" y1=\"160.0\" x2=\"215.0\" y2=\"149.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"215.0\" y1=\"149.0\" x2=\"226.0\" y2=\"149.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 72.0 160.0 A 36 36 0 0 0 67.0 141.7\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"84.5\" y=\"152.9\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"26.1\" y=\"174.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"235.9\" y=\"174.9\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"235.9\" y=\"43.1\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"131.0\" y=\"189.3\" class=\"tm\" text-anchor=\"middle\">прилежащий катет (рядом с α)</text><text x=\"292.0\" y=\"108.3\" class=\"tm\" text-anchor=\"middle\">противолежащий</text><text x=\"292.0\" y=\"124.3\" class=\"tm\" text-anchor=\"middle\">катет</text><text x=\"99.1\" y=\"89.5\" class=\"tm\" text-anchor=\"middle\">гипотенуза</text></svg></div>", "say": "recall", "n": 17, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · что такое синус и косинус", "body": "<p><b>Синусом</b> острого угла прямоугольного треугольника называется отношение противолежащего катета к гипотенузе. <b>Косинусом</b> называется отношение прилежащего катета к гипотенузе.</p><p>Отношение — это деление. Посмотри на пример: противолежащий катет 3, прилежащий 4, гипотенуза 5.</p><p><span class=\"nb fm\">sin α = 3 : 5 = 0,6, &nbsp; cos α = 4 : 5 = 0,8.</span></p><p>Эти числа зависят только от величины угла, а не от размера треугольника.</p><div class=\"fig\"><svg viewBox=\"0 0 300 205\" width=\"300\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"40.0\" y1=\"160.0\" x2=\"200.0\" y2=\"160.0\" class=\"ln\" /><line x1=\"200.0\" y1=\"160.0\" x2=\"200.0\" y2=\"40.0\" class=\"ln\" /><line x1=\"40.0\" y1=\"160.0\" x2=\"200.0\" y2=\"40.0\" class=\"acc\" /><line x1=\"189.0\" y1=\"160.0\" x2=\"189.0\" y2=\"149.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"189.0\" y1=\"149.0\" x2=\"200.0\" y2=\"149.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 74.0 160.0 A 34 34 0 0 0 67.2 139.6\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"88.4\" y=\"146.1\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"120.0\" y=\"178.3\" class=\"tm\" text-anchor=\"middle\">4 (рядом с α)</text><text x=\"211.0\" y=\"105.0\" class=\"tx\" text-anchor=\"middle\">3</text><text x=\"108.0\" y=\"96.0\" class=\"tx\" text-anchor=\"middle\">5</text></svg></div><div class=\"gcap\">Катеты 3 и 4, гипотенуза 5</div>", "box": "<span class=\"nb\">sin α =</span> противолежащий : гипотенуза<br><span class=\"nb\">cos α =</span> прилежащий : гипотенуза", "n": 18, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Гипотенуза равна 10, а катет напротив угла α равен 6. Чему равен sin α?</p>", "a": 1, "why": "<span class=\"nb\">sin α =</span> противолежащий катет : гипотенуза <span class=\"nb fm\">= 6 : 10 = 0,6.</span>", "h": ["Синус — это противолежащий катет, делённый на гипотенузу."], "opts": ["0,6", "0,8", "1,6"], "back": 17, "n": 19, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Гипотенуза равна 10, а катет рядом с углом α равен 8. Чему равен cos α?</p>", "a": [0.8], "why": "<span class=\"nb\">cos α =</span> прилежащий катет : гипотенуза <span class=\"nb fm\">= 8 : 10 = 0,8.</span>", "h": ["Косинус — это прилежащий катет, делённый на гипотенузу."], "back": 17, "note": "Запиши десятичной дробью, например 0,8", "n": 20, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "1 · Основы · таблица значений", "body": "<p>Три угла встречаются в задачах чаще всего: 30°, 45° и 60°. Их синусы и косинусы просто нужно помнить, как таблицу умножения.</p><div class=\"tblw\"><table><tr><th>α</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr><tr><td>sin α</td><td><span class=\"fr\"><span>1</span><span>2</span></span></td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></td><td>1</td></tr><tr><td>cos α</td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span>1</span><span>2</span></span></td><td>0</td></tr></table></div><p>Подсказка, чтобы не путаться: у синуса значения растут, а у косинуса идут в обратном порядке.</p>", "say": "key", "n": 21, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен cos 60°?</p>", "a": 2, "why": "<span class=\"nb fm\">cos 60° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span> Смотри нижнюю строку таблицы (косинус).", "h": ["Найди 60° в нижней строке таблицы."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>"], "back": 20, "n": 22, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен sin 60°?</p>", "a": 1, "why": "<span class=\"nb fm\">sin 60° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span> Смотри верхнюю строку (синус).", "h": ["Найди 60° в верхней строке таблицы."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>"], "back": 20, "n": 23, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен sin 30°?</p>", "a": 2, "why": "<span class=\"nb fm\">sin 30° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span>", "h": ["Найди 30° в верхней строке таблицы."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>"], "back": 20, "n": 24, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · какие бывают углы", "body": "<p>Угол меньше 90° называется острым, равный 90° — прямым, больше 90°, но меньше 180°, — тупым. Угол 180° называется развёрнутым.</p><p>В треугольнике может быть один тупой угол, например 120°.</p><div class=\"fig\"><svg viewBox=\"0 0 410 165\" width=\"410\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"36.0\" y1=\"95.0\" x2=\"84.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"36.0\" y1=\"95.0\" x2=\"72.8\" y2=\"64.1\" class=\"acc\" /><path d=\"M 53.0 95.0 A 17 17 0 0 0 49.0 84.1\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"56.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">острый</text><text x=\"56.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">40°</text><line x1=\"136.0\" y1=\"95.0\" x2=\"184.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"136.0\" y1=\"95.0\" x2=\"136.0\" y2=\"47.0\" class=\"acc\" /><path d=\"M 153.0 95.0 A 17 17 0 0 0 136.0 78.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"156.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">прямой</text><text x=\"156.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">90°</text><line x1=\"236.0\" y1=\"95.0\" x2=\"284.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"236.0\" y1=\"95.0\" x2=\"212.0\" y2=\"53.4\" class=\"acc\" /><path d=\"M 253.0 95.0 A 17 17 0 0 0 227.5 80.3\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"256.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">тупой</text><text x=\"256.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">120°</text><line x1=\"341.0\" y1=\"95.0\" x2=\"389.0\" y2=\"95.0\" class=\"ln\" /><line x1=\"341.0\" y1=\"95.0\" x2=\"293.0\" y2=\"95.0\" class=\"acc\" /><text x=\"361.0\" y=\"125.3\" class=\"tm\" text-anchor=\"middle\">развёрнутый</text><text x=\"361.0\" y=\"148.0\" class=\"tx\" text-anchor=\"middle\">180°</text></svg></div>", "h": "Какие бывают углы", "n": 25, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Какой из этих углов тупой?</p>", "a": 3, "why": "Тупой угол больше 90°, но меньше 180°. Из трёх вариантов это 120°.", "h": ["Тупой угол больше прямого."], "opts": ["45°", "90°", "120°"], "back": 24, "n": 26, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · зачем", "body": "<p>До сих пор синус и косинус мы находили в прямоугольном треугольнике, где все остальные углы острые. А в обычном треугольнике может быть тупой угол, и для него нужен свой способ.</p><p>Придумаем, как находить синус и косинус любого угла от 0° до 180°. Для этого нарисуем полуокружность.</p>", "n": 27, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · полуокружность", "body": "<p>Нарисуем полуокружность радиуса 1. Центр поставим в точку 0. Угол α отложим от правой части горизонтальной линии, поворачивая против часовой стрелки.</p><p>Луч упрётся в точку M. У этой точки две координаты: x — на сколько она сдвинута вправо или влево от центра, y — на сколько поднята вверх.</p><div class=\"fig\"><svg viewBox=\"0 0 330 195\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"20.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" class=\"ln\" /><line x1=\"160.0\" y1=\"150.0\" x2=\"160.0\" y2=\"22.0\" class=\"gr\" /><path d=\"M 290.0 150.0 A 130 130 0 0 0 30.0 150.0\" class=\"ln\" style=\"stroke-width:2\"/><line x1=\"160.0\" y1=\"150.0\" x2=\"234.6\" y2=\"43.5\" class=\"acc\" /><line x1=\"234.6\" y1=\"43.5\" x2=\"234.6\" y2=\"150.0\" class=\"ln\" stroke-dasharray=\"5 4\"/><circle cx=\"234.6\" cy=\"43.5\" r=\"5\" class=\"dot\"/><path d=\"M 190.0 150.0 A 30 30 0 0 0 177.2 125.4\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"201.5\" y=\"140.5\" class=\"tx\" text-anchor=\"middle\">α</text><text x=\"254.4\" y=\"28.8\" class=\"tx\" text-anchor=\"middle\">M(x; y)</text><text x=\"197.3\" y=\"169.0\" class=\"tx\" text-anchor=\"middle\">x</text><text x=\"245.6\" y=\"101.8\" class=\"tx\" text-anchor=\"middle\">y</text><text x=\"30.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">−1</text><text x=\"160.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">0</text><text x=\"290.0\" y=\"168.3\" class=\"tm\" text-anchor=\"middle\">1</text></svg></div><div class=\"gcap\">Полуокружность радиуса 1</div>", "h": "Полуокружность радиуса 1", "box": "<span class=\"nb\">cos α = x (</span>абсцисса точки M)<br><span class=\"nb\">sin α = y (</span>ордината точки M)", "n": 28, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · это то же самое", "body": "<p>Для острого угла получается то же самое, что мы знали. Гипотенуза здесь равна радиусу, то есть 1, поэтому <span class=\"nb\">sin α =</span> противолежащий катет : <span class=\"nb\">1 = y</span>, а <span class=\"nb\">cos α =</span> прилежащий катет : <span class=\"nb\">1 = x</span>.</p><p>Мы ничего не поменяли: просто взяли старое определение и сделали так, чтобы оно работало и для тупых углов.</p>", "say": "recall", "n": 29, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "2 · Углы больше 90° · попробуй сам", "key": "semi", "h": "Двигаем точку по полуокружности", "n": 30, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · что показал рисунок", "body": "<p>Пока угол острый, точка справа от центра: x больше нуля, поэтому cos положительный.</p><p>При 90° точка прямо над центром: <span class=\"nb\">x = 0</span>, значит, <span class=\"nb\">cos 90° = 0</span>.</p><p>Когда угол тупой, точка уходит влево: x становится отрицательным, и косинус тоже. Число может быть меньше нуля, это нормально.</p><p>А высота y всегда не меньше нуля, поэтому синус никогда не бывает отрицательным.</p>", "box": "Тупой угол: <span class=\"nb fm\">cos α &lt; 0,</span> а <span class=\"nb fm\">sin α &gt; 0</span>", "say": "key", "n": 31, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Угол равен 120°. Какой знак у cos 120°?</p>", "a": 2, "why": "Угол тупой, точка слева от центра, <span class=\"nb\">x &lt; 0</span>. Значит, косинус отрицательный.", "h": ["Посмотри, справа или слева от центра лежит точка при таком угле."], "opts": ["плюс", "минус", "ноль"], "back": 30, "n": 32, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · парные углы", "body": "<p>Углы 60° и 120° вместе дают 180°. Их точки на полуокружности стоят симметрично, как отражение в зеркале, которое стоит вертикально.</p><p>У симметричных точек высота одинакова, а x отличаются только знаком. Двигай угол и смотри на пару точек.</p>", "h": "Углы α и 180° − α", "n": 33, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "Парный угол", "key": "semipair", "n": 34, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · формулы приведения", "body": "<p>Из этого получаем два правила. Они пригодятся в обеих теоремах.</p>", "box": "<span class=\"nb fm\">sin(180° − α) = sin α</span><br><span class=\"nb fm\">cos(180° − α) = −cos α</span>", "say": "key", "n": 35, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "2 · Углы больше 90° · пример", "body": "<p>Найдём cos 120° и sin 120°. Запишем 120° как <span class=\"nb\">180° − 60°</span>.</p><p>Косинус: <span class=\"nb fm\">cos 120° = cos(180° − 60°) = −cos 60° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span></p><p>Синус: <span class=\"nb fm\">sin 120° = sin(180° − 60°) = sin 60° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span></p>", "rev": {"btn": "Таблица для тупых углов", "html": "<p>Те же рассуждения для 135° и 150° дают таблицу:</p><div class=\"tblw\"><table><tr><th>α</th><th>120°</th><th>135°</th><th>150°</th></tr><tr><td>sin α</td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></td><td><span class=\"fr\"><span>1</span><span>2</span></span></td></tr><tr><td>cos α</td><td><span class=\"nb fm\">−<span class=\"fr\"><span>1</span><span>2</span></span></span></td><td><span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></span></td><td><span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></span></td></tr></table></div>"}, "n": 36, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен cos 150°?</p>", "a": 2, "why": "<span class=\"nb fm\">150° = 180° − 30°,</span> поэтому <span class=\"nb fm\">cos 150° = −cos 30° = −<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span>", "h": ["Запиши 150° как <span class=\"nb\">180° − 30°</span>. Потом вспомни, что делает формула с косинусом."], "opts": ["<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "<span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></span>", "<span class=\"nb fm\">−<span class=\"fr\"><span>1</span><span>2</span></span></span>"], "back": 34, "n": 37, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равен sin 135°?</p>", "a": 2, "why": "<span class=\"nb fm\">135° = 180° − 45°.</span> Синус не меняется: <span class=\"nb fm\">sin 135° = sin 45° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>.</span>", "h": ["У синуса при замене α на <span class=\"nb\">180° − α</span> знак не меняется."], "opts": ["<span class=\"nb fm\">−<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></span>", "<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>", "<span class=\"fr\"><span>1</span><span>2</span></span>"], "back": 34, "n": 38, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равен cos 120°? Запиши десятичной дробью.</p>", "a": [-0.5], "why": "<span class=\"nb fm\">cos 120° = −cos 60° = −<span class=\"fr\"><span>1</span><span>2</span></span> = −0,5.</span>", "h": ["Вспомни: <span class=\"nb fm\">cos 120° = −cos 60°.</span>"], "back": 34, "note": "Например: <span class=\"nb\">−0,5</span>", "n": 39, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · идея", "body": "<p>Возьмём две палки длиной 3 и 5 и соединим их шарниром. Если раскрыть их немного, концы будут близко. Если раскрыть шире, концы разойдутся дальше.</p><p>Значит, расстояние между концами зависит от угла между палками. Это и есть третья сторона треугольника. Теорема косинусов позволяет её посчитать.</p><div class=\"fig\"><svg viewBox=\"0 0 390 175\" width=\"390\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"50.0\" y1=\"130.0\" x2=\"94.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"130.0\" x2=\"105.2\" y2=\"83.7\" class=\"ln\" /><line x1=\"94.0\" y1=\"130.0\" x2=\"105.2\" y2=\"83.7\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"50.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 65.0 130.0 A 15 15 0 0 0 61.5 120.4\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"50.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 40°</text><line x1=\"180.0\" y1=\"130.0\" x2=\"224.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"180.0\" y1=\"130.0\" x2=\"180.0\" y2=\"58.0\" class=\"ln\" /><line x1=\"224.0\" y1=\"130.0\" x2=\"180.0\" y2=\"58.0\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"180.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 195.0 130.0 A 15 15 0 0 0 180.0 115.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"180.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 90°</text><line x1=\"310.0\" y1=\"130.0\" x2=\"354.0\" y2=\"130.0\" class=\"ln\" /><line x1=\"310.0\" y1=\"130.0\" x2=\"254.8\" y2=\"83.7\" class=\"ln\" /><line x1=\"354.0\" y1=\"130.0\" x2=\"254.8\" y2=\"83.7\" class=\"acc\" stroke-dasharray=\"5 4\"/><circle cx=\"310.0\" cy=\"130.0\" r=\"4\" class=\"dot\"/><path d=\"M 325.0 130.0 A 15 15 0 0 0 298.5 120.4\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"310.0\" y=\"152.3\" class=\"tm\" text-anchor=\"middle\">угол 140°</text></svg></div><div class=\"gcap\">Две палки на шарнире. Чем шире их раскрыли, тем дальше друг от друга их концы</div>", "h": "Две палки на шарнире", "n": 40, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · связь с Пифагором", "body": "<p>Теорема Пифагора: <span class=\"nb fm\">c² = a² + b².</span> Она верна, только если угол между сторонами a и b прямой.</p><p>А если угол не прямой, к формуле нужно добавить поправку. Её размер зависит от угла. Эту поправку и даёт косинус.</p>", "h": "Это теорема Пифагора с поправкой", "say": "recall", "n": 41, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · теорема", "body": "<p><b>Теорема косинусов.</b> Квадрат стороны треугольника равен сумме квадратов двух других сторон без удвоенного произведения этих сторон на косинус угла между ними.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"122.2\" y1=\"172.0\" x2=\"207.8\" y2=\"172.0\" class=\"ln\" /><line x1=\"122.2\" y1=\"172.0\" x2=\"171.0\" y2=\"38.0\" class=\"ln\" /><line x1=\"171.0\" y1=\"38.0\" x2=\"207.8\" y2=\"172.0\" class=\"acc\" /><path d=\"M 144.2 172.0 A 22 22 0 0 0 129.7 151.3\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"171.5\" y=\"31.1\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"217.2\" y=\"187.4\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"112.3\" y=\"186.9\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"164.5\" y=\"188.3\" class=\"tm\" text-anchor=\"middle\">a</text><text x=\"137.2\" y=\"99.0\" class=\"tm\" text-anchor=\"middle\">b</text><text x=\"199.3\" y=\"100.2\" class=\"tx\" text-anchor=\"middle\">c</text><text x=\"150.9\" y=\"156.2\" class=\"tm\" text-anchor=\"middle\">C</text></svg></div>", "box": "<span class=\"nb fm\">c² = a² + b² − 2ab·cos C</span>", "say": "key", "n": 42, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · читаем формулу", "body": "<p>Разберём формулу по кусочкам.</p><p><b>c</b> — сторона, которую мы ищем. Она лежит напротив угла C.</p><p><b>a</b> и <b>b</b> — две другие стороны. Это именно те стороны, которые образуют угол C.</p><p><b>cos C</b> — косинус этого же угла C, зажатого между a и b.</p><p>Запомни: угол и две его стороны дают третью сторону, ту, что напротив угла.</p>", "n": 43, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · что такое 2ab·cos C", "body": "<p>Запись <span class=\"nb\">2ab·cos C</span> — это просто умножение: <span class=\"nb fm\">2 · a · b · cos C.</span> Все числа перемножаем.</p><p>Пример: <span class=\"nb fm\">a = 3, b = 5, cos C = <span class=\"fr\"><span>1</span><span>2</span></span>.</span> Тогда <span class=\"nb fm\">2 · 3 · 5 · (<span class=\"fr\"><span>1</span><span>2</span></span>) = 30 · (<span class=\"fr\"><span>1</span><span>2</span></span>) = 15.</span></p>", "n": 44, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно <span class=\"nb fm\">2 · 4 · 6 · (<span class=\"fr\"><span>1</span><span>2</span></span>)</span>?</p>", "a": [24], "why": "<span class=\"nb fm\">2 · 4 · 6 = 48,</span> а половина от 48 равна 24.", "h": ["Сначала перемножь <span class=\"nb fm\">2 · 4 · 6,</span> потом найди половину."], "back": 43, "n": 45, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "3 · Косинусы · попробуй сам", "key": "cosdemo", "h": "Двигаем угол C", "n": 46, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · что показал рисунок", "body": "<p><b>Острый угол</b> (меньше <span class=\"nb fm\">90°): cos C &gt; 0,</span> из суммы квадратов вычитаем, поэтому c² получается меньше, чем <span class=\"nb\">a² + b²</span>.</p><p><b>Прямой угол</b>: <span class=\"nb\">cos 90° = 0</span>, поправки нет, получается обычная теорема Пифагора.</p><p><b>Тупой угол</b>: <span class=\"nb fm\">cos C &lt; 0.</span> Минус на минус даёт плюс, значит, мы прибавляем, и c² больше, чем <span class=\"nb\">a² + b²</span>.</p>", "box": "<span class=\"nb fm\">C = 90° &nbsp</span>;→<span class=\"nb fm\">&nbsp; cos C = 0 &nbsp</span>;→<span class=\"nb fm\">&nbsp; c² = a² + b²</span>", "say": "key", "n": 47, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Угол между сторонами a и b равен 90°. Что станет с формулой теоремы косинусов?</p>", "a": 1, "why": "<span class=\"nb\">cos 90° = 0</span>, поэтому слагаемое с косинусом исчезает: <span class=\"nb fm\">c² = a² + b².</span> Это теорема Пифагора.", "h": ["Чему равен cos 90°? Подставь это в формулу."], "opts": ["<span class=\"nb fm\">c² = a² + b²</span>", "<span class=\"nb fm\">c² = a² − b²</span>", "<span class=\"nb\">c² = 2ab</span>"], "back": 46, "n": 48, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Угол C тупой. Как квадрат стороны c соотносится с суммой <span class=\"nb\">a² + b²</span>?</p>", "a": 2, "why": "При тупом угле <span class=\"nb fm\">cos C &lt; 0,</span> значит, <span class=\"nb fm\">−2ab·cos C &gt; 0:</span> мы прибавляем. Поэтому c² больше <span class=\"nb\">a² + b²</span>.", "h": ["Какой знак у косинуса тупого угла? Что тогда делает минус перед 2ab?"], "opts": ["меньше", "больше", "равен"], "back": 46, "n": 49, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · алгоритм", "body": "<div class=\"chs\"><div class=\"chr\"><small>Шаг 1</small><p>Найди угол и две стороны, которые его образуют. Сторона напротив угла — это c, её мы ищем.</p></div><div class=\"chr\"><small>Шаг 2</small><p>Запиши формулу: <span class=\"nb fm\">c² = a² + b² − 2ab·cos C.</span></p></div><div class=\"chr\"><small>Шаг 3</small><p>Подставь числа, значение косинуса возьми из таблицы. Считай по частям.</p></div><div class=\"chr\"><small>Шаг 4</small><p>Посчитай c², а потом извлеки корень. Не останавливайся на c².</p></div></div>", "h": "Как решать: четыре шага", "say": "key", "n": 50, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 1 · шаг 1 · что дано", "body": "<p><b>Дано:</b> две стороны 5 и 8, угол между ними 60°. <b>Найти:</b> третью сторону.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"116.6\" y1=\"172.0\" x2=\"213.4\" y2=\"172.0\" class=\"ln\" /><line x1=\"116.6\" y1=\"172.0\" x2=\"194.0\" y2=\"38.0\" class=\"ln\" /><line x1=\"194.0\" y1=\"38.0\" x2=\"213.4\" y2=\"172.0\" class=\"acc\" /><path d=\"M 138.6 172.0 A 22 22 0 0 0 127.6 152.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"196.8\" y=\"30.3\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"222.5\" y=\"187.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"105.6\" y=\"185.6\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"162.5\" y=\"188.0\" class=\"tm\" text-anchor=\"middle\">a = 5</text><text x=\"137.7\" y=\"88.9\" class=\"tm\" text-anchor=\"middle\">b = 8</text><text x=\"229.8\" y=\"89.9\" class=\"tx\" text-anchor=\"middle\">c = ?</text><text x=\"152.2\" y=\"155.8\" class=\"tm\" text-anchor=\"middle\">60°</text></svg></div><p>Угол 60° зажат между сторонами 5 и 8, значит, это a и b. Напротив угла лежит c, её и ищем.</p>", "n": 51, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 1 · шаг 2 · формула", "body": "<p>Записываем формулу и подставляем числа на место букв.</p><p><span class=\"nb fm\">c² = a² + b² − 2ab·cos C</span></p>", "rev": {"btn": "Подставить числа", "html": "<div class=\"fbox\"><span class=\"nb fm\">c² = 5² + 8² − 2·5·8·cos 60°</span></div>"}, "n": 52, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 1 · шаг 3 · считаем по частям", "body": "<p>Не пытайся сделать всё сразу. Посчитаем каждый кусочек отдельно:</p><p><span class=\"nb\">5² = 25</span><br><span class=\"nb\">8² = 64</span><br><span class=\"nb fm\">2 · 5 · 8 = 80</span><br><span class=\"nb fm\">cos 60° = <span class=\"fr\"><span>1</span><span>2</span></span> (</span>из таблицы)</p>", "rev": {"btn": "Посчитать поправку", "html": "<p>Поправка: <span class=\"nb fm\">80 · <span class=\"fr\"><span>1</span><span>2</span></span> = 40.</span></p>"}, "n": 53, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 1 · шаг 4 · собираем и берём корень", "body": "<p>Собираем всё вместе: сумма квадратов минус поправка.</p>", "rev": {"btn": "Собрать ответ", "html": "<div class=\"fbox\"><span class=\"nb fm\">c² = 25 + 64 − 40 = 89 − 40 = 49</span></div><p>Теперь корень: <span class=\"nb fm\">c = <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">49</span></span> = 7.</span></p><p><b>Ответ: 7.</b> Ровно то, что мы обещали в начале.</p>"}, "n": 54, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Две стороны треугольника равны 8 и 15, угол между ними 60°. Найди третью сторону.</p>", "a": [13], "why": "<span class=\"nb fm\">c² = 8² + 15² − 2·8·15·cos 60° = 64 + 225 − 240 · <span class=\"fr\"><span>1</span><span>2</span></span> = 289 − 120 = 169,</span> и <span class=\"nb\">c = 13</span>.", "h": ["Запиши формулу и подставь: <span class=\"nb fm\">a = 8, b = 15, cos 60° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span>", "Посчитай c², потом извлеки корень. Не забудь про двойку: <span class=\"nb fm\">2·8·15 = 240.</span>"], "back": 50, "n": 55, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 2 · тупой угол · что дано", "body": "<p><b>Дано:</b> стороны 3 и 5, угол между ними 120°. <b>Найти:</b> третью сторону.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"157.3\" y1=\"172.0\" x2=\"250.1\" y2=\"172.0\" class=\"ln\" /><line x1=\"157.3\" y1=\"172.0\" x2=\"79.9\" y2=\"38.0\" class=\"ln\" /><line x1=\"79.9\" y1=\"38.0\" x2=\"250.1\" y2=\"172.0\" class=\"acc\" /><path d=\"M 179.3 172.0 A 22 22 0 0 0 146.3 152.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"70.4\" y=\"32.8\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"261.7\" y=\"182.9\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"155.8\" y=\"190.0\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"214.5\" y=\"188.1\" class=\"tm\" text-anchor=\"middle\">a = 3</text><text x=\"77.6\" y=\"88.4\" class=\"tm\" text-anchor=\"middle\">b = 5</text><text x=\"168.3\" y=\"81.2\" class=\"tx\" text-anchor=\"middle\">c = ?</text><text x=\"176.3\" y=\"143.4\" class=\"tm\" text-anchor=\"middle\">120°</text></svg></div><p>Формула та же: <span class=\"nb fm\">c² = 3² + 5² − 2·3·5·cos 120°.</span> Но что такое cos 120°? Мы это знаем из блока про тупые углы.</p>", "say": "recall", "rev": {"btn": "Вспомнить косинус 120°", "html": "<p><span class=\"nb fm\">cos 120° = −cos 60° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span> Подставляем:</p><div class=\"fbox\"><span class=\"nb fm\">c² = 9 + 25 − 30 · (−<span class=\"fr\"><span>1</span><span>2</span></span>)</span></div>"}, "n": 56, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 2 · про минус на минус", "body": "<p>В формуле перед 30 стоит минус, и сам косинус отрицательный. Когда вычитаешь отрицательное число, получается прибавление.</p><p>Пример из жизни: если у тебя забрали долг в 4 рубля, то у тебя стало на 4 рубля больше. Запись: <span class=\"nb fm\">10 − (−4) = 10 + 4 = 14.</span></p>", "h": "Что значит «минус минус»", "say": "trap", "n": 57, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно <span class=\"nb fm\">10 − (−4)</span>?</p>", "a": [14], "why": "Вычитать отрицательное число — то же самое, что прибавлять: <span class=\"nb fm\">10 + 4 = 14.</span>", "h": ["Минус и минус рядом превращаются в плюс."], "back": 56, "n": 58, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 2 · считаем", "body": "<p>Теперь считаем: <span class=\"nb fm\">3² = 9, 5² = 25, 2·3·5 = 30,</span> а <span class=\"nb fm\">30 · <span class=\"fr\"><span>1</span><span>2</span></span> = 15.</span></p><p>Поправка отрицательная, поэтому её <b>прибавляем</b>.</p>", "rev": {"btn": "Собрать ответ", "html": "<div class=\"fbox\"><span class=\"nb fm\">c² = 34 + 15 = 49</span></div><p><span class=\"nb fm\">c = <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">49</span></span> = 7.</span> <b>Ответ: 7.</b></p>"}, "n": 59, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Ученик решал так: <b><span class=\"nb fm\">c² = 3² + 5² − 2·3·5·cos 120° = 34 − 30 · (−0,5) = 34 − 15 = 19.</span></b> Где ошибка?</p>", "a": 1, "why": "Минус на минус даёт плюс: <span class=\"nb fm\">34 − 30 · (−0,5) = 34 + 15 = 49.</span> Ученик потерял знак.", "h": ["Посмотри на последний переход: что получается, если вычесть отрицательное число?"], "opts": ["Не учтён знак: должно быть <span class=\"nb fm\">34 + 15 = 49</span>", "Нужно было взять <span class=\"nb fm\">cos 120° = 0,5</span>", "Стороны не надо возводить в квадрат"], "back": 56, "wide": true, "n": 60, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Две стороны треугольника равны 6 и 10, угол между ними 120°. Найди третью сторону.</p>", "a": [14], "why": "<span class=\"nb fm\">c² = 36 + 100 − 2·6·10·(−<span class=\"fr\"><span>1</span><span>2</span></span>) = 136 + 60 = 196, c = 14.</span>", "h": ["Угол тупой: <span class=\"nb fm\">cos 120° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span> Подставь и следи за знаком.", "После подстановки получится <span class=\"nb fm\">c² = 136 + 60.</span>"], "back": 55, "n": 61, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · найти угол", "body": "<p>Бывает и наоборот: известны все три стороны, а нужен угол. Тогда неизвестно только cos C.</p><p>Начнём с формулы: <span class=\"nb fm\">c² = a² + b² − 2ab·cos C.</span></p><p>Перенесём слагаемое <span class=\"nb\">2ab·cos C</span> влево, а c² вправо (при переносе знак меняется<span class=\"nb fm\">): 2ab·cos C = a² + b² − c².</span></p><p>Разделим обе части на 2ab, чтобы остался один cos C:</p>", "h": "Как найти угол по трём сторонам", "box": "<span class=\"nb fm\">cos C = <span class=\"fr\"><span>a² + b² − c²</span><span>2ab</span></span></span>", "say": "key", "n": 62, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 3 · найти угол", "body": "<p>Стороны треугольника равны 3, 5 и 7. Найдём угол между сторонами 3 и 5. Он лежит напротив стороны 7.</p><div class=\"fig\"><svg viewBox=\"0 0 330 210\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"157.3\" y1=\"172.0\" x2=\"250.1\" y2=\"172.0\" class=\"ln\" /><line x1=\"157.3\" y1=\"172.0\" x2=\"79.9\" y2=\"38.0\" class=\"ln\" /><line x1=\"79.9\" y1=\"38.0\" x2=\"250.1\" y2=\"172.0\" class=\"acc\" /><path d=\"M 179.3 172.0 A 22 22 0 0 0 146.3 152.9\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"70.4\" y=\"32.8\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"261.7\" y=\"182.9\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"155.8\" y=\"190.0\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"214.5\" y=\"188.1\" class=\"tm\" text-anchor=\"middle\">3</text><text x=\"98.1\" y=\"98.9\" class=\"tm\" text-anchor=\"middle\">5</text><text x=\"166.8\" y=\"94.1\" class=\"tx\" text-anchor=\"middle\">7</text><text x=\"168.1\" y=\"143.0\" class=\"tm\" text-anchor=\"middle\">C = ?</text></svg></div>", "rev": {"btn": "Решить", "html": "<div class=\"fbox\"><span class=\"nb fm\">cos C = <span class=\"fr\"><span>9 + 25 − 49</span><span>2·3·5</span></span> = <span class=\"fr\"><span>−15</span><span>30</span></span> = −<span class=\"fr\"><span>1</span><span>2</span></span></span></div><p>Какой угол имеет косинус <span class=\"nb fm\">−<span class=\"fr\"><span>1</span><span>2</span></span></span>? Вспомни: <span class=\"nb fm\">cos 120° = −<span class=\"fr\"><span>1</span><span>2</span></span>.</span></p><p><b>Ответ: <span class=\"nb\">C = 120°</span>.</b></p>"}, "n": 63, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · какой треугольник", "body": "<p>Если у косинуса знак минус, угол тупой. Поэтому по сторонам можно понять вид треугольника без вычисления углов. Берём <b>наибольшую</b> сторону c и сравниваем её квадрат с суммой квадратов двух других:</p>", "h": "Знак подсказывает вид угла", "box": "<span class=\"nb fm\">c² &lt; a² + b²</span> — остроугольный<br><span class=\"nb fm\">c² = a² + b²</span> — прямоугольный<br><span class=\"nb fm\">c² &gt; a² + b²</span> — тупоугольный", "say": "key", "n": 64, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Стороны треугольника равны 4, 5 и 6. Какой это треугольник?</p>", "a": 1, "why": "Наибольшая сторона <span class=\"nb fm\">6: 6² = 36,</span> а <span class=\"nb fm\">4² + 5² = 16 + 25 = 41.</span> Так как <span class=\"nb\">36 &lt; 41</span>, треугольник остроугольный.", "h": ["Сравни квадрат наибольшей стороны с суммой квадратов двух других."], "opts": ["остроугольный", "прямоугольный", "тупоугольный"], "back": 63, "n": 65, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Стороны треугольника равны 5, 7 и 9. Какой это треугольник?</p>", "a": 3, "why": "Наибольшая сторона <span class=\"nb fm\">9: 9² = 81,</span> а <span class=\"nb fm\">5² + 7² = 25 + 49 = 74.</span> Так как <span class=\"nb\">81 &gt; 74</span>, треугольник тупоугольный.", "h": ["Сравни 9² с суммой <span class=\"nb\">5² + 7²</span>."], "opts": ["остроугольный", "прямоугольный", "тупоугольный"], "back": 63, "n": 66, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Стороны треугольника равны 5, 7 и 8. Найди косинус угла, лежащего напротив стороны 7.</p>", "a": [0.5], "why": "<span class=\"nb fm\">cos C = (5² + 8² − 7²) : (2·5·8) = (25 + 64 − 49) : 80 = 40 : 80 = 0,5.</span>", "h": ["Запиши формулу для косинуса угла. В числителе квадраты двух сторон, образующих угол, минус квадрат стороны напротив.", "Сторона напротив угла — 7, значит, в числителе <span class=\"nb fm\">5² + 8² − 7².</span>"], "back": 61, "note": "Запиши десятичной дробью, например 0,5", "n": 67, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "3 · Косинусы · ошибки", "body": "<div class=\"chs\"><div class=\"chr warn\"><small>Ошибка 1</small><p>Забыть двойку в «2ab». Правильно: <span class=\"nb fm\">2·a·b,</span> то есть удвоенное произведение.</p></div><div class=\"chr warn\"><small>Ошибка 2</small><p>Перепутать, какая сторона лежит напротив угла. Она никогда не выходит из этого угла.</p></div><div class=\"chr warn\"><small>Ошибка 3</small><p>Потерять знак при тупом угле: минус на минус даёт плюс.</p></div><div class=\"chr warn\"><small>Ошибка 4</small><p>Остановиться на c². Это квадрат стороны, нужен ещё корень.</p></div></div>", "h": "Где чаще всего ошибаются", "say": "trap", "n": 68, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Ученик решал: <span class=\"nb fm\">a = 4, b = 6,</span> угол <span class=\"nb\">C = 60°</span>. Он записал <b><span class=\"nb fm\">c² = 4² + 6² − 4·6·0,5 = 40</span></b>. Где ошибка?</p>", "a": 1, "why": "В формуле должно быть удвоенное произведение: <span class=\"nb fm\">2·4·6·0,5 = 24,</span> и тогда <span class=\"nb fm\">c² = 52 − 24 = 28.</span> Ученик пропустил двойку.", "h": ["Сравни его запись с формулой: всё ли на месте?"], "opts": ["Пропущена двойка в 2ab", "cos 60° равен <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>", "Надо было сложить, а не вычесть"], "back": 67, "wide": true, "n": 69, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Стороны <span class=\"nb\">a = 4</span> и <span class=\"nb\">b = 6</span>, угол между ними 60°. Чему равен квадрат третьей стороны, то есть c²?</p>", "a": [28], "why": "<span class=\"nb fm\">c² = 16 + 36 − 2·4·6·(<span class=\"fr\"><span>1</span><span>2</span></span>) = 52 − 24 = 28.</span> Корень из 28 нам не нужен, спрашивали c².", "h": ["Подставь в формулу: <span class=\"nb fm\">4² + 6² − 2·4·6·cos 60°.</span>"], "back": 49, "note": "Спрашивается c², а не c.", "n": 70, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · когда нужна", "body": "<p>Для теоремы косинусов нужны две стороны и угол между ними или три стороны. Но часто в задаче даны <b>сторона и два угла</b>. Тогда косинусы не помогут, а помогает теорема синусов.</p>", "h": "Когда косинусов не хватает", "n": 71, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · проверка на знакомом треугольнике", "body": "<p>Вспомни треугольник с углами 30°, 60° и 90°. Его стороны: 1, √3 и 2. (Катет напротив 30° равен половине гипотенузы.)</p><div class=\"fig\"><svg viewBox=\"0 0 300 205\" width=\"300\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"40.0\" y1=\"165.0\" x2=\"213.0\" y2=\"165.0\" class=\"ln\" /><line x1=\"213.0\" y1=\"165.0\" x2=\"213.0\" y2=\"65.0\" class=\"ln\" /><line x1=\"40.0\" y1=\"165.0\" x2=\"213.0\" y2=\"65.0\" class=\"acc\" /><line x1=\"202.0\" y1=\"165.0\" x2=\"202.0\" y2=\"154.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"202.0\" y1=\"154.0\" x2=\"213.0\" y2=\"154.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 70.0 165.0 A 30 30 0 0 0 66.0 150.0\" class=\"acc\" style=\"stroke-width:2\"/><path d=\"M 213.0 89.0 A 24 24 0 0 1 192.2 77.0\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"100.8\" y=\"153.0\" class=\"tm\" text-anchor=\"middle\">30°</text><text x=\"193.0\" y=\"104.0\" class=\"tm\" text-anchor=\"middle\">60°</text><text x=\"28.5\" y=\"173.4\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"222.2\" y=\"59.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"224.3\" y=\"176.5\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"224.0\" y=\"120.0\" class=\"tx\" text-anchor=\"middle\">1</text><text x=\"126.5\" y=\"184.0\" class=\"tx\" text-anchor=\"middle\">√3</text><text x=\"112.6\" y=\"112.0\" class=\"tx\" text-anchor=\"middle\">2</text></svg></div><div class=\"gcap\">Треугольник с углами 30°, 60°, 90° и сторонами 1, √3, 2</div><p>Разделим каждую сторону на синус угла напротив неё:</p>", "h": "Проверим на знакомом треугольнике", "n": 72, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · три одинаковых числа", "body": "<p>Сторона 1 напротив <span class=\"nb fm\">30°: 1 : sin 30° = 1 : <span class=\"fr\"><span>1</span><span>2</span></span> = 2.</span></p><p>Сторона √3 напротив <span class=\"nb fm\">60°: √3 : sin 60° = √3 : (<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>) = 2.</span></p><p>Сторона 2 напротив <span class=\"nb fm\">90°: 2 : sin 90° = 2 : 1 = 2.</span></p><p>Все три результата одинаковы! Это не случайность. Так будет в любом треугольнике.</p>", "n": 73, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · теорема", "body": "<p><b>Теорема синусов.</b> Стороны треугольника пропорциональны синусам противолежащих углов.</p><p>Это значит: если каждую сторону разделить на синус угла напротив неё, получится одно и то же число. Оно равно диаметру описанной окружности, то есть 2R.</p>", "box": "<span class=\"nb fm\">a : sin A = b : sin B = c : sin C = 2R</span>", "say": "key", "n": 74, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · пары", "body": "<p>Главное правило: сторона и угол напротив неё всегда идут парой.</p><p>Сторона a (то есть BC) и угол A. Сторона b (то есть AC) и угол B. Сторона c (то есть AB) и угол C.</p><p>Помнишь, что значит «напротив»? Сторона не касается этого угла.</p>", "n": 75, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "4 · Синусы · попробуй сам", "key": "sindemo", "h": "Треугольник в окружности", "n": 76, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · что показал рисунок", "body": "<p>Как ни меняй углы, три отношения <span class=\"nb fm\">a : sin A, b : sin B, c : sin C</span> остаются равными. И все они равны 2R, то есть диаметру окружности.</p><p>Ещё заметь: напротив большего угла лежит большая сторона.</p>", "say": "key", "n": 77, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>В треугольнике ABC сторона BC лежит напротив угла A. Какая пара входит в теорему синусов вместе?</p>", "a": 1, "why": "Сторона BC находится напротив угла A, поэтому в паре с ним: <span class=\"nb\">BC : sin A</span>.", "h": ["Сторона и угол должны быть напротив друг друга."], "opts": ["BC и угол A", "BC и угол B", "BC и угол C"], "back": 74, "n": 78, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · откуда берётся (можно пропустить)", "body": "<p>Для любопытных: откуда берётся теорема. Проведём высоту h к стороне AB. Получатся два прямоугольных треугольника.</p><div class=\"fig\"><svg viewBox=\"0 0 310 215\" width=\"310\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"36.0\" y1=\"175.0\" x2=\"276.0\" y2=\"175.0\" class=\"ln\" /><line x1=\"36.0\" y1=\"175.0\" x2=\"176.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"276.0\" y1=\"175.0\" x2=\"176.0\" y2=\"45.0\" class=\"ln\" /><line x1=\"176.0\" y1=\"45.0\" x2=\"176.0\" y2=\"175.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"165.0\" y1=\"175.0\" x2=\"165.0\" y2=\"164.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"165.0\" y1=\"164.0\" x2=\"176.0\" y2=\"164.0\" class=\"ln\" style=\"stroke-width:1.5\"/><path d=\"M 68.0 175.0 A 32 32 0 0 0 59.4 153.2\" class=\"acc\" style=\"stroke-width:2\"/><path d=\"M 246.0 175.0 A 30 30 0 0 1 257.7 151.2\" class=\"acc\" style=\"stroke-width:2\"/><text x=\"24.6\" y=\"183.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"287.2\" y=\"184.3\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"178.0\" y=\"37.2\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"176.0\" y=\"191.3\" class=\"tm\" text-anchor=\"middle\">H</text><text x=\"90.7\" y=\"110.4\" class=\"tx\" text-anchor=\"middle\">b</text><text x=\"240.4\" y=\"110.7\" class=\"tx\" text-anchor=\"middle\">a</text><text x=\"187.0\" y=\"115.0\" class=\"tx\" text-anchor=\"middle\">h</text></svg></div><p>В левом треугольнике <span class=\"nb fm\">sin A = h : b,</span> значит, <span class=\"nb fm\">h = b·sin A.</span> В правом <span class=\"nb fm\">sin B = h : a,</span> значит, <span class=\"nb fm\">h = a·sin B.</span></p><p>Высота одна и та же, поэтому <span class=\"nb fm\">b·sin A = a·sin B.</span> Если разделить обе части на <span class=\"nb fm\">sin A · sin B,</span> получится <span class=\"nb fm\">a : sin A = b : sin B.</span></p>", "say": "recall", "n": 79, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · пропорция", "body": "<p>В теореме синусов будут записи вида <span class=\"nb fm\">x : 2 = 6 : 3.</span> Это пропорция. Чтобы найти x, умножаем крайнее на среднее по диагонали и делим.</p><p>Проще: <span class=\"nb fm\">x : 2 = 6 : 3</span> — значит, <span class=\"nb fm\">x = 2 · 6 : 3 = 12 : 3 = 4.</span> Число 2 переносим к правой дроби.</p>", "h": "Вспомним пропорцию", "n": 80, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Найди <span class=\"nb fm\">x: x : 3 = 8 : 2.</span></p>", "a": [12], "why": "<span class=\"nb fm\">x = 3 · 8 : 2 = 24 : 2 = 12.</span>", "h": ["Умножь 3 на 8 и раздели на 2."], "back": 79, "n": 81, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 4 · шаг 1 · что дано", "body": "<p>В треугольнике ABC сторона <span class=\"nb\">BC = 6</span>, угол <span class=\"nb\">A = 30°</span>, угол <span class=\"nb\">B = 45°</span>. Найдём сторону AC.</p><p>Сторона BC лежит напротив угла A, сторона AC — напротив угла B. Значит, у нас две пары.</p>", "box": "<span class=\"nb fm\">BC : sin A = AC : sin B</span>", "n": 82, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 4 · шаг 2 · подставляем", "body": "<p>Подставляем числа и значения синусов из таблицы: <span class=\"nb fm\">sin 30° = <span class=\"fr\"><span>1</span><span>2</span></span>, sin 45° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>.</span></p>", "rev": {"btn": "Подставить", "html": "<div class=\"fbox\"><span class=\"nb fm\">6 : <span class=\"fr\"><span>1</span><span>2</span></span> = AC : <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span></span></div><p>Слева: <span class=\"nb fm\">6 : <span class=\"fr\"><span>1</span><span>2</span></span> = 12 (</span>в шести целых умещается двенадцать половинок).</p>"}, "n": 83, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно <span class=\"nb fm\">6 : (<span class=\"fr\"><span>1</span><span>2</span></span>)</span>?</p>", "a": [12], "why": "Делить на половину — значит умножать на <span class=\"nb fm\">2: 6 · 2 = 12.</span>", "h": ["Сколько половинок помещается в шести?"], "back": 82, "n": 84, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "Пример 4 · шаг 3 · находим AC", "body": "<p>Получили: <span class=\"nb fm\">12 = AC : (<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>).</span> Отсюда <span class=\"nb fm\">AC = 12 · <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>.</span></p>", "rev": {"btn": "Посчитать", "html": "<div class=\"fbox\"><span class=\"nb fm\">AC = 12 · <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span> = 6<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span></div><p><b>Ответ: 6√2.</b></p>"}, "n": 85, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>В треугольнике ABC сторона <span class=\"nb\">BC = 4</span>, угол <span class=\"nb\">A = 30°</span>, угол <span class=\"nb\">B = 45°</span>. Чему равна сторона AC?</p>", "a": 1, "why": "<span class=\"nb fm\">AC = BC · sin B : sin A = 4 · (<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>) : (<span class=\"fr\"><span>1</span><span>2</span></span>) = 4√2.</span>", "h": ["Составь пропорцию <span class=\"nb fm\">BC : sin A = AC : sin B.</span>", "<span class=\"nb fm\">AC = 4 · sin 45° : sin 30°.</span> Деление на <span class=\"fr\"><span>1</span><span>2</span></span> — это умножение на 2."], "opts": ["4<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span>", "2<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span>", "8<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span>"], "back": 81, "n": 86, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Вспомни: катет, лежащий против угла 30°, равен половине гипотенузы.</p><p>В треугольнике ABC угол <span class=\"nb\">B = 90°</span>, угол <span class=\"nb\">A = 30°</span>, сторона <span class=\"nb\">BC = 5</span>. Найди гипотенузу AC по теореме синусов.</p>", "a": [10], "why": "<span class=\"nb fm\">AC : sin 90° = BC : sin 30°,</span> то есть <span class=\"nb fm\">AC = 5 : (<span class=\"fr\"><span>1</span><span>2</span></span>) = 10.</span> Совпало с тем, что мы знали про катет против 30°.", "h": ["Сторона AC напротив угла B (90°), а BC напротив угла A (30°). Составь пропорцию."], "back": 73, "n": 87, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · описанная окружность", "body": "<p>Описанная окружность — это окружность, которая проходит через все три вершины треугольника. Её радиус обозначают R.</p><div class=\"fig\"><svg viewBox=\"0 0 300 225\" width=\"300\" role=\"img\" aria-label=\"Чертёж\"><circle cx=\"150.0\" cy=\"112.0\" r=\"88\" class=\"ln\"/><line x1=\"134.7\" y1=\"25.3\" x2=\"77.9\" y2=\"162.5\" class=\"ln\" /><line x1=\"77.9\" y1=\"162.5\" x2=\"226.2\" y2=\"156.0\" class=\"ln\" /><line x1=\"226.2\" y1=\"156.0\" x2=\"134.7\" y2=\"25.3\" class=\"ln\" /><line x1=\"150.0\" y1=\"112.0\" x2=\"226.2\" y2=\"156.0\" class=\"acc\" /><circle cx=\"150.0\" cy=\"112.0\" r=\"3.5\" class=\"dot\"/><circle cx=\"134.7\" cy=\"25.3\" r=\"4\" class=\"dot\"/><circle cx=\"77.9\" cy=\"162.5\" r=\"4\" class=\"dot\"/><circle cx=\"226.2\" cy=\"156.0\" r=\"4\" class=\"dot\"/><text x=\"132.1\" y=\"15.6\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"64.8\" y=\"176.7\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"240.1\" y=\"169.0\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"172.9\" y=\"146.7\" class=\"tx\" text-anchor=\"middle\">R</text><text x=\"138.7\" y=\"128.4\" class=\"tx\" text-anchor=\"middle\">O</text></svg></div><div class=\"gcap\">Окружность проходит через все три вершины треугольника. R — её радиус</div><p>Диаметр в два раза больше радиуса, поэтому в теореме синусов стоит число 2R.</p>", "h": "Что такое радиус описанной окружности", "n": 88, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · формула для R", "body": "<p>Из теоремы синусов <span class=\"nb fm\">a : sin A = 2R.</span> Если разделить на 2, получим радиус:</p>", "box": "<span class=\"nb fm\">R = <span class=\"fr\"><span>a</span><span>2·sin A</span></span></span>", "rev": {"btn": "Пример", "html": "<p>Сторона <span class=\"nb\">BC = 3√3</span>, угол <span class=\"nb\">A = 60°</span>. Найдём R.</p><div class=\"fbox\"><span class=\"nb fm\">R = <span class=\"fr\"><span>3<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2 · <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span></span></span> = <span class=\"fr\"><span>3<span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span></span> = 3</span></div><p>Двойка и знаменатель 2 сократились, корни тоже. <b>Ответ: <span class=\"nb\">R = 3</span>.</b></p>"}, "n": 89, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Сторона треугольника равна 7, а угол, лежащий напротив неё, равен 30°. Найди радиус описанной окружности.</p>", "a": [7], "why": "<span class=\"nb fm\">2R = 7 : sin 30° = 7 : (<span class=\"fr\"><span>1</span><span>2</span></span>) = 14,</span> значит, <span class=\"nb\">R = 7</span>.", "h": ["Используй формулу <span class=\"nb fm\">2R = a : sin A.</span> Чему равен sin 30°?"], "back": 88, "n": 90, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Сторона треугольника равна 5, а угол напротив неё равен 150°. Найди радиус описанной окружности.</p>", "a": [5], "why": "<span class=\"nb fm\">sin 150° = sin 30° = <span class=\"fr\"><span>1</span><span>2</span></span>.</span> Тогда <span class=\"nb fm\">2R = 5 : (<span class=\"fr\"><span>1</span><span>2</span></span>) = 10</span> и <span class=\"nb\">R = 5</span>.", "h": ["Чему равен sin 150°? Вспомни формулу приведения: <span class=\"nb fm\">150° = 180° − 30°.</span>"], "back": 34, "n": 91, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "4 · Синусы · ловушка", "body": "<p>Из-за формулы <span class=\"nb fm\">sin(180° − α) = sin α</span> у синуса два подходящих угла. Например, если <span class=\"nb fm\">sin α = <span class=\"fr\"><span>1</span><span>2</span></span>,</span> то α может быть 30° или 150°.</p><p>Поэтому по теореме синусов угол находят, только когда понятно: он острый или тупой. Если непонятно, считай по теореме косинусов: у косинуса знак подскажет.</p>", "h": "Ловушка с синусом", "say": "trap", "n": 92, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Известно, что <span class=\"nb fm\">sin α = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">2</span></span></span><span>2</span></span>,</span> а α — угол треугольника. Какие значения может принимать α?</p>", "a": 2, "why": "<span class=\"nb fm\">sin 45° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" ari AC : sin B.</span>"], "fin": true, "n": 102, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Стороны треугольника равны 6, 8 и 11. Какой это треугольник?</p>", "a": 3, "why": "Наибольшая сторона <span class=\"nb fm\">11: 11² = 121,</span> а <span class=\"nb fm\">6² + 8² = 100.</span> Так как <span class=\"nb fm\">121 &gt; 100,</span> треугольник тупоугольный.", "h": ["Сравни квадрат наибольшей стороны с суммой квадратов двух других."], "opts": ["остроугольный", "прямоугольный", "тупоугольный"], "fin": true, "n": 103, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>В треугольнике ABC сторона <span class=\"nb\">AB = 4√3</span>, угол <span class=\"nb\">C = 120°</span>. Найди радиус описанной окружности.</p>", "a": [4], "why": "<span class=\"nb fm\">sin 120° = sin 60° = <span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>.</span> Тогда <span class=\"nb fm\">2R = 4√3 : (<span class=\"fr\"><span><span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">3</span></span></span><span>2</span></span>) = 8, R = 4.</span>", "h": ["Угол C напротив стороны AB. Используй <span class=\"nb fm\">2R = AB : sin C</span> и формулу приведения для sin 120°."], "fin": true, "n": 104, "_fin": 1, "_sp": 1}];

function burst(x,y,n=90,power=9,kind='mix'){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=power*(.35+Math.random()*.75);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(kind==='fw'?0:3),g:kind==='fw'?.09:.22,life:1,dec:.011+Math.random()*.012,c:COLS[i%COLS.length],sz:kind==='fw'?2.2:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:kind==='fw'?'dot':(Math.random()<.5?'rect':'dot')})}if(!raf)loop()}

function loop(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.life>0);for(const p of P){p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.dec;cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;if(p.sh==='rect'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);cx.restore()}else{cx.beginPath();cx.arc(p.x,p.y,p.sz,0,7);cx.fill()}}cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}

function parseNums(s){
  return String(s).replace(/[−–—]/g,'-').split(/;|\s+и\s+|\n/).map(x=>x.trim().replace(/\s+/g,'').replace(',','.').replace(/^[a-zа-яё][a-zа-яё₀-₉0-9]*=/i,'')).filter(Boolean).map(x=>{
    const m=x.match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?(.*)$/);if(!m)return NaN;
    if(m[3]&&!/^[a-zа-яё°%²³\/.]+$/i.test(m[3]))return NaN;
    if(m[2]&&!/[a-zа-яё]/i.test(m[3]||''))return +m[1]/+m[2];
    return +m[1]});
}
/* answers like "(0; 6)", "0 < x < 6", "−3; (−2; −1)" → sorted canonical items, or null */
function parseSet(raw){
  let s=String(raw).toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/или|и|∪|u/g,';').replace(/[xm]∈/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=');
  s=s.replace(/(\d),(\d)/g,'$1.$2').replace(/,/g,';').replace(/(^|;)[xm]=/g,'$1');
  const N='(-?\\d+(?:\\.\\d+)?)',f=v=>String(+v),items=[];
  const re=new RegExp(`([\\(\\[])${N};${N}([\\)\\]])|${N}(<=?)[xm](<=?)${N}|${N}`,'g');
  const rest=s.replace(re,(m,b1,a1,a2,b2,c1,o1,o2,c2,d)=>{
    if(b1)items.push(b1+f(a1)+';'+f(a2)+b2);
    else if(o1)items.push((o1==='<='?'[':'(')+f(c1)+';'+f(c2)+(o2==='<='?']':')'));
    else items.push(f(d));
    return '';});
  if(rest.replace(/;/g,'')!==''||!items.length)return null;
  return items.sort();
}
function sameSet(a,b){if(a.length!==b.length||a.some(isNaN))return false;const x=[...a].sort((p,q)=>p-q),y=[...b].sort((p,q)=>p-q);return x.every((v,i)=>Math.abs(v-y[i])<1e-6)}

/* ---------- results ---------- */
function score(){
  let ok=0,tot=0,solo=0,hint=0,fok=0,ftot=0,mok=0,mtot=0;
  for(const t of L){if(t.kind!=='q')continue;tot++;const r=S.r[t.n]||{};if(t.fin)ftot++;else mtot++;
    if(r.st==='ok'){ok++;if(t.fin)fok++;else mok++;if(r.hints)hint++;else solo++}}
  const pct=tot?Math.round(ok/tot*100):0;
  return {ok,tot,solo,hint,fok,ftot,mok,mtot,pct,pts:ok,max:tot,maxAll:tot,auto:tot,grade:'',lvl:pct>=83?'уверенно':pct>=50?'почти уверенно':'тема ещё не сложилась',geo:0};
}
function livePts(){let p=0;for(const t of L){const r=S.r[t.n];if(t.kind==='q'&&r&&r.st==='ok')p++}return p}
function tosCode(sc){
  const results={};for(const t of L){if(t.kind!=='q')continue;const r=S.r[t.n];if(!r||!r.st)continue;results[t.n]=r.st==='ok'?1:0}
  const d=new Date(),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const o={v:1,name:S.name,date:iso,title:TEST_TITLE,branch:'Объяснение',right:sc.ok,total:sc.tot,score:sc.ok,mark:null,level:'',geo:0,minutes:Math.round(elapsed()/60),results};
  const b=new TextEncoder().encode(JSON.stringify(o));let bin='';b.forEach(c=>bin+=String.fromCharCode(c));
  return 'Код для «Кабинета репетитора»: TOS1:'+btoa(bin);
}
function report(sc){
  const Lb={ok:'верно',bad:'неверно',idk:'не знаю',th:'есть идея, застрял'};
  const lines=[`25/25 · ${TEST_TITLE} — ${S.name}`,tosCode(sc),`Дата: ${new Date().toLocaleDateString('ru-RU')}, время: ${fmtT(elapsed())}`,
   `Понимание темы: ${sc.pct}% (${sc.ok} из ${sc.tot}) · ${sc.lvl} (предв.)`,
   `Мини-проверки: ${sc.mok}/${sc.mtot} · Итоговая проверка: ${sc.fok}/${sc.ftot}`,
   `Сам(а): ${sc.solo} · с подсказкой: ${sc.hint} · лучшая серия: ${S.best}`,'','По вопросам:'];
  let k=0;
  for(const t of L){if(t.kind!=='q')continue;k++;const r=S.r[t.n]||{};let s=`${k}${t.fin?' (итог)':''}. ${Lb[r.st]||'—'}`;
    if(r.st==='ok'&&r.tries>1)s+=' со 2-й попытки';
    if(r.hints)s+=', подсказка взята';
    if(r.ans&&r.ans.length&&r.st!=='ok')s+=`, ответы: ${r.ans.join(' | ')}`;
    if(r.t)s+=`, ${fmtT(r.t)}`;
    lines.push(s);
    if(r.th)lines.push(`   мысли: «${r.th}»`);
  }
  const weak=L.filter(t=>t.kind==='q'&&!(S.r[t.n]&&S.r[t.n].st==='ok'));
  lines.push('',weak.length?`Подтянуть: вопросы ${weak.map(t=>L.filter(x=>x.kind==='q').indexOf(t)+1).join(', ')}`:'Подтянуть: всё верно');
  {const bl=bonusLine();if(bl)lines.splice(3,0,bl)}

  document.querySelectorAll('.react,.toast,.banner').forEach(x=>x.remove());clearTimeout(react.t);

function resMood(sc){const r=sc.max?sc.pts/sc.max:0;return r>=.6?'joy':r>=.3?'idle':'sad'}
function emblem(){return `<svg class="emb" viewBox="0 0 100 124" width="92" height="114" aria-hidden="true">
  <path d="M36 70 L26 120 L38 110 L47 121 L52 74 Z" fill="#f2905e"/><path d="M64 70 L74 120 L62 110 L53 121 L48 74 Z" fill="#d9733f"/>
  ${Array.from({length:24},(_,i)=>{const a=i*Math.PI/12;return `<circle cx="${(50+40*Math.cos(a)).toFixed(1)}" cy="${(50+40*Math.sin(a)).toFixed(1)}" r="6.5" fill="#1747c9"/>`}).join('')}
  <circle cx="50" cy="50" r="40" fill="#1747c9"/><circle cx="50" cy="50" r="31" fill="#f3ece2"/>
  <circle cx="50" cy="50" r="27" fill="none" stroke="#1747c9" stroke-width="1.2" stroke-dasharray="2 3"/>
  <text x="50" y="47" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Inter,sans-serif" font-weight="800" font-size="16" fill="#1747c9">25</text>
  <rect x="38" y="51" width="24" height="2.6" rx="1.3" fill="#f2905e"/>
  <text x="50" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Inter,sans-serif" font-weight="800" font-size="16" fill="#1747c9">25</text>
</svg>`}
function diploma(sc,okN,own,t){
  const noms=[];
  const thN=L.filter(x=>S.r[x.n]&&S.r[x.n].st==='th').length;
  if(sc.ok===sc.tot)noms.push(['Без единой ошибки',`${sc.ok} из ${sc.tot} верно`]);
  if(S.best>=4)noms.push(['Серия',`${S.best} верных подряд`]);
  if(sc.solo>=sc.tot-1)noms.push(['Почти без подсказок',`${sc.solo} вопросов самостоятельно`]);
  if(sc.fok===sc.ftot)noms.push(['Итог на отлично',`итоговая проверка ${sc.fok} из ${sc.ftot}`]);
  if(thN>=1)noms.push(['Думает своей головой',`свои идеи в ${thN} вопросах`]);
  noms.push(['Смелый старт',`все ${L.length} экранов до конца`]);
  const d=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const ring='25/25 · ТЕМА РАЗОБРАНА · LILI.MATH · ';
  const mood=resMood(sc);
  const say=t?(mood==='joy'?`${t.n} гордится тобой`:mood==='idle'?`${t.n} болеет за тебя`:`${t.n} в шоке, но верит в тебя`):'';
  const corners=own.slice(0,2),rest=own.slice(2);
  return `<div class="dip enter">
    ${corners.map((s,i)=>`<div class="corner c${i}">${stkHTML(s)}</div>`).join('')}
    <div class="peek">${emblem()}</div>
    <div class="dk">ДИПЛОМ</div>
    <div class="dt">вручается</div>
    <div class="dn">${esc(LINK.dat||dative(S.name))}</div>
    <p class="dt">за честно разобранную тему «${esc(TOPIC.t)}»</p>
    <div class="noms">${noms.slice(0,3).map(([a,b])=>`<div class="nom"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
    ${rest.length?`<div class="bomb">${rest.map(s=>stkHTML(s)).join('')}</div>`:''}
    <div class="dfoot">
      ${t?`<figure class="pola"><span class="tape"></span><img src="${PIMG[t.id][mood]}" alt="${t.n}"><figcaption>${say}</figcaption></figure>`:''}
      <div class="dside">
        <div class="seal"><svg viewBox="0 0 92 92"><defs><path id="sp" d="M46 46 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/></defs><text><textPath href="#sp">${ring}</textPath></text></svg>${logoMark(44)}</div>
        <div class="sg">${logoFull(28)}<br>${d}</div>
      </div>
    </div>
  </div>`;
}

}

function csPdf(canvas){
  const W=canvas.width,PH=Math.round(W*297/210),pages=Math.max(1,Math.ceil(canvas.height/PH)),imgs=[];
  for(let k=0;k<pages;k++){
    const c=document.createElement('canvas');c.width=W;c.height=PH;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,PH);
    g.drawImage(canvas,0,k*PH,W,Math.min(PH,canvas.height-k*PH),0,0,W,Math.min(PH,canvas.height-k*PH));
    const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);imgs.push(u);
  }
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  put('%PDF-1.4\n');
  obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>put('<</Type/Pages/Count '+pages+'/Kids['+imgs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']>>'));
  imgs.forEach((u,k)=>{
    const p=3+k*3;
    obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p+1,()=>put('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+PH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+u.length+'>>\nstream\n');put(u);put('\nendstream')});
  });
  const n=3+pages*3,xr=len;
  put('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(let i=1;i<n;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function csExport(kind){
  csMsg('Готовлю файл…');
  csLoad(ok=>{
    if(!ok){csMsg('Не удалось загрузить модуль. Открою печать: выбери «Сохранить как PDF».');csBuildX();setTimeout(()=>window.print(),300);return}
    const x=csBuildX();

      const name='shpargalka-'+(TOPIC.id||'urok');
      if(kind==='jpg')cv.toBlob(b=>{csDownload(b,name+'.jpg');csMsg('Готово: файл JPEG сохранён.')},'image/jpeg',.92);
      else{csDownload(csPdf(cv),name+'.pdf');csMsg('Готово: файл PDF сохранён.')}
      x.remove();
    }).catch(()=>{x.remove();csMsg('Не получилось собрать файл. Сделай скриншот шпаргалки.')});
  });
}
