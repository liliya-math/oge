<script>
(() => {
/* ---------- math helpers ---------- */
const R = s => `<span class="rt"><span class="rs" aria-hidden="true"></span><span class="rad">${s}</span></span>`;
const F = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const M = s => `<span class="m">${s}</span>`;

/* ---------- figures ---------- */
function grid(x0,y0,cols,rows,c){let s='';for(let i=0;i<=cols;i++)s+=`<line class="gr" x1="${x0+i*c}" y1="${y0}" x2="${x0+i*c}" y2="${y0+rows*c}"/>`;for(let j=0;j<=rows;j++)s+=`<line class="gr" x1="${x0}" y1="${y0+j*c}" x2="${x0+cols*c}" y2="${y0+j*c}"/>`;return s}

/* floor plan: cell = 13 px; walls given in cell coordinates */
const TOPIC={"id": "kvadratnye-20", "t": "Квадратные уравнения в ОГЭ №20", "w": "с квадратными уравнениями в №20", "mins": 60, "next": "", "nextT": ""};
const T=[{"kind": "info", "kick": "Минуты 2–3 · Зачем это нужно", "body": "<p>Вот уравнение: x² − 5x + 6 = 0. Подставь x = 2: 4 − 10 + 6 = 0, верно. Подставь x = 3: 9 − 15 + 6 = 0, тоже верно.</p><p>У квадратного уравнения бывает два корня, один корень или ни одного. Сегодня научимся находить их без угадывания и не терять второй корень.</p>", "rev": {"btn": "Спойлер про баллы", "html": "<p>В №20 чаще всего теряют балл не на идее, а на мелочах: потерянный знак, забытый второй корень, деление на x. Все эти ловушки мы разберём.</p>"}, "n": 3, "_sp": 1}, {"kind": "info", "kick": "Минуты 3–5 · Повторяем · квадрат числа", "body": "<p><b>Вспомни.</b> Квадрат числа это число, умноженное само на себя: 5² = 5 · 5 = 25.</p><p>Минус в скобках тоже возводится в квадрат: (−5)² = (−5) · (−5) = 25, потому что минус на минус даёт плюс. А вот −5² без скобок означает «минус от пяти в квадрате», то есть −25.</p>", "box": "(−5)² = 25<br>−5² = −25", "say": "recall", "n": 4, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Чему равно (−4)²?</p>", "a": 1, "why": "(−4)² = (−4) · (−4) = 16. Минус на минус даёт плюс.", "h": ["Умножь −4 на −4. Знак у произведения двух отрицательных чисел плюс."], "opts": ["16", "−16", "8"], "back": 3, "n": 5, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно 3 · (−4)?</p>", "a": [-12], "why": "3 · (−4) = −12. Положительное на отрицательное даёт отрицательное.", "h": ["Умножь 3 на 4 и поставь знак минус."], "back": 3, "n": 6, "_sp": 1}, {"kind": "info", "kick": "Минуты 5–7 · Повторяем · корень", "body": "<p><b>Вспомни.</b> Квадратный корень из числа a это неотрицательное число, квадрат которого равен a. Например, √49 = 7, потому что 7² = 49.</p><p>Но уравнение x² = 49 имеет <b>два</b> решения: x = 7 и x = −7, ведь и 7², и (−7)² дают 49. Это важно: именно здесь чаще всего теряют второй корень.</p>", "box": "√49 = 7<br>x² = 49 → x = 7 или x = −7", "say": "recall", "n": 7, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равен √169?</p>", "a": [13], "why": "13² = 169, значит, √169 = 13.", "h": ["Каким числом, умноженным на себя, получится 169? Попробуй 13."], "back": 6, "n": 8, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равен √0,25?</p>", "a": [0.5], "why": "0,5 · 0,5 = 0,25, значит, √0,25 = 0,5.", "h": ["Какое число в квадрате даёт 0,25?"], "back": 6, "n": 9, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Решите уравнение x² = 36.</p>", "a": 3, "why": "Подходят оба числа: 6² = 36 и (−6)² = 36. Ответ: 6 и −6.", "h": ["Квадрат положительного и отрицательного числа одинаков."], "opts": ["6", "−6", "6 и −6"], "back": 6, "n": 10, "_sp": 1}, {"kind": "info", "kick": "Минуты 7–9 · Повторяем · перенос", "body": "<p><b>Вспомни.</b> Когда слагаемое переносят через знак «=», его знак меняется на противоположный.</p><p>Пример: 5x − 7 = 3x + 1. Переносим 3x влево и −7 вправо: 5x − 3x = 1 + 7. Получаем 2x = 8, откуда x = 4.</p>", "box": "5x − 7 = 3x + 1<br>5x − 3x = 1 + 7<br>2x = 8, x = 4", "say": "recall", "n": 11, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение 6x − 5 = 2x + 7.</p>", "a": [3], "why": "6x − 2x = 7 + 5, значит, 4x = 12 и x = 3.", "h": ["Неизвестные в одну сторону, числа в другую. Не забудь поменять знаки."], "back": 10, "n": 12, "_sp": 1}, {"kind": "info", "kick": "Минуты 9–11 · Повторяем · скобки", "body": "<p><b>Вспомни.</b> Чтобы раскрыть скобки, каждое слагаемое из первой скобки умножают на каждое слагаемое из второй.</p><p>(x + 2)(x − 5) = x · x + x · (−5) + 2 · x + 2 · (−5) = x² − 5x + 2x − 10 = x² − 3x − 10.</p><p>Квадрат суммы и разности: (x + 3)² = x² + 6x + 9, (x − 3)² = x² − 6x + 9.</p>", "box": "(x + 2)(x − 5) = x² − 3x − 10<br>(x − 3)² = x² − 6x + 9", "say": "recall", "n": 13, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Раскройте скобки: (x + 4)(x − 1).</p>", "a": 2, "why": "x² − x + 4x − 4 = x² + 3x − 4.", "h": ["Умножь каждое слагаемое на каждое и приведи подобные: −x + 4x = 3x."], "opts": ["x² + 4x − 4", "x² + 3x − 4", "x² − 3x − 4"], "back": 12, "n": 14, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Раскройте скобки: (x − 2)².</p>", "a": 1, "why": "(x − 2)² = x² − 2 · 2 · x + 4 = x² − 4x + 4. Не забудь середину −4x.", "h": ["Квадрат разности: первое в квадрате, минус удвоенное произведение, плюс второе в квадрате."], "opts": ["x² − 4x + 4", "x² + 4", "x² − 4"], "back": 12, "n": 15, "_sp": 1}, {"kind": "info", "kick": "Минуты 11–13 · Определение", "body": "<p>Квадратным уравнением называется уравнение вида ax² + bx + c = 0, где x — неизвестное, a, b и c — некоторые числа, причём a ≠ 0.</p><p>Число a называют первым коэффициентом, b — вторым коэффициентом, c — свободным членом.</p><p>Например, в уравнении 2x² − 5x + 3 = 0 имеем a = 2, b = −5, c = 3. Знак стоит вместе с числом: перед пятёркой минус, значит, b = −5.</p>", "h": "Квадратное уравнение", "box": "ax² + bx + c = 0, a ≠ 0<br>2x² − 5x + 3 = 0: a = 2, b = −5, c = 3", "say": "key", "n": 16, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>В уравнении 3x² + x − 4 = 0 чему равен c?</p>", "a": [-4], "why": "Свободный член это число без x. Перед четвёркой стоит минус, значит, c = −4.", "h": ["Найди слагаемое без x и возьми его вместе со знаком."], "back": 15, "n": 17, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>В уравнении x² − 6x + 8 = 0 чему равен b?</p>", "a": [-6], "why": "Перед x стоит −6, значит, b = −6. Если перед x² ничего нет, то a = 1.", "h": ["Возьми число перед x вместе со знаком."], "back": 15, "n": 18, "_sp": 1}, {"kind": "info", "kick": "Минуты 13–15 · Привести к виду", "body": "<p>В №20 уравнение почти никогда не дают сразу в виде ax² + bx + c = 0. Первый шаг всегда один: раскрыть скобки, перенести всё в левую часть так, чтобы справа остался ноль, и привести подобные.</p><p>Пример: x(x − 3) = 10. Раскрываем: x² − 3x = 10. Переносим 10: x² − 3x − 10 = 0. Теперь a = 1, b = −3, c = −10.</p>", "h": "Сначала всё в левую часть", "box": "x(x − 3) = 10<br>x² − 3x = 10<br>x² − 3x − 10 = 0", "say": "key", "n": 19, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Приведите к виду ax² + bx + c = 0 уравнение 3x² = 7x − 2. Чему равен b?</p>", "a": [-7], "why": "Переносим 7x и −2 влево: 3x² − 7x + 2 = 0. Значит, b = −7.", "h": ["Перенеси всё вправо в левую часть, меняя знаки: 3x² − 7x + 2 = 0."], "back": 18, "n": 20, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Приведите к виду ax² + bx + c = 0 уравнение (x + 1)(x + 2) = 12. Чему равен c?</p>", "a": [-10], "why": "Раскрываем: x² + 3x + 2 = 12. Переносим: x² + 3x − 10 = 0. Значит, c = −10.", "h": ["Раскрой скобки, потом вычти 12 из обеих частей: 2 − 12 = −10."], "back": 18, "n": 21, "_sp": 1}, {"kind": "info", "kick": "Минуты 15–17 · Неполные уравнения", "body": "<p>Если какой-то коэффициент b или c равен нулю, уравнение называется <b>неполным</b>. Такие уравнения решают проще, чем через дискриминант. Бывают два вида:</p><p><b>1)</b> c = 0: ax² + bx = 0. Выносим x за скобку: x(ax + b) = 0. Произведение равно нулю, когда один из множителей равен нулю: x = 0 или ax + b = 0.</p><p><b>2)</b> b = 0: ax² + c = 0. Переносим число и делим: x² = −c : a. Если справа положительное число, то два корня, если отрицательное, то корней нет.</p>", "h": "Если b или c равны нулю", "box": "ax² + bx = 0 → x(ax + b) = 0 → x = 0 или x = −b : a<br>ax² + c = 0 → x² = −c : a", "say": "key", "n": 22, "_sp": 1}, {"kind": "info", "kick": "Минуты 17–18 · Пример 1 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение x² − 6x = 0.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 23, "_sp": 1}, {"kind": "info", "kick": "Минуты 17–18 · Пример 1 · шаг 1", "body": "<p>Это неполное уравнение: c = 0. Есть x² и x, свободного члена нет.</p>", "h": "Что дано", "n": 24, "_sp": 1}, {"kind": "info", "kick": "Минуты 17–18 · Пример 1 · шаг 2", "body": "<p>Выносим общий множитель x за скобку: x(x − 6) = 0.</p>", "h": "Выносим x", "n": 25, "_sp": 1}, {"kind": "info", "kick": "Минуты 17–18 · Пример 1 · шаг 3", "body": "<p>Произведение равно нулю, когда один из множителей равен нулю. Значит, x = 0 или x − 6 = 0, то есть x = 6.</p>", "h": "Приравниваем множители к нулю", "n": 26, "_sp": 1}, {"kind": "info", "kick": "Минуты 17–18 · Пример 1 · ответ", "body": "<p>Корни: x = 0 и x = 6. Проверка: при x = 6 получаем 36 − 36 = 0, верно.</p>", "box": "Решите уравнение x² − 6x = 0.", "n": 27, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение 2x² + 8x = 0. Запишите меньший корень.</p>", "a": [-4], "why": "2x(x + 4) = 0, откуда x = 0 или x = −4. Меньший корень −4.", "h": ["Вынеси 2x за скобку: 2x(x + 4) = 0."], "back": 21, "n": 28, "_sp": 1}, {"kind": "info", "kick": "Минута 19 · Ловушка", "body": "<p>Уравнение x² = 3x. Многие делят обе части на x и получают x = 3. Так нельзя: при делении на x теряется корень x = 0.</p><p>Правильно: перенести всё влево, x² − 3x = 0, вынести x: x(x − 3) = 0. Корни: 0 и 3.</p>", "h": "Нельзя делить на x", "box": "x² = 3x<br>x² − 3x = 0<br>x(x − 3) = 0<br>x = 0 или x = 3", "say": "trap", "n": 29, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Сколько корней у уравнения x² = 5x?</p>", "a": [2], "why": "x² − 5x = 0, x(x − 5) = 0. Корни 0 и 5, всего два. Деление на x потеряло бы корень 0.", "h": ["Не дели на x. Перенеси 5x влево и вынеси x за скобку."], "back": 28, "n": 30, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение 3x² − 48 = 0.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 31, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · шаг 1", "body": "<p>Здесь b = 0: нет слагаемого с x. Неполное уравнение второго вида.</p>", "h": "Что дано", "n": 32, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · шаг 2", "body": "<p>3x² = 48.</p>", "h": "Переносим число", "n": 33, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · шаг 3", "body": "<p>x² = 48 : 3 = 16.</p>", "h": "Делим на 3", "n": 34, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · шаг 4", "body": "<p>Уравнение x² = 16 имеет два корня: x = 4 и x = −4.</p>", "h": "Берём корни", "n": 35, "_sp": 1}, {"kind": "info", "kick": "Минуты 20–21 · Пример 2 · ответ", "body": "<p>Корни: x = 4 и x = −4. Проверка: 3 · 16 − 48 = 0, верно для обоих.</p>", "box": "Решите уравнение 3x² − 48 = 0.", "n": 36, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² − 25 = 0. Запишите больший корень.</p>", "a": [5], "why": "x² = 25, x = 5 или x = −5. Больший корень 5.", "h": ["Перенеси 25 вправо: x² = 25."], "back": 21, "n": 37, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение 2x² − 18 = 0. Запишите меньший корень.</p>", "a": [-3], "why": "2x² = 18, x² = 9, x = 3 или x = −3. Меньший корень −3.", "h": ["Перенеси 18 вправо и раздели на 2."], "back": 21, "n": 38, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Сколько корней у уравнения x² + 9 = 0?</p>", "a": 1, "why": "x² = −9. Квадрат любого числа неотрицателен, поэтому равным −9 он быть не может. Корней нет.", "h": ["Перенеси 9 вправо. Может ли квадрат быть отрицательным?"], "opts": ["нет корней", "один корень", "два корня"], "back": 21, "n": 39, "_sp": 1}, {"kind": "info", "kick": "Минуты 23–25 · Дискриминант · зачем", "body": "<p>Если и b, и c не равны нулю, например x² − 5x + 6 = 0, вынести x или перенести число уже не получится. Для таких уравнений есть общий способ через дискриминант.</p><p>Дискриминантом квадратного уравнения ax² + bx + c = 0 называется число D = b² − 4ac. Оно показывает, сколько у уравнения корней.</p>", "h": "Когда уравнение полное", "box": "D = b² − 4ac", "say": "key", "n": 40, "_sp": 1}, {"kind": "info", "kick": "Минуты 25–26 · Дискриминант · три случая", "body": "<div class=\"tblw\"><table><tr><th>Дискриминант</th><th>Корней</th><th>Формула</th></tr><tr><td>D &gt; 0</td><td>два</td><td>x = (−b ± √D) : 2a</td></tr><tr><td>D = 0</td><td>один</td><td>x = −b : 2a</td></tr><tr><td>D &lt; 0</td><td>нет</td><td>решений нет</td></tr></table></div><p>Формулу корней записывают так: <span class=\"m\">x = <span class=\"fr\"><span>−b ± <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">D</span></span></span><span>2a</span></span></span>. Знак «±» означает два вычисления: сначала с плюсом, потом с минусом.</p>", "h": "Три случая", "say": "key", "n": 41, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Найдите дискриминант уравнения x² − 7x + 10 = 0.</p>", "a": [9], "why": "a = 1, b = −7, c = 10. D = (−7)² − 4 · 1 · 10 = 49 − 40 = 9.", "h": ["Подставь в D = b² − 4ac. Помни, что (−7)² = 49."], "back": 40, "n": 42, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Найдите дискриминант уравнения 2x² − 3x − 2 = 0.</p>", "a": [25], "why": "a = 2, b = −3, c = −2. D = 9 − 4 · 2 · (−2) = 9 + 16 = 25. Минус на минус даёт плюс.", "h": ["Посчитай по частям: b² = 9, 4ac = 4 · 2 · (−2) = −16. Потом 9 − (−16)."], "back": 40, "n": 43, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Сколько корней у уравнения x² + x + 3 = 0?</p>", "a": 3, "why": "D = 1 − 4 · 1 · 3 = 1 − 12 = −11. D &lt; 0, значит, корней нет.", "h": ["Найди D = b² − 4ac и посмотри на знак."], "opts": ["два", "один", "нет корней"], "back": 40, "n": 44, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение x² − 5x + 6 = 0.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 45, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · шаг 1", "body": "<p>a = 1, b = −5, c = 6.</p>", "h": "Что дано", "n": 46, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · шаг 2", "body": "<p>D = b² − 4ac = (−5)² − 4 · 1 · 6 = 25 − 24 = 1. D &gt; 0, значит, два корня.</p>", "h": "Дискриминант", "n": 47, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · шаг 3", "body": "<p>√D = √1 = 1.</p>", "h": "Корень из D", "n": 48, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · шаг 4", "body": "<p>x₁ = (−b + √D) : 2a = (5 + 1) : 2 = 6 : 2 = 3.</p>", "h": "Формула, плюс", "n": 49, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · шаг 5", "body": "<p>x₂ = (−b − √D) : 2a = (5 − 1) : 2 = 4 : 2 = 2.</p>", "h": "Формула, минус", "n": 50, "_sp": 1}, {"kind": "info", "kick": "Минуты 27–29 · Пример 3 · ответ", "body": "<p>Корни: x = 3 и x = 2. Проверка: 9 − 15 + 6 = 0 и 4 − 10 + 6 = 0.</p>", "box": "Решите уравнение x² − 5x + 6 = 0.", "n": 51, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² − 7x + 10 = 0. Запишите меньший корень.</p>", "a": [2], "why": "D = 9, √D = 3. x = (7 ± 3) : 2, то есть 5 и 2. Меньший корень 2.", "h": ["D = 9. Теперь x = (7 ± 3) : 2."], "back": 44, "n": 52, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² + 4x − 12 = 0. Запишите меньший корень.</p>", "a": [-6], "why": "D = 16 + 48 = 64, √D = 8. x = (−4 ± 8) : 2, то есть 2 и −6. Меньший корень −6.", "h": ["c отрицательное, значит, −4ac даёт плюс: D = 16 + 48."], "back": 44, "n": 53, "_sp": 1}, {"kind": "info", "kick": "Минута 31 · Ловушка · знак перед b", "body": "<p>В формуле стоит <b>−b</b>. Если b = −5, то −b = 5. Если b = 3, то −b = −3.</p><p>Типичная ошибка: ученик видит b = −5 и пишет в числитель −5, забыв, что надо поменять знак. Тогда оба корня получаются неверными.</p>", "box": "b = −5 → −b = 5<br>b = 3 → −b = −3", "say": "trap", "n": 54, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение 2x² + 3x − 2 = 0.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 55, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · шаг 1", "body": "<p>a = 2, b = 3, c = −2.</p>", "h": "Что дано", "n": 56, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · шаг 2", "body": "<p>D = 3² − 4 · 2 · (−2) = 9 + 16 = 25. D &gt; 0, два корня. √D = 5.</p>", "h": "Дискриминант", "n": 57, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · шаг 3", "body": "<p>x₁ = (−3 + 5) : (2 · 2) = 2 : 4 = 0,5.</p>", "h": "Корень с плюсом", "n": 58, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · шаг 4", "body": "<p>x₂ = (−3 − 5) : (2 · 2) = −8 : 4 = −2.</p>", "h": "Корень с минусом", "n": 59, "_sp": 1}, {"kind": "info", "kick": "Минуты 31–33 · Пример 4 · ответ", "body": "<p>Корни: x = 0,5 и x = −2. Обрати внимание: знаменатель 2a = 4, а не 2.</p>", "box": "Решите уравнение 2x² + 3x − 2 = 0.", "n": 60, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение 2x² + 5x − 3 = 0. Запишите меньший корень.</p>", "a": [-3], "why": "D = 25 + 24 = 49, √D = 7. x = (−5 ± 7) : 4, то есть 0,5 и −3. Меньший корень −3.", "h": ["a = 2, значит, знаменатель 2a = 4."], "back": 54, "n": 61, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² − 2x − 3 = 0. Запишите больший корень.</p>", "a": [3], "why": "D = 4 + 12 = 16, √D = 4. x = (2 ± 4) : 2, то есть 3 и −1. Больший корень 3.", "h": ["b = −2, значит, −b = 2."], "back": 53, "n": 62, "_sp": 1}, {"kind": "info", "kick": "Минуты 34–35 · Один корень", "body": "<p>Пример: x² − 6x + 9 = 0. Здесь D = (−6)² − 4 · 1 · 9 = 36 − 36 = 0.</p><p>Корень один: x = −b : 2a = 6 : 2 = 3. Его иногда называют «два одинаковых корня». В ответ записывают одно число 3.</p>", "h": "Когда D = 0", "box": "D = 0 → x = −b : 2a<br>x² − 6x + 9 = 0, x = 3", "n": 63, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² + 6x + 9 = 0.</p>", "a": [-3], "why": "D = 36 − 36 = 0. x = −6 : 2 = −3.", "h": ["D = 0, значит, один корень x = −b : 2a."], "back": 62, "n": 64, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Уравнение x² + 2x + 5 = 0. Что верно?</p>", "a": 3, "why": "D = 4 − 20 = −16 &lt; 0. Корней нет. Так и записывают в ответе: «нет корней».", "h": ["Найди D и посмотри на его знак."], "opts": ["корни 1 и −1", "один корень −1", "корней нет"], "back": 40, "n": 65, "_sp": 1}, {"kind": "info", "kick": "Минуты 35–37 · Корень не извлекается", "body": "<p>Иногда D не является квадратом целого числа. Пример: x² − 6x + 7 = 0. D = 36 − 28 = 8, √8 = 2√2.</p><p>Корни: x = (6 ± 2√2) : 2 = 3 ± √2. Числитель делим почленно: 6 : 2 = 3 и 2√2 : 2 = √2.</p><p>Ответ записывают так: 3 − √2 и 3 + √2. Приближённые значения писать не нужно.</p>", "h": "Если D не квадрат целого числа", "box": "√8 = √(4 · 2) = 2√2<br>x = (6 ± 2√2) : 2 = 3 ± √2", "n": 66, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Решите уравнение x² − 4x + 1 = 0. D = 12. Чему равны корни?</p>", "a": 2, "why": "√12 = 2√3. x = (4 ± 2√3) : 2 = 2 ± √3.", "h": ["Вынеси множитель из корня: √12 = √(4 · 3) = 2√3. Потом раздели всё на 2."], "opts": ["4 ± √3", "2 ± √3", "2 ± 2√3"], "back": 65, "n": 67, "_sp": 1}, {"kind": "info", "kick": "Минуты 37–39 · Теорема Виета", "body": "<p>Уравнение называется приведённым, если a = 1: x² + px + q = 0.</p><p><b>Теорема Виета.</b> Сумма корней приведённого квадратного уравнения равна второму коэффициенту, взятому с противоположным знаком, а произведение корней равно свободному члену.</p><p>Смотри на пример x² − 7x + 12 = 0. Корни 3 и 4: сумма 3 + 4 = 7 = −(−7), произведение 3 · 4 = 12.</p>", "h": "Быстрый способ для приведённых уравнений", "box": "x² + px + q = 0<br>x₁ + x₂ = −p<br>x₁ · x₂ = q", "say": "key", "n": 68, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равна сумма корней уравнения x² + 8x + 7 = 0?</p>", "a": [-8], "why": "x₁ + x₂ = −p = −8.", "h": ["Сумма равна второму коэффициенту с обратным знаком."], "back": 67, "n": 69, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Чему равно произведение корней уравнения x² − 3x − 10 = 0?</p>", "a": [-10], "why": "x₁ · x₂ = q = −10.", "h": ["Произведение равно свободному члену, знак сохраняется."], "back": 67, "n": 70, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение x² + x − 6 = 0 по теореме Виета.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 71, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · шаг 1", "body": "<p>Приведённое уравнение: p = 1, q = −6.</p>", "h": "Что дано", "n": 72, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · шаг 2", "body": "<p>Ищем два числа, сумма которых равна −1, а произведение −6.</p>", "h": "Что нужно", "n": 73, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · шаг 3", "body": "<p>Произведение −6, значит, числа разных знаков. Варианты: 2 и −3, −2 и 3, 1 и −6, −1 и 6.</p>", "h": "Подбираем по произведению", "n": 74, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · шаг 4", "body": "<p>2 + (−3) = −1. Подходит. Остальные пары дают другую сумму.</p>", "h": "Проверяем сумму", "n": 75, "_sp": 1}, {"kind": "info", "kick": "Минуты 39–41 · Пример 5 · ответ", "body": "<p>Корни: x = 2 и x = −3. Проверка: 4 + 2 − 6 = 0 и 9 − 3 − 6 = 0.</p>", "box": "Решите уравнение x² + x − 6 = 0 по теореме Виета.", "n": 76, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите по теореме Виета: x² − 9x + 20 = 0. Запишите больший корень.</p>", "a": [5], "why": "Сумма 9, произведение 20: подходят 4 и 5. Больший корень 5.", "h": ["Подбери два числа: произведение 20, сумма 9."], "back": 70, "n": 77, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите по теореме Виета: x² + 2x − 15 = 0. Запишите меньший корень.</p>", "a": [-5], "why": "Сумма −2, произведение −15: подходят 3 и −5. Меньший корень −5.", "h": ["Произведение −15: пары 3 и −5, −3 и 5, 1 и −15, −1 и 15. Какая даёт сумму −2?"], "back": 70, "n": 78, "_sp": 1}, {"kind": "info", "kick": "Минуты 42–43 · Когда Виета не помогает", "body": "<p>Виета удобна, когда корни целые и маленькие. Если подбор не получается за полминуты, не мучайся: считай через дискриминант.</p><p>Если a ≠ 1, например 2x² − 5x − 3 = 0, сначала можно разделить уравнение на a. Но проще сразу решать через D.</p>", "box": "подбор не идёт → дискриминант", "say": "trap", "n": 79, "_sp": 1}, {"kind": "info", "kick": "Минуты 45–46 · №20 · алгоритм", "body": "<p><b>1.</b> Раскрыть скобки и перенести всё в левую часть так, чтобы справа остался 0.</p><p><b>2.</b> Определить вид: неполное, подходит Виета или нужен дискриминант.</p><p><b>3.</b> Найти корни, записывая каждый шаг.</p><p><b>4.</b> Сделать проверку и записать ответ. Если в условии просят «меньший» или «больший» корень, выбрать нужный.</p>", "h": "Четыре шага для №20", "box": "1) всё влево, справа 0<br>2) вид уравнения<br>3) корни<br>4) проверка и ответ", "say": "key", "n": 80, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение (x − 1)(x + 3) = 5.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 81, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · шаг 1", "body": "<p>(x − 1)(x + 3) = x² + 3x − x − 3 = x² + 2x − 3.</p>", "h": "Раскрываем скобки", "n": 82, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · шаг 2", "body": "<p>x² + 2x − 3 = 5, значит, x² + 2x − 8 = 0.</p>", "h": "Переносим 5", "n": 83, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · шаг 3", "body": "<p>D = 2² − 4 · 1 · (−8) = 4 + 32 = 36, √D = 6.</p>", "h": "Дискриминант", "n": 84, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · шаг 4", "body": "<p>x₁ = (−2 + 6) : 2 = 2, x₂ = (−2 − 6) : 2 = −4.</p>", "h": "Корни", "n": 85, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · шаг 5", "body": "<p>Сумма 2 + (−4) = −2 = −p, произведение 2 · (−4) = −8 = q. Верно.</p>", "h": "Проверка по Виета", "n": 86, "_sp": 1}, {"kind": "info", "kick": "Минуты 46–48 · Пример 6 · ответ", "body": "<p>Ответ: −4; 2. Сначала нужно было привести уравнение к виду «= 0», а уже потом искать корни.</p>", "box": "Решите уравнение (x − 1)(x + 3) = 5.", "n": 87, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · условие", "body": "<p><b>Разберём пример.</b></p><p>Решите уравнение (x − 3)² = 2x − 3.</p><p>Пойдём по шагам. Сначала подумай сама, потом нажимай дальше.</p>", "n": 88, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · шаг 1", "body": "<p>(x − 3)² = x² − 6x + 9.</p>", "h": "Раскрываем квадрат", "n": 89, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · шаг 2", "body": "<p>x² − 6x + 9 − 2x + 3 = 0. Знаки при переносе меняем: −(2x − 3) = −2x + 3.</p>", "h": "Переносим правую часть", "n": 90, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · шаг 3", "body": "<p>x² − 8x + 12 = 0.</p>", "h": "Приводим подобные", "n": 91, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · шаг 4", "body": "<p>D = 64 − 48 = 16, √D = 4.</p>", "h": "Дискриминант", "n": 92, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · шаг 5", "body": "<p>x₁ = (8 + 4) : 2 = 6, x₂ = (8 − 4) : 2 = 2.</p>", "h": "Корни", "n": 93, "_sp": 1}, {"kind": "info", "kick": "Минуты 48–50 · Пример 7 · ответ", "body": "<p>Ответ: 2; 6. Проверка: при x = 2 слева (−1)² = 1, справа 4 − 3 = 1. Верно.</p>", "box": "Решите уравнение (x − 3)² = 2x − 3.", "n": 94, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Решите уравнение x(x − 2) = 3. Сначала приведите его к виду ax² + bx + c = 0. Какое уравнение получится?</p>", "a": 1, "why": "x² − 2x = 3, значит, x² − 2x − 3 = 0.", "h": ["Раскрой скобки: x · x − 2 · x. Потом перенеси 3 влево."], "opts": ["x² − 2x − 3 = 0", "x² − 2x + 3 = 0", "x² + 2x − 3 = 0"], "back": 79, "n": 95, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x(x − 2) = 3. Запишите больший корень.</p>", "a": [3], "why": "x² − 2x − 3 = 0, D = 16, x = (2 ± 4) : 2, то есть 3 и −1. Больший корень 3.", "h": ["Используй уравнение x² − 2x − 3 = 0."], "back": 79, "n": 96, "_sp": 1}, {"kind": "info", "kick": "Минуты 50–52 · Ловушки №20", "body": "<p><b>1.</b> Деление обеих частей на x. Теряется корень x = 0.</p><p><b>2.</b> Потерянный знак при переносе слагаемого или при раскрытии скобок со знаком минус.</p><p><b>3.</b> Забытая двойка в знаменателе: делить надо на 2a, а не на 2.</p><p><b>4.</b> Остановились на √D и не нашли x.</p><p><b>5.</b> Записали только один корень из двух, когда в условии нужны все.</p>", "h": "Где теряют баллы", "box": "x² = 3x → НЕ делить на x<br>знаменатель 2a, не 2", "say": "trap", "n": 97, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Ученик решал x² = 7x так: «разделим на x, получим x = 7». Что он потерял?</p>", "a": 2, "why": "Он потерял корень x = 0. Правильно: x² − 7x = 0, x(x − 7) = 0, корни 0 и 7.", "h": ["Перенеси 7x влево и вынеси x за скобку."], "opts": ["корень 7", "корень 0", "ничего"], "back": 96, "n": 98, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Ученик решал уравнение x² − 4x − 5 = 0 и получил D = 16 − 20 = −4. В чём ошибка? Найдите правильное значение D.</p>", "a": [36], "why": "c = −5, значит, −4ac = −4 · 1 · (−5) = +20. D = 16 + 20 = 36.", "h": ["Минус на минус даёт плюс. Посчитай −4 · 1 · (−5)."], "back": 96, "n": 99, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Ученик решал 2x² − 8x + 6 = 0, получил D = 16 и написал x = (8 ± 4) : 2. Какой знаменатель правильный?</p>", "a": [4], "why": "a = 2, значит, 2a = 4. Тогда x = (8 ± 4) : 4, то есть 3 и 1.", "h": ["В формуле корней знаменатель 2a."], "back": 96, "n": 100, "_sp": 1}, {"kind": "info", "kick": "Минуты 52–53 · Как выбрать способ", "body": "<div class=\"tblw\"><table><tr><th>Какое уравнение</th><th>Способ</th></tr><tr><td>нет члена с x или нет свободного члена</td><td>неполное: вынести x или перенести число</td></tr><tr><td>a = 1, числа небольшие</td><td>Виета</td></tr><tr><td>всё остальное</td><td>дискриминант</td></tr></table></div>", "h": "Какой способ взять", "say": "key", "n": 101, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Каким способом удобнее решить x² − 49 = 0?</p>", "a": 1, "why": "Это неполное уравнение: x² = 49, корни 7 и −7.", "h": ["Есть ли здесь слагаемое с x?"], "opts": ["неполное: разложить на множители или перенести число", "теорема Виета", "дискриминант"], "back": 100, "n": 102, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Каким способом удобнее решить x² − 8x + 15 = 0?</p>", "a": 2, "why": "a = 1, числа маленькие. Сумма 8, произведение 15: корни 3 и 5.", "h": ["Подбери два числа: сумма 8, произведение 15."], "opts": ["неполное: разложить на множители или перенести число", "теорема Виета", "дискриминант"], "back": 100, "n": 103, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Каким способом удобнее решить 3x² − 7x + 2 = 0?</p>", "a": 3, "why": "a ≠ 1 и числа не подбираются устно. Надёжнее дискриминант.", "h": ["Здесь a = 3, а не 1."], "opts": ["неполное: разложить на множители или перенести число", "теорема Виета", "дискриминант"], "back": 100, "n": 104, "_sp": 1}, {"kind": "cheat", "kick": "Шпаргалка", "rules": ["Квадратное уравнение: ax² + bx + c = 0, a ≠ 0. Сначала всё влево, справа 0.", "Неполное: ax² + bx = 0 → x(ax + b) = 0. И ax² + c = 0 → x² = −c : a. Делить на x нельзя.", "Дискриминант: D = b² − 4ac. D &gt; 0: два корня x = (−b ± √D) : 2a. D = 0: один корень x = −b : 2a. D &lt; 0: корней нет.", "Виета для x² + px + q = 0: x₁ + x₂ = −p, x₁ · x₂ = q."], "ex": ["(x − 1)(x + 3) = 5.", "x² + 2x − 3 = 5, x² + 2x − 8 = 0, D = 36, x = (−2 ± 6) : 2. Ответ: −4; 2."], "trap": "Делить на x, потерять знак при переносе, забыть 2a в знаменателе, не посчитать минус на минус в −4ac.", "share": "Привёл к «= 0», посмотрел на вид, нашёл корни, проверил по Виета. Запиши все шаги: в №20 важно и решение.", "say": "cheat", "n": 105, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² − 2x = 3x + 14. Запишите больший корень.</p>", "a": [7], "why": "x² − 5x − 14 = 0. D = 25 + 56 = 81, √D = 9. x = (5 ± 9) : 2, то есть 7 и −2. Больший корень 7.", "h": ["Перенеси 3x и 14 влево: x² − 2x − 3x − 14 = 0."], "fin": true, "n": 106, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение (x − 4)(x + 2) = 7. Запишите меньший корень.</p>", "a": [-3], "why": "x² − 2x − 8 = 7, x² − 2x − 15 = 0. D = 64, x = (2 ± 8) : 2, то есть 5 и −3. Меньший корень −3.", "h": ["Раскрой скобки: x² − 2x − 8. Потом перенеси 7."], "fin": true, "n": 107, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение 2x² − x − 1 = 0. Запишите меньший корень (десятичной дробью).</p>", "a": [-0.5], "why": "D = 1 + 8 = 9, √D = 3. x = (1 ± 3) : 4, то есть 1 и −0,5. Меньший корень −0,5.", "h": ["a = 2, знаменатель 2a = 4."], "fin": true, "note": "Например: −0,5", "n": 108, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Найдите произведение корней уравнения 4x² − 36 = 0.</p>", "a": [-9], "why": "x² = 9, корни 3 и −3. Произведение 3 · (−3) = −9.", "h": ["Сначала найди оба корня: x² = 9."], "fin": true, "n": 109, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Решите уравнение x² + 6x + 9 = 0.</p>", "a": [-3], "why": "D = 36 − 36 = 0. x = −6 : 2 = −3. Один корень.", "h": ["D = 0, один корень x = −b : 2a."], "fin": true, "n": 110, "_sp": 1}];

  const c=ac();if(!c||!S.sound)return;

function petVoice(c,dest,T0,id,mood){
  const sad=mood==='sad';
  const out=c.createGain();out.gain.value=.9;out.connect(dest);
  let NB=null;const noiseBuf=()=>{if(NB)return NB;const len=c.sampleRate*2;NB=c.createBuffer(1,len,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return NB};
  const ramp=(p,pts,n,dur,lin)=>pts.forEach(([k,f],i)=>i?(lin?p.linearRampToValueAtTime(f,n+k*dur):p.exponentialRampToValueAtTime(f,n+k*dur)):p.setValueAtTime(f,n));
  /* voice: a buzzy source with a pitch curve, shaped by moving formant filters, like a vocal tract */
  const voice=(t0,dur,f0,fm,o={})=>{
    const n=T0+t0,src=c.createOscillator();src.type=o.type||'sawtooth';ramp(src.frequency,f0,n,dur);
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg).connect(src.frequency);l.start(n);l.stop(n+dur+.05)}
    const mix=c.createGain();mix.gain.value=o.boost||4;
    const Q=o.q||[7,9,11],G=[1,.55,.3];
    for(let j=0;j<fm[0][1].length;j++){const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=Q[j];ramp(bp.frequency,fm.map(([k,F])=>[k,F[j]]),n,dur,true);const g=c.createGain();g.gain.value=G[j];src.connect(bp).connect(g).connect(mix)}
    if(o.noise){const ns=c.createBufferSource();ns.buffer=noiseBuf();const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=o.noise[0];bp.Q.value=.8;const g=c.createGain();g.gain.value=o.noise[1];ns.connect(bp).connect(g).connect(mix);ns.start(n);ns.stop(n+dur+.02)}
    let tail=mix;
    if(o.am){const am=c.createGain();am.gain.value=1-o.am[1]/2;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.am[0];lg.gain.value=o.am[1]/2;l.connect(lg).connect(am.gain);l.start(n);l.stop(n+dur+.05);mix.connect(am);tail=am}
    const env=c.createGain(),v=o.vol||.16,a=o.att||.04;env.gain.setValueAtTime(0,n);env.gain.linearRampToValueAtTime(v,n+a);env.gain.setValueAtTime(v,n+Math.max(a,dur*(o.hold||.6)));env.gain.exponentialRampToValueAtTime(.0001,n+dur);
    tail.connect(env).connect(out);src.start(n);src.stop(n+dur+.05)};
  if(id==='cat'){ /* мяу: рот закрыт → открыт «а» → округлён «у» */
    if(sad)voice(0,1.05,[[0,560],[.25,640],[1,330]],[[0,[700,1800,3100]],[.3,[950,1600,2900]],[1,[420,900,2600]]],{vib:[5,10],att:.08,hold:.55,vol:.24});
    else voice(0,.72,[[0,470],[.35,760],[1,440]],[[0,[600,1900,3200]],[.3,[1050,1700,3000]],[1,[450,1000,2800]]],{vib:[6,8],att:.06,hold:.55,vol:.24})}
  else if(id==='dog'||id==='lab'){
    if(sad)voice(0,.85,[[0,980],[.4,1080],[1,620]],[[0,[1000,2100,3200]],[1,[800,1700,3000]]],{type:'triangle',vib:[7,30],att:.06,hold:.5,vol:.08}); /* скулит */
    else [0,.26].forEach((t,i)=>voice(t,.17,[[0,280-i*15],[.2,430-i*20],[1,210]],[[0,[650,1250,2600]],[.3,[900,1400,2700]],[1,[550,1050,2400]]],{noise:[1400,.35],att:.006,hold:.3,vol:.26})) /* гав-гав */}
  else if(id==='ham'){
    if(sad)voice(0,.32,[[0,3600],[.3,3900],[1,2500]],[[0,[3600,7000,9000]]],{type:'sine',q:[2,3,3],att:.01,hold:.4,vol:.1,boost:2.5});
    else [0,.09,.16].forEach((t,i)=>voice(t,.07,[[0,3000+i*250],[.5,3900+i*250],[1,3300]],[[0,[3500,7000,9000]]],{type:'sine',q:[2,3,3],att:.005,hold:.4,vol:.1,boost:2.5})) /* пи-пи-пи */}
  else if(id==='meer'){
    if(sad)[0,.13].forEach(t=>voice(t,.09,[[0,950],[1,700]],[[0,[1300,2600,4200]]],{noise:[2200,.6],att:.004,hold:.25,vol:.16})); /* тревожное «чак-чак» */

function parseNums(s){

    const m=x.match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?(.*)$/);if(!m)return NaN;
    if(m[3]&&!/^[a-zа-яё°%²³\/.]+$/i.test(m[3]))return NaN;

/* answers like "(0; 6)", "0 < x < 6", "−3; (−2; −1)" → sorted canonical items, or null */
function parseSet(raw){
  let s=String(raw).toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/или|и|∪|u/g,';').replace(/[xm]∈/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=');
  s=s.replace(/(\d),(\d)/g,'$1.$2').replace(/,/g,';').replace(/(^|;)[xm]=/g,'$1');
  const N='(-?\\d+(?:\\.\\d+)?)',f=v=>String(+v),items=[];
  const re=new RegExp(`([\\(\\[])${N};${N}([\\)\\]])|${N}(<=?)[xm](<=?)${N}|${N}`,'g');
  const rest=s.replace(re,(m,b1,a1,a2,b2,c1,o1,o2,c2,d)=>{
    if(b1)items.push(b1+f(a1)+';'+f(a2)+b2);
    else if(o1)items.push((o1==='<='?'[':'(')+f(c1)+';'+f(c2)+(o2==='<='?']':')'));
    else items.push(f(d));
    return '';});
  if(rest.replace(/;/g,'')!==''||!items.length)return null;
  return items.sort();
}

function grant(rar){const own=new Set(S.stk);let pool=STK.filter(s=>s.r===rar&&!own.has(s.id));if(!pool.length)pool=STK.filter(s=>!own.has(s.id));const s=pool.length?pick(pool):pick(STK);if(!own.has(s.id))S.stk.push(s.id);return s}

function scratchGame(g,done){
  const s=grant(rollRarity());
  g.innerHTML=`<div class="scr"><div>${stkHTML(s,'big')}</div><canvas></canvas></div>`;
  const c=g.querySelector('canvas'),ctx=c.getContext('2d');
  const sz=()=>{const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);
    const gr=ctx.createLinearGradient(0,0,r.width,r.height);gr.addColorStop(0,'#eee0c8');gr.addColorStop(.5,'#eee0c8');gr.addColorStop(1,'#c9ab82');ctx.fillStyle=gr;ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle='rgba(22,35,26,.12)';for(let i=0;i<160;i++)ctx.fillRect(Math.random()*r.width,Math.random()*r.height,2,2);
    ctx.fillStyle='#2b3d2b';ctx.font='700 18px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.fillText('СОТРИ МЕНЯ',r.width/2,r.height/2+6);return r};
  const r=sz();let down=false,last=null,moves=0,fin=false;
  ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineWidth=38;
  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId);ac()};
  c.onpointerup=c.onpointercancel=()=>{down=false};
  c.onpointermove=e=>{if(!down||fin)return;const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;
    if(++moves%4===0)tone(2200+Math.random()*800,0,.02,'square',.006);
    if(moves%8===0){const d=ctx.getImageData(0,0,c.width,c.height).data;let clear=0,tot=0;for(let i=3;i<d.length;i+=64){tot++;if(d[i]<100)clear++}
      if(clear/tot>.5){fin=true;c.style.opacity=0;setTimeout(()=>{c.remove();done(s)},400)}}};
}
function wheelGame(g,done){

function score(){
  let ok=0,tot=0,solo=0,hint=0,fok=0,ftot=0,mok=0,mtot=0;

    if(r.st==='ok'){ok++;if(t.fin)fok++;else mok++;if(r.hints)hint++;else solo++}}
  const pct=tot?Math.round(ok/tot*100):0;
  return {ok,tot,solo,hint,fok,ftot,mok,mtot,pct,pts:ok,max:tot,maxAll:tot,auto:tot,grade:'',lvl:pct>=83?'уверенно':pct>=50?'почти уверенно':'тема ещё не сложилась',geo:0};
}

}

function csPdf(canvas){
  const W=canvas.width,PH=Math.round(W*297/210),pages=Math.max(1,Math.ceil(canvas.height/PH)),imgs=[];
  for(let k=0;k<pages;k++){
    const c=document.createElement('canvas');c.width=W;c.height=PH;const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,W,PH);
    g.drawImage(canvas,0,k*PH,W,Math.min(PH,canvas.height-k*PH),0,0,W,Math.min(PH,canvas.height-k*PH));
    const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);imgs.push(u);
  }
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  put('%PDF-1.4\n');
  obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>put('<</Type/Pages/Count '+pages+'/Kids['+imgs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']>>'));
  imgs.forEach((u,k)=>{
    const p=3+k*3;
    obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p+1,()=>put('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+PH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+u.length+'>>\nstream\n');put(u);put('\nendstream')});
  });
  const n=3+pages*3,xr=len;
  put('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(let i=1;i<n;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function csExport(kind){

    const x=csBuildX();

      else{csDownload(csPdf(cv),name+'.pdf');csMsg('Готово: файл PDF сохранён.')}
      x.remove();
    }).catch(()=>{x.remove();csMsg('Не получилось собрать файл. Сделай скриншот шпаргалки.')});
  });
}
