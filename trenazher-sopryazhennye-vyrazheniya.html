<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211e">
<title>Сопряжённые выражения: тренажёр</title>
<style>
:root{--bg:#14211e;--card:rgba(243,236,226,.07);--line:rgba(243,236,226,.16);--fg:#f3ece2;--muted:rgba(243,236,226,.62);--cobalt:#1747c9;--apricot:#f2905e;--yellow:#f5dc6a;--mint:#8fd9b0;--miss:#ff8f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.25}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.big{font-size:32px;margin:8px 0 14px;line-height:1.7}
.rad{position:relative;display:inline-block;white-space:nowrap;vertical-align:baseline;padding-left:.72em;line-height:1.2}
.ov{display:inline-block;padding:.2em .12em 0 .05em}
.bl{display:inline-block;width:0;height:0}
.rad>svg{position:absolute;left:0;top:0;margin:0;display:block;pointer-events:none;overflow:visible}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--fg);padding:0 4px .26em}
.fr>span:last-child{padding-top:.16em}
.nw{white-space:nowrap}
input.ans{font:inherit;font-size:26px;width:100%;max-width:240px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
input.ans:focus,input.nm:focus{outline:2px solid var(--yellow);outline-offset:1px}
input.nm{font:inherit;font-size:20px;width:100%;max-width:360px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:var(--cobalt);color:#fff;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px 4px 2px 0}
.opt{font:inherit;font-size:20px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:rgba(243,236,226,.06);color:var(--fg);cursor:pointer;margin:0 10px 10px 0}
.opt:active{background:rgba(243,236,226,.16)}
.dots{margin:4px 0 10px}
.dot{display:inline-block;width:15px;height:15px;border:2px solid var(--fg);border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--mint);border-color:var(--mint)}
.ok{color:var(--mint);font-weight:700}
.bad{color:var(--miss);font-weight:700}
.hint{border-left:4px solid var(--yellow);background:rgba(245,220,106,.1);padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .st{font-size:14px;color:var(--muted);white-space:nowrap}
.row.passed .st{color:var(--mint)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
svg{display:block;margin:6px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:28px}}
</style>
<script src="cabinet-report.js"></script>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<script>
'use strict';
//CONTENT-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>String(Math.round(n*10000)/10000).replace('.',',').replace('-','−');
const R=x=>`<span class="rad"><span class="ov">${x}<i class="bl"></i></span></span>`;
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const nw=q=>String(q).replace(/\([^()]*\)²?/g,m=>`<span class="nw">${m}</span>`);
function nm(q,ans,why,prompt,hint,x){q=nw(q);return Object.assign({q,type:'num',ans,why,prompt:prompt||'Найди значение',hint:hint||''},x||{})}
function ch(q,options,correct,why,prompt,hint,x){q=nw(q);return Object.assign({q,type:'choice',options:shuf(options),correct,why,prompt,hint:hint||''},x||{})}
const SQ=Math.sqrt;
const isSq=n=>Number.isInteger(Math.sqrt(n));
const ns=(lo,hi)=>{let a;do{a=ri(lo,hi)}while(isSq(a));return a};
const nsNot=(lo,hi,x)=>{let a;do{a=ns(lo,hi)}while(a===x);return a};
const sg=s=>s>0?'+':'−';
const C=k=>k>1?String(k):'';
// слагаемое: число {t:'i',v} или k√a {t:'r',k,a}
function term(kind){return kind==='i'?{t:'i',v:ri(2,9)}:{t:'r',k:pick([1,1,2,3,4,5]),a:ns(2,30)}}
const tx=t=>t.t==='i'?String(t.v):C(t.k)+R(t.a);
const sq=t=>t.t==='i'?t.v*t.v:t.k*t.k*t.a;
const tv=t=>t.t==='i'?t.v:t.k*SQ(t.a);
function pairForm(){let P,Q;do{const g=ri(0,2);if(g===0){P=term('r');Q=term('i')}else if(g===1){P=term('i');Q=term('r')}else{P=term('r');Q=term('r')}}while(sq(P)===sq(Q)||(P.t==='r'&&Q.t==='r'&&P.a===Q.a));return[P,Q]}
const expr=(P,s,Q)=>`${tx(P)} ${sg(s)} ${tx(Q)}`;
function conjTag(P,Q){const p2=sq(P),q2=sq(Q),aP=P.t==='r'?P.k*P.a:p2,aQ=Q.t==='r'?Q.k*Q.a:q2;
 return u=>u===p2+q2?'сложил квадраты вместо вычитания':u===q2-p2?'перепутал порядок вычитания':((P.k>1||Q.k>1)&&(u===aP-q2||u===p2-aQ||u===aP-aQ))?'не возвёл коэффициент в квадрат':''}
const PX=[[2,1],[3,1],[3,2],[4,1],[4,3],[5,2],[5,3],[5,4],[6,1],[6,5]];
const DD=[1,2,4,5,8,10,16,20,25];

// 1. Сопряжённое выражение
function g1(){const [P,Q]=pairForm(),s=ri(0,1)?1:-1;
 const e=expr(P,s,Q),c=expr(P,-s,Q);
 const fl=s>0?`−${tx(P)} − ${tx(Q)}`:`−${tx(P)} + ${tx(Q)}`;
 let Q2;if(Q.t==='i')Q2={t:'i',v:Q.v+1};else{Q2={t:'r',k:Q.k,a:ns(2,30)};while(Q2.a===Q.a)Q2.a=ns(2,30)}
 const w=expr(P,-s,Q2);
 return ch(e,[c,e,fl,w],c,'Сопряжённое выражение получают заменой знака между слагаемыми на противоположный. Слагаемые остаются те же, со своими знаками и коэффициентами.','Какое выражение сопряжено с данным?','Смени только знак между слагаемыми. Всё остальное перепиши без изменений.',{etag:'ошибка при записи сопряжённого выражения'})}

// 2. Произведение сопряжённых
function g2(){const [P,Q]=pairForm(),A=tx(P),B=tx(Q);
 const q=ri(0,1)?`(${A} − ${B})(${A} + ${B}) = ?`:`(${A} + ${B})(${A} − ${B}) = ?`;
 return nm(q,sq(P)-sq(Q),'(a − b)(a + b) = a² − b²: квадрат первого слагаемого минус квадрат второго. Если перед корнем стоит число, в квадрат возводят и его: (k√a)² = k²a. Проверка: в ответе нет знака корня.','Найди значение (может получиться отрицательное число)','Найди квадрат первого слагаемого, квадрат второго и вычти. Коэффициент перед корнем тоже возводится в квадрат.',{tag:conjTag(P,Q),val:(tv(P)-tv(Q))*(tv(P)+tv(Q))})}

// 3. Квадрат суммы и разности
function g3(){const t=ri(0,3);
 if(t===0){const b=ns(2,40),a=nsNot(2,40,b);
  return nm(`(${R(a)} + ${R(b)})² + (${R(a)} − ${R(b)})² = ?`,2*(a+b),'(a + b)² + (a − b)² = 2a² + 2b²: слагаемые 2ab и −2ab взаимно уничтожаются. Здесь a² и b² — подкоренные числа.','Найди значение','Раскрой оба квадрата по формулам сокращённого умножения. Какие слагаемые сократятся?',{tag:u=>u===a+b?'не удвоил результат':u===2*a-2*b?'вычел вместо сложения':'',val:(SQ(a)+SQ(b))**2+(SQ(a)-SQ(b))**2})}
 if(t===1){const p=pick([2,3,5,6,7]),[x,y]=pick(PX),a=p*x*x,b=p*y*y;
  return nm(`(${R(a)} + ${R(b)})² − (${R(a)} − ${R(b)})² = ?`,4*p*x*y,'(a + b)² − (a − b)² = 4ab. Здесь ab = √a · √b = √(a · b): подкоренное произведение — точный квадрат, найди его корень.','Найди значение','Разность квадратов суммы и разности равна 4ab. Чему равно произведение двух корней?',{tag:u=>u===p*x*y?'потерял множитель 4':u===2*p*x*y?'взял 2 вместо 4':'',val:(SQ(a)+SQ(b))**2-(SQ(a)-SQ(b))**2})}
 if(t===2){const a=ns(2,60),n=ri(2,12);
  return nm(`(${R(a)} + ${n})² + (${R(a)} − ${n})² = ?`,2*(a+n*n),'(a + b)² + (a − b)² = 2a² + 2b². Слагаемые с корнем 2n√a и −2n√a взаимно уничтожаются.','Найди значение','Раскрой оба квадрата. Слагаемые с корнем должны сократиться.',{tag:u=>u===2*a?'потерял n²':u===a+n*n?'не удвоил результат':'',val:(SQ(a)+n)**2+(SQ(a)-n)**2})}
 const p=pick([2,3,5,6,7]),[x,y]=pick(PX),a=p*x*x,b=p*y*y,k=ri(2,3);
 return nm(`(${k}${R(a)} + ${R(b)})² − (${k}${R(a)} − ${R(b)})² = ?`,4*k*p*x*y,'(a + b)² − (a − b)² = 4ab, здесь a = k√a₁ — коэффициент остаётся в произведении. Найди значение √a₁ · √b₁ целиком.','Найди значение','Разность квадратов суммы и разности равна 4ab. Не забудь коэффициент перед первым корнем.',{tag:u=>u===4*p*x*y?'потерял коэффициент':u===2*k*p*x*y?'взял 2 вместо 4':'',val:(k*SQ(a)+SQ(b))**2-(k*SQ(a)-SQ(b))**2})}

// 4. Значения составных выражений
function g4(){const t=ri(0,3);
 if(t===0){const [P1,Q1]=pairForm(),[P2,Q2]=pairForm(),op=ri(0,1)?1:-1;
  const A=`(${expr(P1,-1,Q1)})(${expr(P1,1,Q1)})`,B=`(${expr(P2,-1,Q2)})(${expr(P2,1,Q2)})`;
  return nm(`${A} ${sg(op)} ${B} = ?`,(sq(P1)-sq(Q1))+op*(sq(P2)-sq(Q2)),'Каждое произведение сопряжённых замени разностью квадратов и найди число. Потом выполни сложение или вычитание. Значение второго произведения при вычитании бери в скобки: оно может быть отрицательным.','Найди значение','Сначала найди значение каждого произведения по формуле, потом выполни действие между ними.',{etag:'ошибка при сложении значений произведений',val:(tv(P1)-tv(Q1))*(tv(P1)+tv(Q1))+op*(tv(P2)-tv(Q2))*(tv(P2)+tv(Q2))})}
 if(t===1){const a=ns(2,30),b=nsNot(2,30,a),c=ns(2,30),d=nsNot(2,30,c);
  return nm(`(${R(a)} − ${R(b)})(${R(a)} + ${R(b)})(${R(c)} − ${R(d)})(${R(c)} + ${R(d)}) = ?`,(a-b)*(c-d),'Сгруппируй сопряжённые пары: (√a − √b)(√a + √b) = a − b и (√c − √d)(√c + √d) = c − d. Потом перемножь значения.','Найди значение','Какие две скобки сопряжены? Найди значение каждой пары и перемножь.',{tag:u=>u===(a+b)*(c+d)?'сложил квадраты вместо вычитания':u===(b-a)*(c-d)||u===(a-b)*(d-c)?'перепутал порядок вычитания':'',val:(SQ(a)-SQ(b))*(SQ(a)+SQ(b))*(SQ(c)-SQ(d))*(SQ(c)+SQ(d))})}
 if(t===2){const p=ri(2,4),q=ri(2,4),a=ns(2,12),b=ns(2,12),c=ns(2,30);
  return nm(`(${p}${R(a)} − ${q}${R(b)})(${p}${R(a)} + ${q}${R(b)}) + (${R(c)})² = ?`,p*p*a-q*q*b+c,'Первое произведение: (p√a)² − (q√b)² = p²a − q²b. Второе слагаемое: (√c)² = c. Коэффициенты возводятся в квадрат.','Найди значение','Применяй формулу разности квадратов. Не забудь возвести в квадрат числа перед корнями.',{tag:u=>u===p*a-q*b+c?'не возвёл коэффициенты в квадрат':'',val:(p*SQ(a)-q*SQ(b))*(p*SQ(a)+q*SQ(b))+SQ(c)*SQ(c)})}
 const d=ri(2,6),k=ri(2,9),b=ns(2,20),a=b+d*k;
 return nm(`${F(`(${R(a)} + ${R(b)})(${R(a)} − ${R(b)})`,d)} = ?`,k,'Числитель — произведение сопряжённых, равно a − b. Потом раздели на знаменатель дроби. Проверка: после деления получается целое число.','Найди значение','Сначала найди значение числителя по формуле разности квадратов, потом раздели.',{tag:u=>u===a+b?'сложил подкоренные числа':'',val:(SQ(a)+SQ(b))*(SQ(a)-SQ(b))/d})}

// 5. Новый знаменатель
function g5(){const [P,Q]=pairForm(),s=ri(0,1)?1:-1,c=ri(2,9);
 return nm(`Числитель и знаменатель дроби ${F(c,expr(P,s,Q))} умножили на сопряжённое знаменателю выражение. Чему равен новый знаменатель?`,sq(P)-sq(Q),'Новый знаменатель — произведение сопряжённых: квадрат первого слагаемого минус квадрат второго. Число перед корнем тоже возводится в квадрат. Проверка: в новом знаменателе нет корня.','Найди новый знаменатель (число, может быть отрицательным)','Запиши знаменатель, умноженный на сопряжённое, и применяй формулу (a − b)(a + b) = a² − b².',{tag:conjTag(P,Q),val:(tv(P)+s*tv(Q))*(tv(P)-s*tv(Q))})}

// 6. Избавиться от иррациональности
function g6(){const t=ri(0,3);let P,Q,d;
 if(t===0){const n=ri(1,6);d=ri(2,9);const a=n*n+d;if(isSq(a))return g6();P={t:'r',k:1,a};Q={t:'i',v:n}}
 else if(t===1){const b=ns(2,25);d=ri(2,9);const a=b+d;if(isSq(a))return g6();P={t:'r',k:1,a};Q={t:'r',k:1,a:b}}
 else if(t===2){const k=ri(2,3),a=ns(2,10),M=k*k*a,lo=Math.max(1,Math.ceil(SQ(Math.max(0,M-12)))),hi=Math.floor(SQ(M-2));if(lo>hi||lo<1)return g6();const n=ri(lo,hi);d=M-n*n;P={t:'r',k,a};Q={t:'i',v:n}}
 else{const n=ri(3,9);d=ri(2,9);const a=n*n-d;if(a<2||isSq(a))return g6();P={t:'i',v:n};Q={t:'r',k:1,a}}
 if(d<2)return g6();
 const s=ri(0,1)?1:-1,op=sg(-s),sa=sg(s),tt=ri(2,5),c=tt*d;
 const cor=`${tt}(${expr(P,-s,Q)})`;
 const und=P.t==='i'?`${tt*P.v} ${op} ${tx(Q)}`:`${tt*P.k}${R(P.a)} ${op} ${tx(Q)}`;
 const opts=[cor,`${tt}(${expr(P,s,Q)})`,`${c}(${expr(P,-s,Q)})`,und];
 return ch(F(c,expr(P,s,Q)),opts,cor,'Умножь числитель и знаменатель на сопряжённое. В знаменателе получится число P² − Q². Числитель умножай целиком: на всё сопряжённое выражение. Потом сократи.','Избавься от иррациональности в знаменателе. Что получится?','Домножь на сопряжённое знаменателю. Новый знаменатель — число. Сократи на него числитель, скобку сохрани.',{etag:'ошибка при избавлении от иррациональности',chk:[c/(tv(P)+s*tv(Q)),tt*(tv(P)-s*tv(Q))]})}

// 7. Сумма и разность дробей
function g7(){const t=ri(0,4);const P7='Найди значение (целое число, обыкновенная дробь 3/4 или десятичная)';
 if(t===0){let b,a,d;do{d=pick(DD);b=ns(2,40);a=b+d}while(isSq(a));
  return nm(`${F(`${R(a)} + ${R(b)}`,`${R(a)} − ${R(b)}`)} + ${F(`${R(a)} − ${R(b)}`,`${R(a)} + ${R(b)}`)} = ?`,2*(a+b)/d,'Общий знаменатель — произведение сопряжённых, равно a − b. В числителе (√a + √b)² + (√a − √b)² = 2(a + b).',P7,'Общий знаменатель: (√a − √b)(√a + √b). Числитель: сумма квадратов суммы и разности.',{tag:u=>u===(a+b)/d?'не удвоил числитель':'',val:(SQ(a)+SQ(b))/(SQ(a)-SQ(b))+(SQ(a)-SQ(b))/(SQ(a)+SQ(b))})}
 if(t===1){let n,d,a;do{n=ri(1,9);d=pick(DD);a=n*n+d}while(isSq(a));
  return nm(`${F(1,`${R(a)} − ${n}`)} − ${F(1,`${R(a)} + ${n}`)} = ?`,2*n/d,'Общий знаменатель — произведение сопряжённых: a − n². В числителе (√a + n) − (√a − n): минус перед скобкой меняет знаки внутри.',P7,'Приведи дроби к общему знаменателю (√a − n)(√a + n). Следи за знаками при вычитании скобок.',{tag:u=>Math.abs(u+2*n/d)<1e-9?'перепутал знак (порядок вычитания)':'',val:1/(SQ(a)-n)-1/(SQ(a)+n)})}
 if(t===2){let n,d,a;do{n=ri(1,9);d=pick(DD);a=n*n+d}while(isSq(a));
  return nm(`(${F(1,`${R(a)} − ${n}`)} + ${F(1,`${R(a)} + ${n}`)}) · ${R(a)} = ?`,2*a/d,'Сначала сложи дроби: общий знаменатель a − n², в числителе (√a + n) + (√a − n) = 2√a. Потом умножь на √a: (√a)² = a.',P7,'Сложи дроби в скобках, потом умножь результат на корень.',{val:(1/(SQ(a)-n)+1/(SQ(a)+n))*SQ(a)})}
 if(t===3){let n,d,a;do{n=ri(1,9);d=pick(DD);a=n*n+d}while(isSq(a));

const PUSH_EVERY=10;   // отправка в таблицу каждые N ответов

/* ====== состояние ====== */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv)return s}catch(e){}return{name:'',lv:{},openAll:false}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function enc(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const HASH=location.hash.slice(1);
const TEACHER=HASH==='lilia';
if(/^u/.test(HASH)&&!st.name){try{const nm=dec(HASH.slice(1).split('.')[0]).split('|')[0].trim();if(nm){st.name=nm;save()}}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function L(i){return st.lv[i]||(st.lv[i]={ok:0,bad:0,hints:0,idk:0,tags:{},reteach:0,passed:false,stuck:false})}
const isOpen=i=>i===0||st.openAll||L(i-1).passed;
const passedCount=()=>LEVELS.filter((_,i)=>L(i).passed).length;
let V={phase:'home',i:0,page:0,streak:0,cons:0,q:null,hint:false,fb:null,err:'',sid:uid(),started:Date.now(),ok:0,bad:0,n:0,preview:false};

/* ====== отправка в таблицу ====== */
function report(){return LEVELS.map((l,i)=>{const o=L(i);
 const tg=Object.keys(o.tags).sort((a,b)=>o.tags[b]-o.tags[a]).slice(0,3).map(t=>`${t} ×${o.tags[t]}`).join('; ');
 const status=o.passed?'пройден':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—';
 return `${i+1}. ${l.t}: ${status}; верно ${o.ok}, неверно ${o.bad}, подсказок ${o.hints}, «не знаю» ${o.idk}, повторов объяснения ${o.reteach}${tg?'; ошибки: '+tg:''}`}).join('\n')}
function marks(){return LEVELS.map((_,i)=>`${i+1}${L(i).passed?'✓':L(i).stuck?'!':''}`).join(' ')}
function push(final){
 if(TEACHER||V.n===0)return;
 try{
  const done=passedCount()===LEVELS.length;
  const d={sid:V.sid,test:TITLE,name:st.name,kind:'тренажёр',started:V.started,
   status:final&&done?'завершено':'в процессе',progress:`${passedCount()}/${LEVELS.length}`,score:V.ok,max:V.ok+V.bad,grade:'',
   minutes:Math.round((Date.now()-V.started)/60000),bonus:`ступень ${V.i+1}`,tasks:marks(),report:report()};
  const bd=JSON.stringify(d);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:bd.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:bd}).catch(()=>{});
 }catch(e){}
}
addEventListener('pagehide',()=>{if(V.n>0)push(false)});

/* ====== разбор ошибок ====== */
function tagOf(q,u){
 if(u===null)return 'не знаю';
 if(q.type==='num'){
  if(q.tag){const t=q.tag(u);if(t)return t}
  if(u<0&&q.ans>=0)return 'отрицательный ответ';
  if(q.rad!==undefined&&u===q.rad)return 'не извлёк корень';
  if(q.rad!==undefined&&Math.abs(u-q.rad/2)<1e-9)return 'разделил пополам';
  if(q.rad!==undefined&&Number.isInteger(q.ans)&&q.ans>0&&u===q.ans*q.ans)return 'возвёл в квадрат вместо корня';
  return 'другая ошибка';
 }
 return q.etag||'другая ошибка';
}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');
 if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN}

/* ====== экраны ====== */
function fixRad(){
 const NS='http://www.w3.org/2000/svg';
 document.querySelectorAll('.rad').forEach(r=>{
  const o=r.querySelector('svg');if(o)o.remove();
  const W=r.offsetWidth,H=r.offsetHeight,bl=r.querySelector('.bl');if(!W||!H||!bl)return;
  const cs=getComputedStyle(r),fs=parseFloat(cs.fontSize)||24,sw=parseFloat(cs.paddingLeft)||fs*.72;
  const rb=r.getBoundingClientRect(),B=bl.getBoundingClientRect().top-rb.top;
  const t=Math.max(1.8,fs*.07),y0=Math.max(t/2,B-fs*.88),yb=B+fs*.16;
  const x1=sw*.06,y1=B-fs*.26,x2=sw*.30,y2=B-fs*.36,x3=sw*.60,x4=sw*.99;
  const v=document.createElementNS(NS,'svg');v.setAttribute('width',W);v.setAttribute('height',Math.max(H,yb+t));v.setAttribute('viewBox','0 0 '+W+' '+Math.max(H,yb+t));v.setAttribute('aria-hidden','true');
  const mk=(d,w,cap)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width',w);p.setAttribute('stroke-linejoin','miter');p.setAttribute('stroke-linecap',cap||'butt');v.appendChild(p)};
  mk(`M${x1} ${y1} L${x2} ${y2}`,t*.8,'round');
  mk(`M${x2} ${y2} L${x3} ${yb}`,t*1.7,'butt');
  mk(`M${x3} ${yb} L${x4} ${y0} L${W} ${y0}`,t,'butt');
  r.appendChild(v)})}
const app=h=>{h=String(h).replace(/√(?:\(([^()]*)\)|([A-Za-zА-Яа-я0-9₀-₉]+))/g,(m,a,b)=>R(a||b));document.getElementById('app').innerHTML=h;fixRad()};
addEventListener('resize',fixRad);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fixRad);
const $=s=>document.querySelector(s);
function hdr(){return `<div class="muted">${esc(st.name||'')}${TEACHER?' · режим учителя (в таблицу не отправляется)':''}</div>`}
function render(){
 if(TEACHER&&!V.preview)return teacherScreen();
 if(!st.name)return nameScreen();
 ({home:homeScreen,learn:learnScreen,q:qScreen,done:doneScreen,reteach:reteachScreen,stuck:stuckScreen}[V.phase]||homeScreen)();
}
function nameScreen(){
 app(`<h1>Сопряжённые выражения</h1><p class="muted">Тренажёр идёт по ступеням. Дальше можно пойти только после ${NEED} верных ответов подряд.</p>
 <p>Как тебя зовут?</p><input class="nm" id="nm" placeholder="Имя Фамилия" onkeydown="if(event.key==='Enter')setName()"><br><button class="btn" onclick="setName()">Начать</button><div class="bad" id="er"></div>`);
 const e=$('#nm');if(e)e.focus()}
function setName(){const v=$('#nm').value.trim();if(v.length<3){$('#er').textContent='Введи имя и фамилию.';return}st.name=v;save();home()}
function home(){V.phase='home';render()}
function homeScreen(){
 let h=hdr()+`<h1>Сопряжённые выражения</h1><p class="muted">Пройдено ступеней: ${passedCount()} из ${LEVELS.length}. Чтобы пройти ступень, нужно ${NEED} верных ответов подряд.</p>`;
 LEVELS.forEach((l,i)=>{const o=L(i),op=isOpen(i);
  const s=o.passed?'пройдена':!op?'закрыта':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'открыта';
  h+=`<button class="row ${o.passed?'passed':''}" ${op?'':'disabled'} onclick="openLevel(${i})"><span>${i+1}. ${l.t}</span><span class="st">${s}</span></button>`});
 if(TEACHER)h+=`<button class="btn sec" onclick="V.preview=false;render()">Вернуться в кабинет учителя</button>`;
 app(h)}
function openLevel(i){if(!isOpen(i))return;V.i=i;V.page=0;V.streak=0;V.cons=0;V.fb=null;V.phase='learn';render()}
function learnScreen(){const l=LEVELS[V.i];
 let h=hdr()+`<h1>${V.i+1}. ${l.t}</h1><p class="muted">Прочитай по шагам. Потом ${NEED} заданий подряд без ошибок.</p>`;
 for(let k=0;k<=V.page;k++)h+=`<div class="card">${l.pages[k]}</div>`;
 h+=V.page<l.pages.length-1?`<button class="btn" onclick="nextPage()">Дальше</button>`:`<button class="btn" onclick="startQ()">Начать задания</button>`;
 h+=`<button class="btn sec" onclick="home()">К списку</button>`;
 app(h);window.scrollTo(0,document.body.scrollHeight)}
function nextPage(){V.page++;render()}
function startQ(){V.streak=0;V.cons=0;V.seen=[];nextQ()}
function nextQ(){V.seen=V.seen||[];let q,t=0;do{q=LEVELS[V.i].g()}while(t++<60&&V.seen.indexOf(q.q)>=0);V.seen.push(q.q);if(V.seen.length>16)V.seen.shift();V.q=q;V.hint=false;V.fb=null;V.err='';V.phase='q';render()}
function qScreen(){const q=V.q,l=LEVELS[V.i];
 let dots='';for(let k=0;k<NEED;k++)dots+=`<span class="dot ${k<V.streak?'on':''}"></span>`;
 let h=hdr()+`<h2>${V.i+1}. ${l.t}</h2><div class="dots">${dots} <span class="muted">${V.streak} из ${NEED}</span></div>
 <div class="muted">${q.prompt}</div><div class="big">${q.q}</div>${q.pic||''}`;
 if(V.hint&&q.hint)h+=`<div class="hint"><b>Подсказка.</b> ${q.hint}</div>`;
 if(V.fb){
  h+=V.fb.ok?`<div class="card"><span class="ok">Верно.</span></div>`:`<div class="card"><span class="bad">${V.fb.idk?'Хорошо, что сказала честно.':'Неверно.'}</span> ${q.why}<div class="muted" style="margin-top:6px">Серия обнулена. Следующее задание будет новым.</div></div>`;
  h+=`<button class="btn" id="nx" onclick="afterFb()">Дальше</button>`;
 }else{
  if(q.type==='num')h+=`<input class="ans" id="ans" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter')submitNum()"><br><button class="btn" onclick="submitNum()">Проверить</button><div class="bad" style="margin-top:8px">${V.err}</div>`;
  else h+=q.options.map((o,i)=>`<button class="opt" onclick="pickOpt(${i})">${o}</button>`).join('');
  h+=`<div>`+(q.hint&&!V.hint?`<button class="btn sec" onclick="useHint()">Подсказка</button>`:'')+`<button class="btn sec" onclick="idk()">Не знаю</button><button class="btn sec" onclick="exitLevel()">К списку</button></div>`;
 }
 app(h);const a=$('#ans');if(a)a.focus();const n=$('#nx');if(n)n.focus()}
function useHint(){if(!V.hint){V.hint=true;L(V.i).hints++;save()}render()}
function exitLevel(){push(false);home()}
function answered(ok,u){
 const o=L(V.i);V.n++;
 if(ok){o.ok++;V.ok++;V.streak++;V.cons=0;
  if(V.streak>=NEED){o.passed=true;save();push(true);V.phase='done';render();return}
  V.fb={ok:true}}
 else{o.bad++;V.bad++;V.streak=0;V.cons++;const t=tagOf(V.q,u);o.tags[t]=(o.tags[t]||0)+1;V.fb={ok:false,idk:u===null};if(u===null)o.idk++}
 save();if(V.n%PUSH_EVERY===0)push(false);render()}
function submitNum(){const u=parseNum($('#ans').value);
 if(isNaN(u)){V.err='Введи число (например 7, 0,5 или 3/4).';render();return}
 answered(Math.abs(u-V.q.ans)<1e-9,u)}
function pickOpt(i){answered(V.q.options[i]===V.q.correct,V.q.options[i])}
function idk(){answered(false,null)}
function afterFb(){
 if(!V.fb.ok&&V.cons>=RETEACH_AFTER){const o=L(V.i);o.reteach++;V.cons=0;
  if(o.reteach>=STUCK_AFTER){o.stuck=true;save();push(false);V.phase='stuck';render();return}
  save();V.phase='reteach';render();return}
 nextQ()}
function reteachScreen(){app(hdr()+`<h2>Давай ещё раз посмотрим объяснение</h2><div class="card"><p>Несколько ответов подряд не получились. Это нормально: значит, объяснение надо прочитать ещё раз, не торопясь.</p></div><button class="btn" onclick="V.page=0;V.phase='learn';render()">Смотреть объяснение</button>`)}
function stuckScreen(){app(hdr()+`<h2>Стоп</h2><div class="card"><p>Здесь стало трудно, и это не страшно. Эту ступень лучше разобрать вместе с учителем. Результат уже отправлен Лилии.</p><p>Скажи, на каком месте перестало быть понятно.</p></div><button class="btn" onclick="home()">К списку</button><button class="btn sec" onclick="V.page=0;V.cons=0;V.phase='learn';render()">Ещё раз объяснение</button>`)}
function doneScreen(){const last=V.i===LEVELS.length-1;
 app(hdr()+`<h2>Ступень пройдена</h2><div class="card"><p><b>${V.i+1}. ${LEVELS[V.i].t}</b>: ${NEED} верных ответов подряд. Это настоящая работа.</p><p class="muted">Результат отправлен Лилии.</p></div>`+
 (last?`<p>Это была последняя ступень. Тренажёр пройден.</p><button class="btn" onclick="home()">К списку</button>`:`<button class="btn" onclick="openLevel(${V.i+1})">Следующая ступень</button><button class="btn sec" onclick="home()">К списку</button>`))}

/* ====== режим учителя ====== */
function teacherScreen(){
 const base=location.href.split('#')[0];
 let h=`<h1>Кабинет учителя</h1><p class="muted">Данные этого устройства. С этого экрана в таблицу ничего не отправляется.</p>
 <h2>Ссылка для ученика</h2><input class="nm" id="tn" placeholder="Имя Фамилия"><p class="link" id="tl"></p>
 <h2>Прогресс на этом устройстве</h2><table class="rep"><tr><th>№</th><th>Ступень</th><th>Статус</th><th>Верно</th><th>Неверно</th><th>Подск.</th><th>Не знаю</th><th></th></tr>`;
 LEVELS.forEach((l,i)=>{const o=L(i);
  h+=`<tr><td>${i+1}</td><td>${l.t}</td><td>${o.passed?'пройдена':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—'}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.hints}</td><td>${o.idk}</td><td><button class="btn sm sec" onclick="tPass(${i})">засчитать</button><button class="btn sm sec" onclick="tReset(${i})">сбросить</button></td></tr>`});
 h+=`</table><button class="btn sec" onclick="tOpenAll()">${st.openAll?'Закрыть ступени по порядку':'Открыть все ступени'}</button>
 <button class="btn" onclick="V.preview=true;home()">Пройти как ученик</button>
 <button class="btn sec" onclick="tWipe()">Стереть всё на этом устройстве</button>`;
 app(h);
 $('#tn').oninput=e=>{const v=e.target.value.trim();$('#tl').textContent=v?base+'#u'+enc(v):''}}
function tPass(i){L(i).passed=true;save();render()}
function tReset(i){st.lv[i]=undefined;delete st.lv[i];save();render()}
function tOpenAll(){st.openAll=!st.openAll;save();render()}
function tWipe(){if(confirm('Стереть весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);st=load();render()}}

render();
//ENGINE-END
</script>
</body>
</html>
