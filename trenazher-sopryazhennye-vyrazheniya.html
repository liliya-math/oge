<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211e">
<title>Сопряжённые выражения: тренажёр</title>
<style>
:root{--bg:#14211e;--card:rgba(243,236,226,.07);--line:rgba(243,236,226,.16);--fg:#f3ece2;--muted:rgba(243,236,226,.62);--cobalt:#1747c9;--apricot:#f2905e;--yellow:#f5dc6a;--mint:#8fd9b0;--miss:#ff8f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.25}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.big{font-size:32px;margin:8px 0 14px;line-height:1.7}
.rad{display:inline-flex;align-items:stretch;white-space:nowrap;vertical-align:middle;line-height:1.25}
.rs{width:.62em;flex:none;overflow:visible;fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:miter;stroke-linecap:butt}
.ov{border-top:2px solid var(--fg);padding:.08em 4px 0 1px;margin-left:-1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--fg);padding:0 4px}
input.ans{font:inherit;font-size:26px;width:100%;max-width:240px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
input.ans:focus,input.nm:focus{outline:2px solid var(--yellow);outline-offset:1px}
input.nm{font:inherit;font-size:20px;width:100%;max-width:360px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:var(--cobalt);color:#fff;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px 4px 2px 0}
.opt{font:inherit;font-size:20px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:rgba(243,236,226,.06);color:var(--fg);cursor:pointer;margin:0 10px 10px 0}
.opt:active{background:rgba(243,236,226,.16)}
.dots{margin:4px 0 10px}
.dot{display:inline-block;width:15px;height:15px;border:2px solid var(--fg);border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--mint);border-color:var(--mint)}
.ok{color:var(--mint);font-weight:700}
.bad{color:var(--miss);font-weight:700}
.hint{border-left:4px solid var(--yellow);background:rgba(245,220,106,.1);padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .st{font-size:14px;color:var(--muted);white-space:nowrap}
.row.passed .st{color:var(--mint)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
svg{display:block;margin:6px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:28px}}
</style>
<script src="cabinet-report.js"></script>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<script>
'use strict';
//CONTENT-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>String(Math.round(n*10000)/10000).replace('.',',').replace('-','−');
const R=x=>`<span class="rad"><svg class="rs" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="M0.5 60 L3 56 L6.5 99 L11.8 2 L12.5 2"/></svg><span class="ov">${x}</span></span>`;
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
function nm(q,ans,why,prompt,hint,x){return Object.assign({q,type:'num',ans,why,prompt:prompt||'Найди значение',hint:hint||''},x||{})}
function ch(q,options,correct,why,prompt,hint,x){return Object.assign({q,type:'choice',options:shuf(options),correct,why,prompt,hint:hint||''},x||{})}
const isSq=n=>Number.isInteger(Math.sqrt(n));
const ns=(lo,hi)=>{let a;do{a=ri(lo,hi)}while(isSq(a));return a};
const nsNot=(lo,hi,x)=>{let a;do{a=ns(lo,hi)}while(a===x);return a};
const SQ=Math.sqrt;
// пары: выражение, сопряжённое, «перевёрнутое» (оба знака)
function forms(a,b,n){return [
 [`${R(a)} + ${n}`,`${R(a)} − ${n}`,`−${R(a)} − ${n}`],
 [`${R(a)} − ${n}`,`${R(a)} + ${n}`,`−${R(a)} + ${n}`],
 [`${n} + ${R(a)}`,`${n} − ${R(a)}`,`−${n} − ${R(a)}`],
 [`${n} − ${R(a)}`,`${n} + ${R(a)}`,`−${n} + ${R(a)}`],
 [`${R(a)} + ${R(b)}`,`${R(a)} − ${R(b)}`,`−${R(a)} − ${R(b)}`],
 [`${R(a)} − ${R(b)}`,`${R(a)} + ${R(b)}`,`−${R(a)} + ${R(b)}`]]}
const MID='Квадрат первого слагаемого минус квадрат второго.';

// 1. Квадрат корня
function g1(){const a=ns(2,40);
 const tag=u=>u===a*a?'возвёл подкоренное число в квадрат':u===2*a?'умножил на 2 вместо возведения в квадрат':'';
 const q=ri(0,1)?`(${R(a)})² = ?`:`${R(a)} · ${R(a)} = ?`;
 return nm(q,a,'Корень, умноженный сам на себя, даёт число под корнем: (√a)² = a. Проверка: что стоит под знаком корня?','Найди значение','Что стоит под знаком корня? Квадрат корня «возвращает» это число.',{tag,val:SQ(a)*SQ(a)})}

// 2. Разность квадратов на числах
function g2(){const m=ri(3,12),n=ri(1,m-1);
 const A=`${m} − ${n}`,B=`${m} + ${n}`;
 const q=ri(0,1)?`(${A})(${B}) = ?`:`(${B})(${A}) = ?`;
 const tag=u=>u===m*m+n*n?'сложил квадраты вместо вычитания':u===(m-n)*(m-n)?'нашёл квадрат разности':u===m*m-n?'не возвёл второе число в квадрат':'';
 return nm(q,m*m-n*n,'Формула: (a − b)(a + b) = a² − b². '+MID+' Проверка: посчитай значения скобок и перемножь их, должно получиться то же число.','Найди значение','Возведи в квадрат первое число, потом второе и вычти.',{tag,val:(m-n)*(m+n)})}

// 3. Формула в буквах
function g3(){
 if(ri(0,1)===0){const [x,y]=pick([['x','y'],['a','b'],['m','n'],['p','q']]);
  const c=`${x}² − ${y}²`;
  return ch(ri(0,1)?`(${x} − ${y})(${x} + ${y})`:`(${x} + ${y})(${x} − ${y})`,[c,`${x}² + ${y}²`,`${x}² − 2${x}${y} + ${y}²`,`${x}² + 2${x}${y} + ${y}²`],c,'(a − b)(a + b) = a² − b². Квадрат первого минус квадрат второго, средней части нет.','Чему равно произведение?','Формула разности квадратов: (a − b)(a + b) = …',{etag:'путает разность квадратов с квадратом суммы или разности'})}
 const [x]=pick([['x'],['a'],['m'],['t']]);const k=ri(3,9);const c=`${x}² − ${k*k}`;
 return ch(ri(0,1)?`(${x} − ${k})(${x} + ${k})`:`(${x} + ${k})(${x} − ${k})`,[c,`${x}² + ${k*k}`,`${x}² − ${k}`,`${x}² − ${2*k}`],c,'(a − b)(a + b) = a² − b². Число тоже возводят в квадрат: b² для числа k — это k · k.','Чему равно произведение?','Первое слагаемое в квадрат, второе в квадрат, между ними минус.',{etag:'не возвёл число в квадрат'})}

// 4. Сопряжённые выражения
function g4(){
 if(ri(0,3)===0){const a=ns(2,30),n=ri(2,9);
  return ch(`${R(a)} + ${n} и ${R(a)} − ${n}`,['сопряжёнными','противоположными','обратными','равными'],'сопряжёнными','Выражения, которые отличаются только знаком между слагаемыми, называют сопряжёнными.','Как называют такие два выражения?','Посмотри, что у них одинаковое и что разное.',{etag:'не знает определение сопряжённых'})}
 const a=ns(2,30),b=nsNot(2,30,a),n=ri(2,9);const [e,c,fl]=pick(forms(a,b,n));
 return ch(e,[c,e,fl],c,'Чтобы получить сопряжённое выражение, меняют только знак между слагаемыми. Слагаемые остаются теми же и со своими знаками.','Какое выражение сопряжено с этим?','Знак между слагаемыми меняется на противоположный. Остальное переписывается без изменений.',{etag:'меняет не тот знак у сопряжённого'})}

// 5. Произведение сопряжённых: корень и число
function g5(){const n=ri(1,6),a=ns(n*n+1,n*n+25),A=R(a);
 const q=ri(0,1)?`(${A} − ${n})(${A} + ${n}) = ?`:`(${A} + ${n})(${A} − ${n}) = ?`;
 const tag=u=>u===a+n*n?'сложил квадраты вместо вычитания':u===a-n?'не возвёл число в квадрат':u===n*n-a?'перепутал порядок вычитания':'';
 return nm(q,a-n*n,'Произведение сопряжённых: (√a − n)(√a + n) = a − n². '+MID+' Проверка: в ответе корня быть не должно.','Найди значение','Квадрат корня равен подкоренному числу. Квадрат второго слагаемого найди отдельно. Вычти.',{tag,val:(SQ(a)-n)*(SQ(a)+n)})}

// 6. Разные формы
function g6(){const t=ri(0,2);
 if(t===0){const a=ns(2,30),b=nsNot(2,30,a);
  const q=ri(0,1)?`(${R(a)} − ${R(b)})(${R(a)} + ${R(b)}) = ?`:`(${R(a)} + ${R(b)})(${R(a)} − ${R(b)}) = ?`;
  return nm(q,a-b,'(√a − √b)(√a + √b) = a − b. Корни исчезают. Проверка: в ответе нет знака корня.','Найди значение','Квадрат первого корня минус квадрат второго корня.',{tag:u=>u===a+b?'сложил подкоренные числа':u===b-a?'перепутал порядок вычитания':'',val:(SQ(a)-SQ(b))*(SQ(a)+SQ(b))})}
 if(t===1){const n=ri(3,9),a=ns(2,40);
  const q=ri(0,1)?`(${n} − ${R(a)})(${n} + ${R(a)}) = ?`:`(${n} + ${R(a)})(${n} − ${R(a)}) = ?`;
  return nm(q,n*n-a,'Квадрат первого слагаемого минус квадрат второго. Если первым стоит число, то из n² вычитают подкоренное число.','Найди значение','Сначала n в квадрат, потом вычти квадрат корня.',{tag:u=>u===a-n*n?'перепутал порядок вычитания':u===n*n+a?'сложил квадраты вместо вычитания':u===n-a?'не возвёл число в квадрат':'',val:(n-SQ(a))*(n+SQ(a))})}
 const n=ri(3,7),a=ns(2,n*n-1);
 const q=ri(0,1)?`(${R(a)} − ${n})(${R(a)} + ${n}) = ?`:`(${R(a)} + ${n})(${R(a)} − ${n}) = ?`;
 return nm(q,a-n*n,'a − n². Если квадрат числа больше подкоренного числа, ответ получается отрицательным. Это нормально.','Найди значение (может получиться отрицательное число)','Квадрат первого слагаемого минус квадрат второго. Что больше, a или n²?',{tag:u=>u===n*n-a?'потерял знак минус':u===a+n*n?'сложил квадраты вместо вычитания':'',val:(SQ(a)-n)*(SQ(a)+n)})}

// 7. С коэффициентами
function g7(){const k=ri(2,4),a=ns(2,15),n=ri(1,9),A=k+R(a);
 if(ri(0,2)===0)return nm(`(${A})² = ?`,k*k*a,'(k√a)² = k² · a. В квадрат возводят и число перед корнем, и корень.','Найди значение','Возведи в квадрат отдельно число перед корнем, отдельно корень, и перемножь.',{tag:u=>u===k*a?'не возвёл коэффициент в квадрат':u===a?'забыл коэффициент':u===k*k*a*a?'возвёл подкоренное число в квадрат':'',val:(k*SQ(a))**2});
 const q=ri(0,1)?`(${A} − ${n})(${A} + ${n}) = ?`:`(${A} + ${n})(${A} − ${n}) = ?`;
 return nm(q,k*k*a-n*n,'(k√a − n)(k√a + n) = (k√a)² − n² = k² · a − n². Не забудь возвести в квадрат число перед корнем.','Найди значение','Сначала найди (k√a)², потом n², потом вычти.',{tag:u=>u===k*a-n*n?'не возвёл коэффициент в квадрат':u===k*k*a+n*n?'сложил квадраты вместо вычитания':u===n*n-k*k*a?'перепутал порядок вычитания':'',val:(k*SQ(a)-n)*(k*SQ(a)+n)})}

// 8. На что умножать
function g8(){const a=ns(2,30),b=nsNot(2,30,a),n=ri(1,9),c=ri(1,9);
 const [e,cj,fl]=pick(forms(a,b,n));
 return ch(F(c,e),[cj,e,fl,R(a)],cj,'Умножать нужно на сопряжённое знаменателю выражение: то же самое, но с противоположным знаком между слагаемыми. Тогда в знаменателе получится разность квадратов, и корень исчезнет.','На какое выражение умножить числитель и знаменатель, чтобы в знаменателе не осталось корня?','Выпиши знаменатель и смени знак между слагаемыми на противоположный.',{etag:'не знает, на что домножать'})}

// 9. Новый знаменатель
function g9(){const t=ri(0,5),c=ri(2,9);let den,ans,sum,val;const s=t%2?-1:1,sg=s>0?'+':'−';
 if(t<=1){const n=ri(1,6),a=ns(n*n+1,n*n+20);den=`${R(a)} ${sg} ${n}`;ans=a-n*n;sum=a+n*n;val=(SQ(a)+s*n)*(SQ(a)-s*n)}
 else if(t<=3){const b=ns(2,20),a=ns(b+1,b+25);den=`${R(a)} ${sg} ${R(b)}`;ans=a-b;sum=a+b;val=(SQ(a)+s*SQ(b))*(SQ(a)-s*SQ(b))}
 else{const n=ri(3,9),a=ns(2,n*n-1);den=`${n} ${sg} ${R(a)}`;ans=n*n-a;sum=n*n+a;val=(n+s*SQ(a))*(n-s*SQ(a))}
 return nm(`Числитель и знаменатель дроби ${F(c,den)} умножили на сопряжённое знаменателю выражение. Чему равен новый знаменатель?`,ans,'Знаменатель умножили на сопряжённое: получилась разность квадратов. Квадрат первого слагаемого минус квадрат второго. Проверка: в новом знаменателе корня нет.','Найди новый знаменатель (число)','Запиши знаменатель, умноженный на сопряжённое. Возведи в квадрат первое слагаемое и вычти квадрат второго.',{tag:u=>u===sum?'сложил квадраты вместо вычитания':u===-ans?'перепутал порядок вычитания':'',val})}

// 10. Избавиться от корня
function g10(){let n,d,a;do{n=ri(1,5);d=ri(2,8);a=n*n+d}while(isSq(a));
 const t=ri(2,5),c=t*d,s=ri(0,1)?1:-1,sg=s>0?'+':'−',op=s>0?'−':'+';
 const A=R(a);
 const cor=`${t}(${A} ${op} ${n})`;
 const opts=[cor,`${t}(${A} ${sg} ${n})`,`${t}${A} ${op} ${n}`,`${c}(${A} ${op} ${n})`];
 return ch(F(c,`${A} ${sg} ${n}`),opts,cor,'Умножь числитель и знаменатель на сопряжённое. В знаменателе получится a − n². Числитель умножай целиком: на оба слагаемых скобки. Потом сократи.','Избавься от корня в знаменателе. Что получится?','Домножь на сопряжённое. Знаменатель: разность квадратов, это число. Сократи числитель и знаменатель на это число.',{etag:'ошибка при избавлении от корня в знаменателе',chk:[c/(SQ(a)+s*n),t*(SQ(a)-s*n)]})}

// 11. Сумма и разность дробей
function g11(){const n=ri(1,6),d=pick([1,2,4,5]);let a=n*n+d;if(isSq(a))return g11();
 const X=`${R(a)} − ${n}`,Y=`${R(a)} + ${n}`;
 const P='Найди значение (целое число, обыкновенная дробь 3/4 или десятичная)';
 if(ri(0,1)===0)return nm(`${F(1,X)} − ${F(1,Y)} = ?`,2*n/d,'Общий знаменатель — произведение сопряжённых, это число a − n². В числителе (√a + n) − (√a − n): минус перед скобкой меняет знаки внутри.',P,'Приведи дроби к общему знаменателю (√a − n)(√a + n). Числитель: из второй скобки со знаком минус.',{tag:u=>Math.abs(u+2*n/d)<1e-9?'перепутал знак (порядок вычитания)':'',val:1/(SQ(a)-n)-1/(SQ(a)+n)});
 return nm(`(${F(1,X)} + ${F(1,Y)}) · ${R(a)} = ?`,2*a/d,'Сначала сложи дроби: общий знаменатель a − n², в числителе (√a + n) + (√a − n) = 2√a. Потом умножь на √a: (√a)² = a.',P,'Сложи дроби в скобках, общий знаменатель — произведение сопряжённых. Потом умножь результат на корень.',{val:(1/(SQ(a)-n)+1/(SQ(a)+n))*SQ(a)})}

// 12. Сокращение
function g12(){let a=ns(2,40),b=nsNot(2,40,a);if(a<b)[a,b]=[b,a];
 const plus=ri(0,1)===0;const num=`${a} − ${b}`;
 const den=`${R(a)} ${plus?'−':'+'} ${R(b)}`;
 const cor=`${R(a)} ${plus?'+':'−'} ${R(b)}`;
 const opts=[cor,`${R(a)} ${plus?'−':'+'} ${R(b)}`,R(`${a} − ${b}`),`${R(a)} · ${R(b)}`];
 return ch(F(num,den),opts,cor,'Числитель a − b раскладывается как (√a − √b)(√a + √b). Одинаковая скобка в числителе и знаменателе сокращается, остаётся другая скобка.','Сократи дробь. Что получится?','Запиши числитель как (√a − √b)(√a + √b). Какая скобка совпадает со знаменателем?',{etag:'не раскладывает числитель по формуле',chk:[(a-b)/(SQ(a)+(plus?-1:1)*SQ(b)),SQ(a)+(plus?1:-1)*SQ(b)]})}

// 13. Не путаем формулы
let last13=-1;
function g13(){const a=ns(2,30),b=nsNot(2,30,a),n=ri(2,9),A=R(a),B=R(b);
 const S=[
  [`(${A} + ${n})(${A} − ${n}) = ${f(a-n*n)}`,1,'Произведение сопряжённых — разность квадратов: a − n². Всё верно.'],

function tagOf(q,u){
 if(u===null)return 'не знаю';
 if(q.type==='num'){
  if(q.tag){const t=q.tag(u);if(t)return t}
  if(u<0&&q.ans>=0)return 'отрицательный ответ';
  if(q.rad!==undefined&&u===q.rad)return 'не извлёк корень';
  if(q.rad!==undefined&&Math.abs(u-q.rad/2)<1e-9)return 'разделил пополам';
  if(q.rad!==undefined&&Number.isInteger(q.ans)&&q.ans>0&&u===q.ans*q.ans)return 'возвёл в квадрат вместо корня';
  return 'другая ошибка';
 }
 return q.etag||'другая ошибка';
}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');
 if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN}

 if(isNaN(u)){V.err='Введи число (например 7, 0,5 или 3/4).';render();return}
 answered(Math.abs(u-V.q.ans)<1e-9,u)}
function pickOpt(i){answered(V.q.options[i]===V.q.correct,V.q.options[i])}
function idk(){answered(false,null)}
function afterFb(){
 if(!V.fb.ok&&V.cons>=RETEACH_AFTER){const o=L(V.i);o.reteach++;V.cons=0;
  if(o.reteach>=STUCK_AFTER){o.stuck=true;save();push(false);V.phase='stuck';render();return}
  save();V.phase='reteach';render();return}
 nextQ()}
function reteachScreen(){app(hdr()+`<h2>Давай ещё раз посмотрим объяснение</h2><div class="card"><p>Несколько ответов подряд не получились. Это нормально: значит, объяснение надо прочитать ещё раз, не торопясь.</p></div><button class="btn" onclick="V.page=0;V.phase='learn';render()">Смотреть объяснение</button>`)}
function stuckScreen(){app(hdr()+`<h2>Стоп</h2><div class="card"><p>Здесь стало трудно, и это не страшно. Эту ступень лучше разобрать вместе с учителем. Результат уже отправлен Лилии.</p><p>Скажи, на каком месте перестало быть понятно.</p></div><button class="btn" onclick="home()">К списку</button><button class="btn sec" onclick="V.page=0;V.cons=0;V.phase='learn';render()">Ещё раз объяснение</button>`)}
function doneScreen(){const last=V.i===LEVELS.length-1;
 app(hdr()+`<h2>Ступень пройдена</h2><div class="card"><p><b>${V.i+1}. ${LEVELS[V.i].t}</b>: ${NEED} верных ответов подряд. Это настоящая работа.</p><p class="muted">Результат отправлен Лилии.</p></div>`+
 (last?`<p>Это была последняя ступень. Тренажёр пройден.</p><button class="btn" onclick="home()">К списку</button>`:`<button class="btn" onclick="openLevel(${V.i+1})">Следующая ступень</button><button class="btn sec" onclick="home()">К списку</button>`))}

/* ====== режим учителя ====== */
function teacherScreen(){
 const base=location.href.split('#')[0];
 let h=`<h1>Кабинет учителя</h1><p class="muted">Данные этого устройства. С этого экрана в таблицу ничего не отправляется.</p>
 <h2>Ссылка для ученика</h2><input class="nm" id="tn" placeholder="Имя Фамилия"><p class="link" id="tl"></p>
 <h2>Прогресс на этом устройстве</h2><table class="rep"><tr><th>№</th><th>Ступень</th><th>Статус</th><th>Верно</th><th>Неверно</th><th>Подск.</th><th>Не знаю</th><th></th></tr>`;
 LEVELS.forEach((l,i)=>{const o=L(i);
  h+=`<tr><td>${i+1}</td><td>${l.t}</td><td>${o.passed?'пройдена':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—'}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.hints}</td><td>${o.idk}</td><td><button class="btn sm sec" onclick="tPass(${i})">засчитать</button><button class="btn sm sec" onclick="tReset(${i})">сбросить</button></td></tr>`});
 h+=`</table><button class="btn sec" onclick="tOpenAll()">${st.openAll?'Закрыть ступени по порядку':'Открыть все ступени'}</button>
 <button class="btn" onclick="V.preview=true;home()">Пройти как ученик</button>
 <button class="btn sec" onclick="tWipe()">Стереть всё на этом устройстве</button>`;
 app(h);
 $('#tn').oninput=e=>{const v=e.target.value.trim();$('#tl').textContent=v?base+'#u'+enc(v):''}}
function tPass(i){L(i).passed=true;save();render()}
function tReset(i){st.lv[i]=undefined;delete st.lv[i];save();render()}
function tOpenAll(){st.openAll=!st.openAll;save();render()}
function tWipe(){if(confirm('Стереть весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);st=load();render()}}

render();
//ENGINE-END
</script>
</body>
