<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корни: тест</title><style>
:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-style:normal}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--apricot);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--sage)}
.opt.ok{border-color:var(--ok);background:rgba(155,211,160,.12)}
.opt.bad{border-color:var(--bad);background:rgba(240,154,138,.12)}
.opt[disabled]{cursor:default}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:8px}
.btn[disabled]{opacity:.45;cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-left:3px solid var(--blue);background:rgba(125,162,255,.08);border-radius:6px;font-size:15px}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:160px}
.cond{background:#0f1f19;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.done{border-left:3px solid var(--ok);padding:8px 14px;margin:8px 0;background:rgba(155,211,160,.08);border-radius:6px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--cream);color:var(--bg);font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--butter);margin:4px 0}
sup{font-size:70%;line-height:0;vertical-align:super;white-space:nowrap}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}.fr i{display:block;font-style:normal;padding:0 4px;border-bottom:1px solid currentColor;line-height:1.25}.fr b{display:block;font-weight:normal;padding:0 4px;line-height:1.25}
.rt{white-space:nowrap}.ro{border-top:1px solid currentColor;padding:0 2px;margin-left:1px}
</style></head><body><div class="wrap"><a href="z8-korni.html" style="color:var(--blue);font-size:14px;text-decoration:none">← Корни (задание 8)</a><h1 style="margin-top:10px">Корни: тест</h1><p class="sub">10 вопросов. После каждого ответа появляется разбор.</p><div class="bar"><i id="pb"></i></div><div id="box"></div></div><script>const Q=[["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">36 · 49</span></span>.", ["42", "13", "1764", "21"], "Корень из произведения равен произведению корней: <span class=\"rt\">√<span class=\"ro\">36</span></span> · <span class=\"rt\">√<span class=\"ro\">49</span></span> = 6 · 7 = 42. Ответ 13 получится, если корни сложить (6 + 7): при умножении подкоренных выражений корни складывать нельзя. Ответ 1764 — это само произведение 36 · 49, корень не извлечён."], ["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">1,44</span></span>.", ["1,2", "12", "0,12", "0,72"], "1,2<sup>2</sup> = 1,44. Под корнем два знака после запятой, значит в ответе один. Ответ 12 получится, если потерять запятую, 0,12 — если поставить её не на то место. Ответ 0,72 — половина числа 1,44: корень не равен половине подкоренного числа."], ["Найдите значение выражения (3<span class=\"rt\">√<span class=\"ro\">5</span></span>)<sup>2</sup>.", ["45", "15", "225", "75"], "(3<span class=\"rt\">√<span class=\"ro\">5</span></span>)<sup>2</sup> = 3<sup>2</sup> · (<span class=\"rt\">√<span class=\"ro\">5</span></span>)<sup>2</sup> = 9 · 5 = 45. Ответ 15 получится, если 3 умножить на 5. Ответ 225 — это (3 · 5)<sup>2</sup>: в квадрат возведено подкоренное число вместе с коэффициентом. Ответ 75 получится, если в квадрат возвести только число 5, а не коэффициент 3."], ["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">12</span></span> · <span class=\"rt\">√<span class=\"ro\">27</span></span>.", ["18", "324", "39", "6"], "<span class=\"rt\">√<span class=\"ro\">12</span></span> · <span class=\"rt\">√<span class=\"ro\">27</span></span> = <span class=\"rt\">√<span class=\"ro\">12 · 27</span></span> = <span class=\"rt\">√<span class=\"ro\">324</span></span> = 18, так как 18<sup>2</sup> = 324. Ответ 324 — корень не извлечён. Ответ 39 получится, если вместо произведения 12 · 27 взять сумму. Ответ 6 получится, если в 2<span class=\"rt\">√<span class=\"ro\">3</span></span> · 3<span class=\"rt\">√<span class=\"ro\">3</span></span> перемножить только коэффициенты 2 · 3 и забыть, что <span class=\"rt\">√<span class=\"ro\">3</span></span> · <span class=\"rt\">√<span class=\"ro\">3</span></span> = 3."], ["Найдите значение выражения (<span class=\"rt\">√<span class=\"ro\">7</span></span> − <span class=\"rt\">√<span class=\"ro\">3</span></span>)(<span class=\"rt\">√<span class=\"ro\">7</span></span> + <span class=\"rt\">√<span class=\"ro\">3</span></span>).", ["4", "10", "−4", "16"], "Разность квадратов: (a − b)(a + b) = a<sup>2</sup> − b<sup>2</sup>. Здесь (<span class=\"rt\">√<span class=\"ro\">7</span></span>)<sup>2</sup> − (<span class=\"rt\">√<span class=\"ro\">3</span></span>)<sup>2</sup> = 7 − 3 = 4. Ответ 10 получится, если квадраты сложить. Ответ −4 — перепутан порядок вычитания (3 − 7). Ответ 16 получится, если разность 7 − 3 = 4 ещё раз возвести в квадрат."], ["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">72</span></span> : <span class=\"rt\">√<span class=\"ro\">2</span></span>.", ["6", "36", "70", "18"], "<span class=\"rt\">√<span class=\"ro\">72</span></span> : <span class=\"rt\">√<span class=\"ro\">2</span></span> = <span class=\"rt\">√<span class=\"ro\">72 : 2</span></span> = <span class=\"rt\">√<span class=\"ro\">36</span></span> = 6. Ответ 36 — после деления корень не извлечён. Ответ 70 получится, если вместо деления вычесть 72 − 2. Ответ 18 получится, если корень из 36 принять за половину числа."], ["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">2<sup>6</sup> · 5<sup>2</sup></span></span>.", ["40", "1600", "20", "80"], "Показатели под корнем делят на 2: <span class=\"rt\">√<span class=\"ro\">2<sup>6</sup> · 5<sup>2</sup></span></span> = 2<sup>3</sup> · 5 = 8 · 5 = 40. Ответ 1600 — это 2<sup>6</sup> · 5<sup>2</sup> = 64 · 25, корень не извлечён. Ответ 20 получится, если показатель 6 разделить на 3, а не на 2 (2<sup>2</sup> · 5). Ответ 80 получится, если <span class=\"rt\">√<span class=\"ro\">5<sup>2</sup></span></span> принять за 10, то есть удвоить."], ["Найдите значение выражения (<span class=\"rt\">√<span class=\"ro\">3</span></span> + 1)<sup>2</sup> − 2<span class=\"rt\">√<span class=\"ro\">3</span></span>.", ["4", "2", "6", "8"], "(<span class=\"rt\">√<span class=\"ro\">3</span></span> + 1)<sup>2</sup> = (<span class=\"rt\">√<span class=\"ro\">3</span></span>)<sup>2</sup> + 2 · <span class=\"rt\">√<span class=\"ro\">3</span></span> · 1 + 1<sup>2</sup> = 4 + 2<span class=\"rt\">√<span class=\"ro\">3</span></span>. Вычитаем 2<span class=\"rt\">√<span class=\"ro\">3</span></span>: остаётся 4. Остальные ответы не получаются при верном раскрытии скобок. Проверьте, что в квадрате суммы есть удвоенное произведение 2 · <span class=\"rt\">√<span class=\"ro\">3</span></span> · 1."], ["Найдите значение выражения <span class=\"rt\">√<span class=\"ro\">(−7)<sup>2</sup></span></span>.", ["7", "−7", "49", "0"], "<span class=\"rt\">√<span class=\"ro\">a<sup>2</sup></span></span> = |a|. (−7)<sup>2</sup> = 49, <span class=\"rt\">√<span class=\"ro\">49</span></span> = 7. Арифметический корень не бывает отрицательным, поэтому −7 неверно. Ответ 49 — корень не извлечён. Ответ 0 не получается ни при каком верном действии."], ["Найдите значение выражения (<span class=\"rt\">√<span class=\"ro\">28</span></span> − <span class=\"rt\">√<span class=\"ro\">7</span></span>) · <span class=\"rt\">√<span class=\"ro\">7</span></span>.", ["7", "14", "21", "−7"], "<span class=\"rt\">√<span class=\"ro\">28</span></span> = 2<span class=\"rt\">√<span class=\"ro\">7</span></span>, значит <span class=\"rt\">√<span class=\"ro\">28</span></span> − <span class=\"rt\">√<span class=\"ro\">7</span></span> = <span class=\"rt\">√<span class=\"ro\">7</span></span>, а <span class=\"rt\">√<span class=\"ro\">7</span></span> · <span class=\"rt\">√<span class=\"ro\">7</span></span> = 7. Другой путь: <span class=\"rt\">√<span class=\"ro\">28</span></span> · <span class=\"rt\">√<span class=\"ro\">7</span></span> − <span class=\"rt\">√<span class=\"ro\">7</span></span> · <span class=\"rt\">√<span class=\"ro\">7</span></span> = 14 − 7 = 7. Ответ 14 получится, если забыть вычесть второе произведение. Ответ 21 — второе произведение прибавлено. Ответ −7 — вычитание выполнено в обратном порядке (7 − 14)."]];
let i=0,score=0,wrong=[];
const box=document.getElementById('box'),pb=document.getElementById('pb');
function shuffle(a){const r=a.map((v,k)=>[v,k]);for(let j=r.length-1;j>0;j--){const m=Math.floor(Math.random()*(j+1));[r[j],r[m]]=[r[m],r[j]]}return r}
function show(){
  if(i>=Q.length){return end()}
  pb.style.width=(i/Q.length*100)+'%';
  const [q,opts,exp]=Q[i];
  box.innerHTML='<div class="card"><span class="tag">Вопрос '+(i+1)+' из '+Q.length+'</span><p class="q">'+q+'</p><div id="o"></div><div id="e"></div></div>';
  const o=document.getElementById('o');
  shuffle(opts).forEach(([t,k])=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;b.onclick=()=>pick(b,k===0,exp);o.appendChild(b);b.dataset.k=k});
}
function pick(b,ok,exp){
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('ok')});
  if(ok){score++}else{b.classList.add('bad');wrong.push(i+1)}
  document.getElementById('e').innerHTML='<div class="exp">'+(ok?'Верно. ':'Неверно. ')+exp+'</div><button class="btn" onclick="i++;show()">'+(i===Q.length-1?'Результат':'Дальше')+'</button>';
}
function end(){
  pb.style.width='100%';
  const msg=score>=9?'Тема усвоена. Можно переходить к задачам повышенной сложности.':score>=7?'Хороший результат. Повторите вопросы, где были ошибки.':score>=5?'Есть пробелы. Вернитесь к теории и разберите ошибки.':'Нужно повторить теорию с начала: свойства корня и формулы сокращённого умножения.';
  box.innerHTML='<div class="card"><span class="tag">Результат</span><div class="big">'+score+' из '+Q.length+'</div><p>'+msg+'</p>'+(wrong.length?'<p class="sub">Ошибки в вопросах: '+wrong.join(', ')+'</p>':'')+'<button class="btn" onclick="i=0;score=0;wrong=[];show()">Пройти заново</button></div>';
}
show();
</script></body></html>
