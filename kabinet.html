function assignmentMeta(h){const time=Number(h.minutes||h.estimateMinutes),P=PROG(),nums=String(h.n||'').match(/\d+/g)||[],topics=nums.map(n=>P.topic[+n]).filter(Boolean);return `<div class="assignment-meta">${h.sec&&HWSEC[h.sec]?`<span>${esc(HWSEC[h.sec])}</span>`:''}${topics.length?`<span>${esc([...new Set(topics)].join(' · '))}</span>`:''}${time>0&&time<=240?`<span>Около ${time} мин</span>`:''}<span>${esc(dueText(h.due))}</span></div>`}
function secondaryFiles(h){const first=h.url||h.file||(h.files||[])[0]?.url;return [h.file?{name:'PDF с заданиями',url:h.file}:null,...(h.files||[])].filter(f=>f&&f.url!==first).map(f=>`<a href="${esc(href(f.url))}" target="_blank" rel="noopener">${esc(f.name||'Дополнительный файл')}</a>`).join('')}
function homeworkCounts(active){const c={submitted:0,checked:0,revise:0,done:0};active.forEach(h=>{const st=wfStatus(h);if(st in c)c[st]++});return wfEnabled()?`${c.submitted} на проверке · ${c.checked} проверено${c.revise?' · '+c.revise+' исправить':''}${c.done?' · '+c.done+' отмечено выполненными':''}`:`${c.done} из ${active.length} отмечено выполненными`}
function syncNotebook(){if(TEACH||!D)return;S.notebook=S.notebook&&typeof S.notebook==='object'&&!Array.isArray(S.notebook)?S.notebook:{};let changed=false;(D.hw||[]).forEach(h=>{const key='hw:'+h.id,old=S.notebook[key],status=wfStatus(h);if(status==='revise'&&h.feedback){if(!old){S.notebook[key]={id:key,hw:String(h.id),title:h.t,feedback:h.feedback,rule:'',correction:'',practice:'',at:Date.now()};changed=true}else if(old.feedback!==h.feedback){old.feedback=h.feedback;old.at=Date.now();changed=true}}});if(changed)save()}
function notebookState(e){const h=e.hw&&(D.hw||[]).find(h=>String(h.id)===e.hw);if(h){const st=wfStatus(h);if(st==='checked')return ['fixed','Исправление проверено'];if(st==='submitted')return ['waiting','Исправление на проверке'];if(st==='revise')return ['open','Нужно исправить']}return e.selfChecked?['self','Проверил себя']:['open','Разбираю']}
function notebookCard(){const entries=Object.values(S.notebook||{}).sort((a,b)=>b.at-a.at),open=entries.filter(e=>!['fixed','self'].includes(notebookState(e)[0])).length;return `<div class="card error-notebook" id="error-notebook"><div class="sh"><h2>Моя тетрадь ошибок</h2><span class="sub">${open?open+' разбираем':'Можно двигаться дальше'}</span></div><p class="note">Запиши, где запутался и как действовать в следующий раз. Замечания преподавателя из работ «Нужно исправить» появляются здесь автоматически. Личные записи и черновики хранятся в этом браузере.</p><button class="btn ghost" type="button" data-error-new>Добавить свою ошибку</button>${entries.length?`<div class="error-list">${entries.map(e=>{const [st,label]=notebookState(e),h=e.hw&&(D.hw||[]).find(h=>String(h.id)===e.hw);return `<details class="error-entry" ${st==='open'?'open':''}><summary><span>${esc(e.title)}</span><span class="hwstate ${st==='fixed'?'checked':st==='waiting'?'submitted':'revise'}">${label}</span></summary><div class="error-body"><p><b>${e.hw?'Комментарий преподавателя':'Где запутался'}:</b> ${esc(e.feedback)}</p>${e.rule?`<p><b>Что запомнить:</b> ${esc(e.rule)}</p>`:''}${e.correction?`<p><b>Моё исправление:</b> ${esc(e.correction)}</p>`:''}${e.practice?`<p><b>Похожее задание для закрепления:</b> ${esc(e.practice)}</p>`:''}<div class="focus-actions"><button class="chip" type="button" data-error-edit="${esc(e.id)}">${e.correction?'Изменить запись':'Записать исправление'}</button>${h&&wfEnabled()&&['revise','help','solving','new'].includes(wfStatus(h))?`<button class="chip" type="button" data-error-submit="${esc(e.id)}">Отправить исправление на проверку</button>`:''}${h&&homeworkURL(h)?hwAction(h):''}${!e.hw?`<button class="chip" type="button" data-error-self="${esc(e.id)}">${e.selfChecked?'Вернуть к повторению':'Проверил себя'}</button>`:''}</div></div></details>`}).join('')}</div>`:'<div class="notebook-empty">Здесь будут ошибки, которые ты разобрал и научился исправлять. Первую запись можно добавить самому.</div>'}</div>`}
function bindNotebook(){document.querySelectorAll('[data-error-new]').forEach(b=>b.onclick=()=>editNotebook());document.querySelectorAll('[data-error-edit]').forEach(b=>b.onclick=()=>editNotebook(b.dataset.errorEdit));document.querySelectorAll('[data-error-self]').forEach(b=>b.onclick=()=>{const e=S.notebook[b.dataset.errorSelf];if(e){e.selfChecked=!e.selfChecked;save();render()}});document.querySelectorAll('[data-error-submit]').forEach(b=>b.onclick=()=>{const e=S.notebook[b.dataset.errorSubmit],h=D.hw.find(h=>String(h.id)===e?.hw);if(!h)return;openWorkflow(h,'submit');const input=document.querySelector('.workflow-dialog textarea[name=note]');if(input&&e.correction)input.value=[e.rule?'Что запомнить: '+e.rule:'','Исправление: '+e.correction,e.practice?'Закрепление: '+e.practice:''].filter(Boolean).join('\n')})}
function editNotebook(id){const entry=id?S.notebook[id]:null;if(id&&!entry)return;const d=document.createElement('dialog');d.className='workflow-dialog';d.innerHTML=`<form><h2 id="error-title">${entry?'Разобрать ошибку':'Новая запись'}</h2><label>Тема или название задачи<input name="title" maxlength="180" required value="${esc(entry?.title||'')}" ${entry?.hw?'readonly':''}></label><label>${entry?.hw?'Комментарий преподавателя':'Где возникла ошибка'}<textarea name="feedback" maxlength="2000" required ${entry?.hw?'readonly':''}>${esc(entry?.feedback||'')}</textarea></label><label>Что нужно запомнить<textarea name="rule" maxlength="1500" placeholder="Какое правило поможет в следующий раз?">${esc(entry?.rule||'')}</textarea></label><label>Моё исправление<textarea name="correction" maxlength="1500" placeholder="Запиши правильный шаг и объясни его">${esc(entry?.correction||'')}</textarea></label><label>Похожее задание для закрепления (если есть)<textarea name="practice" maxlength="1000">${esc(entry?.practice||'')}</textarea></label><p class="note">Запись сохраняется в этом браузере. Чтобы преподаватель увидел исправление, отправь его на проверку из карточки ошибки.</p><p class="ferr" role="alert"></p><div class="focus-actions"><button class="btn ghost" type="button" data-close>Отмена</button><button class="btn" type="submit">Сохранить запись</button></div></form>`;d.setAttribute('aria-labelledby','error-title');document.body.appendChild(d);d.onclose=()=>d.remove();d.querySelector('[data-close]').onclick=()=>d.close();d.querySelector('form').onsubmit=ev=>{ev.preventDefault();const f=ev.currentTarget,v=n=>f.elements[n].value.trim();if(!v('title')||!v('feedback')){d.querySelector('.ferr').textContent='Укажи тему и то, где возникла ошибка.';return}const key=id||'own:'+Date.now()+':'+Math.random().toString(36).slice(2,7);const value={...entry,id:key,title:v('title'),feedback:v('feedback'),rule:v('rule'),correction:v('correction'),practice:v('practice'),at:Date.now(),selfChecked:false};S.notebook=S.notebook||{};S.notebook[key]=value;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(err){d.querySelector('.ferr').textContent='Не удалось сохранить. Не закрывай окно: скопируй текст или освободи место в браузере.';return}d.close();render();toast('Запись сохранена')};d.showModal()}
addEventListener('focus',()=>{if(D&&!TEACH&&S.mode==='kid'&&!document.querySelector('dialog[open]'))render()});
addEventListener('storage',event=>{if(event.key==='lili-resume-v1:'+STUDENT_KEY&&D&&!TEACH&&!document.querySelector('dialog[open]'))render()});

start();

})();
</script>
