text x=\"229\" y=\"135\">C\u003c/text>\u003ctext x=\"120\" y=\"152\">\u003c/text>\u003ctext x=\"229\" y=\"82\">\u003c/text>\u003ctext x=\"108\" y=\"62\">\u003c/text>\u003c/g>\u003c/svg>"},{"kind":"number","q":"В треугольнике ABC. Угол C прямой, AC = 12, cos A = 0,8. Найди AB.","unit":"","answer":15.0,"see":"Гипотенуза стоит в знаменателе.","similar":"Например, в треугольнике со сторонами 6, 8 и 10 катеты 6 и 8, а гипотенуза 10.","algorithm":"Вырази AB из равенства 0,8 · AB = 12.","retry":"Вырази AB из равенства 0,8 · AB = 12.","steps":["cos A = 12 : AB.","AB = 12 : 0,8 = 15."],"visual":"\u003csvg viewBox=\"0 0 260 165\" style=\"width:min(100%,300px);display:block;margin:auto;border-radius:12px\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, прямой угол C, отмечен угол A\">\n \u003cpath d=\"M32 130H220V25Z M205 130V115H220\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2\"/>\n \u003ccircle cx=\"32\" cy=\"130\" r=\"4\" fill=\"#9C6B40\"/>\n \u003cg fill=\"#16231A\" font-size=\"14\">\u003ctext x=\"15\" y=\"135\">A\u003c/text>\u003ctext x=\"229\" y=\"27\">B\u003c/text>\u003ctext x=\"229\" y=\"135\">C\u003c/text>\u003ctext x=\"120\" y=\"152\">\u003c/text>\u003ctext x=\"229\" y=\"82\">\u003c/text>\u003ctext x=\"108\" y=\"62\">\u003c/text>\u003c/g>\u003c/svg>"},{"kind":"number","q":"В треугольнике ABC. Угол C прямой, BC = 18, tg A = 1,5. Найди AC.","unit":"","answer":12.0,"see":"AC прилежит к углу A.","similar":"Например, в треугольнике со сторонами 6, 8 и 10 катеты 6 и 8, а гипотенуза 10.","algorithm":"Составь уравнение с AC в знаменателе.","retry":"Составь уравнение с AC в знаменателе.","steps":["tg A = 18 : AC.","1,5 · AC = 18, откуда AC = 12."],"visual":"\u003csvg viewBox=\"0 0 260 165\" style=\"width:min(100%,300px);display:block;margin:auto;border-radius:12px\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, прямой угол C, отмечен угол A\">\n \u003cpath d=\"M32 130H220V25Z M205 130V115H220\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2\"/>\n \u003ccircle cx=\"32\" cy=\"130\" r=\"4\" fill=\"#9C6B40\"/>\n \u003cg fill=\"#16231A\" font-size=\"14\">\u003ctext x=\"15\" y=\"135\">A\u003c/text>\u003ctext x=\"229\" y=\"27\">B\u003c/text>\u003ctext x=\"229\" y=\"135\">C\u003c/text>\u003ctext x=\"120\" y=\"152\">\u003c/text>\u003ctext x=\"229\" y=\"82\">\u003c/text>\u003ctext x=\"108\" y=\"62\">\u003c/text>\u003c/g>\u003c/svg>"},{"kind":"number","q":"В прямоугольном треугольнике A + B = 90°, cos B = 0,6. Найди sin A.","unit":"","answer":0.6,"see":"Напротив A лежит катет, прилежащий к B.","similar":"Например, в треугольнике со сторонами 6, 8 и 10 катеты 6 и 8, а гипотенуза 10.","algorithm":"Запиши оба отношения через один катет и гипотенузу.","retry":"Запиши оба отношения через один катет и гипотенузу.","steps":["Синус A и косинус B используют одну пару сторон.","Поэтому sin A = cos B = 0,6."]},{"kind":"number","q":"Острый угол A имеет tg A = 1. Найди A в градусах.","unit":"","answer":45.0,"see":"Тангенс равен единице, когда катеты равны.","similar":"Например, в треугольнике со сторонами 6, 8 и 10 катеты 6 и 8, а гипотенуза 10.","algorithm":"Раздели 90° между двумя равными острыми углами.","retry":"Раздели 90° между двумя равными острыми углами.","steps":["Катеты равны, значит противоположные им углы равны.","Каждый острый угол равен 45°."]}]},{"name":"Значения и формулы","subtitle":"От 0° до 180°","title":"Значения и формулы","intro":"\u003cp>Для угла на единичной полуокружности cos α = x, sin α = y. Во II четверти x &lt; 0, y &gt; 0.\u003c/p>\u003cp>sin² α + cos² α = 1. При cos α ≠ 0: tg α = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">sin α\u003c/span>\u003cspan>cos α\u003c/span>\u003c/span>.\u003c/p>\u003cp>Для 30°, 45°, 60° синусы равны \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>, \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">√2\u003c/span>\u003cspan>2\u003c/span>\u003c/span>, \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">√3\u003c/span>\u003cspan>2\u003c/span>\u003c/span>. Косинусы идут в обратном порядке.\u003c/p>","anchor":"Сначала проверь знак функции.","anchorNote":"У углов α и 180° − α синусы одинаковые, косинусы противоположные.","tasks":[{"kind":"number","q":"Вычисли sin 30° + cos 60°.","unit":"","answer":1.0,"see":"Оба угла входят в таблицу.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Подставь два табличных значения.","retry":"Подставь два табличных значения.","steps":["sin 30° = 0,5 и cos 60° = 0,5.","Сумма равна 1."]},{"kind":"choice","q":"Чему равен tg 60°?","unit":"","answer":"√3","see":"Тангенс можно получить делением синуса на косинус.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Раздели √3 пополам, затем раздели полученное значение на 0,5.","retry":"Раздели √3 пополам, затем раздели полученное значение на 0,5.","steps":["sin 60° = √3 : 2, cos 60° = 1 : 2.","При делении общий знаменатель сокращается."],"options":["√3","1","√3 : 2","1 : √3"]},{"kind":"number","q":"Вычисли cos 0° + sin 90° + cos 180°.","unit":"","answer":1.0,"see":"Крайние точки полуокружности лежат на оси x.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Прочитай нужные координаты трёх точек.","retry":"Прочитай нужные координаты трёх точек.","steps":["Координаты точек: (1; 0), (0; 1), (−1; 0).","Сумма равна 1 + 1 − 1 = 1."]},{"kind":"choice","q":"Что можно сказать о tg 90°?","unit":"","answer":"Не определён","see":"Косинус прямого угла равен нулю.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Проверь знаменатель в отношении sin α к cos α.","retry":"Проверь знаменатель в отношении sin α к cos α.","steps":["tg 90° потребовал бы разделить 1 на 0.","Деление на ноль невозможно."],"options":["Равен 0","Равен 1","Не определён"]},{"kind":"number","q":"Вычисли cos 120°.","unit":"","answer":-0.5,"see":"120° = 180° − 60°.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Возьми cos 60° с противоположным знаком.","retry":"Возьми cos 60° с противоположным знаком.","steps":["Угол 120° во II четверти, поэтому косинус отрицателен.","cos 120° = −0,5."]},{"kind":"choice","q":"Вычисли sin 135°.","unit":"","answer":"√2 : 2","see":"135° и 45° симметричны относительно оси y.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Возьми синус соответствующего острого угла.","retry":"Возьми синус соответствующего острого угла.","steps":["sin 135° = sin 45° = √2 : 2."],"options":["−√2 : 2","√2 : 2","0,5","1"]},{"kind":"choice","q":"Вычисли tg 150°.","unit":"","answer":"−1 : √3","see":"150° = 180° − 30°.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Тангенс меняет знак при переходе к углу 180° − α.","retry":"Тангенс меняет знак при переходе к углу 180° − α.","steps":["sin 150° положителен, cos 150° отрицателен.","tg 150° = −tg 30° = −1 : √3."],"options":["1 : √3","−1 : √3","−√3","0"]},{"kind":"number","q":"Угол α тупой, sin α = 0,8. Найди cos α.","unit":"","answer":-0.6,"see":"Косинус тупого угла отрицателен.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Найди cos² α по основному тождеству, затем учти знак.","retry":"Найди cos² α по основному тождеству, затем учти знак.","steps":["cos² α = 1 − 0,64 = 0,36.","cos α = −0,6."]},{"kind":"number","q":"Угол α острый, tg α = 3 : 4. Найди sin α.","unit":"","answer":0.6,"see":"Можно представить катеты 3 и 4.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Найди гипотенузу и составь отношение для синуса.","retry":"Найди гипотенузу и составь отношение для синуса.","steps":["Тангенс задаёт отношение противоположного катета к прилежащему.","У катетов 3 и 4 гипотенуза 5, поэтому sin α = 3/5."]},{"kind":"number","q":"Упрости 2 − sin² α − cos² α.","unit":"","answer":1.0,"see":"Вычитаются оба квадрата.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Сгруппируй квадраты в одну сумму.","retry":"Сгруппируй квадраты в одну сумму.","steps":["2 − (sin² α + cos² α) = 2 − 1 = 1."]},{"kind":"choice","q":"Найди все углы от 0° до 180° включительно, для которых sin α = 0,5.","unit":"","answer":"30° и 150°","see":"Точки с одной высотой симметричны относительно оси y.","similar":"На единичной полуокружности у углов 60° и 120° высота одинакова, а координаты x противоположны.","algorithm":"Найди табличный острый угол и вычти его из 180°.","retry":"Найди табличный острый угол и вычти его из 180°.","steps":["sin 30° = 0,5.","Угол 150° имеет тот же синус."],"options":["Только 30°","30° и 150°","60° и 120°"]}]},{"name":"Чертежи и задачи ОГЭ","subtitle":"Клетки, высоты, окружность и утверждения","title":"Чертежи и задачи ОГЭ","intro":"\u003cp>На рисунке сначала найди прямоугольный треугольник. Его можно получить, проведя высоту, или достроить по клеткам. Угол, опирающийся на диаметр, прямой.\u003c/p>","anchor":"Найди нужное отношение до вычислений.","anchorNote":"Для тангенса на клетках часто достаточно посчитать два катета.","tasks":[{"kind":"number","q":"На клетчатой сетке изображён треугольник ABC. Найди tg A.","unit":"","answer":0.6,"see":"Горизонтальный и вертикальный отрезки перпендикулярны.","similar":"Если подъём 2 клетки, а ход вправо 4, тангенс равен 0,5.","algorithm":"Посчитай подъём от C до B и ход от A до C.","retry":"Посчитай подъём от C до B и ход от A до C.","steps":["BC = 3 клетки, AC = 5 клеток.","tg A = BC : AC = 3/5."],"visual":"\u003csvg viewBox=\"0 0 240 160\" style=\"width:min(100%,320px);display:block;margin:auto\" role=\"img\" aria-label=\"Сетка. От A до C пять клеток вправо, от C до B три клетки вверх\">\n\u003cdefs>\u003cpattern id=\"trig-grid\" width=\"24\" height=\"24\" patternUnits=\"userSpaceOnUse\">\u003cpath d=\"M24 0H0V24\" fill=\"none\" stroke=\"#9C6B40\"/>\u003c/pattern>\u003c/defs>\n\u003crect width=\"240\" height=\"144\" fill=\"url(#trig-grid)\"/>\u003cpath d=\"M48 120H168V48Z\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2\"/>\n\u003cg fill=\"#16231A\" font-size=\"15\">\u003ctext x=\"35\" y=\"137\">A\u003c/text>\u003ctext x=\"174\" y=\"47\">B\u003c/text>\u003ctext x=\"174\" y=\"137\">C\u003c/text>\u003c/g>\u003c/svg>"},{"kind":"number","q":"В прямоугольном треугольнике высота к гипотенузе делит её на отрезки 9 и 16. Найди тангенс угла между гипотенузой и катетом, проекция которого равна 16.","unit":"","answer":0.75,"see":"Высота образует два прямоугольных треугольника.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Найди высоту как среднее геометрическое двух отрезков.","retry":"Найди высоту как среднее геометрическое двух отрезков.","steps":["По подобию h² = 9 · 16, поэтому h = 12.","В нужном малом треугольнике прилежащий катет равен 16, а противолежащий равен 12.","tg = 12 : 16 = 0,75."]},{"kind":"number","q":"Лестница длиной 10 м опирается на стену под углом 60° к полу. На каком расстоянии от стены стоит основание лестницы? Ответ в метрах.","unit":"","answer":5.0,"see":"Лестница образует гипотенузу.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Расстояние по полу прилежит к углу 60°.","retry":"Расстояние по полу прилежит к углу 60°.","steps":["Расстояние равно 10 · cos 60°.","10 · 0,5 = 5 м."]},{"kind":"number","q":"AB = 26 является диаметром окружности, C лежит на окружности, BC = 10. Найди sin ∠BAC.","unit":"","answer":0.38461538461538464,"see":"Угол ACB опирается на диаметр.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Используй прямоугольный треугольник ABC.","retry":"Используй прямоугольный треугольник ABC.","steps":["Угол ACB равен 90°, AB является гипотенузой.","sin ∠BAC = BC : AB = 10 : 26 = 5/13."]},{"kind":"number","q":"В равнобедренной трапеции основания равны 20 и 8, высота равна 8. Найди синус острого угла.","unit":"","answer":0.8,"see":"Две высоты из концов меньшего основания отсекают равные прямоугольные треугольники.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Половина разности оснований даёт горизонтальный катет.","retry":"Половина разности оснований даёт горизонтальный катет.","steps":["Горизонтальный катет равен (20 − 8) : 2 = 6.","Боковая сторона равна √(6² + 8²) = 10.","Синус острого угла равен 8 : 10 = 0,8."]},{"kind":"number","q":"Сторона ромба равна 12, острый угол равен 30°. Найди площадь.","unit":"","answer":72.0,"see":"Площадь равна стороне, умноженной на высоту.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Найди высоту через синус угла.","retry":"Найди высоту через синус угла.","steps":["Высота равна 12 · sin 30° = 6.","Площадь равна 12 · 6 = 72."]},{"kind":"choice","q":"Какое утверждение верно?","unit":"","answer":"У острого угла тангенс может быть больше 1.","see":"Проверь утверждения на числах.","similar":"Для начала выдели один прямоугольный треугольник, как в задаче про лестницу, стену и пол.","algorithm":"Сравни, какие стороны стоят в знаменателях у синуса и тангенса.","retry":"Сравни, какие стороны стоят в знаменателях у синуса и тангенса.","steps":["Синус острого угла меньше 1, поскольку катет короче гипотенузы.","У тангенса в знаменателе катет. Например, tg 60° = √3 > 1.","Косинус тупого угла отрицателен."],"options":["Синус острого угла может быть больше 1.","У острого угла тангенс может быть больше 1.","Косинус тупого угла всегда положителен."]}]},{"name":"Произвольный треугольник","subtitle":"Площадь и две теоремы","title":"Произвольный треугольник","intro":"\u003cp>a, b и c лежат напротив A, B и C соответственно.\u003c/p>\u003cp>Площадь: S = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">1\u003c/span>\u003cspan>2\u003c/span>\u003c/span>ab sin C. Теорема косинусов: c² = a² + b² − 2ab cos C.\u003c/p>\u003cp>Теорема синусов: \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">a\u003c/span>\u003cspan>sin A\u003c/span>\u003c/span> = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">b\u003c/span>\u003cspan>sin B\u003c/span>\u003c/span> = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">c\u003c/span>\u003cspan>sin C\u003c/span>\u003c/span> = 2R, где R является радиусом описанной окружности.\u003c/p>","anchor":"Проверь, где расположен угол.","anchorNote":"В формуле площади и в теореме косинусов нужен угол между двумя известными сторонами.","tasks":[{"kind":"number","q":"Две стороны треугольника равны 8 и 10, угол между ними равен 150°. Найди площадь.","unit":"","answer":20.0,"see":"Синус тупого угла положителен.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Умножь половину произведения сторон на sin 150°.","retry":"Умножь половину произведения сторон на sin 150°.","steps":["sin 150° = sin 30° = 0,5.","S = 8 · 10 · 0,5 : 2 = 20."]},{"kind":"number","q":"Две стороны треугольника равны 6 и 10, площадь равна 15. Найди синус угла между этими сторонами.","unit":"","answer":0.5,"see":"Площадь известна, синус остаётся неизвестным.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Подставь длины и реши линейное уравнение.","retry":"Подставь длины и реши линейное уравнение.","steps":["15 = 6 · 10 · sin C : 2.","30 · sin C = 15, поэтому sin C = 0,5."]},{"kind":"number","q":"Стороны 5 и 8 образуют угол 60°. Найди длину третьей стороны.","unit":"","answer":7.0,"see":"Известны две стороны и угол между ними.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Найди квадрат третьей стороны по теореме косинусов.","retry":"Найди квадрат третьей стороны по теореме косинусов.","steps":["c² = 25 + 64 − 2 · 5 · 8 · 0,5 = 49.","Длина положительна, поэтому c = 7."]},{"kind":"number","q":"Стороны треугольника равны 3, 7 и 8. Найди косинус угла напротив стороны длиной 8.","unit":"","answer":-0.14285714285714285,"see":"Искомый угол образуют стороны 3 и 7.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Вырази cos C из теоремы косинусов.","retry":"Вырази cos C из теоремы косинусов.","steps":["64 = 9 + 49 − 42 cos C.","42 cos C = 58 − 64 = −6.","cos C = −6 : 42 = −1/7."]},{"kind":"choice","q":"Стороны треугольника равны 5, 7 и 9. Какой угол лежит напротив стороны длиной 9?","unit":"","answer":"Тупой","see":"Тип угла определяется знаком косинуса.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Сравни 9² с суммой 5² + 7².","retry":"Сравни 9² с суммой 5² + 7².","steps":["9² = 81, а 5² + 7² = 74.","Чтобы получить 81 по теореме косинусов, нужно вычесть отрицательное число.","Косинус отрицателен, поэтому угол тупой."],"options":["Острый","Прямой","Тупой"]},{"kind":"choice","q":"В треугольнике ABC сторона a = 6, угол A = 30°, угол B = 60°. Найди сторону b.","unit":"","answer":"6√3","see":"a лежит напротив A, b лежит напротив B.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Приравняй отношения сторон к синусам противоположных углов.","retry":"Приравняй отношения сторон к синусам противоположных углов.","steps":["a : sin A = 6 : 0,5 = 12.","b = 12 · sin 60° = 6√3."],"options":["6√3","3√3","12","6"]},{"kind":"number","q":"Сторона длиной 14 лежит напротив угла 150°. Найди радиус описанной окружности.","unit":"","answer":14.0,"see":"Отношение стороны к синусу противоположного угла равно диаметру.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Найди 2R и раздели пополам.","retry":"Найди 2R и раздели пополам.","steps":["sin 150° = 0,5.","2R = 14 : 0,5 = 28, поэтому R = 14."]},{"kind":"number","q":"Дано A = 30°, a = 5, b = 5√3. Сколько разных треугольников можно построить с этими данными?","unit":"","answer":2.0,"see":"Одинаковый синус могут иметь два угла.","similar":"Если известна сторона 10 напротив угла 30°, отношение стороны к синусу угла равно 20.","algorithm":"Найди возможные углы B и проверь сумму A + B.","retry":"Найди возможные углы B и проверь сумму A + B.","steps":["По теореме синусов sin B = b · sin A : a = √3 : 2.","B может быть 60° или 120°. В обоих случаях A + B \u003c 180°.","Получаются два треугольника."]}]},{"name":"Итоговая тренировка","subtitle":"Короткие ответы и задачи с записью решения","title":"Итоговая тренировка","intro":"\u003cp>Сначала реши самостоятельно. В двух последних задачах запиши в тетради, какую формулу используешь и почему она подходит. После ввода ответа сравни ход решения с разбором.\u003c/p>","anchor":"Запиши, какие стороны и углы известны.","anchorNote":"При проверке числовых ответов можно вводить обыкновенные дроби.","tasks":[{"kind":"number","q":"Угол C треугольника ABC прямой. AC = 15, BC = 20. Найди cos A.","unit":"","answer":0.6,"see":"Нужны AC и AB.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Найди гипотенузу по теореме Пифагора.","retry":"Найди гипотенузу по теореме Пифагора.","steps":["AB = √(225 + 400) = 25.","cos A = 15 : 25 = 0,6."]},{"kind":"number","q":"Острый угол α имеет cos α = 0,8. Найди tg α.","unit":"","answer":0.75,"see":"Для тангенса нужны синус и косинус.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Найди положительный синус по тождеству.","retry":"Найди положительный синус по тождеству.","steps":["sin² α = 1 − 0,64 = 0,36, поэтому sin α = 0,6.","tg α = 0,6 : 0,8 = 0,75."]},{"kind":"number","q":"В равнобедренном треугольнике боковая сторона равна 13, основание равно 10. Найди тангенс угла при основании.","unit":"","answer":2.4,"see":"Высота к основанию делит его пополам.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Найди высоту и раздели её на половину основания.","retry":"Найди высоту и раздели её на половину основания.","steps":["Получился прямоугольный треугольник с гипотенузой 13 и катетом 5.","Высота равна √(169 − 25) = 12.","Тангенс равен 12 : 5 = 2,4."]},{"kind":"number","q":"Две стороны параллелограмма равны 7 и 8, угол между ними равен 150°. Найди площадь.","unit":"","answer":28.0,"see":"Высота равна стороне, умноженной на синус угла между сторонами.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Умножь произведение сторон на sin 150°.","retry":"Умножь произведение сторон на sin 150°.","steps":["sin 150° = 0,5.","Площадь параллелограмма равна 7 · 8 · 0,5 = 28."]},{"kind":"number","q":"Запиши решение. Стороны 3 и 5 образуют угол 120°. Найди периметр треугольника.","unit":"","answer":15.0,"see":"Неизвестна третья сторона.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Примени теорему косинусов, затем сложи три стороны.","retry":"Примени теорему косинусов, затем сложи три стороны.","steps":["cos 120° = −0,5.","c² = 9 + 25 − 2 · 3 · 5 · (−0,5) = 49, поэтому c = 7.","Периметр равен 3 + 5 + 7 = 15."]},{"kind":"number","q":"Запиши решение. В треугольнике со сторонами 7, 15 и 20 найди площадь.","unit":"","answer":42.0,"see":"Для формулы площади понадобятся две стороны и синус угла между ними.","similar":"Вспомни, какая формула связывает известные величины с искомой.","algorithm":"Найди косинус угла между сторонами 7 и 15, затем его синус.","retry":"Найди косинус угла между сторонами 7 и 15, затем его синус.","steps":["cos C = (49 + 225 − 400) : 210 = −0,6.","Так как угол треугольника лежит между 0° и 180°, sin C положителен.","sin C = √(1 − 0,36) = 0,8.","S = 7 · 15 · 0,8 : 2 = 42."]}]}],"recap":["Роли катетов зависят от выбранного угла.","У тупого угла синус положителен, косинус и тангенс отрицательны.","В задаче на площадь найди угол между двумя сторонами.","Теорема синусов связывает сторону с противоположным углом."],"lab":{"title":"Как меняются катеты","intro":"Переключи угол на одном и том же треугольнике.","cases":[{"label":"Смотрим из A","html":"\u003csvg viewBox=\"0 0 260 165\" style=\"width:min(100%,300px);display:block;margin:auto;border-radius:12px\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, прямой угол C, отмечен угол A\">\n \u003cpath d=\"M32 130H220V25Z M205 130V115H220\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2\"/>\n \u003ccircle cx=\"32\" cy=\"130\" r=\"4\" fill=\"#9C6B40\"/>\n \u003cg fill=\"#16231A\" font-size=\"14\">\u003ctext x=\"15\" y=\"135\">A\u003c/text>\u003ctext x=\"229\" y=\"27\">B\u003c/text>\u003ctext x=\"229\" y=\"135\">C\u003c/text>\u003ctext x=\"120\" y=\"152\">4\u003c/text>\u003ctext x=\"229\" y=\"82\">3\u003c/text>\u003ctext x=\"108\" y=\"62\">5\u003c/text>\u003c/g>\u003c/svg>\u003cp>Напротив A катет BC. Прилежит катет AC.\u003c/p>\u003cp>sin A = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">3\u003c/span>\u003cspan>5\u003c/span>\u003c/span> cos A = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">4\u003c/span>\u003cspan>5\u003c/span>\u003c/span> tg A = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">3\u003c/span>\u003cspan>4\u003c/span>\u003c/span>\u003c/p>"},{"label":"Смотрим из B","html":"\u003csvg viewBox=\"0 0 260 165\" style=\"width:min(100%,300px);display:block;margin:auto;border-radius:12px\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, прямой угол C, отмечен угол B\">\n \u003cpath d=\"M32 130H220V25Z M205 130V115H220\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2\"/>\n \u003ccircle cx=\"220\" cy=\"25\" r=\"4\" fill=\"#9C6B40\"/>\n \u003cg fill=\"#16231A\" font-size=\"14\">\u003ctext x=\"15\" y=\"135\">A\u003c/text>\u003ctext x=\"229\" y=\"27\">B\u003c/text>\u003ctext x=\"229\" y=\"135\">C\u003c/text>\u003ctext x=\"120\" y=\"152\">4\u003c/text>\u003ctext x=\"229\" y=\"82\">3\u003c/text>\u003ctext x=\"108\" y=\"62\">5\u003c/text>\u003c/g>\u003c/svg>\u003cp>Напротив B катет AC. Прилежит катет BC.\u003c/p>\u003cp>sin B = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">4\u003c/span>\u003cspan>5\u003c/span>\u003c/span> cos B = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">3\u003c/span>\u003cspan>5\u003c/span>\u003c/span> tg B = \u003cspan style=\"display:inline-grid;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .22em\">\u003cspan style=\"border-bottom:1px solid;padding:0 .25em\">4\u003c/span>\u003cspan>3\u003c/span>\u003c/span>\u003c/p>"}]}};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();
</script>
  <script>(function(){
  'use strict';
  const C=window.TrainerCourse,KEY='lili-trainer-'+C.id+'-'+(C.version||1)+(window.LiliStudy?.suffix||''),TOTAL=C.total;
  let storageOK=true,view='lesson',hints=new Set(),feedback=null,labIndex=0;
  const blank=()=>({stage:0,task:0,solved:[],attempts:{},answers:{}});
  function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!Number.isInteger(s.stage)||s.stage<0||s.stage>=C.stages.length)return blank();return {stage:s.stage,task:Number.isInteger(s.task)&&s.task>=0&&s.task<C.stages[s.stage].tasks.length?s.task:0,solved:Array.isArray(s.solved)?s.solved.filter(k=>validKey(k)):[],attempts:s.attempts&&typeof s.attempts==='object'?s.attempts:{},answers:s.answers&&typeof s.answers==='object'?s.answers:{}};}catch(e){storageOK=false;return blank();}}
  function validKey(k){if(typeof k!=='string')return false;const a=k.split('-').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&C.stages[a[0]]&&C.stages[a[0]].tasks[a[1]];}
  let state=readState();state.solved=[...new Set(state.solved)];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${esc(s.name)}<small>${n} / ${s.tasks.length} · ${esc(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function mathText(value){
    return esc(value).replace(/(−?\d+)\/(\d+)/g,
      '<span class="fraction"><span>$1</span><span>$2</span></span>');
  }
  function visual(t){return t.visual?`<div class="visual-panel">${t.visual}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${esc([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();window.LiliStudy?.task(state.stage+'-'+state.task);}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Это задание уже получилось.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} / ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${esc(s.title)}</h2><div>${s.intro}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${esc(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Твой ответ" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3>Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${esc(s.anchor)}</p><small>${esc(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К итогу':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Можно использовать запятую, точку или дробь вида 3/4.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно. Получилось!',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();scrollToLesson();}
  function goTask(i){state.task=i;feedback=null;hints.clear();save();render();scrollToLesson();}
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${esc(lab.title)}</h2><p class="lab-note">${esc(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${esc(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${c.html}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Все ${TOTAL} задания решены. Подсказки тоже помогают учиться — это часть работы.`}</p><div class="review-list">${C.recap.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
</body>
</html>
