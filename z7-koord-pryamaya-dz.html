т a. Запиши это двойным неравенством."], "note": "Ответ — номер верного варианта (одна цифра)."}, {"n": 5, "part": 2, "topic": "Корень на координатной прямой", "a": [3], "q": "<p>Одно из чисел <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">45</span></span>, <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">52</span></span>, <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">58</span></span>, <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">66</span></span> отмечено на прямой точкой A. Какое это число?</p><div class=\"fig\"><svg class=\"nl\" width=\"420\" height=\"80\" viewBox=\"0 0 420 80\" role=\"img\" aria-label=\"координатная прямая\"><line class=\"ax\" x1=\"12\" y1=\"42\" x2=\"406\" y2=\"42\"/><path class=\"arw\" d=\"M400 37 L411 42 L400 47 Z\"/><line class=\"ax\" x1=\"22.0\" y1=\"35\" x2=\"22.0\" y2=\"49\"/><text class=\"tm\" x=\"22.0\" y=\"67\" text-anchor=\"middle\">6</text><line class=\"ax\" x1=\"82.3\" y1=\"38.5\" x2=\"82.3\" y2=\"45.5\"/><line class=\"ax\" x1=\"142.7\" y1=\"35\" x2=\"142.7\" y2=\"49\"/><text class=\"tm\" x=\"142.7\" y=\"67\" text-anchor=\"middle\">7</text><line class=\"ax\" x1=\"203.0\" y1=\"38.5\" x2=\"203.0\" y2=\"45.5\"/><line class=\"ax\" x1=\"263.3\" y1=\"35\" x2=\"263.3\" y2=\"49\"/><text class=\"tm\" x=\"263.3\" y=\"67\" text-anchor=\"middle\">8</text><line class=\"ax\" x1=\"323.7\" y1=\"38.5\" x2=\"323.7\" y2=\"45.5\"/><line class=\"ax\" x1=\"384.0\" y1=\"35\" x2=\"384.0\" y2=\"49\"/><text class=\"tm\" x=\"384.0\" y=\"67\" text-anchor=\"middle\">9</text><circle class=\"pt q\" cx=\"215.1\" cy=\"42\" r=\"5.5\"/><text class=\"ptl q\" x=\"215.1\" y=\"28\" text-anchor=\"middle\">A</text></svg></div><div class=\"opts\"><div><b>1)</b> <span class=\"rt\"><span class=\"rs\" aria-hidden=\"true\"></span><span class=\"rad\">45</span></span></div><div><b>2)</b> <span class=\"rt\"><span class=\"rs\" a     if(fb)h+=fb;
    h+=`<div class="alts">${shown<1?`<button class="chip" id="hb">Подсказка</button>`:''}${mode==='ans'?`<button class="chip" id="tb">Есть идея, но дальше никак</button>`:''}<button class="chip" id="ib">Не знаю, как решать</button></div>`;
  }else{
    if(fb)h+=fb;
    h+=`<button class="btn next" id="nx">${S.i===T.length-1?'Смотреть результат':'Дальше'}</button>`;
  }
  box.innerHTML=h;bind(t,r);
}
function keep(fb){const i=document.getElementById('inp'),v=i?i.value:'';draw(fb);const j=document.getElementById('inp');if(j){j.value=v;j.select()}}
function resolve(r,st){r.st=st;r.t+=Math.round((Date.now()-taskStart)/1000);resolved=true;save();pushResult()}
function bind(t,r){
  const $=id=>document.getElementById(id);
  if($('nx')){$('nx').focus({preventScroll:true});$('nx').onclick=()=>{S.i++;save();next()};return}
  if($('inp')){$('inp').focus({preventScroll:true});$('inp').onkeydown=e=>{if(e.key==='Enter')$('chk').click()}}
  if($('chk'))$('chk').onclick=()=>{
    const raw=$('inp').value.trim();if(!raw){$('inp').focus();return}
    const nums=parseNums(raw);
    if(nums.some(isNaN)){keep(fbBox('bad','Не похоже на число','Запиши ответ цифрами. Дробную часть отделяй запятой.'));return}
    r.tries++;r.ans.push(raw);
    if(same(nums,t.a)){resolve(r,'ok');draw(fbBox('ok',r.tries===1?'Верно':'Верно со второй попытки'));return}
    if(r.tries>=2){resolve(r,'bad');draw(fbBox('neu','Ответ записан','Разберём на занятии.'));return}
    save();keep(fbBox('bad','Не сходится',shown<1?'Проверь вычисления или возьми подсказку. Осталась одна попытка.':'Проверь вычисления. Осталась одна попытка.'));
  };
  if($('hb'))$('hb').onclick=()=>{shown++;r.hints=shown;save();keep()};
  if($('tb'))$('tb').onclick=()=>{mode='think';draw();$('th').focus()};
  if($('back'))$('back').onclick=()=>{r.th=$('th').value;mode='ans';draw()};
  if($('thgo'))$('thgo').onclick=()=>{const v=$('th').value.trim();if(!v){$('th').focus();return}r.th=v;resolve(r,'th');draw(fbBox('neu','Записано','Разберём на занятии.'))};
  if($('ib'))$('ib').onclick=()=>{const th=$('th');if(th&&th.value.trim())r.th=th.value.trim();resolve(r,'idk');draw(fbBox('neu','Принято','Разберём на занятии.'))};
}
const SHEET_URL='https://script.google.com/macros/s/AKfycbyJKYatO3xdOpYJ1WZzszbxqMnOWZ30lsfr5HH7Y23svvX6iqjNNbIUR-RCUeZ8pB15/exec';
function pushResult(){
  if(!S.name||!S.started)return;
  try{const sc=score(),mk={ok:'✓',bad:'✗',idk:'?',th:'~'};
    const d={sid:S.sid,test:TESTN,name:S.name,kind:'ДЗ',started:S.started,status:S.done?'завершено':'в процессе',
      progress:T.filter(t=>S.r[t.n]&&S.r[t.n].st).length+'/'+T.length,score:sc.ok,max:T.length,grade:sc.pct+'%',minutes:Math.round(elapsed()/60),bonus:'',
      tasks:T.map(t=>{const r=S.r[t.n];return t.n+(r&&r.st?mk[r.st]:'·')+(r&&r.hints>0?'п':'')}).join(' '),report:report(sc)};
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).catch(()=>{});
  }catch(e){}
}
function lv(k){const a=T.filter(t=>t.part===k);return [a.filter(t=>S.r[t.n]&&S.r[t.n].st==='ok').length,a.length]}
const pc=(a,b)=>b?Math.round(a/b*100):0;
function score(){let ok=0,self=0,hint=0;for(const t of T){const r=S.r[t.n]||{};if(r.st==='ok'){ok++;r.hints>0?hint++:self++}}return {ok,self,hint,bad:T.length-ok,n:T.length,pct:pc(ok,T.length),lv:[1,2,3].map(lv)}}
function report(sc){
  const Lb={ok:'верно',bad:'неверно',idk:'не знаю',th:'есть идея, застрял(а)'};
  const weak=T.filter(t=>!(S.r[t.n]&&S.r[t.n].st==='ok'));
  const L=[`25/25 · Домашняя работа №${NO} · ${TOPIC} (№7 ОГЭ) — ${S.name}`,`Дата: ${new Date().toLocaleDateString('ru-RU')}, время: ${fmtT(elapsed())}`,
   `Выполнено: ${sc.ok} из ${sc.n} (${sc.pct}%) · без подсказки: ${sc.self} · верно с подсказкой: ${sc.hint} · не решено: ${sc.bad} · подсказок взято всего: ${T.filter(t=>S.r[t.n]&&S.r[t.n].hints>0).length}`,
   `${GL[0]}: ${sc.lv[0][0]}/${sc.lv[0][1]} (${pc(...sc.lv[0])}%) · ${GL[1]}: ${sc.lv[1][0]}/${sc.lv[1][1]} (${pc(...sc.lv[1])}%) · ${GL[2]}: ${sc.lv[2][0]}/${sc.lv[2][1]} (${pc(...sc.lv[2])}%)`,'','По заданиям:'];
  for(const t of T){const r=S.r[t.n]||{};let s=`${t.n} (гр.${t.part}, ${t.topic}). ${Lb[r.st]||'—'}`;
    if(r.st==='ok'&&r.tries>1)s+=' со 2-й попытки';
    s+=`, попыток: ${r.tries||0}, подсказка: ${r.hints>0?'ВЗЯТА':'не брала'}`;
    if(r.st&&r.st!=='ok'&&r.ans&&r.ans.length)s+=`, неверные ответы: ${r.ans.join(' | ')}`;
    if(r.t)s+=`, ${fmtT(r.t)}`;L.push(s);if(r.th)L.push(`   идея: «${r.th}»`)}
  L.push('',weak.length?'Что подтянуть: '+weak.map(t=>`№${t.n} ${t.topic}`).join('; '):'Что подтянуть: всё решено','','lili.math');return L.join('\n');
}
function finish(){
  S.done=true;S.i=T.length;save();clearInterval(tick);pushResult();
  const sc=score(),weak=T.filter(x=>!(S.r[x.n]&&S.r[x.n].st==='ok'));
  const blk=k=>{const [a,b]=sc.lv[k-1];return `<div class="blk"><div class="h">${GL[k-1]}<b>${pc(a,b)}%</b></div><div class="bar"><i style="width:${pc(a,b)}%"></i></div><div class="h"><span>${a} из ${b}</span></div></div>`};
  app.innerHTML=topbar()+`<article class="card"><div class="rhead"><div class="kick">${esc(S.name)}, работа сдана</div><div class="big">${sc.pct}<span style="font-size:.4em">%</span></div>
  <div class="quiet">верно: ${sc.ok} из ${sc.n} · время ${fmtT(elapsed())}</div></div>
  <div class="cells">${T.map(x=>{const r=S.r[x.n]||{};return `<div class="cell ${r.st||''}">${x.n}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--mint)"></i>верно</span><span><i style="background:var(--miss)"></i>не сошлось</span><span><i style="background:var(--amber)"></i>была идея</span><span><i style="background:#6f625a"></i>не знаю</span></div>
  <div class="blocks">${blk(1)}${blk(2)}${blk(3)}</div>
  <div class="weak"><div class="kick" style="margin:0">Что подтянуть</div>${weak.length?`<ul>${weak.map(x=>`<li><b>№${x.n}</b> · ${x.topic}</li>`).join('')}</ul>`:'<p>Всё решено. Подтягивать нечего.</p>'}</div>
  <div class="send"><p class="quiet">Результат отправлен Лилии.</p></div></article>`;
}
if(S.done&&S.name)finish();else renderStart();
})();
</script>
