</style></head><body><div class="wrap"><p class="sub"><a href="z23-trapeciya.html" style="color:#7da2ff">← Трапеция (№23–25)</a></p><h1>Тренажёр: трапеция</h1><p class="sub">Пять задач повышенной сложности (№23, №24). На каждом шаге ответьте, затем нажмите «Дальше». Десятичные числа можно писать через запятую.</p><div class="tabs" id="tabs"></div><div class="bar"><i id="pb"></i></div><div id="box"></div></div><script>const T=[{"title": "Задача 1. Диагонали и площади", "cond": "<svg class=\"fig\" viewBox=\"0 0 250 138\" width=\"250\" height=\"138\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"24.0,113.8 46.4,24.0 181.1,24.0 226.0,113.8\"/><line x1=\"24.0\" y1=\"113.8\" x2=\"181.1\" y2=\"24.0\"/><line x1=\"46.4\" y1=\"24.0\" x2=\"226.0\" y2=\"113.8\"/></g><text x=\"13.1\" y=\"118.9\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">A</text><text x=\"36.2\" y=\"17.7\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">B</text><text x=\"190.8\" y=\"16.9\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">C</text><text x=\"237.1\" y=\"118.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">D</text><text x=\"116.8\" y=\"48.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">O</text><text x=\"115.3\" y=\"36.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"12\" fill=\"currentColor\">4</text><text x=\"122.8\" y=\"95.8\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"12\" fill=\"currentColor\">9</text></svg><p>Диагонали AC и BD трапеции ABCD с основаниями AD и BC пересекаются в точке O. Площади треугольников BOC и AOD равны 4 и 9. Найдите площадь трапеции.</p>", "steps": [{"t": "c", "q": "Какие два треугольника подобны и почему?", "o": ["BOC и DOA: углы при BC ∥ AD равны (накрест лежащие), углы при O вертикальные", "AOB и COD: они равновелики, значит подобны", "ABD и ACD: у них общее основание", "Подобных треугольников нет"], "a": 0, "h": "Ищите пару треугольников, у которых стороны BC и AD лежат на параллельных прямых.", "r": "BOC и DOA подобны по двум углам (BC ∥ AD, вертикальные углы при O)."}, {"t": "n", "q": "Площади подобных треугольников относятся как 4 : 9. Чему равно отношение AD : BC? Запишите десятичной дробью.", "a": 1.5, "h": "Площади относятся как k². k² = 9/4.", "r": "k² = 9/4, значит AD : BC = 3 : 2 = 1,5. Поэтому AO : OC = 3 : 2."}, {"t": "n", "q": "Найдите S(AOB): общая высота из B даёт S(AOB) = S(BOC) · AO / OC.", "a": 6, "h": "4 · 3/2.", "r": "S(AOB) = 4 · 3/2 = 6."}, {"t": "c", "q": "Чему равна S(COD) и почему?", "o": ["6: S(ABD) = S(ACD), вычитаем общий AOD", "4: как у BOC, они симметричны", "9: как у AOD", "Узнать нельзя"], "a": 0, "h": "У ABD и ACD общее основание AD и равные высоты.", "r": "S(ABD) = S(ACD). Вычитая S(AOD), получаем S(AOB) = S(COD) = 6."}, {"t": "n", "q": "Найдите площадь трапеции.", "a": 25, "h": "4 + 9 + 6 + 6.", "r": "S = 4 + 9 + 6 + 6 = 25. Ответ: 25."}]}, {"title": "Задача 2. Диагональ ⟂ боковой стороне", "cond": "<svg class=\"fig\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"24.0,126.0 100.5,24.0 160.0,24.0 236.5,126.0\"/><line x1=\"24.0\" y1=\"126.0\" x2=\"160.0\" y2=\"24.0\"/><line x1=\"160.0\" y1=\"24.0\" x2=\"160.0\" y2=\"126.0\" stroke-dasharray=\"5 4\" stroke-width=\"1.3\"/><polyline points=\"152.8,29.4 158.2,36.6 165.4,31.2\" stroke-width=\"1.1\"/><polyline points=\"160.0,117.0 169.0,117.0 169.0,126.0\" stroke-width=\"1.1\"/></g><text x=\"13.2\" y=\"131.2\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">A</text><text x=\"94.5\" y=\"13.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">B</text><text x=\"166.0\" y=\"13.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">C</text><text x=\"247.3\" y=\"131.2\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">D</text><text x=\"166.0\" y=\"136.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">H</text><text x=\"130.2\" y=\"16.3\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"12\" fill=\"currentColor\">7</text><text x=\"130.2\" y=\"133.7\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"12\" fill=\"currentColor\">25</text></svg><p>В равнобедренной трапеции основания равны 7 и 25, а диагональ перпендикулярна боковой стороне. Найдите площадь трапеции.</p>", "steps": [{"t": "c", "q": "Что построим первым делом?", "o": ["Высоту CH на большее основание", "Среднюю линию", "Вторую диагональ", "Окружность"], "a": 0, "h": "Нужна высота, её удобно опустить из вершины C: там прямой угол ACD.", "r": "Проведём высоту CH ⟂ AD."}, {"t": "n", "q": "Найдите HD = (AD − BC) / 2.", "a": 9, "h": "(25 − 7) / 2.", "r": "Из равнобедренности HD = (25 − 7)/2 = 9, а AH = (25 + 7)/2 = 16."}, {"t": "c", "q": "Какое соотношение применим в прямоугольном треугольнике ACD (∠C = 90°) с высотой CH?", "o": ["CD² = HD · AD", "CD = HD + AD", "CH = AD / 2", "CD² = AD² + AC²"], "a": 0, "h": "Катет в квадрате равен гипотенузе на проекцию этого катета.", "r": "CD² = HD · AD (квадрат катета равен произведению гипотенузы и проекции катета на гипотенузу)."}, {"t": "n", "q": "Найдите CD.", "a": 15, "h": "CD² = 9 · 25 = 225.", "r": "CD = √225 = 15."}, {"t": "n", "q": "Найдите высоту CH из треугольника CHD.", "a": 12, "h": "√(15² − 9²) = √144.", "r": "CH = √(225 − 81) = 12."}, {"t": "n", "q": "Найдите площадь трапеции.", "a": 192, "h": "(25 + 7)/2 · 12.", "r": "S = 16 · 12 = 192. Ответ: 192."}]}, {"title": "Задача 3. Боковые стороны 13 и 15", "cond": "<svg class=\"fig\" viewBox=\"0 0 260 150\" width=\"260\" height=\"150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><polygon points=\"24.0,126.0 66.5,24.0 160.0,24.0 236.5,126.0\"/><line x1=\"160.0\" y1=\"24.0\" x2=\"117.5\" y2=\"126.0\" stroke-dasharray=\"5 4\" stroke-width=\"1.3\"/><line x1=\"160.0\" y1=\"24.0\" x2=\"160.0\" y2=\"126.0\" stroke-dasharray=\"5 4\" stroke-width=\"1.3\"/><polyline points=\"160.0,117.0 169.0,117.0 169.0,126.0\" stroke-width=\"1.1\"/></g><text x=\"13.4\" y=\"131.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">A</text><text x=\"57.7\" y=\"15.9\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">B</text><text x=\"167.2\" y=\"14.4\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">C</text><text x=\"247.5\" y=\"130.9\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">D</text><text x=\"116.5\" y=\"138.0\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial,sans-serif\" font-size=\"13\" fill=\"currentColor\">E</text><text x=\"1 let cur=0,st=0,prog=T.map(()=>0);
const tabs=document.getElementById('tabs'),box=document.getElementById('box'),pb=document.getElementById('pb');
function norm(s){return parseFloat(String(s).replace(',','.').replace(/\s/g,''))}
function renderTabs(){tabs.innerHTML='';T.forEach((t,k)=>{const b=document.createElement('button');b.textContent='Задача '+(k+1)+(prog[k]===t.steps.length?' (готово)':'');if(k===cur)b.className='on';b.onclick=()=>{cur=k;st=prog[k]>=t.steps.length?0:prog[k];render()};tabs.appendChild(b)})}
function render(){
  renderTabs();
  const t=T[cur];pb.style.width=(prog[cur]/t.steps.length*100)+'%';
  let h='<div class="card"><span class="tag">'+t.title+'</span><div class="cond">'+t.cond+'</div>';
  for(let k=0;k<prog[cur]&&k<t.steps.length;k++){h+='<div class="done">'+t.steps[k].r+'</div>'}
  if(prog[cur]<t.steps.length){
    const s=t.steps[prog[cur]];
    h+='<p class="q" style="margin-top:16px">Шаг '+(prog[cur]+1)+' из '+t.steps.length+'. '+s.q+'</p><div id="in"></div><div id="fb"></div>';
  }else{
    h+='<p style="margin-top:14px">Задача разобрана. '+(cur<T.length-1?'<button class="btn" onclick="cur++;st=0;render()">Следующая задача</button>':'Это была последняя. Хороший трудный набор: теперь попробуйте решить любую из них с чистого листа.')+'</p>';
  }
  box.innerHTML=h+'</div>';
  if(prog[cur]<t.steps.length)drawStep(t.steps[prog[cur]]);
}
function drawStep(s){
  const el=document.getElementById('in');
  if(s.t==='c'){
    s.o.map((v,k)=>[v,k]).sort(()=>Math.random()-.5).forEach(([v,k])=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>check(k===s.a,b);el.appendChild(b)});
  }else{
    el.innerHTML='<input class="num" id="num" inputmode="decimal" placeholder="Ответ"> <button class="btn" id="go">Проверить</button>';
    const f=()=>check(Math.abs(norm(document.getElementById('num').value)-s.a)<1e-9,null);
    document.getElementById('go').onclick=f;document.getElementById('num').onkeydown=e=>{if(e.key==='Enter')f()};
  }
}
let tries=0;
function check(ok,btn){
  const s=T[cur].steps[prog[cur]],fb=document.getElementById('fb');
  if(ok){
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(btn)btn.classList.add('ok');
    const inp=document.getElementById('num');if(inp)inp.disabled=true;const go=document.getElementById('go');if(go)go.disabled=true;
    fb.innerHTML='<div class="exp">Верно. '+s.r+'</div><button class="btn" onclick="prog[cur]++;tries=0;render()">Дальше</button>';
  }else{
    tries++;if(btn){btn.classList.add('bad');btn.disabled=true}
    fb.innerHTML='<div class="hint">Не то. Подсказка: '+s.h+'</div>'+(tries>=3?'<button class="btn ghost" onclick="reveal()">Показать ответ</button>':'');
  }
}
function reveal(){const s=T[cur].steps[prog[cur]];document.getElementById('fb').innerHTML='<div class="exp">'+s.r+'</div><button class="btn" onclick="prog[cur]++;tries=0;render()">Дальше</button>'}
render();
</script></body></html>
