</style><style id="skill-template-style">
:root{--bg:#16231a;--card:#16231a;--line:rgba(238,224,200,.14);--fg:#EEE0C8;--muted:#C9AB82;--cobalt:#2F5BB5;--apricot:#DD7A3A;--mint:#C9AB82;--amber:#E2B04A;--miss:#DD7A3A;--sky:#B6CBE3;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 64px}
.top{display:grid;gap:10px;margin-bottom:16px}
.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lockup{display:inline-flex;align-items:center;gap:8px}.lw{font-weight:700;font-size:14px;letter-spacing:-.01em}.lw i{font-style:normal;color:var(--apricot)}
.sp{flex:1}.pill{padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.pill strong{color:var(--fg)}
.track{display:grid;gap:4px}.track span{height:6px;border-radius:3px;background:rgba(238,224,200,.12)}
.track .cur{background:rgba(238,224,200,.5)}.track .ok{background:var(--mint)}.track .bad{background:var(--miss)}.track .idk{background:#2B3D2B}.track .th{background:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
@media(max-width:520px){.card{padding:18px 16px;border-radius:18px}}
.lvlsep{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lvlsep i{flex:1;height:2px;border-radius:1px;background:var(--line)}.l1 span{color:var(--mint)}.l2 span{color:var(--sky)}.l3 span{color:var(--apricot)}
.thead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.num{font-size:40px;font-weight:800;line-height:1;color:var(--amber);min-width:52px;font-variant-numeric:tabular-nums}
.part{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.topic{font-weight:600}
.stmt{font-size:18px;line-height:1.65}.stmt p{margin:0 0 10px}.stmt p:last-child{margin:0}
@media(max-width:520px){.stmt{font-size:16.5px}}
.m{white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.9em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.theory{margin:0 0 16px;padding:14px 16px;border-radius:16px;background:rgba(47,91,181,.16);border:1px solid rgba(182,203,227,.35);display:grid;gap:8px}
.theory small{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}.theory b{font-size:16px}.theory p{margin:0;font-size:15px;color:#EEE0C8}
.formula{padding:10px 14px;border:2px solid var(--apricot);border-radius:12px;text-align:center;font-size:18px;background:rgba(0,0,0,.2);overflow-x:auto}
.ans{margin-top:20px;display:grid;gap:12px}
.irow{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 200px;min-width:0;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:19px}
.field:focus{outline:none;border-color:var(--apricot)}
.btn{height:52px;padding:0 24px;border-radius:14px;border:0;font-weight:650;background:var(--cobalt);color:var(--fg)}
.btn:disabled{opacity:.4}.btn.ghost{background:transparent;border:1px solid var(--line)}
.alts{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14.5px;color:var(--muted)}
.chip:hover{color:var(--fg)}.chip.link{text-decoration:none;display:inline-block}
.hint{padding:12px 15px;border-radius:14px;background:rgba(226,176,74,.08);border:1px solid rgba(226,176,74,.28);font-size:15.5px}
.hint small,.sol small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:3px}
.hints{display:grid;gap:8px}
textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);line-height:1.5}
.fb{padding:12px 16px;border-radius:14px;font-weight:600}
.fb.ok{background:rgba(201,171,130,.12);border:1px solid rgba(201,171,130,.4)}
.fb.bad{background:rgba(221,122,58,.1);border:1px solid rgba(221,122,58,.35)}
.fb.neu{background:rgba(238,224,200,.06);border:1px solid var(--line)}
.fb span{display:block;font-weight:400;font-size:14.5px;color:var(--muted)}
.sol{padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.sol ol{margin:6px 0;padding-left:22px;display:grid;gap:6px;font-size:15.5px}.sol p{margin:0}
.next{justify-self:end}
.note{font-size:13.5px;color:var(--muted);margin:0}
h1{font-size:clamp(30px,7vw,48px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
h1 span{color:var(--apricot)}
.kick{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.lead{margin:0 0 18px;color:#EEE0C8;max-width:58ch}
.big{font-size:clamp(60px,15vw,96px);font-weight:800;line-height:1;color:var(--amber)}
.rhead{text-align:center;display:grid;gap:6px;padding-block:6px 4px}
.quiet{color:var(--muted);font-size:14.5px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:16px}
.cell{height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.cell.ok{background:rgba(201,171,130,.16);border-color:rgba(201,171,130,.45);color:var(--mint)}
.cell.bad{background:rgba(221,122,58,.1);border-color:rgba(221,122,58,.35);color:var(--miss)}
.cell.th{background:rgba(226,176,74,.1);border-color:rgba(226,176,74,.35);color:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.blk{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);display:grid;gap:6px}
.blk .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}.blk .h b{color:var(--fg)}
.bar{height:6px;border-radius:3px;background:rgba(238,224,200,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.weak{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(221,122,58,.1);border:1px solid rgba(221,122,58,.35)}
.weak ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}.weak p{margin:4px 0 0}
.send{margin-top:18px;display:grid;gap:10px;justify-items:center}.send .btn{width:100%}
</style><style>
