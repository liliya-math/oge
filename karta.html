<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Карта · lili.math</title>
<style>
:root{--bg:#16231a;--glass:rgba(238,224,200,.05);--line:rgba(238,224,200,.13);--fg:#EEE0C8;--muted:#C9AB82;--faint:#C9AB82;--apricot:#DD7A3A;--mint:#C9AB82;--amber:#E2B04A;--cobalt:#2F5BB5;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}
.wrap:has(.mywrap){max-width:none;padding-left:28px;padding-right:28px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:700;font-size:13px;color:var(--muted)}.brand b{color:var(--apricot)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;font-size:13px}
.crumbs a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.crumbs a:hover{color:var(--fg)}.crumbs span{color:var(--faint);align-self:center}
h1{margin:4px 0 6px;font-size:clamp(24px,6vw,34px);line-height:1.15;letter-spacing:-.02em}
.id{font:600 13px var(--mono);color:var(--faint)}
.lead{margin:0 0 4px;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{margin-top:14px;padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--glass)}
.card h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.tile{display:block;padding:16px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--fg);text-decoration:none}
.tile:hover,.tile:focus-visible{background:rgba(238,224,200,.1);outline:none}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}.tile small{color:var(--muted);font-size:12.5px}
.list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(238,224,200,.05);color:var(--fg);text-decoration:none;font-size:15px;border:1px solid transparent}
.row:hover,.row:focus-visible{background:rgba(238,224,200,.1);border-color:var(--line);outline:none}
.row .n{font:600 12px var(--mono);color:var(--faint);min-width:56px}
.row .c{font-size:12.5px;color:var(--muted);white-space:nowrap}
.row .c.z{color:var(--apricot)}
.row .t{display:block;color:var(--faint);font-size:12.5px;margin-top:1px}
.m{grid-template-columns:minmax(0,1fr) auto}
.empty{margin:0;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0}.chip{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:rgba(47,91,181,.35);color:#B6CBE3}
.pre a{display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border-radius:10px;background:rgba(238,224,200,.08);color:var(--fg);text-decoration:none;font-size:13.5px}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:10px}
.lesson-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.lesson-grid button{aspect-ratio:auto;min-height:120px;font:inherit;text-align:left;cursor:pointer;overflow-wrap:normal;word-break:normal;hyphens:none}
.lesson-grid button[aria-pressed=true]{box-shadow:0 0 0 3px var(--apricot)}
.lesson-grid .tile{background:var(--c,#E2B04A);color:var(--ink,#16231A);border:0;font-weight:600}
.lesson-grid .tile:hover{filter:brightness(1.08)}
.mywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media(min-width:901px){.calwrap{position:sticky;top:10px;margin-top:0}}
@media(max-width:900px){.mywrap{grid-template-columns:1fr}}
.calwrap select{font:inherit;margin:0 0 10px}
.lesson-grid .tile.done{opacity:.55}
.lesson-grid .tile.next{box-shadow:0 0 0 3px var(--fg)}
.lesson-grid .tile{font-size:14.5px;line-height:1.3}
.rbtn{font:inherit;font-weight:600;color:#16231A;background:linear-gradient(115deg,#E2B04A,#DD7A3A);border:0;border-radius:10px;padding:7px 14px;cursor:pointer}
.lesson-grid .tile{position:relative}
.tdel{position:absolute;top:6px;right:8px;font-size:14px;cursor:pointer;background:#16231A;color:#EEE0C8;border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.skrow{display:flex;gap:8px;align-items:center;margin:4px 0}.skrow b{font:600 11px var(--mono);color:var(--faint)}.skrow span[data-sk-del]{cursor:pointer;opacity:.7}
.skres button{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:#16231a;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:3px 0;cursor:pointer}
.lesson-grid .cbadge{display:block;width:max-content;max-width:100%;margin-top:8px;padding:3px 9px;border-radius:999px;background:#16231A;color:#EEE0C8;font-size:12px;font-weight:600}
.lesson-grid .tile small{font-weight:400;color:inherit;opacity:.75}
.lesson-grid .mbadges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.lesson-grid .mbadges span{padding:2px 8px;border-radius:999px;background:#FFFFFF;color:#16231A;font-size:12px;font-weight:600;line-height:1.4}.lesson-grid .mbadges span:before{content:'✓ '}
.calwrap button[data-cw]{font:inherit;font-weight:600;color:#16231A;background:linear-gradient(115deg,#E2B04A,#DD7A3A);border:0;border-radius:10px;padding:7px 14px;cursor:pointer}
.lesson-form{display:grid;gap:12px;min-width:0}.lesson-form label{display:grid;gap:5px;min-width:0}.mywrap>*{min-width:0}
.lesson-form input,.lesson-form select,.lesson-form button{width:100%;min-width:0;box-sizing:border-box;text-overflow:ellipsis;font:inherit;color:var(--fg);background:#16231a;border:1px solid var(--line);border-radius:10px;padding:9px}
.lesson-form button{cursor:pointer}.lesson-form button:disabled{opacity:.5;cursor:default}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div class="wrap" id="app"><p class="lead">Открываю…</p></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://script.google.com/macros/s/AKfycbwg68-wqapNubGW4BuTEB_ri38yu41uV8hoQPOhluE84y4ZSRfZ9-sFl--uwv7T7AA_xA/exec';
let PASS='';try{PASS=localStorage.getItem('cab-admin')||''}catch(e){}
const getId=()=>decodeURIComponent(location.hash.slice(1)||'').toUpperCase().replace(/[^0-9A-Z.]/g,'');
const SUBJ={A:'Алгебра',G:'Геометрия'};
function fail(t,x){app.innerHTML=`<div class="bar"><span></span><span class="brand">lili<b>.</b>math</span></div><h1>${esc(t)}</h1><p class="lead">${esc(x)}</p>`}
async function admin(op,fields={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:PASS,op,...fields})});
  const result=await r.json();
  if(!result.ok)throw new Error(result.error||'request');
  return result;
}
function gate(){
  if(!PASS)return Promise.reject('deny');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:PASS,op:'ping'})})
   .then(r=>r.json(),()=>{throw 'net'}).then(j=>{if(!j||j.ok!==true)throw 'deny';routeEnabled=j.lessonRoute===1});
}
let READY=false,route,routeEnabled;
const ROUTE_FILES={'5A':'lesson-route-5.json','6A':'lesson-route-6.json','7A':'lesson-route-7a.json','7G':'lesson-route-7g.json','8A':'lesson-route-8a.json','8G':'lesson-route-8g.json','9A':'lesson-route-9a.json','9G':'lesson-route-9g.json','OGE':'lesson-route-oge.json'},ROUTES={};
let selectedLesson,myMode=null;
let selectedStudent='';
try{selectedStudent=sessionStorage.getItem('lili-route-student')||''}catch(e){}
const segs=id=>id.split('.');
function label(id){
  const m=/^(\d)([AG])$/.exec(id);if(m)return m[1]+' класс · '+SUBJ[m[2]];
  return id;
}
function crumbs(id){
  return `<div class="crumbs"><a href="#">Карта</a>${id?`<span>›</span><a href="#${id}">${esc(label(id))}</a>`:''}</div>`;
}
function home(){
  const tiles=[];
  for(let g=5;g<=9;g++)['A','G'].forEach(s=>{const id=g+s;tiles.push(`<a class="tile" href="#${id}"><b>${g} ${s==='A'?'алгебра':'геом.'}</b></a>`)});
  app.innerHTML=`<div class="bar"><span class="id">Карта · только для учителя</span><span class="brand">lili<b>.</b>math</span></div><h1>Карта материалов</h1><p class="lead">Выбери класс.</p><div class="grid">${tiles.join('')}<a class="tile" href="#OGE"><b>ОГЭ, часть 1</b><small>задания 1-19</small></a></div>`;
}
let editMode=false;
function routeCard(){
  const canEdit=!!(route&&route.key&&!myMode);
  return '<section class="card" id="route-section"><h2>Занятия по программе</h2><p class="lead">Открой квадратик, чтобы прикрепить материалы или отметить занятие.</p>'
    +(canEdit?`<p><button type="button" data-edit-toggle class="rbtn">${editMode?'Готово':'Редактировать порядок, добавить, удалить'}</button></p>${editMode?'<p class="lead">Перетащи квадратик на другой квадратик, чтобы поставить перед ним. Перетащи на заголовок главы, чтобы перенести в её конец. Изменения сохраняются сразу.</p>':''}`:'')
    +route.chapters.map((name,i)=>`<h3 data-chapter="${i+1}">${esc(name)}</h3>${editMode?`<p><button type="button" class="rbtn" data-add="${i+1}">+ Новый квадратик</button></p>`:''}<div class="grid lesson-grid" data-grid="${i+1}">${route.lessons.filter(x=>x.chapter===i+1).map(x=>`<button class="tile${/^✓/.test(x.mark||'')?' done':/^→/.test(x.mark||'')?' next':''}" style="--c:${x.col||'#E2B04A'};--ink:${INK[x.col]||'#16231A'}" type="button" ${myMode?'draggable="true" ':''}data-lesson="${x.id}" aria-controls="route-detail" aria-pressed="false"><small>${tileLabel(x)}</small><br>${x.mark||''}${esc(tileTitle(x))}${matBadge(x)}${calBadge(x)}${editMode?`<span class="tdel" data-del="${x.id}" title="Удалить квадратик">✕</span>`:''}</button>`).join('')}</div>`).join('')
    +'<div id="route-detail" hidden></div></section>';
}
function bindRoute(){
  app.querySelectorAll('[data-lesson]').forEach(b=>{
    b.onclick=e=>{if(e.target.closest('[data-del]'))return;selectLesson(b.dataset.lesson)};
    const id=b.dataset.lesson;
    if(editMode){
      b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','r:'+id);
      b.ondragover=e=>e.preventDefault();
      b.ondrop=e=>{e.preventDefault();e.stopPropagation();const t=e.dataTransfer.getData('text/plain');if(/^r:/.test(t))moveLesson(t.slice(2),id)};
    }else if(myMode){b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','t:'+id)}
  });
  app.querySelectorAll('[data-del]').forEach(x=>x.onclick=e=>{e.stopPropagation();delLesson(x.dataset.del)});
  app.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>addLesson(Number(x.dataset.add)));
  app.querySelectorAll('h3[data-chapter]').forEach(h=>{h.ondragover=e=>{if(editMode)e.preventDefault()};h.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(editMode&&/^r:/.test(t))moveLesson(t.slice(2),null,Number(h.dataset.chapter))}});
  const tg=app.querySelector('[data-edit-toggle]');if(tg)tg.onclick=()=>{editMode=!editMode;rerenderRoute()};
}
function rerenderRoute(){
  const sec=document.getElementById('route-section');if(!sec)return;
  sec.outerHTML=routeCard();bindRoute();selectedLesson=null;
}
let layoutTimer=null;
function saveLayout(){
  clearTimeout(layoutTimer);
  layoutTimer=setTimeout(async()=>{
    const added={};route.lessons.forEach(x=>{if(x.added)added[x.id]={title:x.title,school:x.school||'',ch:x.chapter}});
    try{const r=await admin('routeLayoutSave',{prog:route.key,layout:{lessons:route.lessons.map(x=>({id:x.id,ch:x.chapter})),added}});if(r&&r.error)throw new Error(r.error)}
    catch(e){alert('Не получилось сохранить порядок квадратиков (ответ сервера: '+(e&&e.message||e)+'). Обычно это значит, что в Apps Script не последняя версия: вставь файл целиком и сделай «Новая версия».')}
  },300);
}
function moveLesson(id,beforeId,ch){
  const a=route.lessons.findIndex(x=>x.id===id);if(a<0||id===beforeId)return;
  const l=route.lessons.splice(a,1)[0];
  if(beforeId){const b=route.lessons.findIndex(x=>x.id===beforeId);l.chapter=route.lessons[b].chapter;route.lessons.splice(b,0,l)}
  else{l.chapter=ch;let last=-1;route.lessons.forEach((x,i)=>{if(x.chapter<=ch)last=i});route.lessons.splice(last+1,0,l)}
  rerenderRoute();saveLayout();
}
function delLesson(id){
  const l=route.lessons.find(x=>x.id===id);if(!l)return;
  if(!confirm('Удалить квадратик «'+l.title+'»? Занятия, уже поставленные в календарь или отмеченные, останутся в истории.'))return;
  route.lessons.splice(route.lessons.indexOf(l),1);rerenderRoute();saveLayout();
}
function addLesson(ch){
  const k=route.key,used=new Set();Object.values(ROUTES).forEach(r=>r.lessons.forEach(x=>used.add(x.id)));
  let id='';for(let n=1;n<100&&!id;n++){const c=k==='OGE'?'OGE-90-'+n:k+'-'+(900+n);if(!used.has(c))id=c}
  if(!id){alert('Слишком много новых квадратиков.');return}
  const l={id,chapter:ch,school:'',title:'Новый квадратик',prog:k,col:PROGCOL[k]||'#E2B04A',added:true};
  let last=-1;route.lessons.forEach((x,i)=>{if(x.chapter<=ch)last=i});route.lessons.splice(last+1,0,l);
  rerenderRoute();saveLayout();selectLesson(id);
}
async function selectLesson(id){
  const lesson=route.lessons.find(x=>x.id===id);
  const panel=document.getElementById('route-detail');
  selectedLesson=id;
  app.querySelector('[data-lesson="'+id+'"]').parentElement.after(panel);
  app.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lesson===id)));
  panel.hidden=false;
  panel.innerHTML=`<h2 tabindex="-1">${esc(lesson.title)}</h2>`
    +(lesson.extra?`<p>${esc(lesson.extra)}</p>`:'');
  panel.querySelector('h2').focus();
  if(!routeEnabled){
    panel.insertAdjacentHTML('beforeend','<p class="empty">Выдача материалов станет доступна после обновления развёртывания скрипта кабинета.</p>');
    return;
  }
  panel.insertAdjacentHTML('beforeend','<p class="lead" role="status">Загружаю материалы и список учеников…</p>');
  const pending=panel.lastElementChild;
  try{
    const [config, roster, qlist]=await Promise.all([admin('routeGet',{id}),admin('list'),admin('quizList').catch(()=>({works:[]}))]);
    const works=(qlist&&qlist.works)||[];let qz=[...(config.materials.quizzes||[])];
    if(!panel.isConnected||selectedLesson!==id||!pending.isConnected)return;
    pending.remove();
    panel.insertAdjacentHTML('beforeend',`<div class="lesson-form">
      <label>Название квадратика <input type="text" data-edit="title" maxlength="200" value="${esc(lesson.title)}"></label><label>Школьные уроки (номера) <input type="text" data-edit="school" maxlength="200" value="${esc(lesson.school||'')}"></label>
      ${['theory','homework'].map((key,i)=>`<label>${i?'Домашняя работа':'Теория'} <input type="url" data-link="${key}" value="${esc(config.materials[key])}" placeholder="https://…"></label><label>Загрузить PDF до 8 МБ<input type="file" accept=".pdf,application/pdf" data-pdf="${key}"></label>`).join('')}
      <div data-quizzes></div>
      <button type="button" data-save>Сохранить квадратик</button>
      <label>Ученик<select data-student><option value="">Выбрать ученика</option>${roster.students.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.code)}">${esc([s.name,s.fname].filter(Boolean).join(' '))}</option>`).join('')}</select></label>
      <button type="button" data-assign>Провели сегодня</button>
      <p class="lead" role="status"></p></div>`);
    const form=panel.querySelector('.lesson-form');
    const oldList=panel.querySelector('h2 + ul');if(oldList)oldList.remove();
    const status=form.querySelector('[role=status]');
    const student=form.querySelector('[data-student]');
    if([...student.options].some(o=>o.value===selectedStudent))student.value=selectedStudent;
    student.onchange=()=>{selectedStudent=student.value;try{sessionStorage.setItem('lili-route-student',selectedStudent)}catch(e){}if(!myMode||getId()!=='MY'){if(window.calUse)window.calUse(selectedStudent)}};
    const qBox=form.querySelector('[data-quizzes]');
    const grp=[['hw','Домашние задания',w=>w.kind!=='self'&&w.kind!=='exam'],['self','Самостоятельные и контрольные',w=>w.kind==='self'||w.kind==='exam']];
    const kindTag=w=>({self:'самостоятельная',exam:'контрольная',hw:'ДЗ'}[w.kind]||'без типа');
    const renderQz=()=>{
      qBox.innerHTML=grp.map(([g,name,test])=>{const mine=qz.filter(q=>{const w=works.find(x=>x.id===q);return w?test(w):g==='hw'}),free=works.filter(w=>test(w)&&!qz.includes(w.id));
        return `<div class="qz-group" data-g="${g}"><b>${name}</b>`+(mine.length?mine.map(q=>{const w=works.find(x=>x.id===q);return `<div class="skrow"><b>${esc(w?w.title:q)}</b> ${w?esc(kindTag(w)+(w.section?' · '+w.section:'')):'(работа не найдена)'} <span data-qz-del="${esc(q)}">✕</span></div>`}).join(''):'<p class="lead">Пока ничего не добавлено.</p>')
        +(free.length?`<select data-qz-add="${g}"><option value="">Добавить…</option>${free.map(w=>`<option value="${esc(w.id)}">${esc(w.title)}${w.section?' · '+esc(w.section):''}</option>`).join('')}</select>`:'<p class="lead">Других работ этого вида нет.</p>')+'</div>'}).join('');
      qBox.querySelectorAll('[data-qz-del]').forEach(x=>x.onclick=()=>{qz=qz.filter(z=>z!==x.dataset.qzDel);renderQz()});
      qBox.querySelectorAll('[data-qz-add]').forEach(sel=>sel.onchange=()=>{if(sel.value&&qz.length<10){qz.push(sel.value);renderQz()}})};
    renderQz();
    const links=()=>({...Object.fromEntries([...form.querySelectorAll('[data-link]')].map(e=>[e.dataset.link,e.value.trim()])),quizzes:[...qz]});
    let saved=JSON.stringify(links());
    const run=async action=>{
      const controls=[...form.querySelectorAll('input,button,select')];
      controls.forEach(e=>e.disabled=true);
      status.textContent='Сохраняю…';
      try{status.textContent=await action()}
      catch(e){status.textContent=e.message==='bad_value'?'Проверь формат ссылки или PDF и название.':'Не получилось сохранить (ответ сервера: '+(e&&e.message||e)+'). Попробуй ещё раз.'}
      finally{controls.forEach(e=>e.disabled=false)}
    };
    form.querySelectorAll('[data-pdf]').forEach(input=>input.onchange=()=>{
      const file=input.files[0];
      if(!file)return;
      input.value='';
      if(file.size>8*1024*1024){status.textContent='PDF должен быть не больше 8 МБ.';return}
      run(async()=>{
        const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
        const result=await admin('routeUpload',{name:file.name,data});
        form.querySelector(`[data-link="${input.dataset.pdf}"]`).value=result.url;
        return 'PDF загружен. Нажми «Сохранить материалы занятия».';
      });
    });
    form.querySelector('[data-save]').onclick=()=>run(async()=>{
      const ed=Object.fromEntries([...form.querySelectorAll('[data-edit]')].map(e=>[e.dataset.edit,e.value.trim()]));
      if(!ed.title){return 'Название не может быть пустым.'}
      const result=await admin('routeSave',{id,...links(),...ed});if(result&&result.error)throw new Error(result.error);
      saved=JSON.stringify(links());{const L=links();lesson.has={t:L.theory?1:0,h:L.homework?1:0,q:L.quizzes.length}}lesson.title=ed.title;lesson.school=ed.school;refreshTile(lesson);if(lesson.added&&route.key)saveLayout();const h2=panel.querySelector('h2');if(h2)h2.textContent=lesson.title;

const INK={'#2B3D2B':'#EEE0C8','#2F5BB5':'#EEE0C8','#2F5BB5':'#EEE0C8','#2B3D2B':'#EEE0C8'};
const PROGCOL={'5':'#E2B04A','6':'#DD7A3A','7A':'#2B3D2B','7G':'#C9AB82','8A':'#B6CBE3','8G':'#2F5BB5','9A':'#EEE0C8','9G':'#2F5BB5',OGE:'#2B3D2B'};
const PCOL={'5':'#E2B04A','6':'#DD7A3A','7A':'#B6CBE3','7G':'#B6CBE3','8A':'#C9AB82','8G':'#2B3D2B','9A':'#2F5BB5','9G':'#DD7A3A',OGE:'#EEE0C8'};
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shortD=iso=>iso.slice(8,10)+'.'+iso.slice(5,7);
let calWeek=0;
function calSet(id,d){
  const m=myMode,l=m.lessons.find(x=>x.id===id);if(!l)return;
  const prev=l.cal;l.cal=d||undefined;m.st.cal=m.st.cal.filter(y=>y.id!==id);if(d)m.st.cal.push({d,id,title:l.title});
  renderCal();refreshTile(l);
  admin('calSet',{t:m.code,id,d:d||'',title:l.title}).catch(e=>{l.cal=prev;m.st.cal=m.st.cal.filter(y=>y.id!==id);if(prev)m.st.cal.push({d:prev,id,title:l.title});renderCal();refreshTile(l);alert('Не получилось сохранить в календаре. (ответ сервера: '+(e&&e.message||e)+').')});
}
function matBadge(l){const h=l.has||{};const a=[];if(h.t)a.push('Теория');if(h.h)a.push('ДЗ');if(h.q)a.push('Тесты'+(h.q>1?' '+h.q:''));return a.length?'<span class="mbadges">'+a.map(x=>'<span>'+x+'</span>').join('')+'</span>':''}
function calBadge(l){if(!l.cal)return '';const d=new Date(l.cal+'T00:00:00');return '<span class="cbadge">в календаре · '+WD[d.getDay()]+' '+esc(shortD(l.cal))+'</span>'}
const NUMRE=/^\s*(§\s*\d+(?:\.\d+)*|\d+(?:\.\d+)+)\.?\s+(.*)$/;
function tileLabel(x){if(x.tag)return esc(x.tag);if(x.school)return 'Школьные № '+esc(x.school);const o=/^OGE-(\d+)-(\d+)$/.exec(x.id||'');if(o&&o[1]!=='90'){const n=+o[1],k=(route&&route.lessons||[]).filter(y=>String(y.id).indexOf('OGE-'+o[1]+'-')===0).length;return 'Задание '+n+(k>1?' · п. '+(+o[2]):'')}const m=NUMRE.exec(x.title||'');if(m)return esc(m[1].replace(/^§\s*/,'').split('.').map((v,i)=>['§ ','п. ','пп. '][i]+v).join(' · '));return 'Дополнительно'}
function tileTitle(x){if(x.tag||x.school)return x.title;const m=NUMRE.exec(x.title||'');return m?m[2]:x.title}
function refreshTile(l){const b=app.querySelector('[data-lesson="'+l.id+'"]');if(b){b.classList.toggle('done',/^✓/.test(l.mark||''));b.classList.toggle('next',/^→/.test(l.mark||''))}if(b)b.innerHTML='<small>'+tileLabel(l)+'</small><br>'+(l.mark||'')+esc(tileTitle(l))+matBadge(l)+calBadge(l)+(editMode?'<span class="tdel" data-del="'+l.id+'" title="Удалить квадратик">✕</span>':'');const x=b&&b.querySelector('[data-del]');if(x)x.onclick=e=>{e.stopPropagation();delLesson(l.id)}}
function renderCal(){
  const box=document.getElementById('cal');if(!box||!myMode)return;
  const days=(String(myMode.st.days||'').split('|')[0].toLowerCase().match(/пн|вт|ср|чт|пт|сб|вс/g)||[]);
  const lessonWd=new Set(days.map(x=>WD.map(w=>w.toLowerCase()).indexOf(x)));
  const now=new Date();now.setHours(0,0,0,0);const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)+calWeek*7);
  let h='<h2>Календарь</h2><p class="lead">Перетащи квадратик на день (дни занятий ученика закрашены оранжево-жёлтым). Или открой квадратик и нажми на день. Занятие можно перетащить на другой день, ✕ убирает из календаря.</p><div style="display:flex;gap:8px;margin-bottom:10px"><button type="button" data-cw="-1">←</button><button type="button" data-cw="0">Сегодня</button><button type="button" data-cw="1">→</button></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">';
  for(let w=0;w<4;w++)for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+w*7+i);const iso=isoD(d),on=lessonWd.has(d.getDay()),today=iso===isoD(now);
    const chips=myMode.st.cal.filter(y=>y.d===iso).map(y=>{const l=myMode.lessons.find(x=>x.id===y.id);const done=l&&/^✓/.test(l.mark||'');return `<div draggable="true" data-chip="${esc(y.id)}" style="font-size:11px;line-height:1.25;overflow-wrap:anywhere;padding:3px 4px;margin-top:3px;border-radius:6px;background:${(l&&l.col)||'#E2B04A'};color:${INK[l&&l.col]||'#16231A'};${done?'opacity:.6;':''};cursor:grab">${done?'✓ ':''}${esc(y.title)} <span data-x="${esc(y.id)}" style="cursor:pointer;opacity:.7">✕</span></div>`}).join('');
    h+=`<div data-day="${iso}" style="min-height:74px;min-width:0;overflow:hidden;padding:4px;border-radius:8px;border:${on?'0':'1px'} solid ${today?'#E2B04A':'rgba(238,224,200,.28)'};background:${on?'linear-gradient(115deg,#E2B04A,#DD7A3A)':'transparent'};color:${on?'#16231A':'inherit'}"><b style="font-size:11px;white-space:nowrap;display:block">${WD[d.getDay()]} ${shortD(iso)}</b>${chips}</div>`;
  }
  box.innerHTML=h+'</div>';
  box.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{calWeek=b.dataset.cw==='0'?0:calWeek+Number(b.dataset.cw);renderCal()});
  box.querySelectorAll('[data-day]').forEach(c=>{
    c.ondragover=e=>e.preventDefault();
    c.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(/^[tc]:/.test(t))calSet(t.slice(2),c.dataset.day)};
    c.onclick=e=>{if(e.target.closest('[data-chip]'))return;if(selectedLesson)calSet(selectedLesson,c.dataset.day)};
  });
  box.querySelectorAll('[data-chip]').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain','c:'+c.dataset.chip));
  box.querySelectorAll('[data-x]').forEach(x=>x.onclick=e=>{e.stopPropagation();calSet(x.dataset.x,'')});
}
async function initClassCal(){
  const sel=document.getElementById('cal-student');if(!sel)return;
  let roster=[];try{roster=(await admin('list')).students||[]}catch(e){}
  if(!document.getElementById('cal-student'))return;
  roster=roster.filter(x=>x.active!==false);
  sel.innerHTML='<option value="">Выбрать ученика</option>'+roster.map(x=>`<option value="${esc(x.code)}">${esc([x.name,x.fname].filter(Boolean).join(' '))}</option>`).join('');
  const all=Object.values(ROUTES).flatMap(x=>x.lessons);
  const use=code=>{
    selectedStudent=code;try{sessionStorage.setItem('lili-route-student',code)}catch(e){}
    const st=roster.find(x=>x.code===code);
    if(!st){myMode=null;document.getElementById('cal').innerHTML='<p class="lead">Выбери ученика, и появится его календарь.</p>';route.lessons.forEach(x=>{x.cal=undefined;x.mark='';refreshTile(x)});app.querySelectorAll('[data-lesson]').forEach(b=>{b.draggable=false});return}
    st.cal=st.cal||[];const done=new Set(st.routeDone||[]);
    all.forEach(x=>{const c=st.cal.find(y=>y.id===x.id);x.cal=c?c.d:undefined;x.mark=done.has(x.id)?'✓ ':''});
    myMode={code,st,lessons:all};
    route.lessons.forEach(refreshTile);
    if(!editMode)app.querySelectorAll('[data-lesson]').forEach(b=>{b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','t:'+b.dataset.lesson)});
    renderCal();
  };
  sel.onchange=()=>use(sel.value);
  window.calUse=code=>{if(document.getElementById('cal-student')){sel.value=code;use(code)}};
  if(selectedStudent&&roster.some(x=>x.code===selectedStudent)){sel.value=selectedStudent;use(selectedStudent)}
}
async function myPage(){
  document.title='Квадратики ученика · lili.math';
  let code='';try{code=sessionStorage.getItem('lili-route-student')||''}catch(e){}
  app.innerHTML='<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><p class="lead" role="status">Загружаю программу ученика…</p>';
  let st=null;
  try{const j=await admin('list');st=(j.students||[]).find(x=>x.code===code)}catch(e){}
  if(!st){app.innerHTML+='<p class="empty">Не получилось найти ученика. Открой кабинет ученика и нажми «Открыть карту занятий».</p>';return}
  const progs=st.routes||[],done=new Set(st.routeDone||[]);
  const NAMES={'5':'5 класс','6':'6 класс','7A':'7 алгебра','7G':'7 геометрия','8A':'8 алгебра','8G':'8 геометрия','9A':'9 алгебра','9G':'9 геометрия',OGE:'ОГЭ, часть 1'};
  const nm=[st.name,st.fname].filter(Boolean).join(' ');
  if(!progs.length){app.innerHTML=`<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>${esc(nm)}</h1><p class="empty">Программа не выбрана. В кабинете ученика: настройки, «Программа по квадратикам».</p>`;return}
  const seq=k=>(ROUTES[k]?ROUTES[k].lessons:[]).map(x=>({...x,tag:NAMES[k]}));
  const A=progs.filter(k=>k!=='OGE'&&k.slice(-1)!=='G').flatMap(seq),G=progs.filter(k=>k.slice(-1)==='G').flatMap(seq),O=progs.includes('OGE')?seq('OGE'):[];
  const school=[];let ai=0,gi=0,n=0;const pat=['A','A','G'];
  while(ai<A.length||gi<G.length){let k=pat[n++%3];if(k==='A'&&ai>=A.length)k='G';if(k==='G'&&gi>=G.length)k='A';school.push(k==='A'?A[ai++]:G[gi++])}
  const chapters=[],lessons=[];
  const add=(name,list)=>{if(!list.length)return;chapters.push(name);let next=true;list.forEach((x,i)=>{const d=done.has(x.id);lessons.push({...x,chapter:chapters.length,mark:d?'✓ ':(next?'→ ':'')});if(!d)next=false})};
  add('Школьная программа по порядку (алгебра, алгебра, геометрия)',school);
  add('ОГЭ, часть 1',O);
  route={chapters,lessons};myMode={code,st,lessons};selectedStudent=code;st.cal=st.cal||[];lessons.forEach(x=>{const c=st.cal.find(y=>y.id===x.id);if(c)x.cal=c.d});
  app.innerHTML=`<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>${esc(nm)}</h1><p class="lead">Программы: ${progs.map(k=>NAMES[k]).join(', ')}. ✓ проведено, → следующее.</p>`+'<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><div id="cal"></div></section></div>';
  bindRoute();renderCal();scrollTo(0,0);
}
function node(id){
  if(id!=='MY')myMode=null;
  editMode=false;
  if(id==='MY'){myPage();return}
  if(id==='OGE'){document.title='ОГЭ, часть 1 · lili.math';route=ROUTES.OGE;app.innerHTML=`<div class="bar"><span class="id">ОГЭ</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>ОГЭ, часть 1</h1>`+(route?'<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><label class="lead">Ученик <select id="cal-student"><option value="">Выбрать ученика</option></select></label><div id="cal"><p class="lead">Выбери ученика, и появится его календарь.</p></div></section></div>':'<p class="lead">Не получилось загрузить программу ОГЭ.</p>');bindRoute();if(route)initClassCal();scrollTo(0,0);return}
  if(!/^\d[AG]$/.test(id)){fail('Не нашла такой раздел','Вернись на «Карта» и выбери класс.');return}
  const title=label(id);
  document.title=title+' · lili.math';
  let h=`<div class="bar"><span class="id">${esc(id)}</span><span class="brand">lili<b>.</b>math</span></div>${crumbs(id)}<h1>${esc(title)}</h1>`;
  route=ROUTES[id];if(route)h+='<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><label class="lead">Ученик <select id="cal-student"><option value="">Выбрать ученика</option></select></label><div id="cal"><p class="lead">Выбери ученика, и появится его календарь.</p></div></section></div>';
  app.innerHTML=h;
  bindRoute();
  if(route)initClassCal();
  scrollTo(0,0);
}
function draw(){const id=getId();if(!id)home();else node(id)}
function go(){
  Promise.all([Promise.all(Object.keys(ROUTE_FILES).map(k=>fetch(ROUTE_FILES[k],{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null))),admin('routeEdits').then(j=>j||{},()=>({}))])
  .then(([rs,edAll])=>{const ed=edAll.edits||{},lay=edAll.layouts||{};Object.keys(ROUTE_FILES).forEach((k,i)=>{if(rs[i]&&rs[i].lessons){rs[i].key=k;rs[i].lessons.forEach(l=>{l.prog=k;l.col=PROGCOL[k]||'#E2B04A'});
    const L=lay[k];if(L&&Array.isArray(L.lessons)){const by=Object.fromEntries(rs[i].lessons.map(x=>[x.id,x]));Object.keys(L.added||{}).forEach(id=>{const a=L.added[id];by[id]={id,chapter:a.ch,school:a.school||'',title:a.title,prog:k,col:PROGCOL[k]||'#E2B04A',added:true}});const seen=new Set(),ord=L.lessons.filter(x=>by[x.id]).map(x=>{const l=by[x.id];l.chapter=x.ch;seen.add(x.id);return l});rs[i].lessons=ord.concat(rs[i].lessons.filter(x=>!seen.has(x.id)))}
    const mats=edAll.mats||{};rs[i].lessons.forEach(l=>{if(mats[l.id])l.has=mats[l.id];const e=ed[l.id];if(e){if(e.title)l.title=e.title;if(e.school)l.school=e.school}});ROUTES[k]=rs[i]}});READY=true;draw()})
  .catch(()=>fail('Не получилось открыть','Похоже, пропал интернет. Обнови страницу.'));
}
addEventListener('hashchange',()=>{if(READY)draw()});
gate().then(go).catch(e=>{if(e==='net')fail('Нет связи','Не получилось проверить доступ. Проверь интернет и обнови страницу.');else fail('Страница только для учителя','Открой кабинет в режиме учителя на этом устройстве и войди с паролем, потом вернись сюда.')});
})();
