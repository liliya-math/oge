<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Карта · lili.math</title>
<style>
:root{--bg:#14211e;--glass:rgba(243,236,226,.05);--line:rgba(226,234,228,.13);--fg:#f3ece2;--muted:#a9b6ad;--faint:#6e7f77;--apricot:#f2905e;--mint:#a9d18e;--amber:#f5dc6a;--cobalt:#1747c9;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:700;font-size:13px;color:var(--muted)}.brand b{color:var(--apricot)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;font-size:13px}
.crumbs a{color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.crumbs a:hover{color:var(--fg)}.crumbs span{color:var(--faint);align-self:center}
h1{margin:4px 0 6px;font-size:clamp(24px,6vw,34px);line-height:1.15;letter-spacing:-.02em}
.id{font:600 13px var(--mono);color:var(--faint)}
.lead{margin:0 0 4px;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.card{margin-top:14px;padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--glass)}
.card h2{margin:0 0 10px;font-size:17px;letter-spacing:-.01em}
.tile{display:block;padding:16px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--fg);text-decoration:none}
.tile:hover,.tile:focus-visible{background:rgba(243,236,226,.1);outline:none}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}.tile small{color:var(--muted);font-size:12.5px}
.list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(243,236,226,.05);color:var(--fg);text-decoration:none;font-size:15px;border:1px solid transparent}
.row:hover,.row:focus-visible{background:rgba(243,236,226,.1);border-color:var(--line);outline:none}
.row .n{font:600 12px var(--mono);color:var(--faint);min-width:56px}
.row .c{font-size:12.5px;color:var(--muted);white-space:nowrap}
.row .c.z{color:var(--apricot)}
.row .t{display:block;color:var(--faint);font-size:12.5px;margin-top:1px}
.m{grid-template-columns:minmax(0,1fr) auto}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:650;background:rgba(243,236,226,.1);color:var(--muted);vertical-align:1px}
.tag.t{background:rgba(242,144,94,.18);color:var(--apricot)}.tag.h{background:rgba(245,220,106,.15);color:var(--amber)}
.kind{margin:14px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:650}
.kind:first-child{margin-top:0}
.empty{margin:0;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 0}.chip{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:rgba(23,71,201,.35);color:#d6e2ee}
.pre a{display:inline-block;margin:3px 6px 3px 0;padding:4px 10px;border-radius:10px;background:rgba(243,236,226,.08);color:var(--fg);text-decoration:none;font-size:13.5px}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:10px}
.lesson-grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
.lesson-grid button{aspect-ratio:1;font:inherit;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.lesson-grid button[aria-pressed=true]{border-color:var(--apricot)}
.lesson-grid .tile{background:color-mix(in srgb,var(--c,#a9d18e) 26%,#14211e);border:1px solid color-mix(in srgb,var(--c,#a9d18e) 50%,transparent);border-left:7px solid var(--c,#a9d18e);font-weight:600}
.lesson-grid .tile:hover{background:color-mix(in srgb,var(--c,#a9d18e) 38%,#14211e)}
.mywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(min-width:901px){.calwrap{position:sticky;top:10px;margin-top:0}}
@media(max-width:900px){.mywrap{grid-template-columns:1fr}}
.calwrap select{font:inherit;margin:0 0 10px}
.lesson-grid .tile.done{opacity:.62}
.lesson-grid .tile.next{box-shadow:0 0 0 2px var(--c,#a9d18e)}
.lesson-grid .tile small{font-weight:400;color:var(--fg);opacity:.8}
.lesson-form{display:grid;gap:12px}.lesson-form label{display:grid;gap:5px}
.lesson-form input,.lesson-form select,.lesson-form button{max-width:100%;font:inherit;color:var(--fg);background:#243831;border:1px solid var(--line);border-radius:10px;padding:9px}
.lesson-form button{cursor:pointer}.lesson-form button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lead">Открываю…</p></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://script.google.com/macros/s/AKfycbwg68-wqapNubGW4BuTEB_ri38yu41uV8hoQPOhluE84y4ZSRfZ9-sFl--uwv7T7AA_xA/exec';
let PASS='';try{PASS=localStorage.getItem('cab-admin')||''}catch(e){}
const KORDER=['Теория','Памятка','План урока','Разбор в диалоге','Разбор 5 задач','Пятиминутки','Тренажёр','Тест','Зачётный лист','ДЗ','Ответы к ДЗ','Задание','Диагностика','Комплект'];
const getId=()=>decodeURIComponent(location.hash.slice(1)||'').toUpperCase().replace(/[^0-9A-Z.]/g,'');
const SUBJ={A:'Алгебра',G:'Геометрия'};
function fail(t,x){app.innerHTML=`<div class="bar"><span></span><span class="brand">lili<b>.</b>math</span></div><h1>${esc(t)}</h1><p class="lead">${esc(x)}</p>`}
async function admin(op,fields={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:PASS,op,...fields})});
  const result=await r.json();
  if(!result.ok)throw new Error(result.error||'request');
  return result;
}
function gate(){
  if(!PASS)return Promise.reject('deny');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:PASS,op:'ping'})})
   .then(r=>r.json(),()=>{throw 'net'}).then(j=>{if(!j||j.ok!==true)throw 'deny';routeEnabled=j.lessonRoute===1});
}
let N,BY,KIDS,MAT,route,routeEnabled;
const ROUTE_FILES={'5A':'lesson-route-5.json','6A':'lesson-route-6.json','7A':'lesson-route-7a.json','7G':'lesson-route-7g.json','8A':'lesson-route-8a.json','8G':'lesson-route-8g.json','9A':'lesson-route-9a.json','9G':'lesson-route-9g.json','OGE':'lesson-route-oge.json'},ROUTES={};
let selectedLesson,myMode=null;
let selectedStudent='';
try{selectedStudent=sessionStorage.getItem('lili-route-student')||''}catch(e){}
const segs=id=>id.split('.');
const isDesc=(a,id)=>a===id||a.indexOf(id+'.')===0;
function kindOf(m){const p=String(m.title||'').split(' · ');return p.length>2?p[1].replace(/ \((PDF|текст)\)$/,'').replace(/^ДЗ №\d+$/,'ДЗ').replace(/^ДЗ$/,'ДЗ'):'Другое'}
function shortTitle(m){const p=String(m.title||'').split(' · ');return p.length>2?p.slice(1).join(' · '):m.title||m.file}
function matsOf(id,roll){return MAT.filter(m=>(m.node||[]).some(n=>roll?isDesc(n,id):n===id))}
function counts(id){const own=matsOf(id,false).length,all=matsOf(id,true).length;return{own,all}}
function label(id){
  const m=/^(\d)([AG])$/.exec(id);if(m)return m[1]+' класс · '+SUBJ[m[2]];
  return BY[id]?BY[id].title:id;
}
function crumbs(id){
  const out=['<a href="#">Карта</a>'];
  if(id){const s=segs(id);let cur=s[0];out.push(`<span>›</span><a href="#${cur}">${esc(label(cur))}</a>`);for(let i=1;i<s.length;i++){cur+='.'+s[i];out.push(`<span>›</span><a href="#${cur}">${esc(BY[cur]?BY[cur].title:cur)}</a>`)}}
  return `<div class="crumbs">${out.join('')}</div>`;
}
function matList(list){
  if(!list.length)return '';
  const g={};list.forEach(m=>{(g[kindOf(m)]=g[kindOf(m)]||[]).push(m)});
  const ks=Object.keys(g).sort((a,b)=>{const x=KORDER.indexOf(a),y=KORDER.indexOf(b);return (x<0?99:x)-(y<0?99:y)});
  return ks.map(k=>`<div class="kind">${esc(k)}</div><ul class="list">${g[k].map(m=>{
    const f=m.file,pdf=/\.pdf$/i.test(f.split('?')[0]);
    return `<li><a class="row m" href="${esc(f)}" target="_blank" rel="noopener"><span>${esc(shortTitle(m).replace(/^[^·]*· /,''))}${m.audience==='teacher'?'<span class="tag t">учитель</span>':''}${m.status==='hidden'?'<span class="tag h">скрыт</span>':''}</span><span class="c">${pdf?'PDF':'открыть'}</span></a></li>`}).join('')}</ul>`).join('');
}
function home(){
  const tiles=[];
  for(let g=5;g<=9;g++)['A','G'].forEach(s=>{const id=g+s,c=counts(id);tiles.push(`<a class="tile" href="#${id}"><b>${g} ${s==='A'?'алгебра':'геом.'}</b><small>${c.all} материалов</small></a>`)});
  const unlinked=MAT.filter(m=>!(m.node||[]).length).length;
  app.innerHTML=`<div class="bar"><span class="id">Карта · только для учителя</span><span class="brand">lili<b>.</b>math</span></div><h1>Карта материалов</h1><p class="lead">Класс → раздел → тема → материалы. Число: сколько материалов лежит в этой ветке.</p><div class="grid">${tiles.join('')}<a class="tile" href="#OGE"><b>ОГЭ, часть 1</b><small>задания 1-19</small></a></div>`
   +`<div class="card"><h2>ОГЭ-карта навыков</h2><p class="lead">Спуск от задания ОГЭ к пробелам в базе: в кабинете, карточка «Карта навыков».</p></div>`
   +(unlinked?`<p class="lead" style="margin-top:14px">Материалов без привязки к карте: ${unlinked} (служебные страницы, пробники).</p>`:'');
}
function routeCard(){
  return '<section class="card"><h2>Занятия по программе</h2><p class="lead">Открой квадратик, чтобы увидеть навыки, прикрепить материалы или отметить занятие.</p>'
    +route.chapters.map((name,i)=>`<h3>${esc(name)}</h3><div class="grid lesson-grid">${route.lessons.filter(x=>x.chapter===i+1).map(x=>`<button class="tile${/^✓/.test(x.mark||'')?' done':/^→/.test(x.mark||'')?' next':''}" style="--c:${PCOL[x.prog]||'#a9d18e'}" type="button" ${myMode?'draggable="true" ':''}data-lesson="${x.id}" aria-controls="route-detail" aria-pressed="false"><small>${x.tag?esc(x.tag):x.school?'Школьные № '+esc(x.school):'Дополнительно'}${x.cal?' · '+esc(shortD(x.cal)):''}</small><br>${x.mark||''}${esc(x.title)}</button>`).join('')}</div>`).join('')
    +'<div id="route-detail" hidden></div></section>';
}
async function selectLesson(id){
  const lesson=route.lessons.find(x=>x.id===id);
  const panel=document.getElementById('route-detail');
  selectedLesson=id;
  app.querySelector('[data-lesson="'+id+'"]').parentElement.after(panel);
  app.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lesson===id)));
  panel.hidden=false;
  panel.innerHTML=`<h2 tabindex="-1">${esc(lesson.title)}</h2>`
    +(lesson.skills.length?`<ul>${lesson.skills.map(s=>`<li><a style="color:inherit" href="#${s}">${esc(BY[s].title)}</a></li>`).join('')}</ul>`:'')
    +(lesson.extra?`<p>${esc(lesson.extra)}</p>`:'');
  panel.querySelector('h2').focus();
  if(!routeEnabled){
    panel.insertAdjacentHTML('beforeend','<p class="empty">Выдача материалов станет доступна после обновления развёртывания скрипта кабинета.</p>');
    return;
  }
  panel.insertAdjacentHTML('beforeend','<p class="lead" role="status">Загружаю материалы и список учеников…</p>');
  const pending=panel.lastElementChild;
  try{
    const [config, roster]=await Promise.all([admin('routeGet',{id}),admin('list')]);
    if(!panel.isConnected||selectedLesson!==id||!pending.isConnected)return;
    pending.remove();
    panel.insertAdjacentHTML('beforeend',`<div class="lesson-form">
      ${['theory','homework'].map((key,i)=>`<label>${i?'Домашняя работа':'Теория'} <input type="url" data-link="${key}" value="${esc(config.materials[key])}" placeholder="https://…"></label><label>Загрузить PDF до 8 МБ<input type="file" accept=".pdf,application/pdf" data-pdf="${key}"></label>`).join('')}
      <button type="button" data-save>Сохранить материалы занятия</button>
      <label>Ученик<select data-student><option value="">Выбрать ученика</option>${roster.students.filter(s=>s.active!==false).map(s=>`<option value="${esc(s.code)}">${esc([s.name,s.fname].filter(Boolean).join(' '))}</option>`).join('')}</select></label>
      <button type="button" data-assign>Провели сегодня</button>
      <p class="lead" role="status"></p></div>`);
    const form=panel.querySelector('.lesson-form');
    const status=form.querySelector('[role=status]');
    const student=form.querySelector('[data-student]');
    if([...student.options].some(o=>o.value===selectedStudent))student.value=selectedStudent;
    student.onchange=()=>{selectedStudent=student.value;try{sessionStorage.setItem('lili-route-student',selectedStudent)}catch(e){}if(!myMode||getId()!=='MY'){if(window.calUse)window.calUse(selectedStudent)}};
    const links=()=>Object.fromEntries([...form.querySelectorAll('[data-link]')].map(e=>[e.dataset.link,e.value.trim()]));
    let saved=JSON.stringify(links());
    const run=async action=>{
      const controls=[...form.querySelectorAll('input,button,select')];
      controls.forEach(e=>e.disabled=true);
      status.textContent='Сохраняю…';
      try{status.textContent=await action()}
      catch(e){status.textContent=e.message==='bad_value'?'Проверь формат ссылки или PDF.':'Не получилось сохранить. Попробуй ещё раз.'}
      finally{controls.forEach(e=>e.disabled=false)}
    };
    form.querySelectorAll('[data-pdf]').forEach(input=>input.onchange=()=>{
      const file=input.files[0];
      if(!file)return;
      input.value='';
      if(file.size>8*1024*1024){status.textContent='PDF должен быть не больше 8 МБ.';return}
      run(async()=>{
        const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
        const result=await admin('routeUpload',{name:file.name,data});
        form.querySelector(`[data-link="${input.dataset.pdf}"]`).value=result.url;
        return 'PDF загружен. Нажми «Сохранить материалы занятия».';
      });
    });
    form.querySelector('[data-save]').onclick=()=>run(async()=>{
      const result=await admin('routeSave',{id,...links()});
      saved=JSON.stringify(result.materials);
      return 'Материалы сохранены для следующих занятий.';
    });
    form.querySelector('[data-assign]').onclick=()=>{
      if(!student.value){status.textContent='Сначала выбери ученика.';return}
      if(saved!==JSON.stringify(links())){status.textContent='Сначала сохрани изменённые материалы.';return}
      run(async()=>{
        const result=await admin('routeAssign',{id,t:student.value,title:lesson.title});
        if(myMode&&student.value===myMode.code){lesson.mark='✓ ';refreshTile(lesson);renderCal()}
        return result.duplicate?'Сегодня это занятие уже отмечено.':result.theory||result.homework?'Занятие отмечено. Прикреплённые материалы появились в кабинете ученика.':'Занятие отмечено. К нему пока нет прикреплённых файлов.';
      });
    };
  }catch(e){if(pending.isConnected)pending.textContent='Не получилось загрузить материалы и учеников. Нажми на квадратик ещё раз.'}
}
const PCOL={'5':'#f5dc6a','6':'#f2905e','7A':'#a9c1ff','7G':'#d6e2ee','8A':'#a9d18e','8G':'#5d7a4f','9A':'#1747c9','9G':'#ff8f73',OGE:'#f3ece2'};
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shortD=iso=>iso.slice(8,10)+'.'+iso.slice(5,7);
let calWeek=0;
function calSet(id,d){
  const m=myMode,l=m.lessons.find(x=>x.id===id);if(!l)return;
  const prev=l.cal;l.cal=d||undefined;m.st.cal=m.st.cal.filter(y=>y.id!==id);if(d)m.st.cal.push({d,id,title:l.title});
  renderCal();refreshTile(l);
  admin('calSet',{t:m.code,id,d:d||'',title:l.title}).catch(()=>{l.cal=prev;m.st.cal=m.st.cal.filter(y=>y.id!==id);if(prev)m.st.cal.push({d:prev,id,title:l.title});renderCal();refreshTile(l);alert('Не получилось сохранить в календаре. Проверь связь и обнови Apps Script.')});
}
function refreshTile(l){const b=app.querySelector('[data-lesson="'+l.id+'"]');if(b){b.classList.toggle('done',/^✓/.test(l.mark||''));b.classList.toggle('next',/^→/.test(l.mark||''))}if(b)b.innerHTML='<small>'+esc(l.tag||(l.school?'Школьные № '+l.school:'Дополнительно'))+(l.cal?' · '+esc(shortD(l.cal)):'')+'</small><br>'+(l.mark||'')+esc(l.title)}
function renderCal(){
  const box=document.getElementById('cal');if(!box||!myMode)return;
  const days=String(myMode.st.days||'').split('|')[0].match(/Пн|Вт|Ср|Чт|Пт|Сб|Вс/g)||[];
  const lessonWd=new Set(days.map(x=>WD.indexOf(x)));
  const now=new Date();now.setHours(0,0,0,0);const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)+calWeek*7);
  let h='<h2>Календарь</h2><p class="lead">Перетащи квадратик на день. Или открой квадратик и нажми на день. Занятие можно перетащить на другой день, ✕ убирает из календаря.</p><div style="display:flex;gap:8px;margin-bottom:10px"><button type="button" data-cw="-1">←</button><button type="button" data-cw="0">Сегодня</button><button type="button" data-cw="1">→</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">';
  for(let w=0;w<4;w++)for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+w*7+i);const iso=isoD(d),on=lessonWd.has(d.getDay()),today=iso===isoD(now);
    const chips=myMode.st.cal.filter(y=>y.d===iso).map(y=>{const l=myMode.lessons.find(x=>x.id===y.id);const done=l&&/^✓/.test(l.mark||'');return `<div draggable="true" data-chip="${esc(y.id)}" style="font-size:12px;padding:3px 5px;margin-top:3px;border-radius:6px;border-left:5px solid ${PCOL[l&&l.prog]||'#a9d18e'};background:color-mix(in srgb,${PCOL[l&&l.prog]||'#a9d18e'} 30%,#14211e);cursor:grab">${done?'✓ ':''}${esc(y.title)} <span data-x="${esc(y.id)}" style="cursor:pointer;opacity:.7">✕</span></div>`}).join('');
    h+=`<div data-day="${iso}" style="min-height:74px;padding:5px;border-radius:8px;border:1px solid ${today?'#f2905e':'rgba(255,255,255,.18)'};background:${on?'rgba(169,209,142,.16)':'transparent'}"><b style="font-size:12px">${WD[d.getDay()]} ${shortD(iso)}</b>${chips}</div>`;
  }
  box.innerHTML=h+'</div>';
  box.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>{calWeek=b.dataset.cw==='0'?0:calWeek+Number(b.dataset.cw);renderCal()});
  box.querySelectorAll('[data-day]').forEach(c=>{
    c.ondragover=e=>e.preventDefault();
    c.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(/^[tc]:/.test(t))calSet(t.slice(2),c.dataset.day)};
    c.onclick=e=>{if(e.target.closest('[data-chip]'))return;if(selectedLesson)calSet(selectedLesson,c.dataset.day)};
  });
  box.querySelectorAll('[data-chip]').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain','c:'+c.dataset.chip));
  box.querySelectorAll('[data-x]').forEach(x=>x.onclick=e=>{e.stopPropagation();calSet(x.dataset.x,'')});
}
async function initClassCal(){
  const sel=document.getElementById('cal-student');if(!sel)return;
  let roster=[];try{roster=(await admin('list')).students||[]}catch(e){}
  if(!document.getElementById('cal-student'))return;
  roster=roster.filter(x=>x.active!==false);
  sel.innerHTML='<option value="">Выбрать ученика</option>'+roster.map(x=>`<option value="${esc(x.code)}">${esc([x.name,x.fname].filter(Boolean).join(' '))}</option>`).join('');
  const all=Object.values(ROUTES).flatMap(x=>x.lessons);
  const use=code=>{
    selectedStudent=code;try{sessionStorage.setItem('lili-route-student',code)}catch(e){}
    const st=roster.find(x=>x.code===code);
    if(!st){myMode=null;document.getElementById('cal').innerHTML='<p class="lead">Выбери ученика, и появится его календарь.</p>';route.lessons.forEach(x=>{x.cal=undefined;x.mark='';refreshTile(x)});app.querySelectorAll('[data-lesson]').forEach(b=>{b.draggable=false});return}
    st.cal=st.cal||[];const done=new Set(st.routeDone||[]);
    all.forEach(x=>{const c=st.cal.find(y=>y.id===x.id);x.cal=c?c.d:undefined;x.mark=done.has(x.id)?'✓ ':''});
    myMode={code,st,lessons:all};
    route.lessons.forEach(refreshTile);
    app.querySelectorAll('[data-lesson]').forEach(b=>{b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain','t:'+b.dataset.lesson)});
    renderCal();
  };
  sel.onchange=()=>use(sel.value);
  window.calUse=code=>{if(document.getElementById('cal-student')){sel.value=code;use(code)}};
  if(selectedStudent&&roster.some(x=>x.code===selectedStudent)){sel.value=selectedStudent;use(selectedStudent)}
}
async function myPage(){
  document.title='Квадратики ученика · lili.math';
  let code='';try{code=sessionStorage.getItem('lili-route-student')||''}catch(e){}
  app.innerHTML='<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><p class="lead" role="status">Загружаю программу ученика…</p>';
  let st=null;
  try{const j=await admin('list');st=(j.students||[]).find(x=>x.code===code)}catch(e){}
  if(!st){app.innerHTML+='<p class="empty">Не получилось найти ученика. Открой кабинет ученика и нажми «Открыть карту занятий».</p>';return}
  const progs=st.routes||[],done=new Set(st.routeDone||[]);
  const NAMES={'5':'5 класс','6':'6 класс','7A':'7 алгебра','7G':'7 геометрия','8A':'8 алгебра','8G':'8 геометрия','9A':'9 алгебра','9G':'9 геометрия',OGE:'ОГЭ, часть 1'};
  const nm=[st.name,st.fname].filter(Boolean).join(' ');
  if(!progs.length){app.innerHTML=`<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>${esc(nm)}</h1><p class="empty">Программа не выбрана. В кабинете ученика: настройки, «Программа по квадратикам».</p>`;return}
  const seq=k=>(ROUTES[k]?ROUTES[k].lessons:[]).map(x=>({...x,tag:NAMES[k]}));
  const A=progs.filter(k=>k!=='OGE'&&k.slice(-1)!=='G').flatMap(seq),G=progs.filter(k=>k.slice(-1)==='G').flatMap(seq),O=progs.includes('OGE')?seq('OGE'):[];
  const school=[];let ai=0,gi=0,n=0;const pat=['A','A','G'];
  while(ai<A.length||gi<G.length){let k=pat[n++%3];if(k==='A'&&ai>=A.length)k='G';if(k==='G'&&gi>=G.length)k='A';school.push(k==='A'?A[ai++]:G[gi++])}
  const chapters=[],lessons=[];
  const add=(name,list)=>{if(!list.length)return;chapters.push(name);let next=true;list.forEach((x,i)=>{const d=done.has(x.id);lessons.push({...x,chapter:chapters.length,mark:d?'✓ ':(next?'→ ':'')});if(!d)next=false})};
  add('Школьная программа по порядку (алгебра, алгебра, геометрия)',school);
  add('ОГЭ, часть 1',O);
  route={chapters,lessons};myMode={code,st,lessons};selectedStudent=code;st.cal=st.cal||[];lessons.forEach(x=>{const c=st.cal.find(y=>y.id===x.id);if(c)x.cal=c.d});
  app.innerHTML=`<div class="bar"><span class="id">Ученик</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>${esc(nm)}</h1><p class="lead">Программы: ${progs.map(k=>NAMES[k]).join(', ')}. ✓ проведено, → следующее.</p>`+'<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><div id="cal"></div></section></div>';
  app.querySelectorAll('[data-lesson]').forEach(b=>{b.onclick=()=>selectLesson(b.dataset.lesson);b.ondragstart=e=>{e.dataTransfer.setData('text/plain','t:'+b.dataset.lesson)}});renderCal();scrollTo(0,0);
}
function node(id){
  if(id!=='MY')myMode=null;
  if(id==='MY'){myPage();return}
  if(id==='OGE'){document.title='ОГЭ, часть 1 · lili.math';route=ROUTES.OGE;app.innerHTML=`<div class="bar"><span class="id">ОГЭ</span><span class="brand">lili<b>.</b>math</span></div><div class="crumbs"><a href="#">Карта</a></div><h1>ОГЭ, часть 1</h1>`+(route?'<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><label class="lead">Ученик <select id="cal-student"><option value="">Выбрать ученика</option></select></label><div id="cal"><p class="lead">Выбери ученика, и появится его календарь.</p></div></section></div>':'<p class="lead">Не получилось загрузить программу ОГЭ.</p>');app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>selectLesson(b.dataset.lesson));if(route)initClassCal();scrollTo(0,0);return}
  const isRoot=/^\d[AG]$/.test(id),n=BY[id];
  if(!isRoot&&!n){fail('Не нашла такой раздел','Вернись на «Карта» и выбери класс.');return}
  const kids=isRoot?N.filter(x=>x.grade===+id[0]&&x.subject===(id[1]==='A'?'алгебра':'геометрия')&&!x.parent):KIDS[id]||[];
  const lvl=segs(id).length,topic=lvl>=3?(lvl===3?id:segs(id).slice(0,3).join('.')):null;
  const own=matsOf(id,false),rollAll=matsOf(id,true);
  const title=isRoot?label(id):n.title;
  document.title=title+' · lili.math';
  let h=`<div class="bar"><span class="id">${esc(id)}</span><span class="brand">lili<b>.</b>math</span></div>${crumbs(id)}<h1>${esc(title)}</h1>`;
  if(!isRoot&&n.oge)h+=`<div class="chips"><span class="chip">ОГЭ: ${esc(n.oge)}</span></div>`;
  route=ROUTES[id];if(route)h+='<div class="mywrap"><div>'+routeCard()+'</div><section class="card calwrap"><label class="lead">Ученик <select id="cal-student"><option value="">Выбрать ученика</option></select></label><div id="cal"><p class="lead">Выбери ученика, и появится его календарь.</p></div></section></div>';
  if(kids.length){
    h+=`<div class="card"><h2>${isRoot?'Разделы':lvl===2?'Темы':'Навыки'}</h2><ul class="list">${kids.map(k=>{const c=counts(k.id);
     return `<li><a class="row" href="#${k.id}"><span class="n">${esc(k.id)}</span><span>${esc(k.title)}${k.oge?`<span class="t">ОГЭ ${esc(k.oge)}</span>`:''}</span><span class="c${c.all||lvl===3?'':' z'}">${lvl===3?'':(c.all?c.all+' мат.':'пусто')}</span></a></li>`}).join('')}</ul></div>`;
  }
  // материалы: сначала лежащие прямо здесь (для навыка: материалы его темы), затем остальное в ветке
  let direct=own,note='';
  if(!direct.length&&lvl===4){direct=matsOf(topic,false);if(direct.length)note=`<p class="lead" style="margin-bottom:10px">Материалы темы «${esc(BY[topic]?BY[topic].title:topic)}».</p>`}
  if(direct.length)h+=`<div class="card"><h2>Материалы</h2>${note}${matList(direct)}</div>`;
  else if(lvl>=3)h+=`<div class="card"><h2>Материалы</h2><p class="empty">Материалов пока нет. Это пробел: здесь нужны теория, план урока и ДЗ.</p></div>`;
  const ids=new Set(direct.map(m=>m.file)),rest=rollAll.filter(m=>!ids.has(m.file));
  if(rest.length&&lvl<4)h+=`<div class="card"><h2>${direct.length?'Ещё в этой ветке':'Материалы в этой ветке'}</h2>${matList(rest)}</div>`;
  if(!isRoot&&n.prereq&&n.prereq.length){h+=`<div class="card pre"><h2>Что нужно знать до этого</h2>${n.prereq.map(p=>BY[p]?`<a href="#${p}"><b style="font:600 11px var(--mono);color:var(--faint)">${p}</b> ${esc(BY[p].title)}</a>`:'').join('')}</div>`}
  app.innerHTML=h;
  app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>selectLesson(b.dataset.lesson));
  if(route)initClassCal();
  scrollTo(0,0);
}
function draw(){const id=getId();if(!id)home();else node(id)}
function go(){
  Promise.all([fetch('skills-by-grade.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch('catalog.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}),Promise.all(Object.keys(ROUTE_FILES).map(k=>fetch(ROUTE_FILES[k],{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>null)))])
  .then(([g,c,rs])=>{Object.keys(ROUTE_FILES).forEach((k,i)=>{if(rs[i]&&rs[i].lessons){rs[i].lessons.forEach(l=>{l.prog=k});ROUTES[k]=rs[i]}});N=g;BY=Object.fromEntries(g.map(x=>[x.id,x]));KIDS={};g.forEach(x=>{if(x.parent)(KIDS[x.parent]=KIDS[x.parent]||[]).push(x)});Object.values(KIDS).forEach(a=>a.sort((p,q)=>p.id.localeCompare(q.id,'en',{numeric:true})));MAT=c.items.filter(m=>m.file&&!/^(index|karta|kabinet|skill|STATE)/.test(m.file));draw()})
  .catch(()=>fail('Не получилось открыть','Похоже, пропал интернет. Обнови страницу.'));
}
addEventListener('hashchange',()=>{if(N)draw()});
gate().then(go).catch(e=>{if(e==='net')fail('Нет связи','Не получилось проверить доступ. Проверь интернет и обнови страницу.');else fail('Страница только для учителя','Открой кабинет в режиме учителя на этом устройстве и войди с паролем, потом вернись сюда.')});
})();
