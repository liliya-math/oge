<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211e">
<title>Треугольники (ОГЭ №15): тренажёр</title>
<style>
:root{--bg:#14211e;--card:rgba(243,236,226,.07);--line:rgba(243,236,226,.16);--fg:#f3ece2;--muted:rgba(243,236,226,.62);--cobalt:#1747c9;--apricot:#f2905e;--yellow:#f5dc6a;--mint:#8fd9b0;--miss:#ff8f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.25}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.big{font-size:32px;margin:8px 0 14px;line-height:1.7}
.rad{display:inline-block;white-space:nowrap;vertical-align:baseline;padding-left:.7em;line-height:1.15}
.ov{position:relative;display:inline-block;border-top:.07em solid var(--fg);padding:.05em .1em 0 .08em}
.rs{position:absolute;right:100%;margin-right:-.01em;top:-.07em;width:.7em;height:calc(100% - .07em);overflow:visible;fill:var(--fg);stroke:none}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--fg);padding:0 4px}
input.ans{font:inherit;font-size:26px;width:100%;max-width:240px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
input.ans:focus,input.nm:focus{outline:2px solid var(--yellow);outline-offset:1px}
input.nm{font:inherit;font-size:20px;width:100%;max-width:360px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:var(--cobalt);color:#fff;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px 4px 2px 0}
.opt{font:inherit;font-size:20px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:rgba(243,236,226,.06);color:var(--fg);cursor:pointer;margin:0 10px 10px 0}
.opt:active{background:rgba(243,236,226,.16)}
.dots{margin:4px 0 10px}
.dot{display:inline-block;width:15px;height:15px;border:2px solid var(--fg);border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--mint);border-color:var(--mint)}
.ok{color:var(--mint);font-weight:700}
.bad{color:var(--miss);font-weight:700}
.hint{border-left:4px solid var(--yellow);background:rgba(245,220,106,.1);padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .st{font-size:14px;color:var(--muted);white-space:nowrap}
.row.passed .st{color:var(--mint)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
svg{display:block;margin:6px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:28px}}
</style>
<script src="cabinet-report.js"></script>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<script>
'use strict';
//CONTENT-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const f=n=>String(Math.round(n*1e6)/1e6).replace('.',',').replace('-','−');
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R=x=>`<span class="rad"><span class="ov"><svg class="rs" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 66 L2.6 62 L5.6 88 L10.6 0 L12.6 0 L12.6 5 L11.6 5 L6.6 100 L4.6 100 L2.1 71 L0.5 72.5 Z"/></svg>${x}</span></span>`;

const I=s=>`<i>${s}</i>`;
const T3=`${I('A')}${I('B')}${I('C')}`;
const rd=x=>Math.round(x*1e6)/1e6;
function nm(q,ans,cf,why,hint,x){return Object.assign({q,type:'num',ans:rd(ans),cf,why,prompt:'Впишите правильный ответ',hint:hint||''},x||{})}
const DEG=' Ответ дайте в градусах.';
const TRI=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[6,8,10],[9,12,15],[12,16,20],[9,40,41]];
const pyt=()=>{const t=pick(TRI),k=t[2]>=25?1:pick([1,2]);return t.map(v=>v*k)};

// 1. Сумма углов треугольника
function g1(){if(ri(0,1)===0){const a=ri(20,80),b=ri(20,170-a);return nm(`В треугольнике два угла равны ${a}° и ${b}°. Найдите его третий угол.${DEG}`,180-a-b,180-a-b,`Сумма углов треугольника равна 180°. Третий угол: 180° − ${a}° − ${b}° = ${180-a-b}°.`,'Сумма углов треугольника — 180°.',{tag:u=>u===a+b?'нашёл сумму двух углов':u===90-a-b?'вычитал из 90°':''})}
 const a=ri(15,75);return nm(`Один из острых углов прямоугольного треугольника равен ${a}°. Найдите его другой острый угол.${DEG}`,90-a,90-a,`В прямоугольном треугольнике один угол 90°, сумма острых углов 90°. Другой угол: 90° − ${a}° = ${90-a}°.`,'Сумма острых углов прямоугольного треугольника — 90°.',{tag:u=>u===180-a?'вычитал из 180°':''})}

// 2. Равнобедренный треугольник
function g2(){if(ri(0,1)===0){const b=ri(100,160);const base=(180-b)/2;if(base%1)return g2();return nm(`В треугольнике ${T3} известно, что ${I('AB')} = ${I('BC')}, ∠${I('ABC')} = ${b}°. Найдите угол ${I('BCA')}.${DEG}`,base,base,`Треугольник равнобедренный, углы при основании равны. ∠B = ${b}° — угол при вершине. Остаётся 180° − ${b}° = ${180-b}°, на два угла поровну: ${180-b} : 2 = ${base}°.`,'Углы при основании равны, сумма всех углов 180°.',{tag:u=>u===180-b?'не разделил на 2 оставшиеся градусы':''})}
 const a=ri(30,80);return nm(`В равнобедренном треугольнике ${T3} с основанием ${I('AC')} угол ${I('A')} равен ${a}°. Найдите угол ${I('B')}.${DEG}`,180-2*a,180-2*a,`Углы при основании равны: ∠C = ∠A = ${a}°. ∠B = 180° − ${a}° − ${a}° = ${180-2*a}°.`,'Углы при основании равны.',{tag:u=>u===180-a?'вычел только один угол при основании':''})}

// 3. Внешний угол
function g3(){const c=ri(100,175);if(ri(0,1)===0)return nm(`В треугольнике ${T3} угол ${I('C')} равен ${c}°. Найдите внешний угол при вершине ${I('C')}.${DEG}`,180-c,180-c,`Внешний угол смежен с внутренним: вместе они дают 180°. 180° − ${c}° = ${180-c}°.`,'Внешний и внутренний углы в сумме 180°.',{tag:u=>u===c?'назвал внутренний угол':''});
 const a=ri(30,70),b=ri(30,70);return nm(`В треугольнике ${T3} углы ${I('A')} и ${I('B')} равны ${a}° и ${b}°. Найдите внешний угол при вершине ${I('C')}.${DEG}`,a+b,a+b,`Внешний угол при вершине C равен сумме двух внутренних, не смежных с ним: ${a}° + ${b}° = ${a+b}°. Проверка: ∠C = ${180-a-b}°, смежный с ним ${a+b}°.`,'Внешний угол равен сумме двух других углов треугольника.',{tag:u=>u===180-a-b?'назвал внутренний угол C':''})}

// 4. Биссектриса и высота
function g4(){const t=ri(0,2);
 if(t===0){const a=ri(10,88)*2;return nm(`В треугольнике ${T3} известно, что ∠${I('BAC')} = ${a}°, ${I('AD')} — биссектриса. Найдите угол ${I('BAD')}.${DEG}`,a/2,a/2,`Биссектриса делит угол пополам: ∠BAD = ${a}° : 2 = ${a/2}°.`,'Биссектриса делит угол пополам.',{tag:u=>u===a?'не поделил на 2':''})}
 if(t===1){const a=ri(20,80);return nm(`В остроугольном треугольнике ${T3} проведена высота ${I('BH')}, ∠${I('BAC')} = ${a}°. Найдите угол ${I('ABH')}.${DEG}`,90-a,90-a,`Высота BH перпендикулярна AC, треугольник ABH прямоугольный (∠H = 90°). ∠ABH = 90° − ∠A = 90° − ${a}° = ${90-a}°.`,'Рассмотри прямоугольный треугольник ABH.',{tag:u=>u===180-a?'вычитал из 180° в прямоугольном треугольнике':''})}
 const a=ri(20,60)*2,c=ri(30,70);return nm(`В треугольнике ${T3} известно, что ∠${I('A')} = ${a}°, ∠${I('C')} = ${c}°, ${I('BD')} — биссектриса. Найдите угол ${I('ABD')}.${DEG}`,(180-a-c)/2,(180-a-c)/2,`∠B = 180° − ${a}° − ${c}° = ${180-a-c}°. Биссектриса делит угол пополам: ∠ABD = ${180-a-c} : 2 = ${(180-a-c)/2}°.`,'Сначала найди угол B.',{tag:u=>u===180-a-c?'нашёл угол B, но не поделил':''})}

// 5. Медиана
function g5(){const t=ri(0,1);
 if(t===0){const ac=2*ri(8,40),bm=ri(5,30);return nm(`В треугольнике ${T3} известно, что ${I('AC')} = ${ac}, ${I('BM')} — медиана, ${I('BM')} = ${bm}. Найдите ${I('AM')}.`,ac/2,ac/2,`Медиана делит противоположную сторону пополам: AM = AC : 2 = ${ac} : 2 = ${ac/2}. Длина самой медианы BM для этого не нужна.`,'Что делает медиана со стороной, к которой проведена?',{tag:u=>u===bm?'взял длину медианы':''})}
 const c=ri(20,70);return nm(`В треугольнике ${T3} проведена медиана ${I('BM')}. Найдите градусную меру угла ${I('A')}, если ∠${I('C')} = ${c}° и ${I('BM')} = ${I('AM')} = ${I('MC')}.`,90-c,90-c,`Медиана BM равна половине AC (AM = MC = BM), значит угол B прямой (∠B = 90°). Тогда ∠A = 90° − ∠C = 90° − ${c}° = ${90-c}°.`,'Если медиана равна половине стороны, угол при вершине медианы прямой.',{tag:u=>u===c?'принял угол A равным углу C':''})}

// 6. Равносторонний треугольник
function g6(){const k=ri(2,20);if(ri(0,1)===0){const a=2*k;return nm(`Сторона равностороннего треугольника равна ${a}${R(3)}. Найдите медиану этого треугольника.`,a*3/2,a*3/2,`В равностороннем треугольнике медиана является высотой: m = a√3/2. m = ${a}√3 · √3 / 2 = ${a} · 3 / 2 = ${a*3/2}.`,'Медиана равностороннего треугольника — высота: m = a√3/2.',{tag:u=>u===a?'взял сторону без √3':u===a/2?'нашёл половину стороны':''})}
 const m=k;return nm(`Медиана равностороннего треугольника равна ${m}${R(3)}. Найдите сторону этого треугольника.`,2*m,2*m,`m = a√3/2, откуда a = 2m/√3 = 2 · ${m}√3 / √3 = ${2*m}.`,'a = 2m/√3.',{tag:u=>u===m?'не умножил на 2':''})}

// 7. Теорема Пифагора
function g7(){const [a,b,c]=pyt();if(ri(0,1)===0)return nm(`Катеты прямоугольного треугольника равны ${a} и ${b}. Найдите гипотенузу этого треугольника.`,c,Math.sqrt(a*a+b*b),`Гипотенуза: c² = a² + b² = ${a*a} + ${b*b} = ${a*a+b*b}, c = ${c}.`,'c² = a² + b².',{tag:u=>u===a+b?'сложил катеты':''});
 const x=pick([a,b]),y=x===a?b:a;return nm(`В прямоугольном треугольнике гипотенуза равна ${c}, один из катетов равен ${x}. Найдите другой катет.`,y,y,`Другой катет: b² = c² − a² = ${c*c} − ${x*x} = ${y*y}, b = ${y}.`,'Из гипотенузы вычитай, а не складывай: b² = c² − a².',{tag:u=>u===c-x?'вычел сами числа, а не квадраты':''})}

// 8. sin, cos, tg по сторонам
function g8(){const t=pick([[3,4,5],[6,8,10],[7,24,25],[9,12,15],[12,16,20],[15,20,25],[5,12,13].map(x=>x*0)]);for(;;){const tr=pick([[3,4,5],[6,8,10],[7,24,25],[12,16,20],[15,20,25],[9,12,15],[14,48,50],[21,28,35]]);const [a,b,c]=tr;
  const w=ri(0,2);const ang=pick(['A','B']);const op=ang==='A'?a:b,ad=ang==='A'?b:a;
  if(w===0){const v=op/c;return nm(`В треугольнике ${T3} угол ${I('C')} равен 90°, ${I(ang==='A'?'BC':'AC')} = ${op}, ${I('AB')} = ${c}. Найдите sin ${I(ang)}.`,v,Math.sin(Math.atan2(op,ad)),`sin — отношение противолежащего катета к гипотенузе: ${op}/${c} = ${f(rd(v))}.`,'sin = противолежащий катет : гипотенуза.',{tag:u=>Math.abs(u-ad/c)<1e-9?'перепутал sin и cos':Math.abs(u-op/ad)<1e-9?'нашёл tg':''})}
  if(w===1){const v=ad/c;return nm(`В треугольнике ${T3} угол ${I('C')} равен 90°, ${I(ang==='A'?'AC':'BC')} = ${ad}, ${I('AB')} = ${c}. Найдите cos ${I(ang)}.`,v,Math.cos(Math.atan2(op,ad)),`cos — отношение прилежащего катета к гипотенузе: ${ad}/${c} = ${f(rd(v))}.`,'cos = прилежащий катет : гипотенуза.',{tag:u=>Math.abs(u-op/c)<1e-9?'перепутал sin и cos':''})}
  const v=op/ad;if(Math.abs(v*100-Math.round(v*100))>1e-9)continue;return nm(`В треугольнике ${T3} угол ${I('C')} равен 90°, ${I(ang==='A'?'BC':'AC')} = ${op}, ${I(ang==='A'?'AC':'BC')} = ${ad}. Найдите tg ${I(ang)}.`,v,Math.tan(Math.atan2(op,ad)),`tg — отношение противолежащего катета к прилежащему: ${op}/${ad} = ${f(rd(v))}.`,'tg = противолежащий катет : прилежащий катет.',{tag:u=>Math.abs(u-ad/op)<1e-9?'перевернул отношение':''})}}

// 9. Сторона через cos/sin
function g9(){const d=pick([3,4,5,7,9,10,11,13]),n=ri(1,d-1),k=ri(2,6);const c=d*k;const useCos=ri(0,1)===0;
 if(gcdf(n,d)>1)return g9();
 if(useCos)return nm(`В треугольнике ${T3} угол ${I('C')} равен 90°, cos ${I('B')} = ${F(n,d)}, ${I('AB')} = ${c}. Найдите ${I('BC')}.`,c*n/d,c*Math.cos(Math.acos(n/d)),`cos B = BC/AB, поэтому BC = AB · cos B = ${c} · ${n}/${d} = ${c*n/d}.`,'BC — прилежащий к B катет: BC = AB · cos B.',{tag:u=>u===c/n*d?'делил вместо умножения':''});
 return nm(`В треугольнике ${T3} угол ${I('C')} равен 90°, sin ${I('A')} = ${F(n,d)}, ${I('AB')} = ${c}. Найдите ${I('BC')}.`,c*n/d,c*Math.sin(Math.asin(n/d)),`sin A = BC/AB, поэтому BC = AB · sin A = ${c} · ${n}/${d} = ${c*n/d}.`,'BC — противолежащий A катет: BC = AB · sin A.',{tag:u=>u===c/n*d?'делил вместо умножения':''})}
function gcdf(a,b){return b?gcdf(b,a%b):a}

// 10. Площадь через синус
function g10(){for(;;){const a=ri(4,24),b=ri(4,24),d=pick([2,3,4,5,10]),n=ri(1,d-1);if(gcdf(n,d)>1)continue;const S=a*b*n/(2*d);if(Math.abs(S*10-Math.round(S*10))>1e-9)continue;
  const ang=Math.asin(n/d),cf=0.5*a*b*Math.sin(ang);
  return nm(`В треугольнике ${T3} известно, что ${I('AB')} = ${a}, ${I('BC')} = ${b}, sin ∠${I('ABC')} = ${F(n,d)}. Найдите площадь треугольника ${T3}.`,S,cf,`Площадь треугольника равна половине произведения двух сторон на синус угла между ними: S = ½ · ${a} · ${b} · ${n}/${d} = ${f(rd(S))}.`,'S = ½ · AB · BC · sin B.',{tag:u=>u===a*b*n/d?'забыл множитель ½':u===a*b/2?'не умножил на синус':''})}}

const GS=[g1,g2,g3,g4,g5,g6,g7,g8,g9,g10];
function g11(){return pick(GS)()}

const LEVELS=[
 {t:'Сумма углов треугольника',g:g1,pages:[
  '<b>Сумма углов треугольника равна 180°.</b> В прямоугольном треугольнике один угол 90°, поэтому сумма двух острых углов равна 90°.',
  'Разберём пример: два угла треугольника 38° и 89°. Третий угол: 180° − 38° − 89° = 53°. Острый угол прямоугольного треугольника 53°, другой угол 90° − 53° = 37°.',
  'Проверка: сложи все углы, должно получиться 180°.']},
 {t:'Равнобедренный треугольник',g:g2,pages:[
  '<b>В равнобедренном треугольнике углы при основании равны.</b> Основание — сторона, не равная боковым. Вершина — угол между боковыми сторонами.',
  'Разберём пример: AB = BC, ∠B = 144°. Углы при основании: ∠A = ∠C = (180° − 144°) : 2 = 18°.',
  'Если известен угол при основании a, то угол при вершине 180° − 2a.']},
 {t:'Внешний угол треугольника',g:g3,pages:[
  '<b>Внешний угол смежен с внутренним углом треугольника:</b> в сумме они дают 180°.',
  'Разберём пример: ∠C = 168°. Внешний угол: 180° − 168° = 12°.',
  '<b>Внешний угол равен сумме двух внутренних углов, не смежных с ним.</b> Внешний угол при C равен ∠A + ∠B.']},
 {t:'Биссектриса и высота',g:g4,pages:[
  '<b>Биссектриса делит угол пополам.</b> Высота перпендикулярна стороне, к которой проведена.',
  'Разберём пример: ∠BAC = 48°, AD — биссектриса. ∠BAD = 48° : 2 = 24°. Высота BH, ∠A = 46°: в треугольнике ABH угол H = 90°, ∠ABH = 90° − 46° = 44°.',
  'Для угла между стороной и высотой всегда рассматривай прямоугольный треугольник, образованный высотой.']},
 {t:'Медиана',g:g5,pages:[
  '<b>Медиана соединяет вершину с серединой противоположной стороны.</b> Она делит эту сторону пополам.',
  'Разберём пример: AC = 38, BM — медиана. AM = 38 : 2 = 19. Длина BM не нужна.',
  'Если медиана равна половине стороны, к которой проведена, то угол при вершине прямой. Так, BM = AM = MC означает ∠B = 90°.']},
 {t:'Равносторонний треугольник',g:g6,pages:[
  '<b>В равностороннем треугольнике все стороны и углы (60°) равны.</b> Медиана, биссектриса и высота совпадают.',
  'Формула: <b>m = a√3/2.</b> Разберём пример: сторона 8√3. Медиана: 8√3 · √3 / 2 = 8 · 3 / 2 = 12.',
  'Обратно: медиана m, сторона a = 2m/√3. При m = 9√3 получаем a = 2 · 9√3 / √3 = 18.']},
 {t:'Теорема Пифагора',g:g7,pages:[
  '<b>В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов:</b> c² = a² + b².',
  'Разберём пример: катеты 30 и 40. c² = 900 + 1600 = 2500, c = 50. Катет: гипотенуза 13, катет 5: b² = 169 − 25 = 144, b = 12.',
  'Полезные тройки: 3, 4, 5; 5, 12, 13; 8, 15, 17; 7, 24, 25; 20, 21, 29 и числа, кратные им.']},
 {t:'sin, cos, tg в прямоугольном треугольнике',g:g8,pages:[
  '<b>sin угла — отношение противолежащего катета к гипотенузе. cos — прилежащего катета к гипотенузе. tg — противолежащего катета к прилежащему.</b>',
  'Разберём пример: ∠C = 90°, AC = 4, AB = 5, найдём sin B. Против угла B лежит AC. sin B = AC/AB = 4/5 = 0,8.',
  'Противолежащий — напротив угла. Прилежащий — рядом с углом (не гипотенуза). Ответ записывай десятичной дробью.']},
 {t:'Сторона по cos и sin',g:g9,pages:[
  '<b>Из определения cos B = BC/AB получаем BC = AB · cos B.</b> Так же sin A = BC/AB даёт BC = AB · sin A.',
  'Разберём пример: ∠C = 90°, cos B = 4/7, AB = 21. BC = 21 · 4/7 = 12.',
  'Определи, прилежащий или противолежащий катет для данного угла, и выбери sin или cos.']},
 {t:'Площадь через синус угла',g:g10,pages:[
  '<b>Площадь треугольника равна половине произведения двух сторон на синус угла между ними:</b> S = ½ · a · b · sin γ.',
  'Разберём пример: AB = 20, BC = 7, sin B = 2/5. S = ½ · 20 · 7 · 2/5 = 28.',
  'Угол должен лежать между данными сторонами (B между AB и BC). Не забывай множитель ½.']},
 {t:'Всё вперемешку, как в ОГЭ',g:g11,pages:[
  '<b>В №15 нужно найти угол, сторону, значение sin, cos, tg или площадь треугольника.</b> Ответ — число (угол в градусах).',
  'План: выпиши, что дано, найди нужное свойство (сумма углов, медиана, Пифагор, определение sin/cos/tg, площадь), выполни расчёт.',
  'Проверь, что ответ в нужных единицах и разумного размера: катет не больше гипотенузы, угол от 0° до 180°.']}
];
//CONTENT-END

//ENGINE-START
/* ====== настройки ====== */
const KEY='lilimath-trenazher-treugolniki-oge15-v1';
const SHEET_URL='https://script.google.com/macros/s/AKfycbyJKYatO3xdOpYJ1WZzszbxqMnOWZ30lsfr5HH7Y23svvX6iqjNNbIUR-RCUeZ8pB15/exec';
const TITLE='Треугольники (ОГЭ №15)';
const NEED=7;          // верных ответов подряд для прохождения уровня
const RETEACH_AFTER=3; // ошибок подряд -> показать объяснение заново
const STUCK_AFTER=3;   // сколько раз объяснение показали -> метка «нужна помощь»
const PUSH_EVERY=10;   // отправка в таблицу каждые N ответов

/* ====== состояние ====== */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv)return s}catch(e){}return{name:'',lv:{},openAll:false}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function enc(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const HASH=location.hash.slice(1);
const TEACHER=HASH==='lilia';
if(/^u/.test(HASH)&&!st.name){try{const nm=dec(HASH.slice(1).split('.')[0]).split('|')[0].trim();if(nm){st.name=nm;save()}}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function L(i){return st.lv[i]||(st.lv[i]={ok:0,bad:0,hints:0,idk:0,tags:{},reteach:0,passed:false,stuck:false})}
const isOpen=i=>i===0||st.openAll||L(i-1).passed;
const passedCount=()=>LEVELS.filter((_,i)=>L(i).passed).length;
let V={phase:'home',i:0,page:0,streak:0,cons:0,q:null,hint:false,fb:null,err:'',sid:uid(),started:Date.now(),ok:0,bad:0,n:0,preview:false};

/* ====== отправка в таблицу ====== */
function report(){return LEVELS.map((l,i)=>{const o=L(i);
 const tg=Object.keys(o.tags).sort((a,b)=>o.tags[b]-o.tags[a]).slice(0,3).map(t=>`${t} ×${o.tags[t]}`).join('; ');
 const status=o.passed?'пройден':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—';
 return `${i+1}. ${l.t}: ${status}; верно ${o.ok}, неверно ${o.bad}, подсказок ${o.hints}, «не знаю» ${o.idk}, повторов объяснения ${o.reteach}${tg?'; ошибки: '+tg:''}`}).join('\n')}
function marks(){return LEVELS.map((_,i)=>`${i+1}${L(i).passed?'✓':L(i).stuck?'!':''}`).join(' ')}
function push(final){
 if(TEACHER||V.n===0)return;
 try{
  const done=passedCount()===LEVELS.length;
  const d={sid:V.sid,test:TITLE,name:st.name,kind:'тренажёр',started:V.started,
   status:final&&done?'завершено':'в процессе',progress:`${passedCount()}/${LEVELS.length}`,score:V.ok,max:V.ok+V.bad,grade:'',
   minutes:Math.round((Date.now()-V.started)/60000),bonus:`ступень ${V.i+1}`,tasks:marks(),report:report()};
  const bd=JSON.stringify(d);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:bd.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:bd}).catch(()=>{});
 }catch(e){}
}
addEventListener('pagehide',()=>{if(V.n>0)push(false)});

/* ====== разбор ошибок ====== */
function tagOf(q,u){
 if(u===null)return 'не знаю';
 if(q.type==='num'){
  if(q.tag){const t=q.tag(u);if(t)return t}
  if(u<0&&q.ans>=0)return 'отрицательный ответ';
  if(q.rad!==undefined&&u===q.rad)return 'не извлёк корень';
  if(q.rad!==undefined&&Math.abs(u-q.rad/2)<1e-9)return 'разделил пополам';
  if(q.rad!==undefined&&Number.isInteger(q.ans)&&q.ans>0&&u===q.ans*q.ans)return 'возвёл в квадрат вместо корня';
  return 'другая ошибка';
 }
 return q.etag||'другая ошибка';
}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');
 if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN}

/* ====== экраны ====== */
const app=h=>{document.getElementById('app').innerHTML=h};
const $=s=>document.querySelector(s);
function hdr(){return `<div class="muted">${esc(st.name||'')}${TEACHER?' · режим учителя (в таблицу не отправляется)':''}</div>`}
function render(){
 if(TEACHER&&!V.preview)return teacherScreen();
 if(!st.name)return nameScreen();
 ({home:homeScreen,learn:learnScreen,q:qScreen,done:doneScreen,reteach:reteachScreen,stuck:stuckScreen}[V.phase]||homeScreen)();
}
function nameScreen(){
 app(`<h1>Треугольники (ОГЭ №15)</h1><p class="muted">Тренажёр идёт по ступеням. Дальше можно пойти только после ${NEED} верных ответов подряд.</p>
 <p>Как тебя зовут?</p><input class="nm" id="nm" placeholder="Имя Фамилия" onkeydown="if(event.key==='Enter')setName()"><br><button class="btn" onclick="setName()">Начать</button><div class="bad" id="er"></div>`);
 const e=$('#nm');if(e)e.focus()}
function setName(){const v=$('#nm').value.trim();if(v.length<3){$('#er').textContent='Введи имя и фамилию.';return}st.name=v;save();home()}
function home(){V.phase='home';render()}
function homeScreen(){
 let h=hdr()+`<h1>Треугольники (ОГЭ №15)</h1><p class="muted">Пройдено ступеней: ${passedCount()} из ${LEVELS.length}. Чтобы пройти ступень, нужно ${NEED} верных ответов подряд.</p>`;
 LEVELS.forEach((l,i)=>{const o=L(i),op=isOpen(i);
  const s=o.passed?'пройдена':!op?'закрыта':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'открыта';
  h+=`<button class="row ${o.passed?'passed':''}" ${op?'':'disabled'} onclick="openLevel(${i})"><span>${i+1}. ${l.t}</span><span class="st">${s}</span></button>`});
 if(TEACHER)h+=`<button class="btn sec" onclick="V.preview=false;render()">Вернуться в кабинет учителя</button>`;
 app(h)}
function openLevel(i){if(!isOpen(i))return;V.i=i;V.page=0;V.streak=0;V.cons=0;V.fb=null;V.phase='learn';render()}
function learnScreen(){const l=LEVELS[V.i];
 let h=hdr()+`<h1>${V.i+1}. ${l.t}</h1><p class="muted">Прочитай по шагам. Потом ${NEED} заданий подряд без ошибок.</p>`;
 for(let k=0;k<=V.page;k++)h+=`<div class="card">${l.pages[k]}</div>`;
 h+=V.page<l.pages.length-1?`<button class="btn" onclick="nextPage()">Дальше</button>`:`<button class="btn" onclick="startQ()">Начать задания</button>`;
 h+=`<button class="btn sec" onclick="home()">К списку</button>`;
 app(h);window.scrollTo(0,document.body.scrollHeight)}
function nextPage(){V.page++;render()}
function startQ(){V.streak=0;V.cons=0;nextQ()}
function nextQ(){V.q=LEVELS[V.i].g();V.hint=false;V.fb=null;V.err='';V.phase='q';render()}
function qScreen(){const q=V.q,l=LEVELS[V.i];
 let dots='';for(let k=0;k<NEED;k++)dots+=`<span class="dot ${k<V.streak?'on':''}"></span>`;
 let h=hdr()+`<h2>${V.i+1}. ${l.t}</h2><div class="dots">${dots} <span class="muted">${V.streak} из ${NEED}</span></div>
 <div class="muted">${q.prompt}</div><div class="big">${q.q}</div>${q.pic||''}`;
 if(V.hint&&q.hint)h+=`<div class="hint"><b>Подсказка.</b> ${q.hint}</div>`;
 if(V.fb){
  h+=V.fb.ok?`<div class="card"><span class="ok">Верно.</span></div>`:`<div class="card"><span class="bad">${V.fb.idk?'Хорошо, что сказала честно.':'Неверно.'}</span> ${q.why}<div class="muted" style="margin-top:6px">Серия обнулена. Следующее задание будет новым.</div></div>`;
  h+=`<button class="btn" id="nx" onclick="afterFb()">Дальше</button>`;
 }else{
  if(q.type==='num')h+=`<input class="ans" id="ans" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter')submitNum()"><br><button class="btn" onclick="submitNum()">Проверить</button><div class="bad" style="margin-top:8px">${V.err}</div>`;
  else h+=q.options.map((o,i)=>`<button class="opt" onclick="pickOpt(${i})">${o}</button>`).join('');
  h+=`<div>`+(q.hint&&!V.hint?`<button class="btn sec" onclick="useHint()">Подсказка</button>`:'')+`<button class="btn sec" onclick="idk()">Не знаю</button><button class="btn sec" onclick="exitLevel()">К списку</button></div>`;
 }
 app(h);const a=$('#ans');if(a)a.focus();const n=$('#nx');if(n)n.focus()}
function useHint(){if(!V.hint){V.hint=true;L(V.i).hints++;save()}render()}
function exitLevel(){push(false);home()}
function answered(ok,u){
 const o=L(V.i);V.n++;
 if(ok){o.ok++;V.ok++;V.streak++;V.cons=0;
  if(V.streak>=NEED){o.passed=true;save();push(true);V.phase='done';render();return}
  V.fb={ok:true}}
 else{o.bad++;V.bad++;V.streak=0;V.cons++;const t=tagOf(V.q,u);o.tags[t]=(o.tags[t]||0)+1;V.fb={ok:false,idk:u===null};if(u===null)o.idk++}
 save();if(V.n%PUSH_EVERY===0)push(false);render()}
function submitNum(){const u=parseNum($('#ans').value);
 if(isNaN(u)){V.err='Введи число (например 7, 0,5 или 3/4).';render();return}
 answered(Math.abs(u-V.q.ans)<1e-9,u)}
function pickOpt(i){answered(V.q.options[i]===V.q.correct,V.q.options[i])}
function idk(){answered(false,null)}
function afterFb(){
 if(!V.fb.ok&&V.cons>=RETEACH_AFTER){const o=L(V.i);o.reteach++;V.cons=0;
  if(o.reteach>=STUCK_AFTER){o.stuck=true;save();push(false);V.phase='stuck';render();return}
  save();V.phase='reteach';render();return}
 nextQ()}
function reteachScreen(){app(hdr()+`<h2>Давай ещё раз посмотрим объяснение</h2><div class="card"><p>Несколько ответов подряд не получились. Это нормально: значит, объяснение надо прочитать ещё раз, не торопясь.</p></div><button class="btn" onclick="V.page=0;V.phase='learn';render()">Смотреть объяснение</button>`)}
function stuckScreen(){app(hdr()+`<h2>Стоп</h2><div class="card"><p>Здесь стало трудно, и это не страшно. Эту ступень лучше разобрать вместе с учителем. Результат уже отправлен Лилии.</p><p>Скажи, на каком месте перестало быть понятно.</p></div><button class="btn" onclick="home()">К списку</button><button class="btn sec" onclick="V.page=0;V.cons=0;V.phase='learn';render()">Ещё раз объяснение</button>`)}
function doneScreen(){const last=V.i===LEVELS.length-1;
 app(hdr()+`<h2>Ступень пройдена</h2><div class="card"><p><b>${V.i+1}. ${LEVELS[V.i].t}</b>: ${NEED} верных ответов подряд. Это настоящая работа.</p><p class="muted">Результат отправлен Лилии.</p></div>`+
 (last?`<p>Это была последняя ступень. Тренажёр пройден.</p><button class="btn" onclick="home()">К списку</button>`:`<button class="btn" onclick="openLevel(${V.i+1})">Следующая ступень</button><button class="btn sec" onclick="home()">К списку</button>`))}

/* ====== режим учителя ====== */
function teacherScreen(){
 const base=location.href.split('#')[0];
 let h=`<h1>Кабинет учителя</h1><p class="muted">Данные этого устройства. С этого экрана в таблицу ничего не отправляется.</p>
 <h2>Ссылка для ученика</h2><input class="nm" id="tn" placeholder="Имя Фамилия"><p class="link" id="tl"></p>
 <h2>Прогресс на этом устройстве</h2><table class="rep"><tr><th>№</th><th>Ступень</th><th>Статус</th><th>Верно</th><th>Неверно</th><th>Подск.</th><th>Не знаю</th><th></th></tr>`;
 LEVELS.forEach((l,i)=>{const o=L(i);
  h+=`<tr><td>${i+1}</td><td>${l.t}</td><td>${o.passed?'пройдена':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—'}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.hints}</td><td>${o.idk}</td><td><button class="btn sm sec" onclick="tPass(${i})">засчитать</button><button class="btn sm sec" onclick="tReset(${i})">сбросить</button></td></tr>`});
 h+=`</table><button class="btn sec" onclick="tOpenAll()">${st.openAll?'Закрыть ступени по порядку':'Открыть все ступени'}</button>
 <button class="btn" onclick="V.preview=true;home()">Пройти как ученик</button>
 <button class="btn sec" onclick="tWipe()">Стереть всё на этом устройстве</button>`;
 app(h);
 $('#tn').oninput=e=>{const v=e.target.value.trim();$('#tl').textContent=v?base+'#u'+enc(v):''}}
function tPass(i){L(i).passed=true;save();render()}
function tReset(i){st.lv[i]=undefined;delete st.lv[i];save();render()}
function tOpenAll(){st.openAll=!st.openAll;save();render()}
function tWipe(){if(confirm('Стереть весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);st=load();render()}}

render();
//ENGINE-END
</script>
</body>
