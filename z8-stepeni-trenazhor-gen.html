<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Степени: тренажёр, новые числа</title><style>
:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-style:normal}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--apricot);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--sage)}
.opt.ok{border-color:var(--ok);background:rgba(155,211,160,.12)}
.opt.bad{border-color:var(--bad);background:rgba(240,154,138,.12)}
.opt[disabled]{cursor:default}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:8px}
.btn[disabled]{opacity:.45;cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-left:3px solid var(--blue);background:rgba(125,162,255,.08);border-radius:6px;font-size:15px}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:160px}
.cond{background:#0f1f19;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.done{border-left:3px solid var(--ok);padding:8px 14px;margin:8px 0;background:rgba(155,211,160,.08);border-radius:6px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--cream);color:var(--bg);font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--butter);margin:4px 0}
sup{font-size:70%;line-height:0;vertical-align:super;white-space:nowrap}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}.fr i{display:block;font-style:normal;padding:0 4px;border-bottom:1px solid currentColor;line-height:1.25}.fr b{display:block;font-weight:normal;padding:0 4px;line-height:1.25}
.rt{white-space:nowrap}.ro{border-top:1px solid currentColor;padding:0 2px;margin-left:1px}
</style></head><body><div class="wrap"><a href="z8-stepeni.html" style="color:var(--blue);font-size:14px;text-decoration:none">← Степени (задание 8)</a><h1 style="margin-top:10px">Тренажёр: новые числа каждый раз</h1><p class="sub">Восемь типов заданий 8. Ответ можно писать десятичной дробью (3,375) или обыкновенной (27/8).</p><div class="tabs" id="tabs"></div><p class="sub" id="stat">Верно с первой попытки: 0 из 0</p><div id="box"></div></div><script>const MN='−';
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const bgcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
const rd=(n,d=1n)=>{n=BigInt(n);d=BigInt(d);if(d<0n){n=-n;d=-d}const g=bgcd(n,d)||1n;return [n/g,d/g]};
const mul=(a,b)=>rd(a[0]*b[0],a[1]*b[1]);
const dv=(a,b)=>rd(a[0]*b[1],a[1]*b[0]);
const add=(a,b)=>rd(a[0]*b[1]+b[0]*a[1],a[1]*b[1]);
const sub=(a,b)=>rd(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);
const pw=(x,k)=>{if(k>=0)return rd(x[0]**BigInt(k),x[1]**BigInt(k));return rd(x[1]**BigInt(-k),x[0]**BigInt(-k))};
const fl=x=>Number(x[0])/Number(x[1]);
const term=f=>{let d=f[1];while(d%2n===0n)d/=2n;while(d%5n===0n)d/=5n;return d===1n};
const dstr=f=>{let n=f[0],d=f[1];const ng=n<0n;if(ng)n=-n;let s=String(n/d);let r=n%d,k=0;if(r){s+=',';while(r&&k<30){r*=10n;s+=String(r/d);r%=d;k++}}return (ng?MN:'')+s};
const S=n=>(n<0?MN+(-n):String(n));
const SP=(b,e)=>b+'<sup>'+S(e)+'</sup>';
const NB=a=>a<0?'('+S(a)+')':String(a);
const par=n=>n<0?'('+S(n)+')':S(n);
const FR=(n,d)=>'<span class="fr"><i>'+n+'</i><b>'+d+'</b></span>';
const RT=x=>'<span class="rt">√<span class="ro">'+x+'</span></span>';
const ans=v=>'Ответ: '+dstr(v)+'.';
const dr=s=>{const [i,f='']=s.split(',');return rd(BigInt(i+f),10n**BigInt(f.length))};
const pf=(f)=>Object.keys(f).map(Number).map(p=>f[p]===1?String(p):SP(p,f[p])).join(' · ');
const T=[
 {name:'Свойства степени: одно основание',hint:'Основание одно. При умножении показатели складывают, при делении вычитают. Следите за знаком: m − (−n) = m + n.',
  gen(){for(;;){const a=pick([2,3,5,7,10]),m=R(-4,7),n=R(-4,7),k=R(-4,7);const p=m+n-k;
   if(m===0||n===0||k===0||p<-3||p>6||(p<0&&a!==2&&a!==5&&a!==10)||Math.pow(a,p)>200000)continue;
   const v=pw(rd(a),p);
   return{html:'('+SP(a,m)+' · '+SP(a,n)+') : '+SP(a,k),v,chk:Math.pow(a,m)*Math.pow(a,n)/Math.pow(a,k),
    sol:'Показатель: '+S(m)+' + '+par(n)+' − '+par(k)+' = '+S(p)+'. '+SP(a,p)+' = '+dstr(v)+'. '+ans(v)}}}},
 {name:'Приведение к одному основанию',hint:'Запишите каждое основание степенью одного числа (4 = 2², 8 = 2³, 9 = 3², 25 = 5²). При возведении степени в степень показатели перемножают.',
  gen(){const FAM=[[2,[[4,2],[8,3],[16,4],[32,5]]],[3,[[9,2],[27,3],[81,4]]],[5,[[25,2],[125,3]]]];
   for(;;){const [g,L]=pick(FAM);const [b1,e1]=pick(L),[b2,e2]=pick(L),[b3,e3]=pick(L);const m=R(-3,4),n=R(-3,4),k=R(-3,4);
   const p=e1*m+e2*n-e3*k;if(m===0||n===0||k===0||p<-3||p>7||(p<0&&g===3)||b1===b2&&b2===b3)continue;
   const v=pw(rd(g),p);
   return{html:'('+SP(b1,m)+' · '+SP(b2,n)+') : '+SP(b3,k),v,chk:Math.pow(b1,m)*Math.pow(b2,n)/Math.pow(b3,k),
    sol:'Все основания — степени числа '+g+': '+b1+' = '+SP(g,e1)+', '+b2+' = '+SP(g,e2)+', '+b3+' = '+SP(g,e3)+'. Показатель: '+e1+'·'+par(m)+' + '+e2+'·'+par(n)+' − '+e3+'·'+par(k)+' = '+S(p)+'. '+SP(g,p)+' = '+dstr(v)+'. '+ans(v)}}}},
 {name:'Составные основания: разложение на простые множители',hint:'Разложите основание: 6 = 2·3, 12 = 2²·3, 18 = 2·3². Тогда A^m = (p·q)^m = p^m · q^m. Показатели каждого простого множителя собирайте отдельно.',
  gen(){const COMP=[[6,{2:1,3:1}],[12,{2:2,3:1}],[18,{2:1,3:2}],[24,{2:3,3:1}],[10,{2:1,5:1}],[20,{2:2,5:1}],[15,{3:1,5:1}],[36,{2:2,3:2}],[45,{3:2,5:1}],[50,{2:1,5:2}]];
   for(;;){const [A,f]=pick(COMP);const ps=Object.keys(f).map(Number);const p1=ps[0],p2=ps[1];const m=R(2,5);const a=R(1,8),b=R(1,8);
   const r1=f[p1]*m-a,r2=f[p2]*m-b;
   if(r1<-2||r1>6||r2<-2||r2>6||(r1<0&&p1!==2&&p1!==5)||(r2<0&&p2!==2&&p2!==5)||(r1===0&&r2===0))continue;
   const v=mul(pw(rd(p1),r1),pw(rd(p2),r2));if(fl(v)>100000)continue;
   return{html:SP(A,m)+' : ('+SP(p1,a)+' · '+SP(p2,b)+')',v,chk:Math.pow(A,m)/(Math.pow(p1,a)*Math.pow(p2,b)),
    sol:A+' = '+pf(f)+', поэтому '+SP(A,m)+' = '+pf(Object.fromEntries(ps.map(p=>[p,f[p]*m])))+'. Показатель числа '+p1+': '+(f[p1]*m)+' − '+a+' = '+S(r1)+'; числа '+p2+': '+(f[p2]*m)+' − '+b+' = '+S(r2)+'. Получаем '+SP(p1,r1)+' · '+SP(p2,r2)+' = '+dstr(v)+'. '+ans(v)}}}},
 {name:'Знаки и порядок действий',hint:'Сначала каждая степень отдельно: чётный показатель даёт плюс, нечётный минус. Минус перед степенью без скобок остаётся перед результатом. Потом умножение, потом сложение.',
  gen(){for(;;){const t=R(0,2);
   if(t===0){const a=R(2,4),b=R(2,4),m=R(2,4),n=R(2,3);const X=(-a)**m,Y=(-b)**n;const v=rd(X*Y);if(Math.abs(X*Y)>3000)continue;
    return{html:SP(NB(-a),m)+' · '+SP(NB(-b),n),v,chk:X*Y,sol:SP(NB(-a),m)+' = '+S(X)+', '+SP(NB(-b),n)+' = '+S(Y)+'. '+(((X<0)===(Y<0))?'Знаки одинаковые, результат положительный: ':'Знаки разные, результат отрицательный: ')+par(X)+' · '+par(Y)+' = '+S(X*Y)+'. '+ans(v)}}
   if(t===1){const a=R(2,4),m=R(2,3),n=R(2,3),k=R(2,5);const X=a**m,Y=(-a)**n;const val=-X+Y*k;const v=rd(val);
    return{html:MN+SP(a,m)+' + '+SP(NB(-a),n)+' · '+k,v,chk:val,sol:'Минус стоит перед степенью: '+MN+SP(a,m)+' = '+S(-X)+'. '+SP(NB(-a),n)+' = '+S(Y)+'. Умножение: '+par(Y)+' · '+k+' = '+S(Y*k)+'. Сложение: '+S(-X)+' + '+par(Y*k)+' = '+S(val)+'. '+ans(v)}}
   {const a=pick([2,4,5]),n=R(2,4),b=R(2,6),m=R(2,3);const v=mul(pw(rd(-a),-n),pw(rd(-b),m));if(Math.abs(fl(v))>5000)continue;
    const A=(-a)**n,B=(-b)**m;
    return{html:SP(NB(-a),-n)+' · '+SP(NB(-b),m),v,chk:Math.pow(-a,-n)*Math.pow(-b,m),sol:SP(NB(-a),-n)+' = '+FR(1,SP(NB(-a),n))+' = '+FR(1,S(A))+' = '+dstr(rd(1,A))+'. '+SP(NB(-b),m)+' = '+S(B)+'. Произведение: '+dstr(rd(1,A))+' · '+par(B)+' = '+dstr(v)+'. '+ans(v)}}}}},
 {name:'Нулевой и отрицательный показатель',hint:'a^(−n) = 1/a^n. Дробь с отрицательным показателем переворачивают: (p/q)^(−n) = (q/p)^n. Десятичные основания 0,2; 0,5; 0,25; 0,1 запишите дробями или степенями числа 2, 5, 10.',
  gen(){for(;;){const t=R(0,1);
   if(t===0){const p=pick([1,2,4,5,8,10]),q=pick([2,3,4,5,7]),n=R(2,3);if(bgcd(BigInt(p),BigInt(q))!==1n)continue;const v=pw(rd(p,q),-n);if(fl(v)>400)continue;
    return{html:'('+FR(p,q)+')<sup>'+MN+n+'</sup>',v,chk:Math.pow(p/q,-n),sol:'Дробь переворачиваем: ('+FR(p,q)+')<sup>'+MN+n+'</sup> = ('+FR(q,p)+')<sup>'+n+'</sup> = '+FR(Math.pow(q,n),Math.pow(p,n))+' = '+dstr(v)+'. '+ans(v)}}
   {const X=pick(['0,2','0,5','0,25','0,1']),m=R(2,3),j=R(1,3);const x=dr(X);const Y=pw(x,j);const v=mul(pw(x,-m),Y);const inv=dv(rd(1),x);
    if(fl(v)>500)continue;
    return{html:X+'<sup>'+MN+m+'</sup> · '+dstr(Y),v,chk:Math.pow(parseFloat(X.replace(',','.')),-m)*Math.pow(parseFloat(X.replace(',','.')),j),sol:X+' = '+FR(dstr(mul(x,rd(100))).replace(',','.')+(0?'':''),100).replace(/<i>.*?<\/i>/,'<i>'+(x[0]*(100n/x[1]))+'</i>')+' = '+FR(x[0],x[1])+', поэтому '+X+'<sup>'+MN+m+'</sup> = ('+FR(x[1],x[0])+')<sup>'+m+'</sup> = '+dstr(pw(inv,m))+'. Умножаем: '+dstr(pw(inv,m))+' · '+dstr(Y)+' = '+dstr(v)+'. '+ans(v)}}}}},
 {name:'Степень степени',hint:'(a^m)^n = a^(mn): показатели перемножают. Потом складывают или вычитают с оставшейся степенью.',
  gen(){for(;;){const a=pick([2,3,5,10]),m=R(-3,4),n=R(-3,4),k=R(-4,6),op=pick(['·',':']);
   if(m===0||n===0||k===0||m===1||n===1)continue;const p=op===':'?m*n-k:m*n+k;
   if(p<-3||p>6||(p<0&&a===3)||Math.abs(m*n)>9)continue;
   const v=pw(rd(a),p);const ch=op===':'?Math.pow(a,m*n)/Math.pow(a,k):Math.pow(a,m*n)*Math.pow(a,k);
   return{html:'('+SP(a,m)+')<sup>'+S(n)+'</sup> '+op+' '+SP(a,k),v,chk:ch,sol:'Показатели перемножаем: '+par(m)+' · '+par(n)+' = '+S(m*n)+'. Затем '+(op===':'?'вычитаем: '+S(m*n)+' − '+par(k):'складываем: '+S(m*n)+' + '+par(k))+' = '+S(p)+'. '+SP(a,p)+' = '+dstr(v)+'. '+ans(v)}}}},
 {name:'Корни и степени',hint:'(a√b)² = a²·b. √x·√y = √(xy). √(a^(2m)) = a^m. (√a + √b)(√a − √b) = a − b.',
  gen(){for(;;){const t=R(0,3);
   if(t===0){const a=R(2,6),b=pick([2,3,5,6,7]),c=R(2,30);const val=a*a*b-c;const v=rd(val);
    return{html:'('+a+RT(b)+')<sup>2</sup> '+MN+' '+c,v,chk:Math.pow(a*Math.sqrt(b),2)-c,sol:'('+a+RT(b)+')<sup>2</sup> = '+a+'<sup>2</sup> · ('+RT(b)+')<sup>2</sup> = '+(a*a)+' · '+b+' = '+(a*a*b)+'. Затем '+(a*a*b)+' − '+c+' = '+S(val)+'. '+ans(v)}}
   if(t===1){const k=pick([2,3,5,6,7]),s1=R(1,4),s2=R(1,4);const x=k*s1*s1,y=k*s2*s2;if(x===y)continue;const val=k*s1*s2;const v=rd(val);
    return{html:RT(x)+' · '+RT(y),v,chk:Math.sqrt(x)*Math.sqrt(y),sol:RT(x)+' · '+RT(y)+' = '+RT(x+' · '+y)+' = '+RT(x*y)+' = '+val+', так как '+val+'<sup>2</sup> = '+(x*y)+'. '+ans(v)}}
   if(t===2){const g=pick([[2,3],[2,5],[3,2],[3,5],[5,2],[5,3]]);const a=g[0],b=g[1],m=R(1,3),n=R(1,3);const val=a**m*b**n;const v=rd(val);
    return{html:RT(SP(a,2*m)+' · '+SP(b,2*n)),v,chk:Math.sqrt(Math.pow(a,2*m)*Math.pow(b,2*n)),sol:'Корень из степени: показатель делим пополам. '+RT(SP(a,2*m))+' = '+SP(a,m)+', '+RT(SP(b,2*n))+' = '+SP(b,n)+'. '+SP(a,m)+' · '+SP(b,n)+' = '+(a**m)+' · '+(b**n)+' = '+val+'. '+ans(v)}}
   {const a=R(5,40),b=R(2,a-1);const val=a-b;const v=rd(val);
    return{html:'('+RT(a)+' + '+RT(b)+')('+RT(a)+' '+MN+' '+RT(b)+')',v,chk:(Math.sqrt(a)+Math.sqrt(b))*(Math.sqrt(a)-Math.sqrt(b)),sol:'Разность квадратов: ('+RT(a)+' + '+RT(b)+')('+RT(a)+' '+MN+' '+RT(b)+') = ('+RT(a)+')<sup>2</sup> '+MN+' ('+RT(b)+')<sup>2</sup> = '+a+' '+MN+' '+b+' = '+val+'. '+ans(v)}}}}},
 {name:'Стандартный вид числа',hint:'Десятичные множители и степени десяти считайте отдельно. 10^m · 10^n = 10^(m+n), при делении показатели вычитают.',
  gen(){const X=['1,2','1,5','2,4','3,6','4,8','7,5','2,5','6'],Y=['2','4','5','2,5','0,5','8'],Z=['1,2','2','2,5','3','4','6','1,5'];
   for(;;){const x=pick(X),y=pick(Y),z=pick(Z);const m=R(-4,6),n=R(-4,6),p=R(-3,4);const k=m+n-p;
   const base=dv(mul(dr(x),dr(y)),dr(z));if(!term(base)||k<-3||k>5||m===0||n===0)continue;
   const v=mul(base,pw(rd(10),k));if(fl(v)>200000||fl(v)<0.001)continue;
   const num=x+' · '+SP(10,m)+' · '+y+' · '+SP(10,n),den=z+' · '+SP(10,p);
   return{html:FR(num,den),v,chk:parseFloat(x.replace(',','.'))*parseFloat(y.replace(',','.'))/parseFloat(z.replace(',','.'))*Math.pow(10,k),
    sol:'Числа: '+x+' · '+y+' = '+dstr(mul(dr(x),dr(y)))+'; затем '+dstr(mul(dr(x),dr(y)))+' : '+z+' = '+dstr(base)+'. Степени десяти: показатель '+S(m)+' + '+par(n)+' − '+par(p)+' = '+S(k)+'. Получаем '+dstr(base)+' · '+SP(10,k)+' = '+dstr(v)+'. '+ans(v)}}}}
];

function val(s){s=String(s).trim().replace(/[−–—]/g,'-').replace(',','.').replace(/\s+/g,' ');let m;
  if(m=s.match(/^(-?)(\d+) (\d+)\/(\d+)$/)){const v=+m[2]+(+m[3])/(+m[4]);return m[1]?-v:v}
  if(m=s.match(/^(-?\d+)\/(\d+)$/)){return (+m[1])/(+m[2])}
  if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);
  return NaN}
let cur=null,tries=0,ok=0,tot=0,mode=-1;
const box=document.getElementById('box');
function tabs(){const el=document.getElementById('tabs');el.innerHTML='';[['Все типы',-1]].concat(T.map((t,i)=>[t.name,i])).forEach(([n,k])=>{const b=document.createElement('button');b.textContent=n;if(k===mode)b.className='on';b.onclick=()=>{mode=k;tabs();nextTask()};el.appendChild(b)})}
function nextTask(){
  const t=T[mode<0?R(0,T.length-1):mode];cur=t.gen();cur.t=t;tries=0;
  box.innerHTML='<div class="card"><span class="tag">'+t.name+'</span><div class="cond"><b>Найдите значение выражения</b><br><span style="font-size:20px">'+cur.html+'</span></div>'
   +'<input class="num" id="in" autocomplete="off" placeholder="ответ"> <button class="btn" id="ck">Проверить</button>'
   +'<div id="fb"></div><div style="margin-top:10px"><button class="btn ghost" id="hb" style="margin-left:0">Подсказка</button><button class="btn ghost" id="sb">Показать решение</button><button class="btn ghost" id="nb">Другое задание</button></div></div>';
  const inp=document.getElementById('in');inp.focus();
  document.getElementById('ck').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
  document.getElementById('hb').onclick=()=>{document.getElementById('fb').innerHTML='<div class="hint">Подсказка: '+cur.t.hint+'</div>'};
  document.getElementById('sb').onclick=()=>{tot++;document.getElementById('fb').innerHTML='<div class="exp">'+cur.sol+'</div>';stat()};
  document.getElementById('nb').onclick=nextTask;
}
function check(){
  const v=document.getElementById('in').value;if(!v.trim())return;
  const x=val(v),y=fl(cur.v);
  if(!isNaN(x)&&Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(y))){tot++;if(tries===0)ok++;document.getElementById('fb').innerHTML='<div class="done">Верно. '+cur.sol+'</div><button class="btn" onclick="nextTask()">Следующее</button>';stat()}
  else{tries++;document.getElementById('fb').innerHTML='<div class="hint">'+(tries>1?'Ещё не так. Нажмите «Подсказка» или «Показать решение».':'Не так. Проверьте знаки показателей и порядок действий, затем попробуйте ещё раз.')+'</div>'}
}
function stat(){document.getElementById('stat').textContent='Верно с первой попытки: '+ok+' из '+tot}
tabs();nextTask();
</script></body></html>
