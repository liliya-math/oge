<script>
(function(){
"use strict";
var T=TrenCore,u=T.u;
function hint(t){ return '<span class="hint">'+t+'</span>'; }
function sq(n){ return n+u.sup(2); }

/* ---------- углы ---------- */
var NGON={4:"четырёхугольника",5:"пятиугольника",6:"шестиугольника",7:"семиугольника",8:"восьмиугольника",9:"девятиугольника",10:"десятиугольника",12:"двенадцатиугольника"};
var REG={5:"пятиугольника",6:"шестиугольника",8:"восьмиугольника",9:"девятиугольника",10:"десятиугольника",12:"двенадцатиугольника"};
function ang(q,a,calc,h){
  return {q:q,sm:true,sub:"Ответ в градусах",a:a,ans:String(a),rev:calc+" = <b>"+a+"°</b>"+hint(h)};
}
function angPool(){ return [
 {k:"adj",lab:"смежные углы",gen:function(){
   var x=u.ri(20,160); while(x===90) x=u.ri(20,160);
   return ang("Один из смежных углов равен "+x+"°. Найдите второй угол.",180-x,"180° − "+x+"°","Смежные углы в сумме дают 180°."); }},
 {k:"vert",lab:"вертикальные углы",gen:function(){
   var x=u.ri(20,160);
   if(u.rnd(2)) return ang("Углы A и B вертикальные, ∠A = "+x+"°. Найдите ∠B.",x,"∠B = ∠A","Вертикальные углы равны.");
   x=u.ri(15,80);
   return ang("Сумма двух вертикальных углов равна "+2*x+"°. Найдите один из них.",x,2*x+"° : 2","Вертикальные углы равны, поэтому каждый — половина суммы."); }},
 {k:"tri",lab:"сумма углов треугольника",gen:function(){
   var x=u.ri(25,85),y=u.ri(25,85); while(180-x-y<15) y=u.ri(25,85);
   return ang("В треугольнике два угла равны "+x+"° и "+y+"°. Найдите третий угол.",180-x-y,"180° − "+x+"° − "+y+"°","Сумма углов треугольника равна 180°."); }},
 {k:"rt",lab:"острые углы прямоугольного",gen:function(){
   var x=u.ri(15,75);
   return ang("Один из острых углов прямоугольного треугольника равен "+x+"°. Найдите другой острый угол.",90-x,"90° − "+x+"°","Острые углы прямоугольного треугольника в сумме дают 90°."); }},
 {k:"isot",lab:"равнобедренный: угол при вершине",gen:function(){
   var top=2*u.ri(10,50);
   return ang("В равнобедренном треугольнике угол при вершине равен "+top+"°. Найдите угол при основании.",(180-top)/2,"(180° − "+top+"°) : 2","Углы при основании равны, поэтому делим оставшееся пополам."); }},
 {k:"isob",lab:"равнобедренный: угол при основании",gen:function(){
   var b=u.ri(25,80);
   return ang("В равнобедренном треугольнике угол при основании равен "+b+"°. Найдите угол при вершине.",180-2*b,"180° − 2 · "+b+"°","Углов при основании два, и они равны."); }},
 {k:"ext",lab:"внешний угол треугольника",gen:function(){
   var x=u.ri(25,70),y=u.ri(25,70);
   return ang("Два угла треугольника равны "+x+"° и "+y+"°. Найдите внешний угол при третьей вершине.",x+y,x+"° + "+y+"°","Внешний угол равен сумме двух внутренних углов, не смежных с ним."); }},
 {k:"par",lab:"параллельные прямые и секущая",gen:function(){
   var v=u.rnd(3),x=u.ri(40,140); while(x===90) x=u.ri(40,140);
   if(v===0) return ang("Параллельные прямые пересечены секущей. Один из накрест лежащих углов равен "+x+"°. Найдите другой накрест лежащий угол.",x,"∠ = "+x+"°","Накрест лежащие углы при параллельных прямых равны.");
   if(v===1) return ang("Параллельные прямые пересечены секущей. Один из соответственных углов равен "+x+"°. Найдите другой соответственный угол.",x,"∠ = "+x+"°","Соответственные углы при параллельных прямых равны.");
   return ang("Параллельные прямые пересечены секущей. Один из односторонних углов равен "+x+"°. Найдите другой односторонний угол.",180-x,"180° − "+x+"°","Односторонние углы при параллельных прямых в сумме дают 180°."); }},
 {k:"para",lab:"углы параллелограмма",gen:function(){
   var x=u.ri(40,140); while(x===90) x=u.ri(40,140);
   if(u.rnd(2)) return ang("В параллелограмме один угол равен "+x+"°. Найдите соседний с ним угол.",180-x,"180° − "+x+"°","Соседние углы параллелограмма в сумме дают 180°.");
   return ang("В параллелограмме один угол равен "+x+"°. Найдите противоположный ему угол.",x,"∠ = "+x+"°","Противоположные углы параллелограмма равны."); }},
 {k:"insc",lab:"вписанный и центральный углы",gen:function(){
   var y=u.ri(15,80);
   if(u.rnd(2)) return ang("Центральный угол равен "+2*y+"° и опирается на ту же дугу, что и вписанный угол. Найдите вписанный угол.",y,2*y+"° : 2","Вписанный угол в два раза меньше центрального, опирающегося на ту же дугу.");
   return ang("Вписанный угол равен "+y+"°. Найдите центральный угол, опирающийся на ту же дугу.",2*y,"2 · "+y+"°","Центральный угол в два раза больше вписанного, опирающегося на ту же дугу."); }},
 {k:"poly",lab:"углы многоугольника",gen:function(){
   if(u.rnd(2)){ var n=u.pick([4,5,6,7,8,9,10,12]);
     return ang("Найдите сумму углов выпуклого "+NGON[n]+".",(n-2)*180,"("+n+" − 2) · 180°","Сумма углов выпуклого n-угольника равна (n − 2) · 180°."); }
   var m=u.pick([5,6,8,9,10,12]);
   return ang("Найдите угол правильного "+REG[m]+".",(m-2)*180/m,"(("+m+" − 2) · 180°) : "+m,"Сумму углов (n − 2) · 180° делим на количество углов, они равны."); }}
]; }

/* ---------- теорема Пифагора ---------- */
var TRI=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]];
function triple(maxC){
  var fit=TRI.filter(function(x){return x[2]<=maxC;}),t=u.pick(fit.length?fit:TRI),k=u.ri(1,Math.max(1,Math.floor(maxC/t[2])));
  var a=t[0]*k,b=t[1]*k,c=t[2]*k;
  return u.rnd(2)?[a,b,c]:[b,a,c];
}
function triSvg(a,b,c,unk){                       // a — вертикальный катет, b — горизонтальный, c — гипотенуза
  function lab(x,y,anc,val,isUnk){
    return '<text x="'+x+'" y="'+y+'" text-anchor="'+anc+'"'+(isUnk?' class="q" style="font-size:24px;font-weight:800"':'')+'>'+(isUnk?"?":val)+'</text>';
  }
  return '<svg class="fig" viewBox="0 0 260 180" width="260" role="img" aria-label="Прямоугольный треугольник">'
    +'<path class="fl ln" d="M40 145 L220 145 L40 25 Z"/>'
    +'<path class="rt" d="M40 127 H58 V145"/>'
    +lab(30,92,"end",a,unk==="a")+lab(130,172,"middle",b,unk==="b")+lab(146,76,"start",c,unk==="c")
    +'</svg>';
}
function pyth(q,sub,a,calc,h){ return {q:q,sm:true,sub:sub,a:a,ans:String(a),rev:calc+" = <b>"+a+"</b>"+(h?hint(h):"")}; }
function pythPool(){ return [
 {k:"hyp",lab:"гипотенуза по катетам",gen:function(){
   var t=triple(60),a=t[0],b=t[1],c=t[2];
   return {q:triSvg(a,b,c,"c"),sub:"Найдите гипотенузу (отмечена «?»)",a:c,ans:String(c),
     rev:"c"+u.sup(2)+" = "+sq(a)+" + "+sq(b)+" = "+(a*a)+" + "+(b*b)+" = "+(c*c)+", c = <b>"+c+"</b>"+hint("Гипотенуза — сторона напротив прямого угла, она самая длинная.")}; }},
 {k:"leg",lab:"катет по гипотенузе и катету",gen:function(){
   var t=triple(60),a=t[0],b=t[1],c=t[2],vert=u.rnd(2),x=vert?a:b,known=vert?b:a;
   return {q:triSvg(vert?"?":a,vert?b:"?",c,vert?"a":"b"),sub:"Найдите катет (отмечен «?»)",a:x,ans:String(x),
     rev:"x"+u.sup(2)+" = "+sq(c)+" − "+sq(known)+" = "+(c*c)+" − "+(known*known)+" = "+(x*x)+", x = <b>"+x+"</b>"+hint("Катет находим вычитанием: катет² = гипотенуза² − другой катет².")}; }},
 {k:"rect",lab:"диагональ прямоугольника",gen:function(){
   var t=triple(60),a=t[0],b=t[1],c=t[2];
   return pyth("Стороны прямоугольника равны "+a+" и "+b+". Найдите его диагональ.","",c,
     "d"+u.sup(2)+" = "+sq(a)+" + "+sq(b)+" = "+(c*c)+", d","Диагональ делит прямоугольник на два прямоугольных треугольника."); }},
 {k:"iso",lab:"высота равнобедренного треугольника",gen:function(){
   var t=triple(60),h=t[1],half=t[0],c=t[2];
   return pyth("Основание равнобедренного треугольника равно "+2*half+", боковая сторона равна "+c+". Найдите высоту, проведённую к основанию.","",h,
     "h"+u.sup(2)+" = "+sq(c)+" − "+sq(half)+" = "+(h*h)+", h","Высота к основанию делит его пополам, получается прямоугольный треугольник."); }},
 {k:"lad",lab:"лестница у стены",gen:function(){
   var t=triple(40),a=t[0],b=t[1],c=t[2];
   if(u.rnd(2)) return pyth("Лестница длиной "+c+" м приставлена к вертикальной стене. Нижний конец отстоит от стены на "+b+" м. На какой высоте (в метрах) находится верхний конец?","",a,
     "h"+u.sup(2)+" = "+sq(c)+" − "+sq(b)+" = "+(a*a)+", h","Лестница — гипотенуза, стена и земля — катеты.");
   return pyth("Столб высотой "+a+" м укреплён растяжкой, которая крепится к вершине и к земле на расстоянии "+b+" м от основания. Найдите длину растяжки в метрах.","",c,
     "l"+u.sup(2)+" = "+sq(a)+" + "+sq(b)+" = "+(c*c)+", l","Растяжка — гипотенуза."); }},
 {k:"dist",lab:"расстояние между точками",gen:function(){
   var t=triple(20),dx=t[0],dy=t[1],c=t[2];
   var x1=u.ri(-6,3),y1=u.ri(-6,3),x2=x1+(u.rnd(2)?dx:-dx),y2=y1+(u.rnd(2)?dy:-dy);
   return pyth("Найдите расстояние между точками A("+u.n(x1)+"; "+u.n(y1)+") и B("+u.n(x2)+"; "+u.n(y2)+").","",c,
     "AB"+u.sup(2)+" = "+sq(dx)+" + "+sq(dy)+" = "+(c*c)+", AB","Разности координат — катеты прямоугольного треугольника: |x₂ − x₁| = "+dx+", |y₂ − y₁| = "+dy+"."); }},
 {k:"rh",lab:"сторона ромба по диагоналям",gen:function(){
   var t=triple(30),p=t[0],q=t[1],c=t[2];
   return pyth("Диагонали ромба равны "+2*p+" и "+2*q+". Найдите сторону ромба.","",c,
     "a"+u.sup(2)+" = "+sq(p)+" + "+sq(q)+" = "+(c*c)+", a","Диагонали ромба перпендикулярны и точкой пересечения делятся пополам."); }}
]; }

/* ---------- площади ---------- */
function area(q,a,calc,h){ return {q:q,sm:true,sub:"Ответ — число",a:a,ans:String(a),rev:calc+" = <b>"+a+"</b>"+(h?hint(h):"")}; }
function areaPool(){ return [
 {k:"rect",lab:"прямоугольник и квадрат",gen:function(){
   if(u.rnd(2)){ var a=u.ri(3,15),b=u.ri(3,15); while(b===a) b=u.ri(3,15);
     return area("Стороны прямоугольника равны "+a+" и "+b+". Найдите его площадь.",a*b,"S = "+a+" · "+b,"S = ab"); }
   var s=u.ri(3,12);
   return area("Периметр квадрата равен "+4*s+". Найдите его площадь.",s*s,"сторона "+4*s+" : 4 = "+s+", S = "+sq(s),"Сначала находим сторону квадрата."); }},
 {k:"tri",lab:"треугольник: основание и высота",gen:function(){
   var a=u.ri(4,20),h=u.ri(3,14); if(a%2&&h%2) a++;
   return area("Основание треугольника равно "+a+", высота, проведённая к нему, равна "+h+". Найдите площадь.",a*h/2,"S = "+u.frac(1,2)+" · "+a+" · "+h,"S = ½ · основание · высота"); }},
 {k:"rtri",lab:"прямоугольный треугольник",gen:function(){
   var a=u.ri(3,15),b=u.ri(3,15); if(a%2&&b%2) b++;
   return area("Катеты прямоугольного треугольника равны "+a+" и "+b+". Найдите его площадь.",a*b/2,"S = "+u.frac(1,2)+" · "+a+" · "+b,"Один катет — основание, другой — высота."); }},
 {k:"par",lab:"параллелограмм",gen:function(){
   var a=u.ri(4,15),h=u.ri(3,12);
   return area("Сторона параллелограмма равна "+a+", высота, проведённая к ней, равна "+h+". Найдите площадь.",a*h,"S = "+a+" · "+h,"S = сторона · высота, проведённая к ней"); }},
 {k:"trap",lab:"трапеция",gen:function(){
   var a=u.ri(3,14),b=u.ri(3,14),h; while(b===a) b=u.ri(3,14);
   h=((a+b)%2)?2*u.ri(2,6):u.ri(3,10);
   return area("Основания трапеции равны "+a+" и "+b+", высота равна "+h+". Найдите площадь трапеции.",(a+b)*h/2,"S = "+u.frac("("+a+" + "+b+")","2")+" · "+h,"S = полусумма оснований · высота"); }},
 {k:"rh",lab:"ромб по диагоналям",gen:function(){
   var d1=u.ri(4,20),d2=u.ri(4,20); if(d1%2&&d2%2) d2++;
   return area("Диагонали ромба равны "+d1+" и "+d2+". Найдите площадь ромба.",d1*d2/2,"S = "+u.frac(1,2)+" · "+d1+" · "+d2,"S = половина произведения диагоналей"); }},
 {k:"sin",lab:"две стороны и угол",gen:function(){
   var a=2*u.ri(2,8),b=2*u.ri(2,8),al=u.pick([30,150]);
   return area("Две стороны треугольника равны "+a+" и "+b+", угол между ними равен "+al+"°. Найдите площадь треугольника.",a*b/4,"S = "+u.frac(1,2)+" · "+a+" · "+b+" · "+u.frac(1,2),"S = ½ · a · b · sin α, а sin 30° = sin 150° = ½"); }},
 {k:"circ",lab:"круг (ответ в долях π)",gen:function(){
   var r=u.ri(2,12),v=u.rnd(3);
   if(v===0) return area("Радиус круга равен "+r+". Найдите площадь круга, делённую на π.",r*r,"S : π = "+sq(r),"S = πr²");
   if(v===1) return area("Диаметр круга равен "+2*r+". Найдите площадь круга, делённую на π.",r*r,"радиус "+2*r+" : 2 = "+r+", S : π = "+sq(r),"S = πr², радиус вдвое меньше диаметра");
   return area("Длина окружности равна "+2*r+"π. Найдите площадь круга, делённую на π.",r*r,"C = 2πr, r = "+r+", S : π = "+sq(r),"Сначала найди радиус из длины окружности."); }},
 {k:"inv",lab:"найти сторону по площади",gen:function(){
   var v=u.rnd(3);
   if(v===0){ var a=u.ri(3,12),b=u.ri(3,12);
     return area("Площадь прямоугольника равна "+a*b+", одна из сторон равна "+a+". Найдите другую сторону.",b,a*b+" : "+a,"S = ab, значит b = S : a"); }
   if(v===1){ var c=u.ri(4,16),h=u.ri(3,10);
     return area("Площадь треугольника равна "+c*h+", основание равно "+2*c+". Найдите высоту, проведённую к основанию.",h,"h = 2S : a = "+2*c*h+" : "+2*c,"S = ½ · a · h, значит h = 2S : a"); }
   var e=u.ri(4,12),k=u.ri(3,10);
   return area("Площадь параллелограмма равна "+e*k+", одна из сторон равна "+e+". Найдите высоту, проведённую к этой стороне.",k,e*k+" : "+e,"S = a · h, значит h = S : a"); }}
]; }

/* ---------- средние линии, медианы, катет против 30° ---------- */
function ln(q,a,calc,h){ return {q:q,sm:true,sub:"Ответ — число",a:a,ans:String(a),rev:calc+" = <b>"+a+"</b>"+hint(h)}; }
function linesPool(){ return [
 {k:"mt",lab:"средняя линия треугольника",gen:function(){
   var x=u.ri(3,14);
   if(u.rnd(2)) return ln("Сторона треугольника равна "+2*x+". Найдите среднюю линию, параллельную этой стороне.",x,2*x+" : 2","Средняя линия треугольника вдвое короче параллельной ей стороны.");
   return ln("Средняя линия треугольника равна "+x+". Найдите сторону, которой она параллельна.",2*x,"2 · "+x,"Средняя линия треугольника вдвое короче параллельной ей стороны."); }},
 {k:"mtr",lab:"средняя линия трапеции",gen:function(){
   if(u.rnd(2)){ var a=u.ri(3,15),b=u.ri(3,15); while(b===a||(a+b)%2) b=u.ri(3,15);
     return ln("Основания трапеции равны "+a+" и "+b+". Найдите её среднюю линию.",(a+b)/2,"("+a+" + "+b+") : 2","Средняя линия трапеции равна полусумме оснований."); }
   var m=u.ri(5,15),a2=u.ri(2,2*m-2); while(a2===m) a2=u.ri(2,2*m-2);
   return ln("Средняя линия трапеции равна "+m+", одно из оснований равно "+a2+". Найдите другое основание.",2*m-a2,"2 · "+m+" − "+a2,"Сумма оснований вдвое больше средней линии."); }},
 {k:"med",lab:"медиана к гипотенузе",gen:function(){
   var x=u.ri(3,15);
   if(u.rnd(2)) return ln("В прямоугольном треугольнике гипотенуза равна "+2*x+". Найдите медиану, проведённую к гипотенузе.",x,2*x+" : 2","Медиана к гипотенузе равна её половине.");
   return ln("В прямоугольном треугольнике медиана, проведённая к гипотенузе, равна "+x+". Найдите гипотенузу.",2*x,"2 · "+x,"Медиана к гипотенузе равна её половине."); }},
 {k:"mp",lab:"периметр серединного треугольника",gen:function(){
   var x,y,z;
