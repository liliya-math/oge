<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест: системы уравнений</title><style>
:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-style:normal}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--apricot);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--sage)}
.opt.ok{border-color:var(--ok);background:rgba(155,211,160,.12)}
.opt.bad{border-color:var(--bad);background:rgba(240,154,138,.12)}
.opt[disabled]{cursor:default}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:8px}
.btn[disabled]{opacity:.45;cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-left:3px solid var(--blue);background:rgba(125,162,255,.08);border-radius:6px;font-size:15px}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:160px}
.cond{background:#0f1f19;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.done{border-left:3px solid var(--ok);padding:8px 14px;margin:8px 0;background:rgba(155,211,160,.08);border-radius:6px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--cream);color:var(--bg);font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--butter);margin:4px 0}


:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
a{color:var(--blue)}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--cream);color:var(--bg);font-weight:600}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.cond{font-size:18px;margin:6px 0 14px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:170px}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
.ok{border-left:3px solid var(--ok);background:rgba(155,211,160,.1);padding:10px 14px;border-radius:6px;margin-top:10px}
.bad{border-left:3px solid var(--bad);background:rgba(240,154,138,.1);padding:10px 14px;border-radius:6px;margin-top:10px}
.sol{border-left:3px solid var(--blue);background:rgba(125,162,255,.08);padding:10px 14px;border-radius:6px;margin-top:10px;font-size:15px}
.sol p{margin:6px 0}
.stat{color:var(--muted);font-size:14px}

.sys{display:inline-flex;align-items:center;vertical-align:middle;margin:2px 6px}
.sys .br{align-self:stretch;width:7px;border:2px solid currentColor;border-right:0;border-radius:9px 0 0 9px;margin-right:8px}
.sys .rows{display:flex;flex-direction:column;gap:3px;text-align:left}
.sys .rows span{white-space:nowrap}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}
.fr i{display:block;font-style:normal;padding:0 3px;border-bottom:1px solid currentColor;line-height:1.2}

.cond{overflow-x:auto}
.links a{display:inline-block;margin:4px 10px 0 0}
@media(max-width:480px){.sys .rows span{white-space:normal}}
</style></head><body><div class="wrap"><p class="sub"><a href="z20-sistemy.html" style="color:#7da2ff">← Системы уравнений (№20)</a></p><h1>Системы уравнений: тест</h1><p class="sub">10 вопросов. После каждого ответа появляется разбор.</p><div class="bar"><i id="pb"></i></div><div id="box"></div></div><script>const Q=[["Что называется решением системы двух уравнений с двумя переменными?", ["Пара значений переменных, обращающая каждое уравнение системы в верное равенство", "Значение одной переменной, при котором верно первое уравнение", "Число, равное сумме x и y", "Любая пара, удовлетворяющая хотя бы одному уравнению"], 0, "Решение системы — пара (x; y), которая подходит сразу обоим уравнениям."], ["Является ли пара (2; 1) решением системы x + y = 3, x² + y² = 5?", ["Да, пара подходит обоим уравнениям", "Нет, подходит только первому", "Нет, подходит только второму", "Нет, не подходит ни одному"], 0, "2 + 1 = 3 и 2² + 1² = 5: оба равенства верны."], ["Какой способ удобнее для системы x − y = 1, x² + y² = 13?", ["Подстановка: x = y + 1 подставить во второе уравнение", "Сложение уравнений без преобразований", "Графический способ с точным ответом", "Деление уравнений друг на друга"], 0, "Первое уравнение линейное, из него выражаем x = y + 1 и подставляем: получится квадратное уравнение относительно y."], ["Сколько решений имеет система x² + y² = 25, x = 7?", ["Ни одного", "Одно", "Два", "Четыре"], 0, "При x = 7 получаем y² = 25 − 49 = −24. Квадрат не может быть отрицательным, решений нет."], ["Решите систему x + y = 5, x − y = 1.", ["(3; 2)", "(2; 3)", "(4; 1)", "(3; −2)"], 0, "Складываем: 2x = 6, x = 3. Тогда y = 5 − 3 = 2. Пара (3; 2)."], ["Сколько решений имеет система x² + y² = 17, x² − y² = 15?", ["Четыре", "Два", "Одно", "Ни одного"], 0, "Складываем: 2x² = 32, x² = 16, x = ±4. Вычитаем: 2y² = 2, y² = 1, y = ±1. Все 4 сочетания знаков подходят: (4; 1), (4; −1), (−4; 1), (−4; −1)."], ["Какие пары являются решениями системы x + y = 7, xy = 12?", ["(3; 4) и (4; 3)", "(3; 4)", "(−3; −4) и (−4; −3)", "(12; −5) и (−5; 12)"], 0, "x и y — корни t² − 7t + 12 = 0, то есть 3 и 4. Подходят обе пары: (3; 4) и (4; 3)."], ["Сколько решений имеет система y = x², y = 2x − 1?", ["Одно", "Два", "Ни одного", "Бесконечно много"], 0, "x² = 2x − 1, (x − 1)² = 0, x = 1, y = 1. Прямая касается параболы: одна общая точка."], ["Решите систему (x − 1)(y − 2) = 0, x + y = 4.", ["(1; 3) и (2; 2)", "(1; 3)", "(2; 2)", "(1; 2)"], 0, "Ветка x = 1: y = 3. Ветка y = 2: x = 2. Обе ветки дают решения: (1; 3) и (2; 2)."], ["Из первого шага получили x = 2 и x = −3. Что нужно сделать дальше?", ["Найти y для каждого x и записать пары", "Записать в ответ x = 2; x = −3", "Выбрать больший x и записать его", "Ничего: решение закончено"], 0, "Решение системы — пара. Для каждого найденного x находим y и записываем (x; y)."]];
let i=0,score=0,wrong=[];
const box=document.getElementById('box'),pb=document.getElementById('pb');
function shuffle(a){const r=a.map((v,k)=>[v,k]);for(let j=r.length-1;j>0;j--){const m=Math.floor(Math.random()*(j+1));[r[j],r[m]]=[r[m],r[j]]}return r}
function show(){
  if(i>=Q.length){return end()}
  pb.style.width=(i/Q.length*100)+'%';
  const [q,opts,ans,exp]=Q[i];
  box.innerHTML='<div class="card"><span class="tag">Вопрос '+(i+1)+' из '+Q.length+'</span><p class="q">'+q+'</p><div id="o"></div><div id="e"></div></div>';
  const o=document.getElementById('o');
  shuffle(opts).forEach(([t,k])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,k===ans,exp);o.appendChild(b);b.dataset.k=k});
}
function pick(b,ok,exp){
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===Q[i][2])x.classList.add('ok')});
  if(ok){score++}else{b.classList.add('bad');wrong.push(i+1)}
  document.getElementById('e').innerHTML='<div class="exp">'+(ok?'Верно. ':'Неверно. ')+exp+'</div><button class="btn" onclick="i++;show()">'+(i===Q.length-1?'Результат':'Дальше')+'</button>';
}
function end(){
  pb.style.width='100%';
  const msg=score>=9?'Тема усвоена. Можно переходить к задачам №20.':score>=7?'Хороший результат. Повторите вопросы, где были ошибки.':score>=5?'Есть пробелы. Вернитесь к теории и разберите ошибки.':'Нужно повторить теорию и типы задач с начала.';
  box.innerHTML='<div class="card"><span class="tag">Результат</span><div class="big">'+score+' из '+Q.length+'</div><p>'+msg+'</p>'+(wrong.length?'<p class="sub">Ошибки в вопросах: '+wrong.join(', ')+'</p>':'')+'<button class="btn" onclick="i=0;score=0;wrong=[];show()">Пройти заново</button></div>';
}
show();
</script></body></html>
