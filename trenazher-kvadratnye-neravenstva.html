<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211e">
<title>Квадратные неравенства: тренажёр</title>
<style>
:root{--bg:#14211e;--card:rgba(243,236,226,.07);--line:rgba(243,236,226,.16);--fg:#f3ece2;--muted:rgba(243,236,226,.62);--cobalt:#1747c9;--apricot:#f2905e;--yellow:#f5dc6a;--mint:#8fd9b0;--miss:#ff8f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.25}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.big{font-size:32px;margin:8px 0 14px;line-height:1.7}
.rad{position:relative;display:inline-block;white-space:nowrap;vertical-align:baseline;padding-left:.6em;line-height:1.2}
.rs{position:absolute;left:0;top:0;width:.6em;height:100%;overflow:visible;fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:miter;stroke-linecap:butt}
.ov{display:inline-block;border-top:2px solid var(--fg);padding:.06em 4px 0 1px;margin-left:-1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--fg);padding:0 4px}
input.ans{font:inherit;font-size:26px;width:100%;max-width:240px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
input.ans:focus,input.nm:focus{outline:2px solid var(--yellow);outline-offset:1px}
input.nm{font:inherit;font-size:20px;width:100%;max-width:360px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(243,236,226,.08);color:var(--fg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:var(--cobalt);color:#fff;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px 4px 2px 0}
.opt{font:inherit;font-size:20px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:rgba(243,236,226,.06);color:var(--fg);cursor:pointer;margin:0 10px 10px 0}
.opt:active{background:rgba(243,236,226,.16)}
.dots{margin:4px 0 10px}
.dot{display:inline-block;width:15px;height:15px;border:2px solid var(--fg);border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--mint);border-color:var(--mint)}
.ok{color:var(--mint);font-weight:700}
.bad{color:var(--miss);font-weight:700}
.hint{border-left:4px solid var(--yellow);background:rgba(245,220,106,.1);padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .st{font-size:14px;color:var(--muted);white-space:nowrap}
.row.passed .st{color:var(--mint)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
svg{display:block;margin:6px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:28px}}
</style>
<script src="cabinet-report.js"></script>
</head>
<body>
<div id="wrap"><div id="app"></div></div>
<script>
'use strict';
//CONTENT-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>String(Math.round(n*10000)/10000).replace('.',',').replace('-','−');
function nm(q,ans,why,prompt,hint,x){return Object.assign({q,type:'num',ans,why,prompt:prompt||'Найди значение',hint:hint||''},x||{})}
function ch(q,options,correct,why,prompt,hint,x){const o=[...new Set(options)];return Object.assign({q,type:'choice',options:shuf(o),correct,why,prompt,hint:hint||''},x||{})}
const INF='+∞',NINF='−∞';
// запись многочлена ax²+bx+c
function poly(a,b,c){let s='';const t=(k,v,first)=>{if(k===0)return '';const m=Math.abs(k),sg=first?(k<0?'−':''):(k<0?' − ':' + ');return sg+((m===1&&v)?'':m)+v};
 s=t(a,'x²',true);s+=t(b,'x',s==='');s+=t(c,'',s==='');return s||'0'}
function quad(p,q,a){a=a||1;return poly(a,-a*(p+q),a*p*q)}
function two(lo,hi,ns){let p,q;do{p=ri(lo,hi);do{q=ri(lo,hi)}while(q===p)}while(ns&&p+q===0);return p<q?[p,q]:[q,p]}
const sg=(strict)=>strict?['(',')']:['[',']'];
// промежутки
const between=(p,q,s)=>`${s?'(':'['}${f(p)}; ${f(q)}${s?')':']'}`;
const outside=(p,q,s)=>`(${NINF}; ${f(p)}${s?')':']'} ∪ ${s?'(':'['}${f(q)}; ${INF})`;
// числовая прямая с точками и штриховкой: mode 'in' штрихует между, 'out' снаружи
function line(p,q,mode,strict){const X1=60,X2=240,sh='#f2905e';
 const dot=(x,l)=>`<circle cx="${x}" cy="40" r="6" fill="${strict?'#14211e':sh}" stroke="${sh}" stroke-width="2"/><text x="${x}" y="68" text-anchor="middle" fill="#f3ece2" font-size="15">${f(l)}</text>`;
 const bar=(a,b)=>`<rect x="${a}" y="33" width="${b-a}" height="14" fill="${sh}" opacity=".45"/>`;
 return `<svg viewBox="0 0 300 76" width="300" height="76" aria-hidden="true"><line x1="6" y1="40" x2="294" y2="40" stroke="#f3ece2" stroke-width="2"/>${mode==='in'?bar(X1,X2):bar(6,X1)+bar(X2,294)}${dot(X1,p)}${dot(X2,q)}</svg>`}

// 1. Корни трёхчлена
function g1(){const [p,q]=two(-8,8);const lo=ri(0,1)===0;
 const tag=u=>u===-p||u===-q?'перепутал знак корня':u===p*q?'назвал произведение корней':u===p+q?'назвал сумму корней':'';
 return nm(`${quad(p,q)} = 0. Найди ${lo?'меньший':'больший'} корень.`,lo?p:q,'По теореме Виета сумма корней равна −b, произведение равно c. Подбери два числа с нужной суммой и произведением. Проверка: подставь корень в уравнение.','Найди корень','Какие два числа в сумме дают '+f(p+q)+' и в произведении '+f(p*q)+'?',{tag})}

// 2. Ветви параболы
function g2(){const a=pick([-3,-2,-1,1,2,3,4,-4]);const b=ri(-6,6),c=ri(-6,6);const up=a>0;
 return ch(`y = ${poly(a,b,c)}`,['ветви вверх','ветви вниз'],up?'ветви вверх':'ветви вниз','Направление ветвей определяет только знак коэффициента при x²: a > 0 — вверх, a < 0 — вниз. Коэффициенты b и c на это не влияют.','Куда направлены ветви параболы?','Посмотри на число перед x²: плюс или минус?',{etag:'смотрит не на старший коэффициент'})}

// 3. Где парабола ниже / выше оси
function g3(){const [p,q]=two(-7,7,1);const below=ri(0,1)===0;
 const c=below?between(p,q,true):outside(p,q,true);
 const bad=below?[outside(p,q,true),between(-q,-p,true),outside(-q,-p,true)]:[between(p,q,true),outside(-q,-p,true),between(-q,-p,true)];
 return ch(`Парабола y = ${quad(p,q)} пересекает ось x в точках ${f(p)} и ${f(q)}. Ветви вверх. При каких x ${below?'y < 0 (график ниже оси)':'y > 0 (график выше оси)'}?`,[c,...bad],c,'Ветви вверх: между корнями график ниже оси x (y < 0), снаружи — выше (y > 0). Корни — это точки, где y = 0, они в строгое неравенство не входят.','Выбери промежуток','Представь параболу: ветви вверх, она идёт сверху, спускается ниже оси и снова поднимается.',{etag:'перепутал «между корнями» и «снаружи»'})}

// 4. x²+bx+c </> 0, строгие
function g4(){const [p,q]=two(-8,8,1);const lt=ri(0,1)===0;
 const c=lt?between(p,q,true):outside(p,q,true);
 const bad=lt?[outside(p,q,true),between(-q,-p,true),between(p,q,false)]:[between(p,q,true),outside(-q,-p,true),outside(p,q,false)];
 return ch(`${quad(p,q)} ${lt?'<':'>'} 0`,[c,...bad],c,`Шаги: 1) корни ${f(p)} и ${f(q)}; 2) ветви вверх (a = 1 > 0); 3) знак «${lt?'<':'>'}» — ${lt?'берём промежуток между корнями':'берём то, что снаружи'}. Скобки круглые: неравенство строгое.`,'Реши неравенство','Сначала найди корни, потом нарисуй параболу.',{etag:lt?'взял «снаружи» вместо «между»':'взял «между» вместо «снаружи»'})}

// 5. Нестрогие
function g5(){const [p,q]=two(-8,8);const lt=ri(0,1)===0;
 const c=lt?between(p,q,false):outside(p,q,false);
 const bad=lt?[outside(p,q,false),between(p,q,true),outside(p,q,true)]:[between(p,q,false),outside(p,q,true),between(p,q,true)];
 return ch(`${quad(p,q)} ${lt?'≤':'≥'} 0`,[c,...bad],c,`Знак ${lt?'≤':'≥'} нестрогий: корни ${f(p)} и ${f(q)} входят в решение, ставим квадратные скобки. ${lt?'Между корнями':'Снаружи'} — ${lt?'парабола ниже оси или на ней':'выше оси или на ней'}. Бесконечность всегда в круглой скобке.`,'Реши неравенство','Нестрогий знак — корни входят в ответ.',{etag:'ошибка в скобках или в выборе промежутка'})}

// 6. Старший коэффициент отрицателен
function g6(){const [p,q]=two(-7,7);const ge=ri(0,1)===0;const a=-pick([1,1,2,3]);
 // a<0: a(x-p)(x-q) >0 между корнями
 const gt=ge; const strict=ri(0,1)===0;
 const c=gt?between(p,q,strict):outside(p,q,strict);
 const bad=gt?[outside(p,q,strict),between(p,q,!strict),outside(p,q,!strict)]:[between(p,q,strict),outside(p,q,!strict),between(p,q,!strict)];
 const sign=gt?(strict?'>':'≥'):(strict?'<':'≤');
 return ch(`${quad(p,q,a)} ${sign} 0`,[c,...bad],c,`Здесь a = ${a} < 0, ветви вниз: между корнями график выше оси, снаружи — ниже. Корни ${f(p)} и ${f(q)}. ${gt?'Знак «больше» — берём промежуток между корнями.':'Знак «меньше» — берём то, что снаружи.'} Скобки по строгости знака.`,'Реши неравенство','Ветви вниз! Нарисуй параболу и посмотри, где она выше (ниже) оси.',{etag:'не учёл знак при x² (ветви вниз)'})}

// 7. Неполные: x² < a, x² > a, x² + kx > 0
function g7(){const t=ri(0,2);
 if(t===0){const k=ri(2,12);const lt=ri(0,1)===0;const c=lt?between(-k,k,true):outside(-k,k,true);
  return ch(`x² ${lt?'<':'>'} ${k*k}`,[c,lt?outside(-k,k,true):between(-k,k,true),lt?`(${NINF}; ${f(k)})`:`(${f(k)}; ${INF})`,lt?between(0,k,true):outside(0,k,true)],c,`Корни уравнения x² = ${k*k}: ${f(-k)} и ${k}. Ветви вверх: «меньше» — между корнями, «больше» — снаружи. Нельзя ограничиться одним корнем: ${f(-k)} тоже решение (для «<» — (−${k})² = ${k*k}, граница).`,'Реши неравенство','Разность квадратов: x² − '+(k*k)+' = (x − '+k+')(x + '+k+').',{etag:'потерял отрицательный корень'})}
 const k=ri(2,9),lt=ri(0,1)===0,neg=ri(0,1)===0;const r=neg?-k:k; // x(x−r)
 const [p,q]=r<0?[r,0]:[0,r];const e=`x² ${neg?'+':'−'} ${k}x`;
 const c=lt?between(p,q,true):outside(p,q,true);
 return ch(`${e} ${lt?'<':'>'} 0`,[c,lt?outside(p,q,true):between(p,q,true),lt?between(-q,-p,true):outside(-q,-p,true),lt?`(${NINF}; ${f(r)})`:`(${f(r)}; ${INF})`],c,`Вынеси x за скобку: x(x ${neg?'+':'−'} ${k}) ${lt?'<':'>'} 0. Корни: 0 и ${f(r)}. Ветви вверх: ${lt?'«меньше» — между корнями':'«больше» — снаружи'}.`,'Реши неравенство','Вынеси x за скобку, найди два корня.',{etag:'потерял корень 0'})}

// 8. Дискриминант < 0 и D = 0
function g8(){const t=ri(0,3);
 if(t===0){const c=ri(1,9);const gt=ri(0,1)===0;const ans=gt?'x — любое число':'решений нет';
  return ch(`x² + ${c} ${gt?'>':'<'} 0`,['x — любое число','решений нет','x > 0','x < 0'],ans,`x² ≥ 0 при любом x, значит x² + ${c} ≥ ${c} > 0. Поэтому «> 0» верно для всех x, а «< 0» — ни для одного. Парабола целиком выше оси.`,'Выбери ответ','Какое наименьшее значение принимает x²?',{etag:'не заметил, что x² неотрицателен'})}
 if(t===1){const p=ri(-8,8)||3;const gt=ri(0,1)===0;const e=poly(1,-2*p,p*p);
  const c=gt?`x ≠ ${f(p)}`:'решений нет';
  return ch(`${e} ${gt?'>':'<'} 0`,[c,gt?'x — любое число':'x = '+f(p),`x = ${f(p)}`,`x ≠ ${f(-p)}`],c,`Это (x − ${f(p)})², квадрат — число неотрицательное. «>0» верно везде, кроме x = ${f(p)}, где значение 0. «<0» не выполняется никогда.`.replace('(x − '+f(p)+')','(x '+(p<0?'+ '+f(-p):'− '+f(p))+')'),'Выбери ответ','Свернуть по формуле квадрата разности.',{etag:'не заметил полный квадрат'})}
 if(t===2){const p=ri(-8,8)||2;const e=poly(1,-2*p,p*p);const c=`x = ${f(p)}`;
  return ch(`${e} ≤ 0`,[c,'решений нет','x — любое число',`x ≤ ${f(p)}`],c,`Это квадрат ${p<0?'(x + '+f(-p)+')':'(x − '+f(p)+')'}², он неотрицателен. «≤ 0» возможно только когда он равен 0, то есть при x = ${f(p)}.`,'Выбери ответ','Квадрат может быть меньше нуля?',{etag:'не заметил полный квадрат'})}
 const b=ri(1,3),c=ri(b*b+1,b*b+9);const gt=ri(0,1)===0; // D<0
 const ans=gt?'x — любое число':'решений нет';
 return ch(`${poly(1,2*b,c)} ${gt?'>':'<'} 0`,['x — любое число','решений нет',`(${f(-b)}; ${INF})`,`(${NINF}; ${f(-b)})`],ans,`D = ${4*b*b} − ${4*c} < 0 — корней нет, парабола с ветвями вверх целиком выше оси: значения всегда положительны.`,'Выбери ответ','Найди дискриминант: если D < 0, корней нет.',{etag:'не проверил дискриминант'})}

// 9. Выбор рисунка (ОГЭ 13)
function g9(){const [p,q]=two(-6,6);const lt=ri(0,1)===0,strict=ri(0,1)===0;
 const sign=lt?(strict?'<':'≤'):(strict?'>':'≥');
 const right=lt?'in':'out';
 const okB=(m,s)=>`<svg viewBox="0 0 300 76" width="300" height="76" style="display:inline-block;margin:0" aria-hidden="true">${line(p,q,m,s).replace(/^<svg[^>]*>/,'').replace('</svg>','')}</svg>`;
 const opts=[okB(right,strict),okB(right==='in'?'out':'in',strict),okB(right,!strict),okB(right==='in'?'out':'in',!strict)];
 return ch(`${quad(p,q)} ${sign} 0`,opts,opts[0],`Корни ${f(p)} и ${f(q)}. ${lt?'«Меньше» — между корнями.':'«Больше» — снаружи.'} ${strict?'Знак строгий — точки пустые (выколотые).':'Знак нестрогий — точки закрашены.'}`,'Выбери рисунок с решением','Два признака: какая часть прямой заштрихована и закрашены ли точки.',{etag:'ошибка в штриховке или в точках'})}

// 10. Целые решения
function g10(){const [p,q]=two(-7,7);if(q-p<3)return g10();const lt=true;const strict=ri(0,1)===0;
 const lo=strict?p+1:p,hi=strict?q-1:q;const n=hi-lo+1;
 const tag=u=>u===q-p+1?'посчитал и корни тоже':u===q-p-1&&!strict?'выбросил корни из нестрогого':u===q-p&&strict?'ошибка в счёте':'';
 return nm(`Сколько целых чисел являются решением неравенства ${quad(p,q)} ${strict?'<':'≤'} 0?`,n,`Решение: ${between(p,q,strict)}. Выпиши целые числа от ${f(lo)} до ${f(hi)} и сосчитай. Количество чисел от m до n равно n − m + 1.`,'Найди количество','Реши неравенство, запиши промежуток, перечисли целые числа.',{tag})}

// 11. Не из корней: нужно преобразовать
function g11(){const [p,q]=two(-6,6,1);const k=ri(1,4);const lt=ri(0,1)===0;
 // x² + bx + c > m
 const b=-(p+q),c=p*q;const m=ri(1,9);
 const L=poly(1,b,c+m);
 const cc=lt?between(p,q,true):outside(p,q,true);
 return ch(`${L} ${lt?'<':'>'} ${m}`,[cc,lt?outside(p,q,true):between(p,q,true),lt?between(p,q,false):outside(p,q,false),lt?between(-q,-p,true):outside(-q,-p,true)],cc,`Сначала перенеси ${m} влево: ${quad(p,q)} ${lt?'<':'>'} 0. Только потом ищи корни: ${f(p)} и ${f(q)}. Справа должен остаться ноль.`,'Реши неравенство','Перенеси всё в левую часть, справа должен быть 0.',{etag:'решал, не приведя к нулю справа'})}

// 12. Системы
function g12(){const [p,q]=two(-5,3);const a=ri(q+1,q+4); // x²... <0 и x > a? выберем x>t
 const t=ri(p-1,q+1);
 // решение: (p;q) ∩ (t;+inf)
 const lo=Math.max(p,t);const ans=lo>=q?'решений нет':`(${f(lo)}; ${f(q)})`;
 const opts=[ans,`(${f(p)}; ${f(q)})`,`(${f(t)}; ${INF})`,`(${NINF}; ${f(p)}) ∪ (${f(q)}; ${INF})`,`(${f(Math.min(p,t))}; ${f(q)})`].filter(x=>x!==undefined);
 return ch(`${quad(p,q)} < 0 и x > ${f(t)}`,opts,ans,`1) Первое неравенство: ${between(p,q,true)}. 2) Второе: (${f(t)}; ${INF}). 3) Решение системы — общая часть (пересечение): нарисуй оба промежутка на одной прямой.`,'Реши систему неравенств','Нарисуй оба решения на одной прямой, ищи, где они накладываются.',{etag:'взял не пересечение промежутков'})}

const LEVELS=[
 {t:'Корни квадратного трёхчлена',g:g1,pages:[
  '<b>Корни уравнения x² + bx + c = 0</b> находят по теореме Виета: x₁ + x₂ = −b, x₁ · x₂ = c.',
  'Разберём пример: x² − 5x + 6 = 0. Сумма корней 5, произведение 6. Подходят 2 и 3: 2 + 3 = 5, 2 · 3 = 6. Корни 2 и 3.',
  'Проверка: подставь корень в уравнение. Знак корня обратный знаку в скобке: (x − 2)(x − 3) = 0 даёт корни 2 и 3, а не −2 и −3.']},
 {t:'Ветви параболы',g:g2,pages:[
  '<b>График y = ax² + bx + c — парабола.</b> Если a > 0, ветви вверх. Если a < 0, ветви вниз.',
  'Разберём пример: y = −2x² + 3x + 1. Перед x² стоит −2, это меньше нуля. Ветви вниз.',
  'Только число перед x² определяет направление ветвей. Коэффициенты b и c и порядок слагаемых не важны: в y = 5 + 2x − x² перед x² стоит −1, ветви вниз.']},
 {t:'Где парабола выше и ниже оси',g:g3,pages:[
  '<b>Решить неравенство ax² + bx + c < 0 — значит найти x, при которых график ниже оси x.</b> Корни — точки, где график пересекает ось.',
  'Разберём пример: ветви вверх, корни 1 и 4. Между корнями график ниже оси (y < 0). Левее 1 и правее 4 — выше оси (y > 0).',
  'Корни сами дают y = 0, поэтому в строгие неравенства (< и >) они не входят. Для ветвей вниз всё наоборот.']},
 {t:'Неравенства x² + bx + c < 0 и > 0',g:g4,pages:[
  '<b>Алгоритм:</b> 1) найди корни; 2) определи ветви; 3) выбери промежуток по знаку.',
  'Разберём пример: x² − 5x + 6 < 0. Корни 2 и 3, ветви вверх. «Меньше нуля» — между корнями. Ответ: (2; 3).',
  'Для «> 0» ответ — два луча: (−∞; 2) ∪ (3; +∞). Знак объединения ∪ соединяет два промежутка. Бесконечность пишут только с круглой скобкой.']},
 {t:'Нестрогие неравенства ≤ и ≥',g:g5,pages:[
  '<b>Нестрогий знак (≤, ≥) включает корни в решение.</b> Корень записывают с квадратной скобкой: [2; 3].',
  'Разберём пример: x² − 5x + 6 ≥ 0. Корни 2 и 3. Снаружи, корни входят: (−∞; 2] ∪ [3; +∞).',
  'Бесконечность не число, около неё скобка всегда круглая: (−∞; 2], а не [−∞; 2].']},
 {t:'Старший коэффициент отрицателен',g:g6,pages:[
  '<b>Если a < 0, ветви вниз.</b> Тогда график выше оси между корнями и ниже оси снаружи. Всё наоборот по сравнению с a > 0.',
  'Разберём пример: −x² + 5x − 6 > 0. Корни те же, что у x² − 5x + 6 = 0: 2 и 3. Ветви вниз, «больше нуля» — между корнями. Ответ: (2; 3).',
  'Можно умножить неравенство на −1, тогда знак меняется на противоположный: x² − 5x + 6 < 0. Результат тот же.']},
 {t:'Неполные неравенства',g:g7,pages:[
  '<b>x² < k (k > 0)</b> означает: −√k < x < √k. Для x² > k решение — два луча: x < −√k или x > √k. Один корень терять нельзя.',
  'Разберём пример: x² < 9. Корни ±3, ветви вверх, «меньше» — между корнями. Ответ: (−3; 3).',
  '<b>x² + kx > 0:</b> вынеси x за скобку: x(x + k) > 0. Корни 0 и −k. Не теряй корень 0.']},
 {t:'Нет корней или один корень',g:g8,pages:[
  '<b>Если D < 0</b> (корней нет), парабола целиком выше оси (при a > 0): неравенство «> 0» верно при любом x, «< 0» не имеет решений.',
  'Разберём пример: x² + 4 < 0. x² ≥ 0, значит x² + 4 ≥ 4. Это не меньше нуля никогда. Решений нет.',
  '<b>Если D = 0</b>, трёхчлен — полный квадрат (x − p)². Он ≥ 0 всегда и равен 0 при x = p. Поэтому (x − p)² > 0 при x ≠ p, а (x − p)² ≤ 0 только при x = p.']},
 {t:'Выбор рисунка с решением (ОГЭ 13)',g:g9,pages:[
  '<b>Решение неравенства показывают на числовой прямой.</b> Пустая (выколотая) точка — корень не входит (знаки < и >). Закрашенная — входит (≤ и ≥).',
  'Разберём пример: x² − 5x + 6 ≤ 0. Решение [2; 3]: заштрихован отрезок между точками, обе точки закрашены.',
  'Сначала реши неравенство, потом сравни с рисунками. Проверь три вещи: что заштриховано, где точки, какие они (пустые или закрашенные).']},
 {t:'Количество целых решений',g:g10,pages:[
  '<b>Реши неравенство, затем выпиши целые числа из промежутка.</b> Концы входят только для нестрогого знака.',
  'Разберём пример: x² − 4x < 0. Корни 0 и 4, решение (0; 4). Целые: 1, 2, 3. Всего 3.',
  'Для [0; 4] целые: 0, 1, 2, 3, 4. Всего 5. Число целых от m до n равно n − m + 1.']},
 {t:'Привести к нулю справа',g:g11,pages:[
  '<b>Неравенство решают только в виде «выражение ? 0».</b> Если справа не ноль, перенеси слагаемые влево.',
  'Разберём пример: x² − 5x + 10 < 4. Переносим 4: x² − 5x + 6 < 0. Теперь корни 2 и 3, ответ (2; 3).',
  'Частая ошибка: искать корни x² − 5x + 10 = 0 или приравнивать к 4. Решение даёт только сравнение с нулём.']},
 {t:'Системы неравенств',g:g12,pages:[
  '<b>Решение системы — общая часть решений всех неравенств</b> (пересечение).',
  'Разберём пример: x² − 4x + 3 < 0 и x > 2. Первое: (1; 3). Второе: (2; +∞). Общая часть: (2; 3).',
  'Нарисуй оба решения на одной прямой, одно под другим. Ответ — где обе штриховки совпадают. Если общей части нет, решений нет.']}
];
//CONTENT-END

//ENGINE-START
/* ====== настройки ====== */
const KEY='lilimath-trenazher-kvadratnye-neravenstva-v1';
const SHEET_URL='https://script.google.com/macros/s/AKfycbyJKYatO3xdOpYJ1WZzszbxqMnOWZ30lsfr5HH7Y23svvX6iqjNNbIUR-RCUeZ8pB15/exec';
const TITLE='Квадратные неравенства';
const NEED=7;          // верных ответов подряд для прохождения уровня
const RETEACH_AFTER=3; // ошибок подряд -> показать объяснение заново
const STUCK_AFTER=3;   // сколько раз объяснение показали -> метка «нужна помощь»
const PUSH_EVERY=10;   // отправка в таблицу каждые N ответов

/* ====== состояние ====== */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv)return s}catch(e){}return{name:'',lv:{},openAll:false}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function enc(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const HASH=location.hash.slice(1);
const TEACHER=HASH==='lilia';
if(/^u/.test(HASH)&&!st.name){try{const nm=dec(HASH.slice(1).split('.')[0]).split('|')[0].trim();if(nm){st.name=nm;save()}}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function L(i){return st.lv[i]||(st.lv[i]={ok:0,bad:0,hints:0,idk:0,tags:{},reteach:0,passed:false,stuck:false})}
const isOpen=i=>i===0||st.openAll||L(i-1).passed;
const passedCount=()=>LEVELS.filter((_,i)=>L(i).passed).length;
let V={phase:'home',i:0,page:0,streak:0,cons:0,q:null,hint:false,fb:null,err:'',sid:uid(),started:Date.now(),ok:0,bad:0,n:0,preview:false};

/* ====== отправка в таблицу ====== */
function report(){return LEVELS.map((l,i)=>{const o=L(i);
 const tg=Object.keys(o.tags).sort((a,b)=>o.tags[b]-o.tags[a]).slice(0,3).map(t=>`${t} ×${o.tags[t]}`).join('; ');
 const status=o.passed?'пройден':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—';
 return `${i+1}. ${l.t}: ${status}; верно ${o.ok}, неверно ${o.bad}, подсказок ${o.hints}, «не знаю» ${o.idk}, повторов объяснения ${o.reteach}${tg?'; ошибки: '+tg:''}`}).join('\n')}
function marks(){return LEVELS.map((_,i)=>`${i+1}${L(i).passed?'✓':L(i).stuck?'!':''}`).join(' ')}
function push(final){
 if(TEACHER||V.n===0)return;
 try{
  const done=passedCount()===LEVELS.length;
  const d={sid:V.sid,test:TITLE,name:st.name,kind:'тренажёр',started:V.started,
   status:final&&done?'завершено':'в процессе',progress:`${passedCount()}/${LEVELS.length}`,score:V.ok,max:V.ok+V.bad,grade:'',
   minutes:Math.round((Date.now()-V.started)/60000),bonus:`ступень ${V.i+1}`,tasks:marks(),report:report()};
  const bd=JSON.stringify(d);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:bd.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:bd}).catch(()=>{});
 }catch(e){}
}
addEventListener('pagehide',()=>{if(V.n>0)push(false)});

/* ====== разбор ошибок ====== */
function tagOf(q,u){
 if(u===null)return 'не знаю';
 if(q.type==='num'){
  if(q.tag){const t=q.tag(u);if(t)return t}
  if(u<0&&q.ans>=0)return 'отрицательный ответ';
  if(q.rad!==undefined&&u===q.rad)return 'не извлёк корень';
  if(q.rad!==undefined&&Math.abs(u-q.rad/2)<1e-9)return 'разделил пополам';
  if(q.rad!==undefined&&Number.isInteger(q.ans)&&q.ans>0&&u===q.ans*q.ans)return 'возвёл в квадрат вместо корня';
  return 'другая ошибка';
 }
 return q.etag||'другая ошибка';
}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');
 if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN}

/* ====== экраны ====== */
const app=h=>{document.getElementById('app').innerHTML=h};
const $=s=>document.querySelector(s);
function hdr(){return `<div class="muted">${esc(st.name||'')}${TEACHER?' · режим учителя (в таблицу не отправляется)':''}</div>`}
function render(){
 if(TEACHER&&!V.preview)return teacherScreen();
 if(!st.name)return nameScreen();
 ({home:homeScreen,learn:learnScreen,q:qScreen,done:doneScreen,reteach:reteachScreen,stuck:stuckScreen}[V.phase]||homeScreen)();
}
function nameScreen(){
 app(`<h1>Квадратные неравенства</h1><p class="muted">Тренажёр идёт по ступеням. Дальше можно пойти только после ${NEED} верных ответов подряд.</p>
 <p>Как тебя зовут?</p><input class="nm" id="nm" placeholder="Имя Фамилия" onkeydown="if(event.key==='Enter')setName()"><br><button class="btn" onclick="setName()">Начать</button><div class="bad" id="er"></div>`);
 const e=$('#nm');if(e)e.focus()}
function setName(){const v=$('#nm').value.trim();if(v.length<3){$('#er').textContent='Введи имя и фамилию.';return}st.name=v;save();home()}
function home(){V.phase='home';render()}
function homeScreen(){
 let h=hdr()+`<h1>Квадратные неравенства</h1><p class="muted">Пройдено ступеней: ${passedCount()} из ${LEVELS.length}. Чтобы пройти ступень, нужно ${NEED} верных ответов подряд.</p>`;
 LEVELS.forEach((l,i)=>{const o=L(i),op=isOpen(i);
  const s=o.passed?'пройдена':!op?'закрыта':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'открыта';
  h+=`<button class="row ${o.passed?'passed':''}" ${op?'':'disabled'} onclick="openLevel(${i})"><span>${i+1}. ${l.t}</span><span class="st">${s}</span></button>`});
 if(TEACHER)h+=`<button class="btn sec" onclick="V.preview=false;render()">Вернуться в кабинет учителя</button>`;
 app(h)}
function openLevel(i){if(!isOpen(i))return;V.i=i;V.page=0;V.streak=0;V.cons=0;V.fb=null;V.phase='learn';render()}
function learnScreen(){const l=LEVELS[V.i];
 let h=hdr()+`<h1>${V.i+1}. ${l.t}</h1><p class="muted">Прочитай по шагам. Потом ${NEED} заданий подряд без ошибок.</p>`;
 for(let k=0;k<=V.page;k++)h+=`<div class="card">${l.pages[k]}</div>`;
 h+=V.page<l.pages.length-1?`<button class="btn" onclick="nextPage()">Дальше</button>`:`<button class="btn" onclick="startQ()">Начать задания</button>`;
 h+=`<button class="btn sec" onclick="home()">К списку</button>`;
 app(h);window.scrollTo(0,document.body.scrollHeight)}
function nextPage(){V.page++;render()}
function startQ(){V.streak=0;V.cons=0;nextQ()}
function nextQ(){V.q=LEVELS[V.i].g();V.hint=false;V.fb=null;V.err='';V.phase='q';render()}
function qScreen(){const q=V.q,l=LEVELS[V.i];
 let dots='';for(let k=0;k<NEED;k++)dots+=`<span class="dot ${k<V.streak?'on':''}"></span>`;
 let h=hdr()+`<h2>${V.i+1}. ${l.t}</h2><div class="dots">${dots} <span class="muted">${V.streak} из ${NEED}</span></div>
 <div class="muted">${q.prompt}</div><div class="big">${q.q}</div>${q.pic||''}`;
 if(V.hint&&q.hint)h+=`<div class="hint"><b>Подсказка.</b> ${q.hint}</div>`;
 if(V.fb){
  h+=V.fb.ok?`<div class="card"><span class="ok">Верно.</span></div>`:`<div class="card"><span class="bad">${V.fb.idk?'Хорошо, что сказала честно.':'Неверно.'}</span> ${q.why}<div class="muted" style="margin-top:6px">Серия обнулена. Следующее задание будет новым.</div></div>`;
  h+=`<button class="btn" id="nx" onclick="afterFb()">Дальше</button>`;
 }else{
  if(q.type==='num')h+=`<input class="ans" id="ans" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter')submitNum()"><br><button class="btn" onclick="submitNum()">Проверить</button><div class="bad" style="margin-top:8px">${V.err}</div>`;
  else h+=q.options.map((o,i)=>`<button class="opt" onclick="pickOpt(${i})">${o}</button>`).join('');
  h+=`<div>`+(q.hint&&!V.hint?`<button class="btn sec" onclick="useHint()">Подсказка</button>`:'')+`<button class="btn sec" onclick="idk()">Не знаю</button><button class="btn sec" onclick="exitLevel()">К списку</button></div>`;
 }
 app(h);const a=$('#ans');if(a)a.focus();const n=$('#nx');if(n)n.focus()}
function useHint(){if(!V.hint){V.hint=true;L(V.i).hints++;save()}render()}
function exitLevel(){push(false);home()}
function answered(ok,u){
 const o=L(V.i);V.n++;
 if(ok){o.ok++;V.ok++;V.streak++;V.cons=0;
  if(V.streak>=NEED){o.passed=true;save();push(true);V.phase='done';render();return}
  V.fb={ok:true}}
 else{o.bad++;V.bad++;V.streak=0;V.cons++;const t=tagOf(V.q,u);o.tags[t]=(o.tags[t]||0)+1;V.fb={ok:false,idk:u===null};if(u===null)o.idk++}
 save();if(V.n%PUSH_EVERY===0)push(false);render()}
function submitNum(){const u=parseNum($('#ans').value);
 if(isNaN(u)){V.err='Введи число (например 7, 0,5 или 3/4).';render();return}
 answered(Math.abs(u-V.q.ans)<1e-9,u)}
function pickOpt(i){answered(V.q.options[i]===V.q.correct,V.q.options[i])}
function idk(){answered(false,null)}
function afterFb(){
 if(!V.fb.ok&&V.cons>=RETEACH_AFTER){const o=L(V.i);o.reteach++;V.cons=0;
  if(o.reteach>=STUCK_AFTER){o.stuck=true;save();push(false);V.phase='stuck';render();return}
  save();V.phase='reteach';render();return}
 nextQ()}
function reteachScreen(){app(hdr()+`<h2>Давай ещё раз посмотрим объяснение</h2><div class="card"><p>Несколько ответов подряд не получились. Это нормально: значит, объяснение надо прочитать ещё раз, не торопясь.</p></div><button class="btn" onclick="V.page=0;V.phase='learn';render()">Смотреть объяснение</button>`)}
function stuckScreen(){app(hdr()+`<h2>Стоп</h2><div class="card"><p>Здесь стало трудно, и это не страшно. Эту ступень лучше разобрать вместе с учителем. Результат уже отправлен Лилии.</p><p>Скажи, на каком месте перестало быть понятно.</p></div><button class="btn" onclick="home()">К списку</button><button class="btn sec" onclick="V.page=0;V.cons=0;V.phase='learn';render()">Ещё раз объяснение</button>`)}
function doneScreen(){const last=V.i===LEVELS.length-1;
 app(hdr()+`<h2>Ступень пройдена</h2><div class="card"><p><b>${V.i+1}. ${LEVELS[V.i].t}</b>: ${NEED} верных ответов подряд. Это настоящая работа.</p><p class="muted">Результат отправлен Лилии.</p></div>`+
 (last?`<p>Это была последняя ступень. Тренажёр пройден.</p><button class="btn" onclick="home()">К списку</button>`:`<button class="btn" onclick="openLevel(${V.i+1})">Следующая ступень</button><button class="btn sec" onclick="home()">К списку</button>`))}

/* ====== режим учителя ====== */
function teacherScreen(){
 const base=location.href.split('#')[0];
 let h=`<h1>Кабинет учителя</h1><p class="muted">Данные этого устройства. С этого экрана в таблицу ничего не отправляется.</p>
 <h2>Ссылка для ученика</h2><input class="nm" id="tn" placeholder="Имя Фамилия"><p class="link" id="tl"></p>
 <h2>Прогресс на этом устройстве</h2><table class="rep"><tr><th>№</th><th>Ступень</th><th>Статус</th><th>Верно</th><th>Неверно</th><th>Подск.</th><th>Не знаю</th><th></th></tr>`;
 LEVELS.forEach((l,i)=>{const o=L(i);
  h+=`<tr><td>${i+1}</td><td>${l.t}</td><td>${o.passed?'пройдена':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—'}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.hints}</td><td>${o.idk}</td><td><button class="btn sm sec" onclick="tPass(${i})">засчитать</button><button class="btn sm sec" onclick="tReset(${i})">сбросить</button></td></tr>`});
 h+=`</table><button class="btn sec" onclick="tOpenAll()">${st.openAll?'Закрыть ступени по порядку':'Открыть все ступени'}</button>
 <button class="btn" onclick="V.preview=true;home()">Пройти как ученик</button>
 <button class="btn sec" onclick="tWipe()">Стереть всё на этом устройстве</button>`;
 app(h);
 $('#tn').oninput=e=>{const v=e.target.value.trim();$('#tl').textContent=v?base+'#u'+enc(v):''}}
function tPass(i){L(i).passed=true;save();render()}
function tReset(i){st.lv[i]=undefined;delete st.lv[i];save();render()}
function tOpenAll(){st.openAll=!st.openAll;save();render()}
function tWipe(){if(confirm('Стереть весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);st=load();render()}}

render();
//ENGINE-END
</script>
