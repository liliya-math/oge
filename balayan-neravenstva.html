/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);
}

  <script>
window.TrainerData={"id":"balayan-neravenstva","version":1,"title":"Неравенства и системы · lili.math","heading":"Неравенства и системы","subtitle":"Решай по шагам, отмечай границы на прямой и находи общую часть.","description":"Решай по шагам, отмечай границы на прямой и находи общую часть.","grade":"7–9 класс · ОГЭ","stages":[{"name":"Линейные неравенства","subtitle":"Теория и практика","title":"Линейные неравенства","intro":"\u003csection class=\"theory-topic\">\u003ch3>Линейные неравенства\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Решение неравенства\u003c/strong> — значение переменной, при котором сравнение верно.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Собираем неизвестные\u003c/h4>\u003cp class=\"theory-note\">Прибавляй или вычитай одно и то же выражение в обеих частях.\u003c/p>\u003cdiv class=\"theory-cell\">3x + 4 ≤ x + 10 → 2x ≤ 6 → x ≤ 3.\u003c/div>\u003c/li>\u003cli>\u003ch4>Делим на отрицательное\u003c/h4>\u003cp class=\"theory-note\">Умножение или деление обеих частей на отрицательное число меняет знак сравнения на противоположный.\u003c/p>\u003cdiv class=\"theory-cell\">−2x \u003c 6 → x > −3.\u003c/div>\u003c/li>\u003cli>\u003ch4>Показываем границу\u003c/h4>\u003cp class=\"theory-note\">При \u003c или > ставь пустую точку. При ≤ или ≥ ставь закрашенную. У бесконечности всегда круглая скобка.\u003c/p>\u003cdiv class=\"theory-cell\">x > −3 → (−3; +∞).\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"book-axis\" viewBox=\"0 0 380 77\" role=\"img\" aria-label=\"Числовая прямая с отмеченным промежутком\">\u003crect width=\"380\" height=\"77\" rx=\"10\" fill=\"#EEE0C8\"/>\u003cpath d=\"M18 32 H365 l-7 -4 m7 4 l-7 4\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\u003cpath d=\"M116.81818181818181 32 H351\" stroke=\"#B95220\" stroke-width=\"6\"/>\u003ccircle cx=\"116.81818181818181\" cy=\"32\" r=\"5\" fill=\"#EEE0C8\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"116.81818181818181\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">-3\u003c/text>\u003cpath d=\"M204.63636363636363 27 v10\" stroke=\"#16231A\"/>\u003ctext x=\"204.63636363636363\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"14\">0\u003c/text>\u003c/svg>\u003c/section>","anchor":"Прибавляй или вычитай одно и то же выражение в обеих частях.","anchorNote":"При \u003c или > ставь пустую точку. При ≤ или ≥ ставь закрашенную. У бесконечности всегда круглая скобка.","tasks":[{"kind":"choice","q":"Реши 4 − 3x ≥ 9x − 2.","answer":"(−∞; 0,5]","before":"7 − 2x ≥ 3x + 2 → 5 ≥ 5x → x ≤ 1.","see":"Прибавь 3x и 2 к обеим частям.","similar":"7 − 2x ≥ 3x + 2 → 5 ≥ 5x → x ≤ 1.","algorithm":"Получаем 6 ≥ 12x.","retry":"Прибавь 3x и 2 к обеим частям.","steps":["Получаем 6 ≥ 12x.","Делим на 12: 0,5 ≥ x.","Граница включена: (−∞; 0,5]."],"options":["[0,5; +∞)","(−∞; 2]","(−∞; 0,5]","(−∞; 0,5)"],"unit":""},{"kind":"choice","q":"Реши 5x − 5 ≥ 10x + 7.","answer":"(−∞; −2,4]","before":"2x − 3 ≥ 5x + 6 → −3x ≥ 9 → x ≤ −3.","see":"После переноса коэффициент при x будет отрицательным.","similar":"2x − 3 ≥ 5x + 6 → −3x ≥ 9 → x ≤ −3.","algorithm":"Вычитаем 10x и прибавляем 5: −5x ≥ 12.","retry":"После переноса коэффициент при x будет отрицательным.","steps":["Вычитаем 10x и прибавляем 5: −5x ≥ 12.","Делим на −5 и меняем знак: x ≤ −2,4.","Ответ (−∞; −2,4]."],"options":["[−2,4; +∞)","(−∞; −2,4]","(−∞; 2,4]","(−2,4; +∞)"],"unit":""},{"kind":"choice","q":"Реши 9x − 4(x + 10) ≥ −10.","answer":"[6; +∞)","before":"8x − 2(x + 3) ≥ 0 → 8x − 2x − 6 ≥ 0 → x ≥ 1.","see":"Умножь −4 на каждое слагаемое в скобках.","similar":"8x − 2(x + 3) ≥ 0 → 8x − 2x − 6 ≥ 0 → x ≥ 1.","algorithm":"9x − 4x − 40 ≥ −10.","retry":"Умножь −4 на каждое слагаемое в скобках.","steps":["9x − 4x − 40 ≥ −10.","5x ≥ 30.","x ≥ 6, ответ [6; +∞)."],"options":["(−∞; 6]","[6; +∞)","(6; +∞)","[10; +∞)"],"unit":""},{"kind":"choice","q":"Какое неравенство изображено?","answer":"x > −2","before":"Пустая точка в 3 и луч влево означают x \u003c 3.","see":"Проверь направление луча и заполнение точки.","similar":"Пустая точка в 3 и луч влево означают x \u003c 3.","algorithm":"Луч вправо даёт значения больше −2.","retry":"Проверь направление луча и заполнение точки.","steps":["Луч вправо даёт значения больше −2.","Пустая точка исключает −2.","Получаем x > −2."],"options":["x ≥ −2","x \u003c −2","x > −2","x ≤ −2"],"visual":"\u003csvg class=\"book-axis\" viewBox=\"0 0 380 77\" role=\"img\" aria-label=\"Числовая прямая с отмеченным промежутком\">\u003crect width=\"380\" height=\"77\" rx=\"10\" fill=\"#EEE0C8\"/>\u003cpath d=\"M18 32 H365 l-7 -4 m7 4 l-7 4\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\u003cpath d=\"M125.6 32 H351\" stroke=\"#B95220\" stroke-width=\"6\"/>\u003ccircle cx=\"125.6\" cy=\"32\" r=\"5\" fill=\"#EEE0C8\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"125.6\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">-2\u003c/text>\u003cpath d=\"M190.0 27 v10\" stroke=\"#16231A\"/>\u003ctext x=\"190.0\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"14\">0\u003c/text>\u003c/svg>","unit":""}]},{"name":"Квадратные неравенства","subtitle":"Теория и практика","title":"Квадратные неравенства","intro":"\u003csection class=\"theory-topic\">\u003ch3>Квадратные неравенства\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Квадратное неравенство\u003c/strong> — неравенство, которое после переноса в одну сторону сравнивает ax² + bx + c с нулём, где a ≠ 0.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Находим нули\u003c/h4>\u003cp class=\"theory-note\">Решаем уравнение с тем же выражением. Его корни делят прямую на интервалы.\u003c/p>\u003cdiv class=\"theory-cell\">x² − 9 = (x − 3)(x + 3), нули −3 и 3.\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверяем знак\u003c/h4>\u003cp class=\"theory-note\">У параболы с ветвями вверх и двумя корнями выражение отрицательно между корнями и положительно снаружи. При ветвях вниз знаки противоположны.\u003c/p>\u003cdiv class=\"theory-cell\">x² − 9 \u003c 0 при −3 \u003c x \u003c 3.\u003c/div>\u003c/li>\u003cli>\u003ch4>Учитываем особые случаи\u003c/h4>\u003cp class=\"theory-note\">Если нулей нет, знак постоянный. Если корень один и повторяется, график касается оси, знак через корень не меняется.\u003c/p>\u003cdiv class=\"theory-cell\">x² + 4 > 0 при любом x. Для (x − 2)² ≤ 0 подходит только x = 2.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"book-graph\" viewBox=\"0 0 211.33333333333331 293.0\" role=\"img\" aria-label=\"Координатная плоскость\">\u003crect width=\"211.33333333333331\" height=\"293.0\" rx=\"12\" fill=\"#EEE0C8\"/>\u003cline x1=\"24.0\" y1=\"269.0\" x2=\"24.0\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003ctext x=\"19.0\" y=\"138.0\" fill=\"#16231A\" font-size=\"13\" font-weight=\"650\">-5\u003c/text>\u003cline x1=\"40.33333333333333\" y1=\"269.0\" x2=\"40.33333333333333\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003ctext x=\"35.33333333333333\" y=\"138.0\" fill=\"#16231A\" font-size=\"13\" font-weight=\"650\">-4\u003c/text>\u003cline x1=\"56.666666666666664\" y1=\"269.0\" x2=\"56.666666666666664\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003ctext x=\"51.666666666666664\" y=\"138.0\" fill=\"#16231A\" font-size=\"13\" font-weight=\"650\">-3\u003c/text>\u003cline x1=\"73.0\" y1=\"269.0\" x2=\"73.0\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003ctext x=\"68.0\" y=\"138.0\" fill=\"#16231A\" font-size=\"13\" font-weight=\"650\">-2\u003c/text>\u003cline x1=\"89.33333333333333\" y1=\"269.0\" x2=\"89.33333333333333\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003ctext x=\"84.33333333333333\" y=\"138.0\" fill=\"#16231A\" font-size=\"13\" font-weight=\"650\">-1\u003c/text>\u003cline x1=\"105.66666666666666\" y1=\"269.0\" x2=\"105.66666666666666\" y2=\"24.0\" stroke=\"#C9AB82\" stroke-width=\"1\"/>\u003cline x1=\"122.0\" y1=\"269.0\" x2=\"122.0\" y2=\"24.0\" stroke=\"#C9AB82\" str ючаем.","see":"Проверь произведение при x = 0.","similar":"(x + 2)(x − 3) ≥ 0: вне корней множители одного знака, корни включаем.","algorithm":"Нули −4 и 9.","retry":"Проверь произведение при x = 0.","steps":["Нули −4 и 9.","Между нулями знаки разные, снаружи совпадают.","Границы включаем: (−∞; −4] ∪ [9; +∞)."],"options":["[−4; 9]","[9; +∞)","(−∞; −4] ∪ [9; +∞)","(−∞; −4) ∪ (9; +∞)"],"unit":""},{"kind":"choice","q":"Реши x² + 25 > 0.","answer":"Все действительные числа","before":"x² + 7 ≥ 7 при любом x, значит выражение всегда строго положительно.","see":"Квадрат действительного числа всегда ≥ 0.","similar":"x² + 7 ≥ 7 при любом x, значит выражение всегда строго положительно.","algorithm":"x² ≥ 0.","retry":"Квадрат действительного числа всегда ≥ 0.","steps":["x² ≥ 0.","x² + 25 ≥ 25 > 0.","Подходит любое действительное число."],"options":["Нет решений","Только x ≠ 0","Все действительные числа","Только x > 0"],"unit":""},{"kind":"choice","q":"Реши (x + 1)² ≤ 0.","answer":"Только x = −1","before":"(x − 3)² ≤ 0 возможно только когда квадрат равен нулю: x = 3.","see":"Квадрат не может быть отрицательным.","similar":"(x − 3)² ≤ 0 возможно только когда квадрат равен нулю: x = 3.","algorithm":"Требуется (x + 1)² = 0.","retry":"Квадрат не может быть отрицательным.","steps":["Требуется (x + 1)² = 0.","x + 1 = 0.","Единственное решение x = −1."],"options":["Только x = 1","Только x = −1","(−∞; −1]","Нет решений"],"unit":""}]},{"name":"Дробь и метод интервалов","subtitle":"Теория и практика","title":"Дробь и метод интервалов","intro":"\u003csection class=\"theory-topic\">\u003ch3>Дробь и метод интервалов\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Метод интервалов\u003c/strong> — способ определить знак выражения на промежутках между его нулями и точками, где выражение не определено.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Границы\u003c/h4>\u003cp class=\"theory-note\">Приравняй к нулю числитель и знаменатель отдельно. Корень знаменателя никогда не включай.\u003c/p>\u003cdiv class=\"theory-cell\">(x − 1)/(x + 2) → границы −2 и 1.\u003c/div>\u003c/li>\u003cli>\u003ch4>Знаки\u003c/h4>\u003cp class=\"theory-note\">Возьми по одному числу в каждом промежутке и проверь знаки числителя и знаменателя.\u003c/p>\u003cdiv class=\"theory-cell\">Для x = −3, 0, 2 знаки дроби соответственно +, −, +.\u003c/div>\u003c/li>\u003cli>\u003ch4>Сбор ответа\u003c/h4>\u003cp class=\"theory-note\">Возьми интервалы нужного знака. Нуль числителя при ≤ или ≥ включается, если знаменатель в нём не равен нулю.\u003c/p>\u003cdiv class=\"theory-cell\">(x − 1)/(x + 2) ≤ 0 → (−2; 1].\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"book-axis\" viewBox=\"0 0 380 77\" role=\"img\" aria-label=\"Числовая прямая с отмеченным промежутком\">\u003crect width=\"380\" height=\"77\" rx=\"10\" fill=\"#EEE0C8\"/>\u003cpath d=\"M18 32 H365 l-7 -4 m7 4 l-7 4\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\u003cpath d=\"M125.6 32 H222.2\" stroke=\"#B95220\" stroke-width=\"6\"/>\u003ccircle cx=\"125.6\" cy=\"32\" r=\"5\" fill=\"#EEE0C8\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"125.6\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">-2\u003c/text>\u003ccircle cx=\"222.2\" cy=\"32\" r=\"5\" fill=\"#B95220\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"222.2\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">1\u003c/text>\u003cpath d=\"M190.0 27 v10\" stroke=\"#16231A\"/>\u003ctext x=\"190.0\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"14\">0\u003c/text>\u003c/svg>\u003c/section>","anchor":"Приравняй к нулю числитель и знаменатель отдельно. Корень знаменателя никогда не включай.","anchorNote":"Возьми интервалы нужного знака. Нуль числителя при ≤ или ≥ включается, если знаменатель в нём не равен нулю.","tasks":[{"kind":"choice","q":"Реши (2x − 1)/(3 − x) ≥ 0.","answer":"[0,5; 3)","before":"Для (x − 2)/(5 − x) ≥ 0 границы 2 и 5. При x = 3 дробь положительна, поэтому берём [2; 5).","see":"Точка x = 3 запрещена знаменателем.","similar":"Для (x − 2)/(5 − x) ≥ 0 границы 2 и 5. При x = 3 дробь положительна, поэтому берём [2; 5).","algorithm":"Границы 0,5 и 3.","retry":"Точка x = 3 запрещена знаменателем.","steps":["Границы 0,5 и 3.","Слева знаки − и +, между границами + и +, справа + и −.","0,5 включаем, 3 исключаем."],"options":["(0,5; 3]","[0,5; 3)","(−∞; 0,5] ∪ (3; +∞)","[0,5; 3]"],"unit":""},{"kind":"choice","q":"Реши (x − 4)/(x + 1) > 0.","answer":"(−∞; −1) ∪ (4; +∞)","before":"(x − 2)/(x + 3) > 0, когда оба множителя отрицательны или оба положительны: x \u003c −3 или x > 2.","see":"Дробь положительна, если знаки её частей совпадают.","similar":"(x − 2)/(x + 3) > 0, когда оба множителя отрицательны или оба положительны: x \u003c −3 или x > 2.","algorithm":"Исключаем x = −1 и x = 4.","retry":"Дробь положительна, если знаки её частей совпадают.","steps":["Исключаем x = −1 и x = 4.","Слева от −1 обе части отрицательны, между границами знаки разные, справа от 4 обе положительны.","Берём крайние интервалы."],"options":["(−1; 4)","(−∞; −1) ∪ (4; +∞)","(−∞; −1] ∪ [4; +∞)"],"unit":""},{"kind":"choice","q":"Реши (x² − 9)/(x + 3) ≤ 0.","answer":"(−∞; −3) ∪ (−3; 3]","before":"(x² − 4)/(x + 2) ≤ 0 упрощается до x − 2 ≤ 0 при x ≠ −2. Ответ (−∞; −2) ∪ (−2; 2].","see":"Запиши запрет x ≠ −3 до сокращения.","similar":"(x² − 4)/(x + 2) ≤ 0 упрощается до x − 2 ≤ 0 при x ≠ −2. Ответ (−∞; −2) ∪ (−2; 2].","algorithm":"x² − 9 = (x − 3)(x + 3).","retry":"Запиши запрет x ≠ −3 до сокращения.","steps":["x² − 9 = (x − 3)(x + 3).","При x ≠ −3 сокращаем до x − 3 ≤ 0.","Берём x ≤ 3 и вырезаем −3."],"options":["(−∞; 3]","(−∞; −3) ∪ (−3; 3]","[−3; 3]"],"unit":""},{"kind":"choice","q":"Реши 1/(x − 2) ≤ 0.","answer":"(−∞; 2)","before":"1/(x + 1) ≤ 0 только при x \u003c −1. Числитель 1 никогда не равен нулю.","see":"При числителе 1 знак дроби задаёт знаменатель.","similar":"1/(x + 1) ≤ 0 только при x \u003c −1. Числитель 1 никогда не равен нулю.","algorithm":"Числитель положительный и не обнуляется.","retry":"При числителе 1 знак дроби задаёт знаменатель.","steps":["Числитель положительный и не обнуляется.","Дробь отрицательна при x − 2 \u003c 0.","Ответ (−∞; 2)."],"options":["(−∞; 2]","(−∞; 2)","(2; +∞)"],"unit":""}]},{"name":"Системы и целые решения","subtitle":"Теория и практика","title":"Системы и целые решения","intro":"\u003csection class=\"theory-topic\">\u003ch3>Системы и целые решения\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Решение системы неравенств\u003c/strong> — значение, которое удовлетворяет каждому из её неравенств одновременно.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Решаем по отдельности\u003c/h4>\u003cp class=\"theory-note\">Получаем для каждого условия отдельный промежуток.\u003c/p>\u003cdiv class=\"theory-cell\">x + 2 ≥ 0 → x ≥ −2. 2x \u003c 6 → x \u003c 3.\u003c/div>\u003c/li>\u003cli>\u003ch4>Ищем общую часть\u003c/h4>\u003cp class=\"theory-note\">На числовой прямой оставь числа, которые входят в оба промежутка.\u003c/p>\u003cdiv class=\"theory-cell\">x ≥ −2 и x \u003c 3 → [−2; 3).\u003c/div>\u003c/li>\u003cli>\u003ch4>Выбираем целое число\u003c/h4>\u003cp class=\"theory-note\">Проверь, входит ли граница в ответ. Если граница исключена, бери следующее допустимое целое.\u003c/p>\u003cdiv class=\"theory-cell\">В [−2; 3) целые числа −2, −1, 0, 1, 2. Самое большое — 2.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"book-axis\" viewBox=\"0 0 380 77\" role=\"img\" aria-label=\"Числовая прямая с отмеченным промежутком\">\u003crect width=\"380\" height=\"77\" rx=\"10\" fill=\"#EEE0C8\"/>\u003cpath d=\"M18 32 H365 l-7 -4 m7 4 l-7 4\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\u003cpath d=\"M125.6 32 H286.6\" stroke=\"#B95220\" stroke-width=\"6\"/>\u003ccircle cx=\"125.6\" cy=\"32\" r=\"5\" fill=\"#B95220\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"125.6\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">-2\u003c/text>\u003ccircle cx=\"286.6\" cy=\"32\" r=\"5\" fill=\"#EEE0C8\" stroke=\"#B95220\" stroke-width=\"2\"/>\u003ctext x=\"286.6\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"15\">3\u003c/text>\u003cpath d=\"M190.0 27 v10\" stroke=\"#16231A\"/>\u003ctext x=\"190.0\" y=\"57\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"14\">0\u003c/text>\u003c/svg>\u003c/section>","anchor":"Получаем для каждого условия отдельный промежуток.","anchorNote":"Проверь, входит ли граница в ответ. Если граница исключена, бери следующее допустимое целое.","tasks":[{"kind":"choice","q":"Реши систему x + 0,8 ≤ 0 и x − 2 ≥ −5.","answer":"[−3; −0,8]","before":"Из x + 1 ≤ 0 и x − 2 ≥ −6 получаем x ≤ −1 и x ≥ −4. Общая часть [−4; −1].","see":"Одна граница снизу, другая сверху.","similar":"Из x + 1 ≤ 0 и x − 2 ≥ −6 получаем x ≤ −1 и x ≥ −4. Общая часть [−4; −1].","algorithm":"Первое условие даёт x ≤ −0,8.","retry":"Одна граница снизу, другая сверху.","steps":["Первое условие даёт x ≤ −0,8.","Второе даёт x ≥ −3.","Общая часть [−3; −0,8]."],"options":["[−3; +∞)","[−3; −0,8]","(−∞; −0,8]","(−∞; −3] ∪ [−0,8; +∞)"],"unit":""},{"kind":"choice","q":"Реши систему x − 16,5 > 0 и x + 8 > 10.","answer":"(16,5; +∞)","before":"При x > 7 и x > 3 одновременно нужно x > 7.","see":"Когда оба ограничения снизу, возьми более строгую границу.","similar":"При x > 7 и x > 3 одновременно нужно x > 7.","algorithm":"Первое условие даёт x > 16,5.","retry":"Когда оба ограничения снизу, возьми более строгую границу.","steps":["Первое условие даёт x > 16,5.","Второе даёт x > 2.","Все x > 16,5 удовлетворяют обоим."],"options":["(2; +∞)","(2; 16,5)","(16,5; +∞)","[16,5; +∞)"],"unit":""},{"kind":"choice","q":"Реши систему 2x > 6 и x + 1 ≤ 4.","answer":"Нет решений","before":"Для x > 2 и x \u003c 1 общих чисел нет.","see":"Проверь, подходит ли число 3 обоим условиям.","similar":"Для x > 2 и x \u003c 1 общих чисел нет.","algorithm":"Первое требует x > 3.","retry":"Проверь, подходит ли число 3 обоим условиям.","steps":["Первое требует x > 3.","Второе требует x ≤ 3.","Промежутки не пересекаются."],"options":["Только x = 3","(−∞; 3]","Нет решений","(3; +∞)"],"unit":""},{"kind":"number","q":"Найди наибольшее целое решение системы 3 − 2x \u003c 13, x − 1 > 0, 5x − 35 ≤ 0.","answer":7,"before":"Если после решения системы получилось 0 \u003c x ≤ 6, целая правая граница 6 подходит.","see":"У первого условия при делении на −2 поменяй знак.","similar":"Если после решения системы получилось 0 \u003c x ≤ 6, целая правая граница 6 подходит.","algorithm":"Из первого условия x > −5.","retry":"У первого условия при делении на −2 поменяй знак.","steps":["Из первого условия x > −5.","Из второго x > 1, из третьего x ≤ 7.","Пересечение (1; 7]. Наибольшее целое решение 7."],"unit":""}]}],"recap":["При делении на отрицательное число разверни знак сравнения.","У квадратичного выражения проверь корни и знаки. У дроби исключи нули знаменателя.","В системе выбирай только общие решения всех условий."]};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();

  <script>(function(){
  'use strict';
  const C=window.TrainerCourse,KEY='lili-trainer-'+C.id+'-'+(C.version||1)+(window.LiliStudy?.suffix||''),TOTAL=C.total;
  let storageOK=true,view='lesson',hints=new Set(),feedback=null,labIndex=0;
  const blank=()=>({stage:0,task:0,solved:[],attempts:{},answers:{}});

  function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!Number.isInteger(s.stage)||s.stage<0||s.stage>=C.stages.length)return blank();return {stage:s.stage,task:Number.isInteger(s.task)&&s.task>=0&&s.task<C.stages[s.stage].tasks.length?s.task:0,solved:Array.isArray(s.solved)?s.solved.filter(k=>validKey(k)):[],attempts:s.attempts&&typeof s.attempts==='object'?s.attempts:{},answers:s.answers&&typeof s.answers==='object'?s.answers:{}};}catch(e){storageOK=false;return blank();}}
  function validKey(k){if(typeof k!=='string')return false;const a=k.split('-').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&C.stages[a[0]]&&C.stages[a[0]].tasks[a[1]];}
  let state=readState();state.solved=[...new Set(state.solved)];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const number = /\d+(?:[.,]\d+)?/.source;
  const coefficient = `(?:${number}(?:\\s*/\\s*[−-]?${number})?)`;
  const scalar = `[+−-]?(?:${coefficient}(?:[xykb]|kx)?|kx|[xykb])`;
  const term = `(?:\\(${scalar}\\)|${scalar})`;
  const point = `\\(\\s*[−-]?${number}\\s*;\\s*[−-]?${number}\\s*\\)`;
  const expression = new RegExp(`(?<![A-Za-z0-9])(?:${point}|${term}(?:\\s*[=<>≤≥+−·×:/÷*-]\\s*${term})+)(?![A-Za-z0-9])`,'g');
  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>
    [...token].map(letter => `<span class="math-var-${letter}">${letter}</span>`).join(''));
  function plainMath(value) {
    const text = String(value);
    let result = '', end = 0;
    for (const match of text.matchAll(expression)) {
      result += colorVariables(text.slice(end,match.index));
      result += `<span class="math-nowrap">${colorVariables(match[0])}</span>`;
      end = match.index + match[0].length;
    }
    return result + colorVariables(text.slice(end));
  }
  const fractionSymbols={ '¼':[1,4],'½':[1,2],'¾':[3,4],'⅐':[1,7],'⅑':[1,9],'⅒':[1,10],
    '⅓':[1,3],'⅔':[2,3],'⅕':[1,5],'⅖':[2,5],'⅗':[3,5],'⅘':[4,5],'⅙':[1,6],'⅚':[5,6],
    '⅛':[1,8],'⅜':[3,8],'⅝':[5,8],'⅞':[7,8],'↉':[0,3] };
  const fractionAtom=String.raw`(?:\([^()\n]+\)|[−-]?(?:\d+(?:[.,]\d+)?[a-zA-Zа-яА-ЯёЁ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*|[a-zA-Zа-яА-ЯёЁ][a-zA-Zа-яА-ЯёЁ\d⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*))`;
  const fractionPattern=new RegExp(`([${Object.keys(fractionSymbols).join('')}])|(${fractionAtom})\\s*[/⁄∕]\\s*(${fractionAtom})`,'g');
  function fractionMarkup(top,bottom,format){
    const unpack=text=>String(text).replace(/^\((.*)\)$/,'$1');
    const numerator=unpack(top),denominator=unpack(bottom);
    return `<span class="math-fraction" role="math" aria-label="Дробь: числитель ${esc(numerator)}, знаменатель ${esc(denominator)}"><span aria-hidden="true">${format(numerator)}</span><span aria-hidden="true">${format(denominator)}</span></span>`;
  }
  function formatFractions(value,format,formatPart=format){
    const text=String(value);
    let result='',end=0;
    for(const match of text.matchAll(fractionPattern)){
      const parts=match[1]?fractionSymbols[match[1]]:[match[2],match[3]];
      result+=format(text.slice(end,match.index))+fractionMarkup(...parts,formatPart);
      end=match.index+match[0].length;
    }
    return result+format(text.slice(end));
  }
  function mathText(value){return formatFractions(value,plainMath);}
  function mathMarkup(markup){
    return markup.split(/(<svg\b[\s\S]*?<\/svg\s*>|<!--[^]*?-->|<[^>]*>)/gi)
      .map((piece,i)=>i%2?piece:formatFractions(piece,text=>text,plainMath)).join('');
  }
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${mathText(s.name)}<small>${n} / ${s.tasks.length} · ${mathText(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${mathMarkup(t.visual)}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div><div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${visual(t)}${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
