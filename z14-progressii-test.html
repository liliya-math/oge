<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Прогрессии: тест</title><style>

:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-style:normal}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--apricot);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--sage)}
.opt.ok{border-color:var(--ok);background:rgba(155,211,160,.12)}
.opt.bad{border-color:var(--bad);background:rgba(240,154,138,.12)}
.opt[disabled]{cursor:default}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:8px}
.btn[disabled]{opacity:.45;cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-left:3px solid var(--blue);background:rgba(125,162,255,.08);border-radius:6px;font-size:15px}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:160px}
.cond{background:#0f1f19;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.done{border-left:3px solid var(--ok);padding:8px 14px;margin:8px 0;background:rgba(155,211,160,.08);border-radius:6px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--cream);color:var(--bg);font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--butter);margin:4px 0}
sup{font-size:70%;line-height:0;vertical-align:super;white-space:nowrap}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}.fr i{display:block;font-style:normal;padding:0 4px;border-bottom:1px solid currentColor;line-height:1.25}.fr b{display:block;font-weight:normal;padding:0 4px;line-height:1.25}
.rt{white-space:nowrap}.ro{border-top:1px solid currentColor;padding:0 2px;margin-left:1px}

sub{font-size:70%;line-height:0;vertical-align:sub;white-space:nowrap}
</style></head><body><div class="wrap"><a href="z14-progressii.html" style="color:var(--blue);font-size:14px;text-decoration:none">← Прогрессии (задание 14)</a><h1 style="margin-top:10px">Прогрессии: тест</h1><p class="sub">10 вопросов. После каждого ответа появляется разбор типичных ошибок.</p><div class="bar"><i id="pb"></i></div><div id="box"></div></div><script>const Q=[["Найдите a<sub>10</sub> арифметической прогрессии, если a<sub>1</sub> = 7 и d = 3.", "34", ["37", "30", "27"], "a<sub>10</sub> = a<sub>1</sub> + 9d = 7 + 27 = 34 (от первого члена до десятого девять шагов). Ответ 37 получится, если прибавить 10d. Ответ 30 — это просто 10·3. Ответ 27 — это только 9d: забыт первый член."], ["Последовательность задана формулой a<sub>n</sub> = 4n + 1. Найдите a<sub>12</sub>.", "49", ["48", "53", "45"], "Подставляем n = 12: 4·12 + 1 = 49. Ответ 48 получится, если забыть +1. Ответ 53 — подставлено n = 13. Ответ 45 — подставлено n = 11 (путаница с формулой a<sub>1</sub> + (n − 1)d, которая здесь не нужна)."], ["Арифметическая прогрессия: −8; −5; −2; … Найдите разность d.", "3", ["−3", "−5", "1,5"], "d = −5 − (−8) = 3. Ответ −3 — вычли в обратном порядке (первый минус второй). Ответ −5 — это просто второй член. Ответ 1,5 получится, если разделить разность на 2."], ["В арифметической прогрессии a<sub>3</sub> = 11, a<sub>7</sub> = 23. Найдите d.", "3", ["12", "4", "2"], "От третьего до седьмого члена 7 − 3 = 4 шага, прирост 23 − 11 = 12, поэтому d = 12 : 4 = 3. Ответ 12 — разность членов не разделена на число шагов. Ответ 4 — разделили на неверное число (на 3)."], ["Найдите сумму первых 10 членов арифметической прогрессии, если a<sub>1</sub> = 2, d = 3.", "155", ["310", "170", "145"], "a<sub>10</sub> = 2 + 27 = 29, S<sub>10</sub> = (2 + 29)·10 : 2 = 155. Ответ 310 — забыто деление на 2. Ответ 170 — десятым членом принято 32 (прибавлено 10d). Ответ 145 — в сумму вместо (a<sub>1</sub> + a<sub>10</sub>) взято только a<sub>10</sub>."], ["Геометрическая прогрессия: b<sub>1</sub> = 3, q = 2. Найдите b<sub>5</sub>.", "48", ["96", "30", "11"], "b<sub>5</sub> = b<sub>1</sub>q<sup>4</sup> = 3·16 = 48. Ответ 96 — взята степень 5 вместо 4. Ответ 30 — вместо возведения в степень умножили 3·2·5. Ответ 11 — вместо умножения складывали."], ["Геометрическая прогрессия: 2; −6; 18; … Найдите четвёртый член.", "−54", ["54", "42", "−36"], "q = −6 : 2 = −3; b<sub>4</sub> = 18·(−3) = −54. Ответ 54 — потерян знак. Ответ 42 — прогрессию приняли за арифметическую (18 + 24). Ответ −36 — умножили на −2 вместо −3."], ["Все члены геометрической прогрессии положительны, b<sub>1</sub> = 2, b<sub>5</sub> = 32. Найдите b<sub>3</sub>.", "8", ["17", "16", "64"], "Свойство: b<sub>3</sub><sup>2</sup> = b<sub>1</sub>·b<sub>5</sub> = 64, так как все члены положительны, b<sub>3</sub> = 8. Ответ 17 — среднее арифметическое, оно годится только для арифметической прогрессии. Ответ 16 — разделили 32 на 2. Ответ 64 — корень не извлечён."], ["Найдите сумму первых четырёх членов геометрической прогрессии, если b<sub>1</sub> = 1, q = 3.", "40", ["81", "27", "121"], "Формула: S<sub>4</sub> = 1·(81 − 1) : (3 − 1) = 40. Проверка выпиской: 1 + 3 + 9 + 27 = 40. Ответ 81 — это q<sup>4</sup>. Ответ 27 — четвёртый член. Ответ 121 — прибавлен ещё и пятый член 81."], ["В первом ряду зала 12 мест, а в каждом следующем на 2 места больше. Сколько мест в 8-м ряду?", "26", ["28", "24", "14"], "a<sub>8</sub> = 12 + 7·2 = 26 (до восьмого ряда семь прибавлений). Ответ 28 — прибавлено 8d. Ответ 24 — число 12 умножено на 2. Ответ 14 — это второй ряд."]];
let i=0,score=0,wrong=[];
const box=document.getElementById('box'),pb=document.getElementById('pb');
function shuffle(a){const r=a.map((v,k)=>[v,k]);for(let j=r.length-1;j>0;j--){const m=Math.floor(Math.random()*(j+1));[r[j],r[m]]=[r[m],r[j]]}return r}
function show(){
  if(i>=Q.length){return end()}
  pb.style.width=(i/Q.length*100)+'%';
  const q=Q[i][0],exp=Q[i][Q[i].length-1],opts=Q[i].slice(1,Q[i].length-1);
  box.innerHTML='<div class="card"><span class="tag">Вопрос '+(i+1)+' из '+Q.length+'</span><p class="q">'+q+'</p><div id="o"></div><div id="e"></div></div>';
  const o=document.getElementById('o');
  shuffle(opts).forEach(([t,k])=>{const b=document.createElement('button');b.className='opt';b.innerHTML=t;b.onclick=()=>pick(b,k===0,exp);o.appendChild(b);b.dataset.k=k});
}
function pick(b,ok,exp){
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('ok')});
  if(ok){score++}else{b.classList.add('bad');wrong.push(i+1)}
  document.getElementById('e').innerHTML='<div class="exp">'+(ok?'Верно. ':'Неверно. ')+exp+'</div><button class="btn" onclick="i++;show()">'+(i===Q.length-1?'Результат':'Дальше')+'</button>';
}
function end(){
  pb.style.width='100%';
  const msg=score>=9?'Тема усвоена. Можно переходить к задачам повышенной сложности.':score>=7?'Хороший результат. Повторите вопросы, где были ошибки.':score>=5?'Есть пробелы. Вернитесь к теории и разберите ошибки.':'Нужно повторить теорию с начала: формулы n-го члена и суммы для обеих прогрессий.';
  box.innerHTML='<div class="card"><span class="tag">Результат</span><div class="big">'+score+' из '+Q.length+'</div><p>'+msg+'</p>'+(wrong.length?'<p class="sub">Ошибки в вопросах: '+wrong.join(', ')+'</p>':'')+'<button class="btn" onclick="i=0;score=0;wrong=[];show()">Пройти заново</button></div>';
}
show();
</script></body></html>
