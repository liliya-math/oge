<!doctype html><html lang="ru"><head><meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Треугольники с нуля · интерактивное обучение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#14211e; --glass:rgba(243,236,226,.05); --glass2:rgba(243,236,226,.085);
  --line:rgba(226,234,228,.13); --fg:#f3ece2; --muted:#a9b6ad; --faint:#6e7f77;
  --cobalt:#1747c9; --apricot:#f2905e; --mint:#a9d18e; --amber:#f5dc6a; --miss:#ff8f73; --lilac:#a9c1ff;
  --grad:linear-gradient(115deg,#f5dc6a 0%,#f2905e 100%);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:10px}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:drift 28s ease-in-out infinite alternate}
.amb i:nth-child(1){background:#1747c9;left:-20vmax;top:-25vmax}
.amb i:nth-child(2){background:#7a4a2a;right:-25vmax;top:8vmax;opacity:.2;animation-duration:34s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 90px}

.top{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:12px 16px 10px;background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:13px}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill strong{color:var(--fg);font-weight:600}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
.icon-btn svg{width:16px;height:16px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:24px;backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 30px 80px -40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
@media (max-width:520px){.card{padding:20px 16px;border-radius:22px}}
.enter{animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:.001;transform:translateY(14px) scale(.985)}}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,50px);line-height:1.06;margin:0;text-wrap:balance}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,32px);margin:6px 0 0;line-height:1.12}
h3{font-family:var(--display);font-size:20px;margin:12px 0 6px}
p.txt{font-size:17.5px;line-height:1.65;color:#ece1d6;margin:10px 0}
p.txt b{color:var(--fg)}
.accent{color:var(--apricot);font-weight:700}
.mint-t{color:var(--mint);font-weight:700}
.lilac-t{color:var(--lilac);font-weight:700}
.lead{font-size:17px;color:#ddd0c7;max-width:58ch;margin:0}
.hero{display:grid;gap:14px;padding-block:18px 8px}

.stage{display:grid;justify-items:center;gap:10px;margin:14px 0 6px;min-height:120px}
.cap{font-size:15px;color:var(--muted);text-align:center;max-width:46ch}
.cap b{color:var(--fg)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.9em;line-height:1.15;margin:0 2px;font-weight:600}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}

.btn{height:52px;padding:0 22px;border-radius:15px;border:0;font-weight:650;font-size:16px;background:var(--cobalt);color:#f3ece2;box-shadow:0 10px 30px -12px rgba(90,130,255,.55);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:var(--glass2);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.btn.small{height:40px;padding:0 16px;font-size:14px;border-radius:11px}
.btn.apr{background:var(--apricot);color:#2a1510;box-shadow:0 10px 30px -12px rgba(255,150,90,.5)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}

.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));width:100%;margin-top:6px}
.opt{border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:18px;padding:10px;display:grid;justify-items:center;gap:4px;font-size:16px;font-weight:600;transition:border-color .2s,background .2s;min-height:64px}
.opt:hover{border-color:rgba(255,200,160,.4)}
.opt.ok{border-color:var(--mint);background:rgba(169,209,142,.12)}
.opt.bad{border-color:var(--miss);background:rgba(255,143,115,.1)}
.opt.dis{pointer-events:none}
.opt .word{font-size:16px}

.fb{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-top:14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:.001;transform:scale(.92)}}
.fb.ok{background:rgba(134,227,185,.1);border:1px solid rgba(134,227,185,.35)}
.fb.bad{background:rgba(255,154,133,.08);border:1px solid rgba(255,154,133,.3)}
.fb .ic{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center}
.fb.ok .ic{background:var(--mint);color:#10291d}
.fb.bad .ic{background:rgba(255,154,133,.2);color:var(--miss)}
.fb .ic svg{width:19px;height:19px}
.fb .t{font-weight:650;font-size:15.5px}
.fb .s{font-size:14px;color:var(--muted)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.petsay{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(242,144,94,.09);border:1px solid rgba(242,144,94,.28)}
.petsay img{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.petsay .say{font-size:14.5px;color:#f0cdb6}
.petsay .say b{color:var(--apricot)}
.navrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;gap:6px;margin-top:14px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,230,210,.14)}
.dots i.on{background:var(--apricot)}
.dots i.done{background:var(--mint)}

.lessons{display:grid;gap:12px;margin-top:16px}
.lcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;background:var(--glass);padding:16px 18px;text-align:left;width:100%}
.lcard .ln{width:44px;height:44px;flex:none;border-radius:14px;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px}
.lcard.done .ln{background:rgba(169,209,142,.15);border-color:rgba(169,209,142,.4);color:var(--mint)}
.lcard .lt b{display:block;font-size:16.5px}
.lcard .lt span{font-size:13.5px;color:var(--muted)}
.lcard .go{margin-left:auto;font-size:13px;color:var(--faint)}
.lcard.done .go{color:var(--mint);font-weight:600}
.lcard:disabled{opacity:.45;cursor:default}

.xp{position:fixed;z-index:60;font-family:var(--display);font-weight:700;font-size:22px;color:var(--mint);pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.result{display:grid;gap:12px;justify-items:center;text-align:center;padding-block:12px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(56px,14vw,96px);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.heroimg{width:100%;border-radius:22px;border:1px solid var(--line);display:block;margin-top:12px;box-shadow:0 24px 60px -36px rgba(0,0,0,.85)}
.winimg{width:190px;max-width:60%;margin:10px auto 2px;display:block;border-radius:24px;border:1px solid var(--line);box-shadow:0 24px 60px -30px rgba(0,0,0,.8)}
.note{font-size:13.5px;color:var(--muted)}
.split-anim{animation:splitin .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes splitin{from{opacity:0;transform:scale(.7) rotate(-8deg)}}
a.backlink{color:var(--apricot);font-size:14px}

/* ---------- additions: thermometer / axis / cmp / angles / geometry ---------- */
.thermo{display:grid;justify-items:center;gap:6px}
.thermo .val{font-family:var(--display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.thermobtns{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:10px}
.tbtn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);font-size:26px;font-weight:700;transition:transform .15s,filter .2s}
.tbtn:hover{filter:brightness(1.15)}
.tbtn:active{transform:scale(.94)}
.axis{width:100%}
.axis svg{width:100%;height:auto;display:block}
.axis circle{transition:fill .15s}
.axis circle:hover{fill:rgba(242,144,94,.4)}
.cmp{display:flex;align-items:center;justify-content:center;gap:20px;font-family:var(--display);font-size:clamp(30px,8vw,40px);font-weight:700;margin:16px 0 8px;font-variant-numeric:tabular-nums}
.cmp .sign{color:var(--apricot);min-width:38px;text-align:center}
.cmp .neg{color:var(--lilac)}
.geo{width:min(340px,86vw);height:auto}
.geo text{font-family:var(--display)}
.opt svg.geo{width:min(120px,26vw);height:auto}
.pizza{width:min(190px,42vw);height:auto}
.pizza .slice.filled{stroke:rgba(255,240,225,.9);stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(242,144,94,.6))}
.anglesl{display:grid;gap:10px;margin-top:10px}
.anglesl label{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--apricot);height:28px}
.angout{display:flex;gap:16px;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;margin-top:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
</style></head><body>
<div class=amb><i></i><i></i></div>
<canvas id=fx></canvas>
<div class=wrap>
  <div class=top>
    <span class=brand>lili<b>.</b>math</span><span class=sp></span>
    <span class=pill>⭐ <strong id=xp>0</strong> XP</span>
    <span class=pill id=pp></span>
    <button class=icon-btn id=snd aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
  </div>
  <div id=app></div>
</div>
<script>
"use strict";
const CFG={"skey": "lili-treug-v1", "teacherImg": "img/cat-idle.jpg", "teacherName": "Кот Сигма", "comfortImg": "img/lab-sad.jpg", "comfortName": "Лаки Плюс", "winImg": "img/lab-win.jpg", "heroImg": "img/cat-idle.jpg", "kick": "Обучение с нуля · геометрия 7 класса", "h1": "Треугольники <span>с нуля</span>", "lead": "Пять уроков: от «что это вообще такое» до теоремы Пифагора. Чертежи можно крутить ползунками — углы сами пересчитаются.", "note": "Хочешь разобрать всё спокойно, в разговоре? Вот <a class=backlink href=\"razbor-treugolniki-dialog.html\">разбор в формате диалога</a>. А <a class=backlink href=\"7-klass.html\">темы 7 класса</a> — дальше по программе.", "finalPet": "Все пять уроков позади: виды, углы, периметр и Пифагор. Геометрия только начинается — а ты уже не новичок."};
const LESSONS=[{"id": "t1", "t": "Что такое треугольник", "d": "Три точки, три отрезка — и вот он", "steps": [{"k": "exp", "h": "Самая простая фигура", "p": "Три точки, не лежащие на одной прямой, соединили отрезками — получился <b>треугольник</b>. У него <b>3 вершины</b> (точки A, B, C), <b>3 стороны</b> (AB, BC, AC) и <b>3 угла</b>. Пишется так: △ABC.", "fig": {"html": "<svg class=geo viewBox=\"0 0 320 190\"><path d=\"M70,150 L250,150 L150,45 Z\" fill=\"rgba(242,144,94,.10)\" stroke=\"#f3ece2\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"150\" r=\"4\" fill=\"#f2905e\"/><circle cx=\"250\" cy=\"150\" r=\"4\" fill=\"#f2905e\"/><circle cx=\"150\" cy=\"45\" r=\"4\" fill=\"#f2905e\"/><text x=\"58\" y=\"172\" font-size=\"15\" fill=\"#f3ece2\">A</text><text x=\"258\" y=\"172\" font-size=\"15\" fill=\"#f3ece2\">B</text><text x=\"144\" y=\"34\" font-size=\"15\" fill=\"#f3ece2\">C</text><text x=\"196\" y=\"122\" font-size=\"13\" fill=\"#a9b6ad\">a</text><text x=\"98\" y=\"96\" font-size=\"13\" fill=\"#a9b6ad\">b</text><text x=\"154\" y=\"170\" font-size=\"13\" fill=\"#a9b6ad\">c</text></svg>"}, "pet": "Запомни: вершины — это точки-углы. Стороны — отрезки между ними."}, {"k": "choose", "h": "Проверим", "p": "Сколько углов у треугольника?", "opts": [{"w": "3", "ok": true, "why": "Три вершины — три угла. Всегда."}, {"w": "2", "ok": false, "why": "Откуда два? В слове «треугольник» — ТРИ."}, {"w": "Сколько хочешь", "ok": false, "why": "Нет: у любого треугольника строго три угла."}], "pet": "Три — магическое число треугольника."}, {"k": "pick", "h": "Игра: найди треугольник", "p": "Одна из фигур — треугольник. Нажми на неё.", "opts": [{"svg": "<svg class=geo viewBox=\"0 0 130 100\"><path d=\"M22,86 L108,86 L65,12 Z\" fill=\"rgba(242,144,94,.10)\" stroke=\"#f3ece2\" stroke-width=\"2\"/></svg>", "cap": "фигура 1", "ok": true, "why": "Три стороны, три вершины — треугольник!"}, {"svg": "<svg class=geo viewBox=\"0 0 130 100\"><rect x=\"25\" y=\"16\" width=\"80\" height=\"68\" fill=\"rgb const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC};
const tone=(f,t0,dur,type="sine",vol=.1)=>{const c=ac();if(!c||!sound)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.05)};

/* particles */
const cv=$("#fx"),cx=cv.getContext("2d");let P=[],raf=0;
const COLS=['#f3ece2','#1747c9','#f2905e','#f5dc6a','#a9d18e','#d6e2ee'];
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",fit);fit();
function burst(x,y,n=70,power=7){for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.4,s=power*(.4+Math.random()*.7);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.2,life:1,dec:.012+Math.random()*.012,c:COLS[i%COLS.length],sz:2+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:Math.random()<.5?"rect":"dot"})}if(!raf)loop()}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.life>0);for(const p of P){p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.dec;cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;if(p.sh==="rect"){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);cx.restore()}else{cx.beginPath();cx.arc(p.x,p.y,p.sz,0,7);cx.fill()}}cx.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0}
function xpFloat(el,n=5){const r=el.getBoundingClientRect();const e=document.createElement("div");e.className="xp";e.textContent="+"+n;e.style.left=r.left+r.width/2+"px";e.style.top=r.top+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}

/* ---------- thermometer ---------- */
function thermoSVG(t){
 const W=130,H=250,tx=48,tw=30,ty=14,th=172,by=ty+th;
 const yt=by-((t+10)/20)*th, y0=by-((0+10)/20)*th;
 const col=t>0?"#f2905e":t<0?"#7fa8ff":"#a9d18e";
 let marks="";
 for(const m of[-10,-5,5,10]){const y=by-((m+10)/20)*th;marks+=`<line x1="${tx-6}" y1="${y.toFixed(1)}" x2="${tx}" y2="${y.toFixed(1)}" stroke="rgba(243,236,226,.3)"/><text x="${tx-10}" y="${y+4}" text-anchor="end" font-size="11" fill="#6e7f77">${m>0?"+"+m:m}</text>`}
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role=img aria-label="Термометр">
  ${marks}
  <rect x="${tx}" y="${ty}" width="${tw}" height="${th}" rx="15" fill="rgba(243,236,226,.05)" stroke="rgba(243,236,226,.35)"/>
  <rect x="${tx+6}" y="${yt.toFixed(1)}" width="${tw-12}" height="${Math.max(by-yt,1).toFixed(1)}" fill="${col}"/>
  <circle cx="${tx+tw/2}" cy="${H-26}" r="19" fill="rgba(243,236,226,.05)" stroke="rgba(243,236,226,.35)"/>
  <circle cx="${tx+tw/2}" cy="${H-26}" r="11" fill="${col}"/>
  <line x1="${tx-10}" y1="${y0.toFixed(1)}" x2="${tx+tw+10}" y2="${y0.toFixed(1)}" stroke="rgba(243,236,226,.55)" stroke-dasharray="4 4"/>
 </svg>`;
}

function axisSVG(){
 let s=`<svg viewBox="0 0 660 92"><line x1="16" y1="46" x2="644" y2="46" stroke="rgba(243,236,226,.4)"/>`;
 for(let n=-9;n<=9;n++){
  const x=330+n*33;
  s+=`<line x1="${x}" y1="40" x2="${x}" y2="52" stroke="rgba(243,236,226,.35)"/>`;
  s+=`<text x="${x}" y="76" text-anchor="middle" font-size="13" fill="${n===0?"#f3ece2":"#a9b6ad"}" font-weight="${n===0?700:400}" font-family="var(--display)">${n}</text>`;

 }

}

/* ---------- triangle with live angles ---------- */
function anglesSVG(A,B){
 const Ax=50,Ay=165,Bx=270,By=165,ar=A*Math.PI/180,br=B*Math.PI/180;
 const d1x=Math.cos(ar),d1y=-Math.sin(ar),d2x=-Math.cos(br),d2y=-Math.sin(br);
 const cr=d1x*d2y-d1y*d2x;
 const t=((Bx-Ax)*d2y-(By-Ay)*d2x)/cr;
 const Cx=Ax+t*d1x,Cy=Ay+t*d1y;
 const p=(x,y)=>x.toFixed(1)+","+y.toFixed(1);
 const arcA=`M ${p(Ax+26,Ay)} A 26 26 0 0 0 ${p(Ax+26*Math.cos(ar),Ay-26*Math.sin(ar))}`;
 const arcB=`M ${p(Bx-26,By)} A 26 26 0 0 1 ${p(Bx-26*Math.cos(br),By-26*Math.sin(br))}`;
 return `<svg class=geo viewBox="0 0 320 200">
  <path d="M ${p(Ax,Ay)} L ${p(Bx,By)} L ${p(Cx,Cy)} Z" fill="rgba(242,144,94,.10)" stroke="#f3ece2" stroke-width="2"/>
  <path d="${arcA}" fill="none" stroke="#f2905e" stroke-width="2"/>
  <path d="${arcB}" fill="none" stroke="#a9c1ff" stroke-width="2"/>
  <text x="${Ax}" y="${Ay+26}" text-anchor="middle" font-size="15" fill="#f3ece2">A</text>
  <text x="${Bx}" y="${By+26}" text-anchor="middle" font-size="15" fill="#f3ece2">B</text>
  <text x="${Cx.toFixed(1)}" y="${(Cy-12).toFixed(1)}" text-anchor="middle" font-size="15" fill="#f3ece2">C</text>
 </svg>`;
}

const doneSteps=()=>LESSONS.reduce((a,l)=>a+(S.done[l.id]?l.steps.length:0),0);
function petSay(txt){return `<div class=petsay><img src="${CFG.teacherImg}" alt=""><div class=say><b>${CFG.teacherName}:</b> ${txt}</div></div>`}
function fbHTML(ok,t,s){return `<div class="fb ${ok?"ok":"bad"}"><span class=ic><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ok?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':'<path d="M12 7v6M12 17h.01"/>'}</svg></span><div><div class=t>${t}</div><div class=s>${s||""}</div></div></div>`}

/* ---------- pizza SVG (для урока про дроби) ---------- */
function wedge(cx,cy,r,a1,a2){const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`}
function pizzaSVG(d,filled,o={}){
 const size=o.size||210,cx0=size/2,cy0=size/2,r=size/2-8,inner=r-12;
 const cuts=o.cuts||Array.from({length:d},(_,i)=>i*2*Math.PI/d);
 const n=cuts.length;
 let s=`<circle cx="${cx0}" cy="${cy0}" r="${r}" fill="#c98a4b"/><circle cx="${cx0}" cy="${cy0}" r="${inner+4}" fill="#e8b06a"/>`;
 for(let i=0;i<n;i++){
  const a1=cuts[i]-Math.PI/2,a2=(i<n-1?cuts[i+1]:2*Math.PI)-Math.PI/2;
  const isF=i<filled;
  s+=`<path class="slice ${isF?"filled":""}" data-i="${i}" d="${wedge(cx0,cy0,inner,a1,a2)}" fill="${isF?"#f2905e":"#f7dd9b"}" stroke="#8a5a2b" stroke-width="2"/>`;
  const mid=(a1+a2)/2,pr=inner*.52;
  const px=cx0+pr*Math.cos(mid),py=cy0+pr*Math.sin(mid);
  const q1=cx0+pr*.6*Math.cos(mid-.15),qy1=cy0+pr*.6*Math.sin(mid-.15);
  s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${inner*.09}" fill="#c0392b" opacity=".85"/><circle cx="${q1.toFixed(1)}" cy="${qy1.toFixed(1)}" r="${inner*.07}" fill="#c0392b" opacity=".85"/>`;
 }
 return `<svg class=pizza viewBox="0 0 ${size} ${size}" style="${o.style||""}">${s}</svg>`}
function twoPizzas(d1,f1,d2,f2){return `<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center">${pizzaSVG(d1,f1,{size:190})}<span class=cap style="font-size:22px;margin:0">и</span>${pizzaSVG(d2,f2,{size:190})}</div>`}

/* figure renderer: {html:...} | "<svg..>" | {pizza:[d,filled]} | {two:[d1,f1,d2,f2]} */
function figOf(f){
 if(!f)return"";
 if(typeof f==="string")return f;
 if(f.html)return `<div class=stage>${f.html}</div>`;
 if(f.pizza)return `<div class=stage>${pizzaSVG(f.pizza[0],f.pizza[1],(f.pizza[2]||{}))}</div>`;
 if(f.two)return `<div class=stage>${twoPizzas(f.two[0],f.two[1],f.two[2],f.two[3])}</div>`;
 return "";
}

/* ---------- map ---------- */
function renderMap(){
 $("#xp").textContent=S.xp;
 $("#pp").innerHTML=`<strong>${doneSteps()}/${totalSteps()}</strong> шагов`;
 app.innerHTML=`<section class="hero enter">
  <div class=kick>${CFG.kick}</div>
  <h1>${CFG.h1}</h1>
  <p class=lead>${CFG.lead}</p>
  <p class=note>${CFG.note}</p>
  <img class=heroimg src="${CFG.heroImg}">
 </section>
 <div class=lessons>${LESSONS.map((l,i)=>{
   const done=!!S.done[l.id];
   const locked=i>0&&!S.done[LESSONS[i-1].id];
   return `<button class="lcard enter ${done?"done":""}" data-i="${i}" style="animation-delay:${i*60}ms" ${locked?"disabled":""}>
    <span class=ln>${done?"✓":i+1}</span>
    <span class=lt><b>${l.t}</b><span>${l.d}</span></span>
    <span class=go>${locked?"закрой урок выше":done?"пройдено":"открыть →"}</span>
   </button>`}).join("")}
 </div>`;
 app.querySelectorAll(".lcard:not(:disabled)").forEach(b=>b.onclick=()=>{sfx.tap();openStep(+b.dataset.i,0)});
}

/* ---------- step engine ---------- */
let cur={li:0,si:0,tried:false};
function openStep(li,si){
 cur={li,si,tried:false,t:0,moved:false};
 const L=LESSONS[li],st=L.steps[si];
 const head=`<div class=kick>Урок ${li+1} · ${L.t} · шаг ${si+1} из ${L.steps.length}</div><h2>${st.h}</h2><p class=txt>${st.p||""}</p>`;
 let body="",nav="";
 if(st.k==="exp"){
  body=figOf(st.fig)+petSay(st.pet);
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button><button class=btn id=nxt>Дальше</button></div>`;
 }else if(st.k==="thermo"){
  body=`<div class=thermo><div class=val id=tval>0°</div><div id=tfig>${thermoSVG(0)}</div></div>
  <div class=thermobtns><button class=tbtn id=tminus aria-label="Холоднее">−</button><button class=tbtn id=tplus aria-label="Теплее">+</button></div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }else if(st.k==="numline"){
  body=`<div class=axis>${axisSVG()}</div><div class=cap>Нажми на отметку нужного числа</div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }else if(st.k==="cmpnum"){
  body=`<div class=cmp><span class="${st.A<0?"neg":""}">${st.A}</span><span class=sign id=qs>?</span><span class="${st.B<0?"neg":""}">${st.B}</span></div>
  <div class=opts style="grid-template-columns:repeat(3,1fr)">
   <button class=opt data-i="0"><span class=word>&lt;</span></button>
   <button class=opt data-i="1"><span class=word>=</span></button>
   <button class=opt data-i="2"><span class=word>&gt;</span></button></div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }else if(st.k==="angles"){
  body=`<div class=stage id=astage>${anglesSVG(st.A0,st.B0)}</div>
  <div class=anglesl>
   <label>Угол A <span id=la>${st.A0}°</span></label><input type=range id=ra min=20 max=120 value=${st.A0}>
   <label>Угол B <span id=lb>${st.B0}°</span></label><input type=range id=rb min=20 max=120 value=${st.B0}>
  </div>
  <div class=angout id=ao></div>
  <div class=row style="margin-top:12px"><button class="btn apr" id=asee>Я увидел: сумма всегда 180°</button></div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }else if(st.k==="pick"){
  body=`<div class=opts>${st.opts.map((o,i)=>`<button class=opt data-i="${i}">${figOf(o.svg)||""}<span class=cap>${o.cap||""}</span></button>`).join("")}</div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }else if(st.k==="choose"){
  body=(st.fig?figOf(st.fig):"")+`<div class=opts>${st.opts.map((o,i)=>`<button class=opt data-i="${i}"><span class=word>${o.w}</span></button>`).join("")}</div><div id=fb></div>`;
  nav=`<div class=navrow><button class="btn ghost" id=back>Назад</button></div>`;
 }
 app.innerHTML=`<article class="card enter">${head}<div class=dots>${L.steps.map((_,i)=>`<i class="${i<si?'done':i===si?'on':''}"></i>`).join("")}</div>${body}${nav}</article>`;
 bind(st);
 const bk=$("#back");if(bk)bk.onclick=()=>{sfx.tap();if(cur.si>0)openStep(cur.li,cur.si-1);else renderMap()};
 const nx=$("#nxt");if(nx)nx.onclick=()=>{sfx.soft();next()};
}
function next(){
 const L=LESSONS[cur.li];
 if(cur.si<L.steps.length-1)openStep(cur.li,cur.si+1);
 else{ S.done[L.id]=true;save();renderResult(); }
}
function renderResult(){
 const li=cur.li,L=LESSONS[li];
 const isLast=li===LESSONS.length-1;
 sfx.win();burst(innerWidth/2,240,110,8);
 if(!isLast)addXP(20);
 app.innerHTML=`<article class="card enter"><div class=result>
  <div class=kick>Урок пройден</div>
  <div class=big>★</div>
  <img class=winimg src="${CFG.winImg}" alt="Победа">
  <h2>${L.t} — готово!</h2>
  <p class=txt style="text-align:center">Все ${L.steps.length} шагов этого урока пройдены.</p>
  ${petSay(isLast?CFG.finalPet:"Отлично! Следующий урок уже открыт. Идём дальше?")}
  <div class=row style="margin-top:14px">
   <button class="btn ghost" id=tomap>К списку уроков</button>
   ${!isLast?'<button class=btn id=nextl>Следующий урок</button>':""}
  </div>
 </div></article>`;
 $("#tomap").onclick=()=>{sfx.tap();renderMap()};
 const nl=$("#nextl");if(nl)nl.onclick=()=>{sfx.tap();openStep(li+1,0)};
}
function winStep(msg,pet,xpN=10,el){
 addXP(xpN,el);
 const L=LESSONS[cur.li];
 const last=cur.si===L.steps.length-1;
 $("#fb").innerHTML=fbHTML(true,msg,last?"Это последний шаг урока.":"Жми «Дальше».")+petSay(pet);
 const nav=app.querySelector(".navrow");
 nav.innerHTML=`<button class="btn ghost" id=back>Назад</button><button class=btn id=nxt>${last?"Завершить урок":"Дальше"}</button>`;
 $("#back").onclick=()=>{sfx.tap();if(cur.si>0)openStep(cur.li,cur.si-1);else renderMap()};
 $("#nxt").onclick=()=>{sfx.soft();next()};
 app.querySelectorAll(".opt,.tbtn,.axis circle").forEach(x=>{x.style.pointerEvents="none";x.classList&&x.classList.add("dis")});
 if(last)setTimeout(()=>burst(innerWidth/2,240,80,7),400);
}
function loseStep(msg,pet){
 sfx.bad();
 const card=app.querySelector(".card");card.classList.add("shake");setTimeout(()=>card.classList.remove("shake"),500);
 $("#fb").innerHTML=fbHTML(false,msg,pet)+`<div class=petsay><img src="${CFG.comfortImg}" alt=""><div class=say><b>${CFG.comfortName}:</b> Не расстраивайся — ошибка это нормально. Прочитай подсказку ещё раз и попробуй снова, у тебя точно получится.</div></div>`;
}
function bind(st){
 if(st.k==="exp")return;
 if(st.k==="thermo"){
  const lo=(st.min!==undefined?st.min:-10),hi=(st.max!==undefined?st.max:10);
  const draw=()=>{$("#tfig").innerHTML=thermoSVG(cur.t);const v=$("#tval");v.textContent=(cur.t>0?"+":"")+cur.t+"°";v.style.color=cur.t>0?"var(--apricot)":cur.t<0?"var(--lilac)":"var(--fg)"};
  draw();
  const step=d=>{if(cur.tried)return;const nt=cur.t+d;if(nt<lo||nt>hi)return;cur.t=nt;sfx.tap();draw();
   if(cur.t===st.t){cur.tried=true;sfx.ok();winStep(st.win,st.pet,10,$("#tfig"))}};
  $("#tminus").onclick=()=>step(-1);
  $("#tplus").onclick=()=>step(1);
 }
 if(st.k==="numline"){
  app.querySelectorAll(".axis circle").forEach(c=>c.onclick=()=>{
   if(cur.tried)return;
   const n=+c.dataset.n;
   if(n===st.n){cur.tried=true;sfx.ok();c.setAttribute("fill","rgba(169,209,142,.5)");winStep(`Точно! Это число ${n}.`,st.pet,10,c)}
   else loseStep(`Это ${n}. ${Math.abs(n-st.n)<=1?"Горячо, почти попал!":"Холодно."} ${n<st.n?"Ищи правее — к числам побольше.":"Ищи левее — к числам поменьше."}`,st.pet);
  });
 }
 if(st.k==="cmpnum"){
  const a=st.A,b=st.B,cor=a>b?0:a<b?2:1;
  app.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
   if(cur.tried)return;cur.tried=true;
   const j=+btn.dataset.i;
   app.querySelectorAll(".opt").forEach(x=>x.classList.add("dis"));
   $("#qs").textContent=["<","=",">"][j];
   if(j===cor){sfx.ok();btn.classList.add("ok");winStep("Верно!",st.pet,10,btn)}
   else{btn.classList.add("bad");app.querySelector(`.opt[data-i="${cor}"]`).classList.add("ok");
    let why;
    if(cor===1)why=`Они равны: ${a} = ${b}.`;
    else if(a<b)why=`${a} меньше ${b}. ${a<0&&b<0?"Оба с минусом: ближе к нулю — больше.":a<0?"Любой минус меньше любого плюса (и нуля).":"Кто левее на числовой прямой — тот меньше."}`;
    else why=`${a} больше ${b}. ${a<0&&b<0?"Оба с минусом: ближе к нулю — больше.":"Кто правее на числовой прямой — тот больше."}`;
    loseStep(why,st.pet);
   }
  });
 }
 if(st.k==="angles"){
  const upd=()=>{
   let A=+$("#ra").value,B=+$("#rb").value;
   const maxB=160-A;if(B>maxB){B=maxB;$("#rb").value=B}
   const maxA=160-B;if(A>maxA){A=maxA;$("#ra").value=A}
   $("#astage").innerHTML=anglesSVG(A,B);
   $("#la").textContent=A+"°";$("#lb").textContent=B+"°";
   $("#ao").innerHTML=`<span>A = ${A}°</span><span>B = ${B}°</span><span>C = ${180-A-B}°</span><span style="color:var(--mint)">A+B+C = 180°</span>`;
  };
  $("#ra").oninput=()=>{cur.moved=true;sfx.tap();upd()};
  $("#rb").oninput=()=>{cur.moved=true;sfx.tap();upd()};
  upd();
  $("#asee").onclick=e=>{
   if(cur.tried)return;
   if(!cur.moved){loseStep("Сначала покрути оба ползунка — убедись сам, что сумма углов не меняется.",st.pet);return}
   cur.tried=true;sfx.ok();winStep(st.win,st.pet,10,e.target);
  };
 }
 if(st.k==="pick"){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(cur.tried)return;cur.tried=true;
   const o=st.opts[+b.dataset.i];
   app.querySelectorAll(".opt").forEach(x=>x.classList.add("dis"));
   if(o.ok){sfx.ok();b.classList.add("ok");winStep("Верно!",st.pet,10,b)}
   else{b.classList.add("bad");app.querySelector(`.opt[data-i="${st.opts.findIndex(x=>x.ok)}"]`).classList.add("ok");loseStep(o.why,st.pet)}
  });
 }
 if(st.k==="choose"){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(cur.tried)return;cur.tried=true;
   const o=st.opts[+b.dataset.i];
   app.querySelectorAll(".opt").forEach(x=>x.classList.add("dis"));
   if(o.ok){sfx.ok();b.classList.add("ok");winStep("Верно!",st.pet,10,b)}
   else{b.classList.add("bad");app.querySelector(`.opt[data-i="${st.opts.findIndex(x=>x.ok)}"]`).classList.add("ok");loseStep(o.why,st.pet)}
  });
 }
}

/* sound toggle */
$("#snd").onclick=()=>{sound=!sound;S.sound=sound;save();sfx.tap();
 $("#snd").innerHTML=sound?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'};
renderMap();
</script></body></html>
