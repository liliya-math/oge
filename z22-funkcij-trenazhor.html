(function (root) {

      if (L.label) {

−2?","o":["Две","Одна","Три","Ни одной"],"a":0,"h":"Решите (x − 2)² − 3 = −2 и проверьте, что оба корня не меньше 1.","r":"x = 1 и x = 3, оба на промежутке x ≥ 1: две точки, значит m = −2 не подходит."},{"t":"c","q":"При каких m общая точка ровно одна?","o":["m = −3 и −2 < m ≤ 2","m = −3 и −2 ≤ m ≤ 2","m = −3 и −2 < m < 2","−3 ≤ m ≤ 2"],"a":0,"h":"Ровно одна: вершина, а также промежуток между −2 и 2. Проверьте оба конца.","r":"m = −2 даёт две точки (не подходит), m = 2 даёт одну: прямая в выколотую точку не попадает. Ответ: m = −3 и −2 < m ≤ 2."}]},{"title":"Задача 5. Модуль трёхчлена и y = kx","cond":"Постройте график функции y = |x² − 4x|. Определите, при каких значениях k прямая y = kx имеет с графиком ровно одну общую точку.","spec":["E",4],"figAt":2,"steps":[{"t":"c","q":"Какая точка принадлежит графику и прямой y = kx при любом k?","o":["O(0; 0)","(4; 0)","(2; 4)","такой точки нет"],"a":0,"h":"Подставьте x = 0.","r":"Прямая y = kx проходит через O, а график y = |x² − 4x| при x = 0 даёт 0. Значит, общая точка есть всегда."},{"t":"n","q":"Чему равна ордината вершины отражённой части y = −x² + 4x (при 0 < x < 4)?","o":null,"a":4,"h":"Вершина при x = 2.","r":"y(2) = −4 + 8 = 4. Вершина (2; 4)."},{"t":"n","q":"Сколько общих точек при k = 2?","o":null,"a":3,"h":"Корни: x = 0, x = 4 + k (если k ≥ 0), x = 4 − k (если 0 < k < 4).","r":"x = 0, x = 6 (6 ≥ 4) и x = 2 (0 < 2 < 4). Три точки."},{"t":"n","q":"Сколько общих точек при k = −4?","o":null,"a":1,"h":"x = 4 + k = 0 попадает в корень x = 0; других корней нет.","r":"Остаётся только O: одна точка, значит k = −4 подходит."},{"t":"c","q":"При каких k общая точка ровно одна?","o":["−4 ≤ k < 0","−4 < k < 0","−4 ≤ k ≤ 0","k ≤ −4"],"a":0,"h":"Проверьте оба конца: k = −4 и k = 0.","r":"При k = −4 точка одна, при k = 0 две (O и (4; 0)). Ответ: −4 ≤ k < 0."}]}];
const MK={A:CORE.famA,B:CORE.famB,C:CORE.famC,D:CORE.famD,E:CORE.famE};
function mk(t){return MK[t.spec[0]].apply(null,t.spec.slice(1))}
let cur=0,prog=T.map(()=>0),tries=0;
const tabs=document.getElementById('tabs'),box=document.getElementById('box'),pb=document.getElementById('pb');
function norm(s){return parseFloat(String(s).replace(',','.').replace('−','-').replace(/\s/g,''))}
function renderTabs(){tabs.innerHTML='';T.forEach((t,k)=>{const b=document.createElement('button');b.textContent='Задача '+(k+1)+(prog[k]===t.steps.length?' (готово)':'');if(k===cur)b.className='on';b.onclick=()=>{cur=k;tries=0;render()};tabs.appendChild(b)})}
function render(){
  renderTabs();
  const t=T[cur],F=mk(t),n=t.steps.length;pb.style.width=(prog[cur]/n*100)+'%';
  let h='<div class="card"><span class="tag">'+t.title+'</span><div class="cond">'+t.cond+'</div>';
  if(prog[cur]>=t.figAt&&prog[cur]<n)h+='<div class="figwrap">'+CORE.drawTask(F,{theme:'dark',w:340,uid:'t'+cur,noMarks:true,noLabels:true})+'</div>';
  for(let k=0;k<prog[cur]&&k<n;k++){h+='<div class="done">'+t.steps[k].r+'</div>'}
  if(prog[cur]<n){
    const s=t.steps[prog[cur]];
    h+='<p class="q" style="margin-top:16px">Шаг '+(prog[cur]+1)+' из '+n+'. '+s.q+'</p><div id="in"></div><div id="fb"></div>';
  }else{
    h+='<p class="ansline" style="margin-top:14px">Ответ: '+F.answerText+'</p><div class="live"><div>Проверьте сами: двигайте прямую и считайте общие точки. Нужно ровно '+F.target+'.</div><input type="range" id="sl" min="'+F.sliderMin+'" max="'+F.sliderMax+'" step="'+F.step+'" value="'+F.sliderMin+'"><div class="big2" id="lc"></div><div id="lf"></div></div>';
    h+='<p style="margin-top:14px">'+(cur<T.length-1?'<button class="btn" onclick="cur++;tries=0;render()">Следующая задача</button>':'Это была последняя. Теперь решите любую из них с чистого листа, затем возьмите тренажёр с новыми числами.')+'</p>';
  }
  box.innerHTML=h+'</div>';
  if(prog[cur]<n)drawStep(t.steps[prog[cur]]);
  else{const sl=document.getElementById('sl');const upd=()=>{const v=parseFloat(sl.value),c=CORE.points(F.F,F.kind,v).length;document.getElementById('lc').textContent=F.sliderLabel+' = '+String(v).replace('.',',').replace('-','−')+': общих точек '+c+(c===F.target?' (подходит)':'');document.getElementById('lf').innerHTML=CORE.drawTask(F,{theme:'dark',w:340,uid:'l'+cur,noLabels:true,noMarks:true,line:{kind:F.kind,v:v,label:F.sliderLabel+' = '+String(v).replace('.',',').replace('-','−')}})};sl.oninput=upd;upd()}
}
function drawStep(s){
  const el=document.getElementById('in');
  if(s.t==='c'){
    s.o.map((v,k)=>[v,k]).sort(()=>Math.random()-.5).forEach(([v,k])=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>check(k===s.a,b);el.appendChild(b)});
  }else{
    el.innerHTML='<input class="num" id="num" inputmode="decimal" placeholder="Ответ"> <button class="btn" id="go">Проверить</button>';
    const f=()=>check(Math.abs(norm(document.getElementById('num').value)-s.a)<1e-9,null);
    document.getElementById('go').onclick=f;document.getElementById('num').onkeydown=e=>{if(e.key==='Enter')f()};
  }
}
function check(ok,btn){
  const s=T[cur].steps[prog[cur]],fb=document.getElementById('fb');
  if(ok){
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(btn)btn.classList.add('ok');
    const inp=document.getElementById('num');if(inp)inp.disabled=true;const go=document.getElementById('go');if(go)go.disabled=true;
    fb.innerHTML='<div class="exp">Верно. '+s.r+'</div><button class="btn" onclick="prog[cur]++;tries=0;render()">Дальше</button>';
  }else{
    tries++;if(btn){btn.classList.add('bad');btn.disabled=true}
    fb.innerHTML='<div class="hint">Не то. Подсказка: '+s.h+'</div>'+(tries>=3?'<button class="btn ghost" onclick="reveal()">Показать ответ</button>':'');
  }
}
function reveal(){const s=T[cur].steps[prog[cur]];document.getElementById('fb').innerHTML='<div class="exp">'+s.r+'</div><button class="btn" onclick="prog[cur]++;tries=0;render()">Дальше</button>'}
render();
</script></body></html>
