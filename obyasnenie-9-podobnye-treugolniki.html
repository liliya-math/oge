=\"middle\">B</text><text x=\"170.0\" y=\"23.0\" class=\"tx\" text-anchor=\"middle\">C</text></svg></div><div class=\"gcap\">Стороны в 2 раза длиннее, а площадь в 4 раза больше</div>", "h": "Площади подобных треугольников", "box": "<span class=\"nb fm\">S(DEF) : S(ABC) = k²</span>", "say": "key", "n": 61, "_fin": 1, "_sp": 1}, {"kind": "widget", "kick": "5 · Отношения · попробуй сам", "key": "simk", "h": "Меняем k", "n": 62, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "5 · Отношения · что показал рисунок", "body": "<p>Периметр растёт вместе с k. Площадь растёт быстрее: в площади длина умножается на ширину, и получается <span class=\"nb fm\">k · k = k².</span></p><p>Например, <span class=\"nb\">k = 3</span>. Периметр в 3 раза больше, площадь в 9 раз больше.</p>", "box": "<span class=\"nb fm\">P(DEF) : P(ABC) = k</span><br><span class=\"nb fm\">S(DEF) : S(ABC) = k²</span>", "say": "key", "n": 63, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p><span class=\"nb\">k = 3</span>. Площадь △ABC равна 5. Найди площадь △DEF.</p><div class=\"fig\"><svg viewBox=\"0 0 400 230\" width=\"400\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"24.0\" y1=\"190.0\" x2=\"110.1\" y2=\"190.0\" class=\"ln\" /><line x1=\"110.1\" y1=\"190.0\" x2=\"77.8\" y2=\"142.5\" class=\"ln\" /><line x1=\"77.8\" y1=\"142.5\" x2=\"24.0\" y2=\"190.0\" class=\"ln\" /><text x=\"12.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"121.2\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"80.7\" y=\"134.9\" class=\"tx\" text-anchor=\"middle\">C</text><line x1=\"156.1\" y1=\"190.0\" x2=\"328.3\" y2=\"190.0\" class=\"ln\" /><line x1=\"328.3\" y1=\"190.0\" x2=\"263.8\" y2=\"95.1\" class=\"ln\" /><line x1=\"263.8\" y1=\"95.1\" x2=\"156.1\" y2=\"190.0\" class=\"ln\" /><text x=\"144.7\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">D</text><text x=\"339.5\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">E</text><text x=\"266.6\" y=\"87.4\" class=\"tx\" text-anchor=\"middle\">F</text></svg></div><div class=\"gcap\">k = 3, S(△ABC) = 5</div>", "a": [45], "why": "Площадь S(DEF) равна <span class=\"nb fm\">k² · S(ABC),</span> то есть <span class=\"nb fm\">9 · 5 = 45.</span>", "h": ["Площадь умножаем на k², то есть на <span class=\"nb\">3 · 3</span>."], "back": 62, "n": 64, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "choice", "q": "<p>Коэффициент подобия равен 4. Во сколько раз площадь второго треугольника больше?</p><div class=\"fig\"><svg viewBox=\"0 0 400 230\" width=\"400\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"24.0\" y1=\"190.0\" x2=\"110.1\" y2=\"190.0\" class=\"ln\" /><line x1=\"110.1\" y1=\"190.0\" x2=\"77.8\" y2=\"142.5\" class=\"ln\" /><line x1=\"77.8\" y1=\"142.5\" x2=\"24.0\" y2=\"190.0\" class=\"ln\" /><text x=\"12.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"121.2\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"80.7\" y=\"134.9\" class=\"tx\" text-anchor=\"middle\">C</text><line x1=\"156.1\" y1=\"190.0\" x2=\"328.3\" y2=\"190.0\" class=\"ln\" /><line x1=\"328.3\" y1=\"190.0\" x2=\"263.8\" y2=\"95.1\" class=\"ln\" /><line x1=\"263.8\" y1=\"95.1\" x2=\"156.1\" y2=\"190.0\" class=\"ln\" /><text x=\"144.7\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">D</text><text x=\"339.5\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">E</text><text x=\"266.6\" y=\"87.4\" class=\"tx\" text-anchor=\"middle\">F</text></svg></div><div class=\"gcap\">k = 4</div>", "a": 3, "why": "Площади относятся как k², то есть <span class=\"nb fm\">4 · 4 = 16.</span>", "h": ["Площади относятся как k², а не как k."], "opts": ["в 4 раза", "в 8 раз", "в 16 раз"], "back": 62, "n": 65, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Площади подобных треугольников равны 8 и 32. Найди k (второй к первому).</p><div class=\"fig\"><svg viewBox=\"0 0 400 230\" width=\"400\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"24.0\" y1=\"190.0\" x2=\"114.0\" y2=\"190.0\" class=\"ln\" /><line x1=\"114. " y1=\"120.5\" x2=\"160.0\" y2=\"190.0\" class=\"ln\" /><text x=\"148.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">D</text><text x=\"297.1\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">E</text><text x=\"241.6\" y=\"112.9\" class=\"tx\" text-anchor=\"middle\">F</text><text x=\"220.3\" y=\"206.0\" class=\"tm\" text-anchor=\"middle\">?</text></svg></div><div class=\"gcap\">S₁ = 16, S₂ = 36</div>", "a": [7.5], "why": "<span class=\"nb fm\">k² = 36 : 16 = 9 : 4,</span> значит, <span class=\"nb fm\">k = 3 : 2 = 1,5.</span> Сторона большего: <span class=\"nb fm\">5 · 1,5 = 7,5.</span>", "h": ["Найди k² как отношение площадей, потом k, потом умножь сторону на k."], "back": 62, "note": "Запиши десятичной дробью, например 7,5", "n": 67, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "5 · Отношения · высоты и другие линии", "body": "<p>Не только стороны. Все линейные элементы подобных треугольников относятся как k: высоты, медианы, биссектрисы, радиусы вписанной и описанной окружностей.</p><p>Правило простое. То, что измеряется длиной, растёт в k раз. То, что измеряется площадью, растёт в k² раз.</p><p>Пример. <span class=\"nb\">k = 2</span>, высота △ABC равна 5. Тогда высота △DEF равна <span class=\"nb fm\">2 · 5 = 10.</span></p><div class=\"fig\"><svg viewBox=\"0 0 400 230\" width=\"400\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"24.0\" y1=\"190.0\" x2=\"110.1\" y2=\"190.0\" class=\"ln\" /><line x1=\"110.1\" y1=\"190.0\" x2=\"77.8\" y2=\"142.5\" class=\"ln\" /><line x1=\"77.8\" y1=\"142.5\" x2=\"24.0\" y2=\"190.0\" class=\"ln\" /><text x=\"12.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"121.2\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"80.7\" y=\"134.9\" class=\"tx\" text-anchor=\"middle\">C</text><line x1=\"156.1\" y1=\"190.0\" x2=\"328.3\" y2=\"190.0\" class=\"ln\" /><line x1=\"328.3\" y1=\"190.0\" x2=\"263.8\" y2=\"95.1\" class=\"ln\" /><line x1=\"263.8\" y1=\"95.1\" x2=\"156.1\" y2=\"190.0\" class=\"ln\" /><text x=\"144.7\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">D</text><text x=\"339.5\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">E</text><text x=\"266.6\" y=\"87.4\" class=\"tx\" text-anchor=\"middle\">F</text></svg></div><div class=\"gcap\">k = 2, высота △ABC равна 5</div>", "h": "Высоты, медианы, биссектрисы", "box": "длины: k &nbsp;&nbsp; площади: k²", "say": "key", "n": 68, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Высоты подобных треугольников равны 6 и 9. Периметр меньшего треугольника равен 20. Найди периметр большего.</p><div class=\"fig\"><svg viewBox=\"0 0 400 230\" width=\"400\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"24.0\" y1=\"190.0\" x2=\"114.0\" y2=\"190.0\" class=\"ln\" /><line x1=\"114.0\" y1=\"190.0\" x2=\"80.2\" y2=\"140.4\" class=\"ln\" /><line x1=\"80.2\" y1=\"140.4\" x2=\"24.0\" y2=\"190.0\" class=\"ln\" /><text x=\"12.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"125.1\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"83.1\" y=\"132.8\" class=\"tx\" text-anchor=\"middle\">C</text><line x1=\"160.0\" y1=\"190.0\" x2=\"295.0\" y2=\"190.0\" class=\"ln\" /><line x1=\"295.0\" y1=\"190.0\" x2=\"244.4\" y2=\"115.6\" class=\"ln\" /><line x1=\"244.4\" y1=\"115.6\" x2=\"160.0\" y2=\"190.0\" class=\"ln\" /><text x=\"148.6\" y=\"198.9\" class=\"tx\" text-anchor=\"middle\">D</text><text x=\"306.1\" y=\"199.5\" class=\"tx\" text-anchor=\"middle\">E</text><text x=\"247.3\" y=\"108.0\" class=\"tx\" text-anchor=\"middle\">F</text></svg></div><div class=\"gcap\">Высоты 6 и 9, P(△ABC) = 20</div>", "a": [30], "why": "<span class=\"nb fm\">k = 9 : 6 = 1,5.</span> Периметр большего: <span class=\"nb fm\">20 · 1,5 = 30.</span>", "h": ["Высоты относятся как k. Найди k, потом умножь периметр."], "back": 67, "n": 69, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "5 · Отношения · средняя линия", "body": "<p>Частный случай подобия. Пусть M и N — середины сторон AB и AC. Тогда <span class=\"nb fm\">AM : AB = AN : AC = 1 : 2,</span> и △AMN&nbsp;∼&nbsp;△ABC с коэффициентом <span class=\"nb fm\">k = 1 : 2.</span></p><p>Отсюда <span class=\"nb fm\">MN = BC : 2,</span> периметр △AMN в 2 раза меньше периметра △ABC, а площадь △AMN в 4 раза меньше.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"165.0\" y1=\"30.0\" x2=\"45.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"165.0\" y1=\"30.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"45.0\" y1=\"185.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"105.0\" y1=\"107.5\" x2=\"232.5\" y2=\"107.5\" class=\"acc\" stroke-dasharray=\"6 4\"/><circle cx=\"105.0\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><circle cx=\"232.5\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><text x=\"165.0\" y=\"23.0\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"33.9\" y=\"194.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"311.2\" y=\"194.5\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"88.0\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">M</text><text x=\"250.5\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">N</text></svg></div><div class=\"gcap\">M и N — середины сторон AB и AC</div>", "h": "Средняя линия", "n": 70, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>В △ABC точки M и N — середины сторон AB и AC. Площадь △ABC равна 48. Найди площадь △AMN.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"165.0\" y1=\"30.0\" x2=\"45.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"165.0\" y1=\"30.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"45.0\" y1=\"185.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"105.0\" y1=\"107.5\" x2=\"232.5\" y2=\"107.5\" class=\"acc\" stroke-dasharray=\"6 4\"/><circle cx=\"105.0\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><circle cx=\"232.5\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><text x=\"165.0\" y=\"23.0\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"33.9\" y=\"194.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"311.2\" y=\"194.5\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"88.0\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">M</text><text x=\"250.5\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">N</text></svg></div><div class=\"gcap\">M и N — середины сторон. S(△ABC) = 48</div>", "a": [12], "why": "<span class=\"nb fm\">k = 1 : 2,</span> площади относятся как <span class=\"nb fm\">1 : 4. S(AMN) = 48 : 4 = 12.</span>", "h": ["Площади относятся как k², то есть как <span class=\"nb\">1 : 4</span>."], "back": 69, "n": 71, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>M и N — середины сторон AB и AC. Периметр △AMN равен 9. Найди периметр △ABC.</p><div class=\"fig\"><svg viewBox=\"0 0 330 215\" width=\"330\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"165.0\" y1=\"30.0\" x2=\"45.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"165.0\" y1=\"30.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"45.0\" y1=\"185.0\" x2=\"300.0\" y2=\"185.0\" class=\"ln\" /><line x1=\"105.0\" y1=\"107.5\" x2=\"232.5\" y2=\"107.5\" class=\"acc\" stroke-dasharray=\"6 4\"/><circle cx=\"105.0\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><circle cx=\"232.5\" cy=\"107.5\" r=\"3.5\" class=\"dot\"/><text x=\"165.0\" y=\"23.0\" class=\"tx\" text-anchor=\"middle\">A</text><text x=\"33.9\" y=\"194.6\" class=\"tx\" text-anchor=\"middle\">B</text><text x=\"311.2\" y=\"194.5\" class=\"tx\" text-anchor=\"middle\">C</text><text x=\"88.0\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">M</text><text x=\"250.5\" y=\"112.5\" class=\"tx\" text-anchor=\"middle\">N</text></svg></div><div class=\"gcap\">M и N — середины сторон. P(△AMN) = 9</div>", "a": [18], "why": "Периметры относятся как <span class=\"nb fm\">k = 1 : 2.</span> Значит, <span class=\"nb fm\">P(ABC) = 9 · 2 = 18.</span>", "h": ["Периметры относятся как k, а не как k²."], "back": 69, "n": 72, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "6 · Задачи · тень", "body": "<p>Палка 2 м отбрасывает тень 3 м. Тень столба 12 м. Найдём высоту столба h.</p><div class=\"fig\"><svg viewBox=\"0 0 340 200\" width=\"340\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"10.0\" y1=\"168.0\" x2=\"330.0\" y2=\"168.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"168.0\" x2=\"50.0\" y2=\"78.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"78.0\" x2=\"185.0\" y2=\"168.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"250.0\" y1=\"168.0\" x2=\"250.0\" y2=\"138.0\" class=\"ln\" /><line x1=\"250.0\" y1=\"138.0\" x2=\"295.0\" y2=\"168.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"59.0\" y1=\"168.0\" x2=\"59.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"59.0\" y1=\"159.0\" x2=\"50.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"259.0\" y1=\"168.0\" x2=\"259.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"259.0\" y1=\"159.0\" x2=\"250.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"39.0\" y=\"128.0\" class=\"tx\" text-anchor=\"middle\">h</text><text x=\"117.5\" y=\"185.0\" class=\"tx\" text-anchor=\"middle\">12 м</text><text x=\"229.0\" y=\"158.0\" class=\"tx\" text-anchor=\"middle\">2 м</text><text x=\"272.5\" y=\"185.0\" class=\"tx\" text-anchor=\"middle\">3 м</text></svg></div><p>Солнечные лучи идут параллельно. У обоих прямоугольных треугольников угол между лучом и землёй одинаковый. Два угла равны (прямой и этот), значит, треугольники подобны по первому признаку.</p><p>Сходственные стороны: высота к высоте, тень к тени. Пропорция: <span class=\"nb fm\">h : 12 = 2 : 3.</span></p><p>Крест-накрест: <span class=\"nb fm\">3h = 24, h = 8.</span> Ответ: высота столба 8 м.</p>", "h": "Вернёмся к столбу", "n": 73, "_fin": 1, "_sp": 1}, {"kind": "q", "type": "num", "q": "<p>Человек ростом 1,8 м отбрасывает тень 2,4 м. В тот же момент тень дерева 12 м. Найди высоту дерева в метрах.</p><div class=\"fig\"><svg viewBox=\"0 0 340 200\" width=\"340\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"10.0\" y1=\"168.0\" x2=\"330.0\" y2=\"168.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"168.0\" x2=\"50.0\" y2=\"78.0\" class=\"ln\" /><line x1=\"50.0\" y1=\"78.0\" x2=\"170.0\" y2=\"168.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"250.0\" y1=\"168.0\" x2=\"250.0\" y2=\"138.0\" class=\"ln\" /><line x1=\"250.0\" y1=\"138.0\" x2=\"290.0\" y2=\"168.0\" class=\"acc\" stroke-dasharray=\"6 4\"/><line x1=\"59.0\" y1=\"168.0\" x2=\"59.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"59.0\" y1=\"159.0\" x2=\"50.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"259.0\" y1=\"168.0\" x2=\"259.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><line x1=\"259.0\" y1=\"159.0\" x2=\"250.0\" y2=\"159.0\" class=\"ln\" style=\"stroke-width:1.5\"/><text x=\"39.0\" y=\"128.0\" class=\"tx\" text-anchor=\"middle\">?</text><text x=\"110.0\" y=\"185.0\" class=\"tx\" text-anchor=\"middle\">12 м</text><text x=\"221.0\" y=\"158.0\" class=\"tx\" text-anchor=\"middle\">1,8 м</text><text x=\"270.0\" y=\"185.0\" class=\"tx\" text-anchor=\"middle\">2,4 м</text></svg></div>", "a": [9], "why": "<span class=\"nb fm\">1,8 : 2,4 = h : 12.</span> Тогда <span class=\"nb fm\">2,4h = 1,8 · 12 = 21,6</span> и <span class=\"nb\">h = 9</span>.", "h": ["Пропорция: высота к тени у человека равна высоте к тени у дерева."], "back": 72, "n": 74, "_fin": 1, "_sp": 1}, {"kind": "info", "kick": "6 · Задачи · трапеция", "body": "<p>В трапеции ABCD основания BC и AD параллельны. Диагонали пересекаются в точке O. Треугольники BOC и DOA подобны.</p><p>Почему. <span class=\"nb fm\">∠BOC = ∠DOA</span> как вертикальные. <span class=\"nb fm\">∠OBC = ∠ODA</span> как накрест лежащие при <span class=\"nb\">BC ∥ AD</span>. Два угла равны, это первый признак.</p><p>Сходственные стороны: BC и AD, OB и OD, OC и OA.</p><div class=\"fig\"><svg viewBox=\"0 0 340 215\" width=\"340\" role=\"img\" aria-label=\"Чертёж\"><line x1=\"30.0\" y1=\"175.0\" x2=\" function petVoice(c,dest,T0,id,mood){

  const out=c.createGain();out.gain.value=.9;out.connect(dest);
  let NB=null;const noiseBuf=()=>{if(NB)return NB;const len=c.sampleRate*2;NB=c.createBuffer(1,len,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return NB};
  const ramp=(p,pts,n,dur,lin)=>pts.forEach(([k,f],i)=>i?(lin?p.linearRampToValueAtTime(f,n+k*dur):p.exponentialRampToValueAtTime(f,n+k*dur)):p.setValueAtTime(f,n));

    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg).connect(src.frequency);l.start(n);l.stop(n+dur+.05)}
    const mix=c.createGain();mix.gain.value=o.boost||4;
    const Q=o.q||[7,9,11],G=[1,.55,.3];
    for(let j=0;j<fm[0][1].length;j++){const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=Q[j];ramp(bp.frequency,fm.map(([k,F])=>[k,F[j]]),n,dur,true);const g=c.createGain();g.gain.value=G[j];src.connect(bp).connect(g).connect(mix)}
    if(o.noise){const ns=c.createBufferSource();ns.buffer=noiseBuf();const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=o.noise[0];bp.Q.value=.8;const g=c.createGain();g.gain.value=o.noise[1];ns.connect(bp).connect(g).connect(mix);ns.start(n);ns.stop(n+dur+.02)}
    let tail=mix;
    if(o.am){const am=c.createGain();am.gain.value=1-o.am[1]/2;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.am[0];lg.gain.value=o.am[1]/2;l.connect(lg).connect(am.gain);l.start(n);l.stop(n+dur+.05);mix.connect(am);tail=am}
    const env=c.createGain(),v=o.vol||.16,a=o.att||.04;env.gain.setValueAtTime(0,n);env.gain.linearRampToValueAtTime(v,n+a);env.gain.setValueAtTime(v,n+Math.max(a,dur*(o.hold||.6)));env.gain.exponentialRampToValueAtTime(.0001,n+dur);

  const re=new RegExp(`([\\(\\[])${N};${N}([\\)\\]])|${N}(<=?)[xm](<=?)${N}|${N}`,'g');

    const gr=ctx.createLinearGradient(0,0,r.width,r.height);gr.addColorStop(0,'#eee0c8');gr.addColorStop(.5,'#eee0c8');gr.addColorStop(1,'#c9ab82');ctx.fillStyle=gr;ctx.fillRect(0,0,r.width,r.height);

function score(){
  let ok=0,tot=0,solo=0,hint=0,fok=0,ftot=0,mok=0,mtot=0;
  for(const t of L){if(t.kind!=='q')continue;tot++;const r=S.r[t.n]||{};if(t.fin)ftot++;else mtot++;
    if(r.st==='ok'){ok++;if(t.fin)fok++;else mok++;if(r.hints)hint++;else solo++}}
  const pct=tot?Math.round(ok/tot*100):0;
  return {ok,tot,solo,hint,fok,ftot,mok,mtot,pct,pts:ok,max:tot,maxAll:tot,auto:tot,grade:'',lvl:pct>=83?'уверенно':pct>=50?'почти уверенно':'тема ещё не сложилась',geo:0};
}

function csPdf(canvas){
  const W=canvas.width,PH=Math.round(W*297/210),pages=Math.max(1,Math.ceil(canvas.height/PH)),imgs=[];
  for(let k=0;k<pages;k++){
    const c=document.createElement('canvas');c.width=W;c.height=PH;const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,W,PH);
    g.drawImage(canvas,0,k*PH,W,Math.min(PH,canvas.height-k*PH),0,0,W,Math.min(PH,canvas.height-k*PH));
    const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);imgs.push(u);
  }
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;put(n+' 0 obj\n');fn();put('\nendobj\n')};
  put('%PDF-1.4\n');
  obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>put('<</Type/Pages/Count '+pages+'/Kids['+imgs.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']>>'));
  imgs.forEach((u,k)=>{
    const p=3+k*3;
    obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p+1,()=>put('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+PH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+u.length+'>>\nstream\n');put(u);put('\nendstream')});
  });
  const n=3+pages*3,xr=len;
  put('xref\n0 '+n+'\n0000000000 65535 f \n');
  for(let i=1;i<n;i++)put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function csExport(kind){
  csMsg('Готовлю файл…');
  csLoad(ok=>{
    if(!ok){csMsg('Не удалось загрузить модуль. Открою печать: выбери «Сохранить как PDF».');csBuildX();setTimeout(()=>window.print(),300);return}
    const x=csBuildX();
    window.html2canvas(x,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:csFixRad}).then(cv=>{
      const name='shpargalka-'+(TOPIC.id||'urok');
      if(kind==='jpg')cv.toBlob(b=>{csDownload(b,name+'.jpg');csMsg('Готово: файл JPEG сохранён.')},'image/jpeg',.92);
      else{csDownload(csPdf(cv),name+'.pdf');csMsg('Готово: файл PDF сохранён.')}
      x.remove();
    }).catch(()=>{x.remove();csMsg('Не получилось собрать файл. Сделай скриншот шпаргалки.')});
  });
}
