<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16231A">
<title>Тренажёр: ОГЭ, формулы и правила наизусть</title>
<style>
:root{--bg:#16231a;--card:rgba(238,224,200,.07);--line:rgba(238,224,200,.16);--fg:#EEE0C8;--muted:rgba(238,224,200,.62);--cobalt:#2F5BB5;--apricot:#DD7A3A;--yellow:#E2B04A;--mint:#c9ab82;--miss:#dd7a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:26px;margin:6px 0 4px;line-height:1.25}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.big{font-size:32px;margin:8px 0 14px;line-height:1.7}
.rad{display:inline-block;white-space:nowrap;vertical-align:baseline;padding-left:.7em;line-height:1.15}
.ov{position:relative;display:inline-block;border-top:.07em solid var(--fg);padding:.05em .1em 0 .08em}
.rs{position:absolute;right:100%;margin-right:-.01em;top:-.07em;width:.7em;height:calc(100% - .07em);overflow:visible;fill:var(--fg);stroke:none}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--fg);padding:0 4px}
input.ans{font:inherit;font-size:26px;width:100%;max-width:240px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(238,224,200,.08);color:var(--fg)}
input.ans:focus,input.nm:focus{outline:2px solid var(--yellow);outline-offset:1px}
input.nm{font:inherit;font-size:20px;width:100%;max-width:360px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(238,224,200,.08);color:var(--fg)}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:var(--cobalt);color:#ffffff;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:14px;margin:2px 4px 2px 0}
.opt{font:inherit;font-size:20px;padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:rgba(238,224,200,.06);color:var(--fg);cursor:pointer;margin:0 10px 10px 0}
.opt:active{background:rgba(238,224,200,.16)}
.dots{margin:4px 0 10px}
.dot{display:inline-block;width:15px;height:15px;border:2px solid var(--fg);border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--mint);border-color:var(--mint)}
.ok{color:var(--mint);font-weight:700}
.bad{color:var(--miss);font-weight:700}
.hint{border-left:4px solid var(--yellow);background:rgba(226,176,74,.1);padding:10px 14px;border-radius:10px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0;cursor:pointer}
.row[disabled]{opacity:.45;cursor:not-allowed}
.row .st{font-size:14px;color:var(--muted);white-space:nowrap}
.row.passed .st{color:var(--mint)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
table.rep th{color:var(--muted);font-weight:600}
.link{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
svg{display:block;margin:6px 0}
@media(max-width:520px){body{font-size:17px}.big{font-size:28px}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.fr>span:last-child{padding:0 4px}.f{display:block;font-size:1.3em;font-weight:700;color:#dd7a3a;margin:8px 0;white-space:nowrap;overflow-x:auto;text-indent:0}.f.t{font-size:1.05em}.th{text-indent:1.5em}.th .f{text-indent:0}
</style>

<script>
'use strict';
//CONTENT-START
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const f=t=>`<span class="f">${t}</span>`;
const ft=t=>`<span class="f t">${t}</span>`;
const dd=x=>String(Math.round(x*1e6)/1e6).replace('.',',').replace('-','−');
const sg=n=>(n<0?'−':'+')+' '+Math.abs(n);
const sv=n=>n<0?'−'+Math.abs(n):''+n;
const N=(prompt,q,ans,why,hint,lab)=>({type:'num',prompt,q,ans,why:'Ответ: <b>'+dd(ans)+'</b>. '+why,hint,tag:()=>lab,etag:lab});
const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];
const P=(a,b,c)=>{let s=(a==1?'':a==-1?'−':a)+'x²';if(b)s+=' '+(b<0?'−':'+')+' '+(Math.abs(b)==1?'':Math.abs(b))+'x';if(c)s+=' '+sg(c);return s+' = 0'};
const lin=(k,b)=>'y = '+(k==1?'':k==-1?'−':k)+'x '+sg(b);

/* банк: [вопрос, верный, неверный1, неверный2, неверный3, пояснение] */
function MC(items,gens){const hist=[];return()=>{
 if(!items.length||(gens.length&&Math.random()<0.4))return pick(gens)();
 let k,t=0;do{k=ri(0,items.length-1);t++}while(hist.includes(k)&&t<40);
 hist.push(k);if(hist.length>Math.min(5,items.length-1))hist.shift();
 const[q,c,w1,w2,w3,why]=items[k];
 return{type:'opt',prompt:'Выбери верный ответ.',q,options:shuf([c,w1,w2,w3]),correct:c,why:'Правильно: <b>'+c+'</b>.'+(why?' '+why:''),etag:q.replace(/<[^>]+>/g,'').slice(0,40)}}}

/* 1. наизусть */
const gz1=[
 ()=>{const n=ri(11,25);return N('Квадрат числа.',n+'²',n*n,n+' · '+n+' = '+n*n+'.','Разложи: '+n+' · '+n+'.','квадраты')},
 ()=>{const n=ri(2,10);return N('Куб числа.',n+'³',n**3,n+' · '+n+' · '+n+' = '+n**3+'.','Сначала '+n+' · '+n+', потом ещё раз на '+n+'.','кубы')},
 ()=>{const k=ri(5,10);return N('Степень двойки.','2<sup>'+k+'</sup>',2**k,'2<sup>'+k+'</sup> = '+2**k+'.','Удваивай: 2, 4, 8, 16, 32…','степени двойки')},
 ()=>{const[a,b,v]=pick([[1,2,.5],[1,4,.25],[3,4,.75],[1,5,.2],[2,5,.4],[3,5,.6],[1,8,.125],[3,8,.375],[5,8,.625],[1,20,.05],[1,25,.04],[1,10,.1]]);return N('Запиши в виде десятичной дроби.',fr(a,b),v,a+' : '+b+' = '+dd(v)+'.','Раздели числитель на знаменатель.','дробь в десятичную')},
 ()=>{const[a,b,v]=pick([[1,2,50],[1,4,25],[3,4,75],[1,5,20],[1,8,12.5],[1,10,10],[1,20,5],[2,5,40],[3,5,60],[3,8,37.5]]);return N('Сколько процентов составляет дробь? Ответ — число без знака %.',fr(a,b),v,'Дробь '+a+'/'+b+' = '+dd(v)+'%.','Переведи в десятичную дробь и умножь на 100.','дробь в проценты')},
 ()=>{const[a,b,c]=pick(TR),k=ri(1,3);return N('Найди гипотенузу прямоугольного треугольника с катетами '+a*k+' и '+b*k+'.','c = ?',c*k,'Это тройка '+a+'–'+b+'–'+c+', увеличенная в '+k+' р. Гипотенуза '+c*k+'.','Вспомни тройки 3–4–5, 5–12–13, 8–15–17, 7–24–25.','пифагоровы тройки')}];

/* 2. степени и корни */
const b2=[
 ['a<sup>m</sup> · a<sup>n</sup> =','a<sup>m+n</sup>','a<sup>mn</sup>','a<sup>m−n</sup>','(2a)<sup>m+n</sup>','При умножении степеней с одним основанием показатели складывают.'],
 ['a<sup>m</sup> : a<sup>n</sup> =','a<sup>m−n</sup>','a<sup>m+n</sup>','a<sup>m/n</sup>','a<sup>mn</sup>','При делении показатели вычитают.'],
 ['(a<sup>m</sup>)<sup>n</sup> =','a<sup>mn</sup>','a<sup>m+n</sup>','a<sup>m−n</sup>','m · a<sup>n</sup>','Степень в степени: показатели перемножают.'],
 ['a<sup>−n</sup> =',fr(1,'a<sup>n</sup>'),'−a<sup>n</sup>','a<sup>n</sup>','−n · a','Минус в показателе не делает число отрицательным.'],
 ['a<sup>0</sup> (a ≠ 0) =','1','0','a','не определено'],
 ['√(a²) =','|a|','a','−a','a²','Корень неотрицателен: √((−3)²) = 3.'],
 ['√(ab) при a ≥ 0, b ≥ 0 равен','√a · √b','√a + √b','a · √b','√a : √b'],
 ['(√a)² при a ≥ 0 равно','a','|a|','√a','2a'],
 ['Верно ли, что √(a+b) = √a + √b?','Нет, в общем случае неверно','Да, всегда','Верно только при a = b','Верно только при a < 0','Проверка: √(9+16) = 5, а √9 + √16 = 7.'],
 ['Между какими целыми числами находится √70?','8 и 9','7 и 8','9 и 10','35 и 36','64 < 70 < 81, значит 8 < √70 < 9.'],
 ['Какое число больше: √50 или 7?','7','√50','Они равны','Сравнить нельзя','7² = 49 < 50, значит √50 > 7. Проверь: √50 больше.'.replace('7','7')]
];
b2[10]=['Какое число больше: √50 или 7?','√50','7','Они равны','Сравнить нельзя','7² = 49, а 50 > 49, значит √50 > 7.'];
const gz2=[
 ()=>{let a,m,n,k,e;do{a=pick([2,3,5]);m=ri(2,6);n=ri(2,6);k=ri(1,m+n);e=m+n-k}while(e<1||e>(a==5?3:5));return N('Вычисли.',a+'<sup>'+m+'</sup> · '+a+'<sup>'+n+'</sup> : '+a+'<sup>'+k+'</sup>',a**e,'Показатели: '+m+' + '+n+' − '+k+' = '+e+'. '+a+'<sup>'+e+'</sup> = '+a**e+'.','Основание не меняется, показатели складывают и вычитают.','свойства степеней')},
 ()=>{let n;do{n=ri(10,200)}while(Number.isInteger(Math.sqrt(n)));const m=Math.floor(Math.sqrt(n));return N('Найди целое число m, для которого m < √'+n+' < m + 1.','√'+n,m,m+'² = '+m*m+' < '+n+' < '+(m+1)**2+' = '+(m+1)+'².','Найди два соседних квадрата, между которыми лежит '+n+'.','оценка корня')},
 ()=>{const[a,k]=pick([[2,1],[2,2],[2,3],[2,4],[5,1],[5,2],[10,1],[10,2],[10,3],[4,2]]);return N('Вычисли. Ответ запиши десятичной дробью.',a+'<sup>−'+k+'</sup>',1/a**k,a+'<sup>−'+k+'</sup> = 1 / '+a**k+' = '+dd(1/a**k)+'.','a<sup>−n</sup> = 1 / a<sup>n</sup>.','отрицательная степень')}];

/* 3. формулы сокращённого умножения */
const b3=[
 ['(a + b)² =','a² + 2ab + b²','a² + b²','a² + ab + b²','a² + 2ab − b²'],
 ['(a − b)² =','a² − 2ab + b²','a² − b²','a² − 2ab − b²','a² + 2ab + b²'],
 ['a² − b² =','(a − b)(a + b)','(a − b)²','(a + b)²','(a − b)(a − b)'],
 ['(a − b)(a + b) =','a² − b²','a² + b²','a² − 2ab + b²','a² + 2ab + b²'],
 ['Разложи на множители: x² − 49','(x − 7)(x + 7)','(x − 7)²','(x + 7)²','(x − 49)(x + 1)'],
 ['(x + 3)² =','x² + 6x + 9','x² + 9','x² + 3x + 9','x² + 6x + 6','Не забудь удвоенное произведение: 2 · x · 3 = 6x.'],
 ['(2x − 1)² =','4x² − 4x + 1','4x² − 1','2x² − 4x + 1','4x² − 2x + 1','(2x)² − 2 · 2x · 1 + 1².'],
 ['Вынеси общий множитель: 6x² + 9x','3x(2x + 3)','3(2x² + 3x)','6x(x + 9)','3x(2x + 9)','Проверка: 3x · 2x = 6x², 3x · 3 = 9x.'],
 ['Сократи дробь '+fr('x² − 9','x − 3'),'x + 3','x − 3','x² + 3','3','x² − 9 = (x − 3)(x + 3), множитель x − 3 сокращается.'],
 ['Верно ли, что (a + b)² = a² + b²?','Нет: пропущено удвоенное произведение 2ab','Да, всегда','Да, если a и b положительные','Верно только при a = 0 и b = 0, других случаев нет']
];
b3[9][4]='Верно только при a = b';
const gz3=[
 ()=>{const k=pick([-9,-8,-7,-6,-5,-4,-3,-2,2,3,4,5,6,7,8,9]);return N('Раскрой скобки. Чему равен коэффициент при x?','(x '+(k<0?'−':'+')+' '+Math.abs(k)+')²',2*k,'Удвоенное произведение: 2 · x · ('+sv(k)+') = '+sv(2*k)+'x.','(a ± b)² = a² ± 2ab + b².','квадрат суммы и разности')},
 ()=>{const n=ri(21,60),m=ri(1,19);return N('Вычисли, применив формулу.',n+'² − '+m+'²',n*n-m*m,'('+n+' − '+m+')('+n+' + '+m+') = '+(n-m)+' · '+(n+m)+' = '+(n*n-m*m)+'.','Разность квадратов: (a − b)(a + b).','разность квадратов')},
 ()=>{const s=ri(3,10),p=ri(1,Math.floor(s*s/2)-1||1);return N('Найди a² + b².','a + b = '+s+', ab = '+p,s*s-2*p,'(a + b)² = a² + 2ab + b², значит a² + b² = '+s+'² − 2 · '+p+' = '+(s*s-2*p)+'.','Возведи a + b в квадрат.','выражение через сумму и произведение')}];

/* 4. квадратные уравнения */
const b4=[
 ['Дискриминант уравнения ax² + bx + c = 0','b² − 4ac','b² + 4ac','b − 4ac','4ac − b²'],
 ['При D < 0 квадратное уравнение','не имеет действительных корней','имеет два корня','имеет один корень','имеет бесконечно много корней'],
 ['При D = 0 квадратное уравнение','имеет один корень '+'x = −b / 2a','имеет два разных корня','не имеет корней','имеет корень x = 0'],
 ['Корни при D > 0',fr('−b ± √D','2a'),fr('b ± √D','2a'),fr('−b ± D','2a'),fr('−b ± √D','a')],
 ['Теорема Виета для x² + px + q = 0. Сумма корней равна','−p','p','q','−q'],
 ['Теорема Виета для x² + px + q = 0. Произведение корней равно','q','−q','p','−p'],
 ['Для ax² + bx + c = 0 сумма корней равна','−b / a','b / a','c / a','−c / a','Это Виета для общего вида: x₁ + x₂ = −b / a, x₁x₂ = c / a.'],
 ['Корни уравнения x² = 25','5 и −5','только 5','25 и −25','корней нет'],
 ['Корни уравнения x² + 7x = 0','0 и −7','0 и 7','только −7','7 и −7','Вынеси x за скобки: x(x + 7) = 0.'],
 ['Уравнение x² = −4','не имеет корней','имеет корни 2 и −2','имеет корень −2','имеет корень 4','Квадрат числа не бывает отрицательным.']
];
const gz4=[
 ()=>{const a=pick([1,2,3,-1,-2]),b=ri(-8,8),c=ri(-8,8);return N('Найди дискриминант.',P(a,b,c),b*b-4*a*c,'D = b² − 4ac = ('+sv(b)+')² − 4 · ('+sv(a)+') · ('+sv(c)+') = '+(b*b-4*a*c)+'.','D = b² − 4ac. Не потеряй знаки.','дискриминант')},
 ()=>{let r1,r2;do{r1=ri(-6,6);r2=ri(-6,6)}while(!r1||!r2||r1+r2==0||r1==r2);const sum=ri(0,1)==0;return N(sum?'Найди сумму корней (по Виету).':'Найди произведение корней (по Виету).',P(1,-(r1+r2),r1*r2),sum?r1+r2:r1*r2,'Корни '+sv(r1)+' и '+sv(r2)+'. '+(sum?'Сумма равна '+sv(r1+r2)+'.':'Произведение равно '+sv(r1*r2)+'.'),'Для x² + px + q = 0: x₁ + x₂ = −p, x₁x₂ = q.','теорема Виета')},
 ()=>{let r1,r2;do{r1=ri(-9,9);r2=ri(-9,9)}while(r1==r2);return N('Найди больший корень уравнения.',P(1,-(r1+r2),r1*r2),Math.max(r1,r2),'Корни '+sv(r1)+' и '+sv(r2)+', больший '+sv(Math.max(r1,r2))+'.','Реши по дискриминанту или подбери корни по Виету.','решение уравнения')}];

/* 5. неравенства */
const b5=[
 ['Решение неравенства −2x > 6','x < −3','x > −3','x < 3','x > 3','Делим на −2, знак меняется.'],
 ['При умножении неравенства на отрицательное число знак','меняется на противоположный','не меняется','становится знаком равенства','зависит от второй части'],
 ['Решение неравенства (x − 1)(x − 5) < 0','1 < x < 5','x < 1 или x > 5','x < 5','x > 1 и x < 1'],
 ['Решение неравенства (x − 1)(x − 5) > 0','x < 1 или x > 5','1 < x < 5','x > 5','x < 1'],
 ['Решение неравенства |x| < 3','−3 < x < 3','x < −3 или x > 3','x < 3','x > −3'],
 ['Решение неравенства |x| > 3','x < −3 или x > 3','−3 < x < 3','x > 3','x < −3'],
 ['Решение неравенства x² < 9','−3 < x < 3','x < 3','x < −3 или x > 3','x > −3'],
 ['Решение неравенства x² ≥ 4','x ≤ −2 или x ≥ 2','−2 ≤ x ≤ 2','x ≥ 2','x ≤ 2'],
 ['Промежуток, соответствующий x ≥ 2','[2; +∞)','(2; +∞)','(−∞; 2]','(−∞; 2)','Нестрогий знак — квадратная скобка, бесконечность — всегда круглая.'],
 ['При строгом неравенстве (< или >) граничная точка на числовой прямой','выколота (круглая скобка)','закрашена (квадратная скобка)','не отмечается','отмечается двойным кружком']
];
const gz5=[
 ()=>{const k=pick([-6,-5,-4,-3,-2,2,3,4,5,6]),t=ri(-9,9);return N('Реши неравенство. В ответе укажи число, при котором меняется знак.',sv(k)+'x > '+sv(k*t),t,'Делим на '+sv(k)+': граница '+sv(t)+(k<0?', знак при этом меняется.':'.'),'Раздели обе части на коэффициент при x.','линейное неравенство')},
 ()=>{const n=ri(2,8);return N('Сколько целых чисел удовлетворяют неравенству?','|x| < '+n,2*n-1,'Целые от −'+(n-1)+' до '+(n-1)+': это '+(2*n-1)+' чисел.','Запиши как двойное неравенство.','модуль')},
 ()=>{let k,m;do{k=ri(2,6);m=ri(-20,40)}while(m%k==0);return N('Найди наименьшее целое решение.',k+'x > '+sv(m),Math.floor(m/k)+1,'x > '+dd(m/k)+', наименьшее целое '+sv(Math.floor(m/k)+1)+'.','Раздели на '+k+' и возьми ближайшее целое справа.','наименьшее целое решение')}];

/* ====== настройки ====== */
const KEY='lilimath-trenazher-oge-formuly-pravila-v1';
const SHEET_URL='https://script.google.com/macros/s/AKfycbyJKYatO3xdOpYJ1WZzszbxqMnOWZ30lsfr5HH7Y23svvX6iqjNNbIUR-RCUeZ8pB15/exec';
const TITLE='ОГЭ: формулы и правила наизусть';
const NEED=7;          // верных ответов подряд для прохождения уровня
const RETEACH_AFTER=3; // ошибок подряд -> показать объяснение заново
const STUCK_AFTER=3;   // сколько раз объяснение показали -> метка «нужна помощь»
const PUSH_EVERY=10;   // отправка в таблицу каждые N ответов

/* ====== состояние ====== */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv)return s}catch(e){}return{name:'',lv:{},openAll:false}}
let st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function enc(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
const HASH=location.hash.slice(1);
const TEACHER=HASH==='lilia';
if(/^u/.test(HASH)&&!st.name){try{const nm=dec(HASH.slice(1).split('.')[0]).split('|')[0].trim();if(nm){st.name=nm;save()}}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function L(i){return st.lv[i]||(st.lv[i]={ok:0,bad:0,hints:0,idk:0,tags:{},reteach:0,passed:false,stuck:false})}
const isOpen=i=>i===0||st.openAll||L(i-1).passed;
const passedCount=()=>LEVELS.filter((_,i)=>L(i).passed).length;
let V={phase:'home',i:0,page:0,streak:0,cons:0,q:null,hint:false,fb:null,err:'',sid:uid(),started:Date.now(),ok:0,bad:0,n:0,preview:false};

/* ====== отправка в таблицу ====== */
function report(){return LEVELS.map((l,i)=>{const o=L(i);
 const tg=Object.keys(o.tags).sort((a,b)=>o.tags[b]-o.tags[a]).slice(0,3).map(t=>`${t} ×${o.tags[t]}`).join('; ');
 const status=o.passed?'пройден':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—';
 return `${i+1}. ${l.t}: ${status}; верно ${o.ok}, неверно ${o.bad}, подсказок ${o.hints}, «не знаю» ${o.idk}, повторов объяснения ${o.reteach}${tg?'; ошибки: '+tg:''}`}).join('\n')}
function marks(){return LEVELS.map((_,i)=>`${i+1}${L(i).passed?'✓':L(i).stuck?'!':''}`).join(' ')}
function push(final){
 if(TEACHER||V.n===0)return;
 try{
  const done=passedCount()===LEVELS.length;
  const d={sid:V.sid,test:TITLE,name:st.name,kind:'тренажёр',started:V.started,
   status:final&&done?'завершено':'в процессе',progress:`${passedCount()}/${LEVELS.length}`,score:V.ok,max:V.ok+V.bad,grade:'',
   minutes:Math.round((Date.now()-V.started)/60000),bonus:`ступень ${V.i+1}`,tasks:marks(),report:report()};
  const bd=JSON.stringify(d);
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:bd.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:bd}).catch(()=>{});
 }catch(e){}
}
addEventListener('pagehide',()=>{if(V.n>0)push(false)});

/* ====== разбор ошибок ====== */
function tagOf(q,u){
 if(u===null)return 'не знаю';
 if(q.type==='num'){
  if(q.tag){const t=q.tag(u);if(t)return t}
  if(u<0&&q.ans>=0)return 'отрицательный ответ';
  if(q.rad!==undefined&&u===q.rad)return 'не извлёк корень';
  if(q.rad!==undefined&&Math.abs(u-q.rad/2)<1e-9)return 'разделил пополам';
  if(q.rad!==undefined&&Number.isInteger(q.ans)&&q.ans>0&&u===q.ans*q.ans)return 'возвёл в квадрат вместо корня';
  return 'другая ошибка';
 }
 return q.etag||'другая ошибка';
}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');
 if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const p=s.split('/');return parseFloat(p[0])/parseFloat(p[1])}
 if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN}

/* ====== экраны ====== */
const app=h=>{document.getElementById('app').innerHTML=h};
const $=s=>document.querySelector(s);
function hdr(){return `<div class="muted">${esc(st.name||'')}${TEACHER?' · режим учителя (в таблицу не отправляется)':''}</div>`}
function render(){
 if(TEACHER&&!V.preview)return teacherScreen();
 if(!st.name)return nameScreen();
 ({home:homeScreen,learn:learnScreen,q:qScreen,done:doneScreen,reteach:reteachScreen,stuck:stuckScreen}[V.phase]||homeScreen)();
}
function nameScreen(){
 app(`<h1>ОГЭ: формулы и правила наизусть</h1><p class="muted">Тренажёр идёт по ступеням. Дальше можно пойти только после ${NEED} верных ответов подряд.</p>
 <p>Как тебя зовут?</p><input class="nm" id="nm" placeholder="Имя Фамилия" onkeydown="if(event.key==='Enter')setName()"><br><button class="btn" onclick="setName()">Начать</button><div class="bad" id="er"></div>`);
 const e=$('#nm');if(e)e.focus()}
function setName(){const v=$('#nm').value.trim();if(v.length<3){$('#er').textContent='Введи имя и фамилию.';return}st.name=v;save();home()}
function home(){V.phase='home';render()}
function homeScreen(){
 let h=hdr()+`<h1>ОГЭ: формулы и правила наизусть</h1><p class="muted">Пройдено ступеней: ${passedCount()} из ${LEVELS.length}. Чтобы пройти ступень, нужно ${NEED} верных ответов подряд.</p>`;
 LEVELS.forEach((l,i)=>{const o=L(i),op=isOpen(i);
  const s=o.passed?'пройдена':!op?'закрыта':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'открыта';
  h+=`<button class="row ${o.passed?'passed':''}" ${op?'':'disabled'} onclick="openLevel(${i})"><span>${i+1}. ${l.t}</span><span class="st">${s}</span></button>`});
 if(TEACHER)h+=`<button class="btn sec" onclick="V.preview=false;render()">Вернуться в кабинет учителя</button>`;
 app(h)}
function openLevel(i){if(!isOpen(i))return;V.i=i;V.page=0;V.streak=0;V.cons=0;V.fb=null;V.phase='learn';render()}
function learnScreen(){const l=LEVELS[V.i];
 let h=hdr()+`<h1>${V.i+1}. ${l.t}</h1><p class="muted">Прочитай по шагам. Потом ${NEED} заданий подряд без ошибок.</p>`;
 for(let k=0;k<=V.page;k++)h+=`<div class="card th">${l.pages[k]}</div>`;
 h+=V.page<l.pages.length-1?`<button class="btn" onclick="nextPage()">Дальше</button>`:`<button class="btn" onclick="startQ()">Начать задания</button>`;
 h+=`<button class="btn sec" onclick="home()">К списку</button>`;
 app(h);window.scrollTo(0,document.body.scrollHeight)}
function nextPage(){V.page++;render()}
function startQ(){V.streak=0;V.cons=0;nextQ()}
function nextQ(){V.q=LEVELS[V.i].g();V.hint=false;V.fb=null;V.err='';V.phase='q';render()}
function qScreen(){const q=V.q,l=LEVELS[V.i];
 let dots='';for(let k=0;k<NEED;k++)dots+=`<span class="dot ${k<V.streak?'on':''}"></span>`;
 let h=hdr()+`<h2>${V.i+1}. ${l.t}</h2><div class="dots">${dots} <span class="muted">${V.streak} из ${NEED}</span></div>
 <div class="muted">${q.prompt}</div><div class="big">${q.q}</div>${q.pic||''}`;
 if(V.hint&&q.hint)h+=`<div class="hint"><b>Подсказка.</b> ${q.hint}</div>`;
 if(V.fb){
  h+=V.fb.ok?`<div class="card"><span class="ok">Верно.</span></div>`:`<div class="card"><span class="bad">${V.fb.idk?'Хорошо, что ответ честный.':'Неверно.'}</span> ${q.why}<div class="muted" style="margin-top:6px">Серия обнулена. Следующее задание будет новым.</div></div>`;
  h+=`<button class="btn" id="nx" onclick="afterFb()">Дальше</button>`;
 }else{
  if(q.type==='num')h+=`<input class="ans" id="ans" autocomplete="off" inputmode="text" onkeydown="if(event.key==='Enter')submitNum()"><br><button class="btn" onclick="submitNum()">Проверить</button><div class="bad" style="margin-top:8px">${V.err}</div>`;
  else h+=q.options.map((o,i)=>`<button class="opt" onclick="pickOpt(${i})">${o}</button>`).join('');
  h+=`<div>`+(q.hint&&!V.hint?`<button class="btn sec" onclick="useHint()">Подсказка</button>`:'')+`<button class="btn sec" onclick="idk()">Не знаю</button><button class="btn sec" onclick="exitLevel()">К списку</button></div>`;
 }
 app(h);const a=$('#ans');if(a)a.focus();const n=$('#nx');if(n)n.focus()}
function useHint(){if(!V.hint){V.hint=true;L(V.i).hints++;save()}render()}
function exitLevel(){push(false);home()}
function answered(ok,u){
 const o=L(V.i);V.n++;
 if(ok){o.ok++;V.ok++;V.streak++;V.cons=0;
  if(V.streak>=NEED){o.passed=true;save();push(true);V.phase='done';render();return}
  V.fb={ok:true}}
 else{o.bad++;V.bad++;V.streak=0;V.cons++;const t=tagOf(V.q,u);o.tags[t]=(o.tags[t]||0)+1;V.fb={ok:false,idk:u===null};if(u===null)o.idk++}
 save();if(V.n%PUSH_EVERY===0)push(false);render()}
function submitNum(){const u=parseNum($('#ans').value);
 if(isNaN(u)){V.err='Введи число (например 7, 0,5 или 3/4).';render();return}
 answered(Math.abs(u-V.q.ans)<1e-9,u)}
function pickOpt(i){answered(V.q.options[i]===V.q.correct,V.q.options[i])}
function idk(){answered(false,null)}
function afterFb(){
 if(!V.fb.ok&&V.cons>=RETEACH_AFTER){const o=L(V.i);o.reteach++;V.cons=0;
  if(o.reteach>=STUCK_AFTER){o.stuck=true;save();push(false);V.phase='stuck';render();return}
  save();V.phase='reteach';render();return}
 nextQ()}
function reteachScreen(){app(hdr()+`<h2>Давай ещё раз посмотрим объяснение</h2><div class="card"><p>Несколько ответов подряд не получились. Это нормально: значит, объяснение надо прочитать ещё раз, не торопясь.</p></div><button class="btn" onclick="V.page=0;V.phase='learn';render()">Смотреть объяснение</button>`)}
function stuckScreen(){app(hdr()+`<h2>Стоп</h2><div class="card"><p>Здесь стало трудно, и это не страшно. Эту ступень лучше разобрать вместе с учителем. Результат уже отправлен Лилии.</p><p>Скажи, на каком месте перестало быть понятно.</p></div><button class="btn" onclick="home()">К списку</button><button class="btn sec" onclick="V.page=0;V.cons=0;V.phase='learn';render()">Ещё раз объяснение</button>`)}
function doneScreen(){const last=V.i===LEVELS.length-1;
 app(hdr()+`<h2>Ступень пройдена</h2><div class="card"><p><b>${V.i+1}. ${LEVELS[V.i].t}</b>: ${NEED} верных ответов подряд. Молодец! Всё отлично получается!</p><p class="muted">Результат отправлен Лилии.</p></div>`+
 (last?`<p>Это была последняя ступень. Тренажёр пройден.</p><button class="btn" onclick="home()">К списку</button>`:`<button class="btn" onclick="openLevel(${V.i+1})">Следующая ступень</button><button class="btn sec" onclick="home()">К списку</button>`))}

/* ====== режим учителя ====== */
function teacherScreen(){
 const base=location.href.split('#')[0];
 let h=`<h1>Кабинет учителя</h1><p class="muted">Данные этого устройства. С этого экрана в таблицу ничего не отправляется.</p>
 <h2>Ссылка для ученика</h2><input class="nm" id="tn" placeholder="Имя Фамилия"><p class="link" id="tl"></p>
 <h2>Прогресс на этом устройстве</h2><table class="rep"><tr><th>№</th><th>Ступень</th><th>Статус</th><th>Верно</th><th>Неверно</th><th>Подск.</th><th>Не знаю</th><th></th></tr>`;
 LEVELS.forEach((l,i)=>{const o=L(i);
  h+=`<tr><td>${i+1}</td><td>${l.t}</td><td>${o.passed?'пройдена':o.stuck?'нужна помощь':(o.ok+o.bad)?'идёт':'—'}</td><td>${o.ok}</td><td>${o.bad}</td><td>${o.hints}</td><td>${o.idk}</td><td><button class="btn sm sec" onclick="tPass(${i})">засчитать</button><button class="btn sm sec" onclick="tReset(${i})">сбросить</button></td></tr>`});
 h+=`</table><button class="btn sec" onclick="tOpenAll()">${st.openAll?'Закрыть ступени по порядку':'Открыть все ступени'}</button>
 <button class="btn" onclick="V.preview=true;home()">Пройти как ученик</button>
 <button class="btn sec" onclick="tWipe()">Стереть всё на этом устройстве</button>`;
 app(h);
 $('#tn').oninput=e=>{const v=e.target.value.trim();$('#tl').textContent=v?base+'#u'+enc(v):''}}
function tPass(i){L(i).passed=true;save();render()}
function tReset(i){st.lv[i]=undefined;delete st.lv[i];save();render()}
function tOpenAll(){st.openAll=!st.openAll;save();render()}
function tWipe(){if(confirm('Стереть весь прогресс на этом устройстве?')){localStorage.removeItem(KEY);st=load();render()}}

render();
//ENGINE-END
</script>
</body>
</html>
