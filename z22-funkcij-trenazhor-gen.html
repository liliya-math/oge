  function finish11(type, items, ask, hint) {
    var order = shuffle([0, 1, 2]);       // порядок графиков А, Б, В
    var numOrder = shuffle([0, 1, 2]);     // порядок формул 1, 2, 3
    var figs = order.map(function (idx, pos) {
      var f = items[idx].f;
      return fig11(Array.isArray(f) ? f : [{ f: f, a: -5, b: 5, n: 300 }], { title: 'График ' + PR[pos] });
    });
    var conds = numOrder.map(function (idx) { return items[idx].text; });
    var answer = order.map(function (idx) { return numOrder.indexOf(idx) + 1; }).join('');
    var expl = order.map(function (idx, pos) { return PR[pos] + ' — ' + (numOrder.indexOf(idx) + 1) + ') ' + items[idx].text; }).join('; ');
    return { type: type, digits: true, figs: figs, conds: conds, answer: answer, ask: ask, hint: hint, tail: expl + '. Ответ: ' + answer + '.' };
  }

  var GEN = { make: make, TYPES: TYPES, formulaHTML: formulaHTML, setRng: setRng };
  if (typeof module !== 'undefined' && module.exports) module.exports = GEN; else root.GEN = GEN;
})(typeof window !== 'undefined' ? window : this);

var keys=Object.keys(GEN.TYPES),cur='all',task=null,solved=0,total=0,done=false,tries=0,chips,box;
function norm(s){return String(s).replace(',','.').replace('−','-').replace(/\s/g,'')}
function drawChips(){chips.innerHTML='';[['all','Все типы']].concat(keys.map(function(k){return[k,GEN.TYPES[k].name]})).forEach(function(p){var b=document.createElement('button');b.textContent=p[1];if(p[0]===cur)b.className='on';b.onclick=function(){cur=p[0];drawChips();next()};chips.appendChild(b)})}
function next(){
  var k=cur==='all'?keys[Math.floor(Math.random()*keys.length)]:cur;
  task=GEN.make(k);task.name=GEN.TYPES[k].name;done=false;tries=0;
  var body;
  if(task.digits){
    body='<div class="cond">'+task.ask+'</div><div class="figs3">'+task.figs.map(function(f,i){return '<div>'+['А','Б','В'][i]+f+'</div>'}).join('')+'</div><p>'+task.conds.map(function(c,i){return (i+1)+') '+c}).join('<br>')+'</p><p class="stat">Запишите три цифры подряд для А, Б, В (без пробелов).</p><p><input class="num" id="n1" inputmode="numeric" maxlength="3" style="width:110px" placeholder="___"></p>';
  }else{
    body='<div class="cond">Постройте график функции '+GEN.formulaHTML(task.T)+'. '+task.ask+'</div><p class="stat">Ответ запишите числом (отрицательное с минусом).</p><p><input class="num" id="n1" inputmode="decimal" style="width:130px" placeholder="Ответ"></p>';
  }
  box.innerHTML='<span class="tag">'+task.name+'</span>'+body+'<button class="btn" id="go">Проверить</button><button class="btn ghost" id="hb">Подсказка</button>'+(task.digits?'':'<button class="btn ghost" id="gb">График</button>')+'<button class="btn ghost" id="sb">Показать решение</button><button class="btn ghost" id="nb">Другая задача</button><div id="fb"></div>';
  document.getElementById('n1').focus();
  document.getElementById('go').onclick=check;
  document.getElementById('n1').onkeydown=function(e){if(e.key==='Enter')check()};
  document.getElementById('hb').onclick=function(){document.getElementById('fb').innerHTML='<div class="hint">Подсказка: '+task.hint+'</div>'};
  if(!task.digits)document.getElementById('gb').onclick=function(){document.getElementById('fb').innerHTML='<div class="figwrap">'+CORE.drawTask(task.T,{theme:'dark',w:340,noMarks:true,noLabels:true,uid:'g'+Math.floor(Math.random()*1e6)})+'</div><p class="stat">Это график без ответа. Прямую проведите сами.</p>'};
  document.getElementById('sb').onclick=function(){document.getElementById('fb').innerHTML='<div class="sol">'+(task.digits?'':'<div class="figwrap">'+CORE.drawTask(task.T,{theme:'dark',w:340,uid:'s'+Math.floor(Math.random()*1e6)})+'</div>')+'<p>'+task.tail+'</p><p>Ответ в задаче: '+String(task.answer).replace('-','−')+'.</p></div>'};
  document.getElementById('nb').onclick=next;upd();
}
function check(){
  if(done)return;var inp=document.getElementById('n1'),v=norm(inp.value),fb=document.getElementById('fb'),ok;
  if(v===''){fb.innerHTML='<div class="bad">Введите ответ.</div>';return}
  if(task.digits){ok=(v===task.answer)}else{var x=parseFloat(v);if(isNaN(x)){fb.innerHTML='<div class="bad">Введите число.</div>';return}ok=Math.abs(x-task.answer)<1e-9}
  tries++;
  if(ok){done=true;total++;if(tries===1)solved++;fb.innerHTML='<div class="ok">Верно.'+(tries>1?' С '+tries+'-й попытки.':'')+'</div><button class="btn" onclick="next()">Следующая</button>';inp.disabled=true;upd()}
  else fb.innerHTML='<div class="bad">Неверно. Нажмите «Подсказка» или «График»'+(task.digits?'':', проверьте выколотые точки и концы промежутков')+'.</div>';
}
function upd(){document.getElementById('st').textContent='С первой попытки верно: '+solved+' из '+total+'.'}
chips=document.getElementById('chips');box=document.getElementById('box');drawChips();next();
</script></body></html>
