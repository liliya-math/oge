/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {

  <script>
window.TrainerData={"id":"nod-nok-6-control","version":1,"title":"НОД и НОК · 6 класс · lili.math","heading":"НОД и НОК","subtitle":"Повтори правила, реши задачи и проверь себя перед контрольной.","description":"Теория, практика и пробная контрольная по НОД и НОК для 6 класса.","grade":"6 класс","stages":[{"name":"Делители и кратные","subtitle":"Проверь, что на что делится","title":"Как отличить делитель от кратного?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Делители и кратные\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Делитель натурального числа\u003c/strong> — натуральное число, на которое данное число делится без остатка.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Проверь остаток\u003c/h4>\u003cp>Если остаток равен нулю, число подходит.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>18 : 6 = 3 → 6 делит 18\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Выписывай парами\u003c/h4>\u003cp>Каждая пара множителей даёт два делителя. Если множители равны, запиши число один раз.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>16 = 1 · 16 = 2 · 8 = 4 · 4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Единица и само число\u003c/h4>\u003cp>Они входят в список делителей любого натурального числа. У числа 1 всего один делитель.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>Делители 9: 1, 3, 9\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как получить кратные\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Кратное натурального числа\u003c/strong> — натуральное число, которое делится на данное число без остатка.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Умножай на 1, 2, 3 и дальше\u003c/h4>\u003cp>Кратных бесконечно много. В этой теме рассматриваем положительные кратные.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>Кратные 5: 5, 10, 15, 20, …\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Прочитай одну запись двумя способами\u003c/h4>\u003cp>Если число делится на другое, каждое из них играет свою роль.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>24 : 8 = 3 → 8 делитель 24, 24 кратно 8\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Проверь, что на что делится","anchorNote":"Для делителей выписывай пары множителей. Для кратных умножай на 1, 2, 3, …","tasks":[{"kind":"choice","q":"Является ли 3 делителем числа 8?","answer":"Нет","before":"3 является делителем 15, потому что 15 : 3 = 5 без остатка.","see":"Нужно поделить 8 на 3.","similar":"3 является делителем 15, потому что 15 : 3 = 5 без остатка.","algorithm":"Посмотри, остаётся ли остаток.","steps":["8 = 3 · 2 + 2.","Остаток равен 2, поэтому 3 не является делителем 8.","Ответ: Нет."],"visual":"","unit":"","retry":"Посмотри, остаётся ли остаток.","options":["Да","Нет"]},{"kind":"choice","q":"Является ли 4 делителем числа 12?","answer":"Да","before":"5 является делителем 10, потому что 10 : 5 = 2 без остатка.","see":"Нужно поделить 12 на 4.","similar":"5 является делителем 10, потому что 10 : 5 = 2 без остатка.","algorithm":"Проверь деление обратным умножением.","steps":["4 · 3 = 12.","12 делится на 4 без остатка.","Ответ: Да."],"visual":"","unit":"","retry":"Проверь деление обратным умножением.","options":["Да","Нет"]},{"kind":"number","q":"Сколько натуральных делителей у 36?","answer":9,"before":"Для 16 пары такие: 1 и 16, 2 и 8, 4 и 4. Записываем 4 один раз. Всего 5 делителей.","see":"36 = 6 · 6. Делитель 6 считаем один раз.","similar":"Для 16 пары такие: 1 и 16, 2 и 8, 4 и 4. Записываем 4 один раз. Всего 5 делителей.","algorithm":"Выпиши пары множителей от 1 · 36 до 6 · 6.","steps":["Пары множителей: 1 · 36, 2 · 18, 3 · 12, 4 · 9, 6 · 6.","Делители: 1, 2, 3, 4, 6, 9, 12, 18, 36. Всего 9.","Ответ: 9."],"visual":"","unit":"","retry":"Выпиши пары множителей от 1 · 36 до 6 · 6."},{"kind":"choice","q":"Какое число является кратным 9?","answer":45,"before":"24 кратно 6, потому что 6 · 4 = 24.","see":"Кратное 9 делится на 9 без остатка.","similar":"24 кратно 6, потому что 6 · 4 = 24.","algorithm":"Проверь каждое число по таблице умножения на 9.","steps":["9 · 5 = 45.","Остальные числа из списка на 9 не делятся.","Ответ: 45."],"visual":"","unit":"","retry":"Проверь каждое число по таблице умножения на 9.","options":[35,42,45,52]},{"kind":"number","q":"Запиши четвёртое положительное кратное 7.","answer":28,"before":"Первые четыре положительных кратных 3: 3, 6, 9, 12. Четвёртое равно 3 · 4.","see":"Первое положительное кратное 7 равно 7.","similar":"Первые четыре положительных кратных 3: 3, 6, 9, 12. Четвёртое равно 3 · 4.","algorithm":"Умножь 7 на номер кратного.","steps":["Кратные по порядку: 7, 14, 21, 28.","7 · 4 = 28.","Ответ: 28."],"visual":"","unit":"","retry":"Умножь 7 на номер кратного."}]},{"name":"НОД по спискам","subtitle":"Делители → совпадения → максимум","title":"Как найти наибольший общий делитель?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Сравни списки делителей\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Общий делитель\u003c/strong> — натуральное число, на которое каждое из данных чисел делится без остатка.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Найди делители каждого числа\u003c/h4>\u003cp>Проверь, какие пары множителей дают каждое число.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>8: 1, 2, 4, 8. 12: 1, 2, 3, 4, 6, 12.\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Оставь совпадения\u003c/h4>\u003cp>Проверь, что каждый выбранный делитель есть в обоих списках.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>Общие делители 8 и 12: 1, 2, 4.\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Выбери самый большой\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>НОД\u003c/strong> — наибольший общий делитель данных натуральных чисел.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Сравни общие делители\u003c/h4>\u003cp>Из 1, 2 и 4 самое большое число равно 4.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОД(8; 12) = 4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверь ответ\u003c/h4>\u003cp>Оба исходных числа должны делиться на найденное число.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>8 : 4 = 2 и 12 : 4 = 3\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Делители → совпадения → максимум","anchorNote":"НОД не превышает меньшее из данных чисел.","tasks":[{"kind":"number","q":"Сколько общих делителей у 6 и 8?","answer":2,"before":"У 9 и 12 общие делители 1 и 3. В обоих списках встретились два числа.","see":"Нужны только числа, которые делят и 6, и 8.","similar":"У 9 и 12 общие делители 1 и 3. В обоих списках встретились два числа.","algorithm":"Составь два списка, выдели совпадения и посчитай их.","steps":["Делители 6: 1, 2, 3, 6. Делители 8: 1, 2, 4, 8.","Общие делители: 1, 2. Их два.","Ответ: 2."],"visual":"","unit":"","retry":"Составь два списка, выдели совпадения и посчитай их."},{"kind":"number","q":"Найди НОД(10; 14) перечислением.","answer":2,"before":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","see":"Мы ищем число, на которое делятся оба данных числа.","similar":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","algorithm":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое.","steps":["Делители 10: 1, 2, 5, 10. Делители 14: 1, 2, 7, 14.","Общие делители: 1, 2. Берём наибольший: 2.","Ответ: 2."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>10 и 14\u003c/b>\u003c/div>","unit":"","retry":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое."},{"kind":"number","q":"Найди НОД(12; 18) перечислением.","answer":6,"before":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","see":"Мы ищем число, на которое делятся оба данных числа.","similar":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","algorithm":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое.","steps":["Делители 12: 1, 2, 3, 4, 6, 12. Делители 18: 1, 2, 3, 6, 9, 18.","Общие делители: 1, 2, 3, 6. Берём наибольший: 6.","Ответ: 6."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>12 и 18\u003c/b>\u003c/div>","unit":"","retry":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое."},{"kind":"number","q":"Найди НОД(16; 24) перечислением.","answer":8,"before":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","see":"Мы ищем число, на которое делятся оба данных числа.","similar":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","algorithm":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое.","steps":["Делители 16: 1, 2, 4, 8, 16. Делители 24: 1, 2, 3, 4, 6, 8, 12, 24.","Общие делители: 1, 2, 4, 8. Берём наибольший: 8.","Ответ: 8."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>16 и 24\u003c/b>\u003c/div>","unit":"","retry":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое."},{"kind":"number","q":"Найди НОД(18; 30) перечислением.","answer":6,"before":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","see":"Мы ищем число, на которое делятся оба данных числа.","similar":"Делители 10: 1, 2, 5, 10. Делители 15: 1, 3, 5, 15. Общие: 1 и 5. Самый большой из них равен 5, поэтому НОД(10; 15) = 5.","algorithm":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое.","steps":["Делители 18: 1, 2, 3, 6, 9, 18. Делители 30: 1, 2, 3, 5, 6, 10, 15, 30.","Общие делители: 1, 2, 3, 6. Берём наибольший: 6.","Ответ: 6."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>18 и 30\u003c/b>\u003c/div>","unit":"","retry":"Выпиши делители обоих чисел, найди совпадения и выбери самое большое."}]},{"name":"НОК по спискам","subtitle":"Кратные → совпадения → минимум","title":"Как найти наименьшее общее кратное?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Сравни списки кратных\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Общее кратное\u003c/strong> — натуральное число, которое делится на каждое из данных чисел без остатка.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Выпиши кратные по возрастанию\u003c/h4>\u003cp>Умножай каждое исходное число на 1, 2, 3 и дальше.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>6: 6, 12, 18, 24, … 8: 8, 16, 24, …\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Сравни списки\u003c/h4>\u003cp>Если число есть в обоих списках, оно делится на оба исходных числа.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>24 : 6 = 4 и 24 : 8 = 3\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Остановись на первом совпадении\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>НОК\u003c/strong> — наименьшее положительное общее кратное данных натуральных чисел.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Ищи первое положительное совпадение\u003c/h4>\u003cp>До 24 ни одно число не встретилось в обоих списках.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(6; 8) = 24\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверь направление деления\u003c/h4>\u003cp>Теперь найденное число делим на каждое из исходных.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>18 : 6 = 3, но 18 на 8 без остатка не делится.\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Кратные → совпадения → минимум","anchorNote":"НОК не меньше большего из данных чисел.","tasks":[{"kind":"choice","q":"Какое из чисел является общим кратным 6 и 9?","answer":36,"before":"30 делится и на 5, и на 6, значит это их общее кратное.","see":"Нужно, чтобы число делилось сразу на 6 и на 9.","similar":"30 делится и на 5, и на 6, значит это их общее кратное.","algorithm":"Проверь два деления для каждого варианта.","steps":["36 : 6 = 6 и 36 : 9 = 4.","18 тоже было бы общим кратным, но среди вариантов его нет.","Ответ: 36."],"visual":"","unit":"","retry":"Проверь два деления для каждого варианта.","options":[12,27,36,42]},{"kind":"number","q":"Найди НОК(6; 10) перечислением.","answer":30,"before":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","see":"Мы ищем число, которое делится на оба данных числа.","similar":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","algorithm":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения.","steps":["Кратные 6 до 30: 6, 12, 18, 24, 30.","Кратные 10 до 30: 10, 20, 30. Первое совпадение: 30.","Ответ: 30."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>6 и 10\u003c/b>\u003c/div>","unit":"","retry":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения."},{"kind":"number","q":"Найди НОК(8; 12) перечислением.","answer":24,"before":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","see":"Мы ищем число, которое делится на оба данных числа.","similar":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","algorithm":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения.","steps":["Кратные 8 до 24: 8, 16, 24.","Кратные 12 до 24: 12, 24. Первое совпадение: 24.","Ответ: 24."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>8 и 12\u003c/b>\u003c/div>","unit":"","retry":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения."},{"kind":"number","q":"Найди НОК(9; 12) перечислением.","answer":36,"before":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","see":"Мы ищем число, которое делится на оба данных числа.","similar":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","algorithm":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения.","steps":["Кратные 9 до 36: 9, 18, 27, 36.","Кратные 12 до 36: 12, 24, 36. Первое совпадение: 36.","Ответ: 36."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>9 и 12\u003c/b>\u003c/div>","unit":"","retry":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения."},{"kind":"number","q":"Найди НОК(10; 15) перечислением.","answer":30,"before":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","see":"Мы ищем число, которое делится на оба данных числа.","similar":"Кратные 4: 4, 8, 12, … Кратные 6: 6, 12, … Первое положительное совпадение равно 12, значит НОК(4; 6) = 12.","algorithm":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения.","steps":["Кратные 10 до 30: 10, 20, 30.","Кратные 15 до 30: 15, 30. Первое совпадение: 30.","Ответ: 30."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Найди совпадения\u003c/span>\u003cb>10 и 15\u003c/b>\u003c/div>","unit":"","retry":"Начни с самих чисел. Продолжай списки положительных кратных до первого совпадения."}]},{"name":"Разложение и НОД","subtitle":"Для НОД бери общее в меньших степенях","title":"Как найти НОД больших чисел?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Что значит простое число\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Простое число\u003c/strong> — натуральное число больше 1, у которого ровно два натуральных делителя: 1 и оно само.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Проверь делители\u003c/h4>\u003cp>У 7 ровно два делителя. У 9 делителей три, поэтому 9 составное. Число 1 не является ни простым, ни составным.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>7: 1 и 7. 9: 1, 3, 9.\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как разложить число\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Разложение на простые множители\u003c/strong> — запись составного числа в виде произведения простых чисел.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Дели по очереди\u003c/h4>\u003cp>Начни с 2. Если число нечётное, проверь 3, затем 5 и следующие простые числа. Продолжай до частного 1. Число делится на 2, если последняя цифра чётная, на 3, если сумма цифр делится на 3, на 5, если последняя цифра 0 или 5.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>60 → 30 → 15 → 5 → 1. Делители по шагам: 2, 2, 3, 5.\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Запиши повторения степенью\u003c/h4>\u003cp>Показатель говорит, сколько раз простой множитель входит в произведение.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>60 = 2 · 2 · 3 · 5 = 2² · 3 · 5\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как выбрать множители для НОД\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Бери только общее\u003c/h4>\u003cp>Для общего делителя у обоих чисел должно хватить выбранных множителей.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>72 = 2³ · 3² и 48 = 2⁴ · 3\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Выбирай меньшую степень\u003c/h4>\u003cp>Из двоек можно взять три, из троек только одну.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОД(72; 48) = 2³ · 3 = 24\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Для НОД бери общее в меньших степенях","anchorNote":"Если простые множители вовсе не совпали, НОД равен 1.","tasks":[{"kind":"choice","q":"Какое число является простым?","answer":17,"before":"У 13 всего два делителя: 1 и 13. У 15 есть ещё делитель 3, поэтому 15 составное.","see":"У простого числа должны быть ровно два натуральных делителя.","similar":"У 13 всего два делителя: 1 и 13. У 15 есть ещё делитель 3, поэтому 15 составное.","algorithm":"Ищи делители между 1 и самим числом.","steps":["У 1 всего один делитель. 9 делится на 3, а 21 делится на 3 и 7.","У 17 делители только 1 и 17.","Ответ: 17."],"visual":"","unit":"","retry":"Ищи делители между 1 и самим числом.","options":[1,9,17,21]},{"kind":"choice","q":"Выбери разложение 84 на простые множители.","answer":"2² · 3 · 7","before":"45 : 3 = 15, 15 : 3 = 5, 5 : 5 = 1. Значит, 45 = 3² · 5.","see":"Последовательно делим до частного 1.","similar":"45 : 3 = 15, 15 : 3 = 5, 5 : 5 = 1. Значит, 45 = 3² · 5.","algorithm":"Начни с 2. Делить на 2 можно дважды.","steps":["84 : 2 = 42, 42 : 2 = 21.","21 : 3 = 7, 7 : 7 = 1.","Ответ: 2² · 3 · 7."],"visual":"","unit":"","retry":"Начни с 2. Делить на 2 можно дважды.","options":["2 · 3 · 7","2² · 3 · 7","4 · 3 · 7","2² · 3² · 7"]},{"kind":"number","q":"Найди НОД(20; 30) через простые множители.","answer":10,"before":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","see":"У НОД остаются только простые множители, присутствующие во всех разложениях.","similar":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","algorithm":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх.","steps":["20 = 2² · 5, 30 = 2 · 3 · 5.","Общие простые множители в наименьших степенях: 2 · 5.","НОД(20; 30) = 2 · 5 = 10.","Ответ: 10."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх."},{"kind":"number","q":"Найди НОД(28; 42) через простые множители.","answer":14,"before":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","see":"У НОД остаются только простые множители, присутствующие во всех разложениях.","similar":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","algorithm":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх.","steps":["28 = 2² · 7, 42 = 2 · 3 · 7.","Общие простые множители в наименьших степенях: 2 · 7.","НОД(28; 42) = 2 · 7 = 14.","Ответ: 14."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх."},{"kind":"number","q":"Найди НОД(36; 60) через простые множители.","answer":12,"before":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","see":"У НОД остаются только простые множители, присутствующие во всех разложениях.","similar":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","algorithm":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх.","steps":["36 = 2² · 3², 60 = 2² · 3 · 5.","Общие простые множители в наименьших степенях: 2² · 3.","НОД(36; 60) = 2² · 3 = 12.","Ответ: 12."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх."},{"kind":"number","q":"Найди НОД(72; 108) через простые множители.","answer":36,"before":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","see":"У НОД остаются только простые множители, присутствующие во всех разложениях.","similar":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","algorithm":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх.","steps":["72 = 2³ · 3², 108 = 2² · 3³.","Общие простые множители в наименьших степенях: 2² · 3².","НОД(72; 108) = 2² · 3² = 36.","Ответ: 36."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх."},{"kind":"number","q":"Найди НОД(24; 40; 60) через простые множители.","answer":4,"before":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","see":"У НОД остаются только простые множители, присутствующие во всех разложениях.","similar":"24 = 2³ · 3, 36 = 2² · 3². Двойка есть в обоих разложениях минимум дважды, тройка минимум один раз. НОД(24; 36) = 2² · 3 = 12.","algorithm":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх.","steps":["24 = 2³ · 3, 40 = 2³ · 5, 60 = 2² · 3 · 5.","Общие простые множители в наименьших степенях: 2².","НОД(24; 40; 60) = 2² = 4.","Ответ: 4."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"У каждого общего простого множителя возьми меньшую степень. Если чисел три, возьми наименьшую степень из трёх."}]},{"name":"НОК из множителей","subtitle":"Для НОК бери все множители в больших степенях","title":"Как увидеть, какие множители нужны для НОК?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Что взять для НОК\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Выпиши все простые множители\u003c/h4>\u003cp>В результате должны остаться даже те простые числа, которые есть только в одном разложении.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>18 = 2 · 3² и 40 = 2³ · 5 → нужны 2, 3 и 5\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Выбери большую степень\u003c/h4>\u003cp>Результат должен содержать столько экземпляров каждого множителя, сколько нужно любому из исходных чисел.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(18; 40) = 2³ · 3² · 5 = 360\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверь делимость\u003c/h4>\u003cp>Раздели результат на каждое число. Так проверишь, что найдено общее кратное. Минимальность даёт выбор ровно необходимых степеней.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>360 : 18 = 20 и 360 : 40 = 9\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как работать с тремя числами\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Смотри на все три разложения\u003c/h4>\u003cp>Для НОК бери самую большую степень каждого простого множителя. Для НОД бери самую маленькую из трёх, считая отсутствующий множитель степенью 0.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>12 = 2² · 3, 18 = 2 · 3², 20 = 2² · 5\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Запиши результат\u003c/h4>\u003cp>У двойки для НОК берём степень 2, у тройки 2, у пятёрки 1. Для НОД общий множитель только 2.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(12; 18; 20) = 180, НОД(12; 18; 20) = 2\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Для НОК бери все множители в больших степенях","anchorNote":"Если простой множитель встретился только у одного числа, он всё равно нужен.","tasks":[{"kind":"number","q":"Найди НОК(12; 18) через простые множители.","answer":36,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["12 = 2² · 3, 18 = 2 · 3².","Все встретившиеся простые множители в наибольших степенях: 2² · 3².","НОК(12; 18) = 2² · 3² = 36.","Ответ: 36."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."},{"kind":"number","q":"Найди НОК(20; 30) через простые множители.","answer":60,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["20 = 2² · 5, 30 = 2 · 3 · 5.","Все встретившиеся простые множители в наибольших степенях: 2² · 3 · 5.","НОК(20; 30) = 2² · 3 · 5 = 60.","Ответ: 60."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."},{"kind":"number","q":"Найди НОК(16; 24) через простые множители.","answer":48,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["16 = 2⁴, 24 = 2³ · 3.","Все встретившиеся простые множители в наибольших степенях: 2⁴ · 3.","НОК(16; 24) = 2⁴ · 3 = 48.","Ответ: 48."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."},{"kind":"number","q":"Найди НОК(36; 60) через простые множители.","answer":180,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["36 = 2² · 3², 60 = 2² · 3 · 5.","Все встретившиеся простые множители в наибольших степенях: 2² · 3² · 5.","НОК(36; 60) = 2² · 3² · 5 = 180.","Ответ: 180."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."},{"kind":"number","q":"Найди НОК(12; 18; 30) через простые множители.","answer":180,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["12 = 2² · 3, 18 = 2 · 3², 30 = 2 · 3 · 5.","Все встретившиеся простые множители в наибольших степенях: 2² · 3² · 5.","НОК(12; 18; 30) = 2² · 3² · 5 = 180.","Ответ: 180."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."},{"kind":"number","q":"Найди НОК(8; 12; 18) через простые множители.","answer":72,"before":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","see":"У НОК нужны все простые множители, которые встретились хотя бы в одном разложении.","similar":"24 = 2³ · 3, 36 = 2² · 3². Берём 2³ и 3², чтобы результата хватило на оба разложения. НОК(24; 36) = 2³ · 3² = 72.","algorithm":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь.","steps":["8 = 2³, 12 = 2² · 3, 18 = 2 · 3².","Все встретившиеся простые множители в наибольших степенях: 2³ · 3².","НОК(8; 12; 18) = 2³ · 3² = 72.","Ответ: 72."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Первый шаг\u003c/span>\u003cb>Разложи каждое число на простые множители.\u003c/b>\u003c/div>","unit":"","retry":"Для каждого простого множителя выбери наибольшую степень среди всех разложений и перемножь."}]},{"name":"Короткие способы","subtitle":"Начни с проверки делимости","title":"Когда можно считать быстрее?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Если одно число делится на другое\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>НОД равен меньшему\u003c/h4>\u003cp>Меньшее число делит и себя, и большее. Общий делитель больше меньшего числа невозможен.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОД(6; 24) = 6\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>НОК равен большему\u003c/h4>\u003cp>Большее число делится и на себя, и на меньшее. Общее кратное меньше большего числа невозможно.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(6; 24) = 24\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если числа равны\u003c/h4>\u003cp>Для двух одинаковых чисел оба результата равны этому числу.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОД(11; 11) = НОК(11; 11) = 11\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Если общий делитель только один\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Взаимно простые числа\u003c/strong> — числа, наибольший общий делитель которых равен 1.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Сами числа могут быть составными\u003c/h4>\u003cp>У 8 и 15 нет общих простых множителей. Их единственный общий делитель равен 1.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>8 = 2³, 15 = 3 · 5 → НОД(8; 15) = 1\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Перемножь для НОК\u003c/h4>\u003cp>Если множители нигде не повторяются между разложениями, в НОК понадобятся все множители обоих чисел.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(8; 15) = 8 · 15 = 120\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как связаны НОД и НОК двух чисел\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Сравни произведения\u003c/h4>\u003cp>Для двух натуральных чисел произведение НОД и НОК равно произведению самих чисел. Меньшая и большая степени каждого простого множителя вместе дают столько же множителей, сколько было в исходной паре.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОД(14; 21) · НОК(14; 21) = 7 · 42 = 14 · 21\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Найди неизвестное\u003c/h4>\u003cp>Если известен НОД, раздели произведение исходных чисел на НОД. Если известен НОК, раздели на НОК.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>НОК(14; 21) = (14 · 21) : 7 = 42\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Начни с проверки делимости","anchorNote":"НОД и НОК дают разные ответы для большинства пар.","tasks":[{"kind":"number","q":"Найди НОД(5; 20) коротким способом.","answer":5,"before":"28 делится на 7. Поэтому НОД(7; 28) = 7.","see":"Проверь, делится ли большее число на меньшее без остатка.","similar":"28 делится на 7. Поэтому НОД(7; 28) = 7.","algorithm":"Проверь, делится ли большее число на меньшее без остатка.","steps":["20 : 5 = 4.","Если одно число делится на другое, НОД равен меньшему числу.","Ответ: 5."],"visual":"","unit":"","retry":"Проверь, делится ли большее число на меньшее без остатка."},{"kind":"number","q":"Найди НОК(9; 27) коротким способом.","answer":27,"before":"28 делится на 7. Поэтому НОК(7; 28) = 28.","see":"Проверь, делится ли большее число на меньшее без остатка.","similar":"28 делится на 7. Поэтому НОК(7; 28) = 28.","algorithm":"Проверь, делится ли большее число на меньшее без остатка.","steps":["27 : 9 = 3.","Если одно число делится на другое, НОК равен большему числу.","Ответ: 27."],"visual":"","unit":"","retry":"Проверь, делится ли большее число на меньшее без остатка."},{"kind":"number","q":"Найди НОД(8; 9) коротким способом.","answer":1,"before":"7 и 10 имеют только один общий делитель: 1. НОД(7; 10) = 1.","see":"Проверь, есть ли у данных чисел общий делитель больше 1.","similar":"7 и 10 имеют только один общий делитель: 1. НОД(7; 10) = 1.","algorithm":"Проверь, есть ли у данных чисел общий делитель больше 1.","steps":["Делители 8: 1, 2, 4, 8. Делители 9: 1, 3, 9.","Единственный общий делитель равен 1. Числа взаимно простые.","НОД двух взаимно простых чисел равен 1.","Ответ: 1."],"visual":"","unit":"","retry":"Проверь, есть ли у данных чисел общий делитель больше 1."},{"kind":"number","q":"Найди НОК(14; 15) коротким способом.","answer":210,"before":"7 и 10 имеют только один общий делитель: 1. НОК(7; 10) = 7 · 10 = 70.","see":"Проверь, есть ли у данных чисел общий делитель больше 1.","similar":"7 и 10 имеют только один общий делитель: 1. НОК(7; 10) = 7 · 10 = 70.","algorithm":"Проверь, есть ли у данных чисел общий делитель больше 1.","steps":["Делители 14: 1, 2, 7, 14. Делители 15: 1, 3, 5, 15.","Единственный общий делитель равен 1. Числа взаимно простые.","НОК двух взаимно простых чисел равен их произведению: 14 · 15 = 210.","Ответ: 210."],"visual":"","unit":"","retry":"Проверь, есть ли у данных чисел общий делитель больше 1."},{"kind":"number","q":"Найди НОК(16; 16) коротким способом.","answer":16,"before":"28 делится на 7. Поэтому НОК(7; 28) = 28.","see":"Проверь, делится ли большее число на меньшее без остатка.","similar":"28 делится на 7. Поэтому НОК(7; 28) = 28.","algorithm":"Проверь, делится ли большее число на меньшее без остатка.","steps":["16 : 16 = 1.","Если одно число делится на другое, НОК равен большему числу.","Ответ: 16."],"visual":"","unit":"","retry":"Проверь, делится ли большее число на меньшее без остатка."},{"kind":"number","q":"НОД(18; 30) = 6. Найди НОК(18; 30) по формуле.","answer":90,"before":"Известно, что НОД(12; 16) = 4. Тогда НОК(12; 16) = (12 · 16) : 4 = 48.","see":"Даны два исходных числа и их НОД.","similar":"Известно, что НОД(12; 16) = 4. Тогда НОК(12; 16) = (12 · 16) : 4 = 48.","algorithm":"Перемножь исходные числа и раздели результат на НОД.","steps":["18 · 30 = 540.","НОК(18; 30) = 540 : 6 = 90.","Проверка: 90 : 18 = 5, 90 : 30 = 3.","Ответ: 90."],"visual":"","unit":"","retry":"Перемножь исходные числа и раздели результат на НОД."}]},{"name":"Задачи на НОД","subtitle":"Искомое делит исходные числа","title":"Как делить на равные части без остатка?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Одинаковые наборы без остатка\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Назови искомое\u003c/h4>\u003cp>Количество наборов должно делить количество предметов каждого вида. Когда просят наибольшее количество подходящих наборов, нужен НОД.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>18 карандашей и 24 ручки → НОД(18; 24) = 6 наборов\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверь, что спрашивают\u003c/h4>\u003cp>Если нужно количество предметов в каждом наборе, после НОД выполни ещё деление.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>18 : 6 = 3 карандаша и 24 : 6 = 4 ручки в наборе\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Равные куски наибольшей длины\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Смотри на длину одного куска\u003c/h4>\u003cp>Длина куска должна делить каждую исходную длину без остатка. Для наибольшей длины берём НОД.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>Ленты 20 см и 30 см → куски по 10 см\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если спрашивают количество\u003c/h4>\u003cp>Посчитай куски от каждой ленты отдельно и сложи.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>20 : 10 + 30 : 10 = 5 кусков\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Искомое делит исходные числа","anchorNote":"После вычисления вернись к вопросу задачи.","tasks":[{"kind":"number","q":"Есть 12 яблок и 18 груш. Какое наибольшее число одинаковых наборов можно собрать, используя все фрукты?","answer":6,"before":"Из 15 яблок и 25 груш можно сделать НОД(15; 25) = 5 одинаковых наборов. В каждом по 3 яблока и 5 груш.","see":"Количество наборов должно делить и 12, и 18.","similar":"Из 15 яблок и 25 груш можно сделать НОД(15; 25) = 5 одинаковых наборов. В каждом по 3 яблока и 5 груш.","algorithm":"Найди НОД и проверь, что все фрукты использованы.","steps":["12 = 2² · 3, 18 = 2 · 3².","НОД(12; 18) = 2 · 3 = 6.","В каждом наборе по 12 : 6 = 2 яблока и 18 : 6 = 3 груши.","Ответ: 6 наборов."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Одинаковые наборы\u003c/span>\u003cb>12 яблок и 18 груш → поровну каждого вида\u003c/b>\u003c/div>","unit":"наборов","retry":"Найди НОД и проверь, что все фрукты использованы."},{"kind":"number","q":"Из 20 красных и 28 синих бусин делают наибольшее число одинаковых браслетов, используя все бусины. Сколько всего бусин в одном браслете?","answer":12,"before":"Из 12 красных и 18 синих бусин выйдет НОД(12; 18) = 6 браслетов. На каждый уйдёт 2 красных и 3 синих, всего 5 бусин.","see":"НОД подскажет число браслетов. Вопрос про бусины в одном браслете.","similar":"Из 12 красных и 18 синих бусин выйдет НОД(12; 18) = 6 браслетов. На каждый уйдёт 2 красных и 3 синих, всего 5 бусин.","algorithm":"Найди НОД, раздели каждое количество на число браслетов, затем сложи два результата.","steps":["НОД(20; 28) = 4.","20 : 4 = 5 красных, 28 : 4 = 7 синих.","5 + 7 = 12 бусин.","Ответ: 12 бусин."],"visual":"","unit":"бусин","retry":"Найди НОД, раздели каждое количество на число браслетов, затем сложи два результата."},{"kind":"number","q":"Ленты 42 см и 56 см режут на равные куски наибольшей длины без обрезков. Какова длина одного куска?","answer":14,"before":"Ленты 18 см и 30 см делятся на куски по 6 см, потому что НОД(18; 30) = 6.","see":"Длина куска должна делить обе длины.","similar":"Ленты 18 см и 30 см делятся на куски по 6 см, потому что НОД(18; 30) = 6.","algorithm":"Найди наибольший общий делитель 42 и 56.","steps":["42 = 2 · 3 · 7, 56 = 2³ · 7.","НОД(42; 56) = 2 · 7 = 14.","Получатся 3 куска из первой ленты и 4 из второй.","Ответ: 14 см."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Две ленты\u003c/span>\u003cb>42 см и 56 см → один размер куска\u003c/b>\u003c/div>","unit":"см","retry":"Найди наибольший общий делитель 42 и 56."},{"kind":"number","q":"Лист бумаги размером 36 см на 48 см разрезали на одинаковые квадраты наибольшего размера без обрезков, стороны квадратов параллельны краям листа. Сколько квадратов получилось?","answer":12,"before":"Для листа 12 см на 18 см сторона большого квадрата равна НОД(12; 18) = 6 см. Вдоль краёв умещаются 2 и 3 квадрата. Всего 2 · 3 = 6.","see":"Сторона квадрата должна делить обе стороны листа.","similar":"Для листа 12 см на 18 см сторона большого квадрата равна НОД(12; 18) = 6 см. Вдоль краёв умещаются 2 и 3 квадрата. Всего 2 · 3 = 6.","algorithm":"Найди сторону, затем число квадратов вдоль двух краёв и перемножь.","steps":["НОД(36; 48) = 12 см.","36 : 12 = 3, 48 : 12 = 4.","3 · 4 = 12 квадратов.","Ответ: 12 квадратов."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Сетка квадратов\u003c/span>\u003cb>Число рядов · число квадратов в ряду\u003c/b>\u003c/div>","unit":"квадратов","retry":"Найди сторону, затем число квадратов вдоль двух краёв и перемножь."},{"kind":"number","q":"Есть 24 карандаша, 36 ручек и 60 наклеек. Сколько одинаковых подарков можно собрать максимум, использовав всё?","answer":12,"before":"Для 12 ручек, 18 карандашей и 30 наклеек НОД(12; 18; 30) = 6. Можно собрать 6 одинаковых подарков.","see":"Число подарков должно делить все три количества.","similar":"Для 12 ручек, 18 карандашей и 30 наклеек НОД(12; 18; 30) = 6. Можно собрать 6 одинаковых подарков.","algorithm":"Найди НОД трёх чисел через простые множители.","steps":["24 = 2³ · 3, 36 = 2² · 3², 60 = 2² · 3 · 5.","Общие множители в меньших степенях дают 2² · 3 = 12.","В каждом подарке 2 карандаша, 3 ручки и 5 наклеек.","Ответ: 12 подарков."],"visual":"","unit":"подарков","retry":"Найди НОД трёх чисел через простые множители."}]},{"name":"Задачи на НОК и выбор","subtitle":"Искомое делится на исходные числа","title":"Как найти совпадение и выбрать действие?","intro":"\u003csection class=\"theory-topic\">\u003ch3>Когда события совпадут снова\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Отсчитывай от общего старта\u003c/h4>\u003cp>Прошедшее время должно делиться на каждый период. Слово «снова» означает первое совпадение после старта.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>Каждые 4 и 10 мин → НОК(4; 10) = 20 мин\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если просят время на часах\u003c/h4>\u003cp>Прибавь найденный промежуток ко времени старта.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>09:50 + 20 мин = 10:10\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Наименьшее количество, которое можно разложить по-разному\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Проверь каждую упаковку\u003c/h4>\u003cp>Общее количество делится на любой из предложенных размеров упаковки.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>По 8 или по 12 → НОК(8; 12) = 24\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если есть нижняя граница\u003c/h4>\u003cp>Все общие кратные получаются умножением НОК на натуральное число. Выбери первое, которое подходит по условию.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>24, 48, 72, 96, … → первое больше 50 равно 72\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Как выбрать между НОД и НОК\u003c/h3>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Запиши одно деление со знаком вопроса\u003c/h4>\u003cp>Если исходные числа делятся на искомое, ищи общий делитель. Если искомое делится на исходные числа, ищи общее кратное.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Пример\u003c/span>\u003cb>24 : ? и 36 : ? → общий делитель. ? : 24 и ? : 36 → общее кратное.\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Искомое делится на исходные числа","anchorNote":"В задаче на повторение начни отсчёт от общего старта.","tasks":[{"kind":"number","q":"Два сигнала прозвучали вместе. Первый звучит каждые 6 минут, второй каждые 8 минут. Через сколько минут они снова прозвучат вместе?","answer":24,"before":"Если сигналы звучат каждые 3 и 5 минут, первое совпадение после старта через НОК(3; 5) = 15 минут.","see":"Прошедшее время должно делиться на 6 и на 8.","similar":"Если сигналы звучат каждые 3 и 5 минут, первое совпадение после старта через НОК(3; 5) = 15 минут.","algorithm":"Найди первое положительное общее кратное 6 и 8.","steps":["Кратные 6: 6, 12, 18, 24, …","Кратные 8: 8, 16, 24, …","Первое совпадение после старта через 24 минуты.","Ответ: 24 мин."],"visual":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">Отсчёт от общего старта\u003c/span>\u003cb>Первый сигнал: каждые 6 мин. Второй: каждые 8 мин.\u003c/b>\u003c/div>","unit":"мин","retry":"Найди первое положительное общее кратное 6 и 8."},{"kind":"choice","q":"Автобусы выехали вместе в 08:50. С одного маршрута автобус выезжает каждые 12 минут, с другого каждые 18 минут. Во сколько будет следующий общий выезд?","answer":"09:26","before":"Общий старт в 10:50, периоды 5 и 6 минут. НОК(5; 6) = 30. Прибавляем 30 минут: 10:50 + 30 мин = 11:20.","see":"Нужны два действия: найти промежуток и прибавить его ко времени старта.","similar":"Общий старт в 10:50, периоды 5 и 6 минут. НОК(5; 6) = 30. Прибавляем 30 минут: 10:50 + 30 мин = 11:20.","algorithm":"Найди НОК(12; 18). От 08:50 сначала дойди до 09:00.","steps":["12 = 2² · 3, 18 = 2 · 3², поэтому НОК(12; 18) = 36.","10 минут доводят до 09:00, остаётся прибавить 26 минут.","Ответ: 09:26."],"visual":"","unit":"","retry":"Найди НОК(12; 18). От 08:50 сначала дойди до 09:00.","options":["09:02","09:08","09:26","09:50"]},{"kind":"number","q":"Какое наименьшее положительное число конфет можно разложить без остатка и по 6, и по 10, и по 15 в пакет?","answer":30,"before":"Если конфеты можно разложить и по 4, и по 6, и по 9, наименьшее количество равно НОК(4; 6; 9) = 36.","see":"Количество конфет делится на каждый из трёх размеров пакета.","similar":"Если конфеты можно разложить и по 4, и по 6, и по 9, наименьшее количество равно НОК(4; 6; 9) = 36.","algorithm":"Разложи каждое число и возьми все простые множители в наибольших степенях.","steps":["6 = 2 · 3, 10 = 2 · 5, 15 = 3 · 5.","НОК(6; 10; 15) = 2 · 3 · 5 = 30.","30 : 6 = 5, 30 : 10 = 3, 30 : 15 = 2.","Ответ: 30 конфет."],"visual":"","unit":"конфет","retry":"Разложи каждое число и возьми все простые множители в наибольших степенях."},{"kind":"number","q":"У учителя больше 90 карточек. Их можно разложить без остатка и по 10, и по 15 в пачку. Сколько карточек может быть как минимум?","answer":120,"before":"Тетрадей больше 40. Они укладываются и по 4, и по 6. НОК(4; 6) = 12, кратные 12: 12, 24, 36, 48, … Первое больше 40 равно 48.","see":"Сначала узнай шаг между общими кратными.","similar":"Тетрадей больше 40. Они укладываются и по 4, и по 6. НОК(4; 6) = 12, кратные 12: 12, 24, 36, 48, … Первое больше 40 равно 48.","algorithm":"Найди НОК, выпиши его кратные и выбери первое строго больше 90.","steps":["НОК(10; 15) = 30.","Кратные 30: 30, 60, 90, 120, …","90 равно границе, поэтому подходит 120.","Ответ: 120 карточек."],"visual":"","unit":"карточек","retry":"Найди НОК, выпиши его кратные и выбери первое строго больше 90."},{"kind":"choice","q":"У Маши две ленты 18 см и 24 см. Она ищет наибольшую длину куска, чтобы разрезать обе ленты без обрезков. НОД или НОК?","answer":"НОД","before":"При поиске длины куска у лент 10 и 15 см каждую длину делят на искомую. Поэтому нужен НОД.","see":"Проверь, какое число окажется делителем.","similar":"При поиске длины куска у лент 10 и 15 см каждую длину делят на искомую. Поэтому нужен НОД.","algorithm":"Запиши 18 : ? и 24 : ?. Подумай, как называют самое большое число, подходящее в оба деления.","steps":["Искомая длина делит 18 и 24.","Из общих делителей выбираем наибольший.","Ответ: НОД."],"visual":"","unit":"","retry":"Запиши 18 : ? и 24 : ?. Подумай, как называют самое большое число, подходящее в оба деления.","options":["НОД","НОК"]},{"kind":"choice","q":"Одни огни мигают каждые 9 секунд, другие каждые 12 секунд. Какое действие даст время до следующего совпадения после общей вспышки?","answer":"НОК","before":"Если огни мигают каждые 4 и 6 секунд, время до общей вспышки делится на 4 и на 6. Нужно самое маленькое положительное общее кратное.","see":"Промежуток должен включать целое число периодов каждого вида.","similar":"Если огни мигают каждые 4 и 6 секунд, время до общей вспышки делится на 4 и на 6. Нужно самое маленькое положительное общее кратное.","algorithm":"Запиши ? : 9 и ? : 12. Выбери действие, которое даёт первое положительное совпадение.","steps":["Искомый промежуток делится на 9 и на 12.","Берём наименьшее положительное общее кратное.","Ответ: НОК."],"visual":"","unit":"","retry":"Запиши ? : 9 и ? : 12. Выбери действие, которое даёт первое положительное совпадение.","options":["НОД","НОК"]}]}],"recap":["НОД делит каждое исходное число. В разложениях бери общие простые множители в наименьших степенях.","НОК делится на каждое исходное число. Бери все простые множители в наибольших степенях.","Если одно число делится на другое, НОД равен меньшему, НОК равен большему.","Для двух чисел НОД · НОК равно произведению исходных чисел.","В задаче сначала назови искомое, запиши направление деления, а после вычисления проверь, на какой вопрос ответил."],"lab":{"title":"Одни числа, два разных вопроса","intro":"Сравни направление деления и проверь, почему меняется ответ.","cases":[{"label":"12 и 18","html":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОД: числа делим на 6\u003c/span>\u003cb>12 : 6 = 2, 18 : 6 = 3\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОК: 36 делим на числа\u003c/span>\u003cb>36 : 12 = 3, 36 : 18 = 2\u003c/b>\u003c/div>"},{"label":"5 и 20","html":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОД: меньшее делит большее\u003c/span>\u003cb>20 : 5 = 4 → НОД равен 5\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОК: большее делится на меньшее\u003c/span>\u003cb>20 : 5 = 4 → НОК равен 20\u003c/b>\u003c/div>"},{"label":"8 и 15","html":"\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОД: общий делитель только 1\u003c/span>\u003cb>8 = 2³, 15 = 3 · 5 → НОД равен 1\u003c/b>\u003c/div>\u003cdiv class=\"theory-cell\">\u003cspan class=\"theory-note\">НОК: произведение\u003c/span>\u003cb>8 · 15 = 120 → НОК равен 120\u003c/b>\u003c/div>"}]},"exams":[{"label":"Вариант 1","tasks":[{"topic":"Общие делители","kind":"choice","q":"Какое из чисел является наибольшим общим делителем 16 и 28?","answer":4,"steps":["Делители 16: 1, 2, 4, 8, 16. Делители 28: 1, 2, 4, 7, 14, 28.","Общие делители: 1, 2, 4. Самый большой равен 4."],"options":[1,2,4,28,44]},{"topic":"НОД через множители","kind":"number","q":"Найди НОД(48; 72) через простые множители.","answer":24,"steps":["48 = 2⁴ · 3, 72 = 2³ · 3².","Общие простые множители в наименьших степенях: 2³ · 3.","НОД(48; 72) = 2³ · 3 = 24."],"options":null},{"topic":"НОК через множители","kind":"number","q":"Найди НОК(9; 12; 15) через простые множители.","answer":180,"steps":["9 = 3², 12 = 2² · 3, 15 = 3 · 5.","Все встретившиеся простые множители в наибольших степенях: 2² · 3² · 5.","НОК(9; 12; 15) = 2² · 3² · 5 = 180."],"options":null},{"topic":"Короткий способ"," (function(){

 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }

    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const copyButton=document.createElement('button');
    copyButton.type='button';
    copyButton.className='secondary copy-question';
    copyButton.textContent='Скопировать условие';
    const copied=document.createElement('span');
    copied.setAttribute('aria-live','polite');
    copyButton.after(copied);
    $('#worked-example').parentNode.append(copyButton,copied);
    copyButton.addEventListener('click',()=>copyText(t.q+(t.options?' '+t.options.join(', ')+'.':''),copied));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-exam">К контрольной</button><button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#finish-exam').addEventListener('click',openExam);
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  const examKey = KEY + '-exam';
  let examIndex = 0;
  let examStates = C.exams.map(() => ({answers: {}, submitted: false}));
  try {
    const saved = JSON.parse(localStorage.getItem(examKey));
    if (Array.isArray(saved)) {
      examStates = examStates.map((empty, i) => {
        const entry = saved[i];
        return entry?.answers && typeof entry.answers === 'object'
          ? {answers: entry.answers, submitted: entry.submitted === true}
          : empty;
      });
    }
  } catch { /* Keep the attempt available while the page is open. */ }

  function saveExam() {
    try { localStorage.setItem(examKey, JSON.stringify(examStates)); }
    catch { storageOK = false; updateStorage(); }
  }

  async function copyText(value, status) {
    try {
      await navigator.clipboard.writeText(value);
      status.textContent = 'Скопировано';
    } catch {
      status.textContent = 'Выдели условие и скопируй его вручную.';
    }
  }

  function openExam() {
    view = 'exam';
    render();
    $('#exam-title').focus({preventScroll: true});
    $('#workspace').scrollIntoView({block: 'start'});
  }

  function renderExam() {
    const variant = C.exams[examIndex];
    const current = examStates[examIndex];
    const score = variant.tasks.filter((t, i) => C.isCorrect(t, current.answers[i] ?? '')).length;
    const answered = variant.tasks.filter((_, i) => String(current.answers[i] ?? '').trim()).length;
    const cards = variant.tasks.map((t, i) => {
      const value = current.answers[i] ?? '';
      const correct = C.isCorrect(t, value);
      const caption = mathText(t.q);
      const controls = t.kind === 'choice'
        ? `<label class="exam-answer">Ответ <select name="q${i}"><option value="">Выбери ответ</option>${t.options.map(option =>
            `<option value="${esc(option)}" ${String(option) === value ? 'selected' : ''}>${esc(option)}</option>`).join('')}</select></label>`
        : `<label class="exam-answer">Ответ <input name="q${i}" inputmode="numeric" value="${esc(value)}" autocomplete="off" placeholder="Введи число"></label>`;
      const review = `<p><strong>${correct ? 'Верно · 1 балл' : (value.trim() ? 'Есть ошибка · 0 баллов' : 'Пропущено · 0 баллов')}</strong></p>
        <p>Твой ответ: ${value.trim() ? mathText(value) : 'пропуск'}. Правильный ответ: <strong>${mathText(t.answer)}</strong>.</p>
        <details class="exam-solution"><summary>Пошаговый разбор</summary><ol>${t.steps.map(step => `<li>${mathText(step)}</li>`).join('')}</ol></details>`;
      return `<fieldset class="exam-item"><legend>${i + 1}. ${current.submitted ? esc(t.topic) : 'Задание'}</legend>
        <p class="exam-question">${caption}</p>${current.submitted ? review : controls}</fieldset>`;
    }).join('');
    $('#workspace').innerHTML = `<section class="lesson-card exam-card" aria-labelledby="exam-title">
      <h2 id="exam-title" tabindex="-1">Пробная контрольная</h2>
      <p>Решай в тетради и вводи ответы. За каждый верный ответ начисляется 1 балл. Баллы и разбор появятся после сдачи.</p>
      <div class="segmented" aria-label="Вариант контрольной">${C.exams.map((item,i) =>
          `<button type="button" data-exam="${i}" aria-pressed="${i === examIndex}">${esc(item.label)}</button>`).join('')}</div>
      <div class="exam-toolbar"><button class="secondary" type="button" id="copy-exam">Скопировать задания</button>
        <span id="exam-copy-status" aria-live="polite"></span></div>
      ${current.submitted ? `<p id="exam-score" class="exam-score" tabindex="-1">Результат · ${score} из ${variant.tasks.length} баллов</p>` : ''}
      <form id="exam-form">${cards}
        <div class="exam-toolbar">${current.submitted
          ? '<button type="button" class="secondary" id="exam-retry">Пройти вариант заново</button>'
          : `<span id="exam-answered" aria-live="polite">Ответов: ${answered} из ${variant.tasks.length}</span><button type="submit" class="primary">Сдать работу</button>`}
        <button type="button" class="secondary" id="exam-back">Вернуться к тренировке</button></div>
      </form>
    </section>`;
    document.querySelectorAll('[data-exam]').forEach(button => button.addEventListener('click', () => {
      examIndex = Number(button.dataset.exam);
      renderExam();
      $('[data-exam="' + examIndex + '"]').focus({preventScroll: true});
    }));
    $('#copy-exam').addEventListener('click', () => copyText(
      [variant.label, ...variant.tasks.map((t, i) => (i+1) + '. ' + t.q + (t.options ? ' ' + t.options.join(', ') + '.' : ''))].join('\n'),
      $('#exam-copy-status')
    ));
    $('#exam-back').addEventListener('click', () => { view = 'lesson'; render(); scrollToLesson(); });
    $('#exam-retry')?.addEventListener('click', () => {
      if (!window.confirm('Удалить ответы этого варианта и пройти его заново?')) return;
      examStates[examIndex] = {answers: {}, submitted: false};
      saveExam();
      openExam();
    });
    const form = $('#exam-form');
    if (current.submitted) return;
    form.addEventListener('input', event => {
      current.answers[Number(event.target.name.slice(1))] = event.target.value;
      saveExam();
      const count = variant.tasks.filter((_, i) => String(current.answers[i] ?? '').trim()).length;
      $('#exam-answered').textContent = `Ответов: ${count} из ${variant.tasks.length}`;
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      const count = variant.tasks.filter((_, i) => String(current.answers[i] ?? '').trim()).length;
      if (count < variant.tasks.length && !window.confirm('Некоторые задания пропущены. Сдать работу?')) return;
      current.submitted = true;
      saveExam();
      renderExam();
      $('#exam-score').focus();
    });
  }

  $('#open-exam').addEventListener('click', openExam);

  render();
})();
</script>
