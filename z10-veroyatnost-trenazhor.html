<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вероятность: тренажёр</title><style>
:root{--bg:#12261f;--card:#1a3329;--line:#2c4a3d;--cream:#f3ead7;--muted:#a9b8ac;--blue:#7da2ff;--apricot:#f0a35e;--butter:#f2d675;--sage:#9bb59a;--ok:#9bd3a0;--bad:#f09a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-style:normal}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:10px 0 4px;letter-spacing:-.3px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--apricot);width:0;transition:width .3s}
.tag{display:inline-block;font-size:12px;color:var(--bg);background:var(--butter);padding:2px 10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.q{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--sage)}
.opt.ok{border-color:var(--ok);background:rgba(155,211,160,.12)}
.opt.bad{border-color:var(--bad);background:rgba(240,154,138,.12)}
.opt[disabled]{cursor:default}
.btn{background:var(--apricot);color:#2a1a08;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line);margin-left:8px}
.btn[disabled]{opacity:.45;cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-left:3px solid var(--blue);background:rgba(125,162,255,.08);border-radius:6px;font-size:15px}
.hint{color:var(--butter);font-size:14px;margin-top:8px}
input.num{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;width:160px}
.cond{background:#0f1f19;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.done{border-left:3px solid var(--ok);padding:8px 14px;margin:8px 0;background:rgba(155,211,160,.08);border-radius:6px;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--cream);color:var(--bg);font-weight:600}
.big{font-size:44px;font-weight:700;color:var(--butter);margin:4px 0}
sup{font-size:70%;line-height:0;vertical-align:super;white-space:nowrap}
.fr{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px}.fr i{display:block;font-style:normal;padding:0 4px;border-bottom:1px solid currentColor;line-height:1.25}.fr b{display:block;font-weight:normal;padding:0 4px;line-height:1.25}
.dice{border-collapse:collapse;margin:8px 0}.dice td{width:30px;height:28px;text-align:center;border:1px solid var(--line);font-size:13px}.dice td.y{background:rgba(242,214,117,.25);color:var(--butter);font-weight:700}.dice td.h{color:var(--muted)}
</style></head><body><div class="wrap"><a href="z10-veroyatnost.html" style="color:var(--blue);font-size:14px;text-decoration:none">← Вероятность (задание 10)</a><h1>Тренажёр: 5 задач повышенной сложности</h1><p class="sub">Каждая задача разбита на шаги. Ответ можно писать десятичной дробью (0,25) или обыкновенной (1/4). Подсказки не выдают ответ.</p><div class="tabs" id="tabs"></div><div class="bar"><i id="pb"></i></div><div id="box"></div></div>
<script>const TR=[{"text": "В сборнике 25 экзаменационных билетов: в 10 из них есть вопрос по алгебре, в 8 — по геометрии, остальные билеты по статистике. Найдите вероятность того, что в случайно выбранном билете не будет вопроса ни по алгебре, ни по геометрии.", "steps": [{"q": "Сколько всего билетов?", "a": "25", "h": "Это число в самом начале условия."}, {"q": "Сколько билетов по алгебре и по геометрии вместе?", "a": "18", "h": "Группы разные, их можно сложить: 10 + 8."}, {"q": "Сколько билетов подходит (ни алгебры, ни геометрии)?", "a": "7", "h": "Из всех билетов вычти те, что нашёл в предыдущем шаге."}, {"q": "Найдите вероятность (десятичная дробь).", "a": "0,28", "h": "P = m : n = 7 : 25. Домножь числитель и знаменатель на 4."}], "sol": ["Всего исходов: n = 25 (любой из 25 билетов).", "Билеты по алгебре и по геометрии — разные (в условии «остальные» — по статистике), поэтому их можно сложить: 10 + 8 = 18.", "Благоприятные исходы — билеты по статистике: m = 25 − 18 = 7.", "P = <span class=\"fr\"><i>7</i><b>25</b></span> = 28 : 100 = 0,28. Знаменатель 25 домножаем на 4: <span class=\"fr\"><i>7</i><b>25</b></span> = <span class=\"fr\"><i>28</i><b>100</b></span>."], "ans": "0,28", "trap": "Вычли только 10 и получили 15 : 25 = 0,6, то есть посчитали «не алгебра», а в условии «ни алгебра, ни геометрия». Читай «не… и не…» как «ни…, ни…»: из всех билетов вычитаются обе группы.", "topic": "Противоположное событие и «остальные»", "table": ""}, {"text": "В классе 21 ученик, среди них два друга — Миша и Коля. Класс случайным образом делят на три группы по 7 человек в каждой. Найдите вероятность того, что Миша и Коля окажутся в одной группе.", "steps": [{"q": "Сколько свободных мест остаётся в группе Миши (кроме него самого)?", "a": "6", "h": "В группе 7 человек, один из них Миша."}, {"q": "Сколько всего учеников, кроме Миши?", "a": "20", "h": "Коля может оказаться на любом месте, кроме места Миши."}, {"q": "Найдите вероятность (десятичная дробь).", "a": "0,3", "h": "P = 6 : 20, сократи на 2."}], "sol": ["Поместим Мишу в какую-нибудь группу. Он там один из 7, значит в его группе остаются 6 свободных мест.", "Всего остальных учеников 21 − 1 = 20: Коля может оказаться на любом из 20 «мест», все они равновозможны. Значит n = 20.", "Благоприятные места — 6 свободных мест в Мишиной группе: m = 6.", "P = <span class=\"fr\"><i>6</i><b>20</b></span> = <span class=\"fr\"><i>3</i><b>10</b></span> = 0,3."], "ans": "0,3", "trap": "Взяли 7 : 21 = <span class=\"fr\"><i>1</i><b>3</b></span> — это вероятность «Коля в конкретной группе», но не «в той же группе, где уже стоит Миша». Место самого Миши нужно сначала выбросить и из числителя, и из знаменателя.", "topic": "Распределение по группам", "table": ""}, {"text": "Игральный кубик (кость) бросают дважды. Найдите вероятность того, что произведение выпавших очков будет нечётным.", "steps": [{"q": "Сколько всего пар очков (a; b) при двух бросках?", "a": "36", "h": "На первом кубике 6 исходов, на втором 6."}, {"q": "Сколько нечётных очков на одном кубике?", "a": "3", "h": "Нечётные: 1, 3, 5."}, {"q": "Сколько пар, в которых оба числа нечётные?", "a": "9", "h": "Умножь число нечётных на первом кубике на число на втором."}, {"q": "Найдите вероятность (десятичная дробь).", "a": "0,25", "h": "P = 9 : 36, сократи на 9."}], "sol": ["Опыт состоит из двух бросков. На первом кубике 6 исходов и на втором 6 исходов, всего пар (a; b): n = 6 · 6 = 36.", "Произведение нечётно только тогда, когда оба числа нечётны (если хоть один множитель чётный, произведение чётное).", "Нечётных очков на кубике три: 1, 3, 5. Пар с обоими нечётными: m = 3 · 3 = 9.", "P = <span class=\"fr\"><i>9</i><b>36</b></span> = <span class=\"fr\"><i>1</i><b>4</b></span> = 0,25."], "ans": "0,25", "trap": "Считают, что «нечётное произведение» — это половина исходов, и пишут 0,5. Это верно для одного кубика, а для произведения двух чисел нужно, чтобы нечётными были оба множителя.", "topic": "Два кубика, таблица исходов", "table": "<table class=\"dice\"><tr><td class=\"h\">&nbsp;</td><td class=\"h\"><b>1</b></td><td class=\"h\"><b>2</b></td><td class=\"h\"><b>3</b></td><td class=\"h\"><b>4</b></td><td class=\"h\"><b>5</b></td><td class=\"h\"><b>6</b></td></tr><tr><td class=\"h\"><b>1</b></td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td></tr><tr><td class=\"h\"><b>2</b></td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td></tr><tr><td class=\"h\"><b>3</b></td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td></tr><tr><td class=\"h\"><b>4</b></td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td></tr><tr><td class=\"h\"><b>5</b></td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td><td class=\"y\">★</td><td class=\"\">·</td></tr><tr><td class=\"h\"><b>6</b></td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td><td class=\"\">·</td></tr></table>"}, {"text": "В автопарке 40 машин: 14 белых, 11 чёрных, а остальные — красные и серые, причём серых вдвое больше, чем красных. Диспетчер наугад выбирает одну машину. Найдите вероятность того, что она окажется красной или серой.", "steps": [{"q": "Сколько машин белых и чёрных вместе?", "a": "25", "h": "14 + 11."}, {"q": "Сколько машин красных и серых вместе?", "a": "15", "h": "Из 40 вычти белые и чёрные."}, {"q": "Найдите вероятность (десятичная дробь).", "a": "0,375", "h": "P = 15 : 40 = 3 : 8. Раздели 3 на 8 столбиком."}], "sol": ["Всего исходов: n = 40.", "Белых и чёрных вместе 14 + 11 = 25. Красных и серых вместе 40 − 25 = 15.", "Событие «красная или серая» объединяет две несовместные группы, поэтому благоприятных исходов m = 15. Узнавать по отдельности, сколько красных (5) и серых (10), не нужно: условие «вдвое больше» здесь лишнее.", "P = <span class=\"fr\"><i>15</i><b>40</b></span> = <span class=\"fr\"><i>3</i><b>8</b></span> = 0,375. Проверка: <span class=\"fr\"><i>3</i><b>8</b></span> = 3 : 8 = 0,375."], "ans": "0,375", "trap": "Теряют время на поиск числа красных и серых или, наоборот, берут только серых (10 : 40 = 0,25). Сначала прочитайте, о чём вопрос: если спрашивают про обе группы сразу, лишние данные можно не трогать.", "topic": "Лишние данные в условии", "table": ""}, {"text": "На карточках написаны числа от 1 до 50 (по одному числу на карточке). Карточки перемешали, и наугад берут одну. Найдите вероятность того, что число на ней делится на 6 или на 10.", "steps": [{"q": "Сколько чисел от 1 до 50 делится на 6?", "a": "8", "h": "Числа 6, 12, 18, …, 48."}, {"q": "Сколько чисел от 1 до 50 делится на 10?", "a": "5", "h": "Числа 10, 20, 30, 40, 50."}, {"q": "Сколько чисел делится и на 6, и на 10 (они попали в оба списка)?", "a": "1", "h": "Это число 30. Следующее общее было бы 60 — оно больше 50."}, {"q": "Сколько карточек подходит (с учётом общих)?", "a": "12", "h": "8 + 5 − 1."}, {"q": "Найдите вероятность (десятичная дробь).", "a": "0,24", "h": "P = 12 : 50. Домножь на 2, чтобы получить знаменатель 100."}], "sol": ["Всего исходов: n = 50 (числа 1, 2, …, 50).", "Числа, кратные 6: 6, 12, 18, 24, 30, 36, 42, 48 — их 8.", "Числа, кратные 10: 10, 20, 30, 40, 50 — их 5.", "Число 30 кратно и 6, и 10, оно попало в оба списка. Его нужно посчитать один раз: m = 8 + 5 − 1 = 12.", "P = <span class=\"fr\"><i>12</i><b>50</b></span> = <span class=\"fr\"><i>24</i><b>100</b></span> = 0,24."], "ans": "0,24", "trap": "Складывают 8 + 5 = 13 и получают 13 : 50 = 0,26. Карточка с числом 30 посчитана дважды. Перед сложением выпишите числа списками и найдите общие.", "topic": "Пересечение списков («или»)", "table": ""}];const parse=s=>{s=String(s).trim().replace(/\s+/g,'').replace(',','.');let m;if(m=s.match(/^(\d+)\/(\d+)$/))return +m[2]?(+m[1])/(+m[2]):NaN;if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s);return NaN};
const same=(a,b)=>Math.abs(a-b)<1e-9;
let cur=0,done=TR.map(()=>false);const tabs=document.getElementById('tabs'),box=document.getElementById('box'),pb=document.getElementById('pb');
function renderTabs(){tabs.innerHTML='';TR.forEach((t,k)=>{const b=document.createElement('button');b.textContent='Задача '+(k+1)+(done[k]?' ✓':'');if(k===cur)b.className='on';b.onclick=()=>{cur=k;start()};tabs.appendChild(b)});pb.style.width=(done.filter(Boolean).length/TR.length*100)+'%'}
function start(){renderTabs();const t=TR[cur];box.innerHTML='<div class="card"><span class="tag">'+t.topic+'</span><div class="cond">'+t.text+'</div><div id="st"></div></div>';step(0,[])}
function step(k,log){const t=TR[cur],st=document.getElementById('st');
 let h=log.map(l=>'<div class="done">'+l+'</div>').join('');
 if(k>=t.steps.length){done[cur]=true;renderTabs();
  h+='<div class="exp"><b>Задача решена. Ответ: '+t.ans+'.</b><br>'+t.table+'<br><b>Ловушка.</b> '+t.trap+'</div><button class="btn ghost" id="sh">Показать полный разбор</button>'+(cur+1<TR.length?' <button class="btn" id="nx">Следующая задача</button>':'');
  st.innerHTML=h;document.getElementById('sh').onclick=function(){this.outerHTML='<div class="exp"><ol>'+t.sol.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>'};
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{cur++;start()};return}
 const s=t.steps[k];
 h+='<p><b>Шаг '+(k+1)+' из '+t.steps.length+'.</b> '+s.q+'</p><input class="num" id="in" autocomplete="off" inputmode="decimal"> <button class="btn" id="ok">Проверить</button> <button class="btn ghost" id="hn">Подсказка</button><div id="fb"></div>';
 st.innerHTML=h;const inp=document.getElementById('in'),fb=document.getElementById('fb');inp.focus();let tries=0;
 const check=()=>{const v=parse(inp.value);if(isNaN(v)){fb.innerHTML='<div class="hint">Введи число.</div>';return}
  if(same(v,parse(s.a))){step(k+1,log.concat(['Шаг '+(k+1)+': '+s.q+' <b>'+s.a+'</b>']))}else{tries++;fb.innerHTML='<div class="hint">Не совпало. '+(tries>=2?'Подсказка: '+s.h:'Проверь условие и попробуй ещё раз.')+'</div>'}};
 document.getElementById('ok').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
 document.getElementById('hn').onclick=()=>{fb.innerHTML='<div class="hint">Подсказка: '+s.h+'</div>'}}
start();</script></body></html>
