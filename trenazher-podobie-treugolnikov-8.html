/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);
}

ака","subtitle":"Как доказать подобие","title":"Как выбрать признак подобия","intro":"\u003csection class=\"theory-topic\">\u003ch3>Первый признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Подобие по двум углам\u003c/strong> – если два угла одного треугольника соответственно равны двум углам другого, то треугольники подобны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Третий угол\u003c/h4>\u003cp>Два угла уже известны, а сумма всех трёх равна 180°.\u003c/p>\u003cdiv class=\"theory-cell\">∠A = ∠D, ∠B = ∠E ⇒ ∠C = ∠F\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Второй признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Подобие по двум сторонам и углу между ними\u003c/strong> – если две стороны одного треугольника пропорциональны двум сторонам другого, а углы между этими сторонами равны, то треугольники подобны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Угол между данными сторонами\u003c/h4>\u003cp>У сторон AB и AC общая вершина A. Сравниваем именно ∠BAC с углом между DE и DF.\u003c/p>\u003cdiv class=\"theory-cell\">AB/DE = AC/DF, ∠A = ∠D ⇒ △ABC ∼ △DEF\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Третий признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Подобие по трём сторонам\u003c/strong> – если три стороны одного треугольника пропорциональны трём сторонам другого, то треугольники подобны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Единый коэффициент\u003c/h4>\u003cp>Удобно сначала упорядочить стороны по длине.\u003c/p>\u003cdiv class=\"theory-cell\">3/6 = 4/8 = 5/10 ⇒ треугольники подобны\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","tasks":[{"kind":"choice","q":"В △ABC углы A и B равны 40° и 65°. В △DEF углы D и F равны 40° и 75°. Какой угол соответствует ∠B?","answer":"∠E","options":["∠D","∠E","∠F"],"example":["В △ABC углы A и B равны 30° и 80°. В △DEF углы E и F равны 80° и 70°.","В △DEF третий угол ∠D = 180° − 80° − 70° = 30°.","Получаем A ↔ D, B ↔ E. Подобие доказано по двум углам."],"steps":["∠E = 180° − 40° − 75° = 65°.","∠B = ∠E, ∠A = ∠D.","Следовательно, △ABC ∼ △DEF по двум углам."],"see":"Найди ∠E по сумме углов.","similar":"В △DEF третий угол ∠D = 180° − 80° − 70° = 30°.","algorithm":"Сопоставь равные углы двух треугольников.","retry":"Найди ∠E по сумме углов.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 470 190\" role=\"img\" aria-label=\"Два треугольника ABC и DEF\">\u003cpolyline points=\"90.00,64.00 37.00,151.00 155.00,151.00 90.00,64.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"329.15,16.15 247.00,151.00 429.90,151.00 329.15,16.15\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"90\" cy=\"64\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"90\" y=\"51\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"37\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"24\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"155\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"168\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"329.15\" cy=\"16.150000000000006\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"329.15\" y=\"4.150000000000006\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"247\" cy=\"151\" r=\"3.2\" fill= ill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"247\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"234\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">E\u003c/text>\u003ccircle cx=\"429.9\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"442.9\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">F\u003c/text>\u003c/svg>\u003cfigcaption>Схема. Длины и величины углов берём из условия.\u003c/figcaption>\u003c/figure>","unit":""},{"kind":"choice","q":"AB = 6, AC = 9, DE = 10, DF = 15. ∠BAC = ∠EDF. Какой признак доказывает подобие?","answer":"По двум сторонам и углу между ними","options":["По двум углам","По двум сторонам и углу между ними","По трём сторонам"],"example":["Пусть AB = 4, AC = 6, DE = 6, DF = 9, а ∠A = ∠D.","Сравним отношения: 4/6 = 2/3 и 6/9 = 2/3.","Углы A и D лежат между указанными сторонами. Применяем второй признак."],"steps":["AB/DE = 6/10 = 3/5.","AC/DF = 9/15 = 3/5.","Углы A и D – между данными сторонами, поэтому работает второй признак."],"see":"Проверь, в какой вершине сходятся AB и AC.","similar":"Сравним отношения: 4/6 = 2/3 и 6/9 = 2/3.","algorithm":"Сравни два отношения и проверь угол между данными сторонами.","retry":"Проверь, в какой вершине сходятся AB и AC.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 470 190\" role=\"img\" aria-label=\"Два треугольника ABC и DEF\">\u003cpolyline points=\"90.00,64.00 37.00,151.00 155.00,151.00 90.00,64.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"329.15,16.15 247.00,151.00 429.90,151.00 329.15,16.15\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"90\" cy=\"64\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"90\" y=\"51\" одобны."],"steps":["Порядок сторон второго треугольника: 9, 12, 15.","6/9 = 8/12 = 10/15 = 2/3.","По третьему признаку треугольники подобны. Коэффициент равен 2/3."],"see":"Поставь стороны обоих треугольников в порядке возрастания.","similar":"Упорядочим второй набор: 8, 10, 14.","algorithm":"Сравни меньшие, средние и большие стороны отдельно.","retry":"Поставь стороны обоих треугольников в порядке возрастания.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 470 190\" role=\"img\" aria-label=\"Два треугольника ABC и DEF\">\u003cpolyline points=\"90.00,64.00 37.00,151.00 155.00,151.00 90.00,64.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"329.15,16.15 247.00,151.00 429.90,151.00 329.15,16.15\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"90\" cy=\"64\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"90\" y=\"51\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"37\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"24\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"155\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"168\" y=\"165\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"329.15\" cy=\"16.150000000000006\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"329.15\" y=\"4.150000000000006\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"247\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"234\" y=\"165\" text nition\">\u003cstrong>Равенство отношений сходственных сторон\u003c/strong> – в подобных треугольниках отношение каждой пары сходственных сторон равно коэффициенту подобия.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Составляем пропорцию\u003c/h4>\u003cp>В обеих дробях первым идёт один и тот же треугольник.\u003c/p>\u003cdiv class=\"theory-cell\">AB/DE = BC/EF ⇒ AB · EF = BC · DE\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Периметры\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Периметр\u003c/strong> – сумма длин всех сторон треугольника.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Масштаб суммы\u003c/h4>\u003cp>Если каждая сторона одного треугольника в k раз больше сходственной стороны другого, то и весь периметр меняется в k раз.\u003c/p>\u003cdiv class=\"theory-cell\">k = 2 ⇒ P₁/P₂ = 2\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","tasks":[{"kind":"number","q":"△ABC ∼ △DEF. AB = 8 см, DE = 12 см, BC = 10 см. Найди EF в сантиметрах.","answer":15,"example":["Пусть AB = 4 см, DE = 6 см и BC = 8 см. Найдём EF.","От ABC к DEF каждая длина умножается на 6/4 = 3/2.","EF = 8 · 3/2 = 12 см."],"steps":["Увеличение от ABC к DEF равно DE/AB = 12/8 = 3/2.","BC соответствует EF.","EF = 10 · 3/2 = 15 см."],"see":"Узнай, во сколько раз DE больше AB.","similar":"От ABC к DEF каждая длина умножается на 6/4 = 3/2.","algorithm":"Примени этот множитель к BC.","retry":"Узнай, во сколько раз DE больше AB.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 470 190\" role=\"img\" aria-label=\"Два треугольника ABC и DEF. Одинаковая разметка показывает равные углы\">\u003cpolyline points=\"90.00,64.00 37.00,151.00 155.00,151.00 90.00,64.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"329.15,16.15 247.00,151.00 429.90,151.00 329.15,16.15\" fill=\"none\" stroke=\"#16231A\" s der=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"365\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"379\" y=\"168\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"146.0\" cy=\"63.0\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"131.0\" y=\"62.0\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"253.66666666666666\" cy=\"63.0\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"268.66666666666663\" y=\"62.0\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">E\u003c/text>\u003c/svg>\u003cfigcaption>DE ∥ BC\u003c/figcaption>\u003c/figure>","unit":""}],"anchor":"На рисунке с DE ∥ BC сначала найди общий угол.","anchorNote":"Для пропорции подпиши длину всей стороны."},{"name":"Площади","subtitle":"Квадрат коэффициента","title":"Как длины связаны с площадями","intro":"\u003csection class=\"theory-topic\">\u003ch3>Квадрат масштаба\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Отношение площадей подобных треугольников\u003c/strong> – отношение площади первого треугольника к площади второго равно квадрату коэффициента подобия первого ко второму.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Почему квадрат\u003c/h4>\u003cp>Выберем в каждом треугольнике самую длинную сторону и проведём к ней высоту. Эти высоты относятся как основания: в двух прямоугольных треугольниках, которые образуют высоты, равны углы при сходственных вершинах. Поэтому в формуле площади основание и высота дают по одному множителю k.\u003c/p>\u003cdiv class=\"theory-cell\">S = (a · h)/2 ⇒ S₁/S₂ = k · k = k²\u003c/div>\u003c/li>\u003cli>\u003ch4>Обратная задача\u003c/h4>\u003cp>Если известны площади, для отношения длин берём положительный квадратный корень.\u003c/p>\u003cdiv class=\"theory-cell\">S₁/S₂ = 25/49 ⇒ k = 5/7\u003c/div>\u003c/li>\u003cli>\u003ch4>Площадь между параллельными отрезками\u003c/h4>\u003cp>Трапеция DBCE – часть большого треугольника ABC без малого треугольника ADE.\u003c/p>\u003cdiv class=\"theory-cell\">S(DBCE) = S(ABC) − S(ADE)\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","tasks":[{"kind":"number","q":"Коэффициент подобия △ABC к △DEF равен 2/3. Площадь треугольника DEF равна 81 см². Найди площадь △ABC в см².","answer":36,"example":["Пусть k = 3/4, а площадь второго треугольника равна 64 см².","Площади относятся как 9 к 16, потому что k² = 9/16.","Площадь первого равна 64 · 9/16 = 36 см²."],"steps":["S₁/S₂ = (2/3)² = 4/9.","Подставляем S₂ = 81 см².","S₁ = 81 · 4/9 = 36 см²."],"see":"Возведи коэффициент подобия в квадрат.","similar":"Площади относятся как 9 к 16, потому что k² = 9/16.","algorithm":"Умножь 81 на полученное отношение площадей.","retry":"Возведи коэффициент подобия в квадрат.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 470 190\" role=\"img\" aria-label=\"Два треугольника ABC и DEF. Одинаковая разметка показывает равные углы\">\u003cpolyline points=\"90.00,64.00 37.00,151.00 155.00,151.00 90.00,64.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"329.15,16.15 247.00,151.00 429.90,151.00 329.15,16.15\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M82.72,75.96 A14,14 0 0 0 98.38,75.22\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M321.87,28.11 A14,14 0 0 0 337.53,27.37\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M44.28,139.04 A14,14 0 0 1 51.00,151.00\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M46.88,134.77 A19,19 0 0 1 56.00,151.00\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u00 ю долю всей площади занимает трапеция.","similar":"Малый треугольник занимает 1/4 площади большого, трапеция занимает 3/4.","algorithm":"Вычти k² из 1 и раздели известную площадь трапеции на эту долю.","retry":"Найди, какую долю всей площади занимает трапеция.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 420 177\" role=\"img\" aria-label=\"Треугольник ABC. Точки D и E лежат на сторонах AB и AC. Отрезок DE параллелен BC.\">\u003cpolyline points=\"198.00,19.00 42.00,151.00 365.00,151.00 198.00,19.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"104.40,98.20 298.20,98.20\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"42.00,151.00 365.00,151.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M115.09,89.16 A14,14 0 0 1 118.40,98.20\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M284.20,98.20 A14,14 0 0 1 287.22,89.52\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M279.20,98.20 A19,19 0 0 1 283.29,86.42\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M351.00,151.00 A14,14 0 0 1 354.02,142.32\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M346.00,151.00 A19,19 0 0 1 350.09,139.22\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003ccircle cx=\"198\" cy=\"19\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"198\" y=\"13\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"42\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"29\" y=\"168\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"365\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"379\" y=\"168\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"104.4\" cy=\"98.2\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"89.4\" y=\"97.2\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"298.2\" cy=\"98.2\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"313.2\" y=\"97.2\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">E\u003c/text>\u003c/svg>\u003cfigcaption>DE ∥ BC\u003c/figcaption>\u003c/figure>","exampleVisual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 420 177\" role=\"img\" aria-label=\"Треугольник ABC. Точки D и E лежат на сторонах AB и AC. Отрезок DE параллелен BC.\">\u003cpolyline points=\"198.00,19.00 42.00,151.00 365.00,151.00 198.00,19.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"104.40,98.20 298.20,98.20\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"42.00,151.00 365.00,151.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M115.09,89.16 A14,14 0 0 1 118.40,98.20\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M284.20,98.20 A14,14 0 0 1 287.22,89.52\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M279.20,98.20 A19,19 0 0 1 283.29,86.42\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M351.00,151.00 A14,14 0 0 1 354.02,142.32\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003cpath d=\"M346.00,151.00 A19,19 0 0 1 350.09,139.22\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"1.8\"/>\u003ccircle cx=\"198\" cy=\"19\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"198\" y=\"13\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"42\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"29\" y=\"168\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"365\" cy=\"151\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"379\" y=\"168\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"104.4\" cy=\"98.2\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"89.4\" y=\"97.2\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"298.2\" cy=\"98.2\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"313.2\" y=\"97.2\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">E\u003c/text>\u003c/svg>\u003cfigcaption>DE ∥ BC\u003c/figcaption>\u003c/figure>","unit":""}],"anchor":"Длины меняются в k раз, площади – в k² раз.","anchorNote":"Из отношения площадей получаем отношение длин извлечением корня."},{"name":"Сложные задачи","subtitle":"Цепочки подобия и построения","title":"Как связать несколько треугольников","intro":"\u003csection class=\"theory-topic\">\u003ch3>Диагонали трапеции\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Трапеция\u003c/strong> – четырёхугольник, у которого две стороны параллельны, а две другие стороны не параллельны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Пара треугольников у оснований\u003c/h4>\u003cp>Если AB ∥ CD, то углы ABO и CDO равны как накрест лежащие. Углы при O вертикальные. Отсюда △AOB ∼ △COD.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 420 190\" role=\"img\" aria-label=\"Трапеция ABCD с основаниями AB и CD. Диагонали AC и BD пересекаются в O.\">\u003cpolyline points=\"123.00,27.00 285.00,27.00 375.00,155.00 35.00,155.00 123.00,27.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"123.00,27.00 375.00,155.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"285.00,27.00 35.00,155.00\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M135.48,33.34 A14,14 0 0 0 137.00,27.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M362.52,148.66 A14,14 0 0 0 361.00,155.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003ccircle cx=\"123\" cy=\"27\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"109\" y=\"20\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"285\" cy=\"27\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"299\" y=\"20\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"375\" cy=\"155\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"387\" y=\"170\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"35\" cy=\"155\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"22\" y=\"170\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"204.32270916334662\" cy=\"68.30677290836653\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"226.32270916334662\" y=\"74.30677290836653\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">O\u003c/text>\u003c/svg>\u003cfigcaption>AB ∥ CD\u003c/figcaption>\u003c/figure>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Высота к гипотенузе\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Высота прямоугольного треугольника к гипотенузе\u003c/strong> – перпендикуляр, проведённый из вершины прямого угла к гипотенузе.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Два прямоугольных треугольника\u003c/h4>\u003cp>У △AHC и △CHB по прямому углу при H. Кроме того, ∠HAC = ∠HCB, потому что оба дополняют угол ABC до 90°. Поэтому △AHC ∼ △CHB.\u003c/p>\u003cdiv class=\"theory-cell\">AH/CH = CH/HB ⇒ CH² = AH · HB\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Биссектриса\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Биссектриса угла\u003c/strong> – луч, который выходит из вершины угла и делит его на два равных угла.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Дополнительное построение\u003c/h4>\u003cp>Проведи через C прямую, параллельную AD, до пересечения с продолжением BA в точке E. Тогда ∠AEC = ∠BAD и ∠ACE = ∠DAC. Углы равны, поэтому AE = AC.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 350 385\" role=\"img\" aria-label=\"Треугольник ABC. AD — биссектриса. Через C проведена прямая, параллельная AD. Она пересекает продолжение BA в E.\">\u003cpolyline points=\"114.00,234.00 33.00,358.00 298.00,358.00 114.00,234.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"114.00,234.00 139.08,358.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"114.00,234.00 235.34,48.24\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"298.00,358.00 235.34,48.24\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M106.34,245.72 A14,14 0 0 0 116.78,247.72\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M116.78,247.72 A14,14 0 0 0 125.61,241.82\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003ccircle cx=\"114\" cy=\"234\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"114\" y=\"225\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"33\" cy=\"358\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"21\" y=\"374\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"298\" cy=\"358\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"298\" y=\"374\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">C\u003c/text>\u003ccircle cx=\"139.08145360868804\" cy=\"358\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"139.08145360868804\" y=\"374\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">D\u003c/text>\u003ccircle cx=\"235.34451235161077\" cy=\"48.23803047407736\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"248.34451235161077\" y=\"44.23803047407736\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">E\u003c/text>\u003c/svg>\u003cfigcaption>AD ∥ EC\u003c/figcaption>\u003c/figure>\u003c/div>\u003c/li>\u003cli>\u003ch4>Деление противоположной стороны\u003c/h4>\u003cp>Из △BAD ∼ △BEC следует BD/BC = AB/BE. При вычитании из 1 остаётся DC/BC = AE/BE. Делим первое равенство на второе и используем AE = AC.\u003c/p>\u003cdiv class=\"theory-cell\">BD/DC = AB/AE = AB/AC\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","tasks":[{"kind":"number","q":"В трапеции ABCD основания AB = 8 см и CD = 20 см. Диагонали пересекаются в O. AC = 21 см, BO = 6 см. Найди сумму длин AO и DO в сантиметрах.","answer":21,"example":["В другой трапеции AB = 6 см, CD = 9 см, AC = 25 см и BO = 8 см. Найдём AO + DO.","Из △AOB ∼ △COD следует AO/OC = BO/DO = 2/3.","На AO приходится 2 из 5 частей AC, поэтому AO = 10 см.","Из BO/DO = 2/3 получаем DO = 8 · 3/2 = 12 см.","AO + DO = 22 см."],"steps":["AB ∥ CD, а углы AOB и COD вертикальные. Получаем △AOB ∼ △COD по двум углам.","AO/OC = BO/DO = AB/CD = 8/20 = 2/5.","Вся диагональ AC – 7 частей. AO = 21 · 2/7 = 6 см.","BO – 2 части своего отношения, DO – 5. DO = 6 · 5/2 = 15 см.","AO + DO = 6 + 15 = 21 см."],"see":"Ищи два треугольника у параллельных оснований.","similar":"Из △AOB ∼ △COD следует AO/OC = BO/DO = 2/3.","algorithm":"Запиши подобие. На AC найди часть от целого, на BD восстанови DO по отношению BO к DO.","retry":"Ищи два треугольника у параллельных оснований.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 420 190\" role=\"img\" aria-label=\"Трапеция ABCD с основаниями AB и CD. Диагонали AC и BD пересекаются в O.\">\u003cpolyline points=\"123.00,27.00 285.00,27.00 375.00,155.00 35.00,155.00 123.00,27.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"123.00,27.00 375.00,155.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"285.00,27.00 35.00,155.00\" fill=\"none\" stroke=\"#2F5BB5\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M135.48,33.34 A14,14 0 0 0 137.00,27.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"1.8\"/>\u003cpath d=\"M362.52,148.66 A14,14 0 0 0 361.00,155.00\ 5) = 36.","Множители 4 и 9 дают 36 и отличаются на 5. Подходит x = 4: при x > 0 произведение x(x + 5) возрастает.","AB = 4 + 9 = 13 см."],"steps":["△AHC ∼ △CHB по двум углам, значит, AH · HB = CH² = 144.","Пусть AH = x, тогда HB = x + 7. Получаем x(x + 7) = 144.","Подходит x = 9: 9 · 16 = 144. При положительных x оба множителя возрастают, поэтому другого положительного решения нет.","AB = 9 + 16 = 25 см."],"see":"CH входит в пропорцию дважды. Вспомни равенство CH² = AH · HB.","similar":"Из △AHC ∼ △CHB следует CH² = AH · HB.","algorithm":"Найди два положительных числа, произведение которых 144, а разность 7.","retry":"CH входит в пропорцию дважды. Вспомни равенство CH² = AH · HB.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 420 210\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC. CH перпендикулярна гипотенузе AB.\">\u003cpolyline points=\"40.00,175.00 157.00,19.00 365.00,175.00 40.00,175.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"157.00,19.00 157.00,175.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"40\" cy=\"175\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"26\" y=\"190\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">A\u003c/text>\u003ccircle cx=\"365\" cy=\"175\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"378\" y=\"190\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">B\u003c/text>\u003ccircle cx=\"157\" cy=\"175\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"157\" y=\"197\" text-anchor=\"middle\" fill=\"#16231A\" stroke=\"#fbf5e7\" stroke-width=\"3\" paint-order=\"stroke fill\" font-size=\"18\" font-weight=\"700\">H\u003c/text>\u003ccircle cx=\"157\" cy=\"19.0\" r=\"3.2\" fill=\"#16231A\"/>\u003ctext x=\"157\" y=\"9.0\ igcaption>\u003c/figure>","unit":""},{"kind":"number","q":"В △ABC биссектриса AD пересекает BC в D. AB = 10 см, AC = 15 см, BC = 20 см. Через C проведена прямая, параллельная AD, до пересечения с продолжением BA в E. Найди сумму длин BD и BE в сантиметрах.","answer":33,"example":["Пусть AB = 6 см, AC = 8 см, BC = 7 см и AD – биссектриса. Через C проведена та же параллель. Найдём BD.","Из параллельности и свойства биссектрисы получаем ∠AEC = ∠ACE, значит, AE = AC = 8 см.","BE = 6 + 8 = 14 см. Из △BAD ∼ △BEC следует BD/BC = AB/BE.","BD = 7 · 6/14 = 3 см."],"steps":["Так как AD ∥ EC, ∠AEC = ∠BAD и ∠ACE = ∠DAC. Биссектриса делит угол A пополам, поэтому ∠AEC = ∠ACE.","△AEC равнобедренный. AE = AC = 15 см.","BE = AB + AE = 10 + 15 = 25 см.","Из △BAD ∼ △BEC следует BD/20 = 10/25. Значит, BD = 8 см.","BD + BE = 8 + 25 = 33 см."],"see":"Сравни углы AEC и ACE с половинами угла BAC.","similar":"Из параллельности и свойства биссектрисы получаем ∠AEC = ∠ACE, значит, AE = AC = 8 см.","algorithm":"Докажи AE = AC, найди BE целиком. Затем вырази BD из подобия △BAD и △BEC.","retry":"Сравни углы AEC и ACE с половинами угла BAC.","visual":"\u003cfigure class=\"triangle-figure\">\u003csvg viewBox=\"0 0 350 385\" role=\"img\" aria-label=\"Треугольник ABC. AD — биссектриса. Через C проведена прямая, параллельная AD. Она пересекает продолжение BA в E.\">\u003cpolyline points=\"114.00,234.00 33.00,358.00 298.00,358.00 114.00,234.00\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"114.00,234.00 139.08,358.00\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"114.00,234.00 235.34,48.24\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpolyline points=\"298.00,358.00 235.34,48.24\" fill=\"none\" stroke=\"#b75024\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M106.34,245.72 A14,14 0 0 0 116.78,247.72\" fill=\"none\" stroke=\"# я сходственных длин и периметров равны k. Отношение площадей равно k².","При DE ∥ BC треугольники ADE и ABC подобны. При составлении пропорции сравнивай отрезок с целой стороной.","В сложных задачах ищи общие, вертикальные и накрест лежащие углы. При необходимости проведи высоту или параллельную прямую."]};
(function(){

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;

     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));

     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }

      const bounds = last.getBoundingClientRect();
      if (bounds.bottom > innerHeight - 72 || bounds.top < 0) {
        last.scrollIntoView({block:'center'});
      }
    });
    restart.addEventListener('click', () => {
      openedSteps.delete(id);
      list.replaceChildren();
      list.hidden = true;
      restart.hidden = true;
      nextButton.disabled = false;
      count.textContent = 'Открыто 0 из ' + steps.length;
      nextButton.focus({preventScroll:true});
      if (nextButton.getBoundingClientRect().top < 0) nextButton.scrollIntoView({block:'center'});
    });
  }
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div><div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.example[0])}</p><div class="example-figure">${mathMarkup(t.exampleVisual)}</div>${stepViewer('example',t.example.slice(1))}</section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${visual(t)}${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary>${stepViewer('solution',t.steps)}</details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();bindStepViewer('example',t.example.slice(1));bindStepViewer('solution',t.steps);
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();openedSteps.clear();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
