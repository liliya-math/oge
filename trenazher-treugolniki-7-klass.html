8\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Для внешнего угла при C дальние углы находятся при A и B.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠A = 38° и ∠B = 65°, то ∠ACD = 38° + 65° = 103°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Внешний угол при C равен ∠A + ∠B.","anchorNote":"Со внутренним углом при C он в сумме даёт 180°.","tasks":[{"kind":"number","q":"Внутренний угол при C равен 65°. Найди внешний угол при C.","answer":115,"before":"Если внутренний угол 82°, смежный внешний равен 180° − 82° = 98°.","unit":"°","see":"Используй сумму смежных углов.","similar":"Если внутренний угол 82°, смежный внешний равен 180° − 82° = 98°.","algorithm":"Внутренний и внешний углы при C смежные.","retry":"Используй сумму смежных углов.","steps":["Внутренний и внешний углы при C смежные.","180° − 65° = 115°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"∠A = 35°, ∠B = 60°. Найди внешний угол при C.","answer":95,"before":"Если дальние углы равны 41° и 52°, внешний угол равен 93°.","unit":"°","see":"Сложи углы при A и B.","similar":"Если дальние углы равны 41° и 52°, внешний угол равен 93°.","algorithm":"Внешний угол при C равен сумме двух дальних углов.","retry":"Сложи углы при A и B.","steps":["Внешний угол при C равен сумме двух дальних углов.","35° + 60° = 95°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Внешний угол при C равен 128°, ∠A = 48°. Найди ∠B.","answer":80,"before":"Если внешний угол при C равен 110°, а ∠B = 60°, то ∠A = 110° − 60° = 50°.","unit":"°","see":"Вынеси из суммы известный угол вычитанием.","similar":"Если внешний угол при C равен 110°, а ∠B = 60°, то ∠A = 110° − 60° = 50°.","algorithm":"128° = ∠A + ∠B.","retry":"Вынеси из суммы известный угол вычитанием.","steps":["128° = ∠A + ∠B.","∠B = 128° − 48° = 80°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Стороны и углы","subtitle":"","title":"Что лежит напротив большей стороны","intro":"\u003csection class=\"theory-topic\">\u003ch3>Соотношение между сторонами и углами\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Соотношение между сторонами и углами\u003c/strong> — правило, по которому напротив большей стороны лежит больший угол, а напротив большего угла лежит большая сторона.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>При сравнении сторон сначала выпиши угол напротив каждой. Сравнивай пары только внутри одного треугольника.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M88.92893230739598 35.441225992316134 A19 19 0 0 0 113.4350288425444 33.435028842544405\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M37.40181878578382 107.30798958824889 A23 23 0 0 1 47.0 126.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M183.0 126.0 A23 23 0 0 1 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Пары для сравнения: ∠A и BC, ∠B и AC, ∠C и AB.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠A = 40°, ∠B = 60°, ∠C = 80°, то BC \u003c AC \u003c AB.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Наибольший угол и наибольшая сторона лежат друг напротив друга.","anchorNote":"В прямоугольном треугольнике гипотенуза длиннее каждого катета.","tasks":[{"kind":"choice","q":"∠A = 49°, ∠B = 56°, ∠C = 75°. Какая сторона наибольшая?","answer":"AB","before":"Если наибольший угол при A, наибольшая сторона BC.","unit":"","see":"Найди сторону без буквы C.","similar":"Если наибольший угол при A, наибольшая сторона BC.","algorithm":"Наибольший угол ∠C.","retry":"Найди сторону без буквы C.","steps":["Наибольший угол ∠C.","Напротив C лежит AB."],"options":["AB","BC","AC"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"AB = 9 см, BC = 6 см, CA = 8 см. Какой угол наименьший?","answer":"∠A","before":"Если AC = 5 см, AB = 8 см, BC = 9 см, наименьший угол ∠B, потому что AC короче всех.","unit":"","see":"Ищи угол напротив стороны длиной 6 см.","similar":"Если AC = 5 см, AB = 8 см, BC = 9 см, наименьший угол ∠B, потому что AC короче всех.","algorithm":"Самая короткая сторона BC.","retry":"Ищи угол напротив стороны длиной 6 см.","steps":["Самая короткая сторона BC.","Напротив BC лежит ∠A."],"options":["∠C","∠B","∠A"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"∠A = 45°, ∠B = 55°. Какая сторона наибольшая?","answer":"AB","before":"Если ∠A = 70°, ∠B = 50°, то ∠C = 60°. Самый большой ∠A, поэтому наибольшая сторона BC.","unit":"","see":"Найди третий угол и только потом сравни.","similar":"Если ∠A = 70°, ∠B = 50°, то ∠C = 60°. Самый большой ∠A, поэтому наибольшая сторона BC.","algorithm":"∠C = 180° − 45° − 55° = 80°.","retry":"Найди третий угол и только потом сравни.","steps":["∠C = 180° − 45° − 55° = 80°.","Наибольший угол при C.","Напротив него лежит AB."],"options":["BC","AB","AC"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Неравенство треугольника","subtitle":"","title":"Какие три отрезка замкнутся","intro":"\u003csection class=\"theory-topic\">\u003ch3>Неравенство треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Неравенство треугольника\u003c/strong> — правило, по которому каждая сторона треугольника меньше суммы двух других.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Достаточно сравнить самую длинную сторону с суммой двух коротких. Если сумма двух коротких равна длинной стороне, отрезки лягут на одну прямую. Если сумма больше, из положительных длин можно построить треугольник.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Путь из B в C через A длиннее прямого отрезка BC.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Стороны 4, 5, 8 см возможны, потому что 4 + 5 > 8. Для 4, 5, 9 см получается равенство, поэтому треугольника нет.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Границы третьей стороны\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Границы третьей стороны\u003c/strong> — строгие границы между разностью известных длин и их суммой.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если известны 5 и 8 см, третья сторона должна быть меньше 13 см. Кроме того, 5 см вместе с третьей стороной должны дать больше 8 см.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Проверяй верхнюю и нижнюю границы.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Для сторон 5, 8 и x получаем 3 \u003c x \u003c 13. Границы 3 и 13 исключаются.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Проверь строгое неравенство: сумма двух коротких больше самой длинной стороны.","anchorNote":"При целых длинах ближайшее допустимое число находится на единицу от границы.","tasks":[{"kind":"choice","q":"Существует ли треугольник со сторонами 4, 7 и 11 см?","answer":"Нет","before":"Стороны 3, 5 и 7 см возможны: 3 + 5 = 8 > 7.","unit":"","see":"Сравни 4 + 7 с 11.","similar":"Стороны 3, 5 и 7 см возможны: 3 + 5 = 8 > 7.","algorithm":"4 + 7 = 11.","retry":"Сравни 4 + 7 с 11.","steps":["4 + 7 = 11.","Отрезки сложатся в прямую, поэтому треугольника нет."],"options":["Да","Нет"]},{"kind":"number","q":"Две стороны равны 7 и 10 см. Какова наименьшая целая длина третьей стороны?","answer":4,"before":"Для 6 и 10 см получаем 4 \u003c x \u003c 16. Наименьшее целое x равно 5.","unit":"см","see":"Нижняя граница равна разности известных длин.","similar":"Для 6 и 10 см получаем 4 \u003c x \u003c 16. Наименьшее целое x равно 5.","algorithm":"10 − 7 \u003c x \u003c 10 + 7.","retry":"Нижняя граница равна разности известных длин.","steps":["10 − 7 \u003c x \u003c 10 + 7.","3 \u003c x \u003c 17.","Первое допустимое целое число равно 4."]},{"kind":"number","q":"Две стороны равны 6 и 9 см. Сколько существует целых значений третьей стороны?","answer":11,"before":"Для 4 и 7 см имеем 3 \u003c x \u003c 11. Подходят целые числа от 4 до 10, всего 7.","unit":"","see":"Исключи обе границы, прежде чем считать числа.","similar":"Для 4 и 7 см имеем 3 \u003c x \u003c 11. Подходят целые числа от 4 до 10, всего 7.","algorithm":"9 − 6 \u003c x \u003c 9 + 6.","retry":"Исключи обе границы, прежде чем считать числа.","steps":["9 − 6 \u003c x \u003c 9 + 6.","3 \u003c x \u003c 15.","Целые числа от 4 до 14 включительно: 14 − 4 + 1 = 11."]}]},{"name":"Прямоугольный треугольник","subtitle":"","title":"Острые углы, катет напротив 30° и признаки равенства","intro":"\u003csection class=\"theory-topic\">\u003ch3>Острые углы прямоугольного треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Острые углы прямоугольного треугольника\u003c/strong> — два угла, сумма которых равна 90°.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>На прямой угол уже ушло 90° из общей суммы 180°.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Катеты AB и BC образуют прямой угол.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если один острый угол 37°, другой равен 90° − 37° = 53°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Катет напротив 30°\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Катет напротив 30°\u003c/strong> — катет, длина которого равна половине гипотенузы.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Достроим треугольник его зеркальной копией по катету, прилежащему к 30°. Получится равносторонний треугольник: угол при вершине станет 60°, а боковые стороны равны. Тогда оба угла при основании равны (180° − 60°) : 2 = 60°. Его основание состоит из двух отрезков длиной с катет напротив 30°. Обратно, если катет равен половине гипотенузы, угол напротив катета равен 30°.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Схема обозначений. Напротив A расположен катет BC.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠A = 30°, ∠B = 90° и AC = 16 см, то BC = 8 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Признаки равенства прямоугольных треугольников\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Признаки равенства прямоугольных треугольников\u003c/strong> — условия, по которым два прямоугольных треугольника имеют одинаковые размеры и форму.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Достаточно равенства двух катетов, катета и соответствующего острого угла, гипотенузы и острого угла или гипотенузы и катета. В последнем случае можно совместить равные катеты и расположить вершины прямых углов в одной точке. Две гипотенузы тогда образуют боковые стороны равнобедренного треугольника, а два оставшихся катета составляют его основание и равны как половины основания.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Сначала найди прямой угол, затем отдели катеты от гипотенузы.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">У двух прямоугольных треугольников гипотенузы по 15 см и по одному катету длиной 9 см. Треугольники равны по гипотенузе и катету.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"В прямоугольном треугольнике острые углы дополняют друг друга до 90°.","anchorNote":"Для правила 30° бери катет напротив угла.","tasks":[{"kind":"number","q":"Острый угол прямоугольного треугольника равен 26°. Найди второй острый угол.","answer":64,"before":"Если один острый угол 54°, второй равен 90° − 54° = 36°.","unit":"°","see":"Из общей суммы 180° уже вычтено 90° на прямой угол.","similar":"Если один острый угол 54°, второй равен 90° − 54° = 36°.","algorithm":"Сумма острых углов равна 90°.","retry":"Из общей суммы 180° уже вычтено 90° на прямой угол.","steps":["Сумма острых углов равна 90°.","90° − 26° = 64°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"∠B = 90°, ∠A = 30°, AC = 18 см. Найди BC.","answer":9,"before":"При ∠A = 30°, ∠B = 90° и AC = 10 см катет BC равен 10 : 2 = 5 см.","unit":"см","see":"BC находится напротив угла 30°.","similar":"При ∠A = 30°, ∠B = 90° и AC = 10 см катет BC равен 10 : 2 = 5 см.","algorithm":"AC — гипотенуза, BC — катет напротив ∠A.","retry":"BC находится напротив угла 30°.","steps":["AC — гипотенуза, BC — катет напротив ∠A.","BC = 18 : 2 = 9 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"У двух прямоугольных треугольников равны гипотенузы и по одному катету. Какой признак применить?","answer":"По гипотенузе и катету","before":"Если соответствующие катеты двух прямоугольных треугольников равны 3 и 4 см, работает признак по двум катетам.","unit":"","see":"Прямой угол уже есть в обоих треугольниках.","similar":"Если соответствующие катеты двух прямоугольных треугольников равны 3 и 4 см, работает признак по двум катетам.","algorithm":"Сопоставь два данных элемента: гипотенузу и катет.","retry":"Прямой угол уже есть в обоих треугольниках.","steps":["Сопоставь два данных элемента: гипотенузу и катет.","Их равенства достаточно по специальному признаку."],"options":["По гипотенузе и катету","По двум катетам","По гипотенузе и острому углу"]},{"kind":"number","q":"∠B = 90°, AC = 24 см, AB = 12 см. Найди угол C.","answer":30,"before":"Если гипотенуза 14 см, а катет 7 см, угол напротив этого катета равен 30°.","unit":"°","see":"Сравни длину AB с половиной AC.","similar":"Если гипотенуза 14 см, а катет 7 см, угол напротив этого катета равен 30°.","algorithm":"AB = 24 : 2, то есть катет равен половине гипотенузы.","retry":"Сравни длину AB с половиной AC.","steps":["AB = 24 : 2, то есть катет равен половине гипотенузы.","Напротив AB находится ∠C, поэтому ∠C = 30°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Построения циркулем","subtitle":"","title":"Как получить треугольник из заданных элементов","intro":"\u003csection class=\"theory-topic\">\u003ch3>Геометрическое построение\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Геометрическое построение\u003c/strong> — получение фигуры по заданным условиям при помощи циркуля и линейки без делений.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>По трём сторонам начерти BC. Из B проведи дугу радиуса AB, из C — дугу радиуса AC. Их пересечение даст A. При построении по двум сторонам и углу между ними сначала построй угол, затем отложи на лучах длины. По стороне и двум прилежащим углам сначала построй сторону, затем лучи из её концов, направленные в одну полуплоскость.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Две дуги из B и C пересекаются в A\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M35 118 L177 118\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M100 33 L35 118\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"5 4\"/>\u003cpath d=\"M100 33 L177 118\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"5 4\"/>\u003cpath d=\"M77 20 A107.0 107.0 0 0 1 100 33 A107.0 107.0 0 0 1 123 57 M80 56 A114.7 114.7 0 0 1 100 33 A114.7 114.7 0 0 1 124 16\" fill=\"none\" stroke=\"#a94b21\" stroke-width=\"2.2\"/>\u003ctext x=\"99\" y=\"19\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"33\" y=\"137\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"181\" y=\"137\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Вершина A принадлежит обеим дугам.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Для AB = 5 см, BC = 7 см, AC = 6 см возьми основание BC длиной 7 см. Дуги с центрами B и C имеют радиусы 5 и 6 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Серединный перпендикуляр\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Серединный перпендикуляр\u003c/strong> — прямая, проходящая через середину отрезка перпендикулярно ему.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Из концов отрезка проведи окружности одинакового радиуса больше половины длины отрезка. Соедини две точки пересечения окружностей. Любая точка на полученной прямой равноудалена от концов отрезка.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115.0 16 L115.0 146\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M115.0 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Синяя прямая проходит через середину BC под углом 90°.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если K лежит на серединном перпендикуляре к BC и KB = 6 см, то KC = 6 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Радиус дуги задаёт расстояние от её центра до искомой вершины.","anchorNote":"При построении по трём сторонам проверь неравенство треугольника.","tasks":[{"kind":"number","q":"BC = 8 см, AB = 6 см, AC = 7 см. Какой радиус у дуги с центром C?","answer":7,"before":"Если нужно, чтобы K находилась в 4 см от M, проводим дугу с центром M и радиусом 4 см.","unit":"см","see":"Радиус равен расстоянию от C до A.","similar":"Если нужно, чтобы K находилась в 4 см от M, проводим дугу с центром M и радиусом 4 см.","algorithm":"Точка A должна лежать на дуге из C.","retry":"Радиус равен расстоянию от C до A.","steps":["Точка A должна лежать на дуге из C.","AC = 7 см, значит, радиус равен 7 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"Что строят первым, если даны две стороны и угол между ними?","answer":"Угол между сторонами","before":"Если известны 5 см, 9 см и угол между ними 45°, сначала переносим угол 45°, потом откладываем стороны по его лучам.","unit":"","see":"У этого угла общая вершина обеих данных сторон.","similar":"Если известны 5 см, 9 см и угол между ними 45°, сначала переносим угол 45°, потом откладываем стороны по его лучам.","algorithm":"Построй заданный угол.","retry":"У этого угла общая вершина обеих данных сторон.","steps":["Построй заданный угол.","На его лучах отложи две данные длины и соедини найденные точки."],"options":["Середину стороны","Угол между сторонами","Серединный перпендикуляр"]},{"kind":"number","q":"K лежит на серединном перпендикуляре к BC. KB = 9 см. Найди KC.","answer":9,"before":"Если точка равноудалена от концов AB и находится в 7 см от A, она находится в 7 см и от B.","unit":"см","see":"На серединном перпендикуляре расстояния до концов равны.","similar":"Если точка равноудалена от концов AB и находится в 7 см от A, она находится в 7 см и от B.","algorithm":"KB = KC по свойству серединного перпендикуляра.","retry":"На серединном перпендикуляре расстояния до концов равны.","steps":["KB = KC по свойству серединного перпендикуляра.","Значит, KC = 9 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115.0 16 L115.0 146\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M115.0 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Задачи на доказательство","subtitle":"","title":"Как обосновать каждый переход","intro":"\u003csection class=\"theory-topic\">\u003ch3>Доказательство\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Доказательство\u003c/strong> — цепочка утверждений, каждое из которых следует из условия, определения, известного свойства или предыдущего шага.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Сначала выпиши, что дано и что нужно доказать. Если фигуры имеют общую сторону, запиши её равенство самой себе. Если две прямые пересекаются, проверь вертикальные углы. После признака равенства назови нужные соответствующие элементы.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">AC — общая сторона, стороны двух треугольников попарно равны.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Дано: AB = AD, BC = DC. Доказать: ∠BAC = ∠DAC. В △ABC и △ADC: AB = AD, BC = DC по условию, AC — общая. Треугольники равны по третьему признаку. Соответствующие углы при A равны.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Дано → равные элементы → признак → нужное следствие.","anchorNote":"Отметку можно использовать, если её даёт условие или предыдущий шаг.","tasks":[{"kind":"choice","q":"AB = AD, BC = DC. Какой факт добавит третью пару сторон △ABC и △ADC?","answer":"AC — общая сторона","before":"Если △KLM и △KNM имеют общую сторону KM, записываем KM = KM.","unit":"","see":"Какой отрезок входит в записи обоих треугольников?","similar":"Если △KLM и △KNM имеют общую сторону KM, записываем KM = KM.","algorithm":"△ABC содержит AC.","retry":"Какой отрезок входит в записи обоих треугольников?","steps":["△ABC содержит AC.","△ADC тоже содержит AC.","AC — общая сторона."],"options":["AC — общая сторона","∠B = ∠D по рисунку","AC ⟂ BD по рисунку"]},{"kind":"choice","q":"Точка O — точка пересечения AC и BD, AO = OC и BO = OD. Как обосновать равенство ∠AOB и ∠COD?","answer":"Это вертикальные углы","before":"У пересекающихся прямых углы, лежащие напротив друг друга, равны. Например, ∠BOC = ∠DOA.","unit":"","see":"Лучи OA и OC противоположные, как и OB и OD.","similar":"У пересекающихся прямых углы, лежащие напротив друг друга, равны. Например, ∠BOC = ∠DOA.","algorithm":"AC и BD пересекаются в O.","retry":"Лучи OA и OC противоположные, как и OB и OD.","steps":["AC и BD пересекаются в O.","Углы AOB и COD лежат друг напротив друга.","Вертикальные углы равны."],"options":["Это смежные углы","Это вертикальные углы","Это углы при основании"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Две пересекающиеся прямые, O — точка пересечения\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M42 29 L193 123\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M44 123 L191 29\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M42 29 L44 123\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M191 29 L193 123\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"34\" y=\"25\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"34\" y=\"139\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"203\" y=\"139\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003ctext x=\"199\" y=\"25\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"118\" y=\"102\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">O\u003c/text>\u003cpath d=\"M101.37005446293348 65.95884185109766 A19 19 0 0 0 101.49288936948972 86.2358394508025\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M133.62994553706653 86.04115814890234 A19 19 0 0 0 133.50711063051028 65.7641605491975\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003c/svg>\u003c/div>"},{"kind":"number","q":"AO = CO, BO = DO, O — точка пересечения AC и BD. AB = 12 см. Найди CD.","answer":12,"before":"Если EO = GO и FO = HO, а углы EOF и GOH вертикальные, то △EOF = △GOH по первому признаку и EF = GH.","unit":"см","see":"Найди две пары сторон и угол между ними.","similar":"Если EO = GO и FO = HO, а углы EOF и GOH вертикальные, то △EOF = △GOH по первому признаку и EF = GH.","algorithm":"AO = CO, BO = DO по условию.","retry":"Найди две пары сторон и угол между ними.","steps":["AO = CO, BO = DO по условию.","∠AOB = ∠COD как вертикальные.","△AOB = △COD по первому признаку.","AB соответствует CD, значит, CD = 12 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Две пересекающиеся прямые, O — точка пересечения\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M42 29 L193 123\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M44 123 L191 29\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M42 29 L44 123\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M191 29 L193 123\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"34\" y=\"25\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"34\" y=\"139\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"203\" y=\"139\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003ctext x=\"199\" y=\"25\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"118\" y=\"102\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">O\u003c/text>\u003cpath d=\"M101.37005446293348 65.95884185109766 A19 19 0 0 0 101.49288936948972 86.2358394508025\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M133.62994553706653 86.04115814890234 A19 19 0 0 0 133.50711063051028 65.7641605491975\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003c/svg>\u003c/div>"}]},{"name":"Площадь и средняя линия","subtitle":"","title":"Два дополнительных сюжета","intro":"\u003csection class=\"theory-topic\">\u003ch3>Площадь треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Площадь треугольника\u003c/strong> — величина, равная половине произведения стороны на проведённую к ней высоту.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если взять две одинаковые копии треугольника, из них можно составить параллелограмм с той же высотой и основанием. Площадь одного треугольника вдвое меньше. В прямоугольном треугольнике удобнее взять за основание один катет, за высоту второй.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L100 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"93\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">h\u003c/text>\u003ctext x=\"124.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">a\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Буквой h обозначена высота к основанию a.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если основание a = 10 см, высота h = 6 см, то S = (10 · 6) : 2 = 30 см².\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Средняя линия треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Средняя линия треугольника\u003c/strong> — отрезок, соединяющий середины двух сторон треугольника.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Средняя линия параллельна третьей стороне и равна её половине. Её концы находятся на двух разных сторонах.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M62.0 73.0 L153.0 73.0\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"52.0\" y=\"77.0\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"164.0\" y=\"77.0\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">N\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Синий отрезок соединяет середины AB и AC.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если M — середина AB, N — середина AC, BC = 18 см, то MN ∥ BC и MN = 18 : 2 = 9 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Для площади бери основание и высоту к нему.","anchorNote":"Для средней линии сравнивай её с третьей стороной.","tasks":[{"kind":"number","q":"Сторона равна 12 см, высота к ней равна 7 см. Найди площадь.","answer":42,"before":"При основании 8 см и высоте 5 см площадь равна (8 · 5) : 2 = 20 см².","unit":"см²","see":"Умножь основание на высоту и раздели на 2.","similar":"При основании 8 см и высоте 5 см площадь равна (8 · 5) : 2 = 20 см².","algorithm":"12 · 7 = 84.","retry":"Умножь основание на высоту и раздели на 2.","steps":["12 · 7 = 84.","84 : 2 = 42 см²."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L100 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"93\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">h\u003c/text>\u003ctext x=\"124.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">a\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Площадь равна 40 см². Высота к основанию равна 8 см. Найди основание.","answer":10,"before":"Для площади 24 см² и высоты 6 см получаем основание (2 · 24) : 6 = 8 см.","unit":"см","see":"Удвоенная площадь равна произведению основания на высоту.","similar":"Для площади 24 см² и высоты 6 см получаем основание (2 · 24) : 6 = 8 см.","algorithm":"2 · 40 = 80.","retry":"Удвоенная площадь равна произведению основания на высоту.","steps":["2 · 40 = 80.","80 : 8 = 10 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L100 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"93\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">h\u003c/text>\u003ctext x=\"124.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">a\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Средняя линия равна 7 см. Найди сторону, которой она параллельна.","answer":14,"before":"Если средняя линия равна 6 см, третья сторона вдвое длиннее: 2 · 6 = 12 см.","unit":"см","see":"Средняя линия равна половине третьей стороны.","similar":"Если средняя линия равна 6 см, третья сторона вдвое длиннее: 2 · 6 = 12 см.","algorithm":"Умножь длину средней линии на 2.","retry":"Средняя линия равна половине третьей стороны.","steps":["Умножь длину средней линии на 2.","7 · 2 = 14 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M62.0 73.0 L153.0 73.0\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"52.0\" y=\"77.0\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"164.0\" y=\"77.0\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">N\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Итоговые задачи","subtitle":"","title":"Как соединить несколько правил в одном решении","intro":"\u003csection class=\"theory-topic\">\u003ch3>Многошаговая задача\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Многошаговая задача\u003c/strong> — задача, в которой один найденный результат нужен для следующего действия.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Выдели цель. Двигайся от данных по одному шагу: сначала восстанови равные углы или стороны, затем используй сумму углов, внешний угол, периметр или равенство треугольников.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">В равнобедренном треугольнике сначала отметь равные углы при основании.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">AB = AC, внешний угол при B равен 125°. Тогда ∠B = 55° как смежный, ∠C = 55° как угол при основании, ∠A = 180° − 110° = 70°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Записывай причину рядом с каждым новым равенством.","anchorNote":"После вычислений проверь, что полученные длины и углы согласуются с условием.","tasks":[{"kind":"number","q":"AB = AC. Внешний угол при C равен 118°. Найди ∠A.","answer":56,"before":"Если внешний угол при основании равен 130°, внутренние углы при основании по 50°, угол при вершине равен 80°.","unit":"°","see":"Сначала найди внутренний угол при C.","similar":"Если внешний угол при основании равен 130°, внутренние углы при основании по 50°, угол при вершине равен 80°.","algorithm":"∠C = 180° − 118° = 62°.","retry":"Сначала найди внутренний угол при C.","steps":["∠C = 180° − 118° = 62°.","∠B = 62° как угол при основании.","∠A = 180° − 62° − 62° = 56°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 191.01824477234774 108.54872467987758\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Стороны равнобедренного треугольника относятся как 3 : 3 : 4. Периметр 45 см. Найди основание.","answer":18,"before":"При отношении 2 : 2 : 3 и периметре 35 см одна часть равна 5 см. Основание занимает 3 части, это 15 см.","unit":"см","see":"Две одинаковые доли относятся к боковым сторонам.","similar":"При отношении 2 : 2 : 3 и периметре 35 см одна часть равна 5 см. Основание занимает 3 части, это 15 см.","algorithm":"3 + 3 + 4 = 10 частей.","retry":"Две одинаковые доли относятся к боковым сторонам.","steps":["3 + 3 + 4 = 10 частей.","45 : 10 = 4,5 см на одну часть.","Основание равно 4 · 4,5 = 18 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"AB = AC, AM — медиана к BC, AB = 14 см, ∠BAM = 60°. Найди AM.","answer":7,"before":"Если AB = AC, AM — медиана, AB = 12 см и ∠BAM = 60°, то △ABM прямоугольный, ∠ABM = 30°, а AM = 6 см.","unit":"см","see":"Из медианы к основанию получи прямоугольный треугольник.","similar":"Если AB = AC, AM — медиана, AB = 12 см и ∠BAM = 60°, то △ABM прямоугольный, ∠ABM = 30°, а AM = 6 см.","algorithm":"AM — высота, поэтому ∠AMB = 90°.","retry":"Из медианы к основанию получи прямоугольный треугольник.","steps":["AM — высота, поэтому ∠AMB = 90°.","∠ABM = 90° − 60° = 30°.","AM — катет напротив 30°, AB — гипотенуза.","AM = 14 : 2 = 7 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font- \">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Стороны равнобедренного треугольника равны 6 см и 13 см. Найди периметр.","answer":32,"before":"При известных длинах 4 и 9 см проверь две возможные пары боковых сторон. Длины 4, 4, 9 не подходят, поэтому периметр равен 4 + 9 + 9 = 22 см.","unit":"см","see":"Проверь обе возможности для равных сторон.","similar":"При известных длинах 4 и 9 см проверь две возможные пары боковых сторон. Длины 4, 4, 9 не подходят, поэтому периметр равен 4 + 9 + 9 = 22 см.","algorithm":"Если боковые стороны по 6 см, то 6 + 6 \u003c 13. Такой треугольник невозможен.","retry":"Проверь обе возможности для равных сторон.","steps":["Если боковые стороны по 6 см, то 6 + 6 \u003c 13. Такой треугольник невозможен.","Если боковые стороны по 13 см, неравенство треугольника выполняется.","P = 13 + 13 + 6 = 32 см."]}]}],"recap":["Читайте угол по средней букве. Сторона напротив угла соединяет две оставшиеся вершины.","Периметр равен сумме сторон. Сумма внутренних углов треугольника равна 180°.","Медиана делит сторону пополам, биссектриса делит угол пополам, высота перпендикулярна прямой противоположной стороны.","Первый признак равенства: две стороны и угол между ними. Второй: сторона и два прилежащих угла. Третий: три стороны.","У равнобедренного треугольника углы при основании равны. Медиана, биссектриса и высота из вершины между боковыми сторонами совпадают.","Внешний угол равен сумме внутренних углов, не смежных с ним.","Напротив большей стороны лежит больший угол. Сумма двух коротких сторон строго больше самой длинной.","В прямоугольном треугольнике сумма острых углов равна 90°, а катет напротив 30° равен половине гипотенузы.","Площадь: произведение основания и высоты делят на 2. Средняя линия параллельна третьей стороне и равна её половине."],"lab":{"title":"Как выглядят высоты","intro":"Переключай виды треугольника и следи, куда попадает основание высоты из A.","cases":[{"label":"Остроугольный","html":"\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L100 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M100 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"100\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">H\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">H находится между B и C.\u003c/figcaption>\u003c/figure>"},{"label":"Прямоугольный","html":"\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 22 L32 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Высота из A к BC совпадает с катетом AB. Её основание B.\u003c/figcaption>\u003c/figure>"},{"label":"Тупоугольный","html":"\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M45 30 L74 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M45 126 L74 126\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"4 4\"/>\u003cpath d=\"M45 30 L45 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M45 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"45\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">H\u003c/text>\u003ctext x=\"45\" y=\"23\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"67\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">H находится на продолжении BC за B.\u003c/figcaption>\u003c/figure>"}]}};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();

  <script>(function(){
  'use strict';
  const C=window.TrainerCourse,KEY='lili-trainer-'+C.id+'-'+(C.version||1)+(window.LiliStudy?.suffix||''),TOTAL=C.total;

  const blank=()=>({stage:0,task:0,solved:[],attempts:{},answers:{}});

  function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!Number.isInteger(s.stage)||s.stage<0||s.stage>=C.stages.length)return blank();return {stage:s.stage,task:Number.isInteger(s.task)&&s.task>=0&&s.task<C.stages[s.stage].tasks.length?s.task:0,solved:Array.isArray(s.solved)?s.solved.filter(k=>validKey(k)):[],attempts:s.attempts&&typeof s.attempts==='object'?s.attempts:{},answers:s.answers&&typeof s.answers==='object'?s.answers:{}};}catch(e){storageOK=false;return blank();}}
  function validKey(k){if(typeof k!=='string')return false;const a=k.split('-').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&C.stages[a[0]]&&C.stages[a[0]].tasks[a[1]];}
  let state=readState();state.solved=[...new Set(state.solved)];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const number = /\d+(?:[.,]\d+)?/.source;
  const coefficient = `(?:${number}(?:\\s*/\\s*[−-]?${number})?)`;
  const scalar = `[+−-]?(?:${coefficient}(?:[xykb]|kx)?|kx|[xykb])`;
  const term = `(?:\\(${scalar}\\)|${scalar})`;
  const point = `\\(\\s*[−-]?${number}\\s*;\\s*[−-]?${number}\\s*\\)`;
  const expression = new RegExp(`(?<![A-Za-z0-9])(?:${point}|${term}(?:\\s*[=<>≤≥+−·×:/÷*-]\\s*${term})+)(?![A-Za-z0-9])`,'g');
  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>
    [...token].map(letter => `<span class="math-var-${letter}">${letter}</span>`).join(''));
  function plainMath(value) {
    const text = String(value);
    let result = '', end = 0;
    for (const match of text.matchAll(expression)) {
      result += colorVariables(text.slice(end,match.index));
      result += `<span class="math-nowrap">${colorVariables(match[0])}</span>`;
      end = match.index + match[0].length;
    }
    return result + colorVariables(text.slice(end));
  }
  const fractionSymbols={ '¼':[1,4],'½':[1,2],'¾':[3,4],'⅐':[1,7],'⅑':[1,9],'⅒':[1,10],
    '⅓':[1,3],'⅔':[2,3],'⅕':[1,5],'⅖':[2,5],'⅗':[3,5],'⅘':[4,5],'⅙':[1,6],'⅚':[5,6],
    '⅛':[1,8],'⅜':[3,8],'⅝':[5,8],'⅞':[7,8],'↉':[0,3] };
  const fractionAtom=String.raw`(?:\([^()\n]+\)|[−-]?(?:\d+(?:[.,]\d+)?[a-zA-Zа-яА-ЯёЁ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*|[a-zA-Zа-яА-ЯёЁ][a-zA-Zа-яА-ЯёЁ\d⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*))`;
  const fractionPattern=new RegExp(`([${Object.keys(fractionSymbols).join('')}])|(${fractionAtom})\\s*[/⁄∕]\\s*(${fractionAtom})`,'g');
  function fractionMarkup(top,bottom,format){
    const unpack=text=>String(text).replace(/^\((.*)\)$/,'$1');
    const numerator=unpack(top),denominator=unpack(bottom);
    return `<span class="math-fraction" role="math" aria-label="Дробь: числитель ${esc(numerator)}, знаменатель ${esc(denominator)}"><span aria-hidden="true">${format(numerator)}</span><span aria-hidden="true">${format(denominator)}</span></span>`;
  }
  function formatFractions(value,format,formatPart=format){
    const text=String(value);
    let result='',end=0;
    for(const match of text.matchAll(fractionPattern)){
      const parts=match[1]?fractionSymbols[match[1]]:[match[2],match[3]];
      result+=format(text.slice(end,match.index))+fractionMarkup(...parts,formatPart);
      end=match.index+match[0].length;
    }
    return result+format(text.slice(end));
  }
  function mathText(value){return formatFractions(value,plainMath);}
  function mathMarkup(markup){

      .map((piece,i)=>i%2?piece:formatFractions(piece,text=>text,plainMath)).join('');
  }
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
