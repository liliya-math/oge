/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}

  <script>
window.TrainerData={"id":"triangles-grade-7","version":1,"title":"Треугольники · 7 класс · lili.math","heading":"Треугольники","subtitle":"От чтения чертежа до вычислений, построений и доказательств.","grade":"7 класс","description":"Интерактивный тренажёр по геометрии. Теория, чертежи, разобранные примеры, практика и итоговые задачи.","stages":[{"name":"Вершины, стороны и углы","subtitle":"","title":"Как читать рисунок","intro":"\u003csection class=\"theory-topic\">\u003ch3>Треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Треугольник\u003c/strong> — фигура, образованная тремя отрезками, соединяющими попарно три точки, которые не лежат на одной прямой.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Буквы у уголков называют вершины. Отрезки между ними называют стороны.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">△ABC\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">У △ABC вершины A, B, C. Стороны AB, BC, CA. Большой буквой Δ или знаком △ обозначают треугольник.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Угол треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Угол треугольника\u003c/strong> — угол между двумя сторонами треугольника, выходящими из одной вершины.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>В записи ∠ABC средняя буква B показывает вершину. Сторона напротив B соединяет две оставшиеся вершины.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L206 126\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Терракотовым выделена сторона AC, лежащая напротив B.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">∠ABC образован сторонами BA и BC. Напротив него лежит AC.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Средняя буква в записи угла указывает на его вершину.","anchorNote":"Сторона напротив вершины с ней не соединяется.","tasks":[{"kind":"choice","q":"Какая вершина у ∠BCA?","answer":"C","before":"В ∠ABC средняя буква B, значит, вершина B.","unit":"","see":"Прочитай среднюю букву.","similar":"В ∠ABC средняя буква B, значит, вершина B.","algorithm":"Найди среднюю букву в записи BCA.","retry":"Прочитай среднюю букву.","steps":["Найди среднюю букву в записи BCA.","Средняя буква C, поэтому вершина угла C."],"options":["A","C","B"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"Какая сторона лежит напротив ∠A?","answer":"BC","before":"Напротив ∠B лежит AC: эта сторона соединяет A и C.","unit":"","see":"Ищи сторону, которая не содержит A.","similar":"Напротив ∠B лежит AC: эта сторона соединяет A и C.","algorithm":"Из A выходят AB и AC.","retry":"Ищи сторону, которая не содержит A.","steps":["Из A выходят AB и AC.","Остаётся сторона BC."],"options":["AB","AC","BC"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"Какой угол образуют AB и AC?","answer":"∠BAC","before":"У AB и BC общая вершина B, поэтому угол можно записать ∠ABC.","unit":"","see":"Найди общую букву у двух сторон.","similar":"У AB и BC общая вершина B, поэтому угол можно записать ∠ABC.","algorithm":"Обе стороны содержат A.","retry":"Найди общую букву у двух сторон.","steps":["Обе стороны содержат A.","Поставь A в середину и получишь ∠BAC."],"options":["∠BCA","∠BAC","∠ABC"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Виды треугольников","subtitle":"","title":"Как определить вид по сторонам и углам","intro":"\u003csection class=\"theory-topic\">\u003ch3>Равнобедренный треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равнобедренный треугольник\u003c/strong> — треугольник с двумя равными сторонами.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Равные стороны называют боковыми, третью сторону называют основанием. У треугольника со всеми равными сторонами можно выбрать основанием любую сторону.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Одинаковыми засечками отмечены равные стороны.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">AB = AC = 6 см, BC = 8 см. Основание BC.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Равносторонний треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равносторонний треугольник\u003c/strong> — треугольник, у которого все три стороны равны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если все длины различны, треугольник разносторонний.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 22.076951545867374 L55 126 L175 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M80.6698729810778 71.53847577293368 L89.3301270189222 76.53847577293368\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M140.66987298107782 76.53847577293368 L149.33012701892218 71.53847577293368\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M115.0 131.0 L115.0 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"15.076951545867374\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"48\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"180\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Три одинаковые отметки показывают равенство трёх сторон.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">5 см, 5 см, 5 см — равносторонний. 4 см, 5 см, 6 см — разносторонний.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Прямоугольный треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Прямоугольный треугольник\u003c/strong> — треугольник с прямым углом.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Стороны, образующие прямой угол, называют катетами. Сторону напротив него называют гипотенузой.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Квадратик у B обозначает угол 90°.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠B = 90°, то AB и BC — катеты, AC — гипотенуза.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Остроугольный и тупоугольный треугольники\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Остроугольный и тупоугольный треугольники\u003c/strong> — треугольники, у которых все три угла меньше 90° или один угол больше 90° соответственно.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Для определения вида по углам достаточно посмотреть на самый большой угол.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M45 30 L74 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"45\" y=\"23\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"67\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Угол B на этом рисунке тупой.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если наибольший угол 80°, треугольник остроугольный. Если он 110°, треугольник тупоугольный.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Вид по сторонам и вид по углам определяют отдельно.","anchorNote":"Равнобедренный треугольник может быть прямоугольным.","tasks":[{"kind":"choice","q":"Как называется треугольник со сторонами 6, 6 и 9 см?","answer":"Равнобедренный","before":"У треугольника со сторонами 7, 7 и 10 см две равные стороны, поэтому он равнобедренный.","unit":"","see":"Сравни три длины.","similar":"У треугольника со сторонами 7, 7 и 10 см две равные стороны, поэтому он равнобедренный.","algorithm":"Равны две стороны по 6 см.","retry":"Сравни три длины.","steps":["Равны две стороны по 6 см.","Треугольник равнобедренный."],"options":["Разносторонний","Равнобедренный","Равносторонний"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"Как называется треугольник с углами 30°, 40° и 110°?","answer":"Тупоугольный","before":"Среди углов 20°, 60°, 100° есть угол больше 90°. Такой треугольник тупоугольный.","unit":"","see":"Сравни самый большой угол с 90°.","similar":"Среди углов 20°, 60°, 100° есть угол больше 90°. Такой треугольник тупоугольный.","algorithm":"Наибольший угол равен 110°.","retry":"Сравни самый большой угол с 90°.","steps":["Наибольший угол равен 110°.","110° > 90°, поэтому треугольник тупоугольный."],"options":["Тупоугольный","Прямоугольный","Остроугольный"]},{"kind":"choice","q":"Как называется сторона AC, если ∠B = 90°?","answer":"Гипотенуза","before":"В △ABC с прямым углом при A гипотенуза — BC, потому что она лежит напротив A.","unit":"","see":"Найди сторону напротив прямого угла.","similar":"В △ABC с прямым углом при A гипотенуза — BC, потому что она лежит напротив A.","algorithm":"Прямой угол находится при B.","retry":"Найди сторону напротив прямого угла.","steps":["Прямой угол находится при B.","Напротив B лежит AC, это гипотенуза."],"options":["Катет","Гипотенуза"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Периметр","subtitle":"","title":"Как сложить длины и найти неизвестную сторону","intro":"\u003csection class=\"theory-topic\">\u003ch3>Периметр треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Периметр треугольника\u003c/strong> — сумма длин трёх его сторон.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Представь, что обходишь контур. Нужно учесть каждый из трёх отрезков один раз.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Контур образуют AB, BC и CA.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если AB = 4 см, BC = 8 см и AC = 7 см, то P = 4 + 8 + 7 = 19 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"P = AB + BC + CA.","anchorNote":"Если известен P, вычти из него длины известных сторон.","tasks":[{"kind":"number","q":"Стороны равны 5, 7 и 8 см. Найди периметр.","answer":20,"before":"Для сторон 4, 6 и 7 см получаем P = 4 + 6 + 7 = 17 см.","unit":"см","see":"Сложи три длины.","similar":"Для сторон 4, 6 и 7 см получаем P = 4 + 6 + 7 = 17 см.","algorithm":"Запиши сумму всех сторон.","retry":"Сложи три длины.","steps":["Запиши сумму всех сторон.","5 + 7 + 8 = 20 см."]},{"kind":"number","q":"P = 26 см, AB = 8 см, AC = 10 см. Найди BC.","answer":8,"before":"Если P = 23 см, а две стороны 7 и 9 см, третья равна 23 − (7 + 9) = 7 см.","unit":"см","see":"Вычти из периметра сумму известных длин.","similar":"Если P = 23 см, а две стороны 7 и 9 см, третья равна 23 − (7 + 9) = 7 см.","algorithm":"AB + AC = 8 + 10 = 18 см.","retry":"Вычти из периметра сумму известных длин.","steps":["AB + AC = 8 + 10 = 18 см.","BC = 26 − 18 = 8 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Основание равнобедренного треугольника 8 см, P = 28 см. Найди боковую сторону.","answer":10,"before":"При P = 23 см и основании 7 см две равные стороны вместе дают 16 см. Каждая равна 16 : 2 = 8 см.","unit":"см","see":"Сначала найди сумму двух боковых сторон.","similar":"При P = 23 см и основании 7 см две равные стороны вместе дают 16 см. Каждая равна 16 : 2 = 8 см.","algorithm":"28 − 8 = 20 см приходится на обе боковые стороны.","retry":"Сначала найди сумму двух боковых сторон.","steps":["28 − 8 = 20 см приходится на обе боковые стороны.","20 : 2 = 10 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Медиана, биссектриса, высота","subtitle":"","title":"Как различать три отрезка на чертеже","intro":"\u003csection class=\"theory-topic\">\u003ch3>Медиана треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Медиана треугольника\u003c/strong> — отрезок, соединяющий вершину с серединой противоположной стороны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Медиана делит сторону пополам. Равные отрезки отмечают засечками.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">M — середина BC.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если AM — медиана и BC = 14 см, то BM = MC = 7 см.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Биссектриса треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Биссектриса треугольника\u003c/strong> — отрезок биссектрисы его угла от вершины до противоположной стороны.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Биссектриса делит угол пополам. Равные углы отмечают одинаковыми дугами.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L108.67771403621119 125.99999999999999\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M86.59818121421618 38.69201041175111 A23 23 0 0 0 101.87662223478056 42.923313220124335\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M101.87662223478056 42.923313220124335 A23 23 0 0 0 116.2634559672906 36.2634559672906\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"108.67771403621119\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Дуги при A показывают две равные части угла.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если AD — биссектриса и ∠BAC = 70°, то ∠BAD = ∠DAC = 35°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Высота треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Высота треугольника\u003c/strong> — перпендикуляр, проведённый из вершины к прямой, содержащей противоположную сторону.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Ищи угол 90°. У тупоугольного треугольника основание высоты может оказаться за пределами стороны. У прямоугольного два катета уже являются высотами.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L100 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M100 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"100\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">H\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M45 30 L74 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M45 126 L74 126\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"4 4\"/>\u003cpath d=\"M45 30 L45 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M45 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"45\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">H\u003c/text>\u003ctext x=\"45\" y=\"23\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"67\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M32 22 L32 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M32 22 L32 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M32 114 h12 v12\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"32\" y=\"15\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"25\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Основание высоты может лежать внутри стороны, на продолжении или в вершине треугольника.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если AH — высота к BC, то AH ⟂ BC. Высоты из A на трёх схемах показаны синим.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Медиана делит сторону, биссектриса делит угол, высота образует прямой угол.","anchorNote":"Из каждой вершины можно провести по одному отрезку каждого вида.","tasks":[{"kind":"number","q":"AM — медиана, BC = 18 см. Найди MC.","answer":9,"before":"Если BC = 12 см и AM — медиана, то BM = MC = 12 : 2 = 6 см.","unit":"см","see":"Раздели длину всей стороны пополам.","similar":"Если BC = 12 см и AM — медиана, то BM = MC = 12 : 2 = 6 см.","algorithm":"M — середина BC, значит, BM = MC.","retry":"Раздели длину всей стороны пополам.","steps":["M — середина BC, значит, BM = MC.","MC = 18 : 2 = 9 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"AD — биссектриса ∠BAC, ∠BAD = 28°. Найди ∠BAC.","answer":56,"before":"Если биссектриса делит угол на две части по 34°, весь угол равен 68°.","unit":"°","see":"Весь угол состоит из двух одинаковых частей.","similar":"Если биссектриса делит угол на две части по 34°, весь угол равен 68°.","algorithm":"∠DAC = ∠BAD = 28°.","retry":"Весь угол состоит из двух одинаковых частей.","steps":["∠DAC = ∠BAD = 28°.","∠BAC = 28° + 28° = 56°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M100 20 L108.67771403621119 125.99999999999999\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M86.59818121421618 38.69201041175111 A23 23 0 0 0 101.87662223478056 42.923313220124335\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M101.87662223478056 42.923313220124335 A23 23 0 0 0 116.2634559672906 36.2634559672906\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"108.67771403621119\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"AH перпендикулярна прямой BC, H лежит на продолжении BC. Как называется AH?","answer":"Высота","before":"В тупоугольном △KLM перпендикуляр из K к продолжению LM — высота из K.","unit":"","see":"Название определяет прямой угол.","similar":"В тупоугольном △KLM перпендикуляр из K к продолжению LM — высота из K.","algorithm":"AH образует прямой угол с прямой BC.","retry":"Название определяет прямой угол.","steps":["AH образует прямой угол с прямой BC.","AH — высота из A."],"options":["Медиана","Высота","Биссектриса"],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M45 30 L74 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M45 126 L74 126\" stroke=\"#16231a\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"4 4\"/>\u003cpath d=\"M45 30 L45 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M45 115 h11 v11\" stroke=\"#2f5bb5\" fill=\"none\" stroke-width=\"2\"/>\u003ctext x=\"45\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">H\u003c/text>\u003ctext x=\"45\" y=\"23\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"67\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Равные треугольники","subtitle":"","title":"Как читать соответствие вершин","intro":"\u003csection class=\"theory-topic\">\u003ch3>Равные треугольники\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равные треугольники\u003c/strong> — треугольники, которые можно совместить наложением.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>При наложении одна вершина попадает на другую, а каждый отрезок и угол совпадают с соответствующими. В записи равенства порядок букв показывает пары.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Треугольник KLM\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">K\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">L\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Читайте вершины в одном порядке слева направо.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если △ABC = △KLM, то A ↔ K, B ↔ L, C ↔ M. Значит, AB = KL и ∠C = ∠M.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Порядок букв показывает, какие элементы совпадают.","anchorNote":"В повёрнутом рисунке ориентируйся на отметки и запись.","tasks":[{"kind":"choice","q":"△ABC = △KLM. Какой отрезок равен AC?","answer":"KM","before":"При △ABC = △PQR стороне AB соответствует PQ.","unit":"","see":"Замени A и C соответствующими буквами.","similar":"При △ABC = △PQR стороне AB соответствует PQ.","algorithm":"A соответствует K, C соответствует M.","retry":"Замени A и C соответствующими буквами.","steps":["A соответствует K, C соответствует M.","AC = KM."],"options":["LM","KL","KM"],"visual":"\u003cdiv style=\"width:100%\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Треугольник KLM\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">K\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">L\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003c/svg>\u003c/div>\u003c/div>"},{"kind":"choice","q":"△ABC = △MLK. Какой угол равен ∠ABC?","answer":"∠MLK","before":"Если △ABC = △QRP, то ∠ABC = ∠QRP, потому что B соответствует R.","unit":"","see":"Сохрани порядок трёх вершин.","similar":"Если △ABC = △QRP, то ∠ABC = ∠QRP, потому что B соответствует R.","algorithm":"A ↔ M, B ↔ L, C ↔ K.","retry":"Сохрани порядок трёх вершин.","steps":["A ↔ M, B ↔ L, C ↔ K.","Поэтому ∠ABC = ∠MLK."],"options":["∠LKM","∠MLK","∠KML"]},{"kind":"number","q":"△KLM = △BAC. AC = 13 см. Найди LM.","answer":13,"before":"При △ABC = △KLM и BC = 6 см получаем LM = 6 см.","unit":"см","see":"Сопоставь LM и сторону во второй записи.","similar":"При △ABC = △KLM и BC = 6 см получаем LM = 6 см.","algorithm":"L соответствует A, M соответствует C.","retry":"Сопоставь LM и сторону во второй записи.","steps":["L соответствует A, M соответствует C.","LM = AC = 13 см."]}]},{"name":"Первый признак","subtitle":"","title":"Две стороны и угол между ними","intro":"\u003csection class=\"theory-topic\">\u003ch3>Первый признак равенства треугольников\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Первый признак равенства треугольников\u003c/strong> — признак по двум сторонам и углу между ними.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если две стороны одного треугольника и угол между ними соответственно равны двум сторонам и углу между ними другого, треугольники равны. Фиксируем угол и откладываем на его лучах заданные длины: две оставшиеся вершины уже определены.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M57.93651947570628 70.08656113352525 L66.06348052429372 75.91343886647475\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M147.34314575050763 74.41421356237309 L154.4142135623731 67.34314575050762\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M151.5857864376269 78.65685424949238 L158.65685424949237 71.58578643762691\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M86.59818121421618 38.69201041175111 A23 23 0 0 0 116.2634559672906 36.2634559672906\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Треугольник KLM\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M57.93651947570628 70.08656113352525 L66.06348052429372 75.91343886647475\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M147.34314575050763 74.41421356237309 L154.4142135623731 67.34314575050762\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M151.5857864376269 78.65685424949238 L158.65685424949237 71.58578643762691\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M86.59818121421618 38.69201041175111 A23 23 0 0 0 116.2634559672906 36.2634559672906\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">K\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">L\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Дуги стоят у общей вершины двух отмеченных сторон.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">AB = KL, AC = KM, ∠BAC = ∠LKM. Следовательно, △ABC = △KLM по первому признаку.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Для двух известных сторон ищи угол у их общей вершины.","anchorNote":"Три совпавших элемента нужно назвать до вывода о равенстве.","tasks":[{"kind":"choice","q":"Равны AB и KL, BC и LM. Какие углы надо сравнить для первого признака?","answer":"∠B и ∠L","before":"У AB и AC общая вершина A. У KL и KM общая вершина K. Сравниваем ∠A и ∠K.","unit":"","see":"Найди общую вершину известных сторон в каждом треугольнике.","similar":"У AB и AC общая вершина A. У KL и KM общая вершина K. Сравниваем ∠A и ∠K.","algorithm":"AB и BC имеют общую вершину B.","retry":"Найди общую вершину известных сторон в каждом треугольнике.","steps":["AB и BC имеют общую вершину B.","KL и LM имеют общую вершину L.","Нужны ∠B и ∠L."],"options":["∠A и ∠K","∠C и ∠M","∠B и ∠L"]},{"kind":"choice","q":"AB = KL, AC = KM, ∠ABC = ∠KLM. Можно ли применить первый признак по этим данным?","answer":"Нет","before":"При равных AB и DE, BC и EF угол ∠B должен быть равен ∠E. Если дан угол ∠A, нужно искать дополнительные данные.","unit":"","see":"Проверь, лежат ли известные углы между отмеченными сторонами.","similar":"При равных AB и DE, BC и EF угол ∠B должен быть равен ∠E. Если дан угол ∠A, нужно искать дополнительные данные.","algorithm":"Данные стороны сходятся в A и K.","retry":"Проверь, лежат ли известные углы между отмеченными сторонами.","steps":["Данные стороны сходятся в A и K.","Известны углы при B и L, поэтому первый признак применить нельзя."],"options":["Да","Нет"]},{"kind":"number","q":"AB = AD, ∠BAC = ∠DAC, BC = 11 см. Найди DC.","answer":11,"before":"Если KL = KN, а KM делит ∠LKN пополам, то △KLM = △KNM по первому признаку. Значит, LM = NM.","unit":"см","see":"Выпиши общую сторону AC и равные углы при A.","similar":"Если KL = KN, а KM делит ∠LKN пополам, то △KLM = △KNM по первому признаку. Значит, LM = NM.","algorithm":"AB = AD по условию, AC — общая сторона.","retry":"Выпиши общую сторону AC и равные углы при A.","steps":["AB = AD по условию, AC — общая сторона.","∠BAC = ∠DAC, эти углы между указанными сторонами.","△ABC = △ADC по первому признаку.","DC = BC = 11 см."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115 20 L115.00000000000001 126.0\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M100.01824477234773 37.45127532012242 A23 23 0 0 0 115.0 43.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M115.0 43.0 A23 23 0 0 0 129.98175522765226 37.45127532012242\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"115.00000000000001\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Второй и третий признаки","subtitle":"","title":"Сторона с двумя углами и три стороны","intro":"\u003csection class=\"theory-topic\">\u003ch3>Второй признак равенства треугольников\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Второй признак равенства треугольников\u003c/strong> — признак по стороне и двум прилежащим к ней углам.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Сторона задаёт два конца. Из каждого конца идёт луч под известным углом. Их пересечение определяет третью вершину.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115.0 131.0 L115.0 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M37.40181878578382 107.30798958824889 A23 23 0 0 1 47.0 126.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M182.0 126.0 A24 24 0 0 1 189.02943725152286 109.02943725152286\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Треугольник KLM\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115.0 131.0 L115.0 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M37.40181878578382 107.30798958824889 A23 23 0 0 1 47.0 126.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M182.0 126.0 A24 24 0 0 1 189.02943725152286 109.02943725152286\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">K\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">L\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003c/svg>\u003c/div>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Дуги отмечены у обоих концов известных сторон.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">BC = LM, ∠ABC = ∠KLM и ∠ACB = ∠KML. Тогда △ABC = △KLM по второму признаку.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Третий признак равенства треугольников\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Третий признак равенства треугольников\u003c/strong> — признак по трём сторонам.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если закрепить одну сторону, третья вершина должна находиться на заданном расстоянии от обоих её концов. Возможные положения по разные стороны от основания зеркальны.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M57.93651947570628 70.08656113352525 L66.06348052429372 75.91343886647475\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M147.34314575050763 74.41421356237309 L154.4142135623731 67.34314575050762\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M151.5857864376269 78.65685424949238 L158.65685424949237 71.58578643762691\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M24 126 L206 126\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\ ют с углами при Q и R, подходит второй признак.","algorithm":"AB и DE — равные стороны.","retry":"Оба известных угла находятся у концов известной стороны.","steps":["AB и DE — равные стороны.","Углы у обоих концов каждой стороны равны.","Подходит второй признак."],"options":["Первый","Второй","Третий"]},{"kind":"choice","q":"AB = KL, BC = LM, AC = KM. Какой признак подходит?","answer":"Третий","before":"Треугольники со сторонами 5, 6, 8 см и 8, 5, 6 см равны по третьему признаку.","unit":"","see":"Посчитай число пар равных сторон.","similar":"Треугольники со сторонами 5, 6, 8 см и 8, 5, 6 см равны по третьему признаку.","algorithm":"Указаны три пары равных сторон.","retry":"Посчитай число пар равных сторон.","steps":["Указаны три пары равных сторон.","Применяем третий признак."],"options":["Второй","Первый","Третий"],"visual":"\u003cdiv style=\"width:100%\">\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\u003csvg role=\"img\" aria-label=\"Треугольник ABC\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M57.93651947570628 70.08656113352525 L66.06348052429372 75.91343886647475\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M147.34314575050763 74.41421356237309 L154.4142135623731 67.34314575050762\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M151.5857864376269 78.65685424949238 L158.65685424949237 71.58578643762691\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M24 126 L206 126\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003csvg role=\"img\" aria-label=\"Треугольник KLM\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M57.93651947570628 70.08656113352525 L66.06348052429372 75.91343886647475\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M147.34314575050763 74.41421356237309 L154.4142135623731 67.34314575050762\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M151.5857864376269 78.65685424949238 L158.65685424949237 71.58578643762691\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M24 126 L206 126\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">K\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">L\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003c/svg>\u003c/div>\u003c/div>"},{"kind":"choice","q":"У треугольников попарно равны все три угла. Обязательно ли треугольники равны?","answer":"Нет","before":"Равносторонние треугольники со сторонами 3 и 6 см имеют три угла по 60°, но стороны разной длины.","unit":"","see":"Можно ли увеличить все стороны и оставить углы прежними?","similar":"Равносторонние треугольники со сторонами 3 и 6 см имеют три угла по 60°, но стороны разной длины.","algorithm":"В равностороннем треугольнике все углы одинаковы.","retry":"Можно ли увеличить все стороны и оставить углы прежними?","steps":["В равностороннем треугольнике все углы одинаковы.","Размер равностороннего треугольника можно изменить, сохранив углы.","Равенство треугольников по этим данным не следует."],"options":["Нет","Да"]}]},{"name":"Равнобедренный треугольник","subtitle":"","title":"Свойство, признак и отрезок к основанию","intro":"\u003csection class=\"theory-topic\">\u003ch3>Свойство углов при основании\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Свойство углов при основании\u003c/strong> — равенство углов при основании равнобедренного треугольника.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Если AB = AC, углы напротив этих сторон равны. Можно провести биссектрису AD и сравнить △ABD и △ACD по первому признаку.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Основание BC, равные углы находятся при B и C.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">AB = AC, ∠B = 49°. Поэтому ∠C = 49°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Признак равнобедренного треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Признак равнобедренного треугольника\u003c/strong> — равенство двух углов треугольника, из которого следует равенство противоположных им сторон.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Когда даны равные углы, сначала найди стороны напротив них. Это будут боковые стороны.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Напротив B лежит AC, напротив C лежит AB.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠B = ∠C, то AC = AB и основание BC.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Медиана к основанию\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Медиана к основанию\u003c/strong> — медиана равнобедренного треугольника, проведённая из вершины между боковыми сторонами.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Приложи два получившихся треугольника друг к другу. У них общая медиана, равные половины основания и равные боковые стороны. Из равенства по третьему признаку получаются два равных угла при вершине и два равных смежных угла по 90° при середине основания.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Один отрезок из A к основанию делит пополам сторону и угол, а также перпендикулярен основанию.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">При AB = AC медиана AM одновременно является биссектрисой и высотой. То же совпадение действует, если из A к основанию сначала провести высоту или биссектрису.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Равные стороны лежат напротив равных углов.","anchorNote":"Совпадение трёх отрезков относится к вершине между боковыми сторонами.","tasks":[{"kind":"number","q":"AB = AC, ∠ABC = 64°. Найди ∠ACB.","answer":64,"before":"Если AB = AC и ∠B = 52°, то ∠C = 52° как угол при том же основании.","unit":"°","see":"Установи, где основание.","similar":"Если AB = AC и ∠B = 52°, то ∠C = 52° как угол при том же основании.","algorithm":"BC — основание.","retry":"Установи, где основание.","steps":["BC — основание.","Углы при B и C равны, значит, ∠ACB = 64°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"choice","q":"∠A = ∠B. Какая сторона служит основанием?","answer":"AB","before":"При ∠B = ∠C боковые стороны AC и AB равны, а основание BC.","unit":"","see":"Найди стороны напротив ∠A и ∠B.","similar":"При ∠B = ∠C боковые стороны AC и AB равны, а основание BC.","algorithm":"Напротив ∠A лежит BC, напротив ∠B — AC.","retry":"Найди стороны напротив ∠A и ∠B.","steps":["Напротив ∠A лежит BC, напротив ∠B — AC.","BC = AC.","Оставшаяся сторона AB — основание."],"options":["BC","AB","AC"]},{"kind":"number","q":"AB = AC. AM — медиана к BC. ∠BAM = 31°. Найди ∠BAC.","answer":62,"before":"Если медиана к основанию делит угол при вершине пополам и одна часть равна 25°, весь угол равен 50°.","unit":"°","see":"Медиана из A к основанию играет роль биссектрисы.","similar":"Если медиана к основанию делит угол при вершине пополам и одна часть равна 25°, весь угол равен 50°.","algorithm":"AM — биссектриса, поэтому ∠MAC = 31°.","retry":"Медиана из A к основанию играет роль биссектрисы.","steps":["AM — биссектриса, поэтому ∠MAC = 31°.","∠BAC = 31° + 31° = 62°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M115 20 L115.0 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M69.5 131.0 L69.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M160.5 131.0 L160.5 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115.0\" y=\"146\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">M\u003c/text>\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Сумма углов","subtitle":"","title":"Почему получается 180° и как найти неизвестный угол","intro":"\u003csection class=\"theory-topic\">\u003ch3>Сумма углов треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Сумма углов треугольника\u003c/strong> — сумма градусных мер его внутренних углов, равная 180°.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Проведём через A прямую, параллельную BC. Углы при B и C можно перенести к A как накрест лежащие. Вместе с углом A они образуют развёрнутый угол.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M88.92893230739598 35.441225992316134 A19 19 0 0 0 113.4350288425444 33.435028842544405\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M37.40181878578382 107.30798958824889 A23 23 0 0 1 47.0 126.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M183.0 126.0 A23 23 0 0 1 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003cpath d=\"M35 20 L173 20\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" stroke-dasharray=\"5 5\"/>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Синяя прямая через A параллельна BC.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠A = 42° и ∠B = 63°, то ∠C = 180° − (42° + 63°) = 75°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Углы равностороннего треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Углы равностороннего треугольника\u003c/strong> — три равных угла, каждый из которых равен 60°.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>У равных сторон равны противоположные углы. Поэтому 180° делим поровну на три угла.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 22.076951545867374 L55 126 L175 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M80.6698729810778 71.53847577293368 L89.3301270189222 76.53847577293368\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M140.66987298107782 76.53847577293368 L149.33012701892218 71.53847577293368\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M115.0 131.0 L115.0 121.0\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"15.076951545867374\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"48\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"180\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Проверь, что все три стороны отмечены одинаково.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">180° : 3 = 60°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"∠A + ∠B + ∠C = 180°.","anchorNote":"В задаче с отношением обозначь за x градусную меру одной части.","tasks":[{"kind":"number","q":"∠A = 48°, ∠B = 77°. Найди ∠C.","answer":55,"before":"Если два угла 35° и 65°, третий равен 180° − (35° + 65°) = 80°.","unit":"°","see":"Вычти сумму двух углов из 180°.","similar":"Если два угла 35° и 65°, третий равен 180° − (35° + 65°) = 80°.","algorithm":"48° + 77° = 125°.","retry":"Вычти сумму двух углов из 180°.","steps":["48° + 77° = 125°.","180° − 125° = 55°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M88.92893230739598 35.441225992316134 A19 19 0 0 0 113.4350288425444 33.435028842544405\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M37.40181878578382 107.30798958824889 A23 23 0 0 1 47.0 126.0\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003cpath d=\"M183.0 126.0 A23 23 0 0 1 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Угол между боковыми сторонами равнобедренного треугольника равен 40°. Найди угол при основании.","answer":70,"before":"При угле между боковыми сторонами 52° на основание остаётся 128°. Каждый угол при основании равен 64°.","unit":"°","see":"Оба угла при основании равны.","similar":"При угле между боковыми сторонами 52° на основание остаётся 128°. Каждый угол при основании равен 64°.","algorithm":"180° − 40° = 140° приходится на два равных угла.","retry":"Оба угла при основании равны.","steps":["180° − 40° = 140° приходится на два равных угла.","140° : 2 = 70°."],"visual":"\u003cdiv style=\"width:100%\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 235 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M115 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M65.70624449562555 69.74309668964081 L73.29375550437445 76.25690331035919\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M156.70624449562555 76.25690331035919 L164.29375550437445 69.74309668964081\" stroke=\"#a94b21\" stroke-width=\"2.6\" fill=\"none\" />\u003ctext x=\"115\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003c/div>"},{"kind":"number","q":"Углы относятся как 2 : 3 : 4. Найди наибольший угол.","answer":80,"before":"При отношении 1 : 2 : 3 всего 6 частей. Каждая равна 180° : 6 = 30°, наибольший угол 3 · 30° = 90°.","unit":"°","see":"Сначала найди, сколько градусов в одной части.","similar":"При отношении 1 : 2 : 3 всего 6 частей. Каждая равна 180° : 6 = 30°, наибольший угол 3 · 30° = 90°.","algorithm":"2x + 3x + 4x = 180°.","retry":"Сначала найди, сколько градусов в одной части.","steps":["2x + 3x + 4x = 180°.","9x = 180°, x = 20°.","4x = 80°."]}]},{"name":"Внешний угол","subtitle":"","title":"Два способа вычислить внешний угол","intro":"\u003csection class=\"theory-topic\">\u003ch3>Внешний угол треугольника\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Внешний угол треугольника\u003c/strong> — угол, смежный с внутренним углом при данной вершине.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>Продли сторону BC за C до D. Лучи CB и CD идут по одной прямой в разные стороны. Углы ACB и ACD в сумме дают 180°.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 158\" style=\"display:block;width:100%;max-width:375px;height:auto;margin:auto;background:#eee0c8;border-radius:12px\">\u003cpath d=\"M100 20 L24 126 L206 126 Z\" fill=\"#f4e8d4\" stroke=\"#16231a\" stroke-width=\"2.3\"/>\u003cpath d=\"M206 126 L252 126\" stroke=\"#2f5bb5\" stroke-width=\"2.6\" fill=\"none\" />\u003cpath d=\"M229.0 126.0 A23 23 0 0 0 189.73654403270942 109.7365440327094\" stroke=\"#a94b21\" fill=\"none\" stroke-width=\"2.2\"/>\u003ctext x=\"252\" y=\"145\" fill=\"#2f5bb5\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">D\u003c/text>\u003ctext x=\"100\" y=\"13\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">A\u003c/text>\u003ctext x=\"17\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">B\u003c/text>\u003ctext x=\"211\" y=\"145\" fill=\"#16231a\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"650\">C\u003c/text>\u003c/svg>\u003cfigcaption style=\"margin-top:7px;font-size:0.95rem\">Внешний угол ACD образуют CA и продолжение BC за C.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"theory-cell\">Если ∠ACB = 72°, то ∠ACD = 180° − 72° = 108°.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Свойство внешнего угла\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Свойство внешнего угла\u003c/strong> — равенство внешнего угла сумме двух внутренних углов, не смежных с ним.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Как это увидеть\u003c/h4>\u003cp>У внешнего угла и суммы двух дальних углов одна величина: 180° минус внутренний угол при той же вершине. Поэтому внешний угол больше каждого из двух дальних углов.\u003c/p>\u003cfigure style=\"margin:10px 0;max-width:610px\">\u003csvg role=\"img\" aria-label=\"Схема треугольника\" viewBox=\"0 0 278 15
