<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14211e"><title>Дроби</title><style>
:root { --bg: #14211e; --glass: rgba(243,236,226,.05); --glass2: rgba(243,236,226,.085); --line: rgba(226,234,228,.14); --fg: #f3ece2; --muted: #a9b6ad; --faint: #6e7f77; --cobalt: #1747c9; --apricot: #f2905e; --mint: #a9d18e; --amber: #f5dc6a; --miss: #ff8f73; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font: 19px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
.wrap { max-width: 660px; margin: 0 auto; padding: 20px 16px 80px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 800; }
h2 { font-size: 24px; line-height: 1.25; margin: 6px 0 14px; font-weight: 800; }
h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; }
p { margin: 0 0 12px; }
b { font-weight: 700; }
.small { font-size: 15px; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; min-height: 36px; }
.who { color: var(--muted); font-size: 15px; display: flex; align-items: center; }
.lnk { background: none; border: 0; color: var(--muted); font: inherit; font-size: 16px; cursor: pointer; padding: 6px 8px; margin-left: -8px; border-radius: 10px; }
.lnk:hover { color: var(--fg); }
table .lnk { margin: 0; padding: 2px 4px; text-decoration: underline; font-size: 14px; }
.btn { font: inherit; font-weight: 700; font-size: 17px; background: var(--cobalt); color: var(--fg); border: 0; border-radius: 16px; padding: 0 26px; height: 54px; cursor: pointer; margin: 4px 8px 4px 0; transition: .15s; }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(.97); }
.btn.sec { background: var(--glass2); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; }
.btn:focus-visible, .row:focus-visible, .opt:focus-visible, .lnk:focus-visible, input:focus-visible { outline: 2px solid var(--apricot); outline-offset: 2px; }
.txt { font: inherit; font-size: 20px; width: 100%; height: 56px; padding: 0 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--fg); }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; cursor: pointer; color: var(--fg); transition: .15s; width: 100%; }
.row:hover:not(:disabled) { background: var(--glass2); border-color: rgba(242,144,94,.45); }
.row .num { width: 34px; height: 34px; border-radius: 50%; background: var(--cobalt); color: var(--fg); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.row .tt { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.row small { color: var(--muted); font-size: 14px; }
.row .stt { font-size: 14px; color: var(--muted); text-align: right; }
.row.ok .num { background: var(--mint); color: #14211e; } .row.ok .stt { color: var(--mint); font-weight: 600; }
.row.lock { opacity: .45; cursor: default; }
.row.help { border-color: var(--miss); } .row.help .stt { color: var(--miss); font-weight: 600; }
.row.run .stt { color: var(--apricot); font-weight: 600; }
.card { background: var(--glass); border: 1px solid var(--line); border-radius: 24px; padding: 22px; margin-bottom: 14px; animation: enter .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
.vis { margin-top: 8px; }
.nav { display: flex; justify-content: space-between; align-items: center; }
.dots { display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 10px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--mint); display: inline-block; }
.dots i.on { background: var(--mint); }
svg.bar { max-width: 100%; height: auto; display: block; margin: 10px 0; }
svg.bar.click .pc { cursor: pointer; }
.barrow { margin: 8px 0; } .barrow .lab { font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.cap { font-size: 20px; margin: 4px 0 8px; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .12em; line-height: 1.1; font-weight: 700; }
.fr .t { border-bottom: 2px solid currentColor; padding: 0 .3em .05em; }
.fr .b { padding: .05em .3em 0; }
.mx { font-weight: 700; margin-right: .1em; }
.expr { font-size: 28px; margin: 10px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.expr .q { font-weight: 800; color: var(--apricot); }
.anno { display: flex; gap: 16px; align-items: stretch; font-size: 36px; margin: 8px 0; }
.anno .al { display: flex; flex-direction: column; justify-content: space-between; font-size: 16px; color: var(--muted); padding: 2px 0; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.opt { font: inherit; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 10px 18px; cursor: pointer; min-height: 54px; color: var(--fg); text-align: left; transition: .15s; }
.opt:hover:not(:disabled) { background: var(--glass2); }
.opt.sel { border-color: var(--apricot); background: rgba(242,144,94,.16); }
.opt:disabled { opacity: .75; cursor: default; }
.rows { margin-top: 12px; display: flex; flex-direction: column; gap: 14px; }
.irow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.irow .lb { min-width: 100px; }
.num, .fin input { font: inherit; font-size: 24px; width: 3.3em; height: 56px; text-align: center; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--fg); font-variant-numeric: tabular-nums; }
.fin { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.fin .line { width: 3.4em; border-top: 3px solid var(--fg); }
.hint { border-left: 4px solid var(--amber); background: rgba(245,220,106,.1); padding: 10px 14px; margin-bottom: 10px; border-radius: 10px; }
.msg { min-height: 30px; font-weight: 600; margin-bottom: 8px; }
.msg.good { color: var(--mint); } .msg.bad { color: var(--miss); }
table.rep { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
table.rep th, table.rep td { border-bottom: 1px solid var(--line); padding: 7px 4px; text-align: left; vertical-align: top; }
table.rep th { color: var(--muted); font-weight: 600; }
@media (max-width: 520px) { body { font-size: 18px; } .row .stt { display: none; } .card { padding: 18px; } }
</style></head><body><div class="wrap" id="app"></div><script>
(function (root) {
'use strict';

/* ---------- утилиты ---------- */
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[rnd(0, a.length - 1)]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }

function fr(n, d) { return '<span class="fr"><span class="t">' + n + '</span><span class="b">' + d + '</span></span>'; }
function mx(w, n, d) { return '<span class="mx">' + w + '</span>' + fr(n, d); }

const NUMW = { 1: 'одна', 2: 'две', 3: 'три', 4: 'четыре', 5: 'пять', 6: 'шесть', 7: 'семь', 8: 'восемь', 9: 'девять', 10: 'десять', 11: 'одиннадцать', 12: 'двенадцать' };
const GEN = { 2: 'вторых', 3: 'третьих', 4: 'четвёртых', 5: 'пятых', 6: 'шестых', 7: 'седьмых', 8: 'восьмых', 9: 'девятых', 10: 'десятых', 11: 'одиннадцатых', 12: 'двенадцатых' };
const SING = { 2: 'вторая', 3: 'третья', 4: 'четвёртая', 5: 'пятая', 6: 'шестая', 7: 'седьмая', 8: 'восьмая', 9: 'девятая', 10: 'десятая', 11: 'одиннадцатая', 12: 'двенадцатая' };
function word(k, n) {
  if (k === 1) return n === 2 ? 'одна вторая (половина)' : 'одна ' + SING[n];
  return NUMW[k] + ' ' + GEN[n];
}

/* ---------- картинки ---------- */
// полоска шоколада: n кусочков, taken — число тёмных (первые) или массив индексов
function bar(n, taken, o) {
  o = o || {};
  const H = o.h || 52, W = o.w || Math.min(480, n * 56);
  const widths = o.widths || Array(n).fill(1);
  const tot = widths.reduce(function (a, b) { return a + b; }, 0);
  const set = Array.isArray(taken) ? new Set(taken) : new Set(Array.from({ length: taken || 0 }, function (_, i) { return i; }));
  const gap = 2;
  let x = 2;
  let s = '<svg class="bar' + (o.click ? ' click' : '') + '" viewBox="0 0 ' + (W + 4) + ' ' + (H + 4) + '" width="' + (W + 4) + '" role="img">';
  for (let i = 0; i < n; i++) {
    const w = W * widths[i] / tot;
    const dark = set.has(i);
    s += '<g class="pc" data-i="' + i + '"><rect x="' + (x + gap / 2) + '" y="2" width="' + (w - gap) + '" height="' + H + '" rx="5" fill="' + (dark ? '#5b3a29' : '#f3ece2') + '" stroke="#e8e1d2" stroke-width="2"/>';
    if (dark) s += '<rect x="' + (x + gap / 2 + 6) + '" y="8" width="' + Math.max(w - gap - 12, 2) + '" height="' + (H - 12) + '" rx="3" fill="#7a5240"/>';
    s += '</g>';
    x += w;
  }
  return s + '</svg>';
}
function lab(name, svg) { return '<div class="barrow"><div class="lab">' + name + '</div>' + svg + '</div>'; }
function cap(h) { return '<div class="cap">' + h + '</div>'; }
function anno(n, d, a, b) { return '<div class="anno">' + fr(n, d) + '<div class="al"><div>' + a + '</div><div>' + b + '</div></div></div>'; }

// N кусочков, разбитых на den групп; закрашено k групп
function groups(N, den, k) {
  const m = N / den, sz = Math.min(28, Math.floor(440 / (N + den))), gap = 10;
  const W = N * sz + (den - 1) * gap + 4, H = sz + 4;
  let x = 2, s = '<svg class="bar" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img">';
  for (let g = 0; g < den; g++) {
    for (let i = 0; i < m; i++) {
      s += '<rect x="' + x + '" y="2" width="' + (sz - 2) + '" height="' + (sz - 2) + '" rx="3" fill="' + (g < k ? '#5b3a29' : '#f3ece2') + '" stroke="#e8e1d2" stroke-width="1.5"/>';
      x += sz;
    }
    x += gap;
  }
  return s + '</svg>';
}

// площадь: q столбцов, s строк; p столбцов и r строк закрашены
function area(q, s, p, r) {
  const cw = Math.min(60, Math.floor(300 / q)), ch = Math.min(48, Math.floor(200 / s));
  const W = q * cw, H = s * ch;
  let out = '<svg class="bar" viewBox="0 0 ' + (W + 4) + ' ' + (H + 4) + '" width="' + (W + 4) + '" role="img">';
  for (let i = 0; i < q; i++) for (let j = 0; j < s; j++) {
    const c = i < p, rr = j < r;
    const f = (c && rr) ? '#5b3a29' : c ? '#f2905e' : rr ? '#a9d18e' : '#f3ece2';
    out += '<rect x="' + (2 + i * cw) + '" y="' + (2 + j * ch) + '" width="' + cw + '" height="' + ch + '" fill="' + f + '" stroke="#14211e" stroke-width="1.5"/>';
  }
  return out + '</svg>';
}

/* ---------- проверки ---------- */
function eqv(v, n, d) { return v.d > 0 && v.n * d === v.d * n; }
function ex(v, n, d) { return v.n === n && v.d === d; }
function redEq(v, n, d) { return eqv(v, n, d) && v.d > 0 && gcd(v.n, v.d) === 1; }
function okSum(v, N, D) { return ex(v, N, D) || redEq(v, N, D); }

function choice(list, shuf) {
  const o = list.map(function (a) { return { v: String(a[0]), html: a[1], tag: a[2] || '' }; });
  return { type: 'choice', options: shuf === false ? o : shuffle(o) };
}
function fracChoice(correct, wrongs) {
  const seen = {}, list = [];
  [correct].concat(wrongs).forEach(function (a) {
    const key = a[0] + '/' + a[1];
    if (seen[key]) return;
    seen[key] = 1;
    list.push([key, fr(a[0], a[1]), a[2] || '']);
  });
  return { input: choice(list.slice(0, 4)), ans: correct[0] + '/' + correct[1] };
}
function rows() { return { type: 'rows', rows: Array.prototype.slice.call(arguments) }; }
const R = {
  int: function (label, key) { return { label: label, kind: 'int', key: key }; },
  frac: function (label, key) { return { label: label, kind: 'frac', key: key }; },
  mixed: function (label, key) { return { label: label, kind: 'mixed', key: key }; }
};
function unequalWidths(n) {
  const ws = Array(n).fill(1);
  const idx = shuffle(Array.from({ length: n }, function (_, i) { return i; }));
  const k = rnd(1, n - 1);
  for (let i = 0; i < k; i++) ws[idx[i]] = pick([2, 3]);
  return ws;
}

/* ---------- генераторы заданий ---------- */
// каждый возвращает {q, input, ans|sol, check?, hint, tag?}

function gen1(s) {
  const t = rnd(0, 2);
  if (t === 0) {
    const n = rnd(2, 8), eq = Math.random() < 0.5;
    return { q: '<p>Шоколадку разломили на части. Все части одинаковые?</p>' + bar(n, 0, { widths: eq ? null : unequalWidths(n) }),
      input: choice([['yes', 'Да, поровну'], ['no', 'Нет, не поровну']], false), ans: eq ? 'yes' : 'no',
      hint: 'Посмотри на кусочки: все ли они одной ширины? Если хоть один больше или меньше других, это не поровну.' };
  }
  if (t === 1) {
    const n = rnd(2, 9);
    return { q: '<p>Сколько кусочков в этой шоколадке?</p>' + bar(n, 0), input: rows(R.int('Кусочков', 'x')), sol: { x: n },
      check: function (v) { return v.x === n ? 'ok' : 'wrong'; },
      hint: 'Считай кусочки по одному, показывая пальцем. Ни один не пропусти.' };
  }
  const n1 = rnd(3, 6);
  const o = [['eq', lab('А', bar(n1, 0, { w: 300 }))], ['u1', lab('Б', bar(rnd(3, 6), 0, { w: 300, widths: null }))]];
  const a = rnd(3, 6), b = rnd(3, 6), c = rnd(3, 6);
  return { q: '<p>Выбери шоколадку, которую разделили поровну.</p>',
    input: choice([['A', lab('А', bar(a, 0, { w: 300 }))], ['B', lab('Б', bar(b, 0, { w: 300, widths: unequalWidths(b) }))], ['C', lab('В', bar(c, 0, { w: 300, widths: unequalWidths(c) }))]].map(function (x, i) { return x; })),
    ans: 'A', hint: 'Ищи шоколадку, где все кусочки одинаковые. В остальных есть большие и маленькие.' };
}

function gen2(s) {
  const t = rnd(0, 3), n = rnd(2, 8);
  if (t === 0) {
    const fc = fracChoice([1, n], [[n, 1, 'swap'], [1, n > 2 ? n - 1 : n + 2, 'count-light'], [1, n + 1], [2, n]]);
    return { q: '<p>Какая дробь показывает тёмный кусочек?</p>' + bar(n, 1), input: fc.input, ans: fc.ans,
      hint: 'Внизу пиши, сколько всего кусочков в шоколадке (и тёмные, и светлые). Вверху — сколько кусочков тёмные.' };
  }
  if (t === 1 || t === 2) {
    const pic = s < 2 || t === 1;
    return { q: t === 1 ? '<p>Напиши дробь для тёмного кусочка.</p>' + bar(n, 1) : '<p>Шоколадку разломили на ' + n + ' равных частей. Взяли одну часть. Напиши дробь.</p>' + (s < 2 ? bar(n, 1) : ''),
      input: rows(R.frac('Дробь', 'x')), sol: { x: { n: 1, d: n } },
      check: function (v) { return ex(v.x, 1, n) ? 'ok' : 'wrong'; },
      tag: function (v) { return (v.x.n === n && v.x.d === 1) ? 'swap' : ''; },
      hint: 'Внизу пиши, на сколько частей разломили. Вверху пиши, сколько частей взяли: взяли одну.' };
  }
  const dens = shuffle([2, 3, 4, 5, 6, 7, 8].filter(function (x) { return x !== n; })).slice(0, 2).concat([n]);
  return { q: '<p>Найди шоколадку, где тёмный кусочек — это ' + fr(1, n) + ' (' + word(1, n) + ').</p>',
    input: choice(dens.map(function (d, i) { return [d, bar(d, 1, { w: Math.min(300, d * 50) })]; })), ans: String(n),
    hint: 'Одна ' + (SING[n] || 'вторая') + ' — это когда всего ' + n + ' равных частей. Посчитай кусочки в каждой шоколадке.' };
}

function gen3(s) {
  const t = rnd(0, 4), n = rnd(4, 9), k = rnd(2, n - 1);
  if (t === 0) {
    return { q: '<p>Посмотри на шоколадку.</p>' + bar(n, k), input: rows(R.int('Сколько всего кусочков?', 'tot'), R.int('Сколько тёмных кусочков?', 'dark')),
      sol: { tot: n, dark: k },
      check: function (v) { return (v.tot === n && v.dark === k) ? 'ok' : 'wrong'; },
      tag: function (v) { return (v.tot === k && v.dark === n) ? 'swap' : ''; },
      hint: 'Сначала посчитай ВСЕ кусочки: и тёмные, и светлые. Потом только тёмные.' };
  }
  if (t === 1 || t === 4) {
    const pic = t === 1 || s < 2;
    return { q: pic ? '<p>Какая дробь показана? Тёмные кусочки — это взятые.</p>' + bar(n, k)
                    : '<p>Шоколадку разделили на ' + n + ' равных частей и взяли ' + k + '. Напиши дробь.</p>',
      input: rows(R.frac('Дробь', 'x')), sol: { x: { n: k, d: n } },
      check: function (v) { return ex(v.x, k, n) ? 'ok' : 'wrong'; },
      tag: function (v) { if (v.x.n === n && v.x.d === k) return 'swap'; if (v.x.n === k && v.x.d === n - k) return 'denominator-is-rest'; return ''; },
      hint: 'Внизу — сколько всего частей (' + (pic ? 'считай все кусочки' : 'это ' + n) + '). Вверху — сколько взяли.' };
  }
  if (t === 2) {
    const fc = fracChoice([k, n], [[n, k, 'swap'], [k, n - k, 'denominator-is-rest'], [n - k, n, 'light-part']]);
    return { q: '<p>Какая дробь показывает тёмную часть шоколадки?</p>' + bar(n, k), input: fc.input, ans: fc.ans,
      hint: 'Внизу все кусочки, вверху только тёмные.' };
  }
  const qs = [['знаменатель', n], ['числитель', k], ['показывает, на сколько равных частей разделили шоколадку', n], ['показывает, сколько частей взяли', k]];
  const w = pick(qs);
  return { q: '<p>В дроби ' + fr(k, n) + ' какое число ' + (w[0].length > 12 ? w[0] : '— ' + w[0]) + '?</p>',
    input: choice([[k, String(k)], [n, String(n)]], false), ans: String(w[1]),
    hint: 'Число внизу — знаменатель, оно показывает, на сколько частей разделили. Число вверху — числитель, оно показывает, сколько частей взяли.' };
}

function gen4(s) {
  const n = rnd(3, 9), k = rnd(1, n - 1), words = Math.random() < 0.4;
  return { q: '<p>Закрась ' + (words ? word(k, n) : fr(k, n)) + ' шоколадки. Нажимай на кусочки.</p>',
    input: { type: 'shade', n: n }, sol: k,
    check: function (set) { return set.length === k ? 'ok' : 'wrong'; },
    tag: function (set) { return set.length === n - k ? 'swap-rest' : ''; },
    hint: 'Шоколадка уже разделена на ' + n + ' частей. Число вверху показывает, сколько кусочков надо закрасить.' };
}

function gen5(s) {
  const t = rnd(0, 3), n = rnd(2, 9);
  if (t === 0) {
    const k = pick([0, n, n, rnd(1, n - 1), rnd(1, n - 1)]);
    const ans = k === 0 ? 'zero' : k === n ? 'whole' : 'less';
    return { q: '<p>Что показывает тёмная часть?</p>' + bar(n, k),
      input: choice([['whole', 'Целую шоколадку (взяли все кусочки)'], ['less', 'Меньше целой шоколадки'], ['zero', 'Ничего (не взяли ни одного кусочка)']], false), ans: ans,
      hint: 'Сравни: тёмных кусочков столько же, сколько всего? Или меньше? Или нет ни одного?' };
  }
  if (t === 1) {
    const z = Math.random() < 0.5;
    return { q: '<p>Допиши: ' + (z ? fr(0, n) : fr(n, n)) + ' = ?</p>', input: rows(R.int('Чему равна дробь', 'x')),

function gen15(s) {

      tag: function (v) { return v.x === m ? 'forgot-k' : ''; },

  if (t === 2) {
    return { q: '<p>Найди ' + fr(k, n) + ' от числа ' + N + '.</p>', input: rows(R.int('Ответ', 'x')), sol: { x: k * m }, check: function (v) { return v.x === k * m ? 'ok' : 'wrong'; },
      tag: function (v) { return v.x === m ? 'forgot-k' : ''; },
      hint: 'Сначала найди одну ' + SING[n] + ': ' + N + ' : ' + n + '. Потом умножь на ' + k + '.' };
  }

function gen16(s) {
  const q = rnd(2, 5), s2 = rnd(2, 5), p = rnd(1, q - 1), r = rnd(1, s2 - 1);
  const t = (s < 2) ? rnd(0, 1) : (Math.random() < 0.2 ? 0 : 1);
  const legend = '<p class="small">Оранжевая полоска — ' + fr(p, q) + '. Зелёная полоска — ' + fr(r, s2) + '. Тёмные клетки — там, где полоски пересекаются.</p>';
  if (t === 0) {
    return { q: '<p>Посмотри на картинку.</p>' + area(q, s2, p, r) + legend, input: rows(R.int('Сколько клеток тёмных?', 'dark'), R.int('Сколько всего клеток?', 'tot')),
      sol: { dark: p * r, tot: q * s2 }, check: function (v) { return (v.dark === p * r && v.tot === q * s2) ? 'ok' : 'wrong'; },
      tag: function (v) { return (v.dark === q * s2 && v.tot === p * r) ? 'swap' : ''; },
      hint: 'Тёмных клеток: ' + p + ' столбца(ов) по ' + r + ' клеток. Всего клеток: ' + q + ' умножить на ' + s2 + '.' };
  }
  const N = p * r, D = q * s2;
  return { q: '<p>Умножь дроби.</p>' + (s < 2 ? area(q, s2, p, r) + legend : '') + '<div class="expr">' + fr(p, q) + ' × ' + fr(r, s2) + ' = ?</div><p class="small">Если можно сократить, сократи.</p>',
    input: rows(R.frac('Ответ', 'x')), sol: { x: { n: N / gcd(N, D), d: D / gcd(N, D) } },
    check: function (v) { if (redEq(v.x, N, D)) return 'ok'; if (eqv(v.x, N, D)) return { partial: 'Верно, но дробь можно сократить. Сократи её.' }; return 'wrong'; },
    tag: function (v) { return (v.x.d === q && v.x.n === N) ? 'denominator-kept' : ''; },
    hint: 'Числитель умножь на числитель: ' + p + ' × ' + r + '. Знаменатель умножь на знаменатель: ' + q + ' × ' + s2 + '.' };
}

function gen17(s) {
  const t = rnd(0, 3);
  if (t === 0) {
    const N = rnd(1, 3), n = rnd(2, 4);
    let b = ''; for (let i = 0; i < N; i++) b += bar(n, 0, { w: Math.min(300, n * 60) });
    return { q: '<p>Сколько кусочков по ' + fr(1, n) + ' получится из ' + N + ' ' + (N === 1 ? 'шоколадки' : 'шоколадок') + '?</p>' + b + '<div class="expr">' + N + ' : ' + fr(1, n) + ' = ?</div>',
      input: rows(R.int('Кусочков', 'x')), sol: { x: N * n }, check: function (v) { return v.x === N * n ? 'ok' : 'wrong'; },
      hint: 'В одной шоколадке ' + n + ' кусочков по ' + fr(1, n) + '. Шоколадок ' + N + '. Сколько всего кусочков?' };
  }
  if (t === 1) {
    const b = rnd(1, 3), m = rnd(2, 4), a = b * m, n = rnd(Math.max(a, 4), 12);
    return { q: '<p>Посчитай. Сколько раз ' + b + ' кусочк' + (b === 1 ? 'а' : 'а') + ' помещается в ' + a + ' кусочках?</p><div class="expr">' + fr(a, n) + ' : ' + fr(b, n) + ' = ?</div>',
      input: rows(R.int('Ответ', 'x')), sol: { x: m }, check: function (v) { return v.x === m ? 'ok' : 'wrong'; },
      hint: 'Кусочки одинаковые, значит делим числители: ' + a + ' : ' + b + '.' };
  }
  const a = rnd(1, 4), b = rnd(a + 1, 5), c = rnd(1, 4), d = rnd(c + 1, 5);
  const N = a * d, D = b * c, g = gcd(N, D), rn = N / g, rd = D / g;
  const full = s < 2 || Math.random() < 0.4;
  const rowsList = [];
  if (full) rowsList.push(R.frac('Переверни вторую дробь', 'f'));
  rowsList.push(R.frac('Ответ', 'x'));
  const sol = { x: { n: rn, d: rd } }; if (full) sol.f = { n: d, d: c };
  return { q: '<p>Раздели. Переверни вторую дробь и умножь.</p><div class="expr">' + fr(a, b) + ' : ' + fr(c, d) + ' = ?</div><p class="small">Если можно сократить, сократи. Целое число пиши так: число сверху и 1 снизу.</p>',
    input: { type: 'rows', rows: rowsList }, sol: sol,
    check: function (v) {
      if (full && !ex(v.f, d, c)) return 'wrong';
      if (redEq(v.x, rn, rd)) return 'ok';
      if (eqv(v.x, rn, rd)) return { partial: 'Верно, но дробь можно сократить. Сократи её.' };
      return 'wrong';
    },
    tag: function (v) { return (v.x.n === b * d && v.x.d === a * c) || eqv(v.x, a * c, b * d) ? 'did-not-flip' : ''; },
    hint: 'Вторую дробь ' + fr(c, d) + ' переверни: ' + fr(d, c) + '. Потом умножь: верх на верх, низ на низ.' };
}

  var m;
  if (ok) m = clean ? 'Верно.' : 'Верно, но в зачёт не пошло: ответ был не с первой попытки или с подсказкой.';
  else m = 'Не получилось. Ничего страшного, идём дальше. Счёт верных подряд начинается заново.';
  msg(m, ok ? 'good' : 'bad');
  document.getElementById('acts').innerHTML = '<button class="btn" data-a="next-task" data-passed="' + (passedNow ? 1 : 0) + '">Дальше</button>';
  var hb = document.querySelector('.dots'); if (hb) hb.outerHTML = dots(o.streak);
  lockInputs();
}
function lockInputs() { app.querySelectorAll('#inp input, #inp .opt').forEach(function (e) { e.disabled = true; }); }

function nextTask(passed) {
  var s = STEPS[P.i], o = st(s.id);
  if (passed) { send({ t: 'passed', step: s.id, stepTitle: s.title }); V = { name: 'done', i: P.i }; render(); return; }
  if (o.cw >= 2) {
    o.cw = 0;
    if (o.reteach >= 2) { o.stuck = true; save(); send({ t: 'stuck', step: s.id, stepTitle: s.title }); V = { name: 'stuck', i: P.i }; render(); return; }
    o.reteach++; save(); V = { name: 'inter', i: P.i }; render(); return;
  }
  newTask(); render();
}

/* ---------- события ---------- */
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]');
  var pc = e.target.closest('#shade .pc');
  if (pc && P && !P.done) { var i = +pc.getAttribute('data-i'); if (P.sel.has(i)) P.sel.delete(i); else P.sel.add(i); document.getElementById('shade').innerHTML = C.bar(P.task.input.n, Array.from(P.sel), { click: true }); return; }
  if (!b || b.disabled) return;
  var a = b.dataset.a, i2 = +b.dataset.i;
  if (a === 'start') { var v = document.getElementById('nm').value.trim(); if (!v) return; S.name = v; save(); send({ t: 'start' }); V = { name: 'home' }; render(); }
  else if (a === 'home' || a === 'thome') { if (a === 'thome') history.replaceState(null, '', location.pathname); V = { name: 'home' }; render(); }
  else if (a === 'open') openStep(i2);
  else if (a === 'next') { V.k++; render(); }
  else if (a === 'prev') { V.k--; render(); }
  else if (a === 'practice') startPractice(V.i);
  else if (a === 'reteach') { V = { name: 'teach', i: V.i, k: 0 }; render(); }
  else if (a === 'pick') { P.choice = b.dataset.v; app.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', o === b); }); }
  else if (a === 'check') check();
  else if (a === 'hint') { P.hint = true; var hb = document.getElementById('hintbox'); hb.hidden = false; hb.innerHTML = P.task.hint; b.remove(); }
  else if (a === 'dk') { if (!P.done) { P.attempt++; P.tags.push('dont-know'); finish(false, 'dont-know'); msg('Хорошо, что сказала честно. Эту тему разберём на занятии. Идём дальше.', 'bad'); } }
  else if (a === 'next-task') nextTask(b.dataset.passed === '1');
  else if (a === 'tpass') { var o1 = st(STEPS[i2].id); o1.passed = true; o1.stuck = false; save(); render(); }
  else if (a === 'treset') { delete S.steps[STEPS[i2].id]; save(); render(); }
  else if (a === 'topen') { history.replaceState(null, '', location.pathname); V = { name: 'teach', i: i2, k: 0 }; render(); }
  else if (a === 'topenall') { S.openAll = !S.openAll; save(); render(); }
  else if (a === 'tclear') { if (confirm('Стереть весь прогресс и имя?')) { S = fresh(); save(); V = { name: 'start' }; history.replaceState(null, '', location.pathname); render(); } }
});
app.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (V.name === 'start') { app.querySelector('[data-a="start"]').click(); }
  else if (V.name === 'task') { var c = app.querySelector('[data-a="check"],[data-a="next-task"]'); if (c) c.click(); }
});
window.addEventListener('hashchange', render);
window.__frac = { get P() { return P; }, get S() { return S; }, get V() { return V; } };
render();
})();
</script></body></html>
