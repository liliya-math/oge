/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);
}
body :is(.card, .mode):nth-of-type(6n + 5) { --trainer-card-stripe: var(--trainer-moss); }
body :is(.card, .mode):nth-of-type(6n + 6) { --trainer-card-stripe: var(--trainer-caramel); }
body :is(.solution, .why) {
  background: var(--trainer-card);
  border-color: var(--trainer-border);
}
body .app-shell .visual-panel {
  background: var(--trainer-cream);
  color: var(--trainer-bg);
}
body .app-shell .visual-panel :is(.visual-description p, .visual-description strong, .visual-foot) {
  color: var(--trainer-bg);
}
body .visual-number { font-family: var(--trainer-font); }
body dialog { background: var(--trainer-bg); }
body .mode:hover { border-top-color: var(--trainer-card-stripe); }

body :is(button.primary, button.btn, a.btn, input[type="submit"]) {
  color: var(--trainer-cream);
  background: var(--trainer-cobalt);
  border: 1.5px solid transparent;
  border-radius: 18px;
  filter: none;
}
body :is(.primary, .btn):is(.apr, .accent),
body :is(.primary:not(.secondary), .btn:not(.sec, .ghost, .alt, .secondary)) +
  :is(.primary:not(.secondary), .btn:not(.sec, .ghost, .alt, .secondary)) {
  color: var(--trainer-bg);
  background: var(--trainer-orange);
}
body :is(.primary, .btn):is(.gold, .yellow),
body :is(.primary:not(.secondary), .btn:not(.sec, .ghost, .alt, .secondary)) +
  :is(.primary:not(.secondary), .btn:not(.sec, .ghost, .alt, .secondary)) +
  :is(.primary:not(.secondary), .btn:not(.sec, .ghost, .alt, .secondary)) {
  color: var(--trainer-bg);
  background: var(--trainer-gold);
}
body :is(button.secondary, a.secondary, button.ghost, .btn.sec, .btn.ghost, .btn.alt, .btn.secondary) {
  color: var(--trainer-cream);
  background: transparent;
  border: 1.5px solid var(--trainer-cream);
  border-radius: 18px;
}
body :is(.primary, .btn, .secondary):hover:not(:disabled) { filter: none; border-color: var(--trainer-cream); }
body :is(button, a, input, summary, select):focus-visible {
  outline: 2px solid var(--trainer-blue);
  outline-offset: 3px;
}
body :is(.chip, .tag, .grade-tag, .pill, .visual-pill, .tile, .tabs button, .segmented button) {
  color: var(--trainer-blue);
  background: transparent;
  border-color: var(--trainer-blue);
}
body :is(.chip, .tabs button, .segmented button):is(.on, .active, [aria-pressed="true"]) {
  color: var(--trainer-gold);
  background: transparent;
  border-color: var(--trainer-gold);
}
body :is(.stage-link, .row, .choice, .opt) { color: var(--trainer-cream); }
body :is(.stage-link.active, .row.run, .choice.selected, .opt.sel) {
  border-color: var(--trainer-gold);
}
body :is(.stage-link.done, .row.ok, .row.passed, .row.pass) {
  border-color: var(--trainer-moss);
}
body :is(.row.help, .choice.wrong, .opt.bad, input.bad, [aria-invalid="true"]) {
  border-color: var(--trainer-orange);
}
body :is(.feedback.good, .fb.ok, .msg.good, .done:not(button, .stage-link), .ok:not(input, .row, .opt)) {
  color: var(--trainer-gold);
}
body :is(.feedback.retry, .fb.bad, .msg.bad, .bad:not(input, .opt)) {
  color: var(--trainer-orange);
}
body :is(.feedback.good, .fb.ok) {
  border-color: var(--trainer-gold);
  background: #E2B04A15;
}
body :is(.feedback.retry, .fb.bad) {
  border-color: var(--trainer-orange);
  background: #DD7A3A15;
}
body :is(.stage-link.done .stage-index, .row.ok .num) {
  background: var(--trainer-moss);
  color: var(--trainer-cream);
}
body :is(#progress-fill, .progress-fill, .progress-track > i) { background: var(--trainer-gold); }

body :is(.qbig, .question, .expr, .fx, .cond, .stmt, .bar-equation) {
  font-family: var(--trainer-font);
  font-variant-numeric: tabular-nums;
}
body :is(.qbig, .expr, .fx, .bar-equation, .question:has(> .trainer-math, > .formula), .cond, .stmt):not(:has(svg:not(.trainer-root-mark, .radical-mark, .rs), canvas)) {
  background: var(--trainer-cream);
  color: var(--trainer-bg);
  border: 1px solid transparent;
  border-radius: 18px;
  padding: .45em .65em;
}
body :is(.qbig, .expr, .fx, .bar-equation, .question:has(> .trainer-math), .question:has(> .formula), .cond, .stmt)
  :is(.fr, .rad, .ov, .formula, .rs, .rs path, .rt, .ro, .q, .mid, .ex, .key, .trainer-math) {
  color: inherit;
}
body :is(.qbig, .expr, .fx, .cond, .stmt) .rs path { stroke: currentColor; }
body :is(.qbig, .expr, .fx, .cond, .stmt) .ov { border-top-color: currentColor; }
body .rad .ov { padding-top: .16em; }
.trainer-math, .trainer-root { display: inline-block; white-space: nowrap; }
.trainer-root, .rt:has(> .trainer-root-mark) { position: relative; display: inline-block; padding-left: .74em; }
.trainer-root-mark { position: absolute; left: 0; top: 0; width: .77em; height: 100%; overflow: visible; }
.trainer-radicand, .rt:has(> .trainer-root-mark) > .ro {

  line-height: 1.15;
}
.trainer-frac {
  display: inline-grid;
  vertical-align: middle;
  text-align: center;
  font-size: .92em;
  line-height: 1.12;
}
.trainer-frac > span { padding: .07em .18em; }
.trainer-frac > span:first-child { border-bottom: .075em solid currentColor; }

body .route-progress { padding: 10px 16px; }
body :is(.anchor-card small, .route-progress small) { color: var(--trainer-sand); }
body .row.run .stt { color: var(--trainer-gold); }
body .row.help .stt { color: var(--trainer-orange); }
body :is(input:not([type]), input[type="text"], input[type="number"], input[type="search"], textarea, select) {
  background-color: var(--trainer-bg);
  color: var(--trainer-cream);
  border-color: var(--trainer-border);
}
body :is(input, textarea)::placeholder { color: var(--trainer-sand); opacity: 1; }
body :is(input.bad, [aria-invalid="true"]) { border-color: var(--trainer-orange); }
body :is(input.ok, input.good) { border-color: var(--trainer-gold); }
body a:not(:where(.brand, .btn, .secondary, .pill, .chip, .breadcrumb a)) {
  color: var(--trainer-blue) !important;
}

/* Cycle all six accents through repeated controls. Text stays light on dark. */
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row) { --trainer-item: var(--trainer-cobalt); }
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row):nth-child(6n + 2) { --trainer-item: var(--trainer-gold); }
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row):nth-child(6n + 3) { --trainer-item: var(--trainer-orange); }
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row):nth-child(6n + 4) { --trainer-item: var(--trainer-blue); }
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row):nth-child(6n + 5) { --trainer-item: var(--trainer-moss); }
body :is(.stage-link, .tabs button, .segmented button, .chips .chip, .hint-row):nth-child(6n + 6) { --trainer-item: var(--trainer-caramel); }
body :is(.tabs button, .segmented button, .chips .chip):not(.on, .active, [aria-pressed="true"]) {
  color: var(--trainer-cream);
  border-color: var(--trainer-item);

  <script>
window.TrainerData={"id":"kvadratnye-neravenstva","version":1,"title":"Квадратные неравенства · lili.math","heading":"Квадратные неравенства","subtitle":"Читай знак по параболе и записывай решение промежутками.","description":"Шесть этапов, 24 задания и графики для решения квадратных неравенств.","grade":"8 класс","stages":[{"name":"Что ищем","subtitle":"Выше или ниже оси","title":"Как читать неравенство","anchor":"Плюс выше оси, минус ниже.","anchorNote":"На самой оси значение выражения равно нулю.","tasks":[{"kind":"choice","q":"Как называется запись 3x² − 7x \u003c 0?","options":["Кубическое неравенство","Линейное неравенство","Квадратное неравенство","Квадратное уравнение"],"answer":"Квадратное неравенство","before":"Запись x² + 5 > 0 задаёт квадратное неравенство: старшая степень равна 2, справа 0.","see":"Посмотри на старшую степень и знак сравнения.","similar":"Запись x² + 5 > 0 задаёт квадратное неравенство: старшая степень равна 2, справа 0.","algorithm":"Приведи подобные и проверь степень.","retry":"Сравни степень старшего члена с двумя и проверь знак между частями.","steps":["Старшая степень 2.","Знак \u003c задаёт неравенство.","Это квадратное неравенство."],"unit":""},{"kind":"choice","q":"Какой коэффициент стоит при x² в записи −x² + 3x ≥ 4?","options":["4","1","3","−1"],"answer":"−1","before":"В записи −x² + 5 > 0 перед x² стоит знак минус. Это сокращённая запись произведения (−1) · x².","see":"У члена −x² числовой множитель виден по знаку.","similar":"В записи −x² + 5 > 0 перед x² стоит знак минус. Это сокращённая запись произведения (−1) · x².","algorithm":"Запиши −x² как произведение числа и x².","retry":"Сохрани минус перед x².","steps":["−x² = (−1) · x².","Коэффициент при x² равен −1."],"unit":""},{"kind":"choice","q":"Куда направлены ветви графика y = 4 − 2x²?","options":["Вниз","Вверх"],"answer":"Вниз","before":"У графика y = 6 − 3x² коэффициент при x² равен −3, поэтому ветви направлены вниз.","see":"Найди член с x², даже если он записан вторым.","similar":"У графика y = 6 − 3x² коэффициент при x² равен −3, поэтому ветви направлены вниз.","algorithm":"Прочитай коэффициент при x² и определи его знак.","retry":"Число 4 задаёт свободный член. Посмотри на число перед x².","steps":["Коэффициент при x² равен −2.","При отрицательном коэффициенте ветви направлены вниз."],"unit":""},{"kind":"choice","q":"Где на графике лежат точки, для которых x² − 4 \u003c 0?","options":["Выше оси x","На оси x","Ниже оси x"],"answer":"Ниже оси x","before":"У графика y = x² − 9 при x = 0 получаем y = −9. Точка ниже оси x, поэтому x = 0 подходит для x² − 9 \u003c 0.","see":"Вертикальная координата равна значению выражения.","similar":"У графика y = x² − 9 при x = 0 получаем y = −9. Точка ниже оси x, поэтому x = 0 подходит для x² − 9 \u003c 0.","algorithm":"Представь y = x² − 4 и определи, где y \u003c 0.","retry":"У точек ниже горизонтальной оси вертикальная координата отрицательная.","steps":["Требуется y \u003c 0.","У всех таких точек ордината отрицательная.","Ищем часть графика ниже оси x."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Квадратное неравенство\u003c/strong> – неравенство, которое после приведения к одной части имеет вид ax² + bx + c > 0, \u003c 0, ≥ 0 или ≤ 0, где a ≠ 0.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Коэффициент при квадрате\u003c/h4>\u003cp>Прочитай числовой множитель при x². Он задаёт направление ветвей.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">a = 1 → ветви вверх\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Что значит решить\u003c/h4>\u003cp>Найди все значения x, при которых сравнение верно. Подставь x = 0 в показанное выражение.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">0² − 1 = −1 \u003c 0\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Как читать график\u003c/h4>\u003cp>Высота точки равна значению выражения. При отрицательном значении точка ниже горизонтальной оси.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">y = x² − 1 → при x = 0 точка ниже оси x\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² − 1. Пересечений с осью x: 2.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 -150.00 Q 310 438.80 580.00 -150.00\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ccircle cx=\"242.50\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"242.50\" y=\"151\" text-anchor=\"middle\">−1\u003c/text>\u003ccircle cx=\"377.50\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"377.50\" y=\"151\" text-anchor=\"middle\">1\u003c/text>\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = x² − 1\u003c/text>\u003c/svg>\u003c/section>"},{"name":"Два корня","subtitle":"Строгий знак","title":"Выбираем промежуток по графику","anchor":"Два корня делят прямую на три части.","anchorNote":"Знак ∪ объединяет два промежутка.","tasks":[{"kind":"choice","q":"Реши x² − 2x − 3 \u003c 0.","options":["[−1; 3]","(−1; 3)","(−∞; −1] ∪ [3; +∞)","(−∞; −1) ∪ (3; +∞)"],"answer":"(−1; 3)","before":"Для x² − 9 \u003c 0 корни −3 и 3. Ветви вверх, поэтому график ниже оси между корнями. Строгий знак даёт (−3; 3).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² − 9 \u003c 0 корни −3 и 3. Ветви вверх, поэтому график ниже оси между корнями. Строгий знак даёт (−3; 3).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = x² − 2x − 3.","Находим нули выражения из уравнения x² − 2x − 3 = 0. D = (−2)² − 4 · (1) · (−3) = 16 > 0. Получаем x₁ = −1 и x₂ = 3.","Ветви направлены вверх. График ниже оси x между корнями.","Исключаем оба корня: знак строгий.","Ответ (−1; 3)."],"unit":""},{"kind":"choice","q":"Реши x² + 2x − 8 > 0.","options":["(−4; 2)","[−4; 2]","(−∞; −4] ∪ [2; +∞)","(−∞; −4) ∪ (2; +∞)"],"answer":"(−∞; −4) ∪ (2; +∞)","before":"Для x² − 4 > 0 корни −2 и 2. Ветви вверх, поэтому график выше оси по краям. Ответ (−∞; −2) ∪ (2; +∞).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² − 4 > 0 корни −2 и 2. Ветви вверх, поэтому график выше оси по краям. Ответ (−∞; −2) ∪ (2; +∞).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = x² + 2x − 8.","Находим нули выражения из уравнения x² + 2x − 8 = 0. D = (2)² − 4 · (1) · (−8) = 36 > 0. Получаем x₁ = −4 и x₂ = 2.","Ветви направлены вверх. График выше оси x слева от меньшего и справа от большего корня.","Исключаем оба корня: знак строгий.","Ответ (−∞; −4) ∪ (2; +∞)."],"unit":""},{"kind":"choice","q":"Реши x² − 3x − 10 \u003c 0.","options":["(−2; 5)","[−2; 5]","(−∞; −2) ∪ (5; +∞)","(−∞; −2] ∪ [5; +∞)"],"answer":"(−2; 5)","before":"Для x² − 9 \u003c 0 корни −3 и 3. Ветви вверх, поэтому график ниже оси между корнями. Строгий знак даёт (−3; 3).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² − 9 \u003c 0 корни −3 и 3. Ветви вверх, поэтому график ниже оси между корнями. Строгий знак даёт (−3; 3).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = x² − 3x − 10.","Находим нули выражения из уравнения x² − 3x − 10 = 0. D = (−3)² − 4 · (1) · (−10) = 49 > 0. Получаем x₁ = −2 и x₂ = 5.","Ветви направлены вверх. График ниже оси x между корнями.","Исключаем оба корня: знак строгий.","Ответ (−2; 5)."],"unit":""},{"kind":"choice","q":"Реши 2x² − 6x > 0.","options":["(−∞; 0) ∪ (3; +∞)","(−∞; 0] ∪ [3; +∞)","(0; 3)","[0; 3]"],"answer":"(−∞; 0) ∪ (3; +∞)","before":"Для x² − 4 > 0 корни −2 и 2. Ветви вверх, поэтому график выше оси по краям. Ответ (−∞; −2) ∪ (2; +∞).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² − 4 > 0 корни −2 и 2. Ветви вверх, поэтому график выше оси по краям. Ответ (−∞; −2) ∪ (2; +∞).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = 2x² − 6x.","Находим нули выражения из уравнения 2x² − 6x = 0. D = (−6)² − 4 · (2) · (0) = 36 > 0. Получаем x₁ = 0 и x₂ = 3.","Ветви направлены вверх. График выше оси x слева от меньшего и справа от большего корня.","Исключаем оба корня: знак строгий.","Ответ (−∞; 0) ∪ (3; +∞)."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Нуль квадратного трёхчлена\u003c/strong> – значение x, при котором трёхчлен равен нулю. На графике это абсцисса общей точки параболы и оси x.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Сначала находим корни\u003c/h4>\u003cp>Чтобы определить границы, временно решаем уравнение. Можно разложить трёхчлен на множители. Для общего случая вычисли дискриминант D = b² − 4ac. При D &gt; 0 корни находят по формуле (−b ± √D)/(2a).\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² − 9 = 0 → x₁ = −3, x₂ = 3\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Читаем ветви вверх\u003c/h4>\u003cp>Между корнями парабола ниже оси. Слева и справа от корней она выше.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">−3 \u003c x \u003c 3 → x² − 9 \u003c 0\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Записываем строгий ответ\u003c/h4>\u003cp>При \u003c или > значение 0 исключаем. Открытые границы отмечаем круглыми скобками.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">(−3; 3)\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² − 9. Пересечений с осью x: 2.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 67.45 Q 310 335.09 580.00 67.45\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ccircle cx=\"107.50\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"107.50\" y=\"151\" text-anchor=\"middle\">−3\u003c/text>\u003ccircle cx=\"512.50\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"512.50\" y=\"151\" text-anchor=\"middle\">3\u003c/text>\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = x² − 9\u003c/text>\u003c/svg>\u003csvg class=\"parabola\" viewBox=\"0 0 620 107\" role=\"img\" aria-label=\"На прямой выделен промежуток (−3; 3)\">\n    \u003crect width=\"620\" height=\"107\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003cpath d=\"M32 34H588l-10 -5m10 5l-10 5 M310 28V40\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\n    \u003cpath d=\"M180 34H440\" stroke=\"#AB4D24\" stroke-width=\"7\"/>\n    \u003cg fill=\"#F9F0DF\" stroke=\"#AB4D24\" stroke-width=\"3\">\u003ccircle cx=\"180\" cy=\"34\" r=\"7\"/>\u003ccircle cx=\"440\" cy=\"34\" r=\"7\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\">\u003ctext x=\"180\" y=\"65\">−3\u003c/text>\u003ctext x=\"310\" y=\"65\">0\u003c/text>\u003ctext x=\"440\" y=\"65\">3\u003c/text>\u003ctext x=\"598\" y=\"28\">x\u003c/text>\u003ctext x=\"310\" y=\"93\">(−3; 3)\u003c/text>\u003c/g>\n    \u003c/svg>\u003c/section>"},{"name":"Границы и ветви","subtitle":"Знаки ≤ и ≥","title":"Как меняются промежутки","anchor":"Проверь ветви и знак отдельно.","anchorNote":"Знаки ≤ и ≥ включают корни. Знаки \u003c и > исключают их.","tasks":[{"kind":"choice","q":"Реши x² − 3x − 4 ≤ 0.","options":["[−1; 4]","(−∞; −1] ∪ [4; +∞)","(−∞; −1) ∪ (4; +∞)","(−1; 4)"],"answer":"[−1; 4]","before":"Для x² − 16 ≤ 0 корни −4 и 4. Ниже оси график между ними. При равенстве подходят и сами корни, поэтому ответ [−4; 4].","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² − 16 ≤ 0 корни −4 и 4. Ниже оси график между ними. При равенстве подходят и сами корни, поэтому ответ [−4; 4].","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = x² − 3x − 4.","Находим нули выражения из уравнения x² − 3x − 4 = 0. D = (−3)² − 4 · (1) · (−4) = 25 > 0. Получаем x₁ = −1 и x₂ = 4.","Ветви направлены вверх. График ниже оси x между корнями.","Включаем оба корня: знак допускает равенство.","Ответ [−1; 4]."],"unit":""},{"kind":"choice","q":"Реши −x² + 3x + 10 ≥ 0.","options":["(−∞; −2) ∪ (5; +∞)","(−∞; −2] ∪ [5; +∞)","(−2; 5)","[−2; 5]"],"answer":"[−2; 5]","before":"Для 9 − x² ≥ 0 корни −3 и 3. Ветви вниз, график выше оси между корнями. Включаем границы и получаем [−3; 3].","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для 9 − x² ≥ 0 корни −3 и 3. Ветви вниз, график выше оси между корнями. Включаем границы и получаем [−3; 3].","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = −x² + 3x + 10.","Находим нули выражения из уравнения −x² + 3x + 10 = 0. D = (3)² − 4 · (−1) · (10) = 49 > 0. Получаем x₁ = −2 и x₂ = 5.","Ветви направлены вниз. График выше оси x между корнями.","Включаем оба корня: знак допускает равенство.","Ответ [−2; 5]."],"unit":""},{"kind":"choice","q":"Реши −2x² − 4x + 6 \u003c 0.","options":["[−3; 1]","(−3; 1)","(−∞; −3] ∪ [1; +∞)","(−∞; −3) ∪ (1; +∞)"],"answer":"(−∞; −3) ∪ (1; +∞)","before":"У 4 − x² \u003c 0 график ниже оси снаружи. Ответ (−∞; −2) ∪ (2; +∞).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"У 4 − x² \u003c 0 график ниже оси снаружи. Ответ (−∞; −2) ∪ (2; +∞).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = −2x² − 4x + 6.","Находим нули выражения из уравнения −2x² − 4x + 6 = 0. D = (−4)² − 4 · (−2) · (6) = 64 > 0. Получаем x₁ = −3 и x₂ = 1.","Ветви направлены вниз. График ниже оси x слева от меньшего и справа от большего корня.","Исключаем оба корня: знак строгий.","Ответ (−∞; −3) ∪ (1; +∞)."],"unit":""},{"kind":"choice","q":"Реши x² + 3x ≥ 0.","options":["[−3; 0]","(−∞; −3) ∪ (0; +∞)","(−∞; −3] ∪ [0; +∞)","(−3; 0)"],"answer":"(−∞; −3] ∪ [0; +∞)","before":"У x² − 1 ≥ 0 график выше оси снаружи, нули подходят. Ответ (−∞; −1] ∪ [1; +∞).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"У x² − 1 ≥ 0 график выше оси снаружи, нули подходят. Ответ (−∞; −1] ∪ [1; +∞).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Справа уже стоит 0. Рассматриваем график y = x² + 3x.","Находим нули выражения из уравнения x² + 3x = 0. D = (3)² − 4 · (1) · (0) = 9 > 0. Получаем x₁ = −3 и x₂ = 0.","Ветви направлены вверх. График выше оси x слева от меньшего и справа от большего корня.","Включаем оба корня: знак допускает равенство.","Ответ (−∞; −3] ∪ [0; +∞)."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Нестрогое неравенство\u003c/strong> – неравенство со знаком ≤ или ≥, допускающее равенство сравниваемых частей.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Разворачиваем параболу\u003c/h4>\u003cp>У параболы с ветвями вниз между корнями значения положительные, а снаружи отрицательные.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">4 − x² > 0 → (−2; 2)\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Включаем корни\u003c/h4>\u003cp>При ≥ значение 0 тоже подходит. Конечные границы включаем квадратными скобками.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">4 − x² ≥ 0 → [−2; 2]\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Оставляем круглую скобку у бесконечности\u003c/h4>\u003cp>Бесконечность обозначает, что промежуток продолжается без границы.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">4 − x² ≤ 0 → (−∞; −2] ∪ [2; +∞)\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = −x² + 4. Пересечений с осью x: 2.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 310.00 Q 310 -180.67 580.00 310.00\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ccircle cx=\"175.00\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"175.00\" y=\"151\" text-anchor=\"middle\">−2\u003c/text>\u003ccircle cx=\"445.00\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"445.00\" y=\"151\" text-anchor=\"middle\">2\u003c/text>\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = −x² + 4\u003c/text>\u003c/svg>\u003csvg class=\"parabola\" viewBox=\"0 0 620 107\" role=\"img\" aria-label=\"На прямой выделен промежуток [−2; 2]\">\n    \u003crect width=\"620\" height=\"107\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003cpath d=\"M32 34H588l-10 -5m10 5l-10 5 M310 28V40\" fill=\"none\" stroke=\"#16231A\" stroke-width=\"2\"/>\n    \u003cpath d=\"M180 34H440\" stroke=\"#AB4D24\" stroke-width=\"7\"/>\n    \u003cg fill=\"#AB4D24\" stroke=\"#AB4D24\" stroke-width=\"3\">\u003ccircle cx=\"180\" cy=\"34\" r=\"7\"/>\u003ccircle cx=\"440\" cy=\"34\" r=\"7\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" text-anchor=\"middle\" font-family=\"system-ui,sans-serif\" font-size=\"20\">\u003ctext x=\"180\" y=\"65\">−2\u003c/text>\u003ctext x=\"310\" y=\"65\">0\u003c/text>\u003ctext x=\"440\" y=\"65\">2\u003c/text>\u003ctext x=\"598\" y=\"28\">x\u003c/text>\u003ctext x=\"310\" y=\"93\">[−2; 2]\u003c/text>\u003c/g>\n    \u003c/svg>\u003c/section>"},{"name":"Один корень","subtitle":"Точка касания","title":"Что происходит при D = 0","anchor":"В точке касания выражение равно нулю.","anchorNote":"По обе стороны от точки график остаётся на одной стороне оси.","tasks":[{"kind":"choice","q":"Реши x² − 2x + 1 > 0.","options":["{1}","∅","ℝ","(−∞; 1) ∪ (1; +∞)"],"answer":"(−∞; 1) ∪ (1; +∞)","before":"Для (x − 4)² > 0 выражение положительно всюду, кроме x = 4. Ответ (−∞; 4) ∪ (4; +∞).","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для (x − 4)² > 0 выражение положительно всюду, кроме x = 4. Ответ (−∞; 4) ∪ (4; +∞).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Проверь отдельно точку касания и все остальные точки: только в точке касания значение равно нулю.","steps":["Справа уже стоит 0. Рассматриваем график y = x² − 2x + 1.","Находим нули выражения из уравнения x² − 2x + 1 = 0. D = 0. Единственный корень x = 1.","График касается оси x при x = 1. При остальных x он расположен выше оси.","Точку касания исключаем: знак строгий.","Ответ (−∞; 1) ∪ (1; +∞)."],"unit":""},{"kind":"choice","q":"Реши −x² − 4x − 4 ≥ 0.","options":["{−2}","(−∞; −2) ∪ (−2; +∞)","∅","ℝ"],"answer":"{−2}","before":"Для −(x + 3)² ≥ 0 выражение всегда неположительно. Подходит только x = −3, где значение равно нулю.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для −(x + 3)² ≥ 0 выражение всегда неположительно. Подходит только x = −3, где значение равно нулю.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Проверь отдельно точку касания и все остальные точки: только в точке касания значение равно нулю.","steps":["Справа уже стоит 0. Рассматриваем график y = −x² − 4x − 4.","Находим нули выражения из уравнения −x² − 4x − 4 = 0. D = 0. Единственный корень x = −2.","График касается оси x при x = −2. При остальных x он расположен ниже оси.","Точка касания входит в решение: равенство разрешено.","Ответ {−2}."],"unit":""},{"kind":"choice","q":"Реши 2x² − 12x + 18 ≥ 0.","options":["∅","(−∞; 3) ∪ (3; +∞)","{3}","ℝ"],"answer":"ℝ","before":"Квадрат (x − 1)² при любом x либо положителен, либо равен 0. Для ≥ 0 подходят все действительные числа ℝ.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Квадрат (x − 1)² при любом x либо положителен, либо равен 0. Для ≥ 0 подходят все действительные числа ℝ.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Проверь отдельно точку касания и все остальные точки: только в точке касания значение равно нулю.","steps":["Справа уже стоит 0. Рассматриваем график y = 2x² − 12x + 18.","Находим нули выражения из уравнения 2x² − 12x + 18 = 0. D = 0. Единственный корень x = 3.","График касается оси x при x = 3. При остальных x он расположен выше оси.","Точка касания входит в решение: равенство разрешено.","Ответ ℝ."],"unit":""},{"kind":"choice","q":"Реши x² + 2x + 1 \u003c 0.","options":["∅","ℝ","{−1}","(−∞; −1) ∪ (−1; +∞)"],"answer":"∅","before":"Квадрат (x − 4)² неотрицателен. Для знака \u003c 0 решений нет, ∅.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Квадрат (x − 4)² неотрицателен. Для знака \u003c 0 решений нет, ∅.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Проверь отдельно точку касания и все остальные точки: только в точке касания значение равно нулю.","steps":["Справа уже стоит 0. Рассматриваем график y = x² + 2x + 1.","Находим нули выражения из уравнения x² + 2x + 1 = 0. D = 0. Единственный корень x = −1.","График касается оси x при x = −1. При остальных x он расположен выше оси.","Точку касания исключаем: знак строгий.","Ответ ∅."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Дискриминант\u003c/strong> – число D = b² − 4ac, по знаку которого определяют число действительных корней квадратного уравнения.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Проверяем точку касания\u003c/h4>\u003cp>При D = 0 парабола касается оси x в одной точке.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">(x − 2)² = 0 → x = 2\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверяем остальные точки\u003c/h4>\u003cp>Квадрат положителен при любом ненулевом основании. У ветвей вниз знак на остальных точках отрицательный.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">(x − 2)² > 0 → x ≠ 2\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Сравниваем со знаком\u003c/h4>\u003cp>Если просят значения ≤ 0, то у квадрата подходит только точка касания. Фигурные скобки обозначают множество из одного числа.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">(x − 2)² ≤ 0 → {2}\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² − 4x + 4. Пересечений с осью x: 1.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 -536.40 Q 310 346.80 580.00 52.40\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ccircle cx=\"445.00\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"445.00\" y=\"151\" text-anchor=\"middle\">2\u003c/text>\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = x² − 4x + 4\u003c/text>\u003c/svg>\u003c/section>"},{"name":"Нет корней","subtitle":"Один знак везде","title":"Что происходит при D \u003c 0","anchor":"Когда корней нет, смотри на a.","anchorNote":"ℝ означает все действительные числа.","tasks":[{"kind":"choice","q":"Реши x² + 7 ≤ 0.","options":["ℝ","Только x > 0","Только x = 0","∅"],"answer":"∅","before":"Для x² + 4 ≤ 0 корней нет. График целиком выше оси, поэтому решений нет, ∅.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² + 4 ≤ 0 корней нет. График целиком выше оси, поэтому решений нет, ∅.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"При D \u003c 0 знак выражения везде совпадает со знаком коэффициента при x².","steps":["Справа уже стоит 0. Рассматриваем график y = x² + 7.","Находим нули выражения из уравнения x² + 7 = 0. D = −28 \u003c 0. Действительных корней нет.","Вся парабола лежит выше оси x. Выражение при любом x положительно.","Сравни этот постоянный знак со знаком неравенства.","Ответ ∅."],"unit":""},{"kind":"choice","q":"Реши −x² − 2 \u003c 0.","options":["∅","Только x > 0","Только x = 0","ℝ"],"answer":"ℝ","before":"Для −x² − 5 \u003c 0 корней нет. График целиком ниже оси, поэтому подходит любое действительное число, ℝ.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для −x² − 5 \u003c 0 корней нет. График целиком ниже оси, поэтому подходит любое действительное число, ℝ.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"При D \u003c 0 знак выражения везде совпадает со знаком коэффициента при x².","steps":["Справа уже стоит 0. Рассматриваем график y = −x² − 2.","Находим нули выражения из уравнения −x² − 2 = 0. D = −8 \u003c 0. Действительных корней нет.","Вся парабола лежит ниже оси x. Выражение при любом x отрицательно.","Сравни этот постоянный знак со знаком неравенства.","Ответ ℝ."],"unit":""},{"kind":"choice","q":"Реши x² − 2x + 2 > 0.","options":["Только x = 0","Только x > 0","ℝ","∅"],"answer":"ℝ","before":"Для x² + 2x + 3 = (x + 1)² + 2 значения всегда положительны. Для > 0 ответ ℝ.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для x² + 2x + 3 = (x + 1)² + 2 значения всегда положительны. Для > 0 ответ ℝ.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"При D \u003c 0 знак выражения везде совпадает со знаком коэффициента при x².","steps":["Справа уже стоит 0. Рассматриваем график y = x² − 2x + 2.","Находим нули выражения из уравнения x² − 2x + 2 = 0. D = −4 \u003c 0. Действительных корней нет.","Вся парабола лежит выше оси x. Выражение при любом x положительно.","Сравни этот постоянный знак со знаком неравенства.","Ответ ℝ."],"unit":""},{"kind":"choice","q":"Реши −2x² + 4x − 5 ≥ 0.","options":["ℝ","Только x = 0","Только x > 0","∅"],"answer":"∅","before":"Для −x² + 2x − 5 = −(x − 1)² − 4 значения всегда отрицательны. Для ≥ 0 ответ ∅.","see":"Посмотри на знак коэффициента при x² и найди дискриминант.","similar":"Для −x² + 2x − 5 = −(x − 1)² − 4 значения всегда отрицательны. Для ≥ 0 ответ ∅.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"При D \u003c 0 знак выражения везде совпадает со знаком коэффициента при x².","steps":["Справа уже стоит 0. Рассматриваем график y = −2x² + 4x − 5.","Находим нули выражения из уравнения −2x² + 4x − 5 = 0. D = −24 \u003c 0. Действительных корней нет.","Вся парабола лежит ниже оси x. Выражение при любом x отрицательно.","Сравни этот постоянный знак со знаком неравенства.","Ответ ∅."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Пустое множество\u003c/strong> – множество без элементов. Знак ∅ в ответе означает, что подходящих значений x нет.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Определяем число корней\u003c/h4>\u003cp>При отрицательном дискриминанте парабола не пересекает ось x и не касается её.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² + 3 → D = −12 \u003c 0\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Смотрим на направление ветвей\u003c/h4>\u003cp>Ветви вверх дают положительные значения при всех x. Для ветвей вниз все значения отрицательные.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² + 3 > 0 при любом x\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Сравниваем с условием\u003c/h4>\u003cp>Здесь все значения положительны, поэтому для ≤ 0 не подходит ни одно.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² + 3 ≤ 0 → ∅\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² + 3. Пересечений с осью x: 0.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 -223.60 Q 310 365.20 580.00 -223.60\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = x² + 3\u003c/text>\u003c/svg>\u003c/section>"},{"name":"Смешанная практика","subtitle":"Полное решение","title":"Приводим к нулю и решаем","anchor":"Сначала ноль справа, затем корни, ветви и границы.","anchorNote":"Проверь ответ подстановкой одного числа из выбранного промежутка.","tasks":[{"kind":"choice","q":"Реши x² − 3x + 1 ≤ 5.","options":["(−∞; −1] ∪ [4; +∞)","[−1; 4]","(−1; 4)","(−∞; −1) ∪ (4; +∞)"],"answer":"[−1; 4]","before":"Для x² + 3 ≤ 7 вычитаем 7. У x² − 4 ≤ 0 подходят точки между −2 и 2 с границами. Ответ [−2; 2].","see":"Сначала перенеси все слагаемые в одну часть и оставь справа ноль.","similar":"Для x² + 3 ≤ 7 вычитаем 7. У x² − 4 ≤ 0 подходят точки между −2 и 2 с границами. Ответ [−2; 2].","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Приводим к виду x² − 3x − 4 ≤ 0. Вычитаем 5 из обеих частей.","Находим нули выражения из уравнения x² − 3x − 4 = 0. D = (−3)² − 4 · (1) · (−4) = 25 > 0. Получаем x₁ = −1 и x₂ = 4.","Ветви направлены вверх. График ниже оси x между корнями.","Включаем оба корня: знак допускает равенство.","Ответ [−1; 4]."],"unit":""},{"kind":"choice","q":"Реши 4x − x² ≥ 4.","options":["∅","{2}","ℝ","(−∞; 2) ∪ (2; +∞)"],"answer":"{2}","before":"Из 2x − x² ≥ 1 после вычитания 1 получится −(x − 1)² ≥ 0. Подходит только x = 1.","see":"Сначала перенеси все слагаемые в одну часть и оставь справа ноль.","similar":"Из 2x − x² ≥ 1 после вычитания 1 получится −(x − 1)² ≥ 0. Подходит только x = 1.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Проверь отдельно точку касания и все остальные точки: только в точке касания значение равно нулю.","steps":["Приводим к виду −x² + 4x − 4 ≥ 0. Вычитаем 4 из обеих частей.","Находим нули выражения из уравнения −x² + 4x − 4 = 0. D = 0. Единственный корень x = 2.","График касается оси x при x = 2. При остальных x он расположен ниже оси.","Точка касания входит в решение: равенство разрешено.","Ответ {2}."],"unit":""},{"kind":"choice","q":"Реши 2x² \u003c x.","options":["(−∞; 0) ∪ (1/2; +∞)","[0; 1/2]","(−∞; 0] ∪ [1/2; +∞)","(0; 1/2)"],"answer":"(0; 1/2)","before":"Из 3x² \u003c 2x получаем x · (3x − 2) \u003c 0. Корни 0 и 2/3, ветви вверх. Ответ (0; 2/3).","see":"Сначала перенеси все слагаемые в одну часть и оставь справа ноль.","similar":"Из 3x² \u003c 2x получаем x · (3x − 2) \u003c 0. Корни 0 и 2/3, ветви вверх. Ответ (0; 2/3).","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Приводим к виду 2x² − x \u003c 0. Вычитаем x из обеих частей.","Находим нули выражения из уравнения 2x² − x = 0. D = (−1)² − 4 · (2) · (0) = 1 > 0. Получаем x₁ = 0 и x₂ = 1/2.","Ветви направлены вверх. График ниже оси x между корнями.","Исключаем оба корня: знак строгий.","Ответ (0; 1/2)."],"unit":""},{"kind":"choice","q":"Реши x² > 2.","options":["(−√2; √2)","(−∞; −√2] ∪ [√2; +∞)","(−∞; −√2) ∪ (√2; +∞)","[−√2; √2]"],"answer":"(−∞; −√2) ∪ (√2; +∞)","before":"Для x² > 3 корни уравнения x² = 3 равны −√3 и √3. Для строгого положительного знака выбираем два внешних промежутка с круглыми скобками.","see":"Сначала перенеси все слагаемые в одну часть и оставь справа ноль.","similar":"Для x² > 3 корни уравнения x² = 3 равны −√3 и √3. Для строгого положительного знака выбираем два внешних промежутка с круглыми скобками.","algorithm":"Найди нули. Определи, где график выше или ниже оси x. Проверь, входят ли нули в ответ.","retry":"Отдельно проверь, где график расположен относительно оси x и входит ли 0 в условие для значения выражения.","steps":["Приводим к виду x² − 2 > 0. Вычитаем 2 из обеих частей.","Находим нули выражения из уравнения x² − 2 = 0. D = (0)² − 4 · (1) · (−2) = 8 > 0. Получаем x₁ = −√2 и x₂ = √2.","Ветви направлены вверх. График выше оси x слева от меньшего и справа от большего корня.","Исключаем оба корня: знак строгий.","Ответ (−∞; −√2) ∪ (√2; +∞)."],"unit":""}],"intro":"\u003csection class=\"theory-topic\">\u003cp class=\"math-definition\">\u003cstrong>Равносильные неравенства\u003c/strong> – неравенства с одним и тем же множеством решений.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Собираем всё слева\u003c/h4>\u003cp>Вычти правую часть из обеих частей. Знак сравнения остаётся прежним.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² + 2 &gt; 6 → x² − 4 &gt; 0\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Упорядочиваем корни\u003c/h4>\u003cp>Записывай меньший корень слева. Уравнение может дать дробные или иррациональные корни.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">x² = 2 → x₁ = −√2, x₂ = √2\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверяем вид ответа\u003c/h4>\u003cp>Найди нужную часть параболы и уточни, входят ли границы. Если умножаешь или делишь обе части неравенства на отрицательное число, меняй знак на противоположный.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb class=\"whole-formula\">−x² ≥ −4 → x² ≤ 4 → [−2; 2]\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² − 4. Пересечений с осью x: 2.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" aria-hidden=\"true\">\n    \u003cg fill=\"none\" stroke=\"#D9C9AC\">\u003cpath d=\"M40.0 23V226\"/>\u003cpath d=\"M107.5 23V226\"/>\u003cpath d=\"M175.0 23V226\"/>\u003cpath d=\"M242.5 23V226\"/>\u003cpath d=\"M310.0 23V226\"/>\u003cpath d=\"M377.5 23V226\"/>\u003cpath d=\"M445.0 23V226\"/>\u003cpath d=\"M512.5 23V226\"/>\u003cpath d=\"M580.0 23V226\"/>\u003cpath d=\"M34 218.0H587\"/>\u003cpath d=\"M34 172.0H587\"/>\u003cpath d=\"M34 126.0H587\"/>\u003cpath d=\"M34 80.0H587\"/>\u003cpath d=\"M34 34.0H587\"/>\u003c/g>\n    \u003cg fill=\"#16231A\" stroke=\"#16231A\" stroke-width=\"2\">\u003cpath d=\"M33 126H587 M310 224V27\"/>\u003cpath d=\"M587 126l-9 -4v8z M310 27l-4 9h8z\"/>\u003c/g>\n    \u003cpath d=\"M 40.00 -58.00 Q 310 432.67 580.00 -58.00\" fill=\"none\" stroke=\"#AB4D24\" stroke-width=\"4.5\"/>\n    \u003c/svg>\n    \u003cg font-family=\"system-ui,sans-serif\" font-weight=\"650\" font-size=\"20\" fill=\"#16231A\">\u003ccircle cx=\"175.00\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"175.00\" y=\"151\" text-anchor=\"middle\">−2\u003c/text>\u003ccircle cx=\"445.00\" cy=\"126\" r=\"5\" fill=\"#AB4D24\"/>\u003ctext x=\"445.00\" y=\"151\" text-anchor=\"middle\">2\u003c/text>\u003ctext x=\"599\" y=\"119\">x\u003c/text>\u003ctext x=\"323\" y=\"36\">y\u003c/text>\u003ctext x=\"321\" y=\"150\">0\u003c/text>\u003c/g>\n    \u003crect x=\"17\" y=\"221\" width=\"586\" height=\"22\" rx=\"8\" fill=\"#F9F0DF\"/>\n    \u003ctext x=\"310\" y=\"239\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui,sans-serif\" font-weight=\"650\" fill=\"#16231A\">y = x² − 4\u003c/text>\u003c/svg>\u003c/section>"}],"recap":["Перенеси все слагаемые в левую часть, приведи подобные и оставь справа 0.","Найди корни уравнения ax² + bx + c = 0. При D > 0 их два, при D = 0 один, при D \u003c 0 корней нет.","При a > 0 ветви вверх, при a \u003c 0 вниз. Для > и ≥ ищи график выше оси x, для \u003c и ≤ ниже.","При ≥ или ≤ включи точки с y = 0. При строгом знаке исключи их.","Если корней нет, знак выражения совпадает со знаком a на всей числовой прямой."],"lab":{"title":"Как меняется положение параболы","intro":"Переключай графики и сравнивай их положение относительно оси x.","cases":[{"label":"Два корня · вверх","html":"\u003csvg class=\"parabola\" viewBox=\"0 0 620 252\" role=\"img\" aria-label=\"График y = x² − 4. Пересечений с осью x: 2.\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003crect width=\"620\" height=\"252\" rx=\"16\" fill=\"#F9F0DF\"/>\n    \u003csvg x=\"0\" y=\"22\" width=\"620\" height=\"205\" viewBox=\"0 22 620 205\" overflow=\"hidden\" a     if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${questionMarkup(t.q)}</h3><button type="button" class="secondary copy-question" id="copy-question">Скопировать текст</button><span class="copy-status" id="copy-status" role="status"></span>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" aria-pressed="${state.answers[key()]===String(o)}" ${solved?'disabled':''}>${choiceMarkup(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div><div class="choice-actions"><button class="primary" id="check-choice" ${solved?'disabled':''}>Проверить</button></div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    const optionButtons=[...document.querySelectorAll('[data-option]')];
    let selected=optionButtons.find(b=>b.getAttribute('aria-pressed')==='true');
    optionButtons.forEach(button=>button.addEventListener('click',()=>{
      optionButtons.forEach(option=>{
        const picked=option===button;
        option.setAttribute('aria-pressed',String(picked));
        option.classList.toggle('picked',picked);
        option.classList.remove('wrong');
      });
      selected=button;
      $('#feedback').replaceChildren();
    }));
    $('#check-choice')?.addEventListener('click',()=>{
      if(selected){check(String(t.options[Number(selected.dataset.option)]));return;}
      $('#feedback').textContent='Выбери один вариант ответа.';
    });
    $('#copy-question').addEventListener('click',async()=>{
      const text=[t.q,...(t.options||[])].join('\n');
      try{
        const clipboardCopied=await navigator.clipboard?.writeText(text).then(()=>true,()=>false);
        if(!clipboardCopied){
          const selection=document.createElement('textarea');
          selection.value=text;
          selection.style.position='fixed';
          selection.style.opacity='0';
          document.body.append(selection);
          selection.select();
          const copied=document.execCommand('copy');
          selection.remove();
          $('#copy-question').focus({preventScroll:true});
          if(!copied)throw new Error('Copy unavailable');
        }
        $('#copy-status').textContent='Скопировано';
      }catch{
        $('#copy-status').textContent='Выдели условие и скопируй вручную.';
      }
    });

    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});else $('#check-choice')?.focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
