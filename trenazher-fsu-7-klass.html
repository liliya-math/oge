<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211e">
<title>Тренажёр: формулы сокращённого умножения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="tren/core.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" id="backHome" href="materialy.html" aria-label="К материалам">←</a>
    <button class="back hide" id="backMenu" type="button" aria-label="В меню">←</button>
    <div class="brand">Формулы · <b>lili.math</b></div>
  </div>
  <div id="app"></div>
  <noscript>Для тренажёра нужен JavaScript.</noscript>
</div>
<script src="tren/core.js"></script>
<script>
(function(){
"use strict";
var T=TrenCore,u=T.u;

/* ---------- запись многочленов ---------- */
function poly(arr){                      // [[коэффициент, часть с переменной], ...]
  var s="";
  arr.forEach(function(p,i){
    var c=p[0],t=p[1],a=Math.abs(c),body=(a===1&&t)?t:(a+t);
    if(i===0) s+=(c<0?"−":"")+body; else s+=(c<0?" − ":" + ")+body;
  });
  return s;
}
function pickVar(){ return u.pick(["x","y","a","b","c","t","m"]); }
function sq(inside){ return "("+inside+")"+u.sup(2); }
function mkc(correct,cands){             // правильный вариант всегда первый, дальше три разных неверных
  var o=[correct];
  u.shuffle(cands).forEach(function(c){ if(o.length<4&&o.indexOf(c)<0) o.push(c); });
  return o;
}
function choice(q,sub,correct,cands,rev,formula){
  return {q:q,sub:sub,sm:true,opts:mkc(correct,cands),c:0,
    rev:q+" = <b>"+correct+"</b>"+'<span class="hint">'+formula+'</span>'};
}
var F_SUM="(a + b)² = a² + 2ab + b²";
var F_DIF="(a − b)² = a² − 2ab + b²";
var F_DSQ="a² − b² = (a − b)(a + b)";

/* ---------- свернуть ---------- */
function foldPool(){ return [
 {k:"sum",lab:"квадрат суммы",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,9),V2=v+u.sup(2);
   return choice(poly([[1,V2],[2*n,v],[n*n,""]]),"Какое выражение равно данному?",
     sq(v+" + "+n),[sq(v+" − "+n),sq(v+" + "+n*n),sq(v+" + "+2*n),"("+v+" + "+n+")("+v+" − "+n+")"],null,F_SUM); }},
 {k:"dif",lab:"квадрат разности",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,9),V2=v+u.sup(2);
   return choice(poly([[1,V2],[-2*n,v],[n*n,""]]),"Какое выражение равно данному?",
     sq(v+" − "+n),[sq(v+" + "+n),sq(v+" − "+2*n),sq(v+" − "+n*n),"("+v+" − "+n+")("+v+" + "+n+")"],null,F_DIF); }},
 {k:"dsq",lab:"разность квадратов",gen:function(){
   var v=u.v(pickVar()),m=u.ri(2,12),V2=v+u.sup(2);
   return choice(poly([[1,V2],[-m*m,""]]),"Какое выражение равно данному?",
     "("+v+" − "+m+")("+v+" + "+m+")",[sq(v+" − "+m),sq(v+" + "+m),"("+v+" − "+m*m+")("+v+" + "+m*m+")","("+v+" − "+m+")("+v+" − "+m*m+")"],null,F_DSQ); }},
 {k:"ksum",lab:"квадрат суммы с коэффициентом",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,5),n=u.ri(1,9),kv=k+v;
   return choice(poly([[k*k,v+u.sup(2)],[2*k*n,v],[n*n,""]]),"Какое выражение равно данному?",
     sq(kv+" + "+n),[sq(k*k+v+" + "+n),sq(kv+" + "+n*n),sq(kv+" − "+n),sq(kv+" + "+2*n)],null,F_SUM); }},
 {k:"kdif",lab:"квадрат разности с коэффициентом",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,5),n=u.ri(1,9),kv=k+v;
   return choice(poly([[k*k,v+u.sup(2)],[-2*k*n,v],[n*n,""]]),"Какое выражение равно данному?",
     sq(kv+" − "+n),[sq(k*k+v+" − "+n),sq(kv+" − "+n*n),sq(kv+" + "+n),sq(kv+" − "+2*n)],null,F_DIF); }},
 {k:"kdsq",lab:"разность квадратов с коэффициентом",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,6),m=u.ri(2,9),kv=k+v;
   return choice(poly([[k*k,v+u.sup(2)],[-m*m,""]]),"Какое выражение равно данному?",
     "("+kv+" − "+m+")("+kv+" + "+m+")",[sq(kv+" − "+m),sq(kv+" + "+m),"("+k*k+v+" − "+m+")("+k*k+v+" + "+m+")","("+kv+" − "+m*m+")("+kv+" + "+m*m+")"],null,F_DSQ); }}
]; }

/* ---------- раскрыть ---------- */
function expPool(){ return [
 {k:"sum",lab:"(a + b)²",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,9),V2=v+u.sup(2);
   return choice(sq(v+" + "+n),"Раскрой скобки",
     poly([[1,V2],[2*n,v],[n*n,""]]),[poly([[1,V2],[n*n,""]]),poly([[1,V2],[n,v],[n*n,""]]),poly([[1,V2],[2*n,v],[n,""]]),poly([[1,V2],[2*n,v],[-n*n,""]])],null,F_SUM); }},
 {k:"dif",lab:"(a − b)²",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,9),V2=v+u.sup(2);
   return choice(sq(v+" − "+n),"Раскрой скобки",
     poly([[1,V2],[-2*n,v],[n*n,""]]),[poly([[1,V2],[-n*n,""]]),poly([[1,V2],[-2*n,v],[-n*n,""]]),poly([[1,V2],[2*n,v],[n*n,""]]),poly([[1,V2],[-n,v],[n*n,""]])],null,F_DIF); }},
 {k:"dsq",lab:"(a − b)(a + b)",gen:function(){
   var v=u.v(pickVar()),m=u.ri(2,12),V2=v+u.sup(2);
   return choice("("+v+" − "+m+")("+v+" + "+m+")","Раскрой скобки",
     poly([[1,V2],[-m*m,""]]),[poly([[1,V2],[m*m,""]]),poly([[1,V2],[-2*m,v],[m*m,""]]),poly([[1,V2],[2*m,v],[-m*m,""]]),poly([[1,V2],[-m,""]])],null,F_DSQ); }},
 {k:"ksum",lab:"(ka + b)²",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,5),n=u.ri(1,9),V2=v+u.sup(2);
   return choice(sq(k+v+" + "+n),"Раскрой скобки",
     poly([[k*k,V2],[2*k*n,v],[n*n,""]]),[poly([[k,V2],[2*k*n,v],[n*n,""]]),poly([[k*k,V2],[k*n,v],[n*n,""]]),poly([[k*k,V2],[2*k*n,v],[n,""]]),poly([[k*k,V2],[n*n,""]])],null,F_SUM); }},
 {k:"kdif",lab:"(ka − b)²",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,5),n=u.ri(1,9),V2=v+u.sup(2);
   return choice(sq(k+v+" − "+n),"Раскрой скобки",
     poly([[k*k,V2],[-2*k*n,v],[n*n,""]]),[poly([[k*k,V2],[-n*n,""]]),poly([[k,V2],[-2*k*n,v],[n*n,""]]),poly([[k*k,V2],[-2*k*n,v],[-n*n,""]]),poly([[k*k,V2],[-k*n,v],[n*n,""]])],null,F_DIF); }},
 {k:"rev",lab:"(b − a)²",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,9),V2=v+u.sup(2);
   return choice(sq(n+" − "+v),"Раскрой скобки",
     poly([[n*n,""],[-2*n,v],[1,V2]]),[poly([[n*n,""],[2*n,v],[1,V2]]),poly([[n*n,""],[-1,V2]]),poly([[n*n,""],[-2*n,v],[-1,V2]]),poly([[-n*n,""],[-2*n,v],[1,V2]])],null,F_DIF+". Порядок в скобках не важен: (b − a)² = (a − b)²"); }}
]; }

/* ---------- среднее слагаемое и другие пропуски ---------- */
function Q(){ return '<span style="color:var(--apricot)">?</span>'; }
function midPool(){ return [
 {k:"mp",lab:"(x + n)²: среднее слагаемое",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,12),V2=v+u.sup(2);
   return {q:sq(v+" + "+n)+" = "+V2+" + "+Q()+v+" + "+n*n,sub:"Чему равен коэффициент вместо «?»",sm:true,a:2*n,ans:String(2*n),
     rev:sq(v+" + "+n)+" = "+V2+" + <b>"+2*n+"</b>"+v+" + "+n*n+'<span class="hint">Среднее слагаемое — удвоенное произведение: 2 · '+n+' = '+2*n+'</span>'}; }},
 {k:"mm",lab:"(x − n)²: среднее слагаемое",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,12),V2=v+u.sup(2);
   return {q:sq(v+" − "+n)+" = "+V2+" + "+Q()+v+" + "+n*n,sub:"Чему равен коэффициент вместо «?»",sm:true,a:-2*n,ans:u.n(-2*n),
     rev:sq(v+" − "+n)+" = "+V2+" − "+2*n+v+" + "+n*n+'<span class="hint">Перед средним слагаемым стоит минус, поэтому коэффициент отрицательный: −'+2*n+'</span>'}; }},
 {k:"kp",lab:"(kx + n)²: среднее слагаемое",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,6),n=u.ri(1,9),V2=v+u.sup(2);
   return {q:sq(k+v+" + "+n)+" = "+k*k+V2+" + "+Q()+v+" + "+n*n,sub:"Чему равен коэффициент вместо «?»",sm:true,a:2*k*n,ans:String(2*k*n),
     rev:sq(k+v+" + "+n)+" = "+k*k+V2+" + <b>"+2*k*n+"</b>"+v+" + "+n*n+'<span class="hint">2 · '+k+' · '+n+' = '+2*k*n+'</span>'}; }},
 {k:"km",lab:"(kx − n)²: среднее слагаемое",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,6),n=u.ri(1,9),V2=v+u.sup(2);
   return {q:sq(k+v+" − "+n)+" = "+k*k+V2+" + "+Q()+v+" + "+n*n,sub:"Чему равен коэффициент вместо «?»",sm:true,a:-2*k*n,ans:u.n(-2*k*n),
     rev:sq(k+v+" − "+n)+" = "+k*k+V2+" − "+2*k*n+v+" + "+n*n+'<span class="hint">2 · '+k+' · '+n+' = '+2*k*n+', и перед ним минус</span>'}; }},
 {k:"last",lab:"последнее слагаемое",gen:function(){
   var v=u.v(pickVar()),n=u.ri(2,12),V2=v+u.sup(2),s=u.rnd(2);
   return {q:sq(v+(s?" + ":" − ")+n)+" = "+V2+(s?" + ":" − ")+2*n+v+" + "+Q(),sub:"Чему равно последнее слагаемое",sm:true,a:n*n,ans:String(n*n),
     rev:"Последнее слагаемое — квадрат второго числа: "+n+u.sup(2)+" = <b>"+n*n+"</b>"+'<span class="hint">Оно всегда со знаком плюс, даже в квадрате разности.</span>'}; }},
 {k:"first",lab:"первое слагаемое",gen:function(){
   var v=u.v(pickVar()),k=u.ri(2,9),n=u.ri(1,9),V2=v+u.sup(2),s=u.rnd(2);
   return {q:sq(k+v+(s?" + ":" − ")+n)+" = "+Q()+V2+(s?" + ":" − ")+2*k*n+v+" + "+n*n,sub:"Чему равен коэффициент вместо «?»",sm:true,a:k*k,ans:String(k*k),
     rev:"Первое слагаемое — квадрат первого числа: "+k+u.sup(2)+" = <b>"+k*k+"</b>"+'<span class="hint">Возводится в квадрат и коэффициент, и переменная: ('+k+v+')² = '+k*k+V2+'</span>'}; }}
]; }

/* ---------- счёт в уме ---------- */
function mentalPool(){ return [
 {k:"sq",lab:"квадрат числа рядом с круглым",gen:function(){
   var b=u.pick([10,20,30,40,50,60,100,200]),d=u.ri(1,3),s=u.rnd(2)?1:-1,n=b+s*d,r=n*n;
   return {q:n+u.sup(2)+" = ?",sub:"Подсказка: "+b+" "+(s>0?"+":"−")+" "+d,a:r,ans:String(r),
     rev:n+u.sup(2)+" = ("+b+(s>0?" + ":" − ")+d+")"+u.sup(2)+" = "+b*b+(s>0?" + ":" − ")+2*b*d+" + "+d*d+" = <b>"+r+"</b>"}; }},
 {k:"prod",lab:"произведение симметричных чисел",gen:function(){
   var b=u.pick([20,30,40,50,60,70,80,90,100,200]),d=u.ri(1,5),r=b*b-d*d;
   return {q:(b-d)+" · "+(b+d)+" = ?",sub:"Подсказка: числа стоят по обе стороны от "+b,a:r,ans:String(r),
     rev:(b-d)+" · "+(b+d)+" = ("+b+" − "+d+")("+b+" + "+d+") = "+b+u.sup(2)+" − "+d+u.sup(2)+" = "+b*b+" − "+d*d+" = <b>"+r+"</b>"}; }},
 {k:"dsq",lab:"разность квадратов",gen:function(){
   var s=u.pick([10,20,50,100]),a=u.ri(Math.floor(s/2)+1,s-2),b=s-a,r=(a-b)*(a+b);
   return {q:a+u.sup(2)+" − "+b+u.sup(2)+" = ?",sub:"Разложи по формуле, не возводи в квадрат",a:r,ans:String(r),
     rev:a+u.sup(2)+" − "+b+u.sup(2)+" = ("+a+" − "+b+")("+a+" + "+b+") = "+(a-b)+" · "+s+" = <b>"+r+"</b>"}; }},
 {k:"dec",lab:"квадрат десятичной дроби",gen:function(){
   var b=u.pick([10,20,30,50]),d=u.pick([0.1,0.2,0.5]),s=u.rnd(2)?1:-1,n=Math.round((b+s*d)*10)/10,r=Math.round(n*n*1e4)/1e4;
   return {q:u.n(n)+u.sup(2)+" = ?",sub:"Подсказка: "+b+" "+(s>0?"+":"−")+" "+u.n(d),a:r,ans:u.n(r),
     rev:u.n(n)+u.sup(2)+" = ("+b+(s>0?" + ":" − ")+u.n(d)+")"+u.sup(2)+" = "+b*b+(s>0?" + ":" − ")+u.n(Math.round(2*b*d*100)/100)+" + "+u.n(Math.round(d*d*100)/100)+" = <b>"+u.n(r)+"</b>"}; }}
]; }

T.start({
  key:"lili.fsu.v1",
  title:"Формулы сокращённого умножения",
  lead:"7 класс, тема «Формулы сокращённого умножения». Узнать формулу в выражении, раскрыть скобки, не потерять среднее слагаемое.",
  note:"В темах со скобками выбирай вариант ответа (на компьютере — клавишами 1–4). В остальных ответ вводится числом.",
  modes:[
    {id:"fold",ex:"x² + 6x + 9",nm:"Свернуть в квадрат или произведение",input:"choice",fast:12,repeat:true,pool:foldPool},
    {id:"open",ex:"(x − 3)²",nm:"Раскрыть скобки",input:"choice",fast:12,repeat:true,pool:expPool},
    {id:"mid",ex:"2ab",nm:"Среднее слагаемое и пропуски",fast:10,neg:true,repeat:true,pool:midPool},
    {id:"fast",ex:"99²",nm:"Счёт в уме по формулам",fast:14,dec:true,repeat:true,pool:mentalPool}
  ]
});
})();
</script>
</body>
