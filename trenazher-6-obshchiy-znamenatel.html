/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);

window.TrainerData={"id":"obshchiy-znamenatel-6","version":1,"title":"Дроби с разными знаменателями · lili.math","heading":"Сложение и вычитание дробей","subtitle":"От равных долей и общего знаменателя до ответа в сокращённом виде.","description":"Обучающий тренажёр по обыкновенным дробям для 6 класса.","grade":"6 класс","stages":[{"name":"Равные дроби","subtitle":"Меняем запись","title":"Одна и та же доля в разных записях","intro":"\u003csection class=\"theory-topic\">\u003ch3>Делим одну и ту же полоску\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равные дроби\u003c/strong> — дроби, которые обозначают одно и то же число.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Знаменатель\u003c/h4>\u003cp>Показывает, на сколько равных частей разделено целое. В первой полоске таких частей две, во второй четыре.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/2 и 2/4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Числитель\u003c/h4>\u003cp>Показывает, сколько таких частей взяли. Одну половину разрезали пополам и получили две четверти.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/2 = 2/4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Дополнительный множитель\u003c/h4>\u003cp>Это число, на которое умножают и числитель, и знаменатель. При умножении на 2 каждая старая часть становится двумя новыми. Закрашенная длина сохраняется.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/2 = (1 · 2)/(2 · 2) = 2/4\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>1/2\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"144.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"150.0000\" y=\"4\" width=\"144.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>2/4\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"78.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"150.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"222.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003c/section>","anchor":"Умножай обе части дроби на одно число.","anchorNote":"Посмотри, во сколько раз меняется знаменатель.","tasks":[{"kind":"choice","q":"Какая дробь обозначает ту же долю, что и 1/3?","answer":"2/6","before":"На полосках 1/2 и 2/4 закрашена одинаковая длина. Каждую половину разделили ещё на две части.","see":"Представь, что каждую треть разделили на две равные части.","similar":"1/2 = 2/4.","algorithm":"Умножь числитель и знаменатель на 2.","retry":"Проверь, во сколько раз изменились оба числа.","steps":["Каждую треть делим на две части. Всего получаем 6 частей.","Одна закрашенная треть превращается в две закрашенные шестых.","Ответ: 2/6."],"options":["2/6","3/6","4/6","1/6"],"visual":"\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>1/3\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"96.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"102.0000\" y=\"4\" width=\"96.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"198.0000\" y=\"4\" width=\"96.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>","unit":""},{"kind":"number","q":"Найди числитель дроби со знаменателем 15, равной 2/5.","answer":6,"before":"Приведём 2/3 к знаменателю 12. Сначала 12 : 3 = 4, затем 2 · 4 = 8. Получили 8/12.","see":"Знаменатель должен измениться с 5 до 15.","similar":"В 3/5 = 6/10 и 3, и 5 умножили на 2.","algorithm":"Раздели 15 на 5. На полученное число умножь 2.","retry":"Проверь, что числитель и знаменатель увеличены в одинаковое число раз.","steps":["Дополнительный множитель равен 15 : 5 = 3.","Числитель равен 2 · 3 = 6.","Ответ: 6."],"unit":""},{"kind":"number","q":"Найди числитель дроби со знаменателем 8, равной 3/4.","answer":6,"before":"Приведём 2/3 к знаменателю 12. Сначала 12 : 3 = 4, затем 2 · 4 = 8. Получили 8/12.","see":"Знаменатель должен измениться с 4 до 8.","similar":"В 3/5 = 6/10 и 3, и 5 умножили на 2.","algorithm":"Раздели 8 на 4. На полученное число умножь 3.","retry":"Проверь, что числитель и знаменатель увеличены в одинаковое число раз.","steps":["Дополнительный множитель равен 8 : 4 = 2.","Числитель равен 3 · 2 = 6.","Ответ: 6."],"unit":""},{"kind":"number","q":"Найди числитель дроби со знаменателем 21, равной 4/7.","answer":12,"before":"Приведём 2/3 к знаменателю 12. Сначала 12 : 3 = 4, затем 2 · 4 = 8. Получили 8/12.","see":"Знаменатель должен измениться с 7 до 21.","similar":"В 3/5 = 6/10 и 3, и 5 умножили на 2.","algorithm":"Раздели 21 на 7. На полученное число умножь 4.","retry":"Проверь, что числитель и знаменатель увеличены в одинаковое число раз.","steps":["Дополнительный множитель равен 21 : 7 = 3.","Числитель равен 4 · 3 = 12.","Ответ: 12."],"unit":""},{"kind":"number","q":"Найди числитель дроби со знаменателем 24, равной 5/6.","answer":20,"before":"Приведём 2/3 к знаменателю 12. Сначала 12 : 3 = 4, затем 2 · 4 = 8. Получили 8/12.","see":"Знаменатель должен измениться с 6 до 24.","similar":"В 3/5 = 6/10 и 3, и 5 умножили на 2.","algorithm":"Раздели 24 на 6. На полученное число умножь 5.","retry":"Проверь, что числитель и знаменатель увеличены в одинаковое число раз.","steps":["Дополнительный множитель равен 24 : 6 = 4.","Числитель равен 5 · 4 = 20.","Ответ: 20."],"unit":""}]},{"name":"Общий знаменатель","subtitle":"Выбираем число","title":"Как найти общий знаменатель","intro":"\u003csection class=\"theory-topic\">\u003ch3>Подбираем число, которое делится на оба знаменателя\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Общий знаменатель\u003c/strong> — положительное число, которое делится без остатка на каждый из исходных знаменателей.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Проверяем число\u003c/h4>\u003cp>У дробей 1/4 и 1/6 можно взять знаменатель 24. Проверь деление на 4 и на 6.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>24 : 4 = 6, 24 : 6 = 4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Ищем наименьшее общее кратное\u003c/h4>\u003cp>НОК — наименьшее положительное число, которое делится на оба числа без остатка. Перебираем кратные большего знаменателя. 6 на 4 не делится, а 12 делится.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>НОК(4, 6) = 12\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если больший знаменатель уже подходит\u003c/h4>\u003cp>Для 1/3 и 1/9 достаточно знаменателя 9. Это первое кратное 9, и оно делится на 3.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>НОК(3, 9) = 9\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Наименьший общий знаменатель равен НОК знаменателей.","anchorNote":"Произведение знаменателей подходит, но часто можно взять число меньше.","tasks":[{"kind":"choice","q":"Какое из чисел подходит как общий знаменатель для 1/4 и 1/10?","answer":"40","before":"Для 1/3 и 1/5 подходит число 30: оно делится на 3 и на 5 без остатка.","see":"Проверить нужно деление и на 4, и на 10.","similar":"Число 15 делится на 3 и на 5.","algorithm":"Проверь каждый вариант делением на оба знаменателя.","retry":"Если хотя бы одно деление с остатком, этот вариант не подходит.","steps":["40 : 4 = 10.","40 : 10 = 4.","Ответ: 40."],"options":["10","12","40","30"],"unit":""},{"kind":"number","q":"Найди наименьший общий знаменатель для 1/4 и 1/8.","answer":8,"before":"Для 1/4 и 1/6 перебираем кратные 6: 6, 12, 18… Первое число, которое делится на 4, это 12.","see":"Начни с большего знаменателя, 8.","similar":"Для знаменателей 3 и 5 кратные 5: 5, 10, 15… Первое подходящее число — 15.","algorithm":"Прибавляй по 8 и проверяй делимость на 4. Остановись на первом подходящем числе.","retry":"Если число подходит, проверь, есть ли меньшее, которое делится на оба знаменателя.","steps":["Кратные 8 до первого подходящего числа: 8.","8 первым делится без остатка и на 4, и на 8.","Ответ: 8."],"unit":""},{"kind":"number","q":"Найди наименьший общий знаменатель для 1/2 и 1/7.","answer":14,"before":"Для 1/4 и 1/6 перебираем кратные 6: 6, 12, 18… Первое число, которое делится на 4, это 12.","see":"Начни с большего знаменателя, 7.","similar":"Для знаменателей 3 и 5 кратные 5: 5, 10, 15… Первое подходящее число — 15.","algorithm":"Прибавляй по 7 и проверяй делимость на 2. Остановись на первом подходящем числе.","retry":"Если число подходит, проверь, есть ли меньшее, которое делится на оба знаменателя.","steps":["Кратные 7 до первого подходящего числа: 7, 14.","14 первым делится без остатка и на 2, и на 7.","Ответ: 14."],"unit":""},{"kind":"number","q":"Найди наименьший общий знаменатель для 1/6 и 1/8.","answer":24,"before":"Для 1/4 и 1/6 перебираем кратные 6: 6, 12, 18… Первое число, которое делится на 4, это 12.","see":"Начни с большего знаменателя, 8.","similar":"Для знаменателей 3 и 5 кратные 5: 5, 10, 15… Первое подходящее число — 15.","algorithm":"Прибавляй по 8 и проверяй делимость на 6. Остановись на первом подходящем числе.","retry":"Если число подходит, проверь, есть ли меньшее, которое делится на оба знаменателя.","steps":["Кратные 8 до первого подходящего числа: 8, 16, 24.","24 первым делится без остатка и на 6, и на 8.","Ответ: 24."],"unit":""},{"kind":"number","q":"Найди наименьший общий знаменатель для 1/9 и 1/12.","answer":36,"before":"Для 1/4 и 1/6 перебираем кратные 6: 6, 12, 18… Первое число, которое делится на 4, это 12.","see":"Начни с большего знаменателя, 12.","similar":"Для знаменателей 3 и 5 кратные 5: 5, 10, 15… Первое подходящее число — 15.","algorithm":"Прибавляй по 12 и проверяй делимость на 9. Остановись на первом подходящем числе.","retry":"Если число подходит, проверь, есть ли меньшее, которое делится на оба знаменателя.","steps":["Кратные 12 до первого подходящего числа: 12, 24, 36.","36 первым делится без остатка и на 9, и на 12.","Ответ: 36."],"unit":""}]},{"name":"Приведение дробей","subtitle":"У каждой свой множитель","title":"Переписываем обе дроби","intro":"\u003csection class=\"theory-topic\">\u003ch3>Считаем два дополнительных множителя\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Приведение к общему знаменателю\u003c/strong> — замена дробей равными им дробями с одним знаменателем.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Выбираем знаменатель\u003c/h4>\u003cp>Для 1/4 и 1/6 берём 12.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>НОК(4, 6) = 12\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Находим множитель для каждой дроби\u003c/h4>\u003cp>Общий знаменатель делим на старый знаменатель каждой дроби. Получаем два разных множителя.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>12 : 4 = 3 и 12 : 6 = 2\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Умножаем числители\u003c/h4>\u003cp>У первой дроби умножаем числитель на 3, у второй на 2. Теперь обе доли выражены в двенадцатых.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/4 = 3/12 и 1/6 = 2/12\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>3/12\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"24.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"30.0000\" y=\"4\" width=\"24.0000\" height=\"24\" том же порядке.","answer":"2/10 и 3/10","before":"Приведём 2/5 и 1/6 к знаменателю 30. Множители: 30 : 5 = 6 и 30 : 6 = 5. Получаем 12/30 и 5/30.","see":"Знаменатель 10 уже указан. Ищи новые числители.","similar":"Для 1/2 и 1/8 со знаменателем 8 получится 4/8 и 1/8. У второй дроби множитель равен 1.","algorithm":"Раздели 10 на 5 и на 10. Умножь каждый числитель на свой результат.","retry":"Проверь отдельно каждую дробь: во сколько раз вырос её знаменатель, во столько же раз должен вырасти числитель.","steps":["Первая дробь: 10 : 5 = 2, значит, 1/5 = 2/10.","Вторая дробь: 10 : 10 = 1, значит, 3/10 = 3/10.","Ответ: 2/10 и 3/10."],"options":["3/10 и 3/10","2/10 и 3/10","3/10 и 4/10","2/10 и 4/10"],"unit":""},{"kind":"choice","q":"Приведи 2/3 и 3/5 к знаменателю 15. Выбери пару в том же порядке.","answer":"10/15 и 9/15","before":"Приведём 2/5 и 1/6 к знаменателю 30. Множители: 30 : 5 = 6 и 30 : 6 = 5. Получаем 12/30 и 5/30.","see":"Знаменатель 15 уже указан. Ищи новые числители.","similar":"Для 1/2 и 1/8 со знаменателем 8 получится 4/8 и 1/8. У второй дроби множитель равен 1.","algorithm":"Раздели 15 на 3 и на 5. Умножь каждый числитель на свой результат.","retry":"Проверь отдельно каждую дробь: во сколько раз вырос её знаменатель, во столько же раз должен вырасти числитель.","steps":["Первая дробь: 15 : 3 = 5, значит, 2/3 = 10/15.","Вторая дробь: 15 : 5 = 3, значит, 3/5 = 9/15.","Ответ: 10/15 и 9/15."],"options":["10/15 и 9/15","10/15 и 10/15","11/15 и 9/15","2/15 и 3/15"],"unit":""},{"kind":"choice","q":"Приведи 3/8 и 1/6 к знаменателю 24. Выбери пару в том же порядке.","answer":"9/24 и 4/24","before":"Приведём 2/5 и 1/6 к знаменателю 30. Множители: 30 : 5 = 6 и 30 : 6 = 5. Получаем 12/30 и 5/30.","see":"Знаменатель 24 уже указан. Ищи новые числители.","similar":"Для 1/2 и 1/8 со знаменателем 8 получится 4/8 и 1/8. У второй дроби множитель равен 1.","algorithm":"Раздели 24 на 8 и на 6. Умножь каждый числитель на свой результат.","retry":"Проверь отдельно каждую дробь: во сколько раз вырос её знаменатель, во столько же раз должен вырасти числитель.","steps":["Первая дробь: 24 : 8 = 3, значит, 3/8 = 9/24.","Вторая дробь: 24 : 6 = 4, значит, 1/6 = 4/24.","Ответ: 9/24 и 4/24."],"options":["9/24 и 4/24","3/24 и 1/24","10/24 и 4/24","9/24 и 5/24"],"unit":""},{"kind":"choice","q":"Приведи 5/12 и 7/18 к знаменателю 36. Выбери пару в том же порядке.","answer":"15/36 и 14/36","before":"Приведём 2/5 и 1/6 к знаменателю 30. Множители: 30 : 5 = 6 и 30 : 6 = 5. Получаем 12/30 и 5/30.","see":"Знаменатель 36 уже указан. Ищи новые числители.","similar":"Для 1/2 и 1/8 со знаменателем 8 получится 4/8 и 1/8. У второй дроби множитель равен 1.","algorithm":"Раздели 36 на 12 и на 18. Умножь каждый числитель на свой результат.","retry":"Проверь отдельно каждую дробь: во сколько раз вырос её знаменатель, во столько же раз должен вырасти числитель.","steps":["Первая дробь: 36 : 12 = 3, значит, 5/12 = 15/36.","Вторая дробь: 36 : 18 = 2, значит, 7/18 = 14/36.","Ответ: 15/36 и 14/36."],"options":["15/36 и 15/36","5/36 и 7/36","16/36 и 14/36","15/36 и 14/36"],"unit":""}]},{"name":"Сложение","subtitle":"Складываем числители","title":"Складываем дроби","intro":"\u003csection class=\"theory-topic\">\u003ch3>Складываем части одинакового размера\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Сумма дробей\u003c/strong> — результат сложения дробей.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Если знаменатели равны\u003c/h4>\u003cp>К двум пятым добавляем одну пятую. Получаем три пятых. Размер каждой части тот же, поэтому знаменатель остаётся 5.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>2/5 + 1/5 = 3/5\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если знаменатели разные\u003c/h4>\u003cp>Четверти и половины разного размера. Сначала запишем половину в четвертях, затем сложим числители.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/2 + 1/4 = 2/4 + 1/4 = 3/4\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Проверяем, можно ли сократить\u003c/h4>\u003cp>Сократить дробь значит разделить числитель и знаменатель на один общий делитель больше 1. Дробь, которую больше нельзя сократить, называется несократимой.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>4/6 = (4 : 2)/(6 : 2) = 2/3\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если сумма больше единицы\u003c/h4>\u003cp>В дроби 7/6 шесть шестых составляют целую. Остаётся ещё одна шестая. В заданиях можно выбрать запись неправильной дробью.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>7/6 = 1 + 1/6\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>2/4\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"78.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"150.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"222.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>1/4\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"78.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"150.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"222.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>3/4\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"78.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"150.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"222.0000\" y=\"4\" width=\"72.0000\" height=\"24\" fill=\"#2B3D2B\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003c/svg>\u003c/div>\u003c/section>","anchor":"При одинаковых знаменателях складывай только числители.","anchorNote":"В конце проверь, сокращается ли дробь.","tasks":[{"kind":"choice","q":"Вычисли 2/7 + 3/7. Выбери ответ в сокращённом виде.","answer":"5/7","before":"3/8 + 2/8 = 5/8. Складываем 3 и 2, восьмые остаются восьмыми.","see":"Знаменатели уже одинаковые.","similar":"3/8 + 2/8 = 5/8. Складываем 3 и 2, восьмые остаются восьмыми.","algorithm":"Перепиши дроби со знаменателем 7, затем сложи числители. В конце проверь сокращение.","retry":"Проверь числители после приведения. Знаменатель при вычислении сохраняется.","steps":["Считаем числитель: 2 + 3 = 5. Знаменатель остаётся 7.","Ответ: 5/7."],"options":["5/14","5/7","6/7","1"],"unit":""},{"kind":"choice","q":"Вычисли 1/3 + 1/6. Выбери ответ в сокращённом виде.","answer":"1/2","before":"1/4 + 1/8 = 2/8 + 1/8 = 3/8. Первая дробь стала восьмыми.","see":"Сначала нужно получить доли одинакового размера.","similar":"1/4 + 1/8 = 2/8 + 1/8 = 3/8. Первая дробь стала восьмыми.","algorithm":"Перепиши дроби со знаменателем 6, затем сложи числители. В конце проверь сокращение.","retry":"Проверь числители после приведения. Знаменатель при вычислении сохраняется.","steps":["Общий знаменатель: 6. Переписываем пример: 2/6 + 1/6.","Считаем числитель: 2 + 1 = 3. Знаменатель остаётся 6.","Сокращаем на 3: 3/6 = 1/2.","Ответ: 1/2."],"options":["2/3","1/2","2/9","5/6"],"unit":""},{"kind":"choice","q":"Вычисли 1/4 + 2/3. Выбери ответ в сокращённом виде.","answer":"11/12","before":"1/3 + 1/4 = 4/12 + 3/12 = 7/12. Множители равны 4 и 3.","see":"Сначала нужно получить доли одинакового размера.","similar":"1/3 + 1/4 = 4/12 + 3/12 = 7/12. Множители равны 4 и 3.","algorithm":"Перепиши дроби со знаменателем 12, затем сложи числители. В конце проверь сокращение.","retry":"Проверь числители после приведения. Знаменатель при вычислении сохраняется.","steps":["Общий знаменатель: 12. Переписываем пример: 3/12 + 8/12.","Считаем числитель: 3 + 8 = 11. Знаменатель остаётся 12.","Ответ: 11/12."],"options":["13/12","1","3/7","11/12"],"unit":""},{"kind":"choice","q":"Вычисли 1/6 + 1/2. Выбери ответ в сокращённом виде.","answer":"2/3","before":"1/4 + 1/4 = 2/4 = 1/2. После сложения делим числитель и знаменатель на 2.","see":"Сначала нужно получить доли одинакового размера.","similar":"1/4 + 1/4 = 2/4 = 1/2. После сложения делим числитель и знаменатель на 2.","algorithm":"Перепиши дроби со знаменателем 6, затем сложи числители. В конце проверь сокращение.","retry":"Проверь числители после приведения. Знаменатель при вычислении сохраняется.","steps":["Общий знаменатель: 6. Переписываем пример: 1/6 + 3/6.","Считаем числитель: 1 + 3 = 4. Знаменатель остаётся 6.","Сокращаем на 2: 4/6 = 2/3.","Ответ: 2/3."],"options":["1/4","5/6","1","2/3"],"unit":""},{"kind":"choice","q":"Вычисли 5/8 + 3/4. Выбери ответ в сокращённом виде.","answer":"11/8","before":"3/4 + 2/3 = 9/12 + 8/12 = 17/12. Ответ больше единицы.","see":"Сначала нужно получить доли одинакового размера.","similar":"3/4 + 2/3 = 9/12 + 8/12 = 17/12. Ответ больше единицы.","algorithm":"Перепиши дроби со знаменателем 8, затем сложи числители. В конце проверь сокращение.","retry":"Проверь числители после приведения. Знаменатель при вычислении сохраняется.","steps":["Общий знаменатель: 8. Переписываем пример: 5/8 + 6/8.","Считаем числитель: 5 + 6 = 11. Знаменатель остаётся 8.","Ответ: 11/8."],"options":["2/3","13/8","11/8","3/2"],"unit":""}]},{"name":"Вычитание","subtitle":"Сохраняем порядок","title":"Вычитаем дроби","intro":"\u003csection class=\"theory-topic\">\u003ch3>Убираем части одинакового размера\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Разность дробей\u003c/strong> — результат вычитания дробей.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Если знаменатели равны\u003c/h4>\u003cp>Отнимаем одну пятую от четырёх пятых. Остаются три части, каждая размером в одну пятую.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>4/5 − 1/5 = 3/5\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если знаменатели разные\u003c/h4>\u003cp>Вычитаем из первой дроби вторую. Переписываем обе дроби в двенадцатых в том же порядке.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>3/4 − 1/6 = 9/12 − 2/12 = 7/12\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если доли равны\u003c/h4>\u003cp>У равных дробей после приведения одинаковые числители. Их разность равна нулю.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1/2 − 2/4 = 2/4 − 2/4 = 0\u003c/b>\u003c/div>\u003c/li>\u003cli>\u003ch4>Если вычитаем из единицы\u003c/h4>\u003cp>Записываем целое дробью с нужным знаменателем. Одна целая полоска состоит из пяти пятых.\u003c/p>\u003cdiv class=\"theory-cell\">\u003cb>1 − 2/5 = 5/5 − 2/5 = 3/5\u003c/b>\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003cdiv style=\"display:grid;grid-template-columns:3em minmax(0,1fr);align-items:center;max-width:420px\">\u003cb>4/5\u003c/b>\u003csvg viewBox=\"0 0 300 32\" aria-hidden=\"true\">\u003crect x=\"6.0000\" y=\"4\" width=\"57.6000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"63.6000\" y=\"4\" width=\"57.6000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"121.2000\" y=\"4\" width=\"57.6000\" height=\"24\" fill=\"#DD7A3A\" stroke=\"#EEE0C8\" stroke-width=\"1\"/>\u003crect x=\"178.8000\" y     $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.assessmentView=null;state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions">${unresolved?'':'<button type="button" class="primary" id="completion-test">К итоговому тесту</button>'}<button class="secondary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#completion-test')?.addEventListener('click',()=>openAssessment('exit'));
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';state.assessmentView=null;save(false);render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  assessmentModes.forEach(mode=>$('#open-'+mode).addEventListener('click',()=>openAssessment(mode)));
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='entry';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
