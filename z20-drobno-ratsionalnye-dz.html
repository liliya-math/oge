<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="cabinet-report.js"></script>

<title>ДЗ №2 · Дробно-рациональные уравнения</title>
<style>

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}

sup{font-size:.7em;line-height:0}

h1 span{color:var(--apricot)}

.big{font-size:clamp(60px,15vw,96px);font-weight:800;line-height:1;color:var(--amber)}
.rhead{text-align:center;display:grid;gap:6px;padding-block:6px 4px}

.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:16px}

.cell.bad{background:rgba(255,143,115,.1);border-color:rgba(255,143,115,.35);color:var(--miss)}
.cell.th{background:rgba(245,220,106,.1);border-color:rgba(245,220,106,.35);color:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);margin-top:10px}

.blk{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);display:grid;gap:6px}
.blk .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}.blk .h b{color:var(--fg)}
.bar{height:6px;border-radius:3px;background:rgba(243,236,226,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}

.weak ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}.weak p{margin:4px 0 0}
.send{margin-top:18px;display:grid;gap:10px;justify-items:center}
</style>
<main class="wrap" id="app"></main>
<script>
(() => {
const T = [{"n": 1, "part": 1, "topic": "Дробь равна числу", "a": [7], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>18</span><span>x − 1</span></span> = 3</span>.</p>", "h": ["Дробь равна числу. Умножь обе части уравнения на знаменатель, чтобы избавиться от дроби."]}, {"n": 2, "part": 1, "topic": "Одинаковые знаменатели", "a": [4], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>x + 4</span><span>x − 2</span></span> − 3 = <span class=\"fr\"><span>2</span><span>x − 2</span></span></span>.</p>", "h": ["Знаменатели у дробей одинаковые, а слагаемое 3 целое. Умножь всё уравнение на (x − 2). Не забудь умножить и 3."]}, {"n": 3, "part": 1, "topic": "Дробь равна нулю", "a": [5], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>x<sup>2</sup> − 7x + 10</span><span>x<sup>2</sup> − 4</span></span> = 0</span>.</p>", "h": ["Когда дробь равна нулю? Отдельно подумай про числитель и отдельно про знаменатель."]}, {"n": 4, "part": 1, "topic": "Уравнение вида x − a/x = b", "a": [3], "q": "<p>Решите уравнение <span class=\"m\">x − <span class=\"fr\"><span>6</span><span>x</span></span> = 1</span>.<br>Если уравнение имеет больше одного корня, в ответ запишите больший из корней.</p>", "h": ["Избавься от дроби: умножь обе части на x (x ≠ 0)."]}, {"n": 5, "part": 2, "topic": "Пропорция", "a": [-5], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>x − 5</span><span>x − 1</span></span> = <span class=\"fr\"><span>2x − 5</span><span>x − 4</span></span></span>.<br>Если уравнение имеет больше одного корня, в ответ запишите меньший из корней.</p>", "h": ["Это пропорция: произведение крайних членов равно произведению средних. Запиши (x − 5)(x − 4) = (2x − 5)(x − 1)."]}, {"n": 6, "part": 2, "topic": "Общий знаменатель", "a": [-3], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>2</span><span>x − 1</span></span> − <span class=\"fr\"><span>3</span><span>x + 1</span></span> = 1</span>.<br>Если уравнение имеет больше одного корня, в ответ запишите меньший из корней.</p>", "h": ["Общий знаменатель здесь (x − 1)(x + 1). Умножь на него обе части уравнения, включая правую."]}, {"n": 7, "part": 2, "topic": "Разложение знаменателя, посторонний корень", "a": [-1], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>x</span><span>x − 2</span></span> − <span class=\"fr\"><span>3</span><span>x + 2</span></span> = <span class=\"fr\"><span>8</span><span>x<sup>2</sup> − 4</span></span></span>.</p>", "h": ["Разложи x² − 4 на множители. Тогда видно, что общий знаменатель (x − 2)(x + 2)."]}, {"n": 8, "part": 2, "topic": "Задача на работу", "a": [12], "q": "<p>Первая труба наполняет бассейн на 6 часов быстрее, чем вторая, а две трубы вместе наполняют его за 4 часа. За сколько часов наполняет бассейн одна вторая труба?</p>", "h": ["Пусть первая труба наполняет бассейн за x часов. За сколько тогда справится вторая? Какую часть бассейна каждая наполняет за час?"]}, {"n": 9, "part": 3, "topic": "Разность дробей, сумма-«телескоп»", "a": [-10], "q": "<p>Решите уравнение <span class=\"m\"><span class=\"fr\"><span>1</span><span>x(x + 1)</span></span> + <span class=\"fr\"><span>1</span><span>(x + 1)(x + 2)</span></span> + <span class=\"fr\"><span>1</span><span>(x + 2)(x + 3)</span></span> = <span class=\"fr\"><span>3</span><span>10</span></span></span>.<br>В ответ запишите произведение корней.</p>", "h": ["Каждую дробь можно записать как разность: 1/(x(x+1)) = 1/x − 1/(x+1). Сделай так со всеми тремя."]}, {"n": 10, "part": 3, "topic": "Замена t = x + 1/x", "a": [2], "q": "<p>Решите уравнение <span class=\"m\">2(x<sup>2</sup> + <span class=\"fr\"><span>1</span><span>x<sup>2</sup></span></span>) − 7(x + <span class=\"fr\"><span>1</span><span>x</span></span>) + 9 = 0</span>.<br>Если уравнение имеет больше одного корня, в ответ запишите наибольший из корней.</p>", "h": ["В уравнении есть x² + 1/x² и x + 1/x. Попробуй замену t = x + 1/x и выразить x² + 1/x² через t."]}, {"n": 11, "part": 3, "topic": "Задача на движение со стоянкой", "a": [16], "q": "<p>Теплоход проходит 60 км по течению реки, стоит 2 часа и возвращается обратно. Скорость течения 4 км/ч, а весь путь от отплытия до возвращения занял 10 часов. Найдите скорость теплохода в неподвижной воде. Ответ дайте в км/ч.</p>", "h": ["В пути теплоход был не 10 часов: стоянку нужно вычесть. Скорость по течению v + 4, против течения v − 4."]}];
const TOPIC='Дробно-рациональные уравнения', NO=2;
const RNG={1:'1–4',2:'5–8',3:'9–11'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='oge-dz2-simple';
function newSid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fresh(){return {sid:newSid(),name:'',i:0,started:0,done:false,r:{}}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.r?v:null}catch(e){return null}}
let S=load()||fresh();if(!S.sid)S.sid=newSid();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const rec=n=>S.r[n]||(S.r[n]={st:'',tries:0,hints:0,ans:[],th:'',t:0});
const app=document.getElementById('app');
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>S.started?(Date.now()-S.started)/1000:0;
let tick=null,taskStart=0,mode='ans',shown=0,resolved=false;
function logo(){return `<span class="lockup"><svg width="28" height="28" viewBox="0 0 64 64" role="img" aria-label="25/25"><rect x="2" y="2" width="60" height="60" rx="19" fill="#1747c9"/><text x="32" y="27" text-anchor="middle" font-family="-apple-system,Inter,sans-serif" font-weight="800" font-size="18" fill="#f3ece2">25</text><rect x="15" y="32" width="34" height="3.4" rx="1.7" fill="#f2905e"/><text x="32" y="53" text-anchor="middle" font-family="-apple-system,Inter,sans-serif" font-weight="800" font-size="18" fill="#f3ece2">25</text></svg><span class="lw">lili<i>.</i>math</span></span>`}
function parseNums(s){return String(s).replace(/[−–—]/g,'-').split(/;|\s+и\s+|\n/).map(x=>x.trim().replace(/\s+/g,'').replace(',','.')).filter(Boolean).map(x=>/^-?\d+(\.\d+)?$/.test(x)?+x:NaN)}
function same(a,b){if(a.length!==b.length||a.some(isNaN))return false;const x=[...a].sort((p,q)=>p-q),y=[...b].sort((p,q)=>p-q);return x.every((v,i)=>Math.abs(v-y[i])<1e-6)}
function topbar(){return `<div class="top"><div class="toprow">${logo()}<div class="sp"></div><span class="pill">решено <strong>${T.filter(t=>S.r[t.n]&&S.r[t.n].st==='ok').length}/${T.length}</strong></span><span class="pill"><strong id="tmr">${fmtT(elapsed())}</strong></span></div>
<div class="track" style="grid-template-columns:repeat(${T.length},1fr)" aria-hidden="true">${T.map((t,i)=>{const r=S.r[t.n];return `<span class="${r&&r.st?r.st:(i===S.i&&!S.done?'cur':'')}"></span>`}).join('')}</div></div>`}
function startTick(){clearInterval(tick);tick=setInterval(()=>{const e=document.getElementById('tmr');if(e)e.textContent=fmtT(elapsed())},1000)}

function renderStart(){
  const resume=S.name&&S.started&&!S.done&&Object.keys(S.r).length;
  app.innerHTML=`<section class="card"><div class="kick">25/25 · Домашняя работа №${NO}</div>
  <h1>${TOPIC.split(' ')[0]} <span>${TOPIC.split(' ').slice(1).join(' ')}</span></h1>
  ${resume?`<div class="irow"><button class="btn" id="go">Продолжить с задания ${T[Math.min(S.i,T.length-1)].n}</button><button class="btn ghost" id="reset">Начать заново</button></div>`
  :`<label class="note" for="nm">Имя и фамилия</label><div class="irow"><input class="field" id="nm" placeholder="Например, Мария Иванова" autocomplete="name" value="${esc(S.name)}"><button class="btn" id="go">Начать</button></div>`}
  </section>`;
  const go=document.getElementById('go'),nm=document.getElementById('nm');
  if(nm){nm.focus();nm.onkeydown=e=>{if(e.key==='Enter')go.click()}}
  go.onclick=()=>{if(!resume){const v=nm.value.trim();if(!v){nm.focus();return}S.name=v;S.started=Date.now()}save();next(true)};
  const rs=document.getElementById('reset');if(rs)rs.onclick=()=>{S=fresh();save();renderStart()};
}
function next(first){if(S.i>=T.length){finish();return}renderTask()}
const cur=()=>T[S.i];

function renderTask(){
  const t=cur(),r=rec(t.n);mode='ans';shown=r.hints;resolved=!!r.st;taskStart=Date.now();
  app.innerHTML=topbar()+`<article class="card"><div class="thead"><div class="num">${t.n}</div><div><div class="part">Задание ${S.i+1} из ${T.length}</div></div></div>
  <div class="stmt">${t.q}</div><div class="ans" id="ans"></div></article>`;
  startTick();draw();window.scrollTo(0,0);
}
function fbBox(k,t,s){return `<div class="fb ${k}">${t}${s?`<span>${s}</span>`:''}</div>`}
function draw(fb){
  const t=cur(),r=rec(t.n),box=document.getElementById('ans');let h='';
  if(!resolved){
    if(mode==='ans')h+=`<div class="irow"><input class="field" id="inp" inputmode="decimal" autocomplete="off" placeholder="Ответ"><button class="btn" id="chk">Проверить</button></div>${t.note?`<p class="note">${t.note}</p>`:''}`;
    else h+=`<textarea id="th" placeholder="Напиши, что ты пробовал(а) и где застрял(а)">${esc(r.th)}</textarea><div class="irow"><button class="btn ghost" id="back">Вернуться к ответу</button><div class="sp"></div><button class="btn" id="thgo">Записать и дальше</button></div>`;
    if(shown)h+=`<div class="hints"><div class="hint"><small>Подсказка</small>${t.h[0]}</div></div>`;
    if(fb)h+=fb;
    h+=`<div class="alts">${shown<1?`<button class="chip" id="hb">Подсказка</button>`:''}${mode==='ans'?`<button class="chip" id="tb">Моя идея</button>`:''}<button class="chip" id="ib">Не знаю, как решать</button></div>`;
  }else{
    if(fb)h+=fb;
    h+=`<button class="btn next" id="nx">${S.i===T.length-1?'Смотреть результат':'Дальше'}</button>`;
  }
  box.innerHTML=h;bind(t,r);
}
function keep(fb){const i=document.getElementById('inp'),v=i?i.value:'';draw(fb);const j=document.getElementById('inp');if(j){j.value=v;j.select()}}
function resolve(r,st){r.st=st;r.t+=Math.round((Date.now()-taskStart)/1000);resolved=true;save();pushResult()}
function bind(t,r){
  const $=id=>document.getElementById(id);
  if($('nx')){$('nx').focus({preventScroll:true});$('nx').onclick=()=>{S.i++;save();next()};return}
  if($('inp')){$('inp').focus({preventScroll:true});$('inp').onkeydown=e=>{if(e.key==='Enter')$('chk').click()}}
  if($('chk'))$('chk').onclick=()=>{
    const raw=$('inp').value.trim();if(!raw){$('inp').focus();return}
    const nums=parseNums(raw);
    if(nums.some(isNaN)){keep(fbBox('bad','Не похоже на число','Запиши ответ цифрами. Дробную часть отделяй запятой.'));return}
    r.tries++;r.ans.push(raw);
    if(same(nums,t.a)){resolve(r,'ok');draw(fbBox('ok',r.tries===1?'Верно':'Верно со второй попытки'));return}
    if(r.tries>=2){resolve(r,'bad');draw(fbBox('neu','Ответ записан','Разберём на занятии.'));return}
    save();keep(fbBox('bad','Не сходится',shown<1?'Проверь вычисления или возьми подсказку. Осталась одна попытка.':'Проверь вычисления. Осталась одна попытка.'));
  };
  if($('hb'))$('hb').onclick=()=>{shown++;r.hints=shown;save();keep()};
  if($('tb'))$('tb').onclick=()=>{mode='think';draw();$('th').focus()};
  if($('back'))$('back').onclick=()=>{r.th=$('th').value;mode='ans';draw()};
  if($('thgo'))$('thgo').onclick=()=>{const v=$('th').value.trim();if(!v){$('th').focus();return}r.th=v;resolve(r,'th');draw(fbBox('neu','Записано','Разберём на занятии.'))};
  if($('ib'))$('ib').onclick=()=>{const th=$('th');if(th&&th.value.trim())r.th=th.value.trim();resolve(r,'idk');draw(fbBox('neu','Принято','Разберём на занятии.'))};
}
const SHEET_URL='https://script.google.com/macros/s/AKfycbyJKYatO3xdOpYJ1WZzszbxqMnOWZ30lsfr5HH7Y23svvX6iqjNNbIUR-RCUeZ8pB15/exec';
function pushResult(){
  if(!S.name||!S.started)return;
  try{const sc=score(),mk={ok:'✓',bad:'✗',idk:'?',th:'~'};
    const d={sid:S.sid,test:'ДЗ №'+NO+' · '+TOPIC,name:S.name,kind:'ДЗ',started:S.started,status:S.done?'завершено':'в процессе',
      progress:T.filter(t=>S.r[t.n]&&S.r[t.n].st).length+'/'+T.length,score:sc.ok,max:T.length,grade:sc.pct+'%',minutes:Math.round(elapsed()/60),bonus:'',
      tasks:T.map(t=>{const r=S.r[t.n];return t.n+(r&&r.st?mk[r.st]:'·')+(r&&r.hints>0?'п':'')}).join(' '),report:report(sc)};
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).catch(()=>{});
  }catch(e){}
}
function lv(k){const a=T.filter(t=>t.part===k);return [a.filter(t=>S.r[t.n]&&S.r[t.n].st==='ok').length,a.length]}
const pc=(a,b)=>b?Math.round(a/b*100):0;
function score(){let ok=0,self=0,hint=0;for(const t of T){const r=S.r[t.n]||{};if(r.st==='ok'){ok++;r.hints>0?hint++:self++}}return {ok,self,hint,bad:T.length-ok,n:T.length,pct:pc(ok,T.length),lv:[1,2,3].map(lv)}}
function report(sc){
  const Lb={ok:'верно',bad:'неверно',idk:'не знаю',th:'есть идея, застрял(а)'};
  const weak=T.filter(t=>!(S.r[t.n]&&S.r[t.n].st==='ok'));
  const L=[`25/25 · Домашняя работа №${NO} · ${TOPIC} — ${S.name}`,`Дата: ${new Date().toLocaleDateString('ru-RU')}, время: ${fmtT(elapsed())}`,
   `Выполнено: ${sc.ok} из ${sc.n} (${sc.pct}%) · без подсказки: ${sc.self} · верно с подсказкой: ${sc.hint} · не решено: ${sc.bad} · подсказок взято всего: ${T.filter(t=>S.r[t.n]&&S.r[t.n].hints>0).length}`,
   `Задания 1–4: ${sc.lv[0][0]}/${sc.lv[0][1]} (${pc(...sc.lv[0])}%) · Задания 5–8: ${sc.lv[1][0]}/${sc.lv[1][1]} (${pc(...sc.lv[1])}%) · Задания 9–11: ${sc.lv[2][0]}/${sc.lv[2][1]} (${pc(...sc.lv[2])}%)`,'','По заданиям:'];
  for(const t of T){const r=S.r[t.n]||{};let s=`${t.n}. ${Lb[r.st]||'—'}`;
    if(r.st==='ok'&&r.tries>1)s+=' со 2-й попытки';
    s+=`, попыток: ${r.tries||0}, подсказка: ${r.hints>0?'ВЗЯТА':'не брала'}`;
    if(r.st&&r.st!=='ok'&&r.ans&&r.ans.length)s+=`, неверные ответы: ${r.ans.join(' | ')}`;
    if(r.t)s+=`, ${fmtT(r.t)}`;L.push(s);if(r.th)L.push(`   идея: «${r.th}»`)}
  L.push('',weak.length?'Что подтянуть: '+weak.map(t=>`№${t.n} ${t.topic}`).join('; '):'Что подтянуть: всё решено','','lili.math');return L.join('\n');
}
function finish(){
  S.done=true;S.i=T.length;save();clearInterval(tick);pushResult();
  const sc=score(),weak=T.filter(x=>!(S.r[x.n]&&S.r[x.n].st==='ok'));
  const blk=k=>{const [a,b]=sc.lv[k-1];return `<div class="blk"><div class="h">Задания ${RNG[k]}<b>${pc(a,b)}%</b></div><div class="bar"><i style="width:${pc(a,b)}%"></i></div><div class="h"><span>${a} из ${b}</span></div></div>`};
  app.innerHTML=topbar()+`<article class="card"><div class="rhead"><div class="kick">${esc(S.name)}, работа сдана</div><div class="big">${sc.pct}<span style="font-size:.4em">%</span></div>
  <div class="quiet">верно: ${sc.ok} из ${sc.n} · время ${fmtT(elapsed())}</div></div>
  <div class="cells">${T.map(x=>{const r=S.r[x.n]||{};return `<div class="cell ${r.st||''}" title="${x.topic}">${x.n}</div>`}).join('')}</div>
  <div class="legend"><span><i style="background:var(--mint)"></i>верно</span><span><i style="background:var(--miss)"></i>не сошлось</span><span><i style="background:var(--amber)"></i>была идея</span><span><i style="background:#6f625a"></i>не знаю</span></div>
  <div class="blocks">${blk(1)}${blk(2)}${blk(3)}</div>
  <div class="weak"><div class="kick" style="margin:0">Что подтянуть</div>${weak.length?`<ul>${weak.map(x=>`<li><b>№${x.n}</b> · ${x.topic}</li>`).join('')}</ul>`:'<p>Всё решено. Подтягивать нечего.</p>'}</div>
  <div class="send"><p class="quiet">Результат отправлен Лилии.</p></div></article>`;
}
if(S.done&&S.name)finish();else renderStart();
})();
</script>
