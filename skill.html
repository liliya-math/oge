<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Навык · lili.math</title>
<style>
:root{
  --bg:#14211e;--glass:rgba(243,236,226,.05);--line:rgba(226,234,228,.13);--fg:#f3ece2;--muted:#a9b6ad;--faint:#6e7f77;
  --apricot:#f2905e;--mint:#a9d18e;--amber:#f5dc6a;--miss:#ff8f73;--cobalt:#1747c9;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.brand{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--muted)}
.brand b{color:var(--apricot)}
h1{margin:6px 0 10px;font-size:clamp(26px,6vw,36px);line-height:1.15;letter-spacing:-.02em}
.id{font:600 13px var(--mono);color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:650;background:rgba(243,236,226,.08);color:var(--muted)}
.chip.l3{background:rgba(169,209,142,.18);color:var(--mint)}
.chip.l4{background:rgba(245,220,106,.16);color:var(--amber)}
.chip.l5{background:rgba(255,143,115,.16);color:var(--miss)}
.card{margin-top:16px;padding:22px;border-radius:24px;border:1px solid var(--line);background:var(--glass)}
.card h2{margin:0 0 12px;font-size:19px;letter-spacing:-.01em}
.lead{margin:0;color:var(--muted);font-size:15px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(243,236,226,.05);border:1px solid transparent;color:var(--fg);text-decoration:none;font-size:15px;line-height:1.3}
.list a:hover,.list a:focus-visible{background:rgba(243,236,226,.1);border-color:var(--line);outline:none}
.list small{color:var(--faint);font-size:12.5px;white-space:nowrap}
.list .t{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.pre a{grid-template-columns:auto minmax(0,1fr)}
.pre b{font:600 12px var(--mono);color:var(--faint)}
.empty{margin:0;padding:14px;border-radius:14px;background:rgba(0,0,0,.2);color:var(--muted);font-size:14.5px}
.teach{border-color:rgba(242,144,94,.35)}
.teach p{margin:0 0 8px;font-size:15px}
.teach .k{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:650}
.tasks{display:flex;flex-wrap:wrap;gap:6px}
.tasks span{padding:3px 10px;border-radius:8px;background:rgba(23,71,201,.35);color:#d6e2ee;font-size:13px;font-weight:700}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lead">Открываю…</p></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getId=()=>(location.hash.slice(1)||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const BLOCK={N:'Числа и вычисления',A:'Алгебра',F:'Функции и графики',S:'Практика и текстовые задачи',G:'Геометрия'};
const API='https://script.google.com/macros/s/AKfycbwg68-wqapNubGW4BuTEB_ri38yu41uV8hoQPOhluE84y4ZSRfZ9-sFl--uwv7T7AA_xA/exec';
let PASS='';try{PASS=localStorage.getItem('cab-admin')||''}catch(e){}
const canBack=history.length>1&&!!document.referrer;
const bar=()=>`<div class="bar">${canBack?'<button class="back" id="bk" type="button">← Назад</button>':'<span></span>'}<span class="brand">lili<b>.</b>math</span></div>`;
function fail(t,x){app.innerHTML=bar()+`<h1>${esc(t)}</h1><p class="lead">${esc(x)}</p>`;bind()}
function bind(){const b=document.getElementById('bk');if(b)b.onclick=()=>history.back()}
const list=a=>`<ul class="list">${a.map(i=>`<li><a href="${esc(i.url)}" target="_blank" rel="noopener"><span>${esc(i.label)}${i.topic?`<span class="t">${esc(i.topic)}</span>`:''}</span><small>${/\.pdf$/i.test(i.url)?'PDF':'открыть'}</small></a></li>`).join('')}</ul>`;
const step=(n,cls)=>`<li><a href="#${n.id}"><b>${n.id}</b><span>${esc(n.name)}</span></a></li>`;
function draw(G,L){
  const ID=getId(),by=Object.fromEntries(G.nodes.map(n=>[n.id,n])),n=by[ID];
  if(!n)return fail('Навык не найден','Проверь ссылку или вернись в кабинет и выбери навык из списка.');
  document.title=n.name+' · lili.math';
  const lk=(L&&L.links&&L.links[n.id])||{},th=lk.theory||[],hw=lk.hw||[],nr=lk.near||[];
  const after=G.nodes.filter(m=>m.prereq.includes(n.id)).sort((a,b)=>a.depth-b.depth||(a.id<b.id?-1:1));
  const tasks=(n.tasks||[]).slice().sort((a,b)=>a-b);
  const none='<p class="empty">Материалов по этому навыку на сайте пока нет. Лилия разберёт его на занятии.</p>';
  app.innerHTML=bar()
   +`<div class="id">${n.id} · ${esc(BLOCK[n.block]||'')}</div><h1>${esc(n.name)}</h1>`
   +`<div class="chips"><span class="chip l${n.level}">уровень ${n.level}${n.level===3?' · база':n.level===4?' · для четвёрки':' · для пятёрки'}</span>${tasks.length?`<span class="chip">задания: ${tasks.join(', ')}</span>`:''}</div>`
   +(`<div class="card teach"><h2>Для учителя: как проверить</h2><p><span class="k">Проверка</span>${esc(n.check)}</p><p><span class="k">Ответ</span>${esc(n.answer)}</p><p><span class="k">Типичная ошибка</span>${esc(n.error)}</p></div>`)
   +`<div class="card"><h2>Теория</h2>${th.length?list(th):(nr.length?'<p class="empty">Точной теории по этому навыку пока нет. Смотри блок «Рядом по теме» ниже.</p>':none)}</div>`
   +`<div class="card"><h2>Домашка и тренировка</h2>${hw.length?list(hw):(nr.length?'<p class="empty">Точной домашки по этому навыку пока нет. Смотри блок «Рядом по теме» ниже.</p>':none)}</div>`
   +(nr.length?`<div class="card"><h2>Рядом по теме</h2><p class="lead" style="margin-bottom:12px">Не про этот навык точь-в-точь, но соседняя тема.</p>${list(nr)}</div>`:'')
   +(n.prereq.length?`<div class="card"><h2>Что нужно знать до этого</h2><p class="lead" style="margin-bottom:12px">Если здесь трудно, сначала подтяни эти навыки.</p><ul class="list pre">${n.prereq.map(p=>by[p]).filter(Boolean).map(step).join('')}</ul></div>`:`<div class="card"><h2>Что нужно знать до этого</h2><p class="lead">Это основа: навыки уровня 5 класса. Ниже спускаться не надо.</p></div>`)
   +(after.length?`<div class="card"><h2>Что дальше по цепочке</h2><ul class="list pre">${after.map(step).join('')}</ul></div>`:'');
  bind();scrollTo(0,0);
}
const DENY=['Страница только для учителя','Открой кабинет в режиме учителя на этом устройстве и войди с паролем, потом вернись сюда.'];
function gate(){
  if(!PASS)return Promise.reject('deny');
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({admin:PASS,op:'ping'})})
    .then(r=>r.json(),()=>{throw 'net'}).then(j=>{if(!j||j.ok!==true)throw 'deny'});
}
function load(){
  gate().then(go).catch(e=>{if(e==='net')fail('Нет связи','Не получилось проверить доступ. Проверь интернет и обнови страницу.');else fail(DENY[0],DENY[1])});
}
function go(){
  if(!getId()){fail('Навык не выбран','Открой кабинет и нажми на навык в карточке «Карта навыков».');return}
  Promise.all([
    fetch('skills-graph.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}),
    fetch('skills-links.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]).then(([G,L])=>{window._g=[G,L];draw(G,L)}).catch(()=>fail('Не получилось открыть','Похоже, пропал интернет. Обнови страницу.'));
}
addEventListener('hashchange',()=>{if(window._g)draw(window._g[0],window._g[1]);else load()});
load();
})();
</script>
</body>
</html>
