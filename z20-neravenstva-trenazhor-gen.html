</style></head><body><div class="wrap"><p class="sub"><a href="z20-neravenstva.html" style="color:#7da2ff">← Неравенства (№13, №20)</a></p><h1>Тренажёр: неравенства</h1><p class="sub">Каждая задача новая, числа меняются. Шесть типов: линейные, системы, квадратные, дробные, кратные корни, кубические. Ответ выбирается среди рисунков и записей, как в №13.</p><div class="chips" id="chips"></div><div class="card" id="box"></div><p class="stat" id="st"></p></div><script>function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fm(n){return String(n).replace('-','−').replace('.',',')}
function tm(c,v,first){
  if(c===0)return '';
  var a=Math.abs(c),body=(v&&a===1)?v:(String(a)+(v||''));
  if(first)return (c<0?'−':'')+body;
  return ' '+(c<0?'−':'+')+' '+body;
}
function poly(){var s='',first=true;for(var i=0;i<arguments.length;i++){var c=arguments[i][0],v=arguments[i][1];if(c===0)continue;s+=tm(c,v,first);first=false}return s||'0'}
function fx(r){return r===0?'x':(r>0?'x − '+r:'x + '+(-r))}
function fr(n,d){return '<span class="fr"><i>'+n+'</i><b>'+d+'</b></span>'}
function sysH(a,b){return '<span class="sys"><span class="br"></span><span class="rows"><span>'+a+'</span><span>'+b+'</span></span></span>'}
var RS={'>':'&gt;','<':'&lt;','>=':'≥','<=':'≤'};
function cmp(rel,v){if(v!==v)return false;return rel==='>'?v>0:rel==='<'?v<0:rel==='>='?v>=0:v<=0}
function flipDir(r){return {'>':'<','<':'>','>=':'<=','<=':'>='}[r]}
function togStrict(r){return {'>':'>=','>=':'>','<':'<=','<=':'<'}[r]}
// множество: [[a,b,lc,rc],...], a/b = null для бесконечности
function solveSet(crit,pred){
  var c=crit.slice().sort(function(u,v){return u-v}).filter(function(v,i,a){return i===0||v!==a[i-1]});
  var n=c.length,atoms=[];
  for(var k=0;k<=n;k++){
    var s=n===0?0:(k===0?c[0]-1:(k===n?c[n-1]+1:(c[k-1]+c[k])/2));
    atoms.push(pred(s));
    if(k<n)atoms.push(pred(c[k]));
  }
  var out=[],j=0,m=atoms.length;
  while(j<m){
    if(!atoms[j]){j++;continue}
    var s0=j;while(j+1<m&&atoms[j+1])j++;var e=j;j++;
    var a,b,lc,rc;
    if(s0%2===1){a=c[(s0-1)/2];lc=true}else{var si=s0/2;if(si===0){a=null;lc=false}else{a=c[si-1];lc=false}}
    if(e%2===1){b=c[(e-1)/2];rc=true}else{var ei=e/2;if(ei===n){b=null;rc=false}else{b=c[ei];rc=false}}
    out.push([a,b,lc,rc]);
  }
  return out;
}
function ivs(i){
  if(i[0]!==null&&i[0]===i[1])return '{'+fm(i[0])+'}';
  var l=i[0]===null?'(−∞':((i[2]?'[':'(')+fm(i[0]));
  var r=i[1]===null?'+∞)':(fm(i[1])+(i[3]?']':')'));
  return l+'; '+r;
}
function setStr(S){return S.length?S.map(ivs).join(' ∪ '):'решений нет'}
function nline(S,ticks,w){
  w=w||300;var H=46,ay=30,L=14,R=w-14;
  var ts=ticks.slice().sort(function(a,b){return a-b});
  var lo=ts[0],hi=ts[ts.length-1],span=Math.max(hi-lo,1),pad=span*0.35+0.8,x0=lo-pad,x1=hi+pad;
  function X(v){return L+(v-x0)/(x1-x0)*(R-L)}
  var col='#f3ead7',sol='#f0a35e',bg='#1a3329';
  var o='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+H+'" width="'+w+'" height="'+H+'" style="max-width:100%;height:auto">';
  o+='<line x1="'+(L-6)+'" y1="'+ay+'" x2="'+(R+6)+'" y2="'+ay+'" stroke="'+col+'" stroke-width="1.4"/>';
  o+='<path d="M'+(R+8)+' '+ay+' l-6 -3.5 v7 z" fill="'+col+'"/>';
  ts.forEach(function(t){var x=X(t).toFixed(1);o+='<line x1="'+x+'" y1="'+(ay-3)+'" x2="'+x+'" y2="'+(ay+3)+'" stroke="'+col+'" stroke-width="1.2"/><text x="'+x+'" y="'+(ay+15)+'" font-size="10.5" text-anchor="middle" fill="'+col+'" font-family="Arial,sans-serif">'+fm(t)+'</text>'});
  S.forEach(function(i){
    var a=i[0],b=i[1],lc=i[2],rc=i[3];
    if(a!==null&&a===b){o+='<circle cx="'+X(a).toFixed(1)+'" cy="'+ay+'" r="3.6" fill="'+sol+'" stroke="'+sol+'" stroke-width="1.4"/>';return}
    var xa=a===null?L-4:X(a),xb=b===null?R+4:X(b);
    o+='<line x1="'+xa.toFixed(1)+'" y1="'+(ay-8)+'" x2="'+xb.toFixed(1)+'" y2="'+(ay-8)+'" stroke="'+sol+'" stroke-width="4.5"/>';
    if(a!==null)o+='<circle cx="'+xa.toFixed(1)+'" cy="'+ay+'" r="3.6" fill="'+(lc?sol:bg)+'" stroke="'+sol+'" stroke-width="1.4"/>';
    if(b!==null)o+='<circle cx="'+xb.toFixed(1)+'" cy="'+ay+'" r="3.6" fill="'+(rc?sol:bg)+'" stroke="'+sol+'" stroke-width="1.4"/>';
  });
  return o+'</svg>';
}
function sameSet(A,B){return JSON.stringify(A)===JSON.stringify(B)}
// описание знаков справа налево для текста решения
function signsText(crit,g){
  var c=crit.slice().sort(function(u,v){return u-v}).filter(function(v,i,a){return i===0||v!==a[i-1]});
  var parts=[],n=c.length;
  for(var k=n;k>=0;k--){
    var s=k===n?c[n-1]+1:(k===0?c[0]-1:(c[k-1]+c[k])/2);
    var v=g(s),sg=v!==v?'?':(v>0?'+':'−');
    var lab=k===n?'(' + fm(c[n-1])+'; +∞)':(k===0?'(−∞; '+fm(c[0])+')':'('+fm(c[k-1])+'; '+fm(c[k])+')');
    parts.push(sg+' на '+lab);
  }
  return parts.join(', ');
}
var TYPES={lin:{name:'Линейные'},sys:{name:'Системы линейных'},quad:{name:'Квадратные'},frac:{name:'Дробные, метод интервалов'},mult:{name:'Кратные корни'},cub:{name:'Кубические, группировка'}};
var GEN={
 lin:function(){
  for(;;){
   var p1=rnd(-5,6),p2=rnd(-5,6),m=p1-p2;
   if(m===0||Math.abs(m)>5)continue;
   var k=rnd(-5,5),q1=rnd(-9,9),q2=q1+m*k;
   if(Math.abs(q2)>14)continue;
   var rel=pick(['>','<','>=','<=']);
   var g=function(x){return (p1-p2)*x+(q1-q2)};
   var lhs=poly([p1,'x'],[q1,'']),rhs=poly([p2,'x'],[q2,'']);
   var fin=m>0?rel:flipDir(rel);
   return {cond:lhs+' '+RS[rel]+' '+rhs,gs:[g],rels:[rel],crit:[k],mode:'and',
    hint:'Соберите слагаемые с x в одной части, числа в другой. Если делите на отрицательное число, смените знак неравенства.',
    sol:'<p>Переносим: '+poly([m,'x'])+' '+RS[rel]+' '+fm(q2-q1)+'.</p><p>Делим на '+fm(m)+(m<0?' (отрицательное число, знак меняется)':'')+': x '+RS[fin]+' '+fm(k)+'.</p>',
    ticks:[k]};
  }
 },
 sys:function(){
  for(;;){
   var k1=rnd(-6,3),k2=rnd(-3,6),bounded=Math.random()<.7;
   if(bounded){if(k2-k1<2)continue}else{if(k1===k2)continue}
   var d1='>',d2=bounded?'<':'>';
   var m1=pick([1,2,3,-1,-2]),m2=pick([1,2,3,-1,-2]),q1=rnd(-5,5),q2=rnd(-5,5);
   var s1=Math.random()<.5,s2=Math.random()<.5;
   var x1=s1?d1:d1+'=',x2=s2?d2:d2+'=';
   var r1=m1>0?x1:flipDir(x1),r2=m2>0?x2:flipDir(x2);
   var c1=m1*k1+q1,c2=m2*k2+q2;
   var gs=[function(x){return m1*x+q1-c1},function(x){return m2*x+q2-c2}];
   return {cond:sysH(poly([m1,'x'],[q1,''])+' '+RS[r1]+' '+fm(c1),poly([m2,'x'],[q2,''])+' '+RS[r2]+' '+fm(c2)),gs:gs,rels:[r1,r2],crit:[k1,k2],mode:'and',
    hint:'Решите каждое неравенство отдельно, отметьте решения на одной прямой и возьмите общую часть. Помните про смену знака при делении на отрицательное число.',
    sol:'<p>Первое: x '+RS[x1]+' '+fm(k1)+'. Второе: x '+RS[x2]+' '+fm(k2)+'.</p><p>Общая часть: '+setStr(solveSet([k1,k2],function(x){return cmp(r1,gs[0](x))&&cmp(r2,gs[1](x))}))+'.</p>',
    ticks:[k1,k2]};
  }
 },
 quad:function(){
  for(;;){
   var r1=rnd(-6,4),r2=r1+rnd(2,8);
   if(r2>6)continue;
   var a=pick([1,1,-1,2]),rel=pick(['>','<','>=','<=']);
   var g=function(x){return a*(x-r1)*(x-r2)};
   var cond=poly([a,'x²'],[-a*(r1+r2),'x'],[a*r1*r2,''])+' '+RS[rel]+' 0';
   return {cond:cond,gs:[g],rels:[rel],crit:[r1,r2],mode:'and',
    hint:'Найдите корни. Если старший коэффициент отрицательный, умножьте на −1 и смените знак. Ветви параболы вверх: «&gt; 0» — вне корней, «&lt; 0» — между корнями.',
    sol:'<p>Корни: x₁ = '+fm(r1)+', x₂ = '+fm(r2)+'.'+(a<0?' Старший коэффициент отрицательный: ветви вниз (или умножьте на −1 и смените знак).':' Ветви вверх.')+'</p><p>Выбираем нужные промежутки по знаку: '+signsText([r1,r2],g)+'.</p>',
    ticks:[r1,r2]};
  }
 },
 frac:function(){
  for(;;){
   var v=Math.random()<.5,rel=pick(['>','<','>=','<=']);
   var rs=[rnd(-6,6),rnd(-6,6),rnd(-6,6)];
   if(rs[0]===rs[1]||rs[0]===rs[2]||rs[1]===rs[2])continue;
   var num,den,gn,gd,ntext,dtext,crit;
   if(v){ntext='('+fx(rs[0])+')('+fx(rs[1])+')';dtext=fx(rs[2]);gn=function(x){return (x-rs[0])*(x-rs[1])};gd=function(x){return x-rs[2]}}
   else{ntext=fx(rs[0]);dtext='('+fx(rs[1])+')('+fx(rs[2])+')';gn=function(x){return x-rs[0]};gd=function(x){return (x-rs[1])*(x-rs[2])}}
   var g=function(x){var d=gd(x);return d===0?NaN:gn(x)*d};
   var zn=v?[rs[0],rs[1]]:[rs[0]],zd=v?[rs[2]]:[rs[1],rs[2]];
   return {cond:fr(ntext,dtext)+' '+RS[rel]+' 0',gs:[g],rels:[rel],crit:rs.slice(),mode:'and',
    hint:'Отметьте нули числителя ('+zn.map(fm).join(', ')+') и знаменателя ('+zd.map(fm).join(', ')+'). Нули знаменателя всегда выколоты; нули числителя закрашены только при ≥ и ≤. Расставьте знаки справа налево.',
    sol:'<p>Нули числителя: '+zn.map(fm).join(', ')+'. Нули знаменателя (выколоты): '+zd.map(fm).join(', ')+'.</p><p>Знаки: '+signsText(rs,g)+'.</p>',
    ticks:rs.slice()};
  }
 },
 mult:function(){
  for(;;){
   var a=rnd(-5,5),b=rnd(-5,5),c=rnd(-5,5);
   if(a===b||a===c||b===c)continue;
   var rel=pick(['>=','<=','>=','<=','>','<']),hasD=Math.random()<.7;
   var g=function(x){var n=(x-a)*(x-a)*(x-b);if(hasD){var d=x-c;return d===0?NaN:n*d}return n};
   var ntext='('+fx(a)+')²('+fx(b)+')';
   var cond=(hasD?fr(ntext,fx(c)):ntext)+' '+RS[rel]+' 0';
   var crit=hasD?[a,b,c]:[a,b];
   return {cond:cond,gs:[g],rels:[rel],crit:crit,mode:'and',
    hint:'Корень x = '+fm(a)+' имеет чётную кратность: знак при переходе через него не меняется. При ≥ и ≤ проверьте отдельно, входит ли эта точка (дробь в ней равна нулю).'+(hasD?' Нуль знаменателя '+fm(c)+' выколот.':''),
    sol:'<p>Нули числителя: '+fm(a)+' (чётная кратность) и '+fm(b)+'.'+(hasD?' Нуль знаменателя (выколот): '+fm(c)+'.':'')+'</p><p>Знаки: '+signsText(crit,g)+'.</p><p>Точка x = '+fm(a)+(rel==='>='||rel==='<='?' обращает выражение в ноль, а знак нестрогий, поэтому она входит в ответ (в том числе как отдельная точка).':' ноль не даёт, а знак строгий, поэтому не входит.')+'</p>',
    ticks:crit.slice()};
  }
 },
 cub:function(){
  for(;;){
   var r=pick([2,3,4,5]),c=rnd(-6,6),rel=pick(['>','<','>=','<=']);
   if(c===r||c===-r||c===0)continue;
   var g=function(x){return (x-c)*(x*x-r*r)};
   var cond=poly([1,'x³'],[-c,'x²'],[-r*r,'x'],[c*r*r,''])+' '+RS[rel]+' 0';
   return {cond:cond,gs:[g],rels:[rel],crit:[-r,r,c],mode:'and',
    hint:'Разложите группировкой: x²(x '+(c<0?'+ '+(-c):'− '+c)+') '+(r*r>0?'− ':'')+(r*r)+'(x '+(c<0?'+ '+(-c):'− '+c)+'). Затем разложите x² − '+(r*r)+' и решите методом интервалов.',
    sol:'<p>x²(x '+(c<0?'+ '+(-c):'− '+c)+') − '+(r*r)+'(x '+(c<0?'+ '+(-c):'− '+c)+') = (x '+(c<0?'+ '+(-c):'− '+c)+')(x − '+r+')(x + '+r+').</p><p>Нули: '+[-r,r,c].sort(function(u,v){return u-v}).map(fm).join(', ')+'. Знаки: '+signsText([-r,r,c],g)+'.</p>',
    ticks:[-r,r,c]};
  }
 }
};
function predFor(t,rels,mode){
  return function(x){
    var res=mode==='or'?false:true;
    for(var i=0;i<t.gs.length;i++){var ok=cmp(rels[i],t.gs[i](x));if(mode==='or')res=res||ok;else res=res&&ok}
    return res;
  };
}
function buildTask(kind){
  var t=GEN[kind]();t.kind=kind;
  t.set=solveSet(t.crit,predFor(t,t.rels,'and'));
  var variants=[t.rels.map(flipDir),t.rels.map(togStrict),t.rels.map(function(r){return flipDir(togStrict(r))})];
  if(t.rels.length===2)variants.push('or');
  if(t.rels.length===1)variants.push([t.rels[0]==='>'||t.rels[0]==='>='?'<':'>']); 
  var seen={};seen[JSON.stringify(t.set)]=1;var wrong=[];
  variants.forEach(function(v){
    var S=v==='or'?solveSet(t.crit,predFor(t,t.rels,'or')):solveSet(t.crit,predFor(t,v,'and'));
    var key=JSON.stringify(S);if(!seen[key]&&S.length){seen[key]=1;wrong.push(S)}
  });
  var extra=[t.rels.map(function(r,i){return i===0?togStrict(r):r}),t.rels.map(function(r,i){return i===0?flipDir(r):r})];
  extra.forEach(function(v){var S=solveSet(t.crit,predFor(t,v,'and'));var key=JSON.stringify(S);if(!seen[key]&&S.length){seen[key]=1;wrong.push(S)}});
  t.wrong=wrong.slice(0,3);
  return t;
}

var keys=Object.keys(TYPES),cur='all',task=null,solved=0,total=0,done=false,tries=0,chips,box;
function drawChips(){chips.innerHTML='';[['all','Все типы']].concat(keys.map(function(k){return[k,TYPES[k].name]})).forEach(function(p){var b=document.createElement('button');b.textContent=p[1];if(p[0]===cur)b.className='on';b.onclick=function(){cur=p[0];drawChips();next()};chips.appendChild(b)})}
function shuffle(a){var r=a.slice();for(var j=r.length-1;j>0;j--){var m=Math.floor(Math.random()*(j+1));var t=r[j];r[j]=r[m];r[m]=t}return r}
function next(){
  var k=cur==='all'?pick(keys):cur;task=buildTask(k);done=false;tries=0;
  var allT=task.ticks;
  var opts=[{S:task.set,ok:true}].concat(task.wrong.map(function(S){return{S:S,ok:false}}));
  box.innerHTML='<span class="tag">'+TYPES[k].name+'</span><div class="cond">Решите неравенство: '+task.cond+'</div><p class="stat">Выберите верный ответ (как в №13): рисунок и запись промежутка.</p><div id="o"></div><button class="btn ghost" id="hb">Подсказка</button><button class="btn ghost" id="sb">Показать решение</button><button class="btn ghost" id="nb">Другая задача</button><div id="fb"></div>';
  var o=document.getElementById('o');
  shuffle(opts).forEach(function(op){var b=document.createElement('button');b.className='opt';b.innerHTML=nline(op.S,allT)+'<small>'+setStr(op.S)+'</small>';b.onclick=function(){pickOpt(b,op.ok)};o.appendChild(b)});
  document.getElementById('hb').onclick=function(){document.getElementById('fb').innerHTML='<div class="hint">Подсказка: '+task.hint+'</div>'};
  document.getElementById('sb').onclick=function(){document.getElementById('fb').innerHTML='<div class="sol">'+task.sol+'<p>Ответ: '+setStr(task.set)+'.</p></div>'};
  document.getElementById('nb').onclick=next;upd();
}
function pickOpt(b,ok){
  if(done)return;var fb=document.getElementById('fb');tries++;
  if(ok){done=true;total++;if(tries===1)solved++;b.classList.add('ok');[].forEach.call(document.querySelectorAll('.opt'),function(x){x.disabled=true});fb.innerHTML='<div class="ok">Верно.'+(tries>1?' С '+tries+'-й попытки.':'')+'</div><div class="sol">'+task.sol+'</div><button class="btn" onclick="next()">Следующая</button>';upd()}
  else{b.classList.add('bad');b.disabled=true;fb.innerHTML='<div class="bad">Неверно. Проверьте знак при делении на отрицательное число, скобки у концов и выколотые точки. Нажмите «Подсказка».</div>'}
}
function upd(){document.getElementById('st').textContent='С первой попытки верно: '+solved+' из '+total+'.'}
chips=document.getElementById('chips');box=document.getElementById('box');drawChips();next();
</script></body></html>
