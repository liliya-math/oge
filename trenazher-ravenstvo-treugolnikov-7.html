/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {
  --trainer-card-stripe: var(--trainer-blue);
}

  <script>
window.TrainerData={"id":"geometry-7-congruence","version":1,"title":"Равенство треугольников · lili.math","heading":"Равенство треугольников","subtitle":"Повторение геометрии и доказательства","description":"Интерактивный тренажёр по геометрии","grade":"7 класс","stages":[{"name":"Точки, прямые и отрезки","subtitle":"","title":"Точки, прямые и отрезки","intro":"\u003csection class=\"theory-topic\">\u003ch3>Прямая, луч и отрезок\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Прямая, луч и отрезок\u003c/strong> – геометрические фигуры, которые различаются границами. Прямая бесконечна в обе стороны, у луча есть только начало, у отрезка есть два конца.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98H289\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Если B между A и C, то AC = AB + BC. На прямой через A и B луч AB начинается в A и проходит через B.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Середина отрезка\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Середина отрезка\u003c/strong> – точка отрезка, которая делит его на две равные части.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98H289\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Если B – середина AC, то AB = BC. При AC = 18 см каждая часть равна 9 см.\u003c/div>\u003c/section>","anchor":"Если B между A и C, то AC = AB + BC. На прямой через A и B луч AB начинается в A и проходит через B.","anchorNote":"","tasks":[{"kind":"number","q":"Сколько прямых проходит через две различные точки A и B?","before":"Через две различные точки K и M можно провести ровно одну прямую KM.","answer":1,"see":"Используй свойство прямой через две различные точки.","similar":"Через две различные точки K и M можно провести ровно одну прямую KM.","algorithm":"Используй свойство прямой через две различные точки.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Используй свойство прямой через две различные точки.","Через A и B проходит одна прямая."],"unit":""},{"kind":"choice","q":"Укажи начало луча BA.","before":"У луча KM начало K. Вторая буква указывает точку, через которую проходит луч.","answer":"B","see":"Прочитай первую букву в обозначении луча.","similar":"У луча KM начало K. Вторая буква указывает точку, через которую проходит луч.","algorithm":"Прочитай первую букву в обозначении луча.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Прочитай первую букву в обозначении луча.","Начало луча BA – точка B."],"options":["A","Середина BA","B"],"unit":""},{"kind":"number","q":"B лежит между A и C. AB = 7 см, AC = 19 см. Найди BC в сантиметрах.","before":"Если K между M и P, MP = 15 см и MK = 6 см, то KP = 15 − 6 = 9 см.","answer":12,"see":"Запиши равенство AC = AB + BC.","similar":"Если K между M и P, MP = 15 см и MK = 6 см, то KP = 15 − 6 = 9 см.","algorithm":"Запиши равенство AC = AB + BC.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Запиши равенство AC = AB + BC.","Вычти AB из AC: 19 − 7 = 12 см."],"unit":""},{"kind":"number","q":"M – середина AB. AM = 13 см. Найди AB в сантиметрах.","before":"Если O – середина PQ и PO = 4 см, то OQ = 4 см и PQ = 8 см.","answer":26,"see":"Отметь две равные части отрезка.","similar":"Если O – середина PQ и PO = 4 см, то OQ = 4 см и PQ = 8 см.","algorithm":"Отметь две равные части отрезка.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Отметь две равные части отрезка.","AB = AM + MB = 13 + 13 = 26 см."],"unit":""}]},{"name":"Углы и биссектриса","subtitle":"","title":"Углы и биссектриса","intro":"\u003csection class=\"theory-topic\">\u003ch3>Угол\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Угол\u003c/strong> – фигура, образованная двумя лучами с общим началом. Общее начало – вершина, лучи – стороны угла.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">В записи ∠ABC средняя буква B обозначает вершину. Стороны угла – лучи BA и BC.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Биссектриса угла\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Биссектриса угла\u003c/strong> – луч, выходящий из вершины угла и делящий угол на два равных угла.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Если луч BD делит ∠ABC величиной 70° пополам, то ∠ABD = ∠DBC = 35°.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Виды углов\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Виды углов\u003c/strong> – острый угол меньше 90°, прямой равен 90°, тупой больше 90° и меньше 180°, развёрнутый равен 180°.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003c/svg>\u003cdiv class=\"theory-cell\">Угол 45° острый, 90° прямой, 135° тупой, 180° развёрнутый.\u003c/div>\u003c/section>","anchor":"В записи ∠ABC средняя буква B обозначает вершину. Стороны угла – лучи BA и BC.","anchorNote":"","tasks":[{"kind":"choice","q":"Назови вершину ∠KMP.","before":"В ∠ABC вершина B.","answer":"M","see":"Найди среднюю букву.","similar":"В ∠ABC вершина B.","algorithm":"Найди среднюю букву.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди среднюю букву.","Вершина – M."],"options":["M","K","P"],"unit":""},{"kind":"choice","q":"Как называется угол 112°?","before":"Угол 125° больше 90° и меньше 180°, поэтому он тупой.","answer":"Тупой","see":"Сравни 112° с 90° и 180°.","similar":"Угол 125° больше 90° и меньше 180°, поэтому он тупой.","algorithm":"Сравни 112° с 90° и 180°.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сравни 112° с 90° и 180°.","112° находится между ними. Угол тупой."],"options":["Острый","Прямой","Развёрнутый","Тупой"],"unit":""},{"kind":"number","q":"Луч BD проходит внутри ∠ABC. ∠ABD = 28°, ∠DBC = 37°. Найди ∠ABC в градусах.","before":"Если луч делит угол на части 18° и 40°, весь угол равен 58°.","answer":65,"see":"Сложи величины двух частей угла.","similar":"Если луч делит угол на части 18° и 40°, весь угол равен 58°.","algorithm":"Сложи величины двух частей угла.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сложи величины двух частей угла.","28 + 37 = 65°."],"unit":""},{"kind":"number","q":"BD – биссектриса ∠ABC. ∠ABD = 46°. Найди ∠ABC в градусах.","before":"Биссектриса разделила угол на две части по 32°. Весь угол равен 64°.","answer":92,"see":"Вторая часть равна первой.","similar":"Биссектриса разделила угол на две части по 32°. Весь угол равен 64°.","algorithm":"Вторая часть равна первой.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Вторая часть равна первой.","∠ABC = 46° + 46° = 92°."],"unit":""}]},{"name":"Смежные, вертикальные и параллельные","subtitle":"","title":"Смежные, вертикальные и параллельные","intro":"\u003csection class=\"theory-topic\">\u003ch3>Смежные углы\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Смежные углы\u003c/strong> – два угла с общей стороной, две другие стороны которых образуют развёрнутый угол.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L289 30M25 30L289 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"157\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"157\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">O\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Сумма смежных углов равна 180°. Если один угол 70°, другой равен 110°.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Вертикальные углы\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Вертикальные углы\u003c/strong> – два угла, стороны одного из которых являются продолжениями сторон другого.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L289 30M25 30L289 98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"289\" cy=\"30\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"21\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"25\" cy=\"30\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"21\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003ccircle cx=\"157\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"157\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">O\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">∠AOC и ∠BOD расположены напротив друг друга и равны.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Перпендикулярные и параллельные прямые\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Перпендикулярные и параллельные прямые\u003c/strong> – перпендикулярные прямые пересекаются под прямым углом. Параллельные прямые лежат в одной плоскости и не пересекаются.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M20 38H294M20 91H294M76 112L232 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003c/svg>\u003cdiv class=\"theory-cell\">Секущая пересекает обе прямые. При параллельных прямых накрест лежащие и соответственные углы равны, а сумма односторонних равна 180°. Эти условия по отдельности служат и признаками параллельности.\u003c/div>\u003c/section>","anchor":"Сумма смежных углов равна 180°. Если один угол 70°, другой равен 110°.","anchorNote":"","tasks":[{"kind":"number","q":"Один из смежных углов равен 73°. Найди другой в градусах.","before":"Угол, смежный с углом 60°, равен 180° − 60° = 120°.","answer":107,"see":"Сумма смежных углов равна 180°.","similar":"Угол, смежный с углом 60°, равен 180° − 60° = 120°.","algorithm":"Сумма смежных углов равна 180°.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сумма смежных углов равна 180°.","180 − 73 = 107°."],"unit":""},{"kind":"number","q":"Один из вертикальных углов равен 117°. Найди другой в градусах.","before":"Если один из вертикальных углов равен 55°, другой тоже равен 55°.","answer":117,"see":"Вспомни свойство вертикальных углов.","similar":"Если один из вертикальных углов равен 55°, другой тоже равен 55°.","algorithm":"Вспомни свойство вертикальных углов.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Вспомни свойство вертикальных углов.","Оба угла равны 117°."],"unit":""},{"kind":"choice","q":"Один из углов при пересечении двух прямых равен 90°. Как расположены прямые?","before":"Если прямые образуют прямой угол, их называют перпендикулярными.","answer":"Перпендикулярны","see":"Найди вид угла 90°.","similar":"Если прямые образуют прямой угол, их называют перпендикулярными.","algorithm":"Найди вид угла 90°.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди вид угла 90°.","Прямые пересекаются под прямым углом, значит, они перпендикулярны."],"options":["Совпадают","Перпендикулярны","Параллельны"],"unit":""},{"kind":"number","q":"Параллельные прямые пересечены секущей. Один из односторонних углов равен 68°. Найди другой в градусах.","before":"При параллельных прямых односторонние углы в сумме дают 180°. Для 75° второй угол равен 105°.","answer":112,"see":"Запиши сумму односторонних углов.","similar":"При параллельных прямых односторонние углы в сумме дают 180°. Для 75° второй угол равен 105°.","algorithm":"Запиши сумму односторонних углов.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Запиши сумму односторонних углов.","Вычти 68° из 180°. Получится 112°."],"unit":""},{"kind":"choice","q":"При пересечении двух прямых секущей накрест лежащие углы равны 53° и 53°. Какой вывод верен?","before":"Если соответственные углы равны, то прямые параллельны. Равенство накрест лежащих углов тоже даёт параллельность.","answer":"Прямые параллельны","see":"Найди пару накрест лежащих углов.","similar":"Если соответственные углы равны, то прямые параллельны. Равенство накрест лежащих углов тоже даёт параллельность.","algorithm":"Найди пару накрест лежащих углов.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди пару накрест лежащих углов.","Углы равны, поэтому по признаку прямые параллельны."],"options":["Прямые перпендикулярны","Прямые пересекаются","Прямые параллельны"],"unit":""}]},{"name":"Треугольник и его линии","subtitle":"","title":"Треугольник и его линии","intro":"\u003csection class=\"theory-topic\">\u003ch3>Треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Треугольник\u003c/strong> – фигура из трёх точек, не лежащих на одной прямой, и трёх отрезков, соединяющих эти точки попарно.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">У △ABC вершины A, B, C и стороны AB, BC, AC. Периметр – сумма длин сторон. Каждая сторона меньше суммы двух других.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Медиана, биссектриса и высота\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Медиана, биссектриса и высота\u003c/strong> – отрезки, проведённые из вершины. Медиана идёт к середине противоположной стороны. Биссектриса делит угол вершины пополам и заканчивается на противоположной стороне. Высота перпендикулярна прямой, содержащей противоположную сторону.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Из B к стороне AC можно провести три разных отрезка. Для проверки ищи равные части AC, равные углы в B или прямой угол у основания.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Равнобедренный треугольник\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равнобедренный треугольник\u003c/strong> – треугольник с двумя равными сторонами. Треугольник, у которого равны все три стороны, называют равносторонним.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">При AB = BC основание – AC, углы при A и C равны. Медиана, биссектриса и высота из B к AC совпадают.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Внутренние и внешний углы\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Внутренние и внешний углы\u003c/strong> – сумма внутренних углов треугольника равна 180°. Внешний угол смежен с внутренним и равен сумме двух внутренних углов, не смежных с ним.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">При углах A = 50° и B = 60° угол C равен 70°, а внешний при C равен 110°. Треугольник с прямым углом – прямоугольный, с тупым – тупоугольный, со всеми острыми – остроугольный.\u003c/div>\u003c/section>","anchor":"У △ABC вершины A, B, C и стороны AB, BC, AC. Периметр – сумма длин сторон. Каждая сторона меньше суммы двух других.","anchorNote":"","tasks":[{"kind":"number","q":"Стороны треугольника равны 5, 7 и 9 см. Найди периметр в сантиметрах.","before":"Для сторон 3, 4 и 5 см периметр равен 12 см.","answer":21,"see":"Сложи длины всех трёх сторон.","similar":"Для сторон 3, 4 и 5 см периметр равен 12 см.","algorithm":"Сложи длины всех трёх сторон.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сложи длины всех трёх сторон.","5 + 7 + 9 = 21 см."],"unit":""},{"kind":"choice","q":"Можно ли построить треугольник со сторонами 4, 6 и 10 см?","before":"Стороны 3, 4 и 8 см не образуют треугольник: 3 + 4 меньше 8.","answer":"Нет","see":"Сравни наибольшую сторону с суммой двух других.","similar":"Стороны 3, 4 и 8 см не образуют треугольник: 3 + 4 меньше 8.","algorithm":"Сравни наибольшую сторону с суммой двух других.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сравни наибольшую сторону с суммой двух других.","4 + 6 = 10, а требуется строгое неравенство. Такой треугольник построить нельзя."],"options":["Да","Нет"],"unit":""},{"kind":"choice","q":"BK соединяет вершину B с серединой AC. Как называется BK?","before":"Если AL идёт из A к середине BC, то AL – медиана.","answer":"Медиана","see":"Проверь, куда приходит отрезок из вершины.","similar":"Если AL идёт из A к середине BC, то AL – медиана.","algorithm":"Проверь, куда приходит отрезок из вершины.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Проверь, куда приходит отрезок из вершины.","Точка K – середина AC, значит, BK – медиана."],"options":["Биссектриса","Медиана","Высота"],"unit":""},{"kind":"choice","q":"BK перпендикулярен прямой AC, K лежит на продолжении AC. Как называется BK?","before":"Высота из A образует прямой угол с прямой BC. Её основание может лежать на продолжении стороны BC.","answer":"Высота","see":"Проверь, есть ли прямой угол с прямой противоположной стороны.","similar":"Высота из A образует прямой угол с прямой BC. Её основание может лежать на продолжении стороны BC.","algorithm":"Проверь, есть ли прямой угол с прямой противоположной стороны.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Проверь, есть ли прямой угол с прямой противоположной стороны.","BK ⟂ AC, поэтому BK – высота."],"options":["Высота","Медиана","Биссектриса"],"unit":""},{"kind":"number","q":"В △ABC стороны AB и BC равны, ∠A = 44°. Найди ∠B в градусах.","before":"Если углы при основании по 55°, угол при вершине равен 180° − 110° = 70°.","answer":92,"see":"Найди основание: AC. Углы A и C при основании равны.","similar":"Если углы при основании по 55°, угол при вершине равен 180° − 110° = 70°.","algorithm":"Найди основание: AC. Углы A и C при основании равны.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди основание: AC. Углы A и C при основании равны.","∠C = 44°. Сумма углов при основании 88°.","∠B = 180° − 88° = 92°."],"unit":""},{"kind":"number","q":"∠A = 42°, ∠B = 63°. Найди внешний угол при C в градусах.","before":"Если углы при A и B равны 40° и 65°, внешний угол при C равен 105°.","answer":105,"see":"Возьми два внутренних угла, которые не смежны с внешним при C.","similar":"Если углы при A и B равны 40° и 65°, внешний угол при C равен 105°.","algorithm":"Возьми два внутренних угла, которые не смежны с внешним при C.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Возьми два внутренних угла, которые не смежны с внешним при C.","42 + 63 = 105°."],"unit":""}]},{"name":"Равенство и три признака","subtitle":"","title":"Равенство и три признака","intro":"\u003csection class=\"theory-topic\">\u003ch3>Равные треугольники\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Равные треугольники\u003c/strong> – треугольники, которые совмещаются при наложении. Соответственные стороны и углы таких треугольников равны.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98ZM177 98L228 22L289 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"177\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"177\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003ccircle cx=\"228\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"228\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">E\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">F\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">В записи △ABC = △DEF соответствие читается по порядку: A и D, B и E, C и F. Значит, AC = DF.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Первый признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Первый признак\u003c/strong> – если две стороны и угол между ними одного треугольника равны соответственно двум сторонам и углу между ними другого, то треугольники равны.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98ZM177 98L228 22L289 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M45 54l11 8m141 -8l11 8M79 92v12m7 -12v12m145 -12v12m7 -12v12M40 77Q52 83 51 98m141 -21q12 6 11 21\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"177\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"177\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003ccircle cx=\"228\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"228\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">E\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">F\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">На схеме AB = DE, AC = DF и ∠A = ∠D. Стороны AB и AC встречаются в A.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Второй признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Второй признак\u003c/strong> – если сторона и два прилежащих к ней угла одного треугольника равны соответственно стороне и двум прилежащим к ней углам другого, то треугольники равны.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98ZM177 98L228 22L289 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M79 92v12m152 -12v12M40 77Q52 83 51 98m141 -21q12 6 11 21M111 98Q111 83 121 78m142 20q0 -15 10 -20\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"177\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"177\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003ccircle cx=\"228\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"228\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">E\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">F\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">На схеме AC = DF, ∠A = ∠D и ∠C = ∠F. Углы отмечены у концов равных сторон.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Третий признак\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Третий признак\u003c/strong> – если три стороны одного треугольника равны соответственно трём сторонам другого, то треугольники равны.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M25 98L76 22L137 98ZM177 98L228 22L289 98Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"M45 54l11 8m141 -8l11 8M79 92v12m7 -12v12m145 -12v12m7 -12v12M99 56l10 -8m-5 14l10 -8m-5 14l10 -8m132 -4l10 -8m-5 14l10 -8m-5 14l10 -8\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"25\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"25\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"76\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"76\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"137\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"137\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"177\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"177\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003ccircle cx=\"228\" cy=\"22\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"228\" y=\"13\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">E\u003c/text>\u003ccircle cx=\"289\" cy=\"98\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"289\" y=\"119\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">F\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Одинаковое число штрихов отмечает соответствующие равные стороны: AB = DE, AC = DF, BC = EF.\u003c/div>\u003c/section>","anchor":"В записи △ABC = △DEF соответствие читается по порядку: A и D, B и E, C и F. Значит, AC = DF.","anchorNote":"","tasks":[{"kind":"choice","q":"△KMP = △RST. Какой стороне равна MP?","before":"В записи △ABC = △DEF стороне BC соответствует EF.","answer":"ST","see":"Сопоставь буквы по их месту в записи.","similar":"В записи △ABC = △DEF стороне BC соответствует EF.","algorithm":"Сопоставь буквы по их месту в записи.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Сопоставь буквы по их месту в записи.","M соответствует S, P соответствует T. Значит, MP = ST."],"options":["ST","RS","RT"],"unit":""},{"kind":"choice","q":"AB = DE, BC = EF. Какой угол △ABC должен быть равен ∠E для применения первого признака?","before":"Для сторон KL и KM угол между ними находится в вершине K.","answer":"∠B","see":"Найди общую вершину сторон AB и BC.","similar":"Для сторон KL и KM угол между ними находится в вершине K.","algorithm":"Найди общую вершину сторон AB и BC.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди общую вершину сторон AB и BC.","Общая вершина B, а DE и EF встречаются в E. Нужны ∠B и ∠E."],"options":["∠A","∠C","∠B"],"unit":""},{"kind":"choice","q":"AC = DF, ∠A = ∠D и ∠C = ∠F. По какому признаку треугольники равны?","before":"Если KM = PS, ∠K = ∠P и ∠M = ∠S, второй признак применим: углы лежат у концов KM и PS.","answer":"По второму","see":"Проверь, при каких вершинах даны углы.","similar":"Если KM = PS, ∠K = ∠P и ∠M = ∠S, второй признак применим: углы лежат у концов KM и PS.","algorithm":"Проверь, при каких вершинах даны углы.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Проверь, при каких вершинах даны углы.","Углы при A и C прилежат к AC, углы при D и F – к DF.","Треугольники равны по второму признаку."],"options":["По третьему","По второму","По первому"],"unit":""},{"kind":"choice","q":"AB = FD, BC = DE, AC = FE. Как записать равенство, если первый треугольник записан как △ABC?","before":"Если KL = PR, LM = RS и KM = PS, вершина L соответствует R, а запись имеет вид △KLM = △PRS.","answer":"△ABC = △FDE","see":"Найди общую вершину сторон AB и BC. Это B.","similar":"Если KL = PR, LM = RS и KM = PS, вершина L соответствует R, а запись имеет вид △KLM = △PRS.","algorithm":"Найди общую вершину сторон AB и BC. Это B.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди общую вершину сторон AB и BC. Это B.","Соответствующие стороны FD и DE встречаются в D, поэтому B соответствует D.","Тогда A соответствует F, C соответствует E. Записываем △ABC = △FDE по третьему признаку."],"options":["△ABC = △FDE","△ABC = △DEF","△ABC = △FED"],"unit":""},{"kind":"choice","q":"Доказывает ли равенство трёх соответственных углов равенство треугольников?","before":"У равносторонних треугольников со сторонами 3 см и 7 см все углы по 60°, а размеры разные.","answer":"Нет","see":"Представь два треугольника одинаковой формы разных размеров.","similar":"У равносторонних треугольников со сторонами 3 см и 7 см все углы по 60°, а размеры разные.","algorithm":"Представь два треугольника одинаковой формы разных размеров.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Представь два треугольника одинаковой формы разных размеров.","Равенство углов допускает разные длины сторон, поэтому данных недостаточно."],"options":["Да, по второму признаку","Да, по третьему признаку","Нет"],"unit":""}]},{"name":"Доказательства","subtitle":"","title":"Доказательства","intro":"\u003csection class=\"theory-topic\">\u003ch3>Общая сторона\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Общая сторона\u003c/strong> – сторона, которая входит в оба рассматриваемых треугольника.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M62 64L134 15L244 64L134 113ZM62 64H244\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"62\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"62\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"134\" cy=\"15\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"134\" y=\"6\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"244\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"244\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"134\" cy=\"113\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"134\" y=\"134\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">У △ABC и △ADC общая сторона AC. Записываем AC = AC и подбираем ещё два равенства для нужного признака.\u003c/div>\u003c/section>\u003csection class=\"theory-topic\">\u003ch3>Доказательство равенства\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Доказательство равенства\u003c/strong> – рассуждение, в котором обосновывают каждое нужное равенство, называют признак и записывают вершины в соответствующем порядке.\u003c/p>\u003csvg viewBox=\"0 0 315 150\" width=\"100%\" style=\"max-width:480px;color:#eee0c8\" role=\"img\" aria-label=\"Схема к теме\">\u003cpath d=\"M62 64L134 15L244 64L134 113ZM62 64H244\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003cpath d=\"\" fill=\"none\" stroke=\"#ed975f\" stroke-width=\"2.5\"/>\u003ccircle cx=\"62\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"62\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">A\u003c/text>\u003ccircle cx=\"134\" cy=\"15\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"134\" y=\"6\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">B\u003c/text>\u003ccircle cx=\"244\" cy=\"64\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"244\" y=\"55\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">C\u003c/text>\u003ccircle cx=\"134\" cy=\"113\" r=\"3\" fill=\"#ed975f\"/>\u003ctext x=\"134\" y=\"134\" text-anchor=\"middle\" fill=\"currentColor\" font-size=\"16\">D\u003c/text>\u003c/svg>\u003cdiv class=\"theory-cell\">Если AB = AD и BC = DC по условию, а AC = AC, то △ABC = △ADC по третьему признаку. Отсюда ∠B = ∠D.\u003c/div>\u003c/section>","anchor":"У △ABC и △ADC общая сторона AC. Записываем AC = AC и подбираем ещё два равенства для нужного признака.","anchorNote":"","tasks":[{"kind":"choice","q":"У △ABC и △ADC даны AB = AD и ∠BAC = ∠DAC. Какого факта хватает для первого признака?","before":"В △KLM и △KNM сторона KM общая. При KL = KN и равных углах между этими сторонами и KM применим первый признак.","answer":"AC = AC","see":"Найди сторону, которая входит в оба треугольника.","similar":"В △KLM и △KNM сторона KM общая. При KL = KN и равных углах между этими сторонами и KM применим первый признак.","algorithm":"Найди сторону, которая входит в оба треугольника.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди сторону, которая входит в оба треугольника.","AC = AC. Углы BAC и DAC лежат между двумя нужными сторонами.","По первому признаку △ABC = △ADC."],"options":["AC = AC","BC = DC","∠B = ∠D"],"unit":""},{"kind":"choice","q":"Отрезки AC и BD пересекаются в O. AO = CO, BO = DO. По какому признаку равны △AOB и △COD?","before":"Если отрезки KL и MN пересекаются в P и делятся пополам, то △KPM и △LPN равны по двум половинам отрезков и вертикальным углам.","answer":"По первому","see":"Выпиши AO = CO и BO = DO по условию.","similar":"Если отрезки KL и MN пересекаются в P и делятся пополам, то △KPM и △LPN равны по двум половинам отрезков и вертикальным углам.","algorithm":"Выпиши AO = CO и BO = DO по условию.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Выпиши AO = CO и BO = DO по условию.","∠AOB = ∠COD как вертикальные. Это углы между данными сторонами.","△AOB = △COD по первому признаку."],"options":["По второму","По третьему","По первому"],"unit":""},{"kind":"choice","q":"AB ∥ CD и BC ∥ AD. Как доказать равенство △ABC и △CDA по диагонали AC?","before":"Если у двух треугольников есть общая сторона и равны пары углов при её концах, применяем второй признак.","answer":"По AC и двум парам накрест лежащих углов","see":"AC – общая сторона и секущая для обеих пар параллельных прямых.","similar":"Если у двух треугольников есть общая сторона и равны пары углов при её концах, применяем второй признак.","algorithm":"AC – общая сторона и секущая для обеих пар параллельных прямых.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["AC – общая сторона и секущая для обеих пар параллельных прямых.","∠BAC = ∠DCA, так как AB ∥ CD. ∠BCA = ∠DAC, так как BC ∥ AD.","По стороне AC и двум прилежащим углам △ABC = △CDA."],"options":["По AC и одной паре углов","По AC и двум парам накрест лежащих углов","По AC и вертикальным углам"],"unit":""},{"kind":"choice","q":"В равнобедренном △ABC с AB = BC точка M – середина AC. Как доказать, что BM – высота?","before":"Если луч делит развёрнутый угол на два равных смежных угла, каждый из них 90°.","answer":"Доказать равенство △ABM и △CBM и сравнить углы при M","see":"AB = CB по условию, AM = CM по определению середины, BM – общая сторона.","similar":"Если луч делит развёрнутый угол на два равных смежных угла, каждый из них 90°.","algorithm":"AB = CB по условию, AM = CM по определению середины, BM – общая сторона.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["AB = CB по условию, AM = CM по определению середины, BM – общая сторона.","△ABM = △CBM по третьему признаку. Поэтому ∠AMB = ∠CMB.","Эти углы смежные, поэтому каждый равен 90°. Значит, BM ⟂ AC."],"options":["Доказать равенство △ABM и △CBM и сравнить углы при M","Сравнить углы A и C без рассмотрения углов при M","Использовать только равенство AB = BC"],"unit":""},{"kind":"number","q":"В четырёхугольнике ABCD диагональ AC лежит внутри. AB = AD, BC = CD, ∠BAC = 34°. Найди ∠BAD в градусах.","before":"Если диагональ делит угол 76° на две равные части, каждая часть равна 38°. Если известна одна часть, для целого её удваивают.","answer":68,"see":"AB = AD и BC = DC по условию, AC = AC как общая сторона.","similar":"Если диагональ делит угол 76° на две равные части, каждая часть равна 38°. Если известна одна часть, для целого её удваивают.","algorithm":"AB = AD и BC = DC по условию, AC = AC как общая сторона.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["AB = AD и BC = DC по условию, AC = AC как общая сторона.","△ABC = △ADC по третьему признаку. Поэтому ∠CAD = ∠BAC = 34°.","Диагональ лежит внутри угла BAD. ∠BAD = 34° + 34° = 68°."],"unit":""},{"kind":"choice","q":"Даны AB = DE, AC = DF и ∠B = ∠E. Можно ли сразу применить первый признак?","before":"Для сторон KL и KM первый признак требует угол при K, потому что обе стороны выходят из этой вершины.","answer":"Нет","see":"Найди угол между AB и AC.","similar":"Для сторон KL и KM первый признак требует угол при K, потому что обе стороны выходят из этой вершины.","algorithm":"Найди угол между AB и AC.","retry":"Сверь ответ с условием и отметками на схеме.","steps":["Найди угол между AB и AC.","Стороны встречаются в A, а дан угол при B.","Для первого признака требуются ∠A и ∠D, поэтому сразу его применить нельзя."],"options":["Да","Нет"],"unit":""}]}],"recap":["По первому признаку ищи две стороны и угол между ними.","По второму признаку ищи сторону и два угла при её концах.","По третьему признаку ищи три пары равных сторон.","В записи равенства соблюдай порядок соответствующих вершин.","Для доказательства равенства сторон или углов сначала установи равенство треугольников."]};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();

  <script>(function(){
  'use strict';
  const C=window.TrainerCourse,KEY='lili-trainer-'+C.id+'-'+(C.version||1)+(window.LiliStudy?.suffix||''),TOTAL=C.total;
  let storageOK=true,view='lesson',hints=new Set(),feedback=null,labIndex=0;
  const blank=()=>({stage:0,task:0,solved:[],attempts:{},answers:{}});

  function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||!Number.isInteger(s.stage)||s.stage<0||s.stage>=C.stages.length)return blank();return {stage:s.stage,task:Number.isInteger(s.task)&&s.task>=0&&s.task<C.stages[s.stage].tasks.length?s.task:0,solved:Array.isArray(s.solved)?s.solved.filter(k=>validKey(k)):[],attempts:s.attempts&&typeof s.attempts==='object'?s.attempts:{},answers:s.answers&&typeof s.answers==='object'?s.answers:{}};}catch(e){storageOK=false;return blank();}}
  function validKey(k){if(typeof k!=='string')return false;const a=k.split('-').map(Number);return a.length===2&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&C.stages[a[0]]&&C.stages[a[0]].tasks[a[1]];}
  let state=readState();state.solved=[...new Set(state.solved)];
  const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const number = /\d+(?:[.,]\d+)?/.source;
  const coefficient = `(?:${number}(?:\\s*/\\s*[−-]?${number})?)`;
  const scalar = `[+−-]?(?:${coefficient}(?:[xykb]|kx)?|kx|[xykb])`;
  const term = `(?:\\(${scalar}\\)|${scalar})`;
  const point = `\\(\\s*[−-]?${number}\\s*;\\s*[−-]?${number}\\s*\\)`;
  const expression = new RegExp(`(?<![A-Za-z0-9])(?:${point}|${term}(?:\\s*[=<>≤≥+−·×:/÷*-]\\s*${term})+)(?![A-Za-z0-9])`,'g');
  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>
    [...token].map(letter => `<span class="math-var-${letter}">${letter}</span>`).join(''));
  function plainMath(value) {
    const text = String(value);
    let result = '', end = 0;
    for (const match of text.matchAll(expression)) {
      result += colorVariables(text.slice(end,match.index));
      result += `<span class="math-nowrap">${colorVariables(match[0])}</span>`;
      end = match.index + match[0].length;
    }
    return result + colorVariables(text.slice(end));
  }
  const fractionSymbols={ '¼':[1,4],'½':[1,2],'¾':[3,4],'⅐':[1,7],'⅑':[1,9],'⅒':[1,10],
    '⅓':[1,3],'⅔':[2,3],'⅕':[1,5],'⅖':[2,5],'⅗':[3,5],'⅘':[4,5],'⅙':[1,6],'⅚':[5,6],
    '⅛':[1,8],'⅜':[3,8],'⅝':[5,8],'⅞':[7,8],'↉':[0,3] };
  const fractionAtom=String.raw`(?:\([^()\n]+\)|[−-]?(?:\d+(?:[.,]\d+)?[a-zA-Zа-яА-ЯёЁ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*|[a-zA-Zа-яА-ЯёЁ][a-zA-Zа-яА-ЯёЁ\d⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*))`;
  const fractionPattern=new RegExp(`([${Object.keys(fractionSymbols).join('')}])|(${fractionAtom})\\s*[/⁄∕]\\s*(${fractionAtom})`,'g');
  function fractionMarkup(top,bottom,format){
    const unpack=text=>String(text).replace(/^\((.*)\)$/,'$1');
    const numerator=unpack(top),denominator=unpack(bottom);
    return `<span class="math-fraction" role="math" aria-label="Дробь: числитель ${esc(numerator)}, знаменатель ${esc(denominator)}"><span aria-hidden="true">${format(numerator)}</span><span aria-hidden="true">${format(denominator)}</span></span>`;
  }
  function formatFractions(value,format,formatPart=format){
    const text=String(value);
    let result='',end=0;
    for(const match of text.matchAll(fractionPattern)){
      const parts=match[1]?fractionSymbols[match[1]]:[match[2],match[3]];
      result+=format(text.slice(end,match.index))+fractionMarkup(...parts,formatPart);
      end=match.index+match[0].length;
    }
    return result+format(text.slice(end));
  }
  function mathText(value){return formatFractions(value,plainMath);}
  function mathMarkup(markup){
    return markup.split(/(<svg\b[\s\S]*?<\/svg\s*>|<!--[^]*?-->|<[^>]*>)/gi)
      .map((piece,i)=>i%2?piece:formatFractions(piece,text=>text,plainMath)).join('');
  }
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${mathText(s.name)}<small>${n} / ${s.tasks.length} · ${mathText(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${mathMarkup(t.visual)}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol aria-live="polite">${t.steps.map((x,i)=>`<li ${i ? "hidden" : ""}>${mathText(x)}</li>`).join('')}</ol><button class="secondary" type="button" id="next-solution" ${t.steps.length < 2 ? "hidden" : ""}>Далее · шаг решения</button></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
    $('#next-solution').addEventListener('click', e => {
      $('.solution li[hidden]')?.removeAttribute('hidden');
      if (!$('.solution li[hidden]')) {
        e.currentTarget.hidden = true;
        $('.solution summary').focus({preventScroll:true});
      }
    });

  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:'Можно перейти дальше или открыть пошаговый разбор.'};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
