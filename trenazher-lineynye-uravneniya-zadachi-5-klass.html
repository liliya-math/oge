/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {

  <script>
window.TrainerData={"id":"lineynye-uravneniya-zadachi-5","version":1,"title":"Задачи с уравнениями · lili.math","heading":"Задачи с помощью уравнений","subtitle":"8 тем · 50 заданий с подсказками и разборами","description":"Интерактивный тренажёр по текстовым задачам на линейные уравнения для 5 класса.","grade":"5 класс","stages":[{"name":"Было, добавили, стало","subtitle":"Что спряталось под буквой x?","title":"Что спряталось под буквой x?","intro":"\u003cp>В коробке лежали наклейки. Мы не видели, сколько их было. Положили ещё 3 и насчитали 8. Закроем первое число карточкой с буквой \u003cspan class=\"math-var-x\">x\u003c/span>: \u003cspan class=\"math-var-x\">x\u003c/span> + 3 = 8. Какое число должно быть под карточкой? Пять, ведь 5 + 3 = 8.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 124\" role=\"img\" aria-label=\"Под карточкой x число 5: пять и ещё три дают восемь.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Было\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"228.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"247\" y=\"13\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"271.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"313.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"332\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"366.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">8\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Проверяем\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">5\u003c/text>\u003ctext x=\"228.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"247\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"271.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"313.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"332\" y=\"66\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"366.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">8\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Неизвестное число.\u003c/strong> Число, которое нужно найти. В этой записи оно обозначено буквой \u003cspan class=\"math-var-x\">x\u003c/span>.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Уравнение.\u003c/strong> Равенство с неизвестным числом. Решить уравнение значит найти все числа, при которых равенство верно. Здесь подходит число 5.\u003c/p>","anchor":"Скажи, что означает x.","anchorNote":"В задаче с наклейками x показывает, сколько наклеек было сначала.","tasks":[{"q":"У Вики было несколько наклеек. Она получила ещё 4, и стало 11. Что удобно обозначить за x?","answer":"Число наклеек до подарка","see":"Число до подарка не названо.","similar":"Было несколько яблок, дали ещё 2. За x можно взять число яблок в начале.","algorithm":"Найди в условии величину, значение которой неизвестно.","steps":["x наклеек было.","x + 4 = 11.","x = 7. Проверка: 7 + 4 = 11."],"retry":"Число до подарка не названо.","unit":"","kind":"choice","options":["Число наклеек до подарка","Число наклеек после подарка","Число подаренных наклеек"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было x; Добавили 4; Стало 11\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Добавили\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">4\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Стало\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">11\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Было x карандашей. Отдали 7, осталось 9. Какое уравнение описывает задачу?","answer":"x − 7 = 9","see":"Сначала карандашей было x. После действия их стало меньше.","similar":"Было a книг, 2 взяли: осталось a − 2.","algorithm":"Запиши число карандашей после вычитания и приравняй к остатку.","steps":["Осталось x − 7 карандашей.","По условию осталось 9, значит, x − 7 = 9.","x = 16. Проверка: 16 − 7 = 9."],"retry":"Сначала карандашей было x. После действия их стало меньше.","unit":"","kind":"choice","options":["x + 7 = 9","x − 7 = 9","7 − x = 9","x − 9 = 9"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было x; Отдали 7; Осталось 9\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Отдали\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">7\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">9\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Из 19 шариков убрали несколько, осталось 12. Сколько убрали?","answer":7,"see":"Известно, сколько было и сколько осталось. Неизвестно, сколько убрали.","similar":"Если из 10 яблок осталось 6, убрали 10 − 6 = 4.","algorithm":"Составь уравнение вида «было − убрали = осталось».","steps":["Пусть x шариков убрали.","19 − x = 12, поэтому x = 19 − 12 = 7.","Проверка: 19 − 7 = 12."],"retry":"Если x стоит после минуса, вычти остаток из начального количества.","unit":"шариков","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было 19; Убрали x; Осталось 12\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">19\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Убрали\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">12\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Одинаковые наборы содержат по 6 фломастеров. Всего 42 фломастера. Сколько наборов?","answer":7,"see":"В каждом наборе по 6. Неизвестно число наборов.","similar":"В 4 наборах по 3 карандаша. Всего 3 · 4 = 12.","algorithm":"Обозначь число наборов за x и умножь на 6.","steps":["Нужно узнать, сколько было наборов. Пусть их x. Если в каждом по 6 фломастеров, всего получится 6 · x.","6x = 42.","x = 42 : 6 = 7.","Проверка: 7 · 6 = 42."],"retry":"Проверь, сколько фломастеров получится в твоём числе наборов.","unit":"наборов","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"По 6; x наборов; Всего 42\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">По\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\"  fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"212\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"236.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 3\u003c/text>\u003ctext x=\"8\" y=\"142\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Катя\u003c/text>\u003crect x=\"154\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"212\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"240.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"270\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"298.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>На 3 больше.\u003c/strong> К тому количеству, с которым сравниваем, прибавляем 3. Если Мишиных кубиков \u003cspan class=\"math-var-x\">x\u003c/span>, у Лены \u003cspan class=\"math-var-x\">x\u003c/span> + 3.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>В 3 раза больше.\u003c/strong> Берём исходное количество 3 раза. Если Мишиных кубиков \u003cspan class=\"math-var-x\">x\u003c/span>, у Кати 3 · \u003cspan class=\"math-var-x\">x\u003c/span>, или 3\u003cspan class=\"math-var-x\">x\u003c/span>.\u003c/p>","anchor":"Найди, с кем сравнивают.","anchorNote":"Если сказано «У Димы меньше, чем у Пети», больше у Пети.","tasks":[{"q":"У Оли x бусин. У Кати на 6 бусин больше, чем у Оли. Как записать число бусин Кати?","answer":"x + 6","see":"Больше у Кати. Сравнивают с количеством Оли.","similar":"Если у Оли 10 бусин, у Кати 10 + 6 = 16.","algorithm":"К известному выражению для Оли прибавь разницу.","steps":["У Оли x бусин.","Катино количество состоит из x бусин и ещё 6.","Получаем x + 6."],"retry":"Больше у Кати. Сравнивают с количеством Оли.","unit":"","kind":"choice","options":["x + 6","x − 6","6x","6 − x"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 98\" role=\"img\" aria-label=\"Оля x; Катя x + 6\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Оля\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Катя\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 6\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Димы x марок. Это на 7 марок меньше, чем у Пети. Как записать число марок у Пети?","answer":"x + 7","see":"Слово «это» относится к Диме. У Димы меньше.","similar":"Если у Димы 3 марки и это на 7 меньше, у Пети 10.","algorithm":"Определи, кто имеет больше, затем прибавь разницу к меньшему.","steps":["У Димы меньше марок. Это число мы назвали x.","Чтобы узнать, сколько у Пети, добавим 7. Запись: x + 7."],"retry":"Слово «это» относится к Диме. У Димы меньше.","unit":"","kind":"choice","options":["x − 7","x + 7","7x","7 − x"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 98\" role=\"img\" aria-label=\"Дима x; Петя x + 7\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Дима\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Петя\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 7\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В большой корзине x яблок. В маленькой в 3 раза меньше. Как записать число яблок в маленькой корзине?","answer":"x : 3","see":"Маленькая корзина содержит одну из трёх равных частей.","similar":"Если в большой корзине 12 яблок, в маленькой 12 : 3 = 4.","algorithm":"Раздели большее количество на 3.","steps":["Большая корзина: x яблок.","Маленькая корзина: x : 3 яблок."],"retry":"Маленькая корзина содержит одну из трёх равных частей.","unit":"","kind":"choice","options":["x − 3","3x","x : 3","3 : x"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 98\" role=\"img\" aria-label=\"Большая x; Маленькая x : 3\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Большая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Маленькая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x : 3\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Саши x орехов. У Лены в 4 раза больше. На сколько орехов у Лены больше?","answer":"3x","see":"Нужно найти разницу между 4 равными частями и одной частью.","similar":"Если у Саши 2 ореха, у Лены 8, разница 6, то есть 3 · 2.","algorithm":"Из большего количества вычти меньшее.","steps":["У Лены 4x орехов.","Разница 4x − x = 3x."],"retry":"Нужно найти разницу между 4 равными частями и одной частью.","unit":"","kind":"choice","options":["4x","x + 4","x − 4","3x"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Саша x; Лена 4x; Разница 3x\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Саша\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Лена\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">4x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Первое число x. Второе на 5 больше удвоенного первого. Как записать второе число?","answer":"2x + 5","see":"Число сначала удваивают, затем добавляют 5.","similar":"Удвой 3 и добавь 5: 2 · 3 + 5 = 11.","algorithm":"Запиши действия в том порядке, в котором они описаны.","steps":["Удвоенное первое число равно 2x.","Добавляем 5 к 2x.","Получаем 2x + 5."],"retry":"Число сначала удваивают, затем добавляют 5.","unit":"","kind":"choice","options":["2x + 5","2(x + 5)","x + 7","2x − 5"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Сначала x; Удвоили 2x; Добавили 5\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Сначала\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Удвоили\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Добавили\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">5\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Две величины","subtitle":"Сколько вместе? На сколько отличаются?","title":"Сколько вместе? На сколько отличаются?","intro":"\u003cp>В первом пакете несколько конфет. Во втором столько же и ещё 4. Если спрашивают, сколько конфет в двух пакетах вместе, складываем все части. Если спрашивают, на сколько во втором больше, смотрим только на лишние 4 конфеты.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 177\" role=\"img\" aria-label=\"У обоих пакетов одинаковая часть x. Во втором есть ещё четыре. Вместе две части x и четыре конфеты.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Первый\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Второй\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">x\u003c/text>\u003crect x=\"212\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"236.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 4\u003c/text>\u003ctext x=\"8\" y=\"142\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Вместе\u003c/text>\u003crect x=\"154\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">x\u003c/text>\u003crect x=\"212\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"240.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">x\u003c/text>\u003crect x=\"270\" y=\"119\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"294.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 4\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Сумма.\u003c/strong> Результат сложения. Если вместе 18 конфет, то \u003cspan class=\"math-var-x\">x\u003c/span> + (\u003cspan class=\"math-var-x\">x\u003c/span> + 4) = 18. Убираем из 18 лишние 4, а оставшиеся 14 делим пополам. В первом пакете 7, во втором 11.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Разность.\u003c/strong> Результат вычитания. Во втором пакете на 4 конфеты больше: 11 − 7 = 4.\u003c/p>","anchor":"В конце перечитай вопрос.","anchorNote":"Если x означает число конфет в первом пакете, а спрашивают про второй, вычисли x + 4.","tasks":[{"q":"В двух коробках 34 машинки. Во второй на 8 больше, чем в первой. Сколько машинок во второй?","answer":21,"see":"x удобно взять для первой коробки.","similar":"Если в первой 5, во второй 5 + 8, вместе 5 + (5 + 8).","algorithm":"Сложи x и x + 8. После решения найди вторую коробку.","steps":["Пусть в первой x машинок, тогда во второй x + 8.","x + (x + 8) = 34. Значит, 2x = 26 и x = 13.","Во второй 13 + 8 = 21. Проверка: 13 + 21 = 34, разница 8."],"retry":"13 означает число машинок в первой. Проверь, про какую коробку вопрос.","unit":"машинка","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая x; Вторая x + 8; Всего 34\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 8\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">34\u003c/text>\u003c/svg>\u003c/div>"},{"q":"На двух полках 45 книг. На верхней в 4 раза больше, чем на нижней. Сколько книг на нижней?","answer":9,"see":"Пусть на нижней x книг. На верхней 4x.","similar":"Одна часть и три части дают четыре части.","algorithm":"Сложи книги с двух полок.","steps":["Пусть на нижней полке x книг. На верхней четыре таких количества, то есть 4x.","x + 4x = 45.","5x = 45, x = 9.","Проверка: на верхней 36 книг, 9 + 36 = 45 и 36 : 9 = 4."],"retry":"Пусть на нижней x книг. На верхней 4x.","unit":"книг","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Нижняя x; Верхняя 4x; Всего 45\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Нижняя\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Верхняя\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">4x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">45\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У брата в 3 раза больше наклеек, чем у сестры. У него на 18 наклеек больше. Сколько наклеек у брата?","answer":27,"see":"18 показывает разницу между двумя количествами.","similar":"Если у сестры 2, у брата 6, разница 6 − 2 = 4.","algorithm":"Из 3x вычти x, приравняй разность к 18 и найди 3x.","steps":["У сестры x наклеек, у брата 3x.","3x − x = 18, поэтому 2x = 18 и x = 9.","У брата 27. Проверка: 27 − 9 = 18 и 27 : 9 = 3."],"retry":"Если получилось 9, это число наклеек сестры. Найди количество у брата.","unit":"наклеек","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Сестра x; Брат 3x; Разница 18\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Сестра\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Брат\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">18\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Веры на 4 открытки меньше, чем у Нины. Вместе у них 30 открыток. Сколько у Веры?","answer":13,"see":"У Веры меньше. За x можно взять число её открыток.","similar":"Если у Веры 5, у Нины 9, всего 14.","algorithm":"Составь сумму из x и x + 4.","steps":["У Веры x, у Нины x + 4.","x + (x + 4) = 30, поэтому 2x = 26 и x = 13.","У Веры 13. Проверка: у Нины 17, сумма 30 и разница 4."],"retry":"У Веры меньше. За x можно взять число её открыток.","unit":"открыток","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Вера x; Нина x + 4; Всего 30\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вера\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Нина\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 4\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">30\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Сложили два соседних числа при счёте, например как 8 и 9, и получили 51. Найди большее число.","answer":26,"see":"Соседние числа при счёте отличаются на 1.","similar":"За 8 сразу идёт 9 = 8 + 1.","algorithm":"Обозначь меньшее за x, большее за x + 1.","steps":["Возьмём два соседних числа, например 8 и 9. Второе на 1 больше. Если меньшее число x, следующее будет x + 1.","x + (x + 1) = 51.","2x = 50, x = 25.","Большее 26. Проверка: 25 + 26 = 51."],"retry":"Следующее натуральное число на 1 больше предыдущего.","unit":"","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Меньшее x; Большее x + 1; Сумма 51\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Меньшее\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Большее\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 1\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Сумма\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">51\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Три величины","subtitle":"Сравнивай с тем, с кем сказано","title":"Сравнивай с тем, с кем сказано","intro":"\u003cp>У Ани 4 кубика. У Бори на 2 больше: 4 + 2 = 6. У Вики вдвое больше, чем у Бори. Для Вики берём две Борины шестёрки. В каждой шестёрке есть и Анины 4, и добавленные 2.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 177\" role=\"img\" aria-label=\"У Ани четыре, у Бори четыре плюс два, у Вики две такие группы по шесть.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Аня\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Боря\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"212\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"236.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 2\u003c/text>\u003ctext x=\"8\" y=\"142\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Вика\u003c/text>\u003crect x=\"154\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"212\" y=\"119\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"236.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 2\u003c/text>\u003ctext x=\"278.5\" y=\"142\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"297\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"325.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"355\" y=\"119\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"379.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 2\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Выражение.\u003c/strong> Запись действий с числами и буквами. Если у Ани \u003cspan class=\"math-var-x\">x\u003c/span> кубиков, у Бори \u003cspan class=\"math-var-x\">x\u003c/span> + 2, у Вики 2 · (\u003cspan class=\"math-var-x\">x\u003c/span> + 2). Скобки показывают, что дважды берём всё количество Бори.\u003c/p>","anchor":"Запиши по строке для каждого.","anchorNote":"На каждой строке напиши, сколько у этого человека или сколько в этой коробке.","tasks":[{"q":"В первой коробке x кубиков. Во второй на 3 больше, чем в первой. В третьей вдвое больше, чем во второй. Как записать число кубиков в третьей?","answer":"2(x + 3)","see":"Третью коробку сравнивают со второй.","similar":"Если в первой 4, во второй 7, в третьей 2 · 7 = 14.","algorithm":"Удвой всё выражение для второй коробки.","steps":["Первая: x.","Вторая: x + 3.","Третья: 2(x + 3)."],"retry":"Третью коробку сравнивают со второй.","unit":"","kind":"choice","options":["2(x + 3)","2x + 3","2x","x + 6"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая x; Вторая x + 3; Третья 2(x + 3)\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 3\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Третья\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2(x + 3)\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Ани несколько книг. У Бори вдвое больше, чем у Ани. У Вити на 4 книги больше, чем у Бори. Всего 34 книги. Сколько книг у Вити?","answer":16,"see":"За x удобно взять число книг Ани.","similar":"Если у Ани 3, у Бори 6, у Вити 6 + 4.","algorithm":"Сложи x, 2x и 2x + 4.","steps":["Пусть у Ани x книг. У Бори две такие кучки, 2x. У Вити столько же, сколько у Бори, и ещё 4, значит, 2x + 4.","x + 2x + (2x + 4) = 34.","5x = 30, x = 6.","У Вити 2 · 6 + 4 = 16. Проверка: 6 + 12 + 16 = 34."],"retry":"За x удобно взять число книг Ани.","unit":"книг","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Аня x; Боря 2x; Витя 2x + 4\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Аня\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Боря\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Витя\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x + 4\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В первом пакете на 2 конфеты меньше, чем во втором. В третьем на 3 конфеты больше, чем во втором. Всего 31 конфета. Сколько во втором пакете?","answer":10,"see":"За x здесь удобно взять количество во втором пакете: с ним сравнивают оба остальных.","similar":"Если во втором 5, в первом 3, в третьем 8.","algorithm":"Сложи x − 2, x и x + 3.","steps":["Пусть во втором пакете x конфет. От этого количества отними 2 для первого пакета и прибавь 3 для третьего.","(x − 2) + x + (x + 3) = 31.","3x + 1 = 31, x = 10.","Проверка: 8 + 10 + 13 = 31. Отличия равны 2 и 3."],"retry":"За x здесь удобно взять количество во втором пакете: с ним сравнивают оба остальных.","unit":"конфет","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый x − 2; Второй x; Третий x + 3\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x − 2\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Третий\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 3\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В первой корзине несколько груш. Во второй на 2 больше, чем в первой. В третьей втрое больше, чем во второй. Всего 38 груш. Сколько груш в третьей корзине?","answer":24,"see":"Сначала вырази число груш во второй корзине.","similar":"Если в первой 2, во второй 4, в третьей 3 · 4 = 12.","algorithm":"Сложи x, x + 2 и 3(x + 2).","steps":["Пусть в первой корзине x груш. Во второй x + 2, а в третьей три раза по x + 2.","x + (x + 2) + 3(x + 2) = 38.","Раскроем скобки. Три раза берём x и три раза берём 2, поэтому 3(x + 2) = 3x + 6.","Собираем одинаковые части: x + x + 3x = 5x. Отдельно складываем 2 и 6. Получаем 5x + 8 = 38.","От 38 отнимаем 8, остаётся 30 на пять одинаковых частей. x = 30 : 5 = 6.","В третьей корзине 3 · (6 + 2) = 24 груши. Проверяем: 6 + 8 + 24 = 38."],"retry":"Сначала вырази число груш во второй корзине.","unit":"груши","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая x; Вторая x + 2; Третья 3(x + 2)\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 2\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Третья\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3(x + 2)\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Три последовательных чётных числа дают в сумме 42. Найди среднее число.","answer":14,"see":"Между соседними чётными числами шаг равен 2.","similar":"После 8 идут 10 и 12.","algorithm":"Если первое x, следующие x + 2 и x + 4.","steps":["Посмотри на числа 8, 10, 12. Каждое следующее чётное число больше на 2. Запишем их как x, x + 2 и x + 4.","x + (x + 2) + (x + 4) = 42.","3x + 6 = 42, x = 12.","Среднее 14. Проверка: 12 + 14 + 16 = 42."],"retry":"Между соседними чётными числами шаг равен 2.","unit":"","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первое x; Среднее x + 2; Третье x + 4\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первое\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Среднее\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 2\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Третье\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 4\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Было и стало","subtitle":"Что поменялось?","title":"Что поменялось?","intro":"\u003cp>У Сони 10 карточек, у Кати 4. Соня отдаёт Кате несколько карточек, и у девочек становится поровну. Обозначим за \u003cspan class=\"math-var-x\">x\u003c/span> число переданных карточек. У Сони станет 10 − \u003cspan class=\"math-var-x\">x\u003c/span>, у Кати 4 + \u003cspan class=\"math-var-x\">x\u003c/span>. Передача трёх карточек даёт по 7 каждой.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 124\" role=\"img\" aria-label=\"У Сони было десять, у Кати четыре. Соня отдаёт три, Катя получает три. У обеих по семь.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Соня\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"188.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">10\u003c/text>\u003ctext x=\"240.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">−\u003c/text>\u003crect x=\"259\" y=\"13\" width=\"57\" height=\"36\" rx=\"7\" fill=\"#DD7A3A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"287.5\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"334.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"353\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"381.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">7\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Катя\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"188.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003ctext x=\"240.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"259\" y=\"66\" width=\"57\" height=\"36\" rx=\"7\" fill=\"#DD7A3A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"287.5\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"334.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"353\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"381.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">7\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Равенство.\u003c/strong> Запись со знаком =, когда слева и справа одинаковое значение. После передачи карточек стало поровну, поэтому 10 − \u003cspan class=\"math-var-x\">x\u003c/span> = 4 + \u003cspan class=\"math-var-x\">x\u003c/span>.\u003c/p>","anchor":"Подпиши «было» и «стало».","anchorNote":"Сначала запиши, что изменилось у каждого. Приравняй количества после передачи.","tasks":[{"q":"На двух полках было поровну книг. С первой сняли 5, на вторую поставили 7. На сколько больше книг стало на второй полке?","answer":12,"see":"На первой книг стало меньше, на второй больше.","similar":"Было по 10: после изменений осталось 5 и стало 17.","algorithm":"Сравни x + 7 и x − 5.","steps":["Пусть сначала на каждой полке было по x книг.","После изменений на первой x − 5, на второй x + 7.","Вторая получила 7, первая потеряла 5.","Разница равна 7 + 5 = 12."],"retry":"На первой книг стало меньше, на второй больше.","unit":"книг","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая x − 5; Вторая x + 7; Разница 12\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x − 5\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 7\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">12\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Ники 18 фишек, у Иры 6. Ника передала Ире несколько фишек, и их стало поровну. Сколько фишек передала Ника?","answer":6,"see":"Одна переданная фишка уменьшает разницу сразу на 2.","similar":"Из 9 и 5 при передаче одной получим 8 и 6.","algorithm":"Запиши 18 − x и 6 + x, затем приравняй их.","steps":["Пусть Ника передала x фишек. У Ники их стало на x меньше, а у Иры на x больше. Теперь количества равны.","Записываем: 18 − x = 6 + x.","Прибавим x к обеим частям: 18 = 6 + 2x. В таком виде видно, что разница 12 состоит из двух одинаковых частей x.","Делим 12 пополам. Ника передала 6 фишек. Проверяем: 18 − 6 = 12 и 6 + 6 = 12."],"retry":"Если передать все 12 фишек разницы, количества поменяются местами. Проверь оба новых количества.","unit":"фишек","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Ника 18 − x; Ира 6 + x; Стало поровну\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Ника\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">18 − x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Ира\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">6 + x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Условие\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">Стало поровну\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В первой коробке втрое больше кубиков, чем во второй. Из первой взяли 8 кубиков, и их стало поровну. Сколько кубиков было в первой?","answer":12,"see":"Изменилось количество только в первой коробке.","similar":"Если во второй 2, в первой 6. Чтобы уравнять, из первой нужно убрать 4.","algorithm":"Приравняй 3x − 8 и x.","steps":["Пусть во второй коробке было x кубиков. В первой было 3x. После того как из первой забрали 8, в ней осталось столько же, сколько во второй.","3x − 8 = x.","2x = 8, x = 4. Это количество во второй коробке.","В первой было 12. Проверка: 12 − 8 = 4."],"retry":"Изменилось количество только в первой коробке.","unit":"кубиков","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая 3x − 8; Вторая x; Стало поровну\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x − 8\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Условие\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">Стало поровну\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Саши и Миши вместе было 26 карточек. Саша отдал Мише 3 карточки, после чего их стало поровну. Сколько карточек было у Саши?","answer":16,"see":"Общее количество после передачи осталось 26.","similar":"Если всего 18 и после передачи поровну, у каждого стало по 9.","algorithm":"Обозначь количество после передачи за x, затем восстанови начальные количества.","steps":["После передачи у каждого x карточек, значит, 2x = 26 и x = 13.","У Саши было x + 3 = 16.","Проверка: у Миши было 10, всего 26, после передачи у обоих 13."],"retry":"Общее количество после передачи осталось 26.","unit":"карточек","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было у Саши 16; Передал 3; Осталось 13\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было у Саши\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">16\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Передал\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">13\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Маме 34 года, дочке 10 лет. Через сколько лет мама будет вдвое старше дочки?","answer":14,"see":"Через x лет обе станут старше на x лет.","similar":"Через 2 года им будет 36 и 12 лет.","algorithm":"Удвой весь будущий возраст дочки: 2(10 + x).","steps":["Пусть пройдёт x лет. К этому времени маме будет 34 + x, а дочке 10 + x. Вдвое старше значит, что возраст мамы равен двум возрастам дочки.","34 + x = 2(10 + x).","34 + x = 20 + 2x, поэтому x = 14.","Проверка: 48 лет и 24 года. 48 : 24 = 2."],"retry":"Через x лет обе станут старше на x лет.","unit":"лет","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Маме 34 + x; Дочке 10 + x; Маме вдвое больше лет\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Маме\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">34 + x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Дочке\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">10 + x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Условие\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">Маме вдвое больше лет\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Задачи с величинами","subtitle":"Цена, путь, время и периметр","title":"Цена, путь, время и периметр","intro":"\u003cp>Если одна тетрадь стоит 7 рублей, три стоят 7 + 7 + 7 = 21 рубль. Так же считаем путь за несколько часов: если за час проезжают 8 км, за два часа проедут 8 + 8 = 16 км. А чтобы узнать длину рамки, складываем длины всех четырёх сторон.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 177\" role=\"img\" aria-label=\"Три тетради по семь рублей. Два часа по восемь километров. У рамки две стороны по пять и две по три сантиметра.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Тетради\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">7\u003c/text>\u003crect x=\"212\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"240.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">7\u003c/text>\u003crect x=\"270\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"298.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">7\u003c/text>\u003ctext x=\"344.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"363\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"397.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">21 р.\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Дорога\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">8\u003c/text>\u003crect x=\"212\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"240.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">8\u003c/text>\u003ctext x=\"286.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"305\" y=\"66\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"339.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">16 км\u003c/text>\u003ctext x=\"8\" y=\"142\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Рамка\u003c/text>\u003crect x=\"154\" y=\"119\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"178.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">5\u003c/text>\u003crect x=\"204\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"232.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003crect x=\"262\" y=\"119\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"286.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">5\u003c/text>\u003crect x=\"312\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"340.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"386.5\" y=\"142\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"405\" y=\"119\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"439.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">16 см\u003c/text>\u003c/svg>\u003c/figure>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 71\" role=\"img\" aria-label=\"Один метр равен ста сантиметрам.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Длина\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"188.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">1 м\u003c/text>\u003ctext x=\"240.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"259\" y=\"13\" width=\"98\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"308.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">100 см\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Стоимость.\u003c/strong> Сколько платят за все покупки. Цена одной вещи × количество вещей.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Путь.\u003c/strong> Сколько проехали или прошли. При постоянной скорости путь = скорость × время.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Периметр.\u003c/strong> Сумма длин всех сторон. У прямоугольника две стороны по длине и две по ширине.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Единицы измерения.\u003c/strong> То, в чём считаем величину. Если длина одной ленты в метрах, а другой в сантиметрах, сначала запиши обе длины в сантиметрах: 1 м = 100 см.\u003c/p>","anchor":"Подпиши рубли, километры или сантиметры.","anchorNote":"Перед вычислением проверь, что величины одного вида записаны в одинаковых единицах.","tasks":[{"q":"Купили 3 одинаковые тетради и ручку за 25 рублей. За всё заплатили 91 рубль. Сколько стоит тетрадь?","answer":22,"see":"За x возьми цену одной тетради.","similar":"Если тетрадь стоит 10 рублей, 3 тетради и ручка за 5 рублей стоят 35 рублей.","algorithm":"Умножь цену тетради на 3, прибавь цену ручки.","steps":["Пусть одна тетрадь стоит x рублей. Тогда три стоят 3x рублей. Прибавляем 25 рублей за ручку.","3x + 25 = 91.","3x = 66, x = 22.","Проверка: 3 · 22 + 25 = 91."],"retry":"За x возьми цену одной тетради.","unit":"рубля","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Тетради 3x; Ручка 25; Итого 91\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Тетради\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Ручка\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">25\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Итого\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">91\u003c/text>\u003c/svg>\u003c/div>"},{"q":"За 2 одинаковых блокнота и 3 ручки заплатили 130 рублей. Ручка на 10 рублей дешевле блокнота. Сколько стоит блокнот?","answer":32,"see":"Пусть x рублей стоит ручка. Блокнот стоит x + 10.","similar":"Если ручка стоит 5 рублей, блокнот стоит 15. Два блокнота стоят 2 · 15.","algorithm":"Умножь всю цену блокнота на 2 и цену ручки на 3.","steps":["Пусть ручка стоит x рублей. Блокнот дороже на 10 рублей, значит, стоит x + 10. Два блокнота стоят 2(x + 10).","2(x + 10) + 3x = 130.","5x + 20 = 130, x = 22.","Блокнот стоит 32 рубля. Проверка: 2 · 32 + 3 · 22 = 130."],"retry":"Пусть x рублей стоит ручка. Блокнот стоит x + 10.","unit":"рубля","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Два блокнота 2(x + 10); Три ручки 3x; Итого 130\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Два блокнота\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2(x + 10)\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Три ручки\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Итого\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">130\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Два велосипедиста одновременно выехали навстречу друг другу из двух посёлков. Их скорости 12 км/ч и 15 км/ч. Расстояние 81 км. Через сколько часов они встретятся?","answer":3,"see":"До встречи каждый едет x часов. Вместе они проедут 81 км.","similar":"За 2 часа при скоростях 3 и 5 км/ч навстречу проедут 6 + 10 = 16 км.","algorithm":"Сложи пути 12x и 15x.","steps":["Пусть до встречи пройдёт x часов. Первый проедет 12x км, второй 15x км. Вместе они проедут весь путь между посёлками.","12x + 15x = 81.","27x = 81, x = 3.","Проверка: 36 + 45 = 81 км."],"retry":"До встречи каждый едет x часов. Вместе они проедут 81 км.","unit":"ч","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый 12x; Второй 15x; Вместе 81\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">12x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">15x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вместе\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">81\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Первый велосипедист уже на 8 км впереди второго и едет со скоростью 10 км/ч. Второй начинает ехать за ним со скоростью 14 км/ч. Через сколько часов он догонит первого?","answer":2,"see":"В момент встречи расстояния от места старта второго одинаковы.","similar":"Если за час один проедет 6 км, другой 4 км, разрыв уменьшится на 2 км.","algorithm":"Приравняй 14x и 8 + 10x.","steps":["Пусть второй едет x часов. Считаем расстояния от его старта: первый успел проехать 10x км вдобавок к 8 км, а второй проехал 14x км.","14x = 8 + 10x.","4x = 8, x = 2.","Проверка: второй проехал 28 км, первый находится в 8 + 20 = 28 км от старта второго."],"retry":"В момент встречи расстояния от места старта второго одинаковы.","unit":"ч","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый 8 + 10x; Второй 14x; При встрече поровну\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">8 + 10x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">14x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Условие\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">При встрече поровну\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Периметр прямоугольника 38 см. Длина на 5 см больше ширины. Найди длину.","answer":12,"see":"Периметр включает две длины и две ширины.","similar":"При ширине 3 и длине 5 периметр 2 · (3 + 5) = 16.","algorithm":"Пусть ширина x. Найди x из 2(x + x + 5) = 38, затем прибавь 5.","steps":["Пусть ширина x см. Длина на 5 см больше: x + 5. Чтобы найти длину и ширину вместе, делим периметр пополам.","x + (x + 5) = 38 : 2 = 19.","2x = 14, x = 7.","Длина 12 см. Проверка: 2 · (7 + 12) = 38."],"retry":"Периметр включает две длины и две ширины.","unit":"см","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Длина x + 5; Ширина x; Вместе 19\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Длина\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 5\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Ширина\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вместе\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">19\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Два мультфильма длятся вместе 1 час 10 минут. Второй на 14 минут длиннее первого. Сколько минут длится первый?","answer":28,"see":"Удобно выразить всё время в минутах.","similar":"1 час 5 минут = 60 + 5 = 65 минут.","algorithm":"Переведи общее время в минуты и сложи x и x + 14.","steps":["Пусть первый мультфильм длится x минут. Второй на 14 минут длиннее, значит, длится x + 14 минут.","1 час 10 минут = 70 минут.","x + (x + 14) = 70, 2x = 56, x = 28.","Проверка: второй длится 42 минуты, 28 + 42 = 70."],"retry":"Удобно выразить всё время в минутах.","unit":"мин","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый x; Второй x + 14; Всего 70 мин\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 14\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">70 мин\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Одна лента втрое длиннее другой. Вместе они 2 м 40 см. Какова длина короткой ленты в сантиметрах?","answer":60,"see":"2 м 40 см нужно записать в сантиметрах.","similar":"1 м 20 см = 100 + 20 = 120 см.","algorithm":"Сложи x и 3x, приравняй к общей длине в сантиметрах.","steps":["Пусть короткая лента x см. Тогда длинная лента в три раза длиннее, то есть 3x см.","2 м 40 см = 240 см.","x + 3x = 240, x = 60.","Проверка: длинная лента 180 см, сумма 240 см."],"retry":"2 м 40 см нужно записать в сантиметрах.","unit":"см","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Короткая x; Длинная 3x; Всего 240 см\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Короткая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Длинная\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A
