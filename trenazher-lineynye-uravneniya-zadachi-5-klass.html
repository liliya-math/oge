\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">240 см\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Первый мастер делает 7 деталей за час. Второй делает 5 деталей за час. Они начали вместе. За сколько часов вместе изготовят 48 деталей?","answer":4,"see":"За x часов мастера сделают 7x и 5x деталей.","similar":"Если вместе делают 10 деталей в час, за 3 часа сделают 30.","algorithm":"Сложи число деталей обоих мастеров за x часов.","steps":["Пусть мастера работают x часов. Первый сделает 7x деталей, второй 5x. Складываем их результаты.","7x + 5x = 48.","12x = 48, x = 4.","Проверка: 28 + 20 = 48 деталей."],"retry":"За x часов мастера сделают 7x и 5x деталей.","unit":"ч","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый 7x; Второй 5x; Всего 48\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">7x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">5x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">48\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Периметр треугольника 42 см. Две стороны равны. Третья сторона на 6 см короче каждой из равных сторон. Найди третью сторону.","answer":10,"see":"За x удобно взять короткую сторону.","similar":"Если короткая сторона 4 см, а две другие по 7 см, периметр равен 18 см.","algorithm":"Сложи x и два раза по x + 6.","steps":["Пусть короткая сторона x см. Две другие стороны на 6 см длиннее, каждая по x + 6 см. Периметр складывается из всех трёх сторон.","x + 2(x + 6) = 42.","3x + 12 = 42, x = 10.","Проверка: 10 + 16 + 16 = 42 см."],"retry":"За x удобно взять короткую сторону.","unit":"см","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Короткая x; Две равные 2(x + 6); Всего 42 см\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Короткая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Две равные\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2(x + 6)\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">42 см\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Пешеход вышел со скоростью 4 км/ч. Через 2 часа из того же места за ним выехал велосипедист со скоростью 12 км/ч. Сколько часов от выезда велосипедиста до встречи?","answer":1,"see":"Пешеход шёл на 2 часа дольше велосипедиста.","similar":"Если велосипедист ехал 3 часа, пешеход шёл 5 часов.","algorithm":"За x возьми время велосипедиста. Приравняй пройденные пути.","steps":["Пусть велосипедист ехал x часов. Пешеход вышел на 2 часа раньше, поэтому он шёл x + 2 часа. На встрече оба прошли или проехали одинаковое расстояние от старта.","12x = 4(x + 2).","12x = 4x + 8, поэтому 8x = 8 и x = 1.","Проверка: велосипедист проехал 12 км за час, пешеход прошёл 12 км за 3 часа."],"retry":"Пешеход шёл на 2 часа дольше велосипедиста.","unit":"ч","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Пешком 4(x + 2); На велосипеде 12x; Пути равны\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Пешком\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">4(x + 2)\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">На велосипеде\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">12x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Условие\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">Пути равны\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Скобки и доли","subtitle":"Что повторяют? Что делят?","title":"Что повторяют? Что делят?","intro":"\u003cp>В каждом из двух пакетов 3 красных и 2 синих кубика. Когда берём два пакета, дважды берём и красные, и синие: 2 · (3 + 2). Если разделить 12 кубиков на три равные кучки, в каждой окажется 4 кубика.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 124\" role=\"img\" aria-label=\"Два пакета: в каждом три красных и два синих. Двенадцать кубиков делятся на три равные кучки по четыре.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Два пакета\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"57\" height=\"36\" rx=\"7\" fill=\"#DD7A3A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"182.5\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003crect x=\"213\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"241.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 2\u003c/text>\u003ctext x=\"287.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"306\" y=\"13\" width=\"57\" height=\"36\" rx=\"7\" fill=\"#DD7A3A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"334.5\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">3\u003c/text>\u003crect x=\"365\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"393.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 2\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Три кучки\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"178.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"204\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"228.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003crect x=\"254\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"278.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003ctext x=\"320.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"339\" y=\"66\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"373.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">12\u003c/text>\u003c/svg>\u003c/figure>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 71\" role=\"img\" aria-label=\"Половина от двенадцати: одна из двух одинаковых кучек по шесть.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Две кучки\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003crect x=\"212\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"240.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003ctext x=\"286.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"305\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"339.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">12\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Скобки.\u003c/strong> Показывают, какое выражение берём целиком. В 2 · (3 + 2) повторяется вся сумма 3 + 2.\u003c/p>\u003cp class=\"math-definition\">\u003cstrong>Треть.\u003c/strong> Одна из трёх равных частей. Треть от 12 равна 4. Половина получается, когда делим целое на две равные части.\u003c/p>","anchor":"Спроси: «Часть от чего?»","anchorNote":"Половина всех денег и половина остатка после покупки могут быть разными суммами.","tasks":[{"q":"В первый день прочитали половину книги, во второй ещё 18 страниц. Осталось 12 страниц. Сколько страниц в книге?","answer":60,"see":"Половина книги, которую не прочитали в первый день, состоит из 18 и 12 страниц.","similar":"Если половина ленты 8 см, вся лента 16 см.","algorithm":"Пусть x страниц во всей книге. Составь x : 2 + 18 + 12 = x.","steps":["Пусть в книге x страниц. Чтобы найти половину, делим на 2. Все страницы книги делятся на три группы: прочитали в первый день, прочитали во второй, ещё не прочитали.","x : 2 + 18 + 12 = x.","Вторая половина равна 18 + 12 = 30. Значит, x = 60.","Проверка: 30 + 18 + 12 = 60."],"retry":"Половина книги, которую не прочитали в первый день, состоит из 18 и 12 страниц.","unit":"страниц","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый день x : 2; Второй день 18; Осталось 12\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый день\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x : 2\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй день\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">18\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">12\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В первом кувшине вдвое больше сока, чем во втором. В каждый добавили по 2 л. После этого в первом стало на 3 л больше. Сколько литров было во втором?","answer":3,"see":"Одинаковая прибавка сохраняет разность.","similar":"Если к 8 и 5 прибавить по 2, разность всё ещё 3.","algorithm":"Разность новых количеств равна 3.","steps":["Пусть во втором кувшине было x литров. В первом было 2x. После добавления двух литров получаем 2x + 2 и x + 2.","(2x + 2) − (x + 2) = 3.","Уберём одинаковую прибавку: 2x − x = 3, x = 3.","Проверка: после прибавки 8 и 5 л, разность 3 л."],"retry":"Одинаковая прибавка сохраняет разность.","unit":"л","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый 2x + 2; Второй x + 2; Разница 3\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x + 2\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 2\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Три одинаковых набора содержат по x красных и 2 синих детали. Всего в наборах 27 деталей. Сколько красных деталей в одном наборе?","answer":7,"see":"В каждом наборе всего x + 2 детали.","similar":"В трёх наборах по 4 красных и 2 синих детали: 3 · (4 + 2) = 18.","algorithm":"Из 3(x + 2) = 27 сначала найди количество деталей в одном наборе.","steps":["В одном наборе x красных и 2 синих детали. Складываем их: x + 2. Это количество повторяется в каждом из трёх наборов.","3(x + 2) = 27.","x + 2 = 27 : 3 = 9, x = 7.","Проверка: 3 · (7 + 2) = 27."],"retry":"В каждом наборе всего x + 2 детали.","unit":"деталей","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Один набор x + 2; Три набора 3(x + 2); Всего 27\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Один набор\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 2\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Три набора\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3(x + 2)\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">27\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В одной пачке x листов, а в другой на 4 листа меньше. Взяли 3 пачки первого вида и 2 пачки второго. Всего 42 листа. Какое уравнение верное?","answer":"3x + 2(x − 4) = 42","see":"Во второй разновидности каждая пачка содержит x − 4 листа.","similar":"Если в одной пачке 10 − 4 листов, в двух 2 · (10 − 4).","algorithm":"Умножь содержимое каждого вида на число пачек и сложи.","steps":["Первый вид даёт 3x листов.","Второй вид даёт 2(x − 4) листов.","3x + 2(x − 4) = 42. Отсюда 5x = 50 и x = 10."],"retry":"Во второй разновидности каждая пачка содержит x − 4 листа.","unit":"","kind":"choice","options":["3x + 2x − 4 = 42","3x + 2(x + 4) = 42","3(x − 4) + 2(x − 4) = 42","3x + 2(x − 4) = 42"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первый вид 3x; Второй вид 2(x − 4); Всего 42\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первый вид\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй вид\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2(x − 4)\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">42\u003c/text>\u003c/svg>\u003c/div>"},{"q":"После того как от мотка отрезали треть всей ленты и ещё 6 м, осталось 14 м. Сколько метров ленты было?","answer":30,"see":"6 м и остаток 14 м вместе составляют две трети.","similar":"Если две равные части составляют 12 м, одна часть составляет 6 м.","algorithm":"За x удобно взять длину одной трети. Тогда вся лента 3x.","steps":["Разделим всю ленту на три одинаковые части по x метров. Было 3x. Отрезали одну часть и ещё 6 метров.","3x − x − 6 = 14.","2x = 20, x = 10.","Вся лента 30 м. Проверка: 30 − 10 − 6 = 14."],"retry":"6 м и остаток 14 м вместе составляют две трети.","unit":"м","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было 3x; Убрали x + 6; Осталось 14\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Убрали\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 6\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">14\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Яблоки разложили по 5 в каждый пакет. Заполнили несколько пакетов, и 3 яблока осталось. Всего было 38 яблок. Сколько пакетов заполнили?","answer":7,"see":"Три яблока остались вне пакетов.","similar":"При 4 полных пакетах по 5 и остатке 2 всего было бы 22 яблока.","algorithm":"Прибавь 3 к числу яблок в полных пакетах.","steps":["Пусть заполнили x пакетов. В каждом 5 яблок, поэтому по пакетам разложили 5x яблок. Ещё 3 остались отдельно.","5x + 3 = 38.","5x = 35, x = 7.","Проверка: 5 · 7 + 3 = 38."],"retry":"Три яблока остались вне пакетов.","unit":"пакетов","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"В пакетах 5x; Вне пакетов 3; Всего 38\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">В пакетах\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">5x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вне пакетов\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">38\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Даши было несколько рублей. Она потратила треть денег, а затем половину того, что осталось. В кошельке осталось 24 рубля. Сколько рублей было?","answer":72,"see":"Половина относится к остатку после первой покупки.","similar":"Если сначала было 30 рублей, после траты трети остаётся 20, после траты половины остатка остаётся 10.","algorithm":"Обозначь за x одну треть начальной суммы. После первой покупки останется 2x.","steps":["Представь все деньги как три одинаковые кучки. Пусть в одной кучке x рублей. Сначала Даша потратила одну кучку, осталось две.","Было 3x. После первой покупки осталось 2x.","Половина от 2x равна x. Значит, осталось x = 24.","Было 72 рубля. Проверка: после первой покупки осталось 48 рублей, после второй 24."],"retry":"Половина относится к остатку после первой покупки.","unit":"рубля","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было 3x; После первой покупки 2x; После второй x\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">После первой покупки\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">После второй\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003c/svg>\u003c/div>"}]},{"name":"Проверка и ловушки","subtitle":"Что получилось и подходит ли ответ?","title":"Что получилось и подходит ли ответ?","intro":"\u003cp>В двух коробках 16 карандашей. Во второй на 4 больше. Если \u003cspan class=\"math-var-x\">x\u003c/span> означает число карандашей в первой, получаем \u003cspan class=\"math-var-x\">x\u003c/span> = 6. Но на вопрос «Сколько во второй?» отвечаем: 10. Проверяем обе фразы: 6 + 10 = 16 и 10 − 6 = 4.\u003c/p>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 177\" role=\"img\" aria-label=\"Первая коробка содержит шесть, вторая шесть и ещё четыре. Вместе шестнадцать, разница четыре.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Первая\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003ctext x=\"8\" y=\"89\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Вторая\u003c/text>\u003crect x=\"154\" y=\"66\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003crect x=\"212\" y=\"66\" width=\"48\" height=\"36\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#9C6B40\" stroke-width=\"1.5\"/>\u003ctext x=\"236.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">+ 4\u003c/text>\u003ctext x=\"278.5\" y=\"89\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"297\" y=\"66\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"331.0\" y=\"89\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">10\u003c/text>\u003ctext x=\"8\" y=\"142\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Вместе\u003c/text>\u003crect x=\"154\" y=\"119\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003ctext x=\"228.5\" y=\"142\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">+\u003c/text>\u003crect x=\"247\" y=\"119\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"281.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">10\u003c/text>\u003ctext x=\"333.5\" y=\"142\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"352\" y=\"119\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"386.0\" y=\"142\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">16\u003c/text>\u003c/svg>\u003c/figure>\u003cfigure class=\"theory-figure\">\u003csvg viewBox=\"0 0 505 71\" role=\"img\" aria-label=\"Проверяем разницу: из десяти вычитаем шесть, получаем четыре.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#EEE0C8\" font-size=\"17\" font-weight=\"750\">Разница\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">10\u003c/text>\u003ctext x=\"228.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">−\u003c/text>\u003crect x=\"247\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"275.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">6\u003c/text>\u003ctext x=\"321.5\" y=\"36\" text-anchor=\"middle\" fill=\"#EEE0C8\" font-size=\"22\" font-weight=\"800\">=\u003c/text>\u003crect x=\"340\" y=\"13\" width=\"68\" height=\"36\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\" stroke-width=\"1.5\"/>\u003ctext x=\"374.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\">4\u003c/text>\u003c/svg>\u003c/figure>\u003cp class=\"math-definition\">\u003cstrong>Проверка по условию.\u003c/strong> С найденными числами заново проверяем всё, что сказано в задаче. Если количество карандашей получилось дробным, такое значение не подходит.\u003c/p>","anchor":"Проверь вопрос, сумму и разницу.","anchorNote":"Ответ должен подходить ко всем условиям сразу.","tasks":[{"q":"В двух коробках 25 целых карандашей. Во второй ровно вдвое больше, чем в первой. Что можно сказать об условии?","answer":"Таких количеств карандашей нет","see":"Всего должно быть три одинаковые части из целых карандашей.","similar":"24 карандаша делятся на 3 равные части, а 25 не делятся.","algorithm":"Проверь, может ли 3x = 25 выполняться при целом x.","steps":["В первой x, во второй 2x.","3x = 25 даёт x = 25 : 3.","Число карандашей не может быть дробным. Округление нарушит условие."],"retry":"Всего должно быть три одинаковые части из целых карандашей.","unit":"","kind":"choice","options":["Таких количеств карандашей нет","В первой 8, во второй 17","В первой 8, во второй 16","В первой 9, во второй 16"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая x; Вторая 2x; Три равные части 25\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">2x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Три равные части\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">25\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В коробке были карандаши. Положили 5 и убрали 5. Их стало столько же, сколько было. Можно ли узнать начальное количество?","answer":"Данных недостаточно","see":"Действия взаимно отменяются.","similar":"Если было 4, останется 4. Если было 12, останется 12.","algorithm":"Проверь, сколько разных начальных количеств подходит.","steps":["Пусть было x карандашей.","После действий x + 5 − 5 = x.","Подходит любое допустимое начальное количество."],"retry":"Действия взаимно отменяются.","unit":"","kind":"choice","options":["Было ровно 5","Данных недостаточно","Было ровно 10","Такое условие невозможно"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было x; Положили и убрали + 5 − 5; Осталось x\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Положили и убрали\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">+ 5 − 5\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Осталось\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В 4 одинаковых пакетах по x конфет. После того как из каждого взяли по 2, осталось 20 конфет. Ученик написал 4x − 2 = 20. Как исправить?","answer":"4(x − 2) = 20","see":"По две конфеты взяли из каждого из четырёх пакетов.","similar":"Из 3 пакетов по 2 конфеты берут всего 6.","algorithm":"Умножь остаток в одном пакете на 4.","steps":["В каждом осталось x − 2.","Всего осталось 4(x − 2) = 20.","x − 2 = 5, значит, x = 7."],"retry":"По две конфеты взяли из каждого из четырёх пакетов.","unit":"","kind":"choice","options":["4x + 8 = 20","x − 8 = 20","4(x − 2) = 20","4(x − 4) = 20"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"В каждом x − 2; В четырёх 4(x − 2); Всего 20\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">В каждом\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x − 2\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">В четырёх\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">4(x − 2)\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">20\u003c/text>\u003c/svg>\u003c/div>"},{"q":"У Тани в 3 раза больше фишек, чем у Коли. Вместе у них 32 фишки. Таня отдаёт Коле 5 фишек. На сколько фишек у Тани теперь больше?","answer":6,"see":"Отношение в 3 раза относится к исходным количествам.","similar":"Если было 14 и 6, то после передачи 2 получим 12 и 8, разница 4.","algorithm":"Найди начальные количества, выполни передачу и найди разность.","steps":["Пусть у Коли было x фишек. x + 3x = 32, x = 8.","У Тани было 24. Стало 19 у Тани и 13 у Коли.","Теперь разница 19 − 13 = 6. Проверка: сумма по-прежнему 32."],"retry":"Отношение в 3 раза относится к исходным количествам.","unit":"фишек","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"У Тани 24 → 19; У Коли 8 → 13; Разница 6\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">У Тани\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">24 → 19\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">У Коли\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">8 → 13\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">6\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В двух корзинах 40 яблок. Когда из первой переложили 4 яблока во вторую, во второй стало втрое больше, чем в первой. Сколько яблок было в первой корзине?","answer":14,"see":"Соотношение «втрое» относится к количествам после перекладывания.","similar":"Если после перекладывания в первой 5, а во второй втрое больше, в обеих 20.","algorithm":"Возьми за x количество в первой после перекладывания. Потом верни 4 яблока.","steps":["После перекладывания в первой x, во второй 3x. Всего 40, значит, 4x = 40.","x = 10. В первой было 10 + 4 = 14.","Проверка: сначала 14 и 26, потом 10 и 30, 30 : 10 = 3."],"retry":"Соотношение «втрое» относится к количествам после перекладывания.","unit":"яблок","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Первая 14 → 10; Вторая 26 → 30; Всего 40\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Первая\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">14 → 10\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Вторая\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">26 → 30\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Всего\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">40\u003c/text>\u003c/svg>\u003c/div>"},{"q":"В записи о задаче получилось x + 4 = x + 7. Может ли какое-нибудь число x сделать это равенство верным?","answer":"Ни одного подходящего числа","see":"К одному и тому же числу прибавляют разные числа.","similar":"Если x = 10, получатся 14 и 17. При другом x разница всё равно 3.","algorithm":"Вычти x из обеих частей и проверь равенство чисел.","steps":["Представь две одинаковые коробки с x карандашами. В первую добавили 4, во вторую 7. Во второй в любом случае на 3 больше.","x + 4 = x + 7.","После вычитания x получаем 4 = 7.","Такое равенство невозможно. В текстовой задаче перепроверь модель и условие."],"retry":"К одному и тому же числу прибавляют разные числа.","unit":"","kind":"choice","options":["Подходит любое число","Ни одного подходящего числа","Подходит x = 3","Подходит x = 11"],"solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Слева x + 4; Справа x + 7; Разница всегда 3\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Слева\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"28\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 4\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Справа\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">x + 7\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Разница всегда\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">3\u003c/text>\u003c/svg>\u003c/div>"},{"q":"Из 30 фишек часть убрали, а оставшиеся поровну раздали 4 ученикам. Каждый получил по 6. Сколько фишек убрали?","answer":6,"see":"Раздавали оставшиеся фишки, то есть 30 − x.","similar":"Если после уборки осталось 15 фишек и их дали 3 ученикам, каждый получит 5.","algorithm":"Приравняй оставшееся количество к 4 · 6.","steps":["Пусть убрали x фишек. Осталось 30 − x. Эти фишки раздали четырём ученикам, каждому по 6.","30 − x = 4 · 6.","30 − x = 24, x = 6.","Проверка: (30 − 6) : 4 = 6."],"retry":"Раздавали оставшиеся фишки, то есть 30 − x.","unit":"фишек","kind":"number","solutionVisual":"\u003cdiv class=\"visual-panel\">\u003csvg viewBox=\"0 0 440 136\" role=\"img\" aria-label=\"Было 30; Убрали x; Раздали 4 · 6\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"28\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Было\u003c/text>\u003crect x=\"218\" y=\"8\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#5F7B3 ll=\"#16231A\" font-size=\"17\" font-weight=\"800\">60x\u003c/text>\u003ctext x=\"8\" y=\"66\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Второй\u003c/text>\u003crect x=\"218\" y=\"46\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#E2B04A\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"66\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">75x\u003c/text>\u003ctext x=\"8\" y=\"104\" fill=\"#16231A\" font-size=\"16\" font-weight=\"650\">Между ними\u003c/text>\u003crect x=\"218\" y=\"84\" width=\"214\" height=\"28\" rx=\"7\" fill=\"#EEE0C8\" stroke=\"#5F7B3F\"/>\u003ctext x=\"325\" y=\"104\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"17\" font-weight=\"800\">405\u003c/text>\u003c/svg>\u003c/div>"}]}],"recap":["Прочитай вопрос. Запиши, какое число обозначишь буквой x, и подпиши единицу измерения.","Запиши остальные количества через x. Подчеркни слова «вместе», «поровну», «на … больше» или «в … раз больше».","Поставь знак = там, где две записи описывают одно и то же количество. Найди x.","Перечитай вопрос. Если спрашивают про другое количество, найди и его. Проверь ответ по условию."],"lab":{"title":"Что меняет одно слово?","intro":"Выбирай ситуацию и сравнивай записи.","cases":[{"label":"На 3 или в 3 раза","html":"\u003cp>\u003cstrong>На 3 больше\u003c/strong> → x + 3.\u003cbr>\u003cstrong>В 3 раза больше\u003c/strong> → 3x.\u003c/p>\u003cp>Если x = 5, получаются 8 и 15.\u003c/p>\u003csvg viewBox=\"0 0 505 124\" role=\"img\" aria-label=\"Пять плюс три равно восьми. Три раза по пять равно пятнадцати.\" style=\"display:block;width:100%;height:auto;max-width:500px;margin:auto;font-family:inherit\">\u003ctext x=\"8\" y=\"36\" fill=\"#16231A\" font-size=\"17\" font-weight=\"750\">На 3 больше\u003c/text>\u003crect x=\"154\" y=\"13\" width=\"56\" height=\"36\" rx=\"7\" fill=\"#B6CBE3\" stroke=\"#2F5BB5\" stroke-width=\"1.5\"/>\u003ctext x=\"182.0\" y=\"36\" text-anchor=\"middle\" fill=\"#16231A\" font-size=\"19\" font-weight=\"800\ (function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};
})();

  const number = /\d+(?:[.,]\d+)?/.source;

  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${esc(s.name)}<small>${n} / ${s.tasks.length} · ${esc(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${t.visual}</div>`:'';}
  function hintsHtml(t){return ['На что посмотреть','Похожий пример','Что делать дальше'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Это задание уже получилось.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} / ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${esc(s.title)}</h2><div class="intro-content">${s.intro}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Посмотреть решение по шагам</summary>${t.solutionVisual||''}<ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Подсказки</h3><p class="support-caption">Открой подсказку, если застрял.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextTarget(){
    for (let offset=0;offset<C.stages.length;offset++){
      const stage=(state.stage+offset)%C.stages.length;
      const tasks=C.stages[stage].tasks;
      const start=offset===0?state.task+1:0;
      const index=tasks.findIndex((_,i)=>i>=start&&!state.solved.includes(stage+'-'+i));
      if(index>=0)return {stage,index};
    }
    const index=C.stages[state.stage].tasks.findIndex((_,i)=>!state.solved.includes(state.stage+'-'+i));
    return index>=0?{stage:state.stage,index}:null;
  }
  function nextLabel(){
    const target=nextTarget();
    return !target?'К итогу':target.stage===state.stage?'Дальше':'Следующая тема';
  }
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Впиши число из ответа. Слова и единицы измерения уже есть рядом с полем.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно. Получилось!',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();scrollToLesson();}
  function goTask(i, keepPosition=false){state.task=i;feedback=null;hints.clear();save();render();if(keepPosition){const question=$('#question-text');question.tabIndex=-1;question.focus({preventScroll:true});}else scrollToLesson();}
  function next(){
    if(!done())return;
    const target=nextTarget();
    if(!target){view='complete';feedback=null;render();scrollToLesson();return;}
    if(target.stage===state.stage){goTask(target.index,true);return;}
    goStage(target.stage);
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${esc(lab.title)}</h2><p class="lab-note">${esc(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${esc(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${c.html}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
