/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {

  <script>
window.TrainerData={"id":"balayan-formuly","version":1,"title":"Расчёты по формулам · lili.math","heading":"Расчёты по формулам","subtitle":"Подставляй числа, выражай неизвестную и проверяй ответ по условию.","description":"Подставляй числа, выражай неизвестную и проверяй ответ по условию.","grade":"7–9 класс · ОГЭ","stages":[{"name":"Подстановка и порядок действий","subtitle":"Теория и практика","title":"Подстановка и порядок действий","intro":"\u003csection class=\"theory-topic\">\u003ch3>Подстановка и порядок действий\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Формула\u003c/strong> — равенство, которое связывает величины.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Ищем нужную букву\u003c/h4>\u003cp class=\"theory-note\">Подпиши, что известно и что нужно найти. Если искомая величина уже одна слева, подставь числа справа.\u003c/p>\u003cdiv class=\"theory-cell\">F = 1,8C + 32, C = 10 → F = 1,8 · 10 + 32 = 50.\u003c/div>\u003c/li>\u003cli>\u003ch4>Считаем по порядку\u003c/h4>\u003cp class=\"theory-note\">Сначала выполни действия в скобках и степени, потом умножение и деление, затем сложение и вычитание.\u003c/p>\u003cdiv class=\"theory-cell\">P = I²R, I = 3, R = 2 → P = 9 · 2 = 18.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Подпиши, что известно и что нужно найти. Если искомая величина уже одна слева, подставь числа справа.","anchorNote":"Сначала выполни действия в скобках и степени, потом умножение и деление, затем сложение и вычитание.","tasks":[{"kind":"number","q":"Найди F, если F = 1,8C + 32 и C = 130 °C.","answer":266,"before":"При C = 20 сначала 1,8 · 20 = 36, затем 36 + 32 = 68.","see":"Умножь 130 на 1,8, затем прибавь 32.","similar":"При C = 20 сначала 1,8 · 20 = 36, затем 36 + 32 = 68.","algorithm":"Подставляем C = 130.","retry":"Умножь 130 на 1,8, затем прибавь 32.","steps":["Подставляем C = 130.","1,8 · 130 = 234.","234 + 32 = 266 °F."],"unit":""},{"kind":"number","q":"Стоимость колодца в рублях C = 5200 + 3500n, где n — число колец. Найди C для 8 колец.","answer":33200,"before":"Если C = 1000 + 500n и n = 3, получаем 1000 + 1500 = 2500.","see":"На 8 умножается только цена одного кольца.","similar":"Если C = 1000 + 500n и n = 3, получаем 1000 + 1500 = 2500.","algorithm":"Подставляем n = 8.","retry":"На 8 умножается только цена одного кольца.","steps":["Подставляем n = 8.","3500 · 8 = 28000.","28000 + 5200 = 33200 руб."],"unit":""},{"kind":"number","q":"Найди площадь параллелограмма S = ab sin α, если a = 12, b = 15 и sin α = 0,5.","answer":90,"before":"При a = 8, b = 5 и sin α = 0,5 получаем 8 · 5 · 0,5 = 20.","see":"Умножить на 0,5 — взять половину.","similar":"При a = 8, b = 5 и sin α = 0,5 получаем 8 · 5 · 0,5 = 20.","algorithm":"12 · 15 = 180.","retry":"Умножить на 0,5 — взять половину.","steps":["12 · 15 = 180.","180 · 0,5 = 90."],"unit":""},{"kind":"number","q":"Найди работу тока A = (U²t)/R, если U = 8, t = 6, R = 3.","answer":128,"before":"При U = 5, t = 4 и R = 2 получаем 5² · 4 : 2 = 50.","see":"Возведи в квадрат только U.","similar":"При U = 5, t = 4 и R = 2 получаем 5² · 4 : 2 = 50.","algorithm":"8² = 64.","retry":"Возведи в квадрат только U.","steps":["8² = 64.","A = (64 · 6)/3 = 64 · 2.","Получаем 128 Дж."],"unit":""}]},{"name":"Выражаем неизвестную величину","subtitle":"Теория и практика","title":"Выражаем неизвестную величину","intro":"\u003csection class=\"theory-topic\">\u003ch3>Выражаем неизвестную величину\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Неизвестная величина\u003c/strong> — величина, значение которой нужно найти по условию.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Если неизвестное умножают\u003c/h4>\u003cp class=\"theory-note\">Чтобы оставить неизвестную одну, раздели обе части на её ненулевой множитель.\u003c/p>\u003cdiv class=\"theory-cell\">S = ah/2 → 2S = ah → h = (2S)/a.\u003c/div>\u003c/li>\u003cli>\u003ch4>Если неизвестное делят\u003c/h4>\u003cp class=\"theory-note\">Умножь обе части на ненулевой знаменатель. Затем раздели на коэффициент при неизвестной, если нужно.\u003c/p>\u003cdiv class=\"theory-cell\">v = s/t, t > 0 → vt = s → t = s/v при v ≠ 0.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Чтобы оставить неизвестную одну, раздели обе части на её ненулевой множитель.","anchorNote":"Умножь обе части на ненулевой знаменатель. Затем раздели на коэффициент при неизвестной, если нужно.","tasks":[{"kind":"number","q":"Длина окружности l = 2πR. Найди R в метрах при l = 87 м и π = 3.","answer":14.5,"before":"При l = 48 и π = 3 имеем 48 = 6R, поэтому R = 8.","see":"Раздели длину на 2π.","similar":"При l = 48 и π = 3 имеем 48 = 6R, поэтому R = 8.","algorithm":"87 = 2 · 3 · R.","retry":"Раздели длину на 2π.","steps":["87 = 2 · 3 · R.","6R = 87.","R = 87/6 = 14,5 м."],"unit":""},{"kind":"number","q":"Площадь трапеции S = ((a + b) · h) : 2. Найди h при a = 6 м, b = 8 м, S = 56 м².","answer":8,"before":"При a = 4, b = 10 и S = 35 имеем S = 7h, поэтому h = 5.","see":"Сложи основания и раздели их сумму пополам.","similar":"При a = 4, b = 10 и S = 35 имеем S = 7h, поэтому h = 5.","algorithm":"56 = ((6 + 8) · h) : 2.","retry":"Сложи основания и раздели их сумму пополам.","steps":["56 = ((6 + 8) · h) : 2.","56 = 7h.","h = 8 м."],"unit":""},{"kind":"number","q":"Найди t, если Q = I²Rt, Q = 3402 Дж, I = 9 А, R = 6 Ом.","answer":7,"before":"При Q = 36, I = 2, R = 3 имеем 36 = 12t, откуда t = 3.","see":"Найди множитель I²R.","similar":"При Q = 36, I = 2, R = 3 имеем 36 = 12t, откуда t = 3.","algorithm":"3402 = 9² · 6 · t.","retry":"Найди множитель I²R.","steps":["3402 = 9² · 6 · t.","3402 = 486t.","t = 3402 : 486 = 7 с."],"unit":""},{"kind":"number","q":"Средняя скорость v = s/t. Найди время t в часах, если s = 135 км, v = 54 км/ч.","answer":2.5,"before":"При s = 120 и v = 40 равенство 40 = 120/t даёт 40t = 120, затем t = 3.","see":"Умножь на t, затем раздели на v.","similar":"При s = 120 и v = 40 равенство 40 = 120/t даёт 40t = 120, затем t = 3.","algorithm":"54 = 135/t, где t > 0.","retry":"Умножь на t, затем раздели на v.","steps":["54 = 135/t, где t > 0.","54t = 135.","t = 135/54 = 2,5 ч."],"unit":""}]},{"name":"Единицы и сложная подстановка","subtitle":"Теория и практика","title":"Единицы и сложная подстановка","intro":"\u003csection class=\"theory-topic\">\u003ch3>Единицы и сложная подстановка\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Единица измерения\u003c/strong> — принятая величина, с которой сравнивают однородные величины.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Единицы в формуле\u003c/h4>\u003cp class=\"theory-note\">Сначала прочитай, в каких единицах формула принимает каждую величину. Если длина шага дана в сантиметрах, произведение на число шагов тоже в сантиметрах.\u003c/p>\u003cdiv class=\"theory-cell\">2000 · 50 см = 100000 см = 1000 м = 1 км.\u003c/div>\u003c/li>\u003cli>\u003ch4>Дробь в формуле\u003c/h4>\u003cp class=\"theory-note\">Подставь дробь целиком и сгруппируй известные множители.\u003c/p>\u003cdiv class=\"theory-cell\">S = (1/2)d₁d₂ sin α. При d₁ = 10 и sin α = 3/5 имеем S = 3d₂.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Сначала прочитай, в каких единицах формула принимает каждую величину. Если длина шага дана в сантиметрах, произведение на число шагов тоже в сантиметрах.","anchorNote":"Подставь дробь целиком и сгруппируй известные множители.","tasks":[{"kind":"number","q":"Длина шага 60 см. Пройдено 1500 шагов. По формуле S = nl найди путь в километрах.","answer":0.9,"before":"При 500 шагах по 80 см путь равен 40000 см = 400 м = 0,4 км.","see":"В 1 км ровно 100000 см.","similar":"При 500 шагах по 80 см путь равен 40000 см = 400 м = 0,4 км.","algorithm":"1500 · 60 = 90000 см.","retry":"В 1 км ровно 100000 см.","steps":["1500 · 60 = 90000 см.","Это 900 м.","900 м = 0,9 км."],"unit":""},{"kind":"number","q":"Найди d₂ по формуле S = (1/2)d₁d₂ sin α, если S = 36, d₁ = 10, sin α = 4/5.","answer":9,"before":"Если S = 21, d₁ = 10, sin α = 3/5, то 21 = 3d₂ и d₂ = 7.","see":"Вычисли известный множитель при d₂.","similar":"Если S = 21, d₁ = 10, sin α = 3/5, то 21 = 3d₂ и d₂ = 7.","algorithm":"(1/2) · 10 · (4/5) = 4.","retry":"Вычисли известный множитель при d₂.","steps":["(1/2) · 10 · (4/5) = 4.","36 = 4d₂.","d₂ = 9."],"unit":""},{"kind":"number","q":"Найди sin α по формуле S = (1/2)d₁d₂ sin α, если S = 42, d₁ = 14, d₂ = 12.","answer":0.5,"before":"При S = 12, d₁ = 8, d₂ = 6 получаем 12 = 24 sin α, поэтому sin α = 0,5.","see":"Сначала посчитай половину произведения диагоналей.","similar":"При S = 12, d₁ = 8, d₂ = 6 получаем 12 = 24 sin α, поэтому sin α = 0,5.","algorithm":"(1/2) · 14 · 12 = 84.","retry":"Сначала посчитай половину произведения диагоналей.","steps":["(1/2) · 14 · 12 = 84.","42 = 84 sin α.","sin α = 42/84 = 0,5."],"unit":""},{"kind":"number","q":"По формуле a = ω²R найди R в метрах при ω = 6,5 и a = 1056,25.","answer":25,"before":"Если ω = 2,5 и a = 25, то 25 = 6,25R, поэтому R = 4.","see":"Возведи в квадрат 6,5, затем раздели a на результат.","similar":"Если ω = 2,5 и a = 25, то 25 = 6,25R, поэтому R = 4.","algorithm":"6,5² = 42,25.","retry":"Возведи в квадрат 6,5, затем раздели a на результат.","steps":["6,5² = 42,25.","1056,25 = 42,25R.","R = 25 м."],"unit":""}]},{"name":"От формулы к уравнению и условию","subtitle":"Теория и практика","title":"От формулы к уравнению и условию","intro":"\u003csection class=\"theory-topic\">\u003ch3>От формулы к уравнению и условию\u003c/h3>\u003cp class=\"math-definition\">\u003cstrong>Допустимое значение\u003c/strong> — значение неизвестной величины, которое удовлетворяет ограничениям задачи.\u003c/p>\u003cdiv class=\"definition-parts\">\u003col>\u003cli>\u003ch4>Неизвестная в квадрате\u003c/h4>\u003cp class=\"theory-note\">Изолируй квадрат. Если получаются два числа, выбери значение, подходящее по смыслу.\u003c/p>\u003cdiv class=\"theory-cell\">E = mv²/2. При E = 25, m = 2 имеем v² = 25. Модуль скорости v = 5.\u003c/div>\u003c/li>\u003cli>\u003ch4>Слова и знаки\u003c/h4>\u003cp class=\"theory-note\">«Не больше» означает ≤, «не меньше» означает ≥. Для количества предметов ищи целое число.\u003c/p>\u003cdiv class=\"theory-cell\">1000 + 200n ≤ 1750 → n ≤ 3,75 → можно оплатить не больше 3 предметов.\u003c/div>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>","anchor":"Изолируй квадрат. Если получаются два числа, выбери значение, подходящее по смыслу.","anchorNote":"«Не больше» означает ≤, «не меньше» означает ≥. Для количества предметов ищи целое число.","tasks":[{"kind":"number","q":"Кинетическая энергия E = mv²/2. Найди модуль скорости v, если E = 72 Дж, m = 4 кг.","answer":6,"before":"При E = 18, m = 4 получаем 18 = 2v², откуда v² = 9 и модуль скорости 3.","see":"Выдели v², затем возьми арифметический квадратный корень.","similar":"При E = 18, m = 4 получаем 18 = 2v², откуда v² = 9 и модуль скорости 3.","algorithm":"72 = 2v².","retry":"Выдели v², затем возьми арифметический квадратный корень.","steps":["72 = 2v².","v² = 36.","Модуль скорости v = 6 м/с."],"unit":""},{"kind":"number","q":"Стоимость поездки C = 150 + 22n рублей, где n — целое число километров. На сколько километров хватит 340 рублей?","answer":8,"before":"При C = 100 + 30n и бюджете 210 имеем 30n ≤ 110, поэтому максимум 3 км.","see":"Бюджет задаёт верхнюю границу для C.","similar":"При C = 100 + 30n и бюджете 210 имеем 30n ≤ 110, поэтому максимум 3 км.","algorithm":"150 + 22n ≤ 340.","retry":"Бюджет задаёт верхнюю границу для C.","steps":["150 + 22n ≤ 340.","22n ≤ 190, то есть n ≤ 190/22.","8 км стоят 326 руб., 9 км — 348 руб. Ответ 8."],"unit":""},{"kind":"number","q":"По формуле C = 350 + 75n найди наибольшее целое n, при котором C не превышает 950.","answer":8,"before":"При 200 + 50n ≤ 500 получаем n ≤ 6. Ровно 6 допускается.","see":"«Не превышает» допускает равенство.","similar":"При 200 + 50n ≤ 500 получаем n ≤ 6. Ровно 6 допускается.","algorithm":"350 + 75n ≤ 950.","retry":"«Не превышает» допускает равенство.","steps":["350 + 75n ≤ 950.","75n ≤ 600.","n ≤ 8, поэтому максимум 8."],"unit":""},{"kind":"number","q":"Мяч летит по закону h = 12t − 3t², где t — время в секундах. Через сколько секунд после старта мяч снова окажется на высоте 0?","answer":4,"before":"Если h = 10t − 2t², то 2t(5 − t) = 0. Мяч стартует при t = 0 и возвращается при t = 5.","see":"Приравняй h к нулю и вынеси t за скобки.","similar":"Если h = 10t − 2t², то 2t(5 − t) = 0. Мяч стартует при t = 0 и возвращается при t = 5.","algorithm":"12t − 3t² = 0.","retry":"Приравняй h к нулю и вынеси t за скобки.","steps":["12t − 3t² = 0.","3t(4 − t) = 0, поэтому t = 0 или t = 4.","После старта подходит 4 с."],"unit":""}]}],"recap":["Подпиши величины и единицы до подстановки.","Чтобы выразить букву, выполняй одинаковые действия с обеими частями равенства.","Учитывай ограничения задачи: время, длина, целое количество и знак сравнения."]};

  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
</body>
</html>
