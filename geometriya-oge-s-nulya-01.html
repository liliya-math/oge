/* Shared visual language for lili.math trainers. */
:root {
  --trainer-bg: #16231A;
  --trainer-panel: #2B3D2B;
  --trainer-cream: #EEE0C8;
  --trainer-sand: #C9AB82;
  --trainer-cobalt: #2F5BB5;
  --trainer-orange: #DD7A3A;
  --trainer-gold: #E2B04A;
  --trainer-blue: #B6CBE3;
  --trainer-moss: #5F7B3F;
  --trainer-caramel: #9C6B40;
  --trainer-border: #EEE0C826;
  --trainer-card: #2B3D2B66;
  --trainer-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --bg: var(--trainer-bg);
  --fg: var(--trainer-cream);
  --text: var(--trainer-cream);
  --cream: var(--trainer-cream);
  --muted: var(--trainer-sand);
  --faint: var(--trainer-sand);
  --line: var(--trainer-border);
  --mint: var(--trainer-gold);
  --ok: var(--trainer-gold);
  --bad: var(--trainer-orange);
  --miss: var(--trainer-orange);
  --sans: var(--trainer-font);
  --display: var(--trainer-font);
  color-scheme: dark;
}
html, body {
  background: var(--trainer-bg) !important;
  color: var(--trainer-cream);
  font-family: var(--trainer-font) !important;
}
body *, body *::before, body *::after {
  box-shadow: none !important;
  text-shadow: none !important;
  font-style: normal !important;
}
h1, h2, h3, .page-heading h1 { font-family: var(--trainer-font); }
h1, h2, .page-heading h1 { color: var(--trainer-cream); font-weight: 800; }
:where(.sub, .lead, .caption, .muted, .small, figcaption) { color: var(--trainer-sand); }
body :is(.eyebrow, .sidebar-title, .lesson-label, .task-kicker, .anchor-label, .visual-kicker, .sect) {
  color: var(--trainer-gold);
}
body :is(.sidebar, .topbar) { background-image: none; }
body .sidebar { background-color: var(--trainer-bg); }
body .board text { font-family: var(--trainer-font); }
body :is(.amb, .board) { background-image: none; }
body :is(.mascot-hero, .mascot-hero img) { mask-image: none; }
body svg.fig text {
  paint-order: stroke;
  stroke: var(--trainer-bg);
  stroke-width: 3px;
  stroke-linejoin: round;
}

body :is(.brand, .brand b, .trainer-wordmark) {
  color: var(--trainer-cream);
  font-family: var(--trainer-font);
}
.brand .brand-icon { display: none; }
.trainer-wordmark { font-size: 1.2rem; font-weight: 800; letter-spacing: -.045em; margin: 0 0 1.2rem; }

body :is(.card, .lesson-card, .support-card, .route-progress, .mode, dialog) {
  --trainer-card-stripe: var(--trainer-cobalt);
  color: var(--trainer-cream);
  background: var(--trainer-card);
  border: 1px solid var(--trainer-border);
  border-top: 4px solid var(--trainer-card-stripe);
  border-radius: 24px;
}
body :is(.card, .mode):nth-of-type(6n + 2), body .route-progress {
  --trainer-card-stripe: var(--trainer-gold);
}
body :is(.card, .mode):nth-of-type(6n + 3), body .right-column .support-card:first-child {
  --trainer-card-stripe: var(--trainer-orange);
}
body :is(.card, .mode):nth-of-type(6n + 4), body .right-column .support-card:nth-child(2) {

window.TrainerData={"id":"oge-geometry-express-01","version":1,"title":"Геометрия ОГЭ с нуля · lili.math","heading":"Геометрия ОГЭ с нуля","subtitle":"От первых построений до координат и векторов","description":"Экспресс-курс геометрии для ОГЭ с чертежами и заданиями с проверкой","grade":"7–9 класс","stages":[{"name":"Точка и прямая","subtitle":"Обозначения","title":"Как подписать рисунок","intro":"<p class=\"lesson-bridge\"><strong>Связь тем.</strong> Точка и прямая понадобятся во всех следующих чертежах. Сначала научимся их подписывать.</p><section class=\"theory-topic\"><h3>Точка и прямая</h3><div class=\"rule-card\"><span class=\"concept-label\">Понятия</span><p>Точка и прямая относятся к основным неопределяемым понятиям планиметрии.</p></div><div class=\"definition-parts\"><ol><li><h4>Точка</h4><p>Отмечаем маленькую точку и ставим рядом одну прописную латинскую букву.</p><p>Например, A.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li><li><h4>Прямая</h4><p>Обозначаем одной строчной латинской буквой, например a, или двумя прописными латинскими буквами, например AB.</p><p>В записи AB буквы A и B обозначают две разные точки этой прямой.</p><p>Прямая продолжается в обе стороны.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"16\" text-anchor=\"middle\" font-weight=\"650\">C</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"26\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Точка A. Прямая a или AB.","anchorNote":"Прямую AB можно назвать и BA.","tasks":[{"kind":"choice","q":"Как можно обозначить точку?","before":"Точку обозначили буквой M. Это одна прописная латинская буква.","answer":"K","see":"Ищем одну прописную букву.","similar":"Точку обозначили буквой M. Это одна прописная латинская буква.","algorithm":"Сравни количество букв и их регистр.","retry":"Сравни количество букв и их регистр.","steps":["K — одна прописная латинская буква.","Записываем точка K."],"visual":"","options":["k","KL","K"],"unit":""},{"kind":"choice","q":"На рисунке показана прямая a. Как можно назвать её по двум отмеченным на ней точкам?","before":"Если через точки P и Q проходит прямая, её можно назвать PQ.","answer":"KL","see":"На линии две точки: K и L.","similar":"Если через точки P и Q проходит прямая, её можно назвать PQ.","algorithm":"Прочитай подписи двух точек на линии.","retry":"Прочитай подписи двух точек на линии.","steps":["На прямой стоят K и L.","Запись KL обозначает прямую через эти точки."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">K</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">L</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["K","KL","KLM"],"unit":""},{"kind":"choice","q":"Какой буквой можно обозначить прямую?","before":"Одной буквой прямую обозначают строчной. Например, прямая b.","answer":"m","see":"Ищем одну строчную букву.","similar":"Одной буквой прямую обозначают строчной. Например, прямая b.","algorithm":"Выбери только одну маленькую латинскую букву.","retry":"Выбери только одну маленькую латинскую букву.","steps":["Буква m строчная.","Записываем прямая m."],"visual":"","options":["M","m","MN"],"unit":""}]},{"name":"Точка на прямой","subtitle":"Принадлежность","title":"Как читать ∈ и ∉","intro":"<p class=\"lesson-bridge\"><strong>Связь тем.</strong> После обозначений выясним, лежит ли отмеченная точка на прямой, и запишем это символами.</p><section class=\"theory-topic\"><h3>Точка и линия на чертеже</h3><div class=\"rule-card\"><span class=\"concept-label\">Точка на прямой</span><p>A ∈ a означает, что точка A лежит на прямой a.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Точка вне прямой</span><p>A ∉ a означает, что точка A лежит вне прямой a.</p></div><div class=\"definition-parts\"><ol><li><h4>Точка на прямой</h4><p>Точку A нарисовали на линии a.</p><p>Записываем A ∈ a.</p><p>Читаем «точка A принадлежит прямой a».</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li><li><h4>Точка вне прямой</h4><p>Точку C нарисовали выше линии a.</p><p>Записываем C ∉ a.</p><p>Читаем «точка C не принадлежит прямой a».</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"139\" y=\"16\" text-anchor=\"middle\" font-weight=\"650\">C</text><circle cx=\"139\" cy=\"26\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Основное свойство прямой</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Через любые две <strong>различные точки</strong> можно провести прямую, и притом только одну.</p></div><div class=\"definition-parts\"><ol><li><h4>Две точки задают прямую</h4><p>Проводим линию через A и B.</p><p>Любая прямая, проходящая сразу через эти две точки, совпадёт с прямой AB.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"∈ читаем «принадлежит». ∉ читаем «не принадлежит».","anchorNote":"Слева пишем точку, справа прямую.","tasks":[{"kind":"choice","q":"Как записать положение точки D?","before":"Точка A находится на линии a. Записываем A ∈ a.","answer":"D ∈ a","see":"Найди точку D.","similar":"Точка A находится на линии a. Записываем A ∈ a.","algorithm":"Посмотри, проходит ли линия через центр точки.","retry":"Посмотри, проходит ли линия через центр точки.","steps":["Точка D лежит на прямой a.","Поэтому D ∈ a."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">D</text><text x=\"139\" y=\"16\" text-anchor=\"middle\" font-weight=\"650\">E</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"26\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["D ∉ a","D ∈ a"],"unit":""},{"kind":"choice","q":"Как записать положение точки F?","before":"Точка C расположена выше прямой a. Записываем C ∉ a.","answer":"F ∉ a","see":"Найди точку F.","similar":"Точка C расположена выше прямой a. Записываем C ∉ a.","algorithm":"Посмотри, касается ли линия точки F.","retry":"Посмотри, касается ли линия точки F.","steps":["Точка F лежит вне прямой a.","Поэтому F ∉ a."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">G</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">H</text><text x=\"139\" y=\"16\" text-anchor=\"middle\" font-weight=\"650\">F</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"26\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["F ∈ a","F ∉ a"],"unit":""},{"kind":"choice","q":"Сколько прямых можно провести через две разные точки P и Q?","before":"Через две разные точки A и B проходит ровно одна прямая AB.","answer":"Одну","see":"Даны две разные точки.","similar":"Через две разные точки A и B проходит ровно одна прямая AB.","algorithm":"Вспомни основное свойство прямой.","retry":"Вспомни основное свойство прямой.","steps":["Соединяем P и Q прямой.","Прямая, общая для P и Q, ровно одна."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285m-270 0 8-4m-8 4 8 4m262-4-8-4m8 4-8 4\" stroke=\"#16231A\" fill=\"none\" stroke-width=\"2\"/><text x=\"266\" y=\"57\">a</text><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">P</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">Q</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Ни одной","Одну","Две"],"unit":""}]},{"name":"Отрезок","subtitle":"Концы и точки между ними","title":"Как распознать отрезок","intro":"<p class=\"lesson-bridge\"><strong>Связь тем.</strong> Прямая продолжается в обе стороны. Выделим часть прямой между двумя точками.</p><section class=\"theory-topic\"><h3>Где отрезок начинается и заканчивается</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Отрезок</strong> – часть прямой, состоящая из двух точек этой прямой и всех её точек между ними.</p></div><div class=\"definition-parts\"><ol><li><h4>Концы</h4><p>Точки A и B ограничивают выделенную часть.</p><p>Это концы отрезка AB.</p><p>Можно также написать BA.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li><li><h4>Точка между концами</h4><p>Точка C стоит между A и B, поэтому входит в отрезок AB.</p><p>Сами A и B тоже входят в отрезок.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">C</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Отрезок AB и отрезок BA совпадают.","anchorNote":"Прямая продолжается, а отрезок ограничен двумя концами.","tasks":[{"kind":"choice","q":"Какие точки являются концами выделенного отрезка?","before":"У отрезка AB концы A и B. Буквы для названия берём с двух краёв выделенной части.","answer":"P и Q","see":"У выделенного отрезка два края.","similar":"У отрезка AB концы A и B. Буквы для названия берём с двух краёв выделенной части.","algorithm":"Посмотри на подписи слева и справа.","retry":"Посмотри на подписи слева и справа.","steps":["Слева стоит P, справа Q.","Концы отрезка — P и Q."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">P</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">Q</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">R</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["P и R","R и Q","P и Q"],"unit":""},{"kind":"choice","q":"Какая точка на рисунке лежит между концами отрезка KL?","before":"Если C отмечена между A и B, то C принадлежит отрезку AB.","answer":"M","see":"Концы отрезка указаны в названии KL.","similar":"Если C отмечена между A и B, то C принадлежит отрезку AB.","algorithm":"Найди точку между K и L.","retry":"Найди точку между K и L.","steps":["K и L — концы отрезка.","M расположена между ними."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">K</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">L</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">M</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["K","L","M"],"unit":""},{"kind":"choice","q":"Как ещё можно назвать отрезок DE?","before":"Отрезки AB и BA совпадают. При смене порядка букв концы остаются теми же.","answer":"ED","see":"У отрезка остаются концы D и E.","similar":"Отрезки AB и BA совпадают. При смене порядка букв концы остаются теми же.","algorithm":"Поменяй буквы D и E местами.","retry":"Поменяй буквы D и E местами.","steps":["Меняем порядок двух букв.","Получаем отрезок ED."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">D</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">E</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["D","ED","DF"],"unit":""}]},{"name":"Измерение отрезков","subtitle":"Линейка и сложение длин","title":"Как найти длину","intro":"<p class=\"lesson-bridge\"><strong>Связь тем.</strong> У отрезка есть два конца. По отметкам этих концов на линейке можно найти длину.</p><section class=\"theory-topic\"><h3>Измеряем по шкале</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Длина отрезка</strong> – расстояние между его концами.</p></div><div class=\"definition-parts\"><ol><li><h4>Считываем отметки</h4><p>Если начало на отметке 1 см, а конец на отметке 5 см, длина равна 5 − 1 = 4 см.</p><p>Если начало на нуле, достаточно прочитать отметку у второго конца.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 105\" role=\"img\" aria-label=\"Концы отрезка у отметок 1 и 5 см\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\" text-anchor=\"middle\"><path d=\"M12 58H284\" stroke=\"#16231A\" stroke-width=\"2\"/><path d=\"M24 58v12\" stroke=\"#16231A\"/><text x=\"24\" y=\"88\">0</text><path d=\"M55 58v12\" stroke=\"#16231A\"/><text x=\"55\" y=\"88\">1</text><path d=\"M86 58v12\" stroke=\"#16231A\"/><text x=\"86\" y=\"88\">2</text><path d=\"M117 58v12\" stroke=\"#16231A\"/><text x=\"117\" y=\"88\">3</text><path d=\"M148 58v12\" stroke=\"#16231A\"/><text x=\"148\" y=\"88\">4</text><path d=\"M179 58v12\" stroke=\"#16231A\"/><text x=\"179\" y=\"88\">5</text><path d=\"M210 58v12\" stroke=\"#16231A\"/><text x=\"210\" y=\"88\">6</text><path d=\"M241 58v12\" stroke=\"#16231A\"/><text x=\"241\" y=\"88\">7</text><path d=\"M272 58v12\" stroke=\"#16231A\"/><text x=\"272\" y=\"88\">8</text><text x=\"282\" y=\"102\">см</text><path d=\"M55 34H179\" stroke=\"#a94c20\" stroke-width=\"4\"/><path d=\"M55 34v24m124-24v24\" stroke=\"#a94c20\" stroke-dasharray=\"3 3\"/><circle cx=\"55\" cy=\"34\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"179\" cy=\"34\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Складываем длины частей</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Если точка C лежит между A и B, то <strong>AB = AC + CB</strong>.</p></div><div class=\"definition-parts\"><ol><li><h4>Складываем части</h4><p>Если AC = 4 см и CB = 5 см, то AB = 4 + 5 = 9 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">C</text><path d=\"M59 82v11m80-11v11m100-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"99\" y=\"112\" text-anchor=\"middle\">4 см</text><text x=\"189\" y=\"112\" text-anchor=\"middle\">5 см</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li><li><h4>Находим одну часть</h4><p>Если AB = 9 см и AC = 4 см, то CB = 9 − 4 = 5 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">C</text><path d=\"M59 82v11m80-11v11m100-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"99\" y=\"112\" text-anchor=\"middle\">4 см</text><text x=\"189\" y=\"112\" text-anchor=\"middle\">?</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx= резок по шкале и складывали его части. Теперь используем это, когда одна часть задана через другую.</p><section class=\"theory-topic\"><h3>Длина и расстояние</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Расстояние между двумя точками</strong> – длина соединяющего их отрезка.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Длина отрезка положительна.</p><p>Равные отрезки имеют равные длины.</p><p>Если M между A и B, то AB = AM + MB.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если AM = 3 см и MB = 5 см, расстояние между A и B равно 8 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">M</text><path d=\"M59 82v11m80-11v11m100-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"99\" y=\"112\" text-anchor=\"middle\">3 см</text><text x=\"189\" y=\"112\" text-anchor=\"middle\">5 см</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Единицы длины</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>1 см = 10 мм, 1 дм = 10 см, 1 м = 10 дм = 100 см, 1 км = 1000 м.</p><p>Перед сложением или вычитанием приведи длины к одной единице.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>2 дм 3 см = 20 см + 3 см = 23 см.</p><div class=\"theory-cell\"><p class=\"theory-cell\">мм → см → дм → м → км</p></div></li></ol></div></section><section class=\"theory-topic\"><h3>Середина отрезка</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Середина отрезка</strong> – точка отрезка, делящая его на две равные части.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если M — середина AB и AB = 14 см, то AM = MB = 7 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"149\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">M</text><path d=\"M59 82v11m90-11v11m90-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"104\" y=\"112\" text-anchor=\"middle\">7 см</text><text x=\"194\" y=\"112\" text-anchor=\"middle\">7 см</text><path d=\"M104.000 64.000L104.000 74.000M194.000 64.000L194.000 74.000\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"149\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Части связаны условием</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Меньшую часть обозначаем x.</p><p>Если вторая в 3 раза больше, её длина равна 3x.</p><p>Сумма равна длине целого.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если AB = 16 см, то x + 3x = 16, x = 4.</p><p>Длины частей 4 см и 12 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">M</text><path d=\"M59 82v11m80-11v11m100-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"99\" y=\"112\" text-anchor=\"middle\">x</text><text x=\"189\" y=\"112\" text-anchor=\"middle\">3x</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Если M лежит между A и B,  доля равна 4 см, три доли — 12 см.","answer":"6 см и 18 см","see":"Сопоставь рисунок и условие.","similar":"При целом 16 см и отношении 1 : 3 одна доля равна 4 см, три доли — 12 см.","algorithm":"Раздели 24 см на четыре доли.","retry":"Раздели 24 см на четыре доли.","steps":["Раздели 24 см на четыре доли.","AM = 6 см, MB = 3 · 6 = 18 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M59 69H239\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">M</text><path d=\"M59 82v11m80-11v11m100-11v11M59 88H239\" stroke=\"#5f7b3f\" fill=\"none\"/><text x=\"99\" y=\"112\" text-anchor=\"middle\">x</text><text x=\"189\" y=\"112\" text-anchor=\"middle\">3x</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["8 см и 16 см","18 см и 6 см","6 см и 18 см"],"unit":""}]},{"name":"Луч и угол","subtitle":"Начальные сведения","title":"Луч и угол","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> У отрезка два конца. Если от одной точки двигаться вдоль прямой без остановки в одном направлении, получится луч. Два луча из одной точки образуют угол.</p><section class=\"theory-topic\"><h3>Луч и дополнительные лучи</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Луч</strong> – часть прямой, состоящая из начальной точки и всех точек прямой по одну сторону от неё.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Дополнительные лучи</strong> – два луча с общим началом, которые вместе составляют прямую.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если O лежит между A и B, лучи OA и OB дополнительные.</p><p>Начало луча пишем первым.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" role=\"img\" aria-label=\"Геометрический чертёж\" style=\"display:block;width:100%;max-width:550px;margin:8px auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"16\"><path d=\"M15 69H285\" stroke=\"#a94c20\" stroke-width=\"4\"/><text x=\"59\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">A</text><text x=\"239\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"139\" y=\"59\" text-anchor=\"middle\" font-weight=\"650\">O</text><circle cx=\"59\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"239\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"139\" cy=\"69\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Стороны и вершина</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Угол</strong> – фигура, образованная двумя лучами с общим началом.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Стороны угла</strong> – лучи, которые образуют угол.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Вершина угла</strong> – общее начало его сторон.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Запись</span><p>При записи угла тремя буквами буква вершины стоит посередине.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>В угле AOB вершина O, стороны OA и OB.</p><p>Его можно назвать BOA.</p><p>Обозначение ∠O удобно, если понятно, о каком угле речь.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Угол AOB и луч OC внутри него\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M67 115H270m-203 0L123 35\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M67 115L191 65M98 115Q98 106 96 103M106 100Q101 85 90 82\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"50\" y=\"133\" font-weight=\"650\">O</text><text x=\"278.88\" y=\"117.57\" font-weight=\"650\">A</text><text x=\"123.07\" y=\"26.64\" font-weight=\"650\">B</text><text x=\"199.36\" y=\"64.93\" font-weight=\"650\">C</text><circle cx=\"270\" cy=\"115\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"67\" cy=\"115\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"123\" cy=\"35\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"191\" cy=\"65\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Виды углов и градусы</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Градус</strong> – одна из 180 равных частей развёрнутого угла.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Острый угол</strong> – угол больше 0° и меньше 90°.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Прямой угол</strong> – угол в 90°.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Тупой угол</strong> – угол больше 90° и меньше 180°.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Развёрнутый угол</strong> – угол в 180°.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойство</span><p>Градусная мера показывает величину угла в градусах.</p><p>Равные углы имеют равные градусные меры.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Угол 40° острый, 90° прямой, 130° тупой.</p><p>Стороны развёрнутого угла — дополнительные лучи.</p><div class=\"theory-cell\"><p class=\"theory-cell\">0° &lt; острый &lt; 90° &lt; тупой &lt; 180°</p></div></li></ol></div></section><section class=\"theory-topic\"><h3>Части угла и биссектриса</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Биссектриса угла</strong> – луч из вершины, делящий угол на два равных угла.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Сложение углов</span><p>Если луч OC проходит внутри ∠AOB, то ∠AOB = ∠AOC + ∠COB.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если ∠AOB = 80° и OC — биссектриса, обе части равны 40°.</p><p>Как с отрезком, целое складывается из двух частей.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Угол AOB и луч OC внутри него\" style=\"width:100%;max-width:560px;display:block;margin:auto;backgr .98\" y=\"148.24\" font-weight=\"650\">D</text><text x=\"155\" y=\"101\" font-weight=\"650\">O</text><circle cx=\"24\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"294\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"228\" cy=\"25\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"87\" cy=\"137\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"157.5\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Перпендикулярные прямые</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Угол между пересекающимися прямыми</strong> – меньший из углов при их пересечении или 90°, если все углы равны.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Перпендикулярные прямые</strong> – прямые, пересекающиеся под прямым углом. Записываем a ⟂ b.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Через любую точку плоскости проходит ровно одна прямая, перпендикулярная данной.</p><p>Две прямые, перпендикулярные третьей, параллельны.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Достаточно отметить один угол 90°: смежный тоже будет 90°, вертикальные им равны.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямая через середину M перпендикулярна AB\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\ >B</text><text x=\"236.36\" y=\"24.93\" font-weight=\"650\">C</text><text x=\"66.98\" y=\"148.24\" font-weight=\"650\">D</text><text x=\"155\" y=\"101\" font-weight=\"650\">O</text><circle cx=\"24\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"294\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"228\" cy=\"25\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"87\" cy=\"137\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"157.5\" cy=\"81\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"°"}]},{"name":"Параллельные прямые и секущая","subtitle":"Начальные сведения","title":"Параллельные прямые и секущая","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> У каждого пересечения уже умеем находить смежные и вертикальные углы. Свойства параллельных прямых позволяют перенести вычисление на второе пересечение.</p><section class=\"theory-topic\"><h3>Прямые, отрезки, секущая</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Параллельные прямые</strong> – две прямые одной плоскости, которые не пересекаются. Записываем a ∥ b.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Параллельные отрезки</strong> – отрезки, лежащие на параллельных прямых.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Секущая</strong> – прямая, пересекающая две данные прямые в разных точках.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Две горизонтальные прямые пересечены наклонной.</p><p>У каждого пересечения по четыре угла.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M22 47H290M22 112H290M111 143L202 12\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"188\" y=\"36\">1</text><text x=\"148\" y=\"36\">2</text><text x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Три пары углов</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Накрест лежащие углы</strong> – углы между прямыми по разные стороны от секущей.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Соответственные углы</strong> – углы, занимающие одинаковое положение при двух пересечениях.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Односторонние углы</strong> – углы между прямыми по одну сторону от секущей.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>При параллельных прямых накрест лежащие и соответственные углы в каждой паре равны.</p><p>Сумма односторонних углов равна 180°.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Накрест лежащие — 3 и 5, соответственные — 1 и 5, односторонние — 4 и 5.</p><p>Если угол 5 равен 60°, углы 3 и 1 тоже по 60°, а угол 4 равен 120°.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M22 47H290M22 112H290M111 143L202 12\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"188\" y=\"36\">1</text><text x=\"148\" y=\"36\">2</text><text x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Признаки параллельности</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Если накрест лежащие углы равны, или соответственные углы равны, или сумма односторонних углов равна 180°, две прямые параллельны.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если угол 4 равен 105°, а угол 5 равен 75°, их сумма 180°.</p><p>Значит, прямые параллельны.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" fon xt x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["1","5","6"],"unit":""},{"kind":"number","q":"Прямые параллельны. Угол 1 равен 68°. Найди угол 8.","before":"Если угол 1 равен 70°, угол 5 тоже 70°, а угол 8, смежный с 5, равен 110°.","answer":112,"see":"Выдели на рисунке известные данные.","similar":"Если угол 1 равен 70°, угол 5 тоже 70°, а угол 8, смежный с 5, равен 110°.","algorithm":"Перенеси величину угла 1 на соответственный угол 5.","retry":"Перенеси величину угла 1 на соответственный угол 5.","steps":["Перенеси величину угла 1 на соответственный угол 5.","Угол 8 равен 180° − 68° = 112°."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M22 47H290M22 112H290M111 143L202 12\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"188\" y=\"36\">1</text><text x=\"148\" y=\"36\">2</text><text x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"°"},{"kind":"choice","q":"Угол 4 равен 117°, угол 5 равен 63°. Что можно заключить?","before":"Если односторонние углы 100° и 80°, прямые параллельны.","answer":"Прямые параллельны","see":"Сопоставь рисунок и условие.","similar":"Если односторонние углы 100° и 80°, прямые параллельны.","algorithm":"Сложи 117° и 63°.","retry":"Сложи 117° и 63°.","steps":["Сложи 117° и 63°.","Сумма 180°, срабатывает признак по односторонним углам."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M22 47H290M22 112H290M111 143L202 12\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"188\" y=\"36\">1</text><text x=\"148\" y=\"36\">2</text><text x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Прямые параллельны","Прямые перпендикулярны","Данных недостаточно"],"unit":""},{"kind":"choice","q":"Прямые параллельны, угол 1 равен 54°. Какие ещё углы равны 54°?","before":"Если угол 1 равен 70°, то углы 3, 5, 7 тоже по 70°. Остальные четыре угла равны 110°.","answer":"3, 5 и 7","see":"Сопоставь рисунок и условие.","similar":"Если угол 1 равен 70°, то углы 3, 5, 7 тоже по 70°. Остальные четыре угла равны 110°.","algorithm":"Найди вертикальный к 1 и соответственный к 1 углы. Затем найди вертикальный к углу 5.","retry":"Найди вертикальный к 1 и соответственный к 1 углы. Затем найди вертикальный к углу 5.","steps":["Найди вертикальный к 1 и соответственный к 1 углы. Затем найди вертикальный к углу 5.","Углы 3, 5 и 7 равны 54°. Остальные четыре угла равны 126°."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Две горизонтальные прямые пересечены секущей, углы пронумерованы\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M22 47H290M22 112H290M111 143L202 12\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"188\" y=\"36\">1</text><text x=\"148\" y=\"36\">2</text><text x=\"135\" y=\"66\">3</text><text x=\"168\" y=\"66\">4</text><text x=\"142\" y=\"102\">5</text><text x=\"104\" y=\"102\">6</text><text x=\"91\" y=\"132\">7</text><text x=\"126\" y=\"132\">8</text><circle cx=\"177.687\" cy=\"47.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"132.534\" cy=\"112.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["2, 4 и 6","3, 5 и 7","4, 6 и 8"],"unit":""}]},{"name":"Треугольник и периметр","subtitle":"Треугольники","title":"Треугольник и периметр","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Отрезки уже умеем обозначать и измерять. Соединим три точки, лежащие не на одной прямой, и найдём общую длину трёх сторон.</p><section class=\"theory-topic\"><h3>Вершины, стороны и углы</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Треугольник</strong> – фигура из трёх точек, не лежащих на одной прямой, и трёх попарно соединяющих их отрезков.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Вершины треугольника</strong> – три точки, которыми он задан.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Стороны треугольника</strong> – три отрезка между его вершинами.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>В △ABC вершины A, B, C, стороны AB, BC, AC.</p><p>Угол при B можно записать ∠ABC.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M46 118L117 29L266 118Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"34.43\" y=\"137.36\" font-weight=\"650\">A</text><text x=\"114.26\" y=\"19.79\" font-weight=\"650\">B</text><text x=\"266.24\" y=\"137.52\" font-weight=\"650\">C</text><circle cx=\"46\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"117\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"266\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Периметр и зависимость сторон</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Периметр</strong> – сумма длин сторон.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Как считать</span><p>Если две стороны равны, обозначаем обе через x и подставляем их в сумму.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>При P = 20 см, AB = BC и AC = 6 см имеем 2x + 6 = 20.</p><p>Получаем AB = BC = 7 см.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Равнобедренный треугольник AB = BC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M45 119L157 29L269 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"33.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"157\" y=\"17\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><path d=\"M97.868 70.102L104.132 77.898M216.132 70.102L209.868 77.898\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"157\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"269\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Периметр треугольника равен сумме трёх сторон.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"choice","q":"Какая сторона лежит напротив вершины B?","before":"Напротив A лежит BC: у этой стороны нет вершины A.","answer":"AC","see":"Сопоставь рисунок и условие.","similar":"Напротив A лежит BC: у этой стороны нет вершины A.","algorithm":"Выбери сторону без вершины B.","retry":"Выбери сторону без вершины B.","steps":["Выбери сторону без вершины B.","Это AC."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M46 118L117 29L266 118Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"34.43\" y=\"137.36\" font-weight=\"650\">A</text><text x=\"114.26\" y=\"19.79\" font-weight=\"650\">B</text><text x=\"266.24\" y=\"137.52\" font-weight=\"650\">C</text><circle cx=\"46\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"117\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"266\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["AB","BC","AC"],"unit":""},{"kind":"choice","q":"Периметр 32 см. AB = BC, AC на 2 см длиннее AB. Найди AB, BC, AC.","before":"Если P = 23 см, две стороны x, третья x + 2, то 3x + 2 = 23. Стороны 7, 7 и 9 см.","answer":"10, 10, 12 см","see":"Сопоставь рисунок и условие.","similar":"Если P = 23 см, две стороны x, третья x + 2, то 3x + 2 = 23. Стороны 7, 7 и 9 см.","algorithm":"Составь 3x + 2 = 32.","retry":"Составь 3x + 2 = 32.","steps":["Составь 3x + 2 = 32.","x = 10, третья сторона 12 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Равнобедренный треугольник AB = BC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M45 119L157 29L269 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"33.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"157\" y=\"17\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><path d=\"M97.868 70.102L104.132 77.898M216.132 70.102L209.868 77.898\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"157\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"269\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["12, 12, 8 см","10, 10, 12 см","8, 8, 16 см"],"unit":""}]},{"name":"Углы и стороны треугольника","subtitle":"Треугольники","title":"Углы и стороны треугольника","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Используем накрест лежащие углы: проводим через B прямую, параллельную AC. Лучи BA и BC делят развёрнутый угол при B на три угла, равные углам треугольника.</p><section class=\"theory-topic\"><h3>Сумма углов</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Сумма углов треугольника равна 180°.</p><p>Так получается из развёрнутого угла и двух пар накрест лежащих углов.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если углы A и C равны 40° и 65°, то ∠B = 180° − 40° − 65° = 75°.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Через B проведена прямая, параллельная AC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M40 34H285M51 120H271M51 120L130 34L271 120\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"39.43\" y=\"139.36\" font-weight=\"650\">A</text><text x=\"125\" y=\"25\" font-weight=\"650\">B</text><text x=\"278.23\" y=\"138.39\" font-weight=\"650\">C</text><circle cx=\"51\" cy=\"120\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"130\" cy=\"34\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"271\" cy=\"120\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Внешний угол</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Внешний угол треугольника</strong> – угол, смежный с внутренним углом при той же вершине.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Он равен сумме двух внутренних углов, не смежных с ним.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Продлили AC за C.</p><p>Если ∠A = 35° и ∠B = 70°, то ∠BCD = 105°.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Угол BCD внешний при вершине C\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M32 118H298M44 118L108 35L232 118\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M255 118Q253 106 249 104\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"34\" y=\"138\" font-weight=\"650\">A</text><text x=\"102.33\" y=\"25.5\" font-weight=\"650\">B</text><text x=\"226\" y=\"139\" font-weight=\"650\">C</text><text x=\"292\" y=\"138\" font-weight=\"650\">D</text><circle cx=\"44\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"108\" cy=\"35\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"232\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"298\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Стороны и углы</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Против большей стороны лежит больший угол, и против большего угла лежит большая сторона. <strong>Неравенство треугольника</strong>: каждая сторона меньше суммы двух других.</p><p>Достаточно сравнить самую длинную сторону с суммой двух меньших.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Стороны 2, 4 и 6 не образуют треугольник: 2 + 4 = 6.</p><p>В треугольнике со сторонами 4, 5 и 6 угол напротив стороны 6 — самый большой.</p><div class=\"theory-cell\"><p class=\"theory-cell\">2 + 4 = 6  4 + 5 &gt; 6</p></div></li></ol></div></section><section class=\"theory-topic\"><h3>Виды по углам</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Остроугольный треугольник</strong> – треугольник с тремя острыми углами.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Прямоугольный треугольник</strong> – треугольник с одним прямым углом.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Тупоугольный треугольник</strong> – треугольник с одним тупым углом.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Гипотенуза</strong> – сторона прямоугольного треугольника напротив прямого угла.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Катеты</strong> – две стороны прямоугольного треугольника, образующие прямой угол.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>При ∠C = 90° катеты AC и BC, гипотенуза AB.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Сумма углов треугольника 180°. Самая длинная сторона короче суммы двух других.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"В треугольнике два угла равны 43° и 62°. Найди третий.","before":"Если два угла 40° и 65°, третий равен 180° − 40° − 65° = 75°.","answer":75,"see":"Выдели на рисунке известные данные.","similar":"Если два угла 40° и 65°, третий равен 180° − 40° − 65° = 75°.","algorithm":"Вычти из 180° оба известных угла.","retry":"Вычти из 180° оба известных угла.","steps":["Вычти из 180° оба известных угла.","180° − 43° − 62° = 75°."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;m
