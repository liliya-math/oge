/text><circle cx=\"44\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"108\" cy=\"35\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"232\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"298\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"°"},{"kind":"choice","q":"Из каких трёх отрезков можно построить треугольник?","before":"Для длин 4, 5, 6 проверяем 4 + 5 > 6.","answer":"4, 7, 9","see":"Сопоставь рисунок и условие.","similar":"Для длин 4, 5, 6 проверяем 4 + 5 > 6.","algorithm":"Сравни сумму двух меньших длин с большей.","retry":"Сравни сумму двух меньших длин с большей.","steps":["Сравни сумму двух меньших длин с большей.","4 + 7 = 11 > 9."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M46 118L117 29L266 118Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"34.43\" y=\"137.36\" font-weight=\"650\">A</text><text x=\"114.26\" y=\"19.79\" font-weight=\"650\">B</text><text x=\"266.24\" y=\"137.52\" font-weight=\"650\">C</text><circle cx=\"46\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"117\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"266\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["2, 3, 5","3, 4, 9","4, 7, 9"],"unit":""},{"kind":"choice","q":"Как называется сторона AB, если ∠C = 90°?","before":"Если ∠K = 90°, гипотенуза — сторона напротив K.","answer":"Гипотенуза","see":"Сопоставь рисунок и условие.","similar":"Если ∠K = 90°, гипотенуза — сторона напротив K.","algorithm":"Найди сторону напротив C.","retry":"Найди сторону напротив C.","steps":["Найди сторону напротив C.","AB — гипотенуза."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Катет","Гипотенуза","Высота"],"unit":""}]},{"name":"Медианы, биссектрисы, высоты","subtitle":"Треугольники","title":"Медианы, биссектрисы, высоты","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Середина отрезка, биссектриса угла и перпендикуляр теперь становятся инструментами для построений внутри треугольника и на его продолжениях.</p><section class=\"theory-topic\"><h3>Медиана и центр тяжести</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Медиана треугольника</strong> – отрезок от вершины до середины противоположной стороны.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Центр тяжести треугольника</strong> – точка пересечения трёх медиан.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойство</span><p>Центр тяжести делит каждую медиану в отношении 2 : 1, считая от вершины.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если BM = 12, то BG = 8 и GM = 4, где G — центр тяжести.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Медиана BM и равные отрезки на основании\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M42 119L106 31L270 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M106 31L156 119\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"30.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"100.33\" y=\"21.5\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><text x=\"152\" y=\"139\" font-weight=\"650\">M</text><path d=\"M99.000 114.000L99.000 124.000M213.000 114.000L213.000 124.000\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"42\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"106\" cy=\"31\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"156\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Биссектрисы и вписанная окружность</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Биссектриса треугольника</strong> – отрезок биссектрисы угла от вершины до противоположной стороны.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Биссектрисы пересекаются в центре вписанной окружности, равноудалённом от сторон.</p><p>Они делят противоположную сторону в отношении прилежащих сторон.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если BD — биссектриса и AB : BC = 2 : 3, то AD : DC = 2 : 3.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Биссектриса BD делит угол B пополам\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M42 119L106 31L270 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M106 31L126 119\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"30.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"100.33\" y=\"21.5\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><text x=\"122\" y=\"141\" font-weight=\"650\">D</text><circle cx=\"42\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"106\" cy=\"31\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"126\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Высоты и ортоцентр</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Высота треугольника</strong> – перпендикулярный отрезок от вершины до прямой, содержащей противоположную сторону.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Ортоцентр</strong> – точка пересечения высот или их продолжений.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Где находится</span><p>Внутри остроугольного треугольника, в вершине прямого угла прямоугольного и снаружи тупоугольного.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>BH — высота к AC, если BH ⟂ AC.</p><p>В тупоугольном треугольнике основание высоты может лежать вне стороны.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Высота BH перпендикулярна AC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M42 119L106 31L270 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M106 31V119m0-12h12v12\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"30.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"100.33\" y=\"21.5\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><text x=\"102\" y=\"140\" font-weight=\"650\">H</text><circle cx=\"42\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"106\" cy=\"31\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"106\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Серединные перпендикуляры</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Серединный перпендикуляр</strong> – прямая через середину отрезка, перпендикулярная ему.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Любая её точка равноудалена от концов отрезка и наоборот.</p><p>Серединные перпендикуляры к сторонам пересекаются в центре описанной окружности.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если O лежит на серединном перпендикуляре к AB, то OA = OB.</p><p>Общая точка трёх серединных перпендикуляров равноудалена от A, B и C.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямая через середину M перпендикулярна AB\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M45 98H276 M160.5 23V136M160.5 86H172.5V98\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"38\" y=\"120\" font-weight=\"650\">A</text><text x=\"275\" y=\"120\" font-weight=\"650\">B</text><text x=\"139\" y=\"120\" font-weight=\"650\">M</text><path d=\"M102.750 93.000L102.750 103.000M218.250 93.000L218.250 103.000\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"98\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"160.5\" cy= ometry-point\"/></g></svg>","options":["Медианы","Высоты","Серединные перпендикуляры"],"unit":""}]},{"name":"Классификация по сторонам","subtitle":"Треугольники","title":"Классификация по сторонам","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Медиана, биссектриса и высота могут совпасть. Посмотрим, когда это происходит благодаря равенству сторон.</p><section class=\"theory-topic\"><h3>Равнобедренный треугольник</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Равнобедренный треугольник</strong> – треугольник с двумя равными сторонами.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Боковые стороны</strong> – две равные стороны равнобедренного треугольника.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Основание</strong> – третья сторона равнобедренного треугольника.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойства</span><p>Углы при основании равны.</p><p>Медиана, биссектриса и высота из вершины к основанию совпадают.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Признак</span><p>Если два угла треугольника равны, он равнобедренный.</p><p>Равные стороны лежат напротив равных углов.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если AB = BC и ∠A = 50°, то ∠C = 50°, а ∠B = 80°.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Равнобедренный треугольник AB = BC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M45 119L157 29L269 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"33.43\" y=\"138.36\" font-weight=\"650\">A</text><text x=\"157\" y=\"17\" text-anchor=\"middle\" font-weight=\"650\">B</text><text x=\"274\" y=\"137\" font-weight=\"650\">C</text><path d=\"M97.868 70.102L104.132 77.898M216.132 70.102L209.868 77.898\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"157\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"269\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Равносторонний и разносторонний</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Равносторонний треугольник</strong> – треугольник с тремя равными сторонами.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Разносторонний треугольник</strong> – треугольник с тремя попарно различными сторонами.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Свойство</span><p>Все углы равностороннего треугольника равны 60°.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Равносторонний всегда остроугольный.</p><p>Равнобедренный с ровно двумя равными сторонами и разносторонний могут быть остроугольными, прямоугольными или тупоугольными.</p><div class=\"theory-cell\"><p class=\"theory-cell\">Равнобедренные: 70°, 70°, 40° · 45°, 45°, 90° · 30°, 30°, 120°<br>Разносторонние: 50°, 60°, 70° · 30°, 60°, 90° · 25°, 35°, 120°</p></div></li></ol></div></section>","anchor":"В равнобедренном треугольнике углы при основании равны. Равносторонний треугольник всегда остроугольный.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"AB = BC, ∠B = 34°. Найди ∠A.","before":"Если угол при вершине 80°, на углы при основании о  и угол больше 90°.","Получаем равнобедренный тупоугольный треугольник."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M46 118L117 29L266 118Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"34.43\" y=\"137.36\" font-weight=\"650\">A</text><text x=\"114.26\" y=\"19.79\" font-weight=\"650\">B</text><text x=\"266.24\" y=\"137.52\" font-weight=\"650\">C</text><circle cx=\"46\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"117\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"266\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Разносторонний тупоугольный","Равносторонний остроугольный","Равнобедренный тупоугольный"],"unit":""}]},{"name":"Равенство треугольников","subtitle":"Треугольники","title":"Равенство треугольников","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> После равных сторон внутри одной фигуры сравним две фигуры. Признаки позволяют доказать, что при наложении треугольники совпадут.</p><section class=\"theory-topic\"><h3>Три признака</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Равные треугольники</strong> – треугольники, которые полностью совмещаются при наложении.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Первый признак</span><p>Равны две стороны и угол между ними.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Второй признак</span><p>Равны сторона и два прилежащих к ней угла.</p></ -width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"136\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"169\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"222\" cy=\"34\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"306\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Первый","Второй","Третий"],"unit":""}]},{"name":"Подобие треугольников","subtitle":"Треугольники","title":"Подобие треугольников","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Совпадение формы сохраняет углы даже при изменении размеров. Отношения сторон помогут найти длину в другом треугольнике.</p><section class=\"theory-topic\"><h3>Сходственные стороны</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Подобные треугольники</strong> – треугольники с попарно равными углами и пропорциональными сходственными сторонами.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Сходственные стороны</strong> – стороны подобных треугольников, лежащие напротив равных углов.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Коэффициент подобия</strong> – отношение сходственных сторон первого треугольника ко второму.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если △ABC ∼ △DEF, AB = 6 и DE = 3, то k = 2.</p><p>При EF = 4 получаем BC = 8.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Два треугольника ABC и DEF, рисунок схематический\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M21 119L69 53L136 119Z M169 119L222 34L306 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"12.24\" y=\"139.21\" font-weight=\"650\">A</text><text x=\"63.33\" y=\"43.5\" font-weight=\"650\">B</text><text x=\"136.24\" y=\"138.52\" font-weight=\"650\">C</text><text x=\"157.09\" y=\"138.36\" font-weight=\"650\">D</text><text x=\"216.83\" y=\"24.5\" font-weight=\"650\">E</text><text x=\"300.83\" y=\"139.5\" font-weight=\"650\">F</text><circle cx=\"21\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"69\" cy=\"53\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"136\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"169\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"222\" cy=\"34\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"306\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Три признака и следствия</h3><div class=\"rule-card\"><span class=\"concept-label\">Первый признак</span><p>Два угла одного треугольника попарно равны двум углам другого.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Второй признак</span><p>Две пары сходственных сторон пропорциональны и углы между этими сторонами равны.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Третий признак</span><p>Три пары сходственных сторон пропорциональны.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Что следует из подобия</span><p>Сходственные высоты, медианы, биссектрисы и периметры относятся как k.</p><p>Площади относятся как k².</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>При k = 3 сходственная высота первого треугольника втрое больше, а площадь в 9 раз больше.</p><div class=\"theory-cell\"><p class=\"theory-cell\">Длины: k  Площади: k²</p></div></li></ol></div></section>","anchor":"Коэффициент подобия действует на длины, его квадрат — на площади.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"∠A = ∠D и ∠B = ∠E. AB = 12 см, DE = 4 см, EF = 5 см. Найди BC.","before":"Если сходственные стороны 6 и 3, коэффициент равен 2. Стороне 4 соответствует сторона 8.","answer":15,"see":"Выдели на рисунке известные данные.","similar":"Если сходственные стороны 6 и 3, коэффициент равен 2. Стороне 4 соответствует сторона 8.","algorithm":"Установи подобие по двум углам, затем найди k = 12 : 4.","retry":"Установи подобие по двум углам, затем найди k = 12 : 4.","steps":["Установи подобие по двум углам, затем найди k = 12 : 4.","BC = 3 · 5 = 15 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Два треугольника ABC и DEF, рисунок схематический\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M21 119L69 53L136 119Z M169 119L222 34L306 119Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"12.24\" y=\"139.21\" font-weight=\"650\">A</text><text x=\"63.33\" y=\"43.5\" font-weight=\"650\">B</text><text x=\"136.24\" y=\"138.52\" font-weight=\"650\">C</text><text x=\"157.09\" y=\"138.36\" font-weight=\"650\">D</text><text x=\"216.83\" y=\"24.5\" font-weight=\"650\">E</ 1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Пять признаков равенства</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>Два прямоугольных треугольника равны по двум катетам, по катету и прилежащему острому углу, по катету и противолежащему острому углу, по гипотенузе и острому углу либо по гипотенузе и катету.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если гипотенузы равны и углы напротив выбранных катетов равны, срабатывает признак по гипотенузе и острому углу.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"В прямоугольном треугольнике острые углы дают в сумме 90°.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"Гипотенуза AB равна 24 см. Найди медиану из C к AB.","before":"Если гипотенуза 18 см, медиана к ней равна 9 см.","answer":12,"see":"Выдели на рисунке известные данные.","similar":"Если гипотенуза 18 см, медиана к ней равна 9 см.","algorithm":"Раздели гипотенузу пополам.","retry":"Раздели гипотенузу пополам.","steps":["Раздели гипотенузу пополам.","Медиана равна 12 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"см"},{"kind":"choice","q":"У двух прямоугольных треугольников равны гипотенузы и по одному катету. Какой признак подходит?","before":"Если известны равные гипотенузы и равные острые углы, выбираем признак по гипотенузе и острому углу.","answer":"По гипотенузе и катету","see":"Сопоставь рисунок и условие.","similar":"Если известны равные гипотенузы и равные острые углы, выбираем признак по гипотенузе и острому углу.","algorithm":"Назови две данные пары равных элементов.","retry":"Назови две данные пары равных элементов.","steps":["Назови две данные пары равных элементов.","Гипотенузы и катеты."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["По двум катетам","По катету и острому углу","По гипотенузе и катету"],"unit":""}]},{"name":"Теорема Пифагора","subtitle":"Треугольники","title":"Теорема Пифагора","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> На предыдущем шаге научились узнавать катеты и гипотенузу. Теперь их длины можно связать одной формулой.</p><section class=\"theory-topic\"><h3>Прямая теорема</h3><div class=\"rule-card\"><span class=\"concept-label\">Теорема</span><p>В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов: c² = a² + b².</p><p>Поэтому c = √(a² + b²), а a = √(c² − b²).</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Катеты 3 и 4 дают c² = 9 + 16 = 25, значит c = 5.</p><p>При c = 13 и b = 5 получаем a = 12.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Обратная теорема и доказательство</h3><div class=\"rule-card\"><span class=\"concept-label\">Теорема</span><p>Если квадрат наибольшей стороны треугольника равен сумме квадратов двух других, треугольник прямоугольный.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Построим прямоугольный треугольник с катетами a и b.</p><p>Его гипотенуза по теореме Пифагора имеет длину c.</p><p>Построенный и исходный треугольники равны по трём сторонам.</p><p>Поэтому угол напротив c в исходном треугольнике равен 90°.</p><p>Для 7, 24, 25 проверка даёт 49 + 576 = 625.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section>","anchor":"Теорема Пифагора даёт длину. Обратная теорема позволяет доказать, что угол прямой.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"Катеты равны 8 см и 15 см. Найди гипотенузу.","before":"Катеты 3 и 4 дают гипотенузу 5.","answer":17,"see":"Выдели на рисунке известные данные.","similar":"Катеты 3 и 4 дают гипотенузу 5.","algorithm":"Сложи квадраты 8 и 15.","retry":"Сложи квадраты 8 и 15.","steps":["Сложи квадраты 8 и 15.","√289 = 17 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"см"},{"kind":"number","q":"Гипотенуза равна 25 см, один катет 15 см. Найди другой катет.","before":"При гипотенузе 13 и катете 5 другой катет равен √144 = 12.","answer":20,"see":"Выдели на рисунке известные данные.","similar":"При гипотенузе 13 и катете 5 другой катет равен √144 = 12.","algorithm":"Из 25² вычти 15².","retry":"Из 25² вычти 15².","steps":["Из 25² вычти 15².","√400 = 20 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"см"},{"kind":"choice","q":"Стороны треугольника равны 9, 12 и 15 см. Прямоугольный ли он?","before":"Для сторон 7, 24, 25 верно 7² + 24² = 25².","answer":"Да","see":"Сопоставь рисунок и условие.","similar":"Для сторон 7, 24, 25 верно 7² + 24² = 25².","algorithm":"Сравни 9² + 12² с 15².","retry":"Сравни 9² + 12² с 15².","steps":["Сравни 9² + 12² с 15².","81 + 144 = 225 = 15², треугольник прямоугольный."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["Да","Нет"],"unit":""}]},{"name":"Тригонометрия острого угла","subtitle":"Треугольники","title":"Тригонометрия острого угла","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Зная длины из теоремы Пифагора, можно найти отношения сторон. У подобных прямоугольных треугольников с одинаковым острым углом эти отношения одинаковы.</p><section class=\"theory-topic\"><h3>Отношения сторон</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Синус острого угла</strong> – отношение противолежащего катета к гипотенузе.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Косинус острого угла</strong> – отношение прилежащего катета к гипотенузе.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Тангенс острого угла</strong> – отношение противолежащего катета к прилежащему.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Котангенс острого угла</strong> – отношение прилежащего катета к противолежащему.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Для угла A катет a лежит напротив него, катет b прилегает к нему.</p><p>При a = 3, b = 4, c = 5 получаем sin A = 3/5, cos A = 4/5, tg A = 3/4, ctg A = 4/3.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Тождество и таблица</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p><strong>Основное тригонометрическое тождество</strong>: sin² α + cos² α = 1.</p><p>Оно получается, если разделить a² + b² = c² на c².</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Отношения для 30°, 45° и 60° удобно читать из таблицы.</p><p>В треугольнике с углами 45°, 45°, 90° катеты равны, поэтому tg 45° = ctg 45° = 1.</p><div class=\"theory-cell\"><table style=\"margin:auto;width:100%;text-align:center;border-spacing:4px 9px\"><thead><tr><th>Угол</th><th>sin</th><th>cos</th><th>tg</th><th>ctg</th></tr></thead><tbody><tr><th scope=\"row\">30°</th><td><span class=\"math-fraction\"><span>1</span><span>2</span></span></td><td><span class=\"math-fraction\"><span>√3</span><span>2</span></span></td><td><span class=\"math-fraction\"><span>√3</span><span>3</span></span></td><td>√3</td></tr><tr><th scope=\"row\">45°</th><td><span class=\"math-fraction\"><span>√2</span><span>2</span></span></td><td><span class=\"math-fraction\"><span>√2</span><span>2</span></span></td><td>1</td><td>1</td></tr><tr><th scope=\"row\">60°</th><td><span class=\"math-fraction\"><span>√3</span><span>2</span></span></td><td><span class=\"math-fraction\"><span>1</span><span>2</span></span></td><td>√3</td><td><span class=\"math-fraction\"><span>√3</span><span>3</span></span></td></tr></tbody></table></div></li></ol></div></section>","anchor":"Сначала выбери угол, затем найди противолежащий и прилежащий к нему катеты.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"choice","q":"Для угла A даны a = 5, b = 12 и c = 13. Найди sin A и cos A в указанном порядке.","before":"Если a = 3, b = 4, c = 5, то sin A = 3/5, cos A = 4/5.","answer":"5/13 и 12/13","see":"Сопоставь рисунок и условие.","similar":"Если a = 3, b = 4, c = 5, то sin A = 3/5, cos A = 4/5.","algorithm":"Раздели каждый катет на гипотенузу.","retry":"Раздели каждый катет на гипотенузу.","steps":["Раздели каждый катет на гипотенузу.","sin A = 5/13, cos A = 12/13."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["5/13 и 12/13","12/13 и 5/13","5/12 и 12/5"],"unit":""},{"kind":"choice","q":"Для угла A даны a = 8, b = 15, c = 17. Найди tg A и ctg A по порядку.","before":"Если a = 3, b = 4, то tg A = 3/4, ctg A = 4/3.","answer":"8/15 и 15/8","see":"Сопоставь рисунок и условие.","similar":"Если a = 3, b = 4, то tg A = 3/4, ctg A = 4/3.","algorithm":"Для тангенса раздели противолежащий катет на прилежащий, для котангенса наоборот.","retry":"Для тангенса раздели противолежащий катет на прилежащий, для котангенса наоборот.","steps":["Для тангенса раздели противолежащий катет на прилежащий, для котангенса наоборот.","tg A = 8/15, ctg A = 15/8."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["8/17 и 15/17","15/8 и 8/15","8/15 и 15/8"],"unit":""},{"kind":"number","q":"Гипотенуза AB равна 14 см. Угол A равен 30°. Найди BC.","before":"При гипотенузе 10 см и угле A = 30° катет напротив A равен 10 · 1/2 = 5 см.","answer":7,"see":"Выдели на рисунке известные данные.","similar":"При гипотенузе 10 см и угле A = 30° катет напротив A равен 10 · 1/2 = 5 см.","algorithm":"Используй sin 30° = 1/2.","retry":"Используй sin 30° = 1/2.","steps":["Используй sin 30° = 1/2.","BC = 14 · 1/2 = 7 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Прямоугольный треугольник ABC, угол C прямой\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M57 119V27L250 119Z M57 106H70V119\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"37.31\" y=\"26.76\" font-weight=\"650\">A</text><text x=\"38\" y=\"136\" font-weight=\"650\">C</text><text x=\"250.07\" y=\"138.36\" font-weight=\"650\">B</text><text x=\"136.53\" y=\"58.3\">c</text><text x=\"31\" y=\"79\">b</text><text x=\"150\" y=\"141\">a</text><circle cx=\"57\" cy=\"27\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"57\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"250\" cy=\"119\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"см"}]},{"name":"Углы от 0° до 180°","subtitle":"Треугольники","title":"Углы от 0° до 180°","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Переносим синус и косинус на единичную полуокружность. Для острого угла координаты получаются по тем же отношениям, потому что гипотенуза равна 1.</p><section class=\"theory-topic\"><h3>Единичная полуокружность</h3><div class=\"rule-card\"><span class=\"concept-label\">Как построить</span><p>Из начала координат проведи луч под углом α к положительной полуоси x.</p><p>Отсчитывай угол против часовой стрелки.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Косинус угла α</strong> – абсцисса точки пересечения луча с единичной полуокружностью.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Синус угла α</strong> – ордината этой точки.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Тангенс</span><p>tg α = sin α : cos α, если cos α ≠ 0.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Котангенс</span><p>ctg α = cos α : sin α, если sin α ≠ 0.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Точка справа соответствует острому углу, слева — тупому.</p><p>У обеих точек на рисунке одинаковая высота, значит синусы равны, а косинусы противоположны по знаку.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Верхняя единичная полуокружность, точки для острого и тупого углов\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M40 121H280M160 140V13M62 121A98 98 0 0 1 258 121\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M160 121L104 40.5761V121M160 121L216 40.5761V121\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"278\" y=\"113\">x</text><text x=\"166\" y=\"14\">y</text><text x=\"140.94\" y=\"139.39\" font-weight=\"650\">O</text><text x=\"87.67\" y=\"30.11\" font-weight=\"650\">Q</text><text x=\"224.36\" y=\"40.34\" font-weight=\"650\">P</text><text x=\"54\" y=\"139\">−1</text><text x=\"255\" y=\"139\">1</text><circle cx=\"160\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"62\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"258\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Нахождение синуса и косинуса</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>На отрезке от 0° до 180° синус неотрицателен.</p><p>Косинус положителен для углов меньше 90°, равен нулю при 90° и отрицателен для углов больше 90°.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>При cos α = −3/5 получаем sin² α = 16/25, поэтому sin α = 4/5.</p><p>При sin α = 4/5 косинус может быть 3/5 или −3/5.</p><p>Уточнение о виде угла определяет знак.</p><div class=\"theory-cell\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Верхняя единичная полуокружность, точки для острого и тупого углов\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M40 121H280M160 140V13M62 121A98 98 0 0 1 258 121\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M160 121L104 40.5761V121M160 121L216 40.5761V121\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"278\" y=\"113\">x</text><text x=\"166\" y=\"14\">y</text><text x=\"140.94\" y=\"139.39\" font-weight=\"650\">O</text><text x=\"87.67\" y=\"30.11\" font-weight=\"650\">Q</text><text x=\"224.36\" y=\"40.34\" font-weight=\"650\">P</text><text x=\"54\" y=\"139\">−1</text><text x=\"255\" y=\"139\">1</text><circle cx=\"160\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"62\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"258\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></div></li></ol></div></section><section class=\"theory-topic\"><h3>Формулы приведения</h3><div class=\"rule-card\"><span class=\"concept-label\">Правило</span><p>sin(180° − α) = sin α, cos(180° − α) = −cos α, tg(180° − α) = −tg α, ctg(180° − α) = −ctg α, когда соответствующие значения существуют.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>120° = 180° − 60°, поэтому sin 120° = sin 60°, а cos 120° = −cos 60°.</p><p>В таблице прочерк означает, что значение не определено.</p><div class=\"theory-cell\"><table style=\"margin:auto;width:100%;text-align:center;border-spacing:4px 9px\"><thead><tr><th>Угол</th><th>sin</th><th>cos</th><th>tg</th><th>ctg</th></tr></thead><tbody><tr><th scope=\"row\">0°</th><td>0</td><td>1</td><td>0</td><td>—</td></tr><tr><th scope=\"row\">30°</th>< -size=\"15\"><path d=\"M40 121H280M160 140V13M62 121A98 98 0 0 1 258 121\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><path d=\"M160 121L104 40.5761V121M160 121L216 40.5761V121\" fill=\"none\" stroke=\"#a94c20\" stroke-width=\"2.5\"/><text x=\"278\" y=\"113\">x</text><text x=\"166\" y=\"14\">y</text><text x=\"140.94\" y=\"139.39\" font-weight=\"650\">O</text><text x=\"87.67\" y=\"30.11\" font-weight=\"650\">Q</text><text x=\"224.36\" y=\"40.34\" font-weight=\"650\">P</text><text x=\"54\" y=\"139\">−1</text><text x=\"255\" y=\"139\">1</text><circle cx=\"160\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216\" cy=\"40.5761\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"62\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"258\" cy=\"121\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"104.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"216.000\" cy=\"121.000\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","options":["1/2","−1/2","−√3/2"],"unit":""}]},{"name":"Теоремы синусов и косинусов","subtitle":"Треугольники","title":"Теоремы синусов и косинусов","intro":"<p class=\"lesson-bridge\"><strong>Связь с предыдущей темой.</strong> Теперь синус и косинус известны и для тупых углов. Используем их в произвольном треугольнике. Стороны a, b, c лежат напротив углов A, B, C соответственно.</p><section class=\"theory-topic\"><h3>Теорема синусов</h3><div class=\"rule-card\"><span class=\"concept-label\">Теорема</span><p>В любом треугольнике отношения сторон к синусам противолежащих углов равны.</p><p>Каждое равно диаметру 2R описанной окружности.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если a = 6, A = 30°, B = 90°, то b = a · sin B : sin A = 6 · 1 : (1/2) = 12.</p><p>Также a = 2R · sin A, b = 2R · sin B, c = 2R · sin C.</p><div class=\"theory-cell\"><p class=\"theory-cell\"><span class=\"math-fraction\"><span>a</span><span>sin A</span></span> = <span class=\"math-fraction\"><span>b</span><span>sin B</span></span> = <span class=\"math-fraction\"><span>c</span><span>sin C</span></span> = 2R</p></div></li></ol></div></section><section class=\"theory-topic\"><h3>Теорема косинусов</h3><div class=\"rule-card\"><span class=\"concept-label\">Теорема</span><p>Квадрат стороны равен сумме квадратов двух других сторон минус удвоенное произведение этих сторон на косинус угла между ними.</p><p>Например, c² = a² + b² − 2ab cos C.</p><p>Аналогично a² = b² + c² − 2bc cos A и b² = a² + c² − 2ac cos B.</p></div><div class=\"definition-parts\"><ol><li><h4>Разобранный пример</h4><p>Если a = 3, b = 5, c = 7, то cos C = (9 + 25 − 49) : 30 = −1/2.</p><p>Значит, C = 120°.</p><p>При C = 90° формула превращается в теорему Пифагора, поскольку cos 90° = 0.</p><div class=\"theory-cell\"><p class=\"theory-cell\">cos C = <span class=\"math-fraction\"><span>a² + b² − c²</span><span>2ab</span></span></p></div></li></ol></div></section>","anchor":"Теорема синусов связывает сторону с противолежащим углом. Теорема косинусов связывает три стороны и угол между двумя из них.","anchorNote":"Вспомни правило перед следующим заданием.","tasks":[{"kind":"number","q":"Сторона a = 8 см, угол A = 30°, угол B = 90°. Найди сторону b.","before":"Если a = 6 см и A = 30°, B = 90°, из теоремы синусов b = 12 см.","answer":16,"see":"Выдели на рисунке известные данные.","similar":"Если a = 6 см и A = 30°, B = 90°, из теоремы синусов b = 12 см.","algorithm":"Составь равенство отношений a к sin A и b к sin B.","retry":"Составь равенство отношений a к sin A и b к sin B.","steps":["Составь равенство отношений a к sin A и b к sin B.","b = 8 · 1 : (1/2) = 16 см."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560px;display:block;margin:auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui\" font-size=\"15\"><path d=\"M46 118L117 29L266 118Z\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.5\"/><text x=\"34.43\" y=\"137.36\" font-weight=\"650\">A</text><text x=\"114.26\" y=\"19.79\" font-weight=\"650\">B</text><text x=\"266.24\" y=\"137.52\" font-weight=\"650\">C</text><circle cx=\"46\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"117\" cy=\"29\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"266\" cy=\"118\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>","unit":"см"},{"kind":"choice","q":"В треугольнике a = 6, b = 10, c = 14. Найди cos C.","before":"Если a = 3, b = 5, c = 7, то cos C = (9 + 25 − 49) : 30 = −1/2.","answer":"−1/2","see":"Сопоставь рисунок и условие.","similar":"Если a = 3, b = 5, c = 7, то cos C = (9 + 25 − 49) : 30 = −1/2.","algorithm":"Вычти c² из суммы a² и b², затем раздели на 2ab.","retry":"Вычти c² из суммы a² и b², затем раздели на 2ab.","steps":["Вычти c² из суммы a² и b², затем раздели на 2ab.","cos C = (36 + 100 − 196) : 120 = −1/2."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 155\" role=\"img\" aria-label=\"Треугольник ABC\" style=\"width:100%;max-width:560p уммы углов на число вершин получаем угол правильного n-угольника.</p><p>Внешний угол, смежный с внутренним, в правильном n-угольнике равен 360° : n.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Сумма внутренних углов равна 180° · (n − 2). Вписанный правильный n-угольник делит окружность на n равных дуг, поэтому центральный угол между соседними вершинами равен 360° : n.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><line x1=\"160.0\" y1=\"22.0\" x2=\"212.828\" y2=\"113.5\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><line x1=\"160.0\" y1=\"22.0\" x2=\"160.0\" y2=\"144.0\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><line x1=\"160.0\" y1=\"22.0\" x2=\"107.172\" y2=\"113.5\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><polygon points=\"160.0,22.0 212.828,52.5 212.828,113.5 160.0,144.0 107.172,113.5 107.172,52.5\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"168.36\" y=\"21.43\" font-weight=\"650\">A</text><text x=\"220.828\" y=\"57.5\" font-weight=\"650\">B</text><text x=\"220.828\" y=\"118.5\" font-weight=\"650\">C</text><text x=\"171.82\" y=\"152.68\" font-weight=\"650\">D</text><text x=\"105.27\" y=\"133.38\" font-weight=\"650\">E</text><text x=\"105.27\" y=\"42.95\" font-weight=\"650\">F</text><circle cx=\"160.0\" cy=\"22.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"212.828\" cy=\"52.5\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"212.828\" cy=\"113.5\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"160.0\" у общую точку.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Диаметр равен двум радиусам.</p><p>Перпендикуляр из центра к хорде делит её пополам.</p><p>Касательная перпендикулярна радиусу в точке касания.</p><p>Две касательные из одной внешней точки дают равные отрезки до точек касания.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Если R = 7, то d = 14. Если прямая касается окружности в T, то OT перпендикулярен этой прямой.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"#f1dcaf\" stroke=\"#16231a\" stroke-width=\"2.3\"/><line x1=\"108.886\" y1=\"48.496\" x2=\"201.114\" y2=\"48.496\" stroke=\"#16231a\" stroke-width=\"2.4\"/><line x1=\"155\" y1=\"82\" x2=\"155\" y2=\"48.496\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><path d=\"M165 48.496v10h-10\" fill=\"none\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"95.05\" y=\"41.19\" font-weight=\"650\">A</text><text x=\"207.114\" y=\"42.496\" font-weight=\"650\">B</text><text x=\"173.87\" y=\"64.38\" font-weight=\"650\">M</text><line x1=\"98\" y1=\"82\" x2=\"212\" y2=\"82\" stroke=\"#a84b20\" stroke-width=\"2.4\" stroke-dasharray=\"5 4\"/><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"108.886\" cy=\"48.496\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"201.114\" cy=\"48.496\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"48.496\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx= font-weight=\"650\">P</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"183.5\" cy=\"32.637\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"183.5\" cy=\"131.363\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"269\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"}]},{"name":"Углы и дуги окружности","subtitle":"Центральный и вписанный углы","title":"Углы и дуги окружности","intro":"<section class=\"theory-topic\"><h3>Центральный и вписанный углы</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Центральный угол</strong> – угол с вершиной в центре окружности.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Вписанный угол</strong> – угол с вершиной на окружности, стороны которого пересекают окружность в двух других точках.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Меньший центральный угол равен градусной мере меньшей дуги между его сторонами.</p><p>Вписанный угол равен половине градусной меры дуги, которая лежит внутри угла.</p><p>Вписанные углы, стягивающие одну и ту же дугу, равны.</p><p>Вписанный угол, опирающийся на диаметр, прямой.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Если дуга AB внутри ∠ACB равна 100°, то ∠ACB = 50°.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-ser ральный угол 100° над той же дугой.","see":"Центральный угол над той же дугой вдвое больше.","similar":"Вписанному углу 50° соответствует центральный угол 100° над той же дугой.","algorithm":"Центральный угол над той же дугой вдвое больше.","retry":"Центральный угол над той же дугой вдвое больше.","steps":["Центральный угол над той же дугой вдвое больше.","2 · 36° = 72°."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\"/><line x1=\"110.083\" y1=\"46.907\" x2=\"151.024\" y2=\"138.861\" stroke=\"#16231a\" stroke-width=\"2.4\"/><line x1=\"199.917\" y1=\"46.907\" x2=\"151.024\" y2=\"138.861\" stroke=\"#16231a\" stroke-width=\"2.4\"/><line x1=\"110.083\" y1=\"46.907\" x2=\"155\" y2=\"82\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><line x1=\"155\" y1=\"82\" x2=\"199.917\" y2=\"46.907\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><text x=\"96.25\" y=\"39.6\" font-weight=\"650\">A</text><text x=\"194.58\" y=\"34.07\" font-weight=\"650\">B</text><text x=\"156.46\" y=\"154.8\" font-weight=\"650\">C</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"110.083\" cy=\"46.907\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"199.917\" cy=\"46.907\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"151.024\" cy=\"138.861\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"},{"kind":"number","q":"AB — диаметр окружности, C — другая точка окружности. Найди угол ACB.","answer":90,"unit":"","before":"Если вписанный угол стягивает полуокружность, то он равен 180° : 2 = 90°.","see":"Диаметр делит окружность на две дуги по 180°.","similar":"Если вписанный угол стягивает полуокружность, то он равен 180° : 2 = 90°.","algorithm":"Диаметр делит окружность на две дуги по 180°.","retry":"Диаметр делит окружность на две дуги по 180°.","steps":["Диаметр делит окружность на две дуги по 180°.","Угол ACB равен 90°."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\"/><line x1=\"98.0\" y1=\"82.0\" x2=\"153.011\" y2=\"25.035\" stroke=\"#16231a\" stroke-width=\"2.4\"/><line x1=\"212.0\" y1=\"82.0\" x2=\"153.011\" y2=\"25.035\" stroke=\"#16231a\" stroke-width=\"2.4\"/><line x1=\"98.0\" y1=\"82.0\" x2=\"155\" y2=\"82\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><line x1=\"155\" y1=\"82\" x2=\"212.0\" y2=\"82.0\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><text x=\"81.89\" y=\"76.56\" font-weight=\"650\">A</text><text x=\"215\" y=\"74.69\" font-weight=\"650\">B</text><text x=\"159.011\" y=\"18.035\" font-weight=\"650\">C</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"98.0\" cy=\"82.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"212.0\" cy=\"82.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"153.011\" cy=\"25.035\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"}]},{"name":"Вписанные и описанные окружности","subtitle":"Как найти центр и применить признаки","title":"Вписанные и описанные окружности","intro":"<section class=\"theory-topic\"><h3>Как найти центр и применить признаки</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Вписанная окружность</strong> – окружность, которая касается всех сторон многоугольника.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Описанная окружность</strong> – окружность, которая проходит через все вершины многоугольника.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Центр вписанной в треугольник окружности находится в точке пересечения биссектрис.</p><p>Центр описанной окружности находится в точке пересечения серединных перпендикуляров.</p><p>У прямоугольного треугольника он лежит в середине гипотенузы.</p><p>Выпуклый четырёхугольник можно вписать в окружность тогда и только тогда, когда сумма противоположных углов равна 180°.</p><p>В выпуклый четырёхугольник можно вписать окружность тогда и только тогда, когда суммы длин противоположных сторон равны.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Вписанный четырёхугольник: ∠A + ∠C = 180°. Описанный четырёхугольник: AB + CD = BC + AD.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"160.0,18.0 225.818,132.0 94.182,132.0\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><circle cx=\"160\" cy=\"94\" r=\"38\" fill=\"#efd6a9\ le":"Полный оборот и его часть","title":"Длина окружности и дуги","intro":"<section class=\"theory-topic\"><h3>Полный оборот и его часть</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Дуга</strong> – часть окружности между двумя её точками.</p></div><div class=\"rule-card\"><span class=\"concept-label\">Пояснение</span><p>Длина дуги измеряется в единицах длины, а её градусная мера показывает, какую долю полного оборота она занимает.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Длина окружности L = 2πR = πd.</p><p>Чтобы найти длину дуги, умножь длину окружности на долю оборота.</p><p>Дуге в 90° соответствует четверть окружности, дуге в 180° — половина.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">При R = 6 длина окружности равна 12π. Длина дуги в 90° равна 12π : 4 = 3π.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\"/><path d=\"M155 82L212.0 82.0A57 57 0 0 0 155.0 25.0Z\" fill=\"#edbd77\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"218.0\" y=\"76.0\" font-weight=\"650\">A</text><text x=\"142.0\" y=\"18.0\" font-weight=\"650\">B</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"212.0\" cy=\"82.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155.0\" cy=\"25.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" cla именять</h4><p>Прямоугольник: S = ab.</p><p>Квадрат: S = a².</p><p>Параллелограмм: S = ah.</p><p>Треугольник: S = <span class=\"math-fraction\"><span>ah</span><span>2</span></span>.</p><p>Трапеция: S = <span class=\"math-fraction\"><span>(a + b)h</span><span>2</span></span>.</p><p>Ромб: S = ah или S = <span class=\"math-fraction\"><span>d₁d₂</span><span>2</span></span>.</p><p>Если известны две стороны треугольника и угол между ними, S = <span class=\"math-fraction\"><span>ab sin C</span><span>2</span></span>.</p><p>Если известны все три стороны, формула Герона даёт S = √(p(p − a)(p − b)(p − c)), где p — полупериметр.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Трапеция с основаниями 6 и 10 и высотой 5 имеет площадь 8 · 5 = 40. Высота умножается на полусумму оснований.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"47,132 101,41 219,41 273,132\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"30\" y=\"149\" font-weight=\"650\">A</text><text x=\"85\" y=\"34\" font-weight=\"650\">B</text><text x=\"225\" y=\"34\" font-weight=\"650\">C</text><text x=\"279\" y=\"149\" font-weight=\"650\">D</text><line x1=\"74.0\" y1=\"86.5\" x2=\"246.0\" y2=\"86.5\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><text x=\"54.27\" y=\"78.94\" font-weight=\"650\">M</text><text x=\"254.0\" y=\"82.5\" font-weight=\"650\">N</text><line x1=\"101\" y1=\"41\" x2=\"101\" y2=\"132\" stroke=\"#a84b20\" stroke-width=\"2.4\" stroke-dasharray=\"5 4\"/><path d=\"M111 132v-10h-10\" fill=\"none\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"100.91\" y=\"151.02\" font-weight=\"650\">H</text><circle cx=\"47\" cy=\"132\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" -label\">Определение</span><p><strong>Сектор</strong> – часть круга между двумя радиусами и дугой.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Сегмент</strong> – часть круга между хордой и дугой.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Кольцо</strong> – часть плоскости между двумя концентрическими окружностями.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Площадь круга S = πR².</p><p>Площадь сектора равна площади круга, умноженной на долю оборота.</p><p>Для малого сегмента вычти из площади сектора площадь треугольника между радиусами и хордой.</p><p>При угле 180° сегмент является полукругом.</p><p>Площадь большого сегмента равна площади круга без малого сегмента.</p><p>Из площади внешнего круга вычти площадь внутреннего, чтобы получить площадь кольца.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Если R = 4 и угол сектора равен 90°, площадь круга равна 16π, а сектора 4π. Треугольник между радиусами имеет площадь 8, малый сегмент имеет площадь 4π − 8.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\"/><path d=\"M155 82L212.0 82.0A57 57 0 0 0 155.0 25.0Z\" fill=\"#edbd77\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"218.0\" y=\"76.0\" font-weight=\"650\">A</text><text x=\"142.0\" y=\"18.0\" font-weight=\"650\">B</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"212.0\" cy=\"82.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155.0\" cy=\"25.0\
