</text><circle cx=\"212.0\" cy=\"82.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155.0\" cy=\"25.0\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"},{"kind":"number","q":"Радиусы окружностей, ограничивающих кольцо, равны 7 и 3. Найди коэффициент перед π в площади кольца.","answer":40,"unit":"","before":"При радиусах 5 и 2 площадь кольца равна (25 − 4)π = 21π.","see":"Вычти квадрат меньшего радиуса из квадрата большего.","similar":"При радиусах 5 и 2 площадь кольца равна (25 − 4)π = 21π.","algorithm":"Вычти квадрат меньшего радиуса из квадрата большего.","retry":"Вычти квадрат меньшего радиуса из квадрата большего.","steps":["Вычти квадрат меньшего радиуса из квадрата большего.","S = (49 − 9)π = 40π. Коэффициент равен 40."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><circle cx=\"155\" cy=\"82\" r=\"57\" fill=\"#f1dcaf\" stroke=\"#16231a\" stroke-width=\"2.3\"/><circle cx=\"155\" cy=\"82\" r=\"30\" fill=\"#eee0c8\" stroke=\"#16231a\" stroke-width=\"2.3\"/><line x1=\"155\" y1=\"82\" x2=\"212\" y2=\"82\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><text x=\"187.74\" y=\"72.14\">r</text><text x=\"217\" y=\"76\" font-weight=\"650\">R</text><text x=\"140.67\" y=\"99.81\" font-weight=\"650\">O</text><circle cx=\"185\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"212\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"155\" cy=\"82\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"}]},{"name":"Площади подобных фигур","subtitle":"Как масштаб влияет на площадь","title":"Площади подобных фигур","intro":"<section class=\"theory-topic\"><h3>Как масштаб влияет на площадь</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Коэффициент подобия k</strong> – отношение длины в новой фигуре к соответствующей длине в исходной фигуре.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>При увеличении длин в k раз периметр умножается на k, а площадь на k².</p><p>У подобных треугольников в одинаковое число раз меняются и основание, и высота.</p><p>Поэтому их произведение меняется в квадрат этого числа раз.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">Если k = 3, то P₂ = 3P₁, S₂ = 9S₁.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"35,126 68,87 100,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><polygon points=\"140,126 206,48 270,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><circle cx=\"35\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"68\" cy=\"87\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"100\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"140\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"206\" cy=\"48\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></li></ol></div></section>","anchor":"Коэффициент подобия k – отношение длины в новой фигуре к соответствующей длине в исходной фигуре.","anchorNote":"Если k = 3, то P₂ = 3P₁, S₂ = 9S₁.","tasks":[{"kind":"number","q":"Площадь исходного треугольника равна 12. Стороны подобного треугольника в 3 раза больше. Найди его площадь.","answer":108,"unit":"","before":"При исходной площади 5 и увеличении сторон в 2 раза новая площадь равна 5 · 4 = 20.","see":"Умножь площадь на квадрат коэффициента подобия.","similar":"При исходной площади 5 и увеличении сторон в 2 раза новая площадь равна 5 · 4 = 20.","algorithm":"Умножь площадь на квадрат коэффициента подобия.","retry":"Умножь площадь на квадрат коэффициента подобия.","steps":["Умножь площадь на квадрат коэффициента подобия.","S₂ = 12 · 3² = 108."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"35,126 68,87 100,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><polygon points=\"140,126 206,48 270,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><circle cx=\"35\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"68\" cy=\"87\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"100\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"140\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"206\" cy=\"48\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"},{"kind":"number","q":"Площади двух подобных фигур равны 25 и 100. Во сколько раз длиннее сторона большей фигуры?","answer":2,"unit":"","before":"При площадях 9 и 81 отношение площадей равно 9, поэтому длины отличаются в 3 раза.","see":"Извлеки квадратный корень из отношения площадей.","similar":"При площадях 9 и 81 отношение площадей равно 9, поэтому длины отличаются в 3 раза.","algorithm":"Извлеки квадратный корень из отношения площадей.","retry":"Извлеки квадратный корень из отношения площадей.","steps":["Извлеки квадратный корень из отношения площадей.","100 : 25 = 4. Квадратный корень из 4 равен 2."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"35,126 68,87 100,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><polygon points=\"140,126 206,48 270,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><circle cx=\"35\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"68\" cy=\"87\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"100\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"140\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"206\" cy=\"48\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"},{"kind":"number","q":"Площадь исходной фигуры равна 80, а длины подобной фигуры составляют половину исходных длин. Найди новую площадь.","answer":20,"unit":"","before":"При уменьшении сторон в 3 раза исходная площадь 45 уменьшается в 9 раз до 5.","see":"Половина длины означает четверть площади.","similar":"При уменьшении сторон в 3 раза исходная площадь 45 уменьшается в 9 раз до 5.","algorithm":"Половина длины означает четверть площади.","retry":"Половина длины означает четверть площади.","steps":["Половина длины означает четверть площади.","S₂ = 80 : 4 = 20."],"visual":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><polygon points=\"35,126 68,87 100,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><polygon points=\"140,126 206,48 270,126\" fill=\"#efd6a9\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><circle cx=\"35\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"68\" cy=\"87\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"100\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"140\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"206\" cy=\"48\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"270\" cy=\"126\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"}]},{"name":"Векторы","subtitle":"Длина, направление и действия","title":"Векторы","intro":"<section class=\"theory-topic\"><h3>Длина, направление и действия</h3><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Вектор</strong> – направленный отрезок.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Модуль вектора</strong> – длина вектора.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Нулевой вектор</strong> – вектор, у которого начало и конец совпадают. Его длина равна нулю.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Равные ненулевые векторы</strong> – сонаправленные векторы одинаковой длины.</p></div><div class=\"concept-card\"><span class=\"concept-label\">Определение</span><p><strong>Коллинеарные ненулевые векторы</strong> – векторы, лежащие на одной или параллельных прямых.</p></div><div class=\"definition-parts\"><ol><li><h4>Как применять</h4><p>Для сложения перенеси начало второго вектора в конец первого.</p><p>Сумма направлена из начала первого в конец второго.</p><p>Разность a − b равна сумме a и противоположного вектора −b.</p><p>При умножении на число λ длина умножается на модуль λ.</p><p>При отрицательном λ направление меняется на противоположное.</p></li><li><h4>Разобранный пример</h4><div class=\"theory-cell\">AB + BC = AC по правилу треугольника. При общем начале O сумма строится по правилу параллелограмма.</div><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 165\" role=\"img\" aria-label=\"Схема к теме\" style=\"display:block;width:100%;max-width:560px;margin:0 auto;background:#eee0c8;border-radius:12px\"><g fill=\"#16231a\" font-family=\"system-ui,sans-serif\" font-size=\"14\"><line x1=\"62\" y1=\"123\" x2=\"116\" y2=\"46\" stroke=\"#16231a\" stroke-width=\"2.4\"/><path d=\"M114.55 54.88L116 46L108.14 50.39\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><line x1=\"116\" y1=\"46\" x2=\"255\" y2=\"101\" stroke=\"#16231a\" stroke-width=\"2.4\"/><path d=\"M246.02 101.66L255 101L248.9 94.38\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><line x1=\"62\" y1=\"123\" x2=\"255\" y2=\"101\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><path d=\"M247.39 105.81L255 101L246.5 98.03\" fill=\"none\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"52.99\" y=\"110.51\" font-weight=\"650\">A</text><text x=\"122\" y=\"40\" font-weight=\"650\">B</text><text x=\"261\" y=\"95\" font-weight=\"650\">C</text><circle cx=\"62\" cy=\"123\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"116\" cy=\"46\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"255\" cy=\"101\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg></li></ol></div></section>","anchor":"Вектор – направленный отрезок. Его длина называется -ui,sans-serif\" font-size=\"14\"><line x1=\"140\" y1=\"112\" x2=\"226\" y2=\"112\" stroke=\"#a84b20\" stroke-width=\"2.4\"/><path d=\"M217.9 115.91L226 112L217.9 108.09\" fill=\"none\" stroke=\"#a84b20\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"232\" y=\"106\">a</text><line x1=\"140\" y1=\"112\" x2=\"79\" y2=\"51\" stroke=\"#16231a\" stroke-width=\"2.4\"/><path d=\"M87.5 53.96L79 51L81.96 59.5\" fill=\"none\" stroke=\"#16231a\" stroke-width=\"2.3\" stroke-linejoin=\"round\"/><text x=\"85\" y=\"45\">b</text><text x=\"124\" y=\"129\" font-weight=\"650\">O</text><circle cx=\"226\" cy=\"112\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"79\" cy=\"51\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/><circle cx=\"140\" cy=\"112\" r=\"4\" fill=\"#16231a\" stroke=\"#eee0c8\" stroke-width=\"1.05\" paint-order=\"stroke fill\" class=\"geometry-point\"/></g></svg>"}]}],"recap":["Точку обозначают прописной латинской буквой, прямую — строчной буквой или двумя прописными.","A ∈ a означает, что точка A лежит на прямой a. A ∉ a означает, что точка лежит вне прямой.","Через две различные точки проходит ровно одна прямая.","У отрезка два конца. Если C находится между A и B, то AB = AC + CB.","Если M лежит между A и B, то AB = AM + MB.","В записи ∠AOB вершина O. Луч внутри угла делит его на две части, меры которых складываются.","Смежные углы дают в сумме 180°, вертикальные углы равны.","При параллельных прямых секущая образует равные накрест лежащие и соответственные углы, а односторонние в сумме дают 180°.","Периметр треугольника равен сумме трёх сторон.","Сумма углов треугольника 180°. Самая длинная сторона короче суммы двух других.","Центр тяжести, центр вписанной окружности, ортоцентр и центр описанной окружности определяются разными построениями.","В равнобедренном треугольнике углы при основании равны. Равносторонний треугольник всегда остроугольный.","У равных треугольников равны стороны и углы, занимающие одинаковые места в записи.","Коэффициент подобия действует на длины, его квадрат — на площади.","Средняя линия параллельна третьей стороне и равна её половине.","В прямоугольном треугольнике острые углы дают в сумме 90°.","Теорема Пифагора даёт длину. Обратная теорема позволяет доказать, что угол прямой.","Сначала выбери угол, затем найди противолежащий и прилежащий к нему катеты.","На верхней полуокружности синус неотрицателен. У тупого угла косинус отрицателен.","Теорема синусов связывает сторону с противолежащим углом. Теорема косинусов связывает три стороны и угол между двумя из них.","У параллелограмма диагонали делятся пополам. У прямоугольника они равны, у ромба — перпендикулярны.","Средняя линия трапеции равна полусумме оснований. Сумма углов выпуклого n-угольника равна 180° · (n − 2).","Радиус перпендикулярен касательной в точке касания. Вписанный угол равен половине дуги, на которую опирается.","Длина окружности равна 2πR, площадь круга равна πR². Для дуги и сектора берём нужную долю оборота.","Площади подобных фигур относятся как квадраты соответствующих длин.","Координаты вектора получаем вычитанием координат начала из координат конца.","Скалярное произведение можно вычислить по координатам или через длины векторов и косинус угла между ними."]};
(function(){
 const d=window.TrainerData;
 const parseNumber=raw=>{let s=String(raw).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return null;let p=s.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;};

 // Compare terms in standard form, allowing reordering of terms and variables.
 function standardForm(raw) {
   const digits = '⁰¹²³⁴⁵⁶⁷⁸⁹';
   let expression = String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-')
     .replace(/[ахувс]/g, letter => ({а:'a',х:'x',у:'y',в:'b',с:'c'})[letter])
     .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, power => '^'+[...power].map(d => digits.indexOf(d)).join(''))
     .replace(/,/g,'.').replace(/([0-9a-z])[·*](?=[a-z])/g,'$1');
   if (!expression || expression.length > 200) return null;
   if (!/^[+-]/.test(expression)) expression = '+'+expression;
   const terms = expression.match(/[+-][^+-]+/g) || [];
   if (terms.join('') !== expression) return null;
   const standard = [];
   const seen = new Set();
   for (const term of terms) {
     const match = term.match(/^([+-])((?:\d+(?:\.\d+)?|\.\d+)?)([a-z].*)?$/);
     if (!match || (!match[2] && !match[3])) return null;
     const letters = match[3] || '';
     const factors = letters.match(/[a-z](?:\^[1-9]\d*)?/g) || [];
     if (factors.join('') !== letters) return null;
     const variables = factors.map(factor => factor.replace(/\^1$/,'')).sort();
     if (new Set(variables.map(variable => variable[0])).size !== variables.length) return null;
     const literal = variables.join('');
     const coefficient = Number(match[1]+(match[2] || '1'));
     if (!Number.isFinite(coefficient) || seen.has(literal) || (coefficient === 0 && (literal || terms.length > 1))) return null;
     seen.add(literal);
     standard.push(coefficient+':'+literal);
   }
   return standard.sort().join('|');
 }
 window.TrainerCourse={...d,fmt:String,parseNumber,total:d.stages.reduce((n,s)=>n+s.tasks.length,0),isCorrect:(t,r)=>{if(t.expressionInput)return standardForm(r)===standardForm(t.answer);if(t.kind==='choice')return String(t.answer)===String(r);let n=parseNumber(r);return n!==null&&Math.abs(n-t.answer)<=1e-9*Math.max(1,Math.abs(t.answer));}};

  const point = `\\(\\s*[−-]?${number}\\s*;\\s*[−-]?${number}\\s*\\)`;
  const expression = new RegExp(`(?<![A-Za-z0-9])(?:${point}|${term}(?:\\s*[=<>≤≥+−·×:/÷*-]\\s*${term})+)(?![A-Za-z0-9])`,'g');
  const colorVariables = text => esc(text).replace(/(?<![A-Za-z])(?:kx|[xykb])(?![A-Za-z])/g, token =>
    [...token].map(letter => `<span class="math-var-${letter}">${letter}</span>`).join(''));
  function plainMath(value) {
    const text = String(value);
    let result = '', end = 0;
    for (const match of text.matchAll(expression)) {
      result += colorVariables(text.slice(end,match.index));
      result += `<span class="math-nowrap">${colorVariables(match[0])}</span>`;
      end = match.index + match[0].length;
    }
    return result + colorVariables(text.slice(end));
  }
  const fractionSymbols={ '¼':[1,4],'½':[1,2],'¾':[3,4],'⅐':[1,7],'⅑':[1,9],'⅒':[1,10],
    '⅓':[1,3],'⅔':[2,3],'⅕':[1,5],'⅖':[2,5],'⅗':[3,5],'⅘':[4,5],'⅙':[1,6],'⅚':[5,6],
    '⅛':[1,8],'⅜':[3,8],'⅝':[5,8],'⅞':[7,8],'↉':[0,3] };
  const fractionAtom=String.raw`(?:\([^()\n]+\)|[−-]?(?:\d+(?:[.,]\d+)?[a-zA-Zа-яА-ЯёЁ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*|[a-zA-Zа-яА-ЯёЁ][a-zA-Zа-яА-ЯёЁ\d⁰¹²³⁴⁵⁶⁷⁸⁹⁻]*))`;
  const fractionPattern=new RegExp(`([${Object.keys(fractionSymbols).join('')}])|(${fractionAtom})\\s*[/⁄∕]\\s*(${fractionAtom})`,'g');
  function fractionMarkup(top,bottom,format){
    const unpack=text=>String(text).replace(/^\((.*)\)$/,'$1');
    const numerator=unpack(top),denominator=unpack(bottom);
    return `<span class="math-fraction" role="math" aria-label="Дробь: числитель ${esc(numerator)}, знаменатель ${esc(denominator)}"><span aria-hidden="true">${format(numerator)}</span><span aria-hidden="true">${format(denominator)}</span></span>`;
  }
  function formatFractions(value,format,formatPart=format){
    const text=String(value);
    let result='',end=0;
    for(const match of text.matchAll(fractionPattern)){
      const parts=match[1]?fractionSymbols[match[1]]:[match[2],match[3]];
      result+=format(text.slice(end,match.index))+fractionMarkup(...parts,formatPart);
      end=match.index+match[0].length;
    }
    return result+format(text.slice(end));
  }
  function mathText(value){return formatFractions(value,plainMath);}
  function mathMarkup(markup){
    return markup.split(/(<svg\b[\s\S]*?<\/svg\s*>|<!--[^]*?-->|<[^>]*>)/gi)
      .map((piece,i)=>i%2?piece:formatFractions(piece,text=>text,plainMath)).join('');
  }
  const key=()=>`${state.stage}-${state.task}`,task=()=>C.stages[state.stage].tasks[state.task],done=()=>state.solved.includes(key());
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}window.LiliStudy?.report({current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});updateStorage();}
  function updateStorage(){ $('#save-status').innerHTML=storageOK?'Прогресс сохраняется<br>в этом браузере':'Прогресс доступен<br>пока открыта страница';}
  function nav(){
    $('#stage-nav').innerHTML=C.stages.map((s,i)=>{const n=s.tasks.filter((_,j)=>state.solved.includes(`${i}-${j}`)).length;return `<button class="stage-link ${i===state.stage&&view==='lesson'?'active':''} ${n===s.tasks.length?'done':''}" data-stage="${i}" ${i===state.stage&&view==='lesson'?'aria-current="step"':''}><span class="stage-index">${n===s.tasks.length?'✓':String(i+1).padStart(2,'0')}</span><span class="stage-name">${mathText(s.name)}<small>${n} / ${s.tasks.length} · ${mathText(s.subtitle)}</small></span></button>`;}).join('');
    const n=state.solved.length,p=Math.round(n/TOTAL*100);$('#progress-caption').textContent=`${n} из ${TOTAL} заданий`;$('#progress-percent').textContent=p+'%';$('#progress-fill').style.width=p+'%';
    document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));updateStorage();
  }
  function visual(t){return t.visual?`<div class="visual-panel">${mathMarkup(t.visual)}</div>`:'';}
  function hintsHtml(t){return ['Что видим','Как решаем подобное','Алгоритм'].map((title,i)=>`<div class="hint-row"><button class="hint-trigger" data-hint="${i}" aria-expanded="${hints.has(i)}" aria-controls="hint-${i}"><span class="hint-number">${i+1}</span><span>${title}</span><span class="hint-arrow">${hints.has(i)?'−':'+'}</span></button><p class="hint-text" id="hint-${i}" ${hints.has(i)?'':'hidden'}>${mathText([t.see,t.similar,t.algorithm][i])}</p></div>`).join('');}
  function render(){nav();if(view==='lab')return renderLab();if(view==='complete')return renderComplete();renderLesson();}
  function renderLesson(){
    window.LiliStudy?.task(state.stage+'-'+state.task,{current:state.solved.length,total:TOTAL,label:'Этап '+(state.stage+1)+' · задание '+(state.task+1),done:state.solved.length===TOTAL});
    const s=C.stages[state.stage],t=task(),solved=done();
    if(solved&&!feedback)feedback={type:'good',title:'Задание уже решено.',text:'Можно посмотреть разбор или перейти дальше.'};
    $('#workspace').innerHTML=`<div class="exercise-layout"><section class="lesson-card" aria-labelledby="lesson-title"><div class="lesson-top"><span class="lesson-label">ШАГ ${String(state.stage+1).padStart(2,'0')} из ${String(C.stages.length).padStart(2,'0')}</span><span class="exercise-count">Задание ${state.task+1} из ${s.tasks.length}</span></div><div class="lesson-intro"><h2 id="lesson-title">${mathText(s.title)}</h2><div class="intro-content">${mathMarkup(s.intro)}</div><div class="question-dots" aria-label="Задания этого шага">${s.tasks.map((_,i)=>`<button class="question-dot ${i===state.task?'current':''} ${state.solved.includes(`${state.stage}-${i}`)?'solved':''}" data-task="${i}" aria-label="Задание ${i+1}${state.solved.includes(`${state.stage}-${i}`)?', решено':''}" ${i===state.task?'aria-current="true"':''}>${i+1}</button>`).join('')}</div></div>${visual(t)}<div class="answer-area"><section id="worked-example" class="worked-example" tabindex="-1" aria-labelledby="worked-title"><h3 id="worked-title">Сначала разбери пример</h3><p>${mathText(t.before || t.similar)}</p></section><div class="task-kicker">ТЕПЕРЬ ПОПРОБУЙ</div><h3 class="question" id="question-text">${mathText(t.q)}</h3>${t.kind==='choice'&&!t.expressionInput?`<div class="choices" role="group" aria-labelledby="question-text">${t.options.map((o,i)=>`<button class="choice ${state.answers[key()]===String(o)?(solved?'selected':'wrong'):''}" data-option="${i}" ${solved?'disabled':''}>${mathText(o)}${t.unit==='%'?'%':''}</button>`).join('')}</div>`:`<form class="answer-form" novalidate><div class="input-wrap"><label class="sr-only" for="answer">Твой ответ${t.unit?', '+t.unit:''}</label><input id="answer" type="text" inputmode="${t.expressionInput?'text':'decimal'}" autocomplete="off" placeholder="${t.expressionInput?'Например, 2x^2 - 3x':'Твой ответ'}" aria-describedby="feedback" value="${esc(state.answers[key()]||'')}" ${solved?'readonly':''}><span class="answer-unit">${esc(t.unit)}</span></div><button class="primary" type="submit" ${solved?'disabled':''}>Проверить</button></form>`}<div id="feedback" role="status" aria-live="polite" aria-atomic="true">${feedbackHtml()}</div><div class="next-row"><small>${solved?'Можно двигаться дальше.':'Ответ можно пробовать снова.'}</small><button class="primary" id="next-task" ${solved?'':'hidden'}>${nextLabel()} <span aria-hidden="true">→</span></button></div><details class="solution"><summary>Показать подробный разбор</summary><ol>${t.steps.map(x=>`<li>${mathText(x)}</li>`).join('')}</ol></details></div></section><aside class="right-column" aria-label="Помощь"><section class="support-card"><h3 class="identity-label"><img src="data:image/webp;base64,UklGRnQEAABXRUJQVlA4IGgEAADwFwCdASpwAHAAPj0cjUQiIaGTSm0EIAPEsoBqntdfX/buWqBe+85i9AHot2ynPM+jveKt5x+4Cwtcm6kR+o/4DhZ2sN2xgV3FX+V42GNj0JP+Dy7/QPsF/y7+o/73sUfsZ7Gf7AFMm/AtSkSv/35YrCHbO5SjW7bGWQHuBb3b+ayELs67GOAZpjDJj/BmfIGRaaOgE1tXPmoa2pjnlVBzn7WlkjjYX5M+/AJnaMe0/Q/GpUeM/qTLdRUrSAC5W64n4FvxatVqAAD+/HCf/klS5Sfz2uTmepwoJ98XjCVV3pPwh+5IzgX0U1Nw54gpp69w/wh2fobkLgv1gQe7Y6eJMjgMpuhJ7Ykgln3yqJ5PrpJWyfrcuFqxm45HVC2d5rCuvwIvd38NPKyht9V4NgxwB7M1+3RGGcrvecyp5d1vWIKV5sNyRqhlKcPJ2M/mPjwMlseW7mc1LbKnyTj7FRMIkcK9s34egm2mUKlk3r9nx8yj3bXO0ijfTF43Ey1up28TvkUgvY7iAukYD7/ypHbdpy767JyAG7a/EXy3SRgx5UleHMNqCsk8/zP6aUpPS92vfjwFauTYjevCE0zP+mK44Qq5MfMrUceKjW/572zgbv8AfxkZ2nEiExWcB9xB4aAyABOeT7qnIk0ENA3TSkakH/5LODtIojCrsKAVFdY9UZrJWpeDDEHOGbm7/j8t4y+CqFLA7FvlmkUCvUYfWZa0OBgCdcGDL6i9Lx6fK/MYPTjCdnip+eY/VtcqrcPaQEIfub3J+Afo2hE+nx46dYnJVW7rnZiIZT3ZtfKt9rMzYgDzdlmd48Sv9gr/W3zeNOuM2j4mXidH9YxG/bfvxJIJgy07w/PtjFFMdth4w06bCEiuydb0UkScIXlGjio09sA5btgzbbaavPfRxfGALDmkS0irvm6yrJoaaa+nf/SdkniAkL67teKwF5+G7zGNOMhw6aa+ZAfuGvDd+UxTVG4bbVqv0CL1ADCEP27cjK4520X6UXZ2uMzAOGc8oMj86Erks5Mom811cxWa7zhNY39WvzGvto2UPU9yPe0AJx16zflnlfI0XS6wtVWLWKFZpm5fQWTdqGU/Gn0HBMJThsRqZp9BVsYEHtmISgi3waR/pKVb0ilbcqv/ElFB34efMcQbVp5VgDHL+Z67YYmbpvgUxYr564eiaXsbLArKNNQ2zSHKNgvhv+IegZxSrmVf5V//eu6HAPJ3c2Kwn33ds+VMw/O7smKcBEVe3MB1R9AwzRGjEJ+kAXbxMhbipgM7l+/hvaxaGesDz8WBsdXC/KptJlbDWbf92lkYx78ARp180wAwqACGxj/ieCMQaIdwjPiDi8r/sELXpf12L6fss6VvyNGTCA+NMoHBs30n/m7BraHeg6S5yEfUbne+UzOQrUGX1HRazd4gnomZ+SdyTzyv3ZPnR8DhYjLT5U7Zn6/5eyVii1IZiIn+ZD6Q+AOqgghzxlzyLKrUiHDNe8KggXKRGRt4AAAAAAA=" class="identity-mark identity-hint" width="32" height="32" alt="">Если нужен ориентир</h3><p class="support-caption">Открывай по одному шагу.</p><div id="hint-list">${hintsHtml(t)}</div></section><section class="support-card anchor-card"><p>${mathText(s.anchor)}</p><small>${mathText(s.anchorNote)}</small></section></aside></div>`;
    document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>goTask(Number(b.dataset.task))));
    document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>check(String(t.options[Number(b.dataset.option)]))));
    const form=$('.answer-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();check($('#answer').value);});
    $('#next-task').addEventListener('click',next);bindHints();
  }
  function feedbackHtml(){return feedback?`<div class="feedback ${feedback.type}"><strong>${esc(feedback.title)}</strong>${mathText(feedback.text)}</div>`:'';}
  function bindHints(){document.querySelectorAll('[data-hint]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.hint);hints.has(i)?hints.delete(i):hints.add(i);$('#hint-list').innerHTML=hintsHtml(task());bindHints();}));}
  function nextLabel(){if(state.solved.length===TOTAL)return 'К итогу';if(state.task===C.stages[state.stage].tasks.length-1)return state.stage===C.stages.length-1?'К оставшимся заданиям':'Следующий шаг';return 'Дальше';}
  function check(raw){
    const t=task();if(done())return;
    if(t.kind==='number'&&C.parseNumber(raw)===null){feedback={type:'neutral',title:raw.trim()?'Нужно только число.':'Введи свой ответ.',text:'Введи число. Для десятичной дроби можно использовать запятую или точку.'};$('#feedback').innerHTML=feedbackHtml();$('#answer').setAttribute('aria-invalid','true');return;}
    state.answers[key()]=raw;state.attempts[key()]=(Number(state.attempts[key()])||0)+1;
    if(C.isCorrect(t,raw)){
 state.solved.push(key());feedback={type:'good',title:'Верно.',text:t.steps[t.steps.length-1]};
 }else{feedback={type:'retry',title:'Пока не совпало. Давай ещё раз.',text:t.expressionInput?(t.retry+' Введи ответ в стандартном виде. Степень можно записать как x^2.'):t.retry||t.similar};hints.add(0);}
    save();render();if(!done()&&$('#answer')){$('#answer').focus();$('#answer').select();$('#answer').setAttribute('aria-invalid','true');}else if(done())$('#next-task').focus({preventScroll:true});
  }
  function scrollToLesson(){const el=$('#workspace');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});}
  function goStage(i, showExample=false){view='lesson';state.stage=i;const j=C.stages[i].tasks.findIndex((_,n)=>!state.solved.includes(`${i}-${n}`));state.task=j<0?0:j;feedback=null;hints.clear();save();render();if(showExample) focusExample();else scrollToLesson();}
  function goTask(i){
    state.task=i;feedback=null;hints.clear();save();render();focusExample();
  }
  function focusExample(){
    const example=$('#worked-example');
    example.focus({preventScroll:true});
    if(example.getBoundingClientRect().top < 16 || example.getBoundingClientRect().bottom > window.innerHeight){
      example.scrollIntoView({block:'start'});
    }
  }
  function next(){
    if(!done())return;
    if(state.solved.length===TOTAL){view='complete';feedback=null;render();scrollToLesson();return;}
    if(state.task<C.stages[state.stage].tasks.length-1){goTask(state.task+1);return;}
    if(state.stage<C.stages.length-1){goStage(state.stage+1,true);return;}
    for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i,true);return;}
  }
  function renderLab(){
 const lab=C.lab,c=lab.cases[labIndex];
 $('#workspace').innerHTML=`<section class="lesson-card lab-card"><div class="lesson-label">ЛАБОРАТОРИЯ</div><h2>${mathText(lab.title)}</h2><p class="lab-note">${mathText(lab.intro)}</p><div class="segmented">${lab.cases.map((x,i)=>`<button data-case="${i}" aria-pressed="${i===labIndex}">${mathText(x.label)}</button>`).join('')}</div><div class="visual-panel" aria-live="polite">${mathMarkup(c.html)}</div><button class="secondary" id="back-to-route">← Вернуться к заданию</button></section>`;
 document.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>{labIndex=Number(b.dataset.case);renderLab();}));$('#back-to-route').addEventListener('click',()=>{view='lesson';render();});
 }
  function renderComplete(){
    const unresolved=TOTAL-state.solved.length;
    $('#workspace').innerHTML=`<section class="lesson-card completion-card"><div class="completion-icon" aria-hidden="true">✧</div><div class="eyebrow">${unresolved?'МАРШРУТ ПРОДОЛЖАЕТСЯ':'МАРШРУТ ПРОЙДЕН'}</div><h2>${unresolved?'Уже многое получилось.':'Маршрут пройден!'}</h2><p>${unresolved?`Решено ${state.solved.length} из ${TOTAL} заданий. Осталось ${unresolved}.`:`Решено ${TOTAL} из ${TOTAL} заданий.`}</p><div class="review-list">${C.recap.map(x=>`<p>${mathText(x)}</p>`).join('')}</div><div class="end-actions"><button class="primary" id="review-stories">${unresolved?'Продолжить маршрут':'Посмотреть задачи'}</button>${C.lab?'<button class="secondary" id="finish-lab">В лабораторию</button>':''}<button class="secondary" id="finish-reset">Пройти заново</button></div></section>`;
    $('#review-stories').addEventListener('click',()=>{if(unresolved){for(let i=0;i<C.stages.length;i++)if(C.stages[i].tasks.some((_,j)=>!state.solved.includes(`${i}-${j}`))){goStage(i);return;}}goStage(C.stages.length-1);});$('#finish-lab')?.addEventListener('click',openLab);$('#finish-reset').addEventListener('click',askReset);
  }
  function openLab(){if(!C.lab)return;view='lab';render();scrollToLesson();}
  function askReset(){$('#reset-dialog').showModal();}
  $('#open-lab').addEventListener('click',openLab);$('#reset-progress').addEventListener('click',askReset);$('#cancel-reset').addEventListener('click',()=>$('#reset-dialog').close());$('#confirm-reset').addEventListener('click',()=>{state=blank();feedback=null;hints.clear();view='lesson';save();$('#reset-dialog').close();render();});$('.brand').addEventListener('click',e=>{e.preventDefault();goStage(0);});
  $('#open-lab').hidden=!C.lab;
  render();
})();
</script>
